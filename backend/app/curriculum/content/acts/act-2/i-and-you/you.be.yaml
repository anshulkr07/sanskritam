    - sa: छात्रः
      gloss:
        en: student
        hi: छात्र
      check:
        type: subanta
        stem: छात्र
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
    - sa: अस्मि
      gloss:
        en: am
        hi: हूँ
      check:
        type: tinanta
        dhatu: अस्
        lakara: Lat
        purusha: Uttama
        vacana: Eka
  - sa: त्वम् छात्रः असि।

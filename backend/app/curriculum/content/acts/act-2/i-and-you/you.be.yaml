- id: s1
  kind: story
  title:
    en: Who is aboard
    hi: नाव पर कौन है
  depth: core
  image:
    brief: 'The boat on the open river with five aboard: you, Dādī, Śuka, the boatman at the pole, the white-bearded old man,
      and the silvery spirit sitting on the gunwale, all turned toward one another as if introducing themselves; soft morning
      light on the water.'
    alt:
      en: Passengers introducing themselves aboard a river boat
      hi: नदी की नाव में अपना परिचय देते सवार
    cast:
    - you
    - dadi
    - shuka
    - navika
    - pratibimbaka
    place: nauka
    ratio: '4:3'
    id: you-be-s1
  narration:
    en: 'The boat settles into the current. One by one, everybody says who they are, using the little verb that means “am,
      are, is”. The old man: “I am a teacher.” The boatman: “I am a boatman.” You: your turn. The spirit''s voice breaks:
      “I… am?”'
    hi: 'नाव धारा में स्थिर हो जाती है। एक-एक करके सब बताते हैं कि वे कौन हैं, ‘हूँ, हो, है’ वाली छोटी क्रिया के साथ। बुज़ुर्ग:
      “मैं शिक्षक हूँ।” नाविक: “मैं नाविक हूँ।” अब आपकी बारी। भूत की आवाज़ टूटती है: “मैं… हूँ?”'
- id: t1
  kind: teach
  title:
    en: Am, are, is
    hi: हूँ, हो, है
  depth: core
  skills:
  - verb.as
  body:
    en: 'The verb {{अस्}}, “to be”, has the three singular forms {{अस्मि}} (I am), {{असि}} (you are), {{अस्ति}} (he, she,
      it is). With {{अहम्}} and {{त्वम्}} it is used freely: {{अहं छात्रः अस्मि}}.'
    hi: 'क्रिया {{अस्}}, ‘होना’, के तीन एकवचन रूप हैं: {{अस्मि}} (मैं हूँ), {{असि}} (तुम हो), {{अस्ति}} (वह है)। {{अहम्}}
      और {{त्वम्}} के साथ इसका खुलकर प्रयोग होता है: {{अहं छात्रः अस्मि}}।'
  examples:

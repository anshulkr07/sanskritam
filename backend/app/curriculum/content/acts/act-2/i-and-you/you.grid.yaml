  mode: choice
  prompt:
    en: Which form is “you two read”?
    hi: ‘तुम दोनों पढ़ते हो’ का रूप कौन-सा है?
  explain:
    en: 'Second person, two: {{पठथः}}.'
    hi: 'मध्यम पुरुष, दो: {{पठथः}}।'
  roman: after
  options:
  - sa: पठतः
  - correct: true
    sa: पठथः
  - sa: पठावः
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: गच्छति
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: he goes
        hi: वह जाता है
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
      feature:
        en: 'Root: {{गम्}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{गम्}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
      compare_from: गम्
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'Every verb has three persons (he/she/it, you, I) and three numbers (one, two, many): nine forms. The endings
          are {{ति तः न्ति}}, {{सि थः थ}}, {{मि वः मः}}.'
        hi: 'हर क्रिया के तीन पुरुष (वह, तुम, मैं) और तीन वचन (एक, दो, अनेक) होते हैं: नौ रूप। प्रत्यय हैं {{ति तः न्ति}},
          {{सि थः थ}}, {{मि वः मः}}।'
    - id: i3
      sa: गच्छति
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: he goes
        hi: वह जाता है
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
      feature:
        en: 'Root: {{गम्}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{गम्}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
      compare_from: गम्

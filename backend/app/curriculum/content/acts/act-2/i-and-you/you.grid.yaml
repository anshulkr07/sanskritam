- id: p4
  kind: practice
  title:
    en: Fill the grid
    hi: तालिका भरिए
  depth: core
  skills:
  - verb.persons
  mode: choice
  prompt:
    en: 'The reflection asks: “How do you say ‘they read’?”'
    hi: 'प्रतिबिम्ब पूछता है: “‘वे पढ़ते हैं’ कैसे कहोगे?”'
  explain:
    en: 'Third person, many: {{पठन्ति}}.'
    hi: 'प्रथम पुरुष, अनेक: {{पठन्ति}}।'
  roman: after
  gate: true
  story:
    success:
      en: Eight boxes glow. You name the ninth and the grid lights from edge to edge. The reflection spirit shivers with delight; for the first time he has a shape of his own.
      hi: आठ खाने चमकते हैं। आप नौवें का नाम लेते हैं और तालिका किनारे से किनारे तक जगमगा उठती है। प्रतिबिम्ब-भूत ख़ुशी से सिहरता है; पहली बार उसका अपना एक आकार है।
    failure:
      en: 'A box stays dark. Third person, many: look for {{न्ति}}.'
      hi: 'एक खाना अँधेरा रहता है। प्रथम पुरुष, अनेक: {{न्ति}} खोजिए।'
  options:
  - correct: true
    sa: पठन्ति
  - sa: पठथ
  - sa: पठामः
- id: sum
  kind: summary
  title:
    en: The nine forms
    hi: नौ रूप
  depth: core
  points:
  - sa: ति तः न्ति · सि थः थ · मि वः मः
    text:
      en: Three persons, three numbers.
      hi: तीन पुरुष, तीन वचन।
  - sa: पठति पठसि पठामि
    text:
      en: He, you, I, in the singular.
      hi: वह, तुम, मैं, एकवचन में।
  - text:
      en: The grid works for every verb.
      hi: तालिका हर क्रिया पर चलती है।

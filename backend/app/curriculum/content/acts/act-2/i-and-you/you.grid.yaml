- id: p3
  kind: practice
  depth: core
  skills:
  - verb.persons
  mode: type
  prompt:
    en: Build “we two go”.
    hi: ‘हम दोनों जाते हैं’ बनाइए।
  explain:
    en: '{{गच्छा}} + {{वः}}: {{गच्छावः}}; the {{अ}} lengthens before {{वः}} and {{मः}}.'
    hi: '{{गच्छा}} + {{वः}}: {{गच्छावः}}; {{वः}} और {{मः}} से पहले {{अ}} दीर्घ हो जाता है।'
  roman: after
  answers:
  - गच्छावः
  tiles:
  - गच्छा
  - वः
  - तः
  - मः

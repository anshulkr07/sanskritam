cards:
- id: s1
  kind: story
  title:
    en: The grid on the water
    hi: पानी पर तालिका
  depth: core
  image:
    brief: A grid of nine glowing words laid out in light on the surface of the river, three rows by three columns, rippling;
      the boat drifting through it, you and Dādī leaning over the side to read it; the silvery spirit spreading his arms over
      the water.
    alt:
      en: A grid of nine glowing verb forms on the river water
      hi: नदी के जल पर चमकती नौ क्रियाओं की तालिका
    cast:
    - you
    - dadi
    - shuka
    - navika
    - pratibimbaka
    place: nauka
    ratio: '4:3'
    id: you-grid-s1
    text_in_image:
    - पठति पठतः पठन्ति
    - पठसि पठथः पठथ
    - पठामि पठावः पठामः
  narration:
    en: 'As the boat drifts, the reflection spirit ripples across the water and lays out a grid in light: three rows, three
      columns. In each box a verb form of {{पठ्}}. “Three persons, three numbers,” says Dādī. “Nine forms. Know the grid and
      you know every verb.”'
    hi: 'नाव बहती है तो प्रतिबिम्ब-भूत पानी पर लहराता है और प्रकाश की एक तालिका बिछा देता है: तीन पंक्तियाँ, तीन स्तम्भ। हर
      खाने में {{पठ्}} का एक क्रियापद। दादी कहती हैं, “तीन पुरुष, तीन वचन। नौ रूप। तालिका जान ली तो हर क्रिया जान ली।”'
- id: t1
  kind: teach
  title:
    en: Three persons, three numbers
    hi: तीन पुरुष, तीन वचन
  depth: core
  skills:
  - verb.persons
  sutras:
  - 3.4.78
  body:
    en: 'Every verb has three persons (he/she/it, you, I) and three numbers (one, two, many): nine forms. The endings are
      {{ति तः न्ति}}, {{सि थः थ}}, {{मि वः मः}}.'
    hi: 'हर क्रिया के तीन पुरुष (वह, तुम, मैं) और तीन वचन (एक, दो, अनेक) होते हैं: नौ रूप। प्रत्यय हैं {{ति तः न्ति}}, {{सि
      थः थ}}, {{मि वः मः}}।'
  examples:
  - sa: गच्छति
    meaning:
      en: he goes
      hi: वह जाता है
    check:
      type: tinanta
      dhatu: गम्
      lakara: Lat
      purusha: Prathama
      vacana: Eka
  - sa: गच्छसि

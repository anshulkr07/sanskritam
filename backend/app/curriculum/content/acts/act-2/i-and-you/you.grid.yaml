        for the first time he has a shape of his own.
      hi: आठ खाने चमकते हैं। आप नौवें का नाम लेते हैं और तालिका किनारे से किनारे तक जगमगा उठती है। प्रतिबिम्ब-भूत ख़ुशी से
        सिहरता है; पहली बार उसका अपना एक आकार है।
    failure:
      en: 'A box stays dark. Third person, many: look for {{न्ति}}.'
      hi: 'एक खाना अँधेरा रहता है। प्रथम पुरुष, अनेक: {{न्ति}} खोजिए।'

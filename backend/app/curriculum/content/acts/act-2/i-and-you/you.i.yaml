    en: 'The verb ending already says “I” or “we”, so the pronoun is often left out: {{पठामि}} alone means “I read”.'
    hi: 'क्रिया का प्रत्यय ही ‘मैं’ या ‘हम’ बता देता है, इसलिए सर्वनाम अक्सर छोड़ दिया जाता है: अकेला {{पठामि}} का अर्थ ‘मैं

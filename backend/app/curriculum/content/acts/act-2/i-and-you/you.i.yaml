cards:
- id: s1
  kind: story
  title:
    en: The boatman
    hi: नाविक
  depth: core
  image:
    brief: A long wooden river boat nosing up to the ghat steps; a lean sun-browned boatman in a faded blue dhoti leaning
      on his bamboo pole and smiling; you, Dādī and Śuka on the steps; the small grey-blue spirit hanging back behind you.
    alt:
      en: A boatman leaning on his pole beside a boat at the ghat steps
      hi: घाट की सीढ़ियों पर नाव के पास डंडी पर झुका नाविक
    cast:
    - you
    - dadi
    - shuka
    - navika
    place: naditira
    ratio: '4:3'
    id: you-i-s1
  narration:
    en: A boat noses up to the steps. The boatman, lean and sun-browned, leans on his pole. “Downstream, to the fair? Room
      for three and a parrot.” Śuka bristles. “Who are you?” the boatman asks the little ghat spirit, who has been following
      you. The spirit just points at you. Time to say “I”.
    hi: एक नाव सीढ़ियों तक आती है। नाविक, दुबला और धूप में तपा, अपनी बाँस की डंडी पर झुकता है। “नीचे मेले तक? तीन लोगों और
      एक तोते की जगह है।” शुक फुफकारता है। नाविक घाट के नन्हे भूत से पूछता है जो आपके पीछे चला आया है, “तुम कौन हो?” भूत बस
      आपकी ओर इशारा करता है। ‘मैं’ कहने का समय आ गया।
  lines:
  - speaker: navika
    sa: कः त्वम्?
    gloss:
      en: Who are you?
      hi: तुम कौन हो?
- id: t1
  kind: teach
  title:
    en: I, we two, we
    hi: मैं, हम दोनों, हम सब
  depth: core
  skills:
  - pron.i-we
  body:
    en: '“I” is {{अहम्}}. For two it is {{आवाम्}} (we two), for many {{वयम्}} (we). The verb shows it too: {{अहं पठामि}} (I
      read), {{आवां पठावः}} (we two read), {{वयं पठामः}} (we read).'
    hi: '‘मैं’ है {{अहम्}}। दो के लिए {{आवाम्}} (हम दोनों), अनेक के लिए {{वयम्}} (हम)। क्रिया भी यही बताती है: {{अहं पठामि}}
      (मैं पढ़ता हूँ), {{आवां पठावः}} (हम दोनों पढ़ते हैं), {{वयं पठामः}} (हम पढ़ते हैं)।'
  rows:
  - sa: अहम्
    gloss:
      en: I
      hi: मैं
    check:
      type: subanta
      stem: अस्मद्
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: आवाम्
    gloss:
      en: we two
      hi: हम दोनों
    check:
      type: subanta
      stem: अस्मद्
      linga: Pum
      vibhakti: Prathama
      vacana: Dvi
  - sa: वयम्
    gloss:
      en: we (many)
      hi: हम (अनेक)
    check:
      type: subanta
      stem: अस्मद्
      linga: Pum
      vibhakti: Prathama
      vacana: Bahu
  term:
    sa: उत्तमपुरुषः
    meaning:
      en: 'first person: I, we'
      hi: 'उत्तम पुरुष: मैं, हम'
  visuals:
  - id: v-source-compare
    kind: comparison
    title:
      en: Compare the examples
      hi: उदाहरणों की तुलना करें
    explanation:
      en: '“I” is {{अहम्}}. For two it is {{आवाम्}} (we two), for many {{वयम्}} (we). The verb shows it too: {{अहं पठामि}}
        (I read), {{आवां पठावः}} (we two read), {{वयं पठामः}} (we read).'
      hi: '‘मैं’ है {{अहम्}}। दो के लिए {{आवाम्}} (हम दोनों), अनेक के लिए {{वयम्}} (हम)। क्रिया भी यही बताती है: {{अहं पठामि}}

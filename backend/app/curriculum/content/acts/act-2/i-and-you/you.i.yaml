- id: pn
  kind: teach
  title:
    en: The first person in Pāṇini
    hi: पाणिनि में उत्तम पुरुष
  depth: panini
  skills:
  - pron.i-we
  sutras:
  - 1.4.107
  - 1.4.108
  - 1.4.101
  body:
    en: Pāṇini calls the “I” person {{उत्तमः}}, “the highest”, and the “you” person {{मध्यमः}}, “the middle”. The “he, she,
      it” person, which you know already, is {{प्रथमः}}, “the first”. The names go in an order opposite to Hindi's.
    hi: पाणिनि ‘मैं’ वाले पुरुष को {{उत्तमः}}, ‘तुम’ वाले को {{मध्यमः}} और ‘वह’ वाले को, जो आप जानते हैं, {{प्रथमः}} कहते
      हैं। नामों का क्रम हिन्दी के क्रम से उलटा है।
  term:
    sa: पुरुषः
    meaning:
      en: 'person: first, middle, last'
      hi: 'पुरुष: प्रथम, मध्यम, उत्तम'

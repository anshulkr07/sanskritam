- id: p4
  kind: practice
  title:
    en: Say “you”
    hi: ‘तुम’ कहिए
  depth: core
  skills:
  - pron.you
  mode: order
  prompt:
    en: 'Say it to the spirit: “You are a friend.”'
    hi: 'भूत से कहिए: ‘तुम मित्र हो।’'
  explain:
    en: '{{त्वं मित्रम् असि}}: you are a friend.'
    hi: '{{त्वं मित्रम् असि}}: तुम मित्र हो।'
  roman: after
  gate: true
  story:
    success:
      en: “त्वं मित्रम् असि,” you say. The silver spirit's outline wavers like a reflection when a stone is dropped, then settles into your own face, smiling back.
      hi: “त्वं मित्रम् असि,” आप कहते हैं। चाँदी-सा भूत पत्थर गिरे प्रतिबिम्ब की तरह काँपता है, फिर आपके ही चेहरे में ठहर जाता है, जो मुस्कुराकर लौटता है।
    failure:
      en: 'The reflection stays blank. Say “you are a friend”: start with {{त्वम्}}.'
      hi: 'प्रतिबिम्ब खाली रहता है। ‘तुम मित्र हो’ कहिए: {{त्वम्}} से शुरू कीजिए।'
  tokens:
  - त्वम्
  - मित्रम्
  - असि
- id: sum
  kind: summary
  title:

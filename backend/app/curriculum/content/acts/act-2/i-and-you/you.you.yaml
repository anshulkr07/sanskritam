cards:
- id: s1
  kind: story
  title:
    en: The question
    hi: प्रश्न
  depth: core
  image:
    brief: The boat sliding out from the ghat steps with you, Dādī, Śuka, the boatman and the small silvery spirit aboard; Dādī turned toward the spirit with a kind direct look as if speaking to him.
    alt:
      en: A grandmother speaks kindly to a small spirit as the boat leaves the ghat
      hi: नाव के घाट छोड़ते समय नन्हे भूत से कोमलता से बोलती दादी
    cast:
    - you
    - dadi
    - shuka
    - navika
    - pratibimbaka
    place: nauka
    ratio: '4:3'
    id: you-you-s1
  narration:
    en: 'The boat slides out from the steps. “And you?” the boatman asks Dādī. “And you, little one?” he asks the spirit. The spirit cannot answer: no one has ever said “you” to him and meant it. Dādī says it first: a clear, kind word, aimed straight at him.'
    hi: 'नाव सीढ़ियों से सरकती है। नाविक दादी से पूछता है, “और आप?” फिर भूत से, “और तुम, नन्हे?” भूत उत्तर नहीं दे पाता: किसी ने कभी उसे ‘तुम’ कहकर सचमुच नहीं पुकारा। दादी पहले कहती हैं: साफ़, कोमल शब्द, ठीक उसकी ओर।'
  lines:
  - speaker: dadi
    sa: त्वं कः असि?
    gloss:
      en: Who are you?
      hi: तुम कौन हो?
- id: t1
  kind: teach
  title:
    en: You, you two, you all
    hi: तुम, तुम दोनों, तुम सब
  depth: core
  skills:
  - pron.you
  body:
    en: '“You” is {{त्वम्}}. For two it is {{युवाम्}}, for many {{यूयम्}}. The verb ends in {{सि}}, {{थः}} or {{थ}}: {{त्वं पठसि}} (you read), {{युवां पठथः}}, {{यूयं पठथ}}.'
    hi: '‘तुम’ है {{त्वम्}}। दो के लिए {{युवाम्}}, अनेक के लिए {{यूयम्}}। क्रिया {{सि}}, {{थः}} या {{थ}} पर समाप्त होती है: {{त्वं पठसि}} (तुम पढ़ते हो), {{युवां पठथः}}, {{यूयं पठथ}}।'
  rows:
  - sa: त्वम्
    gloss:
      en: you
      hi: तुम
    check:
      type: subanta
      stem: युष्मद्
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: युवाम्
    gloss:
      en: you two
      hi: तुम दोनों
    check:
      type: subanta
      stem: युष्मद्
      linga: Pum
      vibhakti: Prathama
      vacana: Dvi
  - sa: यूयम्
    gloss:
      en: you all
      hi: तुम सब
    check:
      type: subanta
      stem: युष्मद्
      linga: Pum
      vibhakti: Prathama
      vacana: Bahu
  term:
    sa: मध्यमपुरुषः
    meaning:
      en: 'second person: you'
      hi: 'मध्यम पुरुष: तुम'

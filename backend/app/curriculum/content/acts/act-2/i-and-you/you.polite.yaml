- id: p4
  kind: practice
  title:
    en: Say it politely
    hi: आदर से कहिए
  depth: core
  skills:
  - pron.polite
  mode: order
  prompt:
    en: 'Say to the old man: “Does your honour go?” as a statement: “Your honour goes.”'
    hi: 'बुज़ुर्ग से कहिए: ‘आप जाते हैं।’'
  explain:
    en: '{{भवान् गच्छति}}: polite “you”, third-person verb.'
    hi: '{{भवान् गच्छति}}: आदरपूर्ण ‘आप’, प्रथम पुरुष की क्रिया।'
  roman: after
  gate: true
  story:
    success:
      en: “भवान् गच्छति,” you say, bowing a little. The old man laughs and lays a hand on your head. Behind you the silver spirit bows too, copying you exactly, and a little too low.
      hi: “भवान् गच्छति,” आप थोड़ा झुककर कहते हैं। बुज़ुर्ग हँसकर आपके सिर पर हाथ रखते हैं। आपके पीछे चाँदी-सा भूत भी झुकता है, ठीक आपकी नक़ल में, थोड़ा ज़्यादा नीचे।
    failure:
      en: He frowns kindly. {{भवान्}} takes the verb for “he”.
      hi: वे प्रेम से भौंहें सिकोड़ते हैं। {{भवान्}} के साथ ‘वह’ की क्रिया लगती है।
  tokens:
  - भवान्
  - गच्छति
- id: t2
  kind: teach
  title:
    en: A word of greeting
    hi: अभिवादन का शब्द
  depth: core
  skills:
  - pron.polite
  body:
    en: '{{नमः}} means “bow, homage”. {{नमस्ते}} is {{नमः}} joined with {{ते}} (“to you”): “homage to you”. You will learn why the two words melt together in the sandhi chapters.'
    hi: '{{नमः}} का अर्थ है ‘प्रणाम’। {{नमस्ते}} {{नमः}} और {{ते}} (‘तुम्हें’) का मेल है: ‘तुम्हें प्रणाम’। दोनों शब्द क्यों मिल जाते हैं, यह सन्धि के अध्यायों में आएगा।'
  examples:
  - sa: नमः
    meaning:
      en: '{{नमः}}: homage'
      hi: '{{नमः}}: प्रणाम'
    check:
      type: subanta
      stem: नमस्
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka
  - sa: नमस्ते
    meaning:
      en: 'homage to you: the everyday greeting'
      hi: 'तुम्हें प्रणाम: रोज़ का अभिवादन'

        lakara: Lat
        purusha: Prathama
        vacana: Eka
      feature:
        en: 'Root: {{पठ्}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{पठ्}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
      compare_from: पठ्
  - - text:
        en: an elder, a woman
        hi: बड़ी, स्त्री

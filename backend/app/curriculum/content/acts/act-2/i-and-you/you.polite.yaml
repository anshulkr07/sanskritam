- id: s1
  kind: story
  title:
    en: An elder on board
    hi: नाव पर एक बुज़ुर्ग
  depth: core
  image:
    brief: A white-bearded old man being helped into the boat at a bend of the river by the boatman, Dādī whispering to you
      with a finger raised, Śuka bowing his head, the silver spirit peering over the side.
    alt:
      en: An old man is helped into the boat while Dādī whispers advice
      hi: बुज़ुर्ग को नाव में चढ़ाते नाविक और कान में सलाह देती दादी
    cast:
    - you
    - dadi
    - shuka
    - navika
    - pratibimbaka
    place: nauka
    ratio: '4:3'
    id: you-polite-s1
  narration:
    en: At a bend a white-bearded old man asks for a lift. The boatman helps him in. “Do not say त्वम् to him,” whispers Dādī.
      “Say भवान्, ‘your honour’. It looks like ‘you’, but it takes the verb for ‘he’.” The old man smiles into his beard.
    hi: एक मोड़ पर सफ़ेद दाढ़ी वाले एक बुज़ुर्ग नाव में बैठने के लिए पूछते हैं। नाविक उन्हें चढ़ाता है। दादी फुसफुसाती हैं,
      “उनसे त्वम् मत कहना। कहो भवान्, ‘आप’। यह ‘तुम’ जैसा दिखता है, पर इसके साथ ‘वह’ की क्रिया लगती है।” बुज़ुर्ग दाढ़ी में
      मुस्कुराते हैं।
- id: t1
  kind: teach
  title:
    en: '{{भवान्}}: your honour'
    hi: '{{भवान्}}: आप'
  depth: core
  skills:
  - pron.polite
  body:
    en: 'To someone you respect, say {{भवान्}} (to a man) or {{भवती}} (to a woman) instead of {{त्वम्}}. They mean “you”,
      but the verb is the third person: {{भवान् पठति}}.'
    hi: 'जिनका आप आदर करते हैं उनसे {{त्वम्}} की जगह {{भवान्}} (पुरुष से) या {{भवती}} (स्त्री से) कहिए। अर्थ ‘आप’ है, पर क्रिया
      प्रथम पुरुष की लगती है: {{भवान् पठति}}।'
  examples:
  - sa: भवान् पठति।
    meaning:
      en: You (sir) read.
      hi: आप पढ़ते हैं।
    words:
    - sa: भवान्
      gloss:
        en: you (to a man, polite)
        hi: आप (पुरुष से, आदरार्थ)
    - sa: पठति
      gloss:
        en: read
        hi: पढ़ते हैं
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
  - sa: भवती गच्छति।
    meaning:
      en: You (madam) go.
      hi: आप जाती हैं।
    words:
    - sa: भवती
      gloss:
        en: you (to a woman, polite)
        hi: आप (स्त्री से, आदरार्थ)
      check:
        type: subanta
        stem: भवती
        linga: Stri
        vibhakti: Prathama
        vacana: Eka
    - sa: गच्छति
      gloss:
        en: go
        hi: जाती हैं
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
  term:
    sa: भवान्
    meaning:

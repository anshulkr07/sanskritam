  rows:
  - skill: pron.i-we
    rule:
      en: The pronoun is often dropped because the verb ending shows the person; it is kept for emphasis or contrast.
      hi: क्रिया का प्रत्यय पुरुष बता देता है, इसलिए सर्वनाम अक्सर छोड़ा जाता है; ज़ोर देने या अन्तर दिखाने के लिए रखा जाता
        है।
    example:
      sa: पठामि
      meaning:
        en: I read (no {{अहम्}} needed)
        hi: मैं पढ़ता हूँ ({{अहम्}} की ज़रूरत नहीं)
    tag: good

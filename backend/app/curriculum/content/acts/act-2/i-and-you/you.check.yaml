- id: p3
  kind: practice
  depth: core
  skills:
  - pron.you
  mode: choice
  prompt:
    en: You speak to one friend. Which verb?
    hi: आप एक मित्र से बोलते हैं। कौन-सी क्रिया?
  explain:
    en: '{{त्वं पठसि}}: you read.'
    hi: '{{त्वं पठसि}}: तुम पढ़ते हो।'
  roman: after
  options:
  - sa: पठति
  - correct: true
    sa: पठसि
  - sa: पठामि
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: '“You” is {{त्वम्}}. For two it is {{युवाम्}}, for many {{यूयम्}}. The verb ends in {{सि}}, {{थः}} or {{थ}}: {{त्वं
        पठसि}} (you read), {{युवां पठथः}}, {{यूयं पठथ}}.'
      hi: '‘तुम’ है {{त्वम्}}। दो के लिए {{युवाम्}}, अनेक के लिए {{यूयम्}}। क्रिया {{सि}}, {{थः}} या {{थ}} पर समाप्त होती
        है: {{त्वं पठसि}} (तुम पढ़ते हो), {{युवां पठथः}}, {{यूयं पठथ}}।'
    items:
    - id: i0
      sa: त्वम्
      meaning:
        en: you
        hi: तुम
      check:
        type: subanta
        stem: युष्मद्
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{युष्मद्}} · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{युष्मद्}} · {{प्रथमा}} · {{एकवचन}}'
      compare_from: युष्मद्
    - id: i1
      sa: युवाम्
      meaning:
        en: you two
        hi: तुम दोनों
      check:
        type: subanta
        stem: युष्मद्
        linga: Pum
        vibhakti: Prathama
        vacana: Dvi
      feature:
        en: 'Stem: {{युष्मद्}} · {{प्रथमा}} · dual'
        hi: 'प्रातिपदिक: {{युष्मद्}} · {{प्रथमा}} · {{द्विवचन}}'
      compare_from: युष्मद्
    - id: i2
      sa: यूयम्
      meaning:
        en: you all
        hi: तुम सब
      check:
        type: subanta
        stem: युष्मद्
        linga: Pum
        vibhakti: Prathama
        vacana: Bahu
      feature:
        en: 'Stem: {{युष्मद्}} · {{प्रथमा}} · plural'
        hi: 'प्रातिपदिक: {{युष्मद्}} · {{प्रथमा}} · {{बहुवचन}}'
      compare_from: युष्मद्
- id: p4
  kind: practice
  depth: core
  skills:
  - verb.persons
  mode: match
  prompt:
    en: Match each form with its person and number.
    hi: हर रूप को उसके पुरुष और वचन से मिलाइए।
  explain:
    en: 'Read the grid: row, then column.'
    hi: 'तालिका पढ़िए: पंक्ति, फिर स्तम्भ।'
  roman: after
  pairs:
  - left:
      sa: पठामः
    right:
      text:
        en: we read
        hi: हम पढ़ते हैं
  - left:
      sa: पठथः
    right:
      text:
        en: you two read
        hi: तुम दोनों पढ़ते हो
  - left:
      sa: पठन्ति
    right:
      text:
        en: they read
        hi: वे पढ़ते हैं
  - left:
      sa: पठावः
    right:
      text:
        en: we two read
        hi: हम दोनों पढ़ते हैं
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: गच्छति
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: he goes
        hi: वह जाता है
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
      feature:
        en: 'Root: {{गम्}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{गम्}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
      compare_from: गम्
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'Every verb has three persons (he/she/it, you, I) and three numbers (one, two, many): nine forms. The endings
          are {{ति तः न्ति}}, {{सि थः थ}}, {{मि वः मः}}.'
        hi: 'हर क्रिया के तीन पुरुष (वह, तुम, मैं) और तीन वचन (एक, दो, अनेक) होते हैं: नौ रूप। प्रत्यय हैं {{ति तः न्ति}},
          {{सि थः थ}}, {{मि वः मः}}।'
    - id: i3
      sa: गच्छति
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: he goes
        hi: वह जाता है
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
      feature:
        en: 'Root: {{गम्}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{गम्}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
      compare_from: गम्

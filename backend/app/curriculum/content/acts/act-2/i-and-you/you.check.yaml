- id: p8
  kind: practice
  depth: core
  skills:
  - pron.you
  - verb.as
  mode: order
  prompt:
    en: 'Say to the little reflection: “You are a friend.”'
    hi: 'नन्हे प्रतिबिम्ब से कहिए: ‘तुम मित्र हो।’'
  explain:
    en: '{{त्वं मित्रम् असि}}: you are a friend.'
    hi: '{{त्वं मित्रम् असि}}: तुम मित्र हो।'
  roman: after
  gate: true
  story:
    success:
      en: “त्वं मित्रम् असि.” The silver spirit's outline firms into a boy-sized shimmer with your own smile. “त्वं मित्रम्
        असि,” he says back, and this time it is not an echo. “उत्सवे जनाः सन्ति।” He points downstream, where paper flags
        flutter over a crowd.
      hi: “त्वं मित्रम् असि।” चाँदी-से भूत की आकृति आपकी ही मुस्कान के साथ बालक के आकार की झिलमिल में ठोस हो जाती है। “त्वं
        मित्रम् असि,” वह लौटाकर कहता है, और इस बार यह प्रतिध्वनि नहीं है। “उत्सवे जनाः सन्ति।” वह धारा की ओर इशारा करता है,
        जहाँ भीड़ के ऊपर काग़ज़ की झंडियाँ फहरा रही हैं।
    failure:
      en: 'The reflection waits. “You”: {{त्वम्}}, then “friend”, then {{असि}}.'

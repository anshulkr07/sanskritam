      meaning:
        en: you (to a man, polite)
        hi: आप (पुरुष से, आदरार्थ)
    - id: i2
      sa: पठति
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: read
        hi: पढ़ते हैं
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Eka

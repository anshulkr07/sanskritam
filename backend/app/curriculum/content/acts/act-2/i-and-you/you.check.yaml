id: you.check
template: check
title:
  en: Say who is who
  hi: बताइए कौन कौन है
title_sa: परीक्षा
minutes: 4
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - pron.i-we
  mode: choice
  prompt:
    en: Which word means “I”?
    hi: ‘मैं’ के लिए कौन-सा शब्द है?
  explain:
    en: '{{अहम्}}: I.'
    hi: '{{अहम्}}: मैं।'
  roman: after
  options:
  - correct: true
    sa: अहम्
  - sa: त्वम्
  - sa: सः
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: '“I” is {{अहम्}}. For two it is {{आवाम्}} (we two), for many {{वयम्}} (we). The verb shows it too: {{अहं पठामि}}
        (I read), {{आवां पठावः}} (we two read), {{वयं पठामः}} (we read).'
      hi: '‘मैं’ है {{अहम्}}। दो के लिए {{आवाम्}} (हम दोनों), अनेक के लिए {{वयम्}} (हम)। क्रिया भी यही बताती है: {{अहं पठामि}}
        (मैं पढ़ता हूँ), {{आवां पठावः}} (हम दोनों पढ़ते हैं), {{वयं पठामः}} (हम पढ़ते हैं)।'
    items:
    - id: i0
      sa: अहम्
      meaning:
        en: I
        hi: मैं
      check:
        type: subanta
        stem: अस्मद्
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{अस्मद्}} · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{अस्मद्}} · {{प्रथमा}} · {{एकवचन}}'
      compare_from: अस्मद्
    - id: i1
      sa: आवाम्
      meaning:
        en: we two
        hi: हम दोनों
      check:
        type: subanta
        stem: अस्मद्
        linga: Pum
        vibhakti: Prathama
        vacana: Dvi
      feature:
        en: 'Stem: {{अस्मद्}} · {{प्रथमा}} · dual'
        hi: 'प्रातिपदिक: {{अस्मद्}} · {{प्रथमा}} · {{द्विवचन}}'
      compare_from: अस्मद्
    - id: i2
      sa: वयम्
      meaning:
        en: we (many)
        hi: हम (अनेक)
      check:
        type: subanta
        stem: अस्मद्
        linga: Pum
        vibhakti: Prathama
        vacana: Bahu
      feature:
        en: 'Stem: {{अस्मद्}} · {{प्रथमा}} · plural'
        hi: 'प्रातिपदिक: {{अस्मद्}} · {{प्रथमा}} · {{बहुवचन}}'
      compare_from: अस्मद्

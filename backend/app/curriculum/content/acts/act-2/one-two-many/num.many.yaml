cards:
- id: s1
  kind: story
  title:
    en: The boats come
    hi: नावें आती हैं
  depth: core
  image:
    brief: The ghat crowded with many boats pulling up to the steps, each with its boatman calling out, a small grey-blue
      spirit cupping his hands as if announcing them; Dādī and Śuka watching from the steps.
    alt:
      en: Many boats crowding the ghat steps
      hi: घाट की सीढ़ियों पर भीड़ लगाती अनेक नावें
    cast:
    - you
    - dadi
    - shuka
    - bakau
    place: naditira
    ratio: '4:3'
    id: num-many-s1
  narration:
    en: 'Now the river is crowded. Boat after boat noses up to the steps, each with its own boatman, all of them calling.
      “Three or more,” says Dādī. “Count them: one, two, many.” The little spirit has found his sound. He cups his hands and
      says it for every boat.'
    hi: 'अब नदी भीड़ से भर गई है। नाव पर नाव सीढ़ियों तक आती है, हर एक का अपना नाविक, सब पुकारते हुए। दादी कहती हैं, “तीन
      या अधिक। गिनो: एक, दो, अनेक।” नन्हे भूत को अपनी ध्वनि मिल गई है। वह हाथ जोड़कर हर नाव के लिए वही बोलता है।'
- id: t1
  kind: teach
  title:
    en: 'Three or more: the plural'
    hi: 'तीन या अधिक: बहुवचन'
  depth: core
  skills:
  - num.plural
  sutras:
  - 1.4.21
  body:
    en: 'Three or more things take the plural ({{बहुवचनम्}}). A masculine or feminine word in -अ/-आ ends in {{आः}}: {{बालकाः}}
      (boys), {{नौकाः}} (boats). A neuter word ends in {{आनि}}: {{फलानि}} (fruits).'
    hi: 'तीन या अधिक वस्तुएँ बहुवचन लेती हैं। -अ/-आ वाले पुंलिंग और स्त्रीलिंग शब्द {{आः}} पर समाप्त होते हैं: {{बालकाः}}
      (बालक), {{नौकाः}} (नावें)। नपुंसक शब्द {{आनि}} पर: {{फलानि}} (फल)।'

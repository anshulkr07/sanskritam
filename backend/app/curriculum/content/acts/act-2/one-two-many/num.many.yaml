- id: pn
  kind: teach
  title:
    en: Why {{पत्राणि}}, not {{पत्रानि}}?
    hi: '{{पत्राणि}}, {{पत्रानि}} क्यों नहीं?'
  depth: panini
  skills:
  - num.plural
  sutras:
  - 8.4.1
  body:
    en: After {{र}}, {{ऋ}} or {{ष}}, a following {{न}} becomes {{ण}}, even across vowels. That is why {{पत्र}} has {{पत्राणि}}
      but {{फल}} has {{फलानि}}. You will meet this again in the sandhi chapters.
    hi: '{{र}}, {{ऋ}} या {{ष}} के बाद आने वाला {{न}} {{ण}} बन जाता है, बीच में स्वर हों तब भी। इसीलिए {{पत्र}} का {{पत्राणि}}
      है और {{फल}} का {{फलानि}}। सन्धि के अध्यायों में यह फिर मिलेगा।'
  examples:

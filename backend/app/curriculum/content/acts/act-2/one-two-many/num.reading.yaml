- id: p2
  kind: practice
  mode: choice
  skills: *id001
  prompt:
    en: Are there one or several boats in the last sentence?
    hi: अन्तिम वाक्य में एक नाव है या अनेक?
  explain:
    en: The final sentence uses plural forms for the boats and for being.
    hi: अन्तिम वाक्य में नाव और होने की क्रिया, दोनों बहुवचन में हैं।
  options:
  - text:
      en: Several boats
      hi: अनेक नावें
    correct: true
  - text:
      en: One boat
      hi: एक नाव
    why:
      en: The final sentence uses plural forms for the boats and for being.
      hi: अन्तिम वाक्य में नाव और होने की क्रिया, दोनों बहुवचन में हैं।
- id: end
  kind: summary
  points:
  - text:
      en: You read the same action with one, two and many people, then identified the boats in the plural.
      hi: आपने एक, दो और अनेक लोगों के साथ वही क्रिया पढ़ी, फिर नावों का बहुवचन पहचाना।

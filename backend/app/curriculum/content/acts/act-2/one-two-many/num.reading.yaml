- id: p1
  kind: practice
  mode: choice
  skills: *id001
  prompt:
    en: How many boys read in the second sentence?
    hi: दूसरे वाक्य में कितने बालक पढ़ते हैं?
  explain:
    en: Both the noun and the verb in the second sentence show two.
    hi: दूसरे वाक्य में संज्ञा और क्रिया, दोनों से दो का बोध होता है।
  options:
  - text:
      en: Two
      hi: दो
    correct: true
  - text:
      en: One
      hi: एक
    why:
      en: Both the noun and the verb in the second sentence show two.
      hi: दूसरे वाक्य में संज्ञा और क्रिया, दोनों से दो का बोध होता है।

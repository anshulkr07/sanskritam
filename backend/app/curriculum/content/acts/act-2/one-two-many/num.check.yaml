id: num.check
template: check
title:
  en: Count the herons
  hi: बगुले गिनिए
title_sa: परीक्षा
minutes: 4
review: engine_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - num.dual
  mode: choice
  prompt:
    en: Which form means exactly two herons?
    hi: कौन-सा रूप ठीक दो बगुलों का है?
  explain:
    en: '{{बकौ}}: the dual.'
    hi: '{{बकौ}}: द्विवचन।'
  roman: after
  options:
  - sa: बकः
  - correct: true
    sa: बकौ
  - sa: बकाः
- id: p2
  kind: practice
  depth: core
  skills:
  - num.dual
  mode: match
  prompt:
    en: Join each form to its meaning.
    hi: हर रूप को उसके अर्थ से जोड़िए।
  explain:
    en: 'Dual: {{औ}} or {{ए}}.'
    hi: 'द्विवचन: {{औ}} या {{ए}}।'
  roman: after
  pairs:
  - left:
      sa: बालिके
    right:
      text:
        en: two girls
        hi: दो बालिकाएँ
  - left:
      sa: फले
    right:
      text:
        en: two fruits
        hi: दो फल
  - left:
      sa: बालकौ
    right:
      text:
        en: two boys
        hi: दो बालक
- id: p3
  kind: practice
  depth: core
  skills:
  - num.plural
  mode: choice
  prompt:
    en: Which form means “many boats”?
    hi: ‘अनेक नावें’ का रूप कौन-सा है?
  explain:
    en: '{{नौकाः}}: the plural.'
    hi: '{{नौकाः}}: बहुवचन।'
  roman: after
  options:
  - sa: नौका
  - sa: नौके
  - correct: true
    sa: नौकाः
- id: p4
  kind: practice
  depth: core
  skills:
  - num.plural
  mode: choice
  prompt:
    en: 'A neuter plural: “many fruits”. Which?'
    hi: 'नपुंसक बहुवचन: ‘अनेक फल’। कौन-सा?'
  explain:
    en: '{{फलानि}}: neuter plural {{आनि}}.'
    hi: '{{फलानि}}: नपुंसक बहुवचन {{आनि}}।'
  roman: after
  options:
  - sa: फलम्
  - sa: फले
  - correct: true
    sa: फलानि
- id: p5
  kind: practice
  depth: core
  skills:
  - verb.pres-3-du-pl
  mode: choice
  prompt:
    en: Which verb means “the two read”?
    hi: ‘दो पढ़ते हैं’ का क्रियापद कौन-सा है?
  explain:
    en: 'Two: {{तः}}.'
    hi: 'दो: {{तः}}।'
  roman: after
  options:
  - sa: पठति
  - correct: true
    sa: पठतः
  - sa: पठन्ति
- id: p6
  kind: practice
  depth: core
  skills:
  - verb.pres-3-du-pl
  mode: type
  prompt:
    en: Build “they go”.
    hi: ‘वे जाते हैं’ बनाइए।
  explain:
    en: '{{गच्छ}} + {{न्ति}}: {{गच्छन्ति}}.'
    hi: '{{गच्छ}} + {{न्ति}}: {{गच्छन्ति}}।'
  roman: after
  answers:
  - गच्छन्ति
  tiles:
  - गच्छ
  - न्ति
  - ति
  - तः
- id: p7
  kind: practice
  depth: core
  skills:
  - sent.agree-number
  mode: choice
  prompt:
    en: Which sentence agrees?
    hi: कौन-सा वाक्य मेल खाता है?
  explain:
    en: 'Many boats: {{सन्ति}}.'
    hi: 'अनेक नावें: {{सन्ति}}।'
  roman: after
  options:
  - sa: नौकाः अस्ति
  - correct: true
    sa: नौकाः सन्ति
  - sa: नौकाः स्तः
- id: p8
  kind: practice
  depth: core
  skills:
  - num.dual
  - sent.agree-number
  mode: order
  prompt:
    en: 'Say it right: “The two herons stand.”'
    hi: 'ठीक बोलिए: ‘दो बगुले खड़े हैं।’'
  explain:
    en: '{{बकौ तिष्ठतः}}: dual doer, dual verb.'
    hi: '{{बकौ तिष्ठतः}}: द्विवचन कर्ता, द्विवचन क्रिया।'
  roman: after
  gate: true
  story:
    success:
      en: '“बकौ तिष्ठतः!” The two herons lift together and become two white breaths of light: “द्वौ बकौ मुक्तौ।” They point toward the boats: “नौकायाम् नाविकः अस्ति।”'
      hi: '“बकौ तिष्ठतः!” दोनों बगुले साथ उठते हैं और प्रकाश की दो सफ़ेद साँसें बन जाते हैं: “द्वौ बकौ मुक्तौ।” वे नावों की ओर इशारा करते हैं: “नौकायाम् नाविकः अस्ति।”'
    failure:
      en: The herons wait. Dual doer, dual verb.
      hi: बगुले प्रतीक्षा करते हैं। द्विवचन कर्ता, द्विवचन क्रिया।
  tokens:
  - बकौ
  - तिष्ठतः

- id: p1
  kind: practice
  depth: core
  skills:
  - num.dual
  mode: choice
  prompt:
    en: Which form means exactly two herons?
    hi: कौन-सा रूप ठीक दो बगुलों का है?
  explain:
    en: '{{बकौ}}: the dual.'
    hi: '{{बकौ}}: द्विवचन।'
  roman: after
  options:
  - sa: बकः
  - correct: true
    sa: बकौ
  - sa: बकाः
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: बकः
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: one heron
        hi: एक बगुला
      check:
        type: subanta
        stem: बक
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{बक}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{बक}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
      compare_from: बक
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'Sanskrit counts one, two and many. Exactly two has its own ending, the dual ({{द्विवचनम्}}). A masculine word
          in -अ ends in {{औ}}: {{बकः}} (one heron), {{बकौ}} (two herons).'
        hi: 'संस्कृत एक, दो और अनेक गिनती है। ठीक दो का अपना प्रत्यय है, द्विवचन। अकारान्त पुंलिंग शब्द {{औ}} पर समाप्त होता
          है: {{बकः}} (एक बगुला), {{बकौ}} (दो बगुले)।'
    - id: i3
      sa: बकः
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: one heron
        hi: एक बगुला
      check:
        type: subanta
        stem: बक
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{बक}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{बक}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
      compare_from: बक

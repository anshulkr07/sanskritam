- title: Lesson text and story
  licence: original
cards:
- id: s1
  kind: story
  title:
    en: Matching the number
    hi: संख्या मिलाना
  depth: core
  image:
    brief: The small grey-blue spirit arranging word-cards into three sentences on the ghat steps, shaking his head at one
      wrong one that Śuka placed; Dādī watching with arms folded and a smile.
    alt:
      en: A small spirit rejects a mismatched sentence while a parrot grins
      hi: बेमेल वाक्य पर सिर हिलाता भूत और मुस्कुराता तोता
    cast:
    - you
    - dadi
    - shuka
    - bakau
    place: naditira
    ratio: '4:3'
    id: num-agree-s1
    text_in_image:
    - बालकः पठति।
    - बालकौ पठतः।
    - बालकाः पठन्ति।
  narration:
    en: 'The spirit builds sentences. One boy reads: बालकः पठति. Two boys read together. Many boys read together. The verb
      must match its doer in number. Śuka gets it wrong on purpose, and the spirit shakes his head like a wet dog.'
    hi: 'भूत वाक्य बनाता है। एक बालक पढ़ता है: बालकः पठति। दो बालक साथ पढ़ते हैं। अनेक बालक साथ पढ़ते हैं। क्रिया को अपने
      कर्ता की संख्या से मेल खाना चाहिए। शुक जान-बूझकर ग़लत बोलता है, और भूत गीले कुत्ते की तरह सिर हिलाता है।'
- id: t1
  kind: teach
  title:
    en: Doer and verb agree
    hi: कर्ता और क्रिया सहमत
  depth: core
  skills:
  - sent.agree-number
  body:
    en: 'The verb agrees with its doer in number: one doer, one-ending; two, two-ending; many, many-ending. {{बालकः पठति}},
      {{बालकौ पठतः}}, {{बालकाः पठन्ति}}.'
    hi: 'क्रिया अपने कर्ता से संख्या में मेल खाती है: एक कर्ता, एक का प्रत्यय; दो, दो का; अनेक, अनेक का। {{बालकः पठति}}, {{बालकौ
      पठतः}}, {{बालकाः पठन्ति}}।'

- id: p5
  kind: practice
  title:
    en: The herons stand
    hi: बगुले खड़े हैं
  depth: core
  skills:
  - sent.agree-number
  mode: order
  prompt:
    en: 'Say it for the two herons: the doer, then the verb.'
    hi: 'दोनों बगुलों के लिए बोलिए: कर्ता, फिर क्रिया।'
  explain:
    en: '{{बकौ तिष्ठतः}}: the two herons stand.'
    hi: '{{बकौ तिष्ठतः}}: दो बगुले खड़े हैं।'
  roman: after
  gate: true
  story:
    success:
      en: “बकौ तिष्ठतः,” you say, and the two herons turn, bow once to the left and once to the right, and dissolve into two soft white breaths. “द्वौ बकौ मुक्तौ,” they say in one voice, and drift off over the boats.
      hi: “बकौ तिष्ठतः,” आप कहते हैं, और दोनों बगुले मुड़ते हैं, एक बार बाएँ और एक बार दाएँ झुकते हैं, और दो कोमल सफ़ेद साँसों में घुल जाते हैं। “द्वौ बकौ मुक्तौ,” वे एक स्वर में कहते हैं और नावों के ऊपर बह जाते हैं।
    failure:
      en: The herons keep still. Two doers need the two-ending verb.
      hi: बगुले स्थिर रहते हैं। दो कर्ताओं के लिए द्विवचन की क्रिया चाहिए।
  tokens:
  - बकौ
  - तिष्ठतः

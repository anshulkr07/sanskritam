- id: t2
  kind: teach
  title:
    en: The verb “to be”
    hi: क्रिया ‘होना’
  depth: core
  skills:
  - sent.agree-number
  body:
    en: '{{अस्ति}} (there is) also counts: {{अस्ति}} for one, {{स्तः}} for two, {{सन्ति}} for many. {{नौकाः सन्ति}}: there
      are boats.'
    hi: '{{अस्ति}} (है) भी गिनती है: एक के लिए {{अस्ति}}, दो के लिए {{स्तः}}, अनेक के लिए {{सन्ति}}। {{नौकाः सन्ति}}: नावें
      हैं।'
  rows:
  - sa: अस्ति
    gloss:
      en: 'one: there is'
      hi: 'एक: है'
    check:
      type: tinanta
      dhatu: अस्
      lakara: Lat
      purusha: Prathama
      vacana: Eka
  - sa: स्तः
    gloss:
      en: 'two: there are'
      hi: 'दो: हैं'
    check:
      type: tinanta
      dhatu: अस्
      lakara: Lat
      purusha: Prathama
      vacana: Dvi
  - sa: सन्ति
    gloss:
      en: 'many: there are'
      hi: 'अनेक: हैं'
    check:
      type: tinanta
      dhatu: अस्
      lakara: Lat
      purusha: Prathama
      vacana: Bahu
  visuals:
  - id: v-source-compare
    kind: comparison
    title:
      en: Compare the examples
      hi: उदाहरणों की तुलना करें
    explanation:

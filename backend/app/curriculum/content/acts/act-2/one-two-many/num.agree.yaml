- id: sum
  kind: summary
  title:
    en: Agreement
    hi: मेल
  depth: core
  points:
  - sa: बालकः पठति · बालकौ पठतः · बालकाः पठन्ति
    text:
      en: The verb matches the doer's number.
      hi: क्रिया कर्ता की संख्या से मेल खाती है।
  - sa: अस्ति · स्तः · सन्ति
    text:
      en: “Is”, in three numbers.
      hi: ‘है’, तीन वचनों में।
  - text:
      en: Order is free; agreement is not.
      hi: क्रम स्वतन्त्र है; मेल नहीं।

        compare_from: बक
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: 'Sanskrit counts one, two and many. Exactly two has its own ending, the dual ({{द्विवचनम्}}). A masculine word
            in -अ ends in {{औ}}: {{बकः}} (one heron), {{बकौ}} (two herons).'
          hi: 'संस्कृत एक, दो और अनेक गिनती है। ठीक दो का अपना प्रत्यय है, द्विवचन। अकारान्त पुंलिंग शब्द {{औ}} पर समाप्त
            होता है: {{बकः}} (एक बगुला), {{बकौ}} (दो बगुले)।'
      - id: i3

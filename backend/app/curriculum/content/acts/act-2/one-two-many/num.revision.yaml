    formula: बालकाः · नौकाः · फलानि
    rule:
      en: plural nominative
      hi: बहुवचन प्रथमा
    tag: core
    taught_in: num.many#tb1
  - skill: verb.pres-3-du-pl
    formula: ति · तः · न्ति
    rule:
      en: verb numbers
      hi: क्रिया के वचन
    tag: core
    taught_in: num.verbs#tb1
  - skill: sent.agree-number
    formula: बालकौ पठतः
    rule:
      en: agreement
      hi: मेल
    tag: core
    taught_in: num.agree#t1

- id: pn
  kind: teach
  title:
    en: Pāṇini on number
    hi: संख्या पर पाणिनि
  depth: panini
  skills:
  - num.dual
  sutras:
  - 1.4.22
  body:
    en: 'Sūtra 1.4.22, {{द्व्येकयोर्द्विवचनैकवचने}}: the dual ending goes with two things, the singular with one. Number is a feature of the ending, not of the stem.'
    hi: 'सूत्र 1.4.22, {{द्व्येकयोर्द्विवचनैकवचने}}: दो के लिए द्विवचन का प्रत्यय, एक के लिए एकवचन का। संख्या प्रत्यय की विशेषता है, मूल की नहीं।'
  term:
    sa: वचनम्
    meaning:
      en: 'number: one, two, many'
      hi: 'वचन: एक, दो, अनेक'

- id: s1
  kind: story
  title:
    en: Two herons
    hi: दो बगुले
  depth: core
  image:
    brief: Two tall white herons standing side by side on one leg each in the shallows of the river at the ghat, perfectly mirrored in the water; Śuka on Dādī's shoulder counting on his claw; boats beginning to gather behind.
    alt:
      en: Two white herons standing side by side in the river shallows
      hi: उथले पानी में साथ-साथ खड़े दो सफ़ेद बगुले
    cast:
    - you
    - dadi
    - shuka
    - bakau
    place: naditira
    ratio: '4:3'
    id: num-two-s1
  narration:
    en: Down the river the ghat fills up. Two white herons stand side by side in the shallows, perfectly still, each on one leg. Śuka counts them out loud and gets confused. “Not one,” says Dādī, “and not many. Sanskrit has a form for exactly two.”
    hi: नदी के किनारे घाट भरने लगता है। उथले पानी में दो सफ़ेद बगुले साथ-साथ खड़े हैं, बिलकुल स्थिर, हर एक एक पैर पर। शुक ज़ोर से गिनता है और उलझ जाता है। दादी कहती हैं, “न एक, न अनेक। संस्कृत में ठीक दो के लिए अलग रूप है।”
  lines:
  - speaker: dadi
    sa: द्वौ बकौ।
    gloss:
      en: Two herons.
      hi: दो बगुले।
- id: t1
  kind: teach
  title:
    en: 'Exactly two: the dual'
    hi: 'ठीक दो: द्विवचन'
  depth: core
  skills:
  - num.dual
  sutras:
  - 1.4.22
  body:
    en: 'Sanskrit counts one, two and many. Exactly two has its own ending, the dual ({{द्विवचनम्}}). A masculine word in -अ ends in {{औ}}: {{बकः}} (one heron), {{बकौ}} (two herons).'
    hi: 'संस्कृत एक, दो और अनेक गिनती है। ठीक दो का अपना प्रत्यय है, द्विवचन। अकारान्त पुंलिंग शब्द {{औ}} पर समाप्त होता है: {{बकः}} (एक बगुला), {{बकौ}} (दो बगुले)।'
  examples:
  - sa: बकः
    meaning:
      en: one heron
      hi: एक बगुला
    check:
      type: subanta
      stem: बक
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: बकौ
    meaning:
      en: two herons
      hi: दो बगुले
    check:
      type: subanta
      stem: बक
      linga: Pum
      vibhakti: Prathama
      vacana: Dvi
  term:
    sa: द्विवचनम्
    meaning:
      en: 'the dual: exactly two'
      hi: 'द्विवचन: ठीक दो'

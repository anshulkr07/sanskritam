cards:
- id: s1
  kind: story
  title:
    en: Readers on the steps
    hi: सीढ़ियों पर पढ़ने वाले
  depth: core
  image:
    brief: 'Three groups of readers on the ghat steps: one boy reading alone, two girls sharing a palm leaf, and a row of
      children reading aloud together; the small grey-blue spirit leaning in with a hand cupped to his ear.'
    alt:
      en: One reader, two readers and a row of readers on the ghat steps
      hi: एक पाठक, दो पाठक और पाठकों की पंक्ति
    cast:
    - you
    - dadi
    - shuka
    - bakau
    place: naditira
    ratio: '4:3'
    id: num-verbs-s1
    text_in_image:
    - पठति
    - पठतः
    - पठन्ति
  narration:
    en: 'Along the steps sit readers. One reads alone. Two sit together over one leaf. A whole class reads aloud in a row.
      The spirit listens to their voices and notices something: the sound at the end of the verb changes with how many there
      are.'
    hi: 'सीढ़ियों पर पाठक बैठे हैं। एक अकेला पढ़ता है। दो एक पत्र पर साथ बैठे हैं। पूरी कक्षा एक पंक्ति में ज़ोर से पढ़ती
      है। भूत उनकी आवाज़ें सुनता है और कुछ ध्यान देता है: क्रिया के अन्त की ध्वनि बदलती है जैसे ही संख्या बदलती है।'
- id: t1
  kind: teach
  title:
    en: The verb counts, too
    hi: क्रिया भी गिनती है
  depth: core
  skills:
  - verb.pres-3-du-pl
  sutras:
  - 3.4.78
  body:
    en: 'The verb has three endings for he, she or it: {{ति}} for one doer, {{तः}} for two, {{न्ति}} for many. {{पठति}} (he
      reads), {{पठतः}} (the two read), {{पठन्ति}} (they read).'
    hi: 'वह के लिए क्रिया के तीन प्रत्यय हैं: एक कर्ता के लिए {{ति}}, दो के लिए {{तः}}, अनेक के लिए {{न्ति}}। {{पठति}} (वह
      पढ़ता है), {{पठतः}} (दो पढ़ते हैं), {{पठन्ति}} (वे पढ़ते हैं)।'
  steps:
  - sa: पठति
    label:
      en: one reads
      hi: एक पढ़ता है
  - sa: पठतः
    label:
      en: two read
      hi: दो पढ़ते हैं
  - sa: पठन्ति
    label:
      en: many read
      hi: अनेक पढ़ते हैं
  visuals:
  - id: v-picture-examples
    kind: comparison
    title:
      en: See the meaning; read the form
      hi: अर्थ देखें, रूप पढ़ें
    explanation:
      en: Compare the pictures with the live Sanskrit captions.
      hi: चित्रों की तुलना संस्कृत के रूपों से करें।

- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: noun.i-stems
    rule:
      en: '{{जसि च}} and {{एङ्ह्रस्वात् सम्बुद्धेः}}: the plural {{कवयः}} and the call {{कवे}}.'
      hi: '{{जसि च}} और {{एङ्ह्रस्वात् सम्बुद्धेः}}: बहुवचन {{कवयः}} और पुकार {{कवे}}।'
    sutras:
    - 7.3.109
    - 6.1.69
    tag: core
    taught_in: nf2.i#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Why {{कवयः}} and not {{कविः}} again? Sūtra 7.3.109, {{जसि च}}, strengthens a final {{इ}}/{{उ}} to {{ए}}/{{ओ}}
          before the plural ending {{जस्}}; and {{ए}} becomes {{अय्}} before a vowel. In the singular call, 6.1.69, {{एङ्ह्रस्वात्
          सम्बुद्धेः}}, drops the ending after {{ए}}.
        hi: '{{कवयः}} क्यों, फिर {{कविः}} क्यों नहीं? सूत्र 7.3.109, {{जसि च}}, बहुवचन प्रत्यय {{जस्}} से पहले अन्तिम {{इ}}/{{उ}}
          को {{ए}}/{{ओ}} बना देता है; और {{ए}} स्वर से पहले {{अय्}} हो जाता है। सम्बोधन एकवचन में 6.1.69, {{एङ्ह्रस्वात् सम्बुद्धेः}},
          {{ए}} के बाद प्रत्यय हटा देता है।'
      items:
      - id: i0
        sa: कवयः
      - id: i1
        sa: कविः
      - id: i2
        sa: जसि च
      - id: i3
        sa: इ
      - id: i4
        sa: उ
      - id: i5
        sa: ए
      - id: i6
        sa: ओ
      - id: i7
        sa: जस्
      - id: i8
        sa: अय्
      - id: i9
        sa: एङ्ह्रस्वात् सम्बुद्धेः
  - skill: noun.r-stems
    rule:
      en: '{{ऋतो ङिसर्वनामस्थानयोः}} and {{ऋदुशनस्पुरुदंसोऽनेहसां च}}: {{पितरौ}} and {{पिता}}.'
      hi: '{{ऋतो ङिसर्वनामस्थानयोः}} और {{ऋदुशनस्पुरुदंसोऽनेहसां च}}: {{पितरौ}} और {{पिता}}।'
    sutras:
    - 7.3.110
    - 7.1.94
    tag: core
    taught_in: nf2.pitr#pn
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 7.3.110, {{ऋतो ङिसर्वनामस्थानयोः}}, gives {{ऋ}} its strong form {{अर्}} before {{ङि}} and the strong endings:
          {{पितरि}}, {{पितरौ}}, {{पितरः}}. Sūtra 7.1.94 makes the first singular {{पिता}} by turning {{ऋ}} into {{अन्}} and
          lengthening.'
        hi: 'सूत्र 7.3.110, {{ऋतो ङिसर्वनामस्थानयोः}}, {{ङि}} और बलवान् प्रत्ययों से पहले {{ऋ}} को उसका प्रबल रूप {{अर्}}
          देता है: {{पितरि}}, {{पितरौ}}, {{पितरः}}। सूत्र 7.1.94 प्रथमा एकवचन {{पिता}} बनाता है, {{ऋ}} को {{अन्}} करके और
          दीर्घ करके।'
      items:
      - id: i0
        sa: ऋतो ङिसर्वनामस्थानयोः
      - id: i1
        sa: ऋ
      - id: i2
        sa: अर्
      - id: i3
        sa: ङि
      - id: i4
        sa: पितरि
      - id: i5
        sa: पितरौ
      - id: i6
        sa: पितरः
      - id: i7
        sa: पिता
      - id: i8
        sa: अन्
  - skill: noun.ii-uu
    rule:
      en: '{{ऋन्नेभ्यो ङीप्}}: many feminines in -ई are made with {{ङीप्}}.'
      hi: '{{ऋन्नेभ्यो ङीप्}}: -ई वाले कई स्त्रीलिंग {{ङीप्}} से बनते हैं।'
    sutras:
    - 4.1.5
    tag: core
    taught_in: nf2.nadi#t1
    visuals:
    - id: v-linked-2
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Feminines in long -{{ई}} ({{नदी}}, {{देवी}}, {{कन्यका}}-like {{गौरी}}) and -{{ऊ}} ({{वधू}}, {{भू}}) share a pattern.
          Before a vowel-initial ending the long vowel becomes {{य्}} or {{व्}}: {{नद्यौ}}, {{वध्वौ}}. Sūtra 4.1.5 makes many
          of these feminines with {{ङीप्}}.'
        hi: 'दीर्घ -{{ई}} ({{नदी}}, {{देवी}}, {{गौरी}}) और -{{ऊ}} ({{वधू}}, {{भू}}) वाले स्त्रीलिंग एक ढाँचे पर चलते हैं।
          स्वर से शुरू होने वाले प्रत्यय से पहले दीर्घ स्वर {{य्}} या {{व्}} बन जाता है: {{नद्यौ}}, {{वध्वौ}}। सूत्र 4.1.5
          इनमें से कई स्त्रीलिंग {{ङीप्}} से बनाता है।'
      items:
      - id: i0
        sa: ई
      - id: i1

      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Many words end in a short -{{इ}}: {{कवि}} (poet), {{अग्नि}} (fire), {{मुनि}} (sage) are masculine; {{मति}} (thought),
        {{भूमि}} (earth), {{रात्रि}} (night) are feminine. Their patterns are close to {{देव}} and {{लता}}, with the {{इ}}
        sometimes turning to {{ए}} or {{य्}}.'
      hi: 'अनेक शब्द ह्रस्व -{{इ}} पर समाप्त होते हैं: {{कवि}}, {{अग्नि}}, {{मुनि}} पुंलिंग हैं; {{मति}}, {{भूमि}}, {{रात्रि}}
        स्त्रीलिंग हैं। उनका ढाँचा {{देव}} और {{लता}} के क़रीब है, जिसमें {{इ}} कभी {{ए}} या {{य्}} बन जाता है।'

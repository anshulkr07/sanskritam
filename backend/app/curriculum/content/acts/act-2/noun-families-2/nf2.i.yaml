cards:
- id: s1
  kind: story
  title:
    en: The night poet
    hi: रात का कवि
  depth: core
  image:
    brief: 'The school library at night, moonlight through a window: a small blue-black spirit with ink-stained wisps writing
      in the air with a reed pen, faint glowing lines of verse trailing behind it; you, Dādī and Śuka peering round a shelf;
      the tree of names glowing softly in a corner.'
    alt:
      en: An ink-stained spirit writing glowing verse in the air in a moonlit library
      hi: चाँदनी में पुस्तकालय में हवा पर चमकते श्लोक लिखता स्याही से सना भूत
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - kavika
    place: pathashala
    ratio: '4:3'
    id: nf2-i-s1
    text_in_image:
    - कविः कवी कवयः।
  narration:
    en: Late that night, while the school sleeps, scratching comes from the library. A small blue-black spirit with ink on
      every wisp is writing on the air with a reed pen, muttering verses. Every line ends the same way, in -इ. “कविः,” he
      says, tapping his own chest. “कवयः,” he adds, looking round hopefully at a shelf of silent bundles.
    hi: उस रात देर से, जब पाठशाला सोती है, पुस्तकालय से खरोंच की आवाज़ आती है। हर लट पर स्याही लगा एक नन्हा नीला-काला भूत
      सरकंडे की कलम से हवा पर लिख रहा है, श्लोक बुदबुदाते हुए। हर पंक्ति एक ही ढंग से समाप्त होती है, -इ पर। “कविः,” वह अपनी
      छाती थपथपाकर कहता है। “कवयः,” वह जोड़ता है, चुप गट्ठरों की अलमारी की ओर आशा से देखता हुआ।
  lines:
  - speaker: dadi
    sa: कविः कवी कवयः।
    gloss:
      en: A poet, two poets, poets.
      hi: एक कवि, दो कवि, अनेक कवि।
- id: t1
  kind: teach
  title:
    en: Words in -इ
    hi: -इ वाले शब्द
  depth: core
  skills:
  - noun.i-stems
  body:
    en: 'Many words end in a short -{{इ}}: {{कवि}} (poet), {{अग्नि}} (fire), {{मुनि}} (sage) are masculine; {{मति}} (thought),
      {{भूमि}} (earth), {{रात्रि}} (night) are feminine. Their patterns are close to {{देव}} and {{लता}}, with the {{इ}} sometimes
      turning to {{ए}} or {{य्}}.'
    hi: 'अनेक शब्द ह्रस्व -{{इ}} पर समाप्त होते हैं: {{कवि}}, {{अग्नि}}, {{मुनि}} पुंलिंग हैं; {{मति}}, {{भूमि}}, {{रात्रि}}
      स्त्रीलिंग हैं। उनका ढाँचा {{देव}} और {{लता}} के क़रीब है, जिसमें {{इ}} कभी {{ए}} या {{य्}} बन जाता है।'
  term:
    sa: इकारान्तम्
    meaning:
      en: a word ending in -इ
      hi: -इ पर समाप्त शब्द
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'Many words end in a short -{{इ}}: {{कवि}} (poet), {{अग्नि}} (fire), {{मुनि}} (sage) are masculine; {{मति}} (thought),
        {{भूमि}} (earth), {{रात्रि}} (night) are feminine. Their patterns are close to {{देव}} and {{लता}}, with the {{इ}}
        sometimes turning to {{ए}} or {{य्}}.'
      hi: 'अनेक शब्द ह्रस्व -{{इ}} पर समाप्त होते हैं: {{कवि}}, {{अग्नि}}, {{मुनि}} पुंलिंग हैं; {{मति}}, {{भूमि}}, {{रात्रि}}
        स्त्रीलिंग हैं। उनका ढाँचा {{देव}} और {{लता}} के क़रीब है, जिसमें {{इ}} कभी {{ए}} या {{य्}} बन जाता है।'

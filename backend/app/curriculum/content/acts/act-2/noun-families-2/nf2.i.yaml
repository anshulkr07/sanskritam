- id: pn
  kind: teach
  title:
    en: Pāṇini's guṇa
    hi: पाणिनि का गुण
  depth: panini
  skills:
  - noun.i-stems
  sutras:
  - 7.3.109
  - 6.1.69
  - 7.3.120
  body:
    en: Why {{कवयः}} and not {{कविः}} again? Sūtra 7.3.109, {{जसि च}}, strengthens a final {{इ}}/{{उ}} to {{ए}}/{{ओ}} before
      the plural ending {{जस्}}; and {{ए}} becomes {{अय्}} before a vowel. In the singular call, 6.1.69, {{एङ्ह्रस्वात् सम्बुद्धेः}},
      drops the ending after {{ए}}.
    hi: '{{कवयः}} क्यों, फिर {{कविः}} क्यों नहीं? सूत्र 7.3.109, {{जसि च}}, बहुवचन प्रत्यय {{जस्}} से पहले अन्तिम {{इ}}/{{उ}}
      को {{ए}}/{{ओ}} बना देता है; और {{ए}} स्वर से पहले {{अय्}} हो जाता है। सम्बोधन एकवचन में 6.1.69, {{एङ्ह्रस्वात् सम्बुद्धेः}},
      {{ए}} के बाद प्रत्यय हटा देता है।'

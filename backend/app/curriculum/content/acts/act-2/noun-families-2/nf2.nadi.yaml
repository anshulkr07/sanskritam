- id: s1
  kind: story
  title:
    en: The river and the bride
    hi: नदी और वधू
  depth: core
  image:
    brief: 'A library shelf at the end of an aisle with two small glowing figures of mist: a river-shaped ripple and a veiled bride; the ink-stained spirit sweeping its pen over them so that their outlines ripple like water; Dādī pointing and explaining.'
    alt:
      en: Two glowing mist figures, a river and a bride, on a library shelf as a poet-spirit sweeps his pen over them
      hi: 'पुस्तकालय की अलमारी पर दो चमकते धुंध-आकार: नदी और वधू'
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - kavika
    place: pathashala
    ratio: '4:3'
    id: nf2-nadi-s1
  narration:
    en: 'At the end of the aisle, two words stand side by side on a shelf: a river and a bride, both long vowels, both feminine. The poet spirit sweeps his pen over them, and their endings ripple like water. “The long ones,” says Dādī. “Words in -ई and -ऊ. Feminines, mostly. They do what the short ones do, with a different rhythm.”'
    hi: 'गलियारे के छोर पर अलमारी पर दो शब्द साथ-साथ खड़े हैं: एक नदी और एक वधू, दोनों दीर्घ स्वर, दोनों स्त्रीलिंग। कवि-भूत उन पर कलम फेरता है, और उनके प्रत्यय पानी की तरह लहराते हैं। “दीर्घ वाले,” दादी कहती हैं। “-ई और -ऊ वाले शब्द। अधिकतर स्त्रीलिंग। वे वही करते हैं जो ह्रस्व वाले, अलग लय में।”'
- id: t1
  kind: teach
  title:
    en: Long -ई and -ऊ
    hi: दीर्घ -ई और -ऊ
  depth: core
  skills:
  - noun.ii-uu
  sutras:
  - 4.1.5
  - 7.3.112
  - 7.3.116
  body:
    en: 'Feminines in long -{{ई}} ({{नदी}}, {{देवी}}, {{कन्यका}}-like {{गौरी}}) and -{{ऊ}} ({{वधू}}, {{भू}}) share a pattern. Before a vowel-initial ending the long vowel becomes {{य्}} or {{व्}}: {{नद्यौ}}, {{वध्वौ}}. Sūtra 4.1.5 makes many of these feminines with {{ङीप्}}.'
    hi: 'दीर्घ -{{ई}} ({{नदी}}, {{देवी}}, {{गौरी}}) और -{{ऊ}} ({{वधू}}, {{भू}}) वाले स्त्रीलिंग एक ढाँचे पर चलते हैं। स्वर से शुरू होने वाले प्रत्यय से पहले दीर्घ स्वर {{य्}} या {{व्}} बन जाता है: {{नद्यौ}}, {{वध्वौ}}। सूत्र 4.1.5 इनमें से कई स्त्रीलिंग {{ङीप्}} से बनाता है।'
  term:
    sa: नदी
    meaning:
      en: the model of long -ई feminines
      hi: दीर्घ -ई स्त्रीलिंग का नमूना

- id: pn
  kind: teach
  title:
    en: Pāṇini's {{ऋ}}
    hi: पाणिनि का {{ऋ}}
  depth: panini
  skills:
  - noun.r-stems
  sutras:
  - 7.3.110
  - 7.1.94
  body:
    en: 'Sūtra 7.3.110, {{ऋतो ङिसर्वनामस्थानयोः}}, gives {{ऋ}} its strong form {{अर्}} before {{ङि}} and the strong endings:
      {{पितरि}}, {{पितरौ}}, {{पितरः}}. Sūtra 7.1.94 makes the first singular {{पिता}} by turning {{ऋ}} into {{अन्}} and lengthening.'
    hi: 'सूत्र 7.3.110, {{ऋतो ङिसर्वनामस्थानयोः}}, {{ङि}} और बलवान् प्रत्ययों से पहले {{ऋ}} को उसका प्रबल रूप {{अर्}} देता
      है: {{पितरि}}, {{पितरौ}}, {{पितरः}}। सूत्र 7.1.94 प्रथमा एकवचन {{पिता}} बनाता है, {{ऋ}} को {{अन्}} करके और दीर्घ करके।'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'Sūtra 7.3.110, {{ऋतो ङिसर्वनामस्थानयोः}}, gives {{ऋ}} its strong form {{अर्}} before {{ङि}} and the strong endings:
        {{पितरि}}, {{पितरौ}}, {{पितरः}}. Sūtra 7.1.94 makes the first singular {{पिता}} by turning {{ऋ}} into {{अन्}} and
        lengthening.'
      hi: 'सूत्र 7.3.110, {{ऋतो ङिसर्वनामस्थानयोः}}, {{ङि}} और बलवान् प्रत्ययों से पहले {{ऋ}} को उसका प्रबल रूप {{अर्}} देता
        है: {{पितरि}}, {{पितरौ}}, {{पितरः}}। सूत्र 7.1.94 प्रथमा एकवचन {{पिता}} बनाता है, {{ऋ}} को {{अन्}} करके और दीर्घ करके।'
    items:

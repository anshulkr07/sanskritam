cards:
- id: s1
  kind: story
  title:
    en: The last shelf
    hi: आख़िरी अलमारी
  depth: core
  image:
    brief: The last library shelf with small mist figures of a father, a mother, a brother and a giver holding out his hands;
      the ink-stained spirit hopping onto the shelf and waving its pen; Śuka murmuring family words like a lullaby; Dādī listening.
    alt:
      en: A shelf of mist figures of kin, a father, a mother, a brother and a giver
      hi: 'अलमारी पर नातों की धुंध-आकृतियाँ: पिता, माता, भाई और दाता'
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - kavika
    place: pathashala
    ratio: '4:3'
    id: nf2-pitr-s1
  narration:
    en: 'The last shelf holds the words of kin: father, mother, brother, giver. The ink-stained spirit hops onto it and waves
      his pen. “These end in {{ऋ}},” says Dādī. “The vowel that is almost an r. Where it can, it turns into {{अर्}}; elsewhere
      into {{र्}}.” Śuka mutters “पिता, माता, भ्राता” as though trying out a lullaby.'
    hi: 'आख़िरी अलमारी में नातों के शब्द हैं: पिता, माता, भाई, दाता। स्याही से सना भूत उस पर कूदकर कलम हिलाता है। “ये {{ऋ}}
      पर समाप्त होते हैं,” दादी कहती हैं। “वह स्वर जो लगभग र है। जहाँ हो सके वह {{अर्}} बन जाता है; और कहीं {{र्}}।” शुक “पिता,
      माता, भ्राता” बुदबुदाता है मानो लोरी आज़मा रहा हो।'
- id: t1
  kind: teach
  title:
    en: Words in -ऋ
    hi: -ऋ वाले शब्द
  depth: core
  skills:
  - noun.r-stems
  sutras:
  - 7.1.94
  - 7.3.110
  body:
    en: 'Words in -{{ऋ}} are mostly kin and agents: {{पितृ}} (father), {{मातृ}} (mother, feminine), {{भ्रातृ}} (brother),
      {{दातृ}} (giver), {{नेतृ}} (leader). The first singular lengthens to {{आ}}: {{पिता}}, {{माता}}, {{दाता}}.'
    hi: '-{{ऋ}} वाले शब्द अधिकतर नाते और कर्ता हैं: {{पितृ}} (पिता), {{मातृ}} (माता, स्त्रीलिंग), {{भ्रातृ}} (भाई), {{दातृ}}
      (देने वाला), {{नेतृ}} (नेता)। प्रथमा एकवचन में {{आ}} दीर्घ होता है: {{पिता}}, {{माता}}, {{दाता}}।'
  term:
    sa: ऋकारान्तम्
    meaning:
      en: a word ending in -ऋ
      hi: -ऋ पर समाप्त शब्द
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें

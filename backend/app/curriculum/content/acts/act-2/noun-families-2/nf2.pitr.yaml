        {{दातृ}} (giver), {{नेतृ}} (leader). The first singular lengthens to {{आ}}: {{पिता}}, {{माता}}, {{दाता}}.'
      hi: '-{{ऋ}} वाले शब्द अधिकतर नाते और कर्ता हैं: {{पितृ}} (पिता), {{मातृ}} (माता, स्त्रीलिंग), {{भ्रातृ}} (भाई), {{दातृ}}
        (देने वाला), {{नेतृ}} (नेता)। प्रथमा एकवचन में {{आ}} दीर्घ होता है: {{पिता}}, {{माता}}, {{दाता}}।'

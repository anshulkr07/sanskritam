  mode: choice
  prompt:
    en: “Of the mother.” Which form?
    hi: ‘माता का।’ कौन-सा रूप?
  explain:
    en: '{{मातुः}}: the sixth case of {{मातृ}}.'
    hi: '{{मातुः}}: {{मातृ}} की षष्ठी।'
  roman: after
  gate: true
  story:
    success:
      en: '“मातुः,” you say. The mist-figures on the last shelf lean into one another: father, mother, brother, giver, a family.
        The ink-stained spirit sets down his pen, and for the first time he is not writing. “कविः कवी कवयः,” he recites, a
        gift. “एकं पत्रम्, द्वे पत्रे, त्रीणि पत्राणि।”'
      hi: '“मातुः,” आप कहते हैं। आख़िरी अलमारी की धुंध-आकृतियाँ एक-दूसरे की ओर झुकती हैं: पिता, माता, भाई, दाता, एक परिवार।
        स्याही से सना भूत अपनी कलम रख देता है, और पहली बार वह लिख नहीं रहा। “कविः कवी कवयः,” वह उपहार के रूप में सुनाता है।
        “एकं पत्रम्, द्वे पत्रे, त्रीणि पत्राणि।”'
    failure:
      en: 'The figures stay apart. “Of the mother”: the sixth case, {{मातुः}}.'
      hi: 'आकृतियाँ अलग रहती हैं। ‘माता का’: षष्ठी, {{मातुः}}।'
  options:

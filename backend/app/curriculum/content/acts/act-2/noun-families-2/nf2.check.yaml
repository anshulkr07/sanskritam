- id: p9
  kind: practice
  depth: core
  skills:
  - noun.i-stems
  mode: order
  prompt:
    en: 'Recite for the poet spirit: “A poet, two poets, poets.”'
    hi: 'कवि-भूत को सुनाइए: ‘एक कवि, दो कवि, अनेक कवि।’'
  explain:
    en: '{{कविः कवी कवयः}}: the first case in three numbers.'
    hi: '{{कविः कवी कवयः}}: प्रथमा तीन वचनों में।'
  roman: after
  gate: true
  story:
    success:
      en: '“कविः, कवी, कवयः.” The ink-stained spirit takes his pen from behind his ear and writes the three words in the air, in a bright line that stays. “कविः कवी कवयः,” he reads, and then, as if giving a gift: “एकं पत्रम्, द्वे पत्रे, त्रीणि पत्राणि.” The bright line bends into a count, and goes out through the library window into the dark.'
      hi: '“कविः, कवी, कवयः।” स्याही से सना भूत कान के पीछे से कलम निकालकर हवा में तीनों शब्द एक चमकती रेखा में लिखता है जो टिकी रहती है। “कविः कवी कवयः,” वह पढ़ता है, और फिर मानो उपहार देते हुए: “एकं पत्रम्, द्वे पत्रे, त्रीणि पत्राणि।” चमकती रेखा एक गिनती में मुड़ती है और पुस्तकालय की खिड़की से अँधेरे में निकल जाती है।'
    failure:
      en: The line will not hold. The same word, in the first case, in three numbers.
      hi: रेखा नहीं टिकती। वही शब्द, प्रथमा में, तीन वचनों में।
  tokens:
  - कविः
  - कवी
  - कवयः

      en: 'A short -{{उ}} works like -{{इ}}: {{गुरु}} (teacher) and {{भानु}} (sun) are masculine, {{धेनु}} (cow) and {{रज्जु}}
        (rope) feminine, {{मधु}} (honey) and {{वस्तु}} (thing) neuter. The {{उ}} becomes {{ओ}} or {{अव्}} where {{इ}} became

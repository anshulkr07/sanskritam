    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Feminines in long -{{ई}} ({{नदी}}, {{देवी}}, {{कन्यका}}-like {{गौरी}}) and -{{ऊ}} ({{वधू}}, {{भू}}) share a pattern.
        Before a vowel-initial ending the long vowel becomes {{य्}} or {{व्}}: {{नद्यौ}}, {{वध्वौ}}. Sūtra 4.1.5 makes many
        of these feminines with {{ङीप्}}.'
      hi: 'दीर्घ -{{ई}} ({{नदी}}, {{देवी}}, {{गौरी}}) और -{{ऊ}} ({{वधू}}, {{भू}}) वाले स्त्रीलिंग एक ढाँचे पर चलते हैं। स्वर
        से शुरू होने वाले प्रत्यय से पहले दीर्घ स्वर {{य्}} या {{व्}} बन जाता है: {{नद्यौ}}, {{वध्वौ}}। सूत्र 4.1.5 इनमें
        से कई स्त्रीलिंग {{ङीप्}} से बनाता है।'

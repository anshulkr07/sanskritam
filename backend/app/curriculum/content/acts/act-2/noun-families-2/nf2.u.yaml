cards:
- id: s1
  kind: story
  title:
    en: A teacher's word
    hi: गुरु का शब्द
  depth: core
  image:
    brief: The Ācārya tiptoeing into the library with a lamp and bowing gravely to Śuka who has puffed himself up on a shelf; Dādī suppressing a laugh; the ink-stained blue-black spirit waving its pen at the next shelf.
    alt:
      en: An old teacher bows gravely to a puffed-up parrot in a library
      hi: फूले हुए तोते को गम्भीरता से प्रणाम करते बूढ़े आचार्य
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - kavika
    place: pathashala
    ratio: '4:3'
    id: nf2-u-s1
  narration:
    en: The poet spirit waves his pen at the next shelf. “Words in -उ,” says Dādī, “the family of the teacher.” Śuka puffs up at once. “गुरुः!” he squawks, and the Ācārya, who has tiptoed in with a lamp to see what the noise is, bows gravely to him.
    hi: कवि-भूत अपनी कलम से अगली अलमारी की ओर इशारा करता है। “-उ वाले शब्द,” दादी कहती हैं, “गुरु का कुल।” शुक तुरन्त फूल उठता है। “गुरुः!” वह चहकता है, और आचार्य, जो शोर देखने दीपक लिए दबे पाँव अन्दर आए हैं, उसे गम्भीरता से प्रणाम करते हैं।
- id: t1
  kind: teach
  title:
    en: Words in -उ
    hi: -उ वाले शब्द
  depth: core
  skills:
  - noun.u-stems
  body:
    en: 'A short -{{उ}} works like -{{इ}}: {{गुरु}} (teacher) and {{भानु}} (sun) are masculine, {{धेनु}} (cow) and {{रज्जु}} (rope) feminine, {{मधु}} (honey) and {{वस्तु}} (thing) neuter. The {{उ}} becomes {{ओ}} or {{अव्}} where {{इ}} became {{ए}} or {{अय्}}.'
    hi: 'ह्रस्व -{{उ}} -{{इ}} की तरह चलता है: {{गुरु}} और {{भानु}} पुंलिंग हैं, {{धेनु}} और {{रज्जु}} स्त्रीलिंग, {{मधु}} और {{वस्तु}} नपुंसक। जहाँ {{इ}} {{ए}} या {{अय्}} बना, वहाँ {{उ}} {{ओ}} या {{अव्}} बनता है।'
  term:
    sa: उकारान्तम्
    meaning:
      en: a word ending in -उ
      hi: -उ पर समाप्त शब्द

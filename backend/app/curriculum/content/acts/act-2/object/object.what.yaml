- id: p4
  kind: practice
  title:
    en: Name the wanted thing
    hi: चाही हुई वस्तु का नाम लीजिए
  depth: core
  skills:
  - case.acc
  mode: order
  prompt:
    en: 'The spirit points at a fruit. Say: “I see a fruit.”'
    hi: 'भूत एक फल की ओर इशारा करता है। कहिए: ‘मैं फल देखता हूँ।’'
  explain:
    en: '{{अहं फलं पश्यामि}}: I see a fruit.'
    hi: '{{अहं फलं पश्यामि}}: मैं फल देखता हूँ।'
  roman: after
  gate: true
  story:
    success:
      en: “फलम्!” the little spirit gasps, and for the first time he knows the word for the thing he wants. He pats the fruit and then himself, delighted.
      hi: “फलम्!” नन्हा भूत हाँफता है, और पहली बार उसे अपनी चाही हुई वस्तु का शब्द पता है। वह फल को थपथपाता है, फिर ख़ुद को, ख़ुशी से।
    failure:
      en: 'He keeps pointing. Say what you see: the object comes before the verb.'
      hi: 'वह इशारा करता रहता है। बताइए आप क्या देखते हैं: कर्म क्रिया से पहले आता है।'
  tokens:
  - अहम्
  - फलम्
  - पश्यामि
- id: pn
  kind: teach
  title:
    en: Pāṇini's object
    hi: पाणिनि का कर्म
  depth: panini
  skills:
  - case.acc
  sutras:
  - 1.4.49
  - 2.3.2
  body:
    en: Sūtra 1.4.49, {{कर्तुरीप्सिततमं कर्म}}, calls the object “what the doer most wishes to reach”. Sūtra 2.3.2, {{कर्मणि द्वितीया}}, puts it in the second case.
    hi: सूत्र 1.4.49, {{कर्तुरीप्सिततमं कर्म}}, कर्म को ‘वह जिसे कर्ता सबसे अधिक पाना चाहे’ कहता है। सूत्र 2.3.2, {{कर्मणि द्वितीया}}, उसे द्वितीया में रखता है।

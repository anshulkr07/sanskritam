cards:
- id: s1
  kind: story
  title:
    en: The market
    hi: बाज़ार
  depth: core
  image:
    brief: 'A riverside market under striped awnings: baskets of fruit, heaps of red and yellow spice, swinging brass scales; a small saffron-yellow spirit darting between stalls pointing at things, a round cheerful spice seller watching him, you, Dādī and Śuka among the shoppers.'
    alt:
      en: A busy market with a small yellow spirit pointing at everything
      hi: व्यस्त बाज़ार, हर चीज़ की ओर इशारा करता नन्हा पीला भूत
    cast:
    - you
    - dadi
    - shuka
    - haridraka
    - vanik
    place: apana
    ratio: '4:3'
    id: object-what-s1
  narration:
    en: The fair ends in a market under striped awnings. Baskets of fruit, heaps of red and yellow spice, brass scales swinging. A small saffron-yellow spirit darts from stall to stall, pointing at things, wanting them, unable to say what. A round, cheerful spice seller watches him with narrowed eyes. “Everybody wants something,” says Dādī. “Say what, and you have a sentence.”
    hi: मेला एक बाज़ार में ख़त्म होता है, धारीदार शामियानों के नीचे। फलों की टोकरियाँ, लाल-पीले मसालों के ढेर, झूलती पीतल की तराज़ू। एक नन्हा केसरिया-पीला भूत दुकान-दुकान भागता है, चीज़ों की ओर इशारा करता है, उन्हें चाहता है, पर कह नहीं पाता कि क्या। एक गोल-मटोल हँसमुख मसाले वाला उसे आँखें सिकोड़कर देखता है। दादी कहती हैं, “हर किसी को कुछ चाहिए। बता दो क्या, तो वाक्य बन गया।”
  lines:
  - speaker: dadi
    sa: आपणे फलानि सन्ति।
    gloss:
      en: There are fruits in the market.
      hi: बाज़ार में फल हैं।
- id: t1
  kind: teach
  title:
    en: The thing acted on
    hi: जिस पर क्रिया होती है
  depth: core
  skills:
  - case.acc
  sutras:
  - 2.3.2
  - 1.4.49
  body:
    en: 'What the doer most wants to reach, what is eaten, read, seen, takes the second case, {{द्वितीया}}. It is the object, {{कर्म}}. {{रामः फलं खादति}}: Rāma eats a fruit. {{फलम्}} is the object.'
    hi: 'कर्ता जिसे सबसे अधिक पाना चाहता है, जो खाया, पढ़ा, देखा जाता है, वह द्वितीया विभक्ति में आता है। वह कर्म है। {{रामः फलं खादति}}: राम फल खाता है। {{फलम्}} कर्म है।'
  examples:
  - sa: रामः फलम् खादति।
    meaning:
      en: Rāma eats a fruit.
      hi: राम फल खाता है।
    words:
    - sa: रामः
      gloss:
        en: Rāma
        hi: राम
      check:
        type: subanta
        stem: राम
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
    - sa: फलम्
      gloss:
        en: fruit (object)
        hi: फल (कर्म)
      check:
        type: subanta
        stem: फल
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Eka
    - sa: खादति
      gloss:
        en: eats
        hi: खाता है
      check:
        type: tinanta
        dhatu: खाद्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
  - sa: बालकः पुस्तकम् पठति।
    meaning:
      en: The boy reads a book.
      hi: बालक पुस्तक पढ़ता है।
    words:
    - sa: बालकः
      gloss:
        en: boy
        hi: बालक
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
    - sa: पुस्तकम्
      gloss:
        en: book (object)

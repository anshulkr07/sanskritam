- id: pn
  kind: teach
  title:
    en: Pāṇini's object
    hi: पाणिनि का कर्म
  depth: panini
  skills:
  - case.acc
  sutras:
  - 1.4.49
  - 2.3.2
  body:
    en: Sūtra 1.4.49, {{कर्तुरीप्सिततमं कर्म}}, calls the object “what the doer most wishes to reach”. Sūtra 2.3.2, {{कर्मणि
      द्वितीया}}, puts it in the second case.
    hi: सूत्र 1.4.49, {{कर्तुरीप्सिततमं कर्म}}, कर्म को ‘वह जिसे कर्ता सबसे अधिक पाना चाहे’ कहता है। सूत्र 2.3.2, {{कर्मणि
      द्वितीया}}, उसे द्वितीया में रखता है।
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: Sūtra 1.4.49, {{कर्तुरीप्सिततमं कर्म}}, calls the object “what the doer most wishes to reach”. Sūtra 2.3.2, {{कर्मणि
        द्वितीया}}, puts it in the second case.
      hi: सूत्र 1.4.49, {{कर्तुरीप्सिततमं कर्म}}, कर्म को ‘वह जिसे कर्ता सबसे अधिक पाना चाहे’ कहता है। सूत्र 2.3.2, {{कर्मणि
        द्वितीया}}, उसे द्वितीया में रखता है।
    items:
    - id: i0
      sa: कर्तुरीप्सिततमं कर्म
    - id: i1
      sa: कर्मणि द्वितीया
- id: sum
  kind: summary
  title:
    en: The object
    hi: कर्म
  depth: core
  points:
  - sa: फलम् · बालकम् · नदीम्
    text:
      en: 'The second case: what is acted on.'
      hi: 'द्वितीया: जिस पर क्रिया हो।'
  - sa: रामः फलं खादति
    text:
      en: Doer, object, verb.
      hi: कर्ता, कर्म, क्रिया।
  - text:
      en: 'Neuter: the same as the first case.'
      hi: 'नपुंसक: प्रथमा जैसा ही।'

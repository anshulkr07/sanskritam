cards:
- id: s1
  kind: story
  title:
    en: Which way?
    hi: किस ओर?
  depth: core
  image:
    brief: The small saffron-yellow spirit tugging at your sleeve and pointing between the spice stall, the river and a grove
      of trees beyond the market; Dādī smiling; Śuka looking where he points.
    alt:
      en: A small spirit tugging a sleeve and pointing in three directions
      hi: तीन दिशाओं में इशारा करते हुए आस्तीन खींचता नन्हा भूत
    cast:
    - you
    - dadi
    - shuka
    - haridraka
    - vanik
    place: apana
    ratio: '4:3'
    id: object-where-to-s1
  narration:
    en: 'The yellow spirit tugs your sleeve and points: the spice seller''s stall, the river, the grove beyond the market.
      He wants to go somewhere, and cannot say where. “A place you go to is also reached by the doer,” says Dādī. “So it takes
      the second case as well.”'
    hi: 'पीला भूत आपकी आस्तीन खींचता है और इशारा करता है: मसाले वाले की दुकान, नदी, बाज़ार के पार का उपवन। वह कहीं जाना चाहता
      है, और बता नहीं पाता कहाँ। दादी कहती हैं, “जिस जगह आप जाते हैं, उसे भी कर्ता पहुँचता है। इसलिए वह भी द्वितीया में आता
      है।”'
- id: t1
  kind: teach
  title:
    en: Going to a place
    hi: किसी स्थान को जाना
  depth: core
  skills:
  - case.acc-goal
  sutras:
  - 2.3.2
  body:
    en: 'With verbs of going, the place you go to takes the second case: {{बालकः ग्रामं गच्छति}} (the boy goes to the village).
      The verb of coming works the same way: {{गृहम् आगच्छति}}.'
    hi: 'जाने की क्रियाओं के साथ जहाँ जाया जाए वह स्थान द्वितीया में आता है: {{बालकः ग्रामं गच्छति}} (बालक गाँव जाता है)।
      आने की क्रिया भी ऐसी ही चलती है: {{गृहम् आगच्छति}}।'
  examples:

- id: p4
  kind: practice
  title:
    en: Where to
    hi: कहाँ को
  depth: core
  skills:
  - case.acc-goal
  mode: order
  prompt:
    en: 'Say: “We go to the river.”'
    hi: 'कहिए: ‘हम नदी को जाते हैं।’'
  explain:
    en: '{{वयं नदीं गच्छामः}}: we go to the river.'
    hi: '{{वयं नदीं गच्छामः}}: हम नदी को जाते हैं।'
  roman: after
  gate: true
  story:
    success:
      en: “वयं नदीं गच्छामः,” you say, and the little spirit skips ahead with a trail of yellow dust, then turns back to see whether you follow.
      hi: “वयं नदीं गच्छामः,” आप कहते हैं, और नन्हा भूत पीली धूल की लकीर छोड़ता आगे कूद चलता है, फिर मुड़कर देखता है कि आप आ रहे हैं या नहीं।
    failure:
      en: He tugs again. “We” is {{वयम्}}; the place is in the second case.
      hi: वह फिर खींचता है। ‘हम’ है {{वयम्}}; स्थान द्वितीया में है।
  tokens:
  - वयम्
  - नदीम्
  - गच्छामः

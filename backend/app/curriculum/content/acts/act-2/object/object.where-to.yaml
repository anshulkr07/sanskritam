- id: p1
  kind: practice
  depth: core
  skills:
  - case.acc-goal
  mode: choice
  prompt:
    en: “The girl goes to the river.” Which word for “river”?
    hi: ‘बालिका नदी को जाती है।’ ‘नदी’ के लिए कौन-सा रूप?
  explain:
    en: 'The goal takes the second case: {{नदीम्}}.'
    hi: 'गन्तव्य द्वितीया लेता है: {{नदीम्}}।'
  roman: after
  options:
  - sa: नदी
  - correct: true
    sa: नदीम्
  - sa: नद्यः
- id: p2

        label:
          en: Read the whole example
          hi: पूरा उदाहरण पढ़ें
        meaning:
          en: boys, as objects
          hi: बालक, कर्म के रूप में
        check:
          type: subanta
          stem: बालक
          linga: Pum
          vibhakti: Dvitiya
          vacana: Bahu
        feature:
          en: 'Stem: {{बालक}} · masculine · {{द्वितीया}} · plural'
          hi: 'प्रातिपदिक: {{बालक}} · {{पुंलिंग}} · {{द्वितीया}} · {{बहुवचन}}'
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: 'Plural objects: {{आन्}} for masculine -अ ({{बालकान्}}), {{आः}} for feminine -आ ({{बालिकाः}}), {{आनि}} for neuter
            ({{फलानि}}).'
          hi: 'बहुवचन कर्म: पुंलिंग -अ में {{आन्}} ({{बालकान्}}), स्त्रीलिंग -आ में {{आः}} ({{बालिकाः}}), नपुंसक में {{आनि}}

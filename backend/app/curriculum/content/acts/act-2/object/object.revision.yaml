- id: mistakes
  kind: revision
  title:
    en: Common mistakes
    hi: आम भूलें
  depth: core
  section: mistakes
  rows:
  - skill: case.acc
    rule:
      en: 'Do not leave the object in the first case: {{रामः फलं खादति}}, not {{रामः फलः खादति}} or a bare stem.'
      hi: 'कर्म को प्रथमा में मत छोड़िए: {{रामः फलं खादति}}, केवल मूल रूप नहीं।'
    tag: core
    taught_in: object.what#t1
  - skill: case.acc-goal
    rule:
      en: 'Do not look for a word for “to”: the second case already says it.'
      hi: '‘को’ के लिए शब्द मत खोजिए: द्वितीया वही बता देती है।'
    tag: core
    taught_in: object.where-to#t1
  - skill: sent.negation
    rule:
      en: Do not put {{न}} after the verb.
      hi: '{{न}} को क्रिया के बाद मत रखिए।'
    tag: core
    taught_in: object.no#t1
- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: case.acc
    rule:
      en: '{{कर्तुरीप्सिततमं कर्म}}: the object is what the doer most wishes to reach; {{कर्मणि द्वितीया}}: it takes the second
        case.'
      hi: '{{कर्तुरीप्सिततमं कर्म}}: कर्म वह है जिसे कर्ता सबसे अधिक पाना चाहे; {{कर्मणि द्वितीया}}: वह द्वितीया लेता है।'
    sutras:
    - 1.4.49
    - 2.3.2
    tag: core
    taught_in: object.what#pn
- id: sheet
  kind: revision
  title:
    en: Quick sheet
    hi: एक नज़र में
  depth: core
  section: quick_sheet
  rows:
  - skill: case.acc
    formula: अम् · आम् · ईम्
    rule:
      en: object
      hi: कर्म
    tag: core
    taught_in: object.what#tb1
  - skill: case.acc-goal
    formula: ग्रामं गच्छति
    rule:
      en: going to
      hi: को जाना
    tag: core
    taught_in: object.where-to#t1
  - skill: sent.questions
    formula: कः किम् कुत्र कदा कथम्
    rule:
      en: questions
      hi: प्रश्न
    tag: core
    taught_in: object.ask#t1
  - skill: sent.negation
    formula: न + क्रिया
    rule:
      en: 'no'
      hi: नहीं
    tag: core
    taught_in: object.no#t1

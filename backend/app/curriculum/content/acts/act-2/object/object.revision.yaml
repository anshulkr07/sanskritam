        sa: बालकान्
        label:
          en: Read it again with the meaning
          hi: अर्थ समझकर फिर पढ़ें
        meaning:
          en: boys, as objects
          hi: बालक, कर्म के रूप में
        check:
          type: subanta
          stem: बालक
          linga: Pum
          vibhakti: Dvitiya
          vacana: Bahu
        feature:
          en: 'Stem: {{बालक}} · masculine · {{द्वितीया}} · plural'
          hi: 'प्रातिपदिक: {{बालक}} · {{पुंलिंग}} · {{द्वितीया}} · {{बहुवचन}}'
  - skill: sent.negation
    rule:
      en: 'Prohibition uses {{मा}}, not {{न}}: {{मा गच्छ}}, “do not go”. You will meet it with the commands.'
      hi: 'निषेध-आज्ञा में {{न}} नहीं {{मा}} आता है: {{मा गच्छ}}, ‘मत जाओ’। आज्ञार्थ के साथ यह मिलेगा।'
    example:
      sa: मा गच्छ
      meaning:
        en: do not go
        hi: मत जाओ
    tag: rare

          that never change: {{कुत्र}} (where), {{कदा}} (when), {{कथम्}} (how), {{कुतः}} (from where).'
        hi: '{{कः}} (कौन), {{का}} (कौन, स्त्री), {{किम्}} (क्या): ये परिचित प्रत्यय लेते हैं। और चार छोटे शब्द जो कभी नहीं
          बदलते: {{कुत्र}} (कहाँ), {{कदा}} (कब), {{कथम्}} (कैसे), {{कुतः}} (कहाँ से)।'

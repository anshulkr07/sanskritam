- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - case.acc
  mode: choice
  prompt:
    en: '{{सीता फलं खादति}}: which word is the object?'
    hi: '{{सीता फलं खादति}}: कर्म कौन-सा शब्द है?'
  explain:
    en: '{{फलम्}}: what is eaten.'
    hi: '{{फलम्}}: जो खाया जाता है।'
  roman: after
  options:
  - sa: सीता
  - correct: true
    sa: फलम्
  - sa: खादति
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: रामः फलम् खादति।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: Rāma eats a fruit.
        hi: राम फल खाता है।
      words:
      - sa: रामः
        gloss:
          en: Rāma
          hi: राम
        check:
          type: subanta
          stem: राम
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: फलम्
        gloss:
          en: fruit (object)
          hi: फल (कर्म)
        check:
          type: subanta
          stem: फल
          linga: Napumsaka
          vibhakti: Dvitiya
          vacana: Eka
      - sa: खादति
        gloss:
          en: eats
          hi: खाता है
        check:
          type: tinanta
          dhatu: खाद्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
    - id: i1
      sa: रामः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: Rāma
        hi: राम
      check:
        type: subanta
        stem: राम
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{राम}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{राम}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
    - id: i2
      sa: फलम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: fruit (object)
        hi: फल (कर्म)
      check:
        type: subanta
        stem: फल
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Eka
      feature:
        en: 'Stem: {{फल}} · neuter · {{द्वितीया}} · singular'
        hi: 'प्रातिपदिक: {{फल}} · {{नपुंसकलिंग}} · {{द्वितीया}} · {{एकवचन}}'
    - id: i3
      sa: खादति
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: eats
        hi: खाता है
      check:
        type: tinanta
        dhatu: खाद्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
      feature:
        en: 'Root: {{खाद्}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{खाद्}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'What the doer most wants to reach, what is eaten, read, seen, takes the second case, {{द्वितीया}}. It is the
          object, {{कर्म}}. {{रामः फलं खादति}}: Rāma eats a fruit. {{फलम्}} is the object.'
        hi: 'कर्ता जिसे सबसे अधिक पाना चाहता है, जो खाया, पढ़ा, देखा जाता है, वह द्वितीया विभक्ति में आता है। वह कर्म है।
          {{रामः फलं खादति}}: राम फल खाता है। {{फलम्}} कर्म है।'
    - id: i6
      sa: रामः फलम् खादति।
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें

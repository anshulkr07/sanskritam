  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: बालकः ग्रामम् गच्छति।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: The boy goes to the village.
        hi: बालक गाँव जाता है।
      words:
      - sa: बालकः
        gloss:
          en: boy
          hi: बालक
        check:
          type: subanta
          stem: बालक
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: ग्रामम्
        gloss:
          en: to the village
          hi: गाँव को
        check:
          type: subanta
          stem: ग्राम
          linga: Pum
          vibhakti: Dvitiya
          vacana: Eka
      - sa: गच्छति
        gloss:
          en: goes
          hi: जाता है
        check:
          type: tinanta
          dhatu: गम्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
    - id: i1
      sa: बालकः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: boy
        hi: बालक
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{बालक}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{बालक}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
    - id: i2
      sa: ग्रामम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: to the village
        hi: गाँव को
      check:
        type: subanta
        stem: ग्राम
        linga: Pum
        vibhakti: Dvitiya
        vacana: Eka

- id: t2
  kind: teach
  title:
    en: Questions in sentences
    hi: वाक्यों में प्रश्न
  depth: core
  skills:
  - sent.questions
  body:
    en: A question word takes the place of the thing asked. {{कः पठति?}} (who reads?), {{किं पश्यसि?}} (what do you see?),
      {{कुत्र गच्छसि?}} (where do you go?). For a yes/no question, begin with {{किम्}}.
    hi: प्रश्नवाचक शब्द उस वस्तु की जगह आता है जिसके बारे में पूछा जा रहा है। {{कः पठति?}} (कौन पढ़ता है?), {{किं पश्यसि?}}
      (तुम क्या देखते हो?), {{कुत्र गच्छसि?}} (तुम कहाँ जाते हो?)। हाँ-या-नहीं के प्रश्न के लिए {{किम्}} से शुरू कीजिए।
  examples:
  - sa: कः पठति?
    meaning:
      en: Who reads?
      hi: कौन पढ़ता है?
    words:
    - sa: कः
      gloss:
        en: who
        hi: कौन
    - sa: पठति
      gloss:
        en: reads
        hi: पढ़ता है
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
  - sa: किम् पश्यसि?
    meaning:
      en: What do you see?
      hi: तुम क्या देखते हो?
    words:
    - sa: किम्
      gloss:
        en: what
        hi: क्या
    - sa: पश्यसि
      gloss:
        en: do you see
        hi: तुम देखते हो
      check:
        type: tinanta
        dhatu: दृश्
        lakara: Lat
        purusha: Madhyama
        vacana: Eka
  - sa: कुत्र गच्छसि?
    meaning:
      en: Where do you go?
      hi: तुम कहाँ जाते हो?
    words:
    - sa: कुत्र
      gloss:
        en: where
        hi: कहाँ
    - sa: गच्छसि
      gloss:
        en: do you go
        hi: तुम जाते हो
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Madhyama
        vacana: Eka
  - sa: कदा गच्छति?
    meaning:
      en: When does he go?
      hi: वह कब जाता है?
    words:
    - sa: कदा
      gloss:
        en: when
        hi: कब
    - sa: गच्छति
      gloss:
        en: goes
        hi: जाता है
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Prathama
        vacana: Eka

- id: p3
  kind: practice
  title:
    en: A question back
    hi: पलटकर प्रश्न
  depth: core
  skills:
  - sent.questions
  mode: order
  prompt:
    en: 'Ask the seller: “Where do you go?”'
    hi: 'विक्रेता से पूछिए: ‘तुम कहाँ जाते हो?’'
  explain:
    en: '{{कुत्र गच्छसि}}: where do you go?'
    hi: '{{कुत्र गच्छसि}}: तुम कहाँ जाते हो?'
  roman: after
  gate: true
  story:
    success:
      en: “कुत्र गच्छसि?” you ask. The spice seller blinks, then laughs and lets his arms drop. “Nowhere. I sit here all day.” He pats the old chest at his feet, the lid green with age.
      hi: “कुत्र गच्छसि?” आप पूछते हैं। मसाले वाला पलकें झपकाता है, फिर हँसकर बाँहें खोल देता है। “कहीं नहीं। मैं दिन भर यहीं बैठता हूँ।” वह अपने पैरों के पास के पुराने संदूक को थपथपाता है, जिसका ढक्कन उम्र से हरा हो चुका है।
    failure:
      en: The seller shakes his head. “Where” is {{कुत्र}}, then the verb.
      hi: विक्रेता सिर हिलाता है। ‘कहाँ’ है {{कुत्र}}, फिर क्रिया।
  tokens:
  - कुत्र
  - गच्छसि
- id: p4
  kind: practice
  depth: core
  skills:
  - sent.questions
  mode: choice
  prompt:
    en: '{{किं त्वं पठसि?}} begins with {{किम्}}. What kind of question is it?'
    hi: '{{किं त्वं पठसि?}} {{किम्}} से शुरू होता है। यह किस प्रकार का प्रश्न है?'
  explain:
    en: '{{किम्}} at the start asks “whether”.'
    hi: आरम्भ में {{किम्}} का अर्थ ‘क्या’ है, यानी हाँ-या-नहीं का प्रश्न।
  roman: show
  options:
  - correct: true
    text:
      en: 'a yes/no question: “Do you read?”'
      hi: 'हाँ-या-नहीं का प्रश्न: ‘क्या तुम पढ़ते हो?’'
  - text:
      en: a “who” question
      hi: ‘कौन’ का प्रश्न

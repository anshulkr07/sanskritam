- id: s1
  kind: story
  title:
    en: The seller's riddle
    hi: विक्रेता की पहेली
  depth: core
  image:
    brief: The round spice seller with arms folded firing questions at the small yellow spirit, who shrinks behind your leg; Dādī holding up four fingers; Śuka cocking his head; spice heaps in the foreground.
    alt:
      en: A spice seller fires questions at a shy yellow spirit
      hi: मसाले वाला शर्मीले पीले भूत पर प्रश्न दागता है
    cast:
    - you
    - dadi
    - shuka
    - haridraka
    - vanik
    place: apana
    ratio: '4:3'
    id: object-ask-s1
  narration:
    en: The spice seller crosses his arms. “What do you want?” he asks the spirit. “Who sent you? Where are you going? When will you leave?” The spirit cannot answer a single one. “To ask,” says Dādī, “Sanskrit has a family of words that begin with क.”
    hi: मसाले वाला बाँहें मोड़ लेता है। वह भूत से पूछता है, “तुम्हें क्या चाहिए? किसने भेजा? कहाँ जा रहे हो? कब जाओगे?” भूत एक का भी उत्तर नहीं दे पाता। दादी कहती हैं, “पूछने के लिए संस्कृत में क से शुरू होने वाले शब्दों का एक कुल है।”
  lines:
  - speaker: vanik
    sa: किं पश्यसि?
    gloss:
      en: What do you see?
      hi: तुम क्या देखते हो?
- id: t1
  kind: teach
  title:
    en: The क words
    hi: क वाले शब्द
  depth: core
  skills:
  - sent.questions
  body:
    en: '{{कः}} (who), {{का}} (who, feminine), {{किम्}} (what): they take the endings you know. And four little words that never change: {{कुत्र}} (where), {{कदा}} (when), {{कथम्}} (how), {{कुतः}} (from where).'
    hi: '{{कः}} (कौन), {{का}} (कौन, स्त्री), {{किम्}} (क्या): ये परिचित प्रत्यय लेते हैं। और चार छोटे शब्द जो कभी नहीं बदलते: {{कुत्र}} (कहाँ), {{कदा}} (कब), {{कथम्}} (कैसे), {{कुतः}} (कहाँ से)।'
  rows:
  - sa: कः
    gloss:
      en: who?
      hi: कौन?
    check:
      type: subanta
      stem: किम्
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: का
    gloss:
      en: who? (f)
      hi: कौन? (स्त्री.)
    check:
      type: subanta
      stem: किम्
      linga: Stri
      vibhakti: Prathama
      vacana: Eka
  - sa: किम्
    gloss:
      en: what?
      hi: क्या?
    check:
      type: subanta
      stem: किम्
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka
  - sa: कुत्र
    gloss:
      en: where?
      hi: कहाँ?
  - sa: कदा
    gloss:
      en: when?
      hi: कब?
  - sa: कथम्
    gloss:
      en: how?
      hi: कैसे?
  - sa: कुतः
    gloss:
      en: from where?
      hi: कहाँ से?
- id: t2
  kind: teach
  title:
    en: Questions in sentences
    hi: वाक्यों में प्रश्न
  depth: core
  skills:
  - sent.questions
  body:
    en: A question word takes the place of the thing asked. {{कः पठति?}} (who reads?), {{किं पश्यसि?}} (what do you see?), {{कुत्र गच्छसि?}} (where do you go?). For a yes/no question, begin with {{किम्}}.
    hi: प्रश्नवाचक शब्द उस वस्तु की जगह आता है जिसके बारे में पूछा जा रहा है। {{कः पठति?}} (कौन पढ़ता है?), {{किं पश्यसि?}} (तुम क्या देखते हो?), {{कुत्र गच्छसि?}} (तुम कहाँ जाते हो?)। हाँ-या-नहीं के प्रश्न के लिए {{किम्}} से शुरू कीजिए।
  examples:
  - sa: कः पठति?
    meaning:
      en: Who reads?
      hi: कौन पढ़ता है?
    words:
    - sa: कः
      gloss:
        en: who
        hi: कौन
    - sa: पठति
      gloss:
        en: reads
        hi: पढ़ता है
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
  - sa: किम् पश्यसि?
    meaning:
      en: What do you see?
      hi: तुम क्या देखते हो?
    words:
    - sa: किम्
      gloss:
        en: what
        hi: क्या
    - sa: पश्यसि
      gloss:
        en: do you see
        hi: तुम देखते हो
      check:
        type: tinanta
        dhatu: दृश्
        lakara: Lat
        purusha: Madhyama
        vacana: Eka
  - sa: कुत्र गच्छसि?
    meaning:
      en: Where do you go?
      hi: तुम कहाँ जाते हो?
    words:
    - sa: कुत्र
      gloss:
        en: where
        hi: कहाँ
    - sa: गच्छसि
      gloss:
        en: do you go
        hi: तुम जाते हो
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Madhyama
        vacana: Eka
  - sa: कदा गच्छति?
    meaning:
      en: When does he go?
      hi: वह कब जाता है?
    words:
    - sa: कदा
      gloss:
        en: when
        hi: कब
    - sa: गच्छति
      gloss:
        en: goes
        hi: जाता है
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Prathama
        vacana: Eka

cards:
- id: s1
  kind: story
  title:
    en: The old chest
    hi: पुराना संदूक
  depth: core
  image:
    brief: The spice seller sitting behind his stall with a very old green-lidded wooden chest at his feet, shaking his head
      with a smile; the small yellow spirit hovering above the lid; you and Dādī looking at it with curiosity.
    alt:
      en: A spice seller shakes his head over an old chest while a spirit hovers above it
      hi: पुराने संदूक पर सिर हिलाता मसाले वाला और ऊपर मँडराता भूत
    cast:
    - you
    - dadi
    - shuka
    - haridraka
    - vanik
    place: apana
    ratio: '4:3'
    id: object-no-s1
  narration:
    en: “Can we see what is in the chest?” you ask. “No,” says the spice seller. “It is not for sale. It is not mine.” He
      glances at the little yellow spirit, who is hovering over the lid. “It is not for him either.” Dādī smiles. “A good
      moment to learn how to say no.”
    hi: “क्या हम देख सकते हैं कि संदूक में क्या है?” आप पूछते हैं। मसाले वाला कहता है, “नहीं। यह बिकाऊ नहीं है। यह मेरा नहीं
      है।” वह पीले भूत की ओर देखता है, जो ढक्कन पर मँडरा रहा है। “इसके लिए भी नहीं।” दादी मुस्कुराती हैं। “नहीं कहना सीखने
      का अच्छा समय।”
  lines:
  - speaker: vanik
    sa: न विक्रेयम्।
    gloss:
      en: It is not for sale.
      hi: यह बिकाऊ नहीं है।
- id: t1
  kind: teach
  title:
    en: '{{न}} before the word'
    hi: शब्द से पहले {{न}}
  depth: core
  skills:
  - sent.negation
  body:
    en: To say “not”, put {{न}} before the word you deny, usually the verb. {{बालकः पठति}} (the boy reads), {{बालकः न पठति}}
      (the boy does not read).
    hi: ‘नहीं’ कहने के लिए जिस शब्द का निषेध करना हो, प्रायः क्रिया, उससे पहले {{न}} रखिए। {{बालकः पठति}} (बालक पढ़ता है),
      {{बालकः न पठति}} (बालक नहीं पढ़ता)।
  examples:
  - sa: बालकः न पठति।
    meaning:
      en: The boy does not read.
      hi: बालक नहीं पढ़ता।
    words:
    - sa: बालकः
      gloss:
        en: boy
        hi: बालक
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
    - sa: न
      gloss:
        en: not
        hi: नहीं
    - sa: पठति
      gloss:
        en: reads
        hi: पढ़ता है
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
  - sa: अहम् फलम् न खादामि।
    meaning:
      en: I do not eat a fruit.
      hi: मैं फल नहीं खाता।
    words:
    - sa: अहम्
      gloss:
        en: I
        hi: मैं
    - sa: फलम्
      gloss:
        en: fruit
        hi: फल
      check:
        type: subanta
        stem: फल
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Eka
    - sa: न
      gloss:
        en: not
        hi: नहीं
    - sa: खादामि
      gloss:
        en: eat
        hi: खाता हूँ
      check:
        type: tinanta
        dhatu: खाद्
        lakara: Lat
        purusha: Uttama
        vacana: Eka
  - sa: न अस्ति।
    meaning:
      en: There is not.
      hi: नहीं है।
    words:
    - sa: न
      gloss:
        en: not
        hi: नहीं
    - sa: अस्ति
      gloss:
        en: is
        hi: है
      check:
        type: tinanta
        dhatu: अस्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
  - sa: न विक्रेयम्।
    meaning:
      en: Not for sale.
      hi: बिकाऊ नहीं।
    words:
    - sa: न
      gloss:
        en: not
        hi: नहीं
    - sa: विक्रेयम्
      gloss:
        en: for sale
        hi: बिकाऊ

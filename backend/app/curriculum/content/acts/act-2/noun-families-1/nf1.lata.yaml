    success:
      en: “लतायाम्,” you say, and all along the third branch small blue flowers open, one after the other, as if the tree
        were counting. Vṛkṣaka stands whole, a full tree, his tags turning to leaves. “देवः, देवौ, देवाः,” he says in a green

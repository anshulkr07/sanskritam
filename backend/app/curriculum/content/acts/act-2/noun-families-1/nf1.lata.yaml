cards:
- id: s1
  kind: story
  title:
    en: The third branch
    hi: तीसरी शाखा
  depth: core
  image:
    brief: The tree of green mist with a third thick branch bowing toward the desk, tags rustling; Śuka scattering three tags
      with his wing and reading them aloud proudly; Dādī laughing; you copying into a notebook.
    alt:
      en: A parrot reads tags from the third branch of a tree of names
      hi: नामों के पेड़ की तीसरी शाखा के टैग पढ़ता तोता
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - vrikshaka
    place: pathashala
    ratio: '4:3'
    id: nf1-lata-s1
    text_in_image:
    - लता
    - लते
    - लताः
  narration:
    en: 'A third branch, thick with leaf-tags in a different rhythm, bows toward the desk. “The feminines in -आ,” says Dādī.
      Śuka scatters three tags with his wing and reads them back, pleased with himself. The tree of names is almost whole
      now: it has found its masculine, its neuter, and now its feminine.'
    hi: 'तीसरी शाखा, अलग लय में पत्ते-टैगों से लदी, मेज़ की ओर झुकती है। “-आ वाले स्त्रीलिंग,” दादी कहती हैं। शुक अपने पंख
      से तीन टैग बिखेरता है और उन्हें वापस पढ़ता है, अपने पर प्रसन्न। नामों का पेड़ अब लगभग पूरा है: उसे अपना पुंलिंग मिला,
      नपुंसक मिला, और अब स्त्रीलिंग।'
- id: t1
  kind: teach
  title:
    en: The feminine, लता
    hi: स्त्रीलिंग, लता
  depth: core
  skills:
  - noun.lata
  sutras:
  - 4.1.4
  - 7.3.106
  body:
    en: 'A feminine word in -{{आ}} has its own pattern: {{लता}} (first), {{लताम्}} (object), {{लतया}} (by), {{लतायै}} (to),
      {{लतायाः}} (from, of), {{लतायाम्}} (in), {{हे लते}} (call). The long {{आ}} runs through almost everything.'
    hi: '-{{आ}} वाले स्त्रीलिंग शब्द का अपना ढाँचा है: {{लता}} (प्रथमा), {{लताम्}} (कर्म), {{लतया}} (से), {{लतायै}} (को),
      {{लतायाः}} (से, का), {{लतायाम्}} (में), {{हे लते}} (पुकार)। दीर्घ {{आ}} लगभग सब जगह चलता है।'
  term:
    sa: आकारान्तम्
    meaning:
      en: a word ending in -आ
      hi: -आ पर समाप्त शब्द
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'A feminine word in -{{आ}} has its own pattern: {{लता}} (first), {{लताम्}} (object), {{लतया}} (by), {{लतायै}} (to),
        {{लतायाः}} (from, of), {{लतायाम्}} (in), {{हे लते}} (call). The long {{आ}} runs through almost everything.'
      hi: '-{{आ}} वाले स्त्रीलिंग शब्द का अपना ढाँचा है: {{लता}} (प्रथमा), {{लताम्}} (कर्म), {{लतया}} (से), {{लतायै}} (को),
        {{लतायाः}} (से, का), {{लतायाम्}} (में), {{हे लते}} (पुकार)। दीर्घ {{आ}} लगभग सब जगह चलता है।'

- id: pn
  kind: teach
  title:
    en: Why {{देवैः}}?
    hi: '{{देवैः}} क्यों?'
  depth: panini
  skills:
  - noun.deva
  sutras:
  - 7.1.9
  - 7.1.12
  body:
    en: 'Pāṇini''s sūtra 7.1.9, {{अतो भिस ऐस्}}, changes the ending {{भिस्}} to {{ऐस्}} after a word in -{{अ}}: {{देव}} + {{भिस्}} → {{देवैः}}. And 7.1.12 turns {{टा}} into {{इन}}, {{ङसि}} into {{आत्}} and {{ङस्}} into {{स्य}}: {{देवेन}}, {{देवात्}}, {{देवस्य}}.'
    hi: 'पाणिनि का सूत्र 7.1.9, {{अतो भिस ऐस्}}, -{{अ}} वाले शब्द के बाद {{भिस्}} को {{ऐस्}} कर देता है: {{देव}} + {{भिस्}} → {{देवैः}}। और 7.1.12 {{टा}} को {{इन}}, {{ङसि}} को {{आत्}} और {{ङस्}} को {{स्य}} बना देता है: {{देवेन}}, {{देवात्}}, {{देवस्य}}।'

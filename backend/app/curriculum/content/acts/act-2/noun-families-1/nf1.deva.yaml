- id: p5
  kind: practice
  title:
    en: The tree flowers
    hi: पेड़ में फूल आते हैं
  depth: core
  skills:
  - noun.deva
  mode: choice
  prompt:
    en: Which form is the same in the dual for the first, second and call?
    hi: द्विवचन में प्रथमा, द्वितीया और सम्बोधन में कौन-सा रूप एक ही है?
  explain:
    en: '{{देवौ}} fills three cells of the dual.'
    hi: '{{देवौ}} द्विवचन के तीन खाने भरता है।'
  roman: after
  gate: true
  story:
    success:
      en: “देवौ,” you say, and the green tree of names shivers. A small white flower opens on one branch. “देवाः,” you add, and a second blooms. Vṛkṣaka's trunk straightens, as if his name were beginning to hold.
      hi: “देवौ,” आप कहते हैं, और नामों का हरा पेड़ सिहरता है। एक शाखा पर एक नन्हा सफ़ेद फूल खिलता है। “देवाः,” आप जोड़ते हैं, और दूसरा खिलता है। वृक्षक का तना सीधा होता है, मानो उसका नाम टिकना शुरू हो गया हो।
    failure:
      en: 'The tree droops. Three cells share one form in the dual: the one with {{औ}}.'
      hi: 'पेड़ झुक जाता है। द्विवचन में तीन खाने एक रूप साझा करते हैं: {{औ}} वाला।'
  options:
  - sa: देवाभ्याम्
  - sa: देवयोः
  - correct: true
    sa: देवौ
- id: p6
  kind: practice
  depth: core
  skills:

- id: s1
  kind: story
  title:
    en: The school's library
    hi: पाठशाला का पुस्तकालय
  depth: core
  image:
    brief: 'The school library: tall shelves of palm-leaf bundles tied with coloured threads, a low reading desk with Dādī''s open notebook; beside the desk a small tree of green mist hung with tiny leaf-shaped name tags, standing up; you and Śuka looking on.'
    alt:
      en: A library with a small tree of green mist hung with name-tags standing beside a desk
      hi: नाम-पत्तों वाला हरे धुंध का नन्हा पेड़ पुस्तकालय में मेज़ के पास
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - vrikshaka
    place: pathashala
    ratio: '4:3'
    id: nf1-deva-s1
    text_in_image: ["देवः", "देवौ", "देवाः"]
  narration:
    en: 'In the Ācārya''s library, shelves of palm-leaf bundles rise to the rafters, each tied with a coloured thread. Dādī lays her notebook open on the low desk. “Here is a secret,” she says. “Words come in families. Once you know one member, you know thousands.” Beside the desk a small tree of green mist stands up, hung with tiny leaf-tags: names, all waiting.'
    hi: 'आचार्य के पुस्तकालय में ताड़पत्रों के गट्ठर कड़ियों तक ऊँचे रखे हैं, हर एक रंगीन धागे से बँधा। दादी अपनी कॉपी नीची मेज़ पर खोलती हैं। “एक रहस्य सुनो,” वे कहती हैं। “शब्द कुलों में आते हैं। एक सदस्य जान लिया, तो हज़ारों जान लिए।” मेज़ के पास हरे धुंध का एक नन्हा पेड़ खड़ा हो जाता है, जिस पर छोटे पत्ते-टैग टँगे हैं: नाम, सब प्रतीक्षा में।'
  lines:
  - speaker: dadi
    sa: पुस्तकालये शब्दरूपाणि सन्ति।
    gloss:
      en: In the library there are word-forms.
      hi: पुस्तकालय में शब्दरूप हैं।
- id: t1
  kind: teach
  title:
    en: One word, twenty-four forms
    hi: एक शब्द, चौबीस रूप
  depth: core
  skills:
  - noun.deva
  body:
    en: 'A word like {{देव}} has eight cases in three numbers: twenty-four forms. This table is the pattern of thousands of masculine words ending in -{{अ}}. Learn it once.'
    hi: '{{देव}} जैसे शब्द की आठ विभक्तियाँ तीन वचनों में होती हैं: चौबीस रूप। यह तालिका -{{अ}} पर समाप्त होने वाले हज़ारों पुंलिंग शब्दों का ढाँचा है। इसे एक बार सीख लीजिए।'
  term:
    sa: शब्दरूपम्
    meaning:
      en: the table of a word's forms
      hi: शब्द के रूपों की तालिका

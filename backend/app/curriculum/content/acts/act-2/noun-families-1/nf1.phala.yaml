  body:
    en: 'In a neuter the doer and the object look the same: {{फलम्}} can be the first case or the second. Context tells which:
      {{फलं पतति}} (the fruit falls), {{रामः फलं खादति}} (Rāma eats the fruit).'
    hi: 'नपुंसक में कर्ता और कर्म एक-से दिखते हैं: {{फलम्}} प्रथमा भी हो सकता है और द्वितीया भी। प्रसंग बताता है कि कौन-सा:
      {{फलं पतति}} (फल गिरता है), {{रामः फलं खादति}} (राम फल खाता है)।'

- id: s1
  kind: story
  title:
    en: The neuter branch
    hi: नपुंसक शाखा
  depth: core
  image:
    brief: The tree of green mist in the library with a second lower branch hung with a different set of leaf-tags, Dādī pointing
      to it with her pen and comparing it to the upper branch; Śuka on a shelf pulling at a tag.
    alt:
      en: A tree of name-tags with two branches, one pointing to the other
      hi: दो शाखाओं वाला नाम-पत्तों का पेड़, एक शाखा की ओर इशारा
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - vrikshaka
    place: pathashala
    ratio: '4:3'
    id: nf1-phala-s1
    text_in_image:
    - फलम्
    - फले
    - फलानि
  narration:
    en: On a lower branch of the green tree hangs a second set of leaf-tags, close to the first but a little different. “Neuters,”
      says Dādī. “Almost the same as the masculines. The family resemblance is strong, and only a few places differ.” Vṛkṣaka
      shakes a branch and the tags rustle, delighted.
    hi: हरे पेड़ की एक नीची शाखा पर पत्ते-टैगों का दूसरा समूह लटका है, पहले के क़रीब पर थोड़ा अलग। “नपुंसक,” दादी कहती हैं।
      “पुंलिंग से लगभग वही। पारिवारिक समानता गहरी है, बस कुछ जगहों पर अन्तर है।” वृक्षक एक शाखा हिलाता है और टैग ख़ुशी से
      सरसराते हैं।
- id: t1
  kind: teach
  title:
    en: The neuter, फल
    hi: नपुंसक, फल
  depth: core
  skills:
  - noun.phala
  sutras:
  - 7.1.19
  - 7.1.72
  body:
    en: 'A neuter word in -{{अ}} is like {{देव}} except where the doer and object come in: in the first, second and call cases,
      singular {{फलम्}}, dual {{फले}}, plural {{फलानि}}. All the other cells are the same as {{देव}}.'
    hi: '-{{अ}} वाला नपुंसक शब्द {{देव}} जैसा ही है, सिवाय कर्ता और कर्म वाली जगहों के: प्रथमा, द्वितीया और सम्बोधन में एकवचन
      {{फलम्}}, द्विवचन {{फले}}, बहुवचन {{फलानि}}। बाक़ी सब खाने {{देव}} जैसे हैं।'
  term:
    sa: नपुंसकम्
    meaning:
      en: neuter
      hi: नपुंसक
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:

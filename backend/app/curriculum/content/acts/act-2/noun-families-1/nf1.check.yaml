- id: p8
  kind: practice
  depth: core
  skills:
  - noun.deva
  mode: order
  prompt:
    en: 'Say it for the green tree: “A god, two gods, gods.”'
    hi: 'हरे पेड़ से कहिए: ‘एक देवता, दो देवता, अनेक देवता।’'
  explain:
    en: '{{देवः देवौ देवाः}}: the first case in three numbers.'
    hi: '{{देवः देवौ देवाः}}: प्रथमा तीन वचनों में।'
  roman: after
  gate: true
  story:
    success:
      en: '“देवः, देवौ, देवाः.” The tree of names bursts into leaf, every tag a green leaf, every leaf a name. Vṛkṣaka bows
        his crown of branches, and out of the rustling comes a clear voice: “देवः, देवौ, देवाः।” He tilts toward the shelves,
        where a trio of figures stands at the far end of the aisle: “कविः गुरुः पिता च सन्ति।”'
      hi: '“देवः, देवौ, देवाः।” नामों का पेड़ पत्तों से भर उठता है, हर टैग हरा पत्ता, हर पत्ता एक नाम। वृक्षक अपनी शाखाओं
        का मुकुट झुकाता है, और सरसराहट से एक साफ़ आवाज़ आती है: “देवः, देवौ, देवाः।” वह अलमारियों की ओर झुकता है, जहाँ गलियारे
        के दूर छोर पर तीन आकृतियाँ खड़ी हैं: “कविः गुरुः पिता च सन्ति।”'
    failure:
      en: The tree waits. The same word, in three numbers.
      hi: पेड़ प्रतीक्षा करता है। वही शब्द, तीन वचनों में।
  tokens:

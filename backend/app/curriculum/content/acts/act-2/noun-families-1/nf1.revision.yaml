  - skill: noun.deva
    rule:
      en: 'The call: {{देव}} stays {{देव}}. {{सर्व}} and a few pronoun-like words (like {{सर्व}}, {{विश्व}}, {{अन्य}}) take
        {{स्मै}}, {{स्मात्}}, {{स्मिन्}} in the singular: {{सर्वस्मै}}.'
      hi: 'पुकार: {{देव}} वैसा ही रहता है। {{सर्व}} और कुछ सर्वनाम-जैसे शब्द ({{सर्व}}, {{विश्व}}, {{अन्य}}) एकवचन में {{स्मै}},
        {{स्मात्}}, {{स्मिन्}} लेते हैं: {{सर्वस्मै}}।'
    example:

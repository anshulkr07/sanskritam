  kind: revision
  title:
    en: Quick sheet
    hi: एक नज़र में
  depth: core
  section: quick_sheet
  rows:
  - skill: noun.deva
    formula: ः औ आः · म् औ आन् · एन आभ्याम् ऐः
    rule:

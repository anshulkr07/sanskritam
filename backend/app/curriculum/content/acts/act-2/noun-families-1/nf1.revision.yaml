      explanation:
        en: 'A neuter word in -{{अ}} is like {{देव}} except where the doer and object come in: in the first, second and call
          cases, singular {{फलम्}}, dual {{फले}}, plural {{फलानि}}. All the other cells are the same as {{देव}}.'
        hi: '-{{अ}} वाला नपुंसक शब्द {{देव}} जैसा ही है, सिवाय कर्ता और कर्म वाली जगहों के: प्रथमा, द्वितीया और सम्बोधन में

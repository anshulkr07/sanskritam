    - 2.3.28
    tag: core
    taught_in: from.away#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 1.4.24, {{ध्रुवमपायेऽपादानम्}}: when two things move apart, the fixed one is the source. A leaf falls from
          a tree; the tree stays. Sūtra 2.3.28 gives the source the fifth case.'
        hi: 'सूत्र 1.4.24, {{ध्रुवमपायेऽपादानम्}}: जब दो वस्तुएँ अलग होती हैं तो स्थिर रहने वाली स्रोत है। पत्ता पेड़ से गिरता
          है; पेड़ वहीं रहता है। सूत्र 2.3.28 स्रोत को पञ्चमी देता है।'
      items:
      - id: i0
        sa: ध्रुवमपायेऽपादानम्

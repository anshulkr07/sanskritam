- id: s1
  kind: story
  title:
    en: The storm
    hi: आँधी
  depth: core
  image:
    brief: 'A sudden storm at the river: leaves torn from the neem trees, boats straining at their ropes, children running toward the school, the old Ācārya waving everyone away from the water; in the whirl of wind a swirling grey-green spirit made of leaves and gust dancing.'
    alt:
      en: A storm sweeps the riverbank as everyone runs for the school
      hi: नदी तट पर आँधी और पाठशाला की ओर भागते सब लोग
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - vayuka
    place: naditira
    ratio: '4:3'
    id: from-away-s1
  narration:
    en: 'The sky turns the colour of slate. A roaring wind tears down the river: leaves rip from the neem trees, the boats strain at their ropes, children run for the school. The Ācārya shouts: “From the river! Come away from the river!” In the middle of the whirl dances a grey-green spirit made of leaves and wind.'
    hi: 'आकाश स्लेटी रंग का हो जाता है। एक गर्जता पवन नदी पर टूट पड़ता है: नीम के पेड़ों से पत्ते टूटकर उड़ते हैं, नावें रस्सियों पर तनती हैं, बच्चे पाठशाला की ओर भागते हैं। आचार्य चिल्लाते हैं: “नदी से! नदी से दूर आओ!” भँवर के बीच पत्तों और हवा से बना एक धूसर-हरा भूत नाचता है।'
  lines:
  - speaker: acarya
    sa: नद्याः आगच्छत!
    gloss:
      en: Come away from the river!
      hi: नदी से दूर आओ!
- id: t1
  kind: teach
  title:
    en: 'Away from: the fifth case'
    hi: 'से दूर: पञ्चमी'
  depth: core
  skills:
  - case.abl
  sutras:
  - 2.3.28
  - 1.4.24
  body:
    en: 'The point something moves away from takes the fifth case, {{पञ्चमी}}, the source ({{अपादानम्}}): {{वृक्षात् पत्रं पतति}} (a leaf falls from the tree), {{ग्रामात् आगच्छति}} (he comes from the village).'
    hi: 'जहाँ से कोई चीज़ अलग होती है वह पञ्चमी में आता है, अपादान: {{वृक्षात् पत्रं पतति}} (पेड़ से पत्ता गिरता है), {{ग्रामात् आगच्छति}} (वह गाँव से आता है)।'
  examples:
  - sa: वृक्षात् पत्रम् पतति।
    meaning:
      en: A leaf falls from the tree.
      hi: पेड़ से पत्ता गिरता है।
    words:
    - sa: वृक्षात्
      gloss:
        en: from the tree
        hi: पेड़ से
      check:
        type: subanta
        stem: वृक्ष
        linga: Pum
        vibhakti: Panchami
        vacana: Eka
    - sa: पत्रम्
      gloss:
        en: leaf
        hi: पत्ता
      check:
        type: subanta
        stem: पत्र
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Eka
    - sa: पतति
      gloss:
        en: falls
        hi: गिरता है
      check:
        type: tinanta
        dhatu: पत्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
  - sa: बालकः ग्रामात् आगच्छति।
    meaning:
      en: The boy comes from the village.
      hi: बालक गाँव से आता है।
    words:
    - sa: बालकः
      gloss:
        en: boy
        hi: बालक
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
    - sa: ग्रामात्
      gloss:
        en: from the village
        hi: गाँव से
      check:
        type: subanta
        stem: ग्राम
        linga: Pum
        vibhakti: Panchami
        vacana: Eka
    - sa: आगच्छति
      gloss:
        en: comes
        hi: आता है
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
        prefixes:
        - आ
  - sa: सः नद्याः जलम् गृह्णाति।
    meaning:
      en: He takes water from the river.
      hi: वह नदी से जल लेता है।
    words:
    - sa: सः
      gloss:
        en: he
        hi: वह
    - sa: नद्याः
      gloss:
        en: from the river
        hi: नदी से
      check:
        type: subanta
        stem: नदी
        linga: Stri
        vibhakti: Panchami
        vacana: Eka
    - sa: जलम्
      gloss:
        en: water
        hi: जल
      check:
        type: subanta
        stem: जल
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Eka
    - sa: गृह्णाति
      gloss:
        en: takes
        hi: लेता है
      check:
        type: tinanta
        dhatu: ग्रह्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
  term:
    sa: पञ्चमी
    meaning:
      en: 'the fifth case: from'
      hi: 'पाँचवीं विभक्ति: से (अलग होना)'

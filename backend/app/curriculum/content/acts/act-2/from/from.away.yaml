- id: p3
  kind: practice
  title:
    en: Away from the river
    hi: नदी से दूर
  depth: core
  skills:
  - case.abl
  mode: order
  prompt:
    en: 'Shout like the Ācārya: “The children come from the river!”'
    hi: 'आचार्य की तरह पुकारिए: ‘बच्चे नदी से आते हैं!’'
  explain:
    en: '{{बालकाः नद्याः आगच्छन्ति}}: the river is the source.'
    hi: '{{बालकाः नद्याः आगच्छन्ति}}: नदी स्रोत है।'
  roman: after
  gate: true
  story:
    success:
      en: “बालकाः नद्याः आगच्छन्ति!” you shout, and the last children dash up the bank into the school. The grey-green spirit whirls once around you, tugging at your hair, and the wind becomes a laugh.
      hi: “बालकाः नद्याः आगच्छन्ति!” आप चिल्लाते हैं, और आख़िरी बच्चे किनारे से दौड़कर पाठशाला में पहुँच जाते हैं। धूसर-हरा भूत एक बार आपके चारों ओर घूमकर आपके बाल खींचता है, और हवा हँसी बन जाती है।
    failure:
      en: 'The wind pushes you back. The river is where they come from: put it in the fifth case.'
      hi: 'हवा आपको पीछे धकेलती है। नदी वह है जहाँ से वे आते हैं: उसे पञ्चमी में रखिए।'
  tokens:
  - बालकाः
  - नद्याः
  - आगच्छन्ति
- id: pn
  kind: teach
  title:
    en: Pāṇini's source
    hi: पाणिनि का अपादान
  depth: panini
  skills:
  - case.abl
  sutras:
  - 1.4.24
  - 2.3.28
  body:
    en: 'Sūtra 1.4.24, {{ध्रुवमपायेऽपादानम्}}: when two things move apart, the fixed one is the source. A leaf falls from a tree; the tree stays. Sūtra 2.3.28 gives the source the fifth case.'
    hi: 'सूत्र 1.4.24, {{ध्रुवमपायेऽपादानम्}}: जब दो वस्तुएँ अलग होती हैं तो स्थिर रहने वाली स्रोत है। पत्ता पेड़ से गिरता है; पेड़ वहीं रहता है। सूत्र 2.3.28 स्रोत को पञ्चमी देता है।'
  term:
    sa: अपादानम्
    meaning:
      en: the fixed point things move away from
      hi: 'अपादान: स्थिर बिन्दु जिससे वस्तुएँ दूर होती हैं'
- id: sum
  kind: summary
  title:
    en: From
    hi: से
  depth: core
  points:
  - sa: वृक्षात् · ग्रामात् · नद्याः
    text:
      en: 'The fifth case: the source.'
      hi: 'पञ्चमी: स्रोत।'
  - sa: आत् · आयाः · याः
    text:
      en: The singular endings.
      hi: एकवचन प्रत्यय।
  - text:
      en: The source stays; the other thing moves.
      hi: स्रोत स्थिर रहता है; दूसरी वस्तु हटती है।

  note:
    en: 'Masculine and neuter -अ: {{आत्}}. Feminine -आ: {{आयाः}}. Feminine -ई: {{ई}} → {{याः}}. Feminine fifth looks like the sixth case.'
    hi: पुंलिंग और नपुंसक -अ में {{आत्}}। स्त्रीलिंग -आ में {{आयाः}}। स्त्रीलिंग -ई में {{ई}} → {{याः}}। स्त्रीलिंग पञ्चमी षष्ठी जैसी दिखती है।

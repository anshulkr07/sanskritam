- id: p8
  kind: practice
  depth: core
  skills:
  - case.abl-fear-compare
  - case.abl
  mode: order
  prompt:
    en: 'Tell the wind spirit: “I fear the storm. I go from the river to the house.” Start with fear.'
    hi: 'पवन-भूत से कहिए: ‘मैं आँधी से डरता हूँ।’'
  explain:
    en: '{{अहं झञ्झावातात् बिभेमि}}: the storm is what is feared.'
    hi: '{{अहं झञ्झावातात् बिभेमि}}: आँधी वह है जिससे डर है।'
  roman: after
  gate: true
  story:
    success:
      en: '“अहं झञ्झावातात् बिभेमि,” you say. The wind spirit, hearing a name for what you fear, stops being the storm and becomes a grey-green breeze, laughing. “ग्रामात् ग्रामं गच्छामि,” he sings, spinning away over the thatch, and ends on a word as soft as a leaf falling: “आचार्यस्य गृहम् अस्ति.”'
      hi: '“अहं झञ्झावातात् बिभेमि,” आप कहते हैं। पवन-भूत, जिससे आप डरते हैं उसका नाम सुनकर, आँधी होना छोड़ देता है और धूसर-हरा समीर बनकर हँसता है। “ग्रामात् ग्रामं गच्छामि,” वह गाता है, छप्परों के ऊपर घूमता हुआ, और गिरते पत्ते जैसे कोमल शब्द पर रुकता है: “आचार्यस्य गृहम् अस्ति।”'
    failure:
      en: The wind keeps howling. What you fear, {{झञ्झावातात्}}, takes the fifth case.
      hi: पवन गरजता रहता है। जिससे डर है, {{झञ्झावातात्}}, वह पञ्चमी लेता है।
  tokens:
  - अहम्
  - झञ्झावातात्
  - बिभेमि

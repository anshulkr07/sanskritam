      en: '“अहं झञ्झावातात् बिभेमि,” you say. The wind spirit, hearing a name for what you fear, stops being the storm and
        becomes a grey-green breeze, laughing. “ग्रामात् ग्रामं गच्छामि,” he sings, spinning away over the thatch, and ends
        on a word as soft as a leaf falling: “आचार्यस्य गृहम् अस्ति.”'
      hi: '“अहं झञ्झावातात् बिभेमि,” आप कहते हैं। पवन-भूत, जिससे आप डरते हैं उसका नाम सुनकर, आँधी होना छोड़ देता है और धूसर-हरा
        समीर बनकर हँसता है। “ग्रामात् ग्रामं गच्छामि,” वह गाता है, छप्परों के ऊपर घूमता हुआ, और गिरते पत्ते जैसे कोमल शब्द

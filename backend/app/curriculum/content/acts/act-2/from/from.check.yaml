id: from.check
template: check
title:
  en: Away from the storm
  hi: आँधी से दूर
title_sa: परीक्षा
minutes: 4
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - case.abl
  mode: choice
  prompt:
    en: “From the village.” Which word?
    hi: ‘गाँव से।’ कौन-सा शब्द?
  explain:
    en: 'The source: fifth case.'
    hi: 'स्रोत: पञ्चमी।'
  roman: after
  options:
  - sa: ग्रामः
  - sa: ग्रामम्
  - correct: true
    sa: ग्रामात्
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: वृक्षात् पत्रम् पतति।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: A leaf falls from the tree.
        hi: पेड़ से पत्ता गिरता है।
      words:
      - sa: वृक्षात्
        gloss:
          en: from the tree
          hi: पेड़ से
        check:
          type: subanta
          stem: वृक्ष
          linga: Pum
          vibhakti: Panchami
          vacana: Eka
      - sa: पत्रम्
        gloss:
          en: leaf
          hi: पत्ता
        check:
          type: subanta
          stem: पत्र
          linga: Napumsaka
          vibhakti: Prathama
          vacana: Eka
      - sa: पतति
        gloss:
          en: falls
          hi: गिरता है
        check:
          type: tinanta
          dhatu: पत्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
    - id: i1
      sa: वृक्षात्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: from the tree
        hi: पेड़ से
      check:
        type: subanta
        stem: वृक्ष
        linga: Pum
        vibhakti: Panchami
        vacana: Eka
      feature:
        en: 'Stem: {{वृक्ष}} · masculine · {{पञ्चमी}} · singular'
        hi: 'प्रातिपदिक: {{वृक्ष}} · {{पुंलिंग}} · {{पञ्चमी}} · {{एकवचन}}'
      image:
        id: teaching-tree
        brief: 'Use case: scientific-educational. Square 1:1 Sanskrit vocabulary illustration. Refined Indian watercolor with
          restrained gouache on warm ivory paper, muted ochre, sage and indigo, soft natural light. One clear central subject,
          whole and uncropped, recognizable at 160px. Plain quiet background. No labels, lettering, symbols, decorative border
          or watermark. One complete mature green banyan tree with visible trunk, spreading branches, canopy and a small patch
          of ground. No people, animals, fruit, hanging objects or lettering.'
        alt: &id001
          en: One whole banyan tree
          hi: एक पूरा बरगद का वृक्ष
        ratio: '1:1'
        text_in_image: &id002 []
      compare_from: वृक्ष
    - id: i2
      sa: पत्रम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: leaf
        hi: पत्ता
      check:
        type: subanta
        stem: पत्र
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{पत्र}} · neuter · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{पत्र}} · {{नपुंसकलिंग}} · {{प्रथमा}} · {{एकवचन}}'
      compare_from: पत्र
    - id: i3
      sa: पतति
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: falls
        hi: गिरता है
      check:
        type: tinanta
        dhatu: पत्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
      feature:
        en: 'Root: {{पत्}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{पत्}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
      compare_from: पत्
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'The point something moves away from takes the fifth case, {{पञ्चमी}}, the source ({{अपादानम्}}): {{वृक्षात् पत्रं
          पतति}} (a leaf falls from the tree), {{ग्रामात् आगच्छति}} (he comes from the village).'
        hi: 'जहाँ से कोई चीज़ अलग होती है वह पञ्चमी में आता है, अपादान: {{वृक्षात् पत्रं पतति}} (पेड़ से पत्ता गिरता है),
          {{ग्रामात् आगच्छति}} (वह गाँव से आता है)।'
    - id: i6
      sa: वृक्षात् पत्रम् पतति।
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: A leaf falls from the tree.
        hi: पेड़ से पत्ता गिरता है।
      words:
      - sa: वृक्षात्
        gloss:
          en: from the tree
          hi: पेड़ से
        check:
          type: subanta
          stem: वृक्ष
          linga: Pum
          vibhakti: Panchami
          vacana: Eka
      - sa: पत्रम्

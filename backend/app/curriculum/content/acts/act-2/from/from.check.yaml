          en: leaf
          hi: पत्ता
        check:
          type: subanta
          stem: पत्र
          linga: Napumsaka
          vibhakti: Prathama
          vacana: Eka
      - sa: पतति
        gloss:
          en: falls
          hi: गिरता है
        check:
          type: tinanta
          dhatu: पत्
          lakara: Lat
          purusha: Prathama
          vacana: Eka

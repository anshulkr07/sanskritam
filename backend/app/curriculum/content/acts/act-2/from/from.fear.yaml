cards:
- id: s1
  kind: story
  title:
    en: Inside the school
    hi: पाठशाला के भीतर
  depth: core
  image:
    brief: Children huddled together in a lamplit school hall while a storm hammers the shutters, a small girl clinging to
      the old Ācārya who sits among them; at the window a grinning grey-green spirit pressing its face against the shutter
      slats.
    alt:
      en: Children huddle in a school hall during a storm with a grinning wind spirit at the window
      hi: आँधी में पाठशाला के कक्ष में दुबके बच्चे और खिड़की पर मुस्कुराता पवन-भूत
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - vayuka
    place: pathashala
    ratio: '4:3'
    id: from-fear-s1
  narration:
    en: 'Everyone crowds into the school hall as the storm hammers the shutters. Children huddle. A small girl whispers: “I
      am afraid of the thunder.” The Ācārya sits down among them. “What you fear, Sanskrit puts in the fifth case, as if you
      were backing away from it.” Outside, the wind spirit presses a grinning face to the window.'
    hi: आँधी खिड़कियों के किवाड़ों पर प्रहार करती है और सब पाठशाला के कक्ष में सिमट आते हैं। बच्चे दुबक जाते हैं। एक नन्ही
      बालिका फुसफुसाती है, “मुझे बादल की गड़गड़ाहट से डर लगता है।” आचार्य उनके बीच बैठ जाते हैं। “जिससे डरो उसे संस्कृत पञ्चमी
      में रखती है, मानो तुम उससे पीछे हट रहे हो।” बाहर पवन-भूत खिड़की पर मुस्कुराता चेहरा सटा देता है।
- id: t1
  kind: teach
  title:
    en: What you fear
    hi: जिससे डर लगे
  depth: core
  skills:
  - case.abl-fear-compare
  sutras:
  - 1.4.25
  body:
    en: 'With verbs of fear and protection, the thing feared or guarded against stands in the fifth case: {{व्याघ्रात् बिभेति}}
      (he fears the tiger), {{बालकं सर्पात् रक्षति}} (he protects the boy from the snake).'
    hi: 'भय और रक्षा की क्रियाओं के साथ जिससे भय हो या रक्षा की जाए वह पञ्चमी में आता है: {{व्याघ्रात् बिभेति}} (वह बाघ से
      डरता है), {{बालकं सर्पात् रक्षति}} (वह बालक को साँप से बचाता है)।'
  examples:

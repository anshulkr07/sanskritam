- id: t2
  kind: teach
  title:
    en: Better than
    hi: से बढ़कर
  depth: core
  skills:
  - case.abl-fear-compare
  sutras:
  - 2.3.42
  body:
    en: 'To say “more than”, put the thing compared with in the fifth case and add {{तर}} to the quality: {{रामात् श्यामः
      दीर्घतरः}}, “Śyāma is taller than Rāma”. The ending {{तर}} means “more”.'
    hi: '‘से अधिक’ कहने के लिए जिससे तुलना हो उसे पञ्चमी में रखिए और गुण में {{तर}} जोड़िए: {{रामात् श्यामः दीर्घतरः}}, ‘श्याम
      राम से लम्बा है’। प्रत्यय {{तर}} का अर्थ ‘अधिक’ है।'
  examples:
  - sa: रामात् श्यामः दीर्घतरः।
    meaning:

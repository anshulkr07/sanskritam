- id: s1
  kind: story
  title:
    en: Not alone
    hi: अकेले नहीं
  depth: core
  image:
    brief: The boat on a widening river with you, Dādī with her pen, Śuka on the awning and the boatman, the small boat-shaped spirit circling the boat; Dādī lifting one finger as if teaching.
    alt:
      en: A boat with friends aboard on a widening river with a small spirit circling it
      hi: चौड़ी होती नदी में दोस्तों वाली नाव और उसके चारों ओर घूमता नन्हा भूत
    cast:
    - you
    - dadi
    - shuka
    - navika
    - tarika
    place: nauka
    ratio: '4:3'
    id: with-together-s1
  narration:
    en: The river widens. Tarikā circles your boat, curious. “With whom do you go?” the boatman asks. “With Dādī, with Śuka, with a friend,” you say, counting. Dādī lifts a finger. “For ‘together with’ Sanskrit uses the third case again, and a small word that means ‘with’.”
    hi: नदी चौड़ी होती है। तरिका जिज्ञासा से आपकी नाव का चक्कर लगाती है। नाविक पूछता है, “किसके साथ जा रहे हो?” “दादी के साथ, शुक के साथ, एक मित्र के साथ,” आप गिनकर कहते हैं। दादी एक उँगली उठाती हैं। “‘के साथ’ के लिए संस्कृत फिर तृतीया लेती है, और ‘साथ’ का एक छोटा शब्द।”
- id: t1
  kind: teach
  title:
    en: '{{सह}} and the third case'
    hi: '{{सह}} और तृतीया'
  depth: core
  skills:
  - case.inst-saha
  body:
    en: 'To say “together with”, use the third case and the little word {{सह}}: {{मित्रेण सह}} (with a friend), {{शुकेन सह}}. The person you accompany stands in the third case.'
    hi: '‘के साथ’ कहने के लिए तृतीया और छोटा शब्द {{सह}} लगाइए: {{मित्रेण सह}} (मित्र के साथ), {{शुकेन सह}}। जिसके साथ जाते हैं वह तृतीया में आता है।'
  examples:
  - sa: अहम् मित्रेण सह गच्छामि।
    meaning:
      en: I go together with a friend.
      hi: मैं मित्र के साथ जाता हूँ।
    words:
    - sa: अहम्
      gloss:
        en: I
        hi: मैं
    - sa: मित्रेण
      gloss:
        en: with a friend
        hi: मित्र के साथ
      check:
        type: subanta
        stem: मित्र
        linga: Napumsaka
        vibhakti: Trtiya
        vacana: Eka
    - sa: सह
      gloss:
        en: together with
        hi: साथ
    - sa: गच्छामि
      gloss:
        en: go
        hi: जाता हूँ
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Uttama
        vacana: Eka
  - sa: बालिका शुकेन सह क्रीडति।
    meaning:
      en: The girl plays with the parrot.
      hi: बालिका तोते के साथ खेलती है।
    words:

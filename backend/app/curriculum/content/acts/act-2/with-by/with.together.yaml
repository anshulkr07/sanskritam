- id: p3
  kind: practice
  title:
    en: Together
    hi: साथ-साथ
  depth: core
  skills:
  - case.inst-saha
  mode: order
  prompt:
    en: 'Say: “I go with the parrot.”'
    hi: 'कहिए: ‘मैं तोते के साथ जाता हूँ।’'
  explain:
    en: '{{अहं शुकेन सह गच्छामि}}.'
    hi: '{{अहं शुकेन सह गच्छामि}}।'
  roman: after
  gate: true
  story:
    success:
      en: '“अहं शुकेन सह गच्छामि,” you say, and Śuka, offended at being called a travelling companion, puffs up: “मित्रेण सह! मित्रेण सह!” Tarikā laughs: a bell-like sound that skims across the river.'
      hi: '“अहं शुकेन सह गच्छामि,” आप कहते हैं, और शुक, यात्रा-साथी कहे जाने पर नाराज़ होकर फूल उठता है: “मित्रेण सह! मित्रेण सह!” तरिका हँसती है: घंटी-सी ध्वनि जो नदी पर तैरती चली जाती है।'
    failure:
      en: Śuka ruffles his feathers. {{सह}} comes after the third-case word.
      hi: शुक पंख फड़फड़ाता है। {{सह}} तृतीया वाले शब्द के बाद आता है।
  tokens:
  - अहम्
  - शुकेन
  - सह
  - गच्छामि
- id: pn
  kind: teach
  title:
    en: '{{सह}} or {{सार्धम्}}'
    hi: '{{सह}} या {{सार्धम्}}'
  depth: panini
  skills:
  - case.inst-saha
  body:
    en: '{{सह}} may be replaced by {{सार्धम्}} or {{साकम्}} with the same meaning, and the third case can even stand alone: {{मित्रेण गच्छामि}}. Poets use all of these freely.'
    hi: '{{सह}} की जगह {{सार्धम्}} या {{साकम्}} आ सकते हैं, अर्थ वही; और तृतीया अकेली भी चल सकती है: {{मित्रेण गच्छामि}}। कवि इन सबको खुलकर बरतते हैं।'
  examples:
  - sa: मित्रेण सार्धम्
    meaning:
      en: together with a friend
      hi: मित्र के साथ
  - sa: मित्रेण साकम्
    meaning:
      en: together with a friend
      hi: मित्र के साथ
- id: sum
  kind: summary
  title:

- id: mistakes
  kind: revision
  title:
    en: Common mistakes
    hi: आम भूलें
  depth: core
  section: mistakes
  rows:
  - skill: case.inst-saha
    rule:
      en: 'Do not put the companion in the first case: {{मित्रेण सह}}, not {{मित्रः सह}}.'
      hi: 'साथी को प्रथमा में मत रखिए: {{मित्रेण सह}}, {{मित्रः सह}} नहीं।'
    tag: core
    taught_in: with.together#t1
  - skill: case.inst
    rule:
      en: 'Do not look for a word for “by” or “with”: the ending {{एन}}/{{अया}} already says it.'
      hi: '‘से’ या ‘के द्वारा’ के लिए शब्द मत खोजिए: प्रत्यय {{एन}}/{{अया}} वही कहता है।'
    tag: core
    taught_in: with.means#t1
- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: case.inst
    rule:
      en: '{{साधकतमं करणम्}}: the instrument is the most effective means; {{कर्तृकरणयोस्तृतीया}}: it takes the third case.'
      hi: '{{साधकतमं करणम्}}: करण सबसे प्रभावी साधन है; {{कर्तृकरणयोस्तृतीया}}: वह तृतीया लेता है।'
    sutras:
    - 1.4.42
    - 2.3.18
    tag: core
    taught_in: with.means#pn

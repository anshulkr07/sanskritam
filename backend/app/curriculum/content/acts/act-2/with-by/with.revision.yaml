- id: conditions
  kind: revision
  title:
    en: When it applies
    hi: कब लागू होता है
  depth: core
  section: conditions
  rows:
  - skill: case.inst
    rule:
      en: 'Pairs go dual: {{नेत्राभ्याम्}}, {{हस्ताभ्याम्}}; the same ending {{आभ्याम्}} serves all three genders.'
      hi: 'जोड़े द्विवचन में चलते हैं: {{नेत्राभ्याम्}}, {{हस्ताभ्याम्}}; तीनों लिंगों में वही प्रत्यय {{आभ्याम्}}।'
    tag: good
    taught_in: with.means#t2

  - skill: case.inst-saha
    formula: मित्रेण सह
    rule:
      en: “Together with” is the third case plus {{सह}}.
      hi: ‘के साथ’ तृतीया और {{सह}} से बनता है।
    tag: core
    taught_in: with.together#t1
    visuals:
    - id: v-linked-2
      kind: reading
      title:
        en: A companion is not a tool
        hi: साथी और साधन अलग सम्बन्ध हैं
      explanation:
        en: Imagine the boy in ochre saying this. सह includes the companion; it does not turn the first-person singular verb
          into a plural.
        hi: मान लें कि केसरिया कपड़े वाला बालक यह कह रहा है। सह साथी को जोड़ता है; इससे उत्तमपुरुष एकवचन की क्रिया बहुवचन
          नहीं हो जाती।
      items:
      - id: i0
        sa: अहम् मित्रेण सह गच्छामि।
        meaning:
          en: I go together with a friend.
          hi: मैं मित्र के साथ जाता हूँ।
        words:
        - sa: अहम्
          gloss:
            en: I
            hi: मैं
        - sa: मित्रेण
          gloss:
            en: with a friend
            hi: मित्र के साथ
          check:
            type: subanta
            stem: मित्र
            linga: Napumsaka
            vibhakti: Trtiya
            vacana: Eka
        - sa: सह
          gloss:
            en: together with
            hi: साथ
        - sa: गच्छामि
          gloss:
            en: go
            hi: जाता हूँ
          check:
            type: tinanta
            dhatu: गम्
            lakara: Lat
            purusha: Uttama
            vacana: Eka
        image:
          id: teaching-walk-friend
          brief: 'Use case: scientific-educational. One 4:3 landscape Sanskrit teaching illustration. Refined Indian watercolor
            with restrained gouache on warm ivory paper, quiet ochre, sage and muted indigo. Complete central people and objects,
            no cropped bodies, simple quiet courtyard backdrop, readable on a phone. No decorative border, watermark, extra
            people or letterlike marks. Exactly two school-age boys walking together side by side, both in profile toward
            the right, one in an ochre kurta and the friend in a muted indigo kurta. Both face and step right, relaxed friendly
            expressions. They are companions; neither pushes, pulls, carries or leads the other. No carried objects, writing,
            symbols or arrows.'
          alt:
            en: Two friends walk together
            hi: साथ चलते दो मित्र
          ratio: '4:3'
          text_in_image: []

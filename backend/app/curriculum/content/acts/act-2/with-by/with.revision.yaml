      hi: '{{साधकतमं करणम्}}: करण सबसे प्रभावी साधन है; {{कर्तृकरणयोस्तृतीया}}: वह तृतीया लेता है।'
    sutras:
    - 1.4.42
    - 2.3.18
    tag: core
    taught_in: with.means#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 1.4.42, {{साधकतमं करणम्}}, calls the tool “the most effective means” of an action. Sūtra 2.3.18 puts the
          tool, and the doer of a passive verb, in the third case.
        hi: सूत्र 1.4.42, {{साधकतमं करणम्}}, उपकरण को क्रिया का ‘सबसे प्रभावी साधन’ कहता है। सूत्र 2.3.18 साधन को, और कर्मवाच्य
          के कर्ता को, तृतीया में रखता है।
      items:
      - id: i0
        sa: साधकतमं करणम्

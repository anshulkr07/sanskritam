            type: tinanta
            dhatu: लिख्
            lakara: Lat
            purusha: Prathama
            vacana: Eka
        image:
          id: teaching-girl-writes
          brief: 'Use case: scientific-educational. One 4:3 landscape Sanskrit teaching illustration. Refined Indian watercolor
            and restrained gouache on warm ivory paper, quiet ochre, sage and muted indigo. Exactly one complete person, compact
            central grouping readable at 320px phone width, very simple quiet courtyard background. No other people, reflections,
            letterlike decoration, border or watermark. A school-age girl in a simple muted indigo dress sits at a low desk
            actively writing with a reed pen on one large ivory sheet. Her pen touches the single large exact Devanagari character
            "अ" on that page. That is the ONLY visible writing. No other strokes, squiggles, letters or marks anywhere. The
            hand, pen, inkpot, page and character must be clear. This teaches writing and the use of a pen.'
          alt:
            en: A girl writes अ with a pen
            hi: लेखनी से अ लिखती बालिका
          ratio: '4:3'
          text_in_image:
          - अ

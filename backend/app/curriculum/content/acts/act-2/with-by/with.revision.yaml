  rows:
  - skill: case.inst
    formula: नौकया · दण्डेन · सुखेन
    rule:
      en: The means, tool or manner takes the third case.
      hi: साधन, उपकरण या ढंग तृतीया में आता है।
    sutras:
    - 2.3.18
    - 1.4.42
    tag: core
    taught_in: with.means#t1
  - skill: case.inst
    formula: बालकेन · बालिकया · नद्या
    rule:
      en: 'Singular endings: {{एन}} (masculine, neuter -अ), {{अया}} (feminine -आ), {{या}} (feminine -ई).'
      hi: 'एकवचन प्रत्यय: {{एन}} (पुंलिंग, नपुंसक -अ), {{अया}} (स्त्रीलिंग -आ), {{या}} (स्त्रीलिंग -ई)।'
    tag: core
    taught_in: with.means#tb1
  - skill: case.inst-saha
    formula: मित्रेण सह
    rule:
      en: “Together with” is the third case plus {{सह}}.
      hi: ‘के साथ’ तृतीया और {{सह}} से बनता है।
    tag: core
    taught_in: with.together#t1
  - skill: case.inst-saha
    formula: मित्रैः सह
    rule:
      en: 'Plural companions: {{ऐः}} for masculine and neuter -अ, {{भिः}} for feminine.'
      hi: 'अनेक साथी: पुंलिंग और नपुंसक -अ में {{ऐः}}, स्त्रीलिंग में {{भिः}}।'
    example:
      sa: मित्रैः
      meaning:
        en: with friends
        hi: मित्रों के साथ
      check:
        type: subanta
        stem: मित्र
        linga: Napumsaka
        vibhakti: Trtiya
        vacana: Bahu

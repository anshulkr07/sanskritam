cards:
- id: s1
  kind: story
  title:
    en: Downstream
    hi: धारा के साथ
  depth: core
  image:
    brief: A wooden river boat gliding downstream with you, Dādī, Śuka and the boatman poling it, the spice seller waving
      from the bank; Dādī writing with a reed pen in her notebook; beside the boat a small pale-blue spirit shaped like a
      curved boat riding the current.
    alt:
      en: A boat gliding downstream with a small boat-shaped spirit riding beside it
      hi: धारा में चलती नाव और उसके बगल में नाव के आकार का नन्हा भूत
    cast:
    - you
    - dadi
    - shuka
    - navika
    - tarika
    place: nauka
    ratio: '4:3'
    id: with-means-s1
    text_in_image:
    - सा लेखन्या लिखति।
  narration:
    en: 'The boat glides out into the current, the spice seller waving from the bank. Dādī writes in her notebook with a thin
      reed pen. The boatman pushes off with his long pole. Śuka cracks a seed with his beak. Beside the boat rides a pale
      blue wisp shaped like a little boat itself: Tarikā. “How is each thing done?” asks Dādī. “By what means?”'
    hi: 'नाव धारा में सरकती है, तट से मसाले वाला हाथ हिलाता है। दादी अपनी कॉपी में पतली सरकंडे की कलम से लिखती हैं। नाविक
      लम्बी डंडी से नाव धकेलता है। शुक चोंच से बीज तोड़ता है। नाव के बगल में नन्ही नाव के आकार का हल्का नीला धुआँ चलता है:
      तरिका। दादी पूछती हैं, “हर काम किस साधन से होता है?”'
  lines:
  - speaker: dadi
    sa: नौकया गच्छामः।
    gloss:
      en: We go by boat.
      hi: हम नाव से जाते हैं।
- id: t1
  kind: teach
  title:
    en: 'The means: the third case'
    hi: 'साधन: तृतीया'
  depth: core
  skills:

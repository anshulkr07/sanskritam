- id: pn
  kind: teach
  title:
    en: Pāṇini's tool
    hi: पाणिनि का करण
  depth: panini
  skills:
  - case.inst
  sutras:
  - 1.4.42
  - 2.3.18
  body:
    en: Sūtra 1.4.42, {{साधकतमं करणम्}}, calls the tool “the most effective means” of an action. Sūtra 2.3.18 puts the tool,
      and the doer of a passive verb, in the third case.
    hi: सूत्र 1.4.42, {{साधकतमं करणम्}}, उपकरण को क्रिया का ‘सबसे प्रभावी साधन’ कहता है। सूत्र 2.3.18 साधन को, और कर्मवाच्य
      के कर्ता को, तृतीया में रखता है।
  term:
    sa: करणम्
    meaning:
      en: the instrument
      hi: 'करण: साधन'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: Sūtra 1.4.42, {{साधकतमं करणम्}}, calls the tool “the most effective means” of an action. Sūtra 2.3.18 puts the tool,
        and the doer of a passive verb, in the third case.
      hi: सूत्र 1.4.42, {{साधकतमं करणम्}}, उपकरण को क्रिया का ‘सबसे प्रभावी साधन’ कहता है। सूत्र 2.3.18 साधन को, और कर्मवाच्य
        के कर्ता को, तृतीया में रखता है।
    items:
    - id: i0
      sa: साधकतमं करणम्
- id: sum
  kind: summary
  title:
    en: By means of
    hi: साधन से
  depth: core
  points:
  - sa: नौकया · दण्डेन · हस्तेन
    text:
      en: The means takes the third case.
      hi: साधन तृतीया में आता है।
  - sa: सुखेन · वेगेन
    text:
      en: …and so does the manner.
      hi: …और ढंग भी।
  - sa: एन · अया
    text:
      en: Masculine/neuter and feminine endings.
      hi: पुंलिंग/नपुंसक और स्त्रीलिंग के प्रत्यय।

- id: p6
  kind: practice
  depth: core
  skills:
  - case.inst
  mode: choice
  prompt:
    en: Which word is the means in {{सा लेखन्या लिखति}}?
    hi: '{{सा लेखन्या लिखति}} में साधन कौन-सा शब्द है?'
  explain:
    en: '{{लेखन्या}}: third case.'

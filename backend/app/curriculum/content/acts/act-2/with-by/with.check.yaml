id: with.check
template: check
title:
  en: How and with whom
  hi: कैसे और किसके साथ
title_sa: परीक्षा
minutes: 4
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - case.inst
  mode: choice
  prompt:
    en: “By boat.” Which word?
    hi: ‘नाव से।’ कौन-सा शब्द?
  explain:
    en: 'The means: third case.'
    hi: 'साधन: तृतीया।'
  roman: after
  options:
  - sa: नौका
  - sa: नौकाम्
  - correct: true
    sa: नौकया
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: वयम् नौकया गच्छामः।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: We go by boat.
        hi: हम नाव से जाते हैं।
      words:
      - sa: वयम्
        gloss:
          en: we
          hi: हम
      - sa: नौकया
        gloss:
          en: by boat
          hi: नाव से
        check:
          type: subanta
          stem: नौका
          linga: Stri
          vibhakti: Trtiya
          vacana: Eka
      - sa: गच्छामः
        gloss:
          en: go
          hi: जाते हैं
        check:
          type: tinanta
          dhatu: गम्
          lakara: Lat
          purusha: Uttama
          vacana: Bahu
    - id: i1
      sa: वयम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: we
        hi: हम
    - id: i2
      sa: नौकया
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: by boat
        hi: नाव से
      check:
        type: subanta
        stem: नौका
        linga: Stri
        vibhakti: Trtiya
        vacana: Eka
      feature:
        en: 'Stem: {{नौका}} · feminine · {{तृतीया}} · singular'
        hi: 'प्रातिपदिक: {{नौका}} · {{स्त्रीलिंग}} · {{तृतीया}} · {{एकवचन}}'
    - id: i3
      sa: गच्छामः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: go
        hi: जाते हैं
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Uttama
        vacana: Bahu
      feature:
        en: 'Root: {{गम्}} · plural · {{लट्}} · First person ({{उत्तमपुरुष}})'
        hi: 'धातु: {{गम्}} · {{बहुवचन}} · {{लट्}} · उत्तमपुरुष'
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'The tool or means by which something is done takes the third case, {{तृतीया}}: {{नौकया}} (by boat), {{दण्डेन}}
          (with a pole), {{हस्तेन}} (with the hand).'
        hi: 'जिस साधन से कोई काम होता है वह तृतीया में आता है: {{नौकया}} (नाव से), {{दण्डेन}} (डंडी से), {{हस्तेन}} (हाथ से)।'
    - id: i6
      sa: वयम् नौकया गच्छामः।
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: We go by boat.
        hi: हम नाव से जाते हैं।
      words:
      - sa: वयम्
        gloss:
          en: we
          hi: हम
      - sa: नौकया
        gloss:
          en: by boat
          hi: नाव से
        check:
          type: subanta
          stem: नौका
          linga: Stri
          vibhakti: Trtiya
          vacana: Eka
      - sa: गच्छामः
        gloss:
          en: go
          hi: जाते हैं
        check:
          type: tinanta
          dhatu: गम्
          lakara: Lat
          purusha: Uttama
          vacana: Bahu

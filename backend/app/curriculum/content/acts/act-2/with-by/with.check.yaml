      - sa: मित्रेण
        gloss:
          en: with a friend
          hi: मित्र के साथ
        check:
          type: subanta
          stem: मित्र
          linga: Napumsaka
          vibhakti: Trtiya
          vacana: Eka
      - sa: सह
        gloss:
          en: together with
          hi: साथ
      - sa: गच्छामि
        gloss:
          en: go
          hi: जाता हूँ
        check:
          type: tinanta
          dhatu: गम्
          lakara: Lat
          purusha: Uttama
          vacana: Eka

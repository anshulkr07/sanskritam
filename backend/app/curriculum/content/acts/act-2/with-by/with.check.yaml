- id: p3
  kind: practice
  depth: core
  skills:
  - case.inst-saha
  mode: choice
  prompt:
    en: Which phrase means “together with a friend”?
    hi: ‘मित्र के साथ’ कौन-सा वाक्यांश है?
  explain:
    en: '{{सह}} goes with the third case.'
    hi: '{{सह}} तृतीया के साथ चलता है।'
  roman: after
  options:
  - sa: मित्रः सह
  - correct: true
    sa: मित्रेण सह
  - sa: मित्राय सह
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: अहम् मित्रेण सह गच्छामि।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: I go together with a friend.
        hi: मैं मित्र के साथ जाता हूँ।
      words:
      - sa: अहम्
        gloss:
          en: I
          hi: मैं
      - sa: मित्रेण
        gloss:
          en: with a friend
          hi: मित्र के साथ
        check:
          type: subanta
          stem: मित्र
          linga: Napumsaka
          vibhakti: Trtiya
          vacana: Eka
      - sa: सह
        gloss:
          en: together with
          hi: साथ
      - sa: गच्छामि
        gloss:
          en: go
          hi: जाता हूँ
        check:
          type: tinanta
          dhatu: गम्
          lakara: Lat
          purusha: Uttama
          vacana: Eka
    - id: i1
      sa: अहम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: I
        hi: मैं
    - id: i2
      sa: मित्रेण
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: with a friend
        hi: मित्र के साथ
      check:
        type: subanta
        stem: मित्र
        linga: Napumsaka
        vibhakti: Trtiya
        vacana: Eka
      feature:
        en: 'Stem: {{मित्र}} · neuter · {{तृतीया}} · singular'
        hi: 'प्रातिपदिक: {{मित्र}} · {{नपुंसकलिंग}} · {{तृतीया}} · {{एकवचन}}'
    - id: i3
      sa: सह
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: together with
        hi: साथ
    - id: i4
      sa: गच्छामि
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: go
        hi: जाता हूँ
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Uttama
        vacana: Eka
      feature:
        en: 'Root: {{गम्}} · singular · {{लट्}} · First person ({{उत्तमपुरुष}})'
        hi: 'धातु: {{गम्}} · {{एकवचन}} · {{लट्}} · उत्तमपुरुष'
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'To say “together with”, use the third case and the little word {{सह}}: {{मित्रेण सह}} (with a friend), {{शुकेन
          सह}}. The person you accompany stands in the third case.'
        hi: '‘के साथ’ कहने के लिए तृतीया और छोटा शब्द {{सह}} लगाइए: {{मित्रेण सह}} (मित्र के साथ), {{शुकेन सह}}। जिसके साथ
          जाते हैं वह तृतीया में आता है।'

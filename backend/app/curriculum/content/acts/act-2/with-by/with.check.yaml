  depth: core
  skills:
  - case.inst
  mode: match
  prompt:
    en: Match each means with its meaning.
    hi: हर साधन को उसके अर्थ से मिलाइए।
  explain:
    en: '{{एन}} and {{अया}}/{{या}}.'
    hi: '{{एन}} और {{अया}}/{{या}}।'
  roman: after
  pairs:
  - left:
      sa: दण्डेन

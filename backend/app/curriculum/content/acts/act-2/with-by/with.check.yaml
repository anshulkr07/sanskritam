- id: p7
  kind: practice
  depth: core
  skills:
  - case.inst
  - case.inst-saha
  mode: order
  prompt:
    en: 'Tell Tarikā: “We go by boat, together with a friend.”'
    hi: 'तरिका से कहिए: ‘हम मित्र के साथ नाव से जाते हैं।’'
  explain:
    en: '{{वयं नौकया मित्रेण सह गच्छामः}}.'
    hi: '{{वयं नौकया मित्रेण सह गच्छामः}}।'
  roman: after
  gate: true
  story:
    success:
      en: “वयं नौकया मित्रेण सह गच्छामः.” Tarikā rises from the water as a clear blue light and bows. “मित्रेण सह गच्छामि,”
        she says, in a voice like a bell over water. “आचार्याय फलं ददामि।” She nods towards the far bank, where a whitewashed
        school waits among neem trees.
      hi: “वयं नौकया मित्रेण सह गच्छामः।” तरिका पानी से साफ़ नीली रोशनी बनकर उठती है और झुकती है। “मित्रेण सह गच्छामि,” वह
        पानी पर घंटी जैसी आवाज़ में कहती है। “आचार्याय फलं ददामि।” वह दूर के तट की ओर सिर हिलाती है, जहाँ नीम के पेड़ों के
        बीच एक चूने से पुती पाठशाला प्रतीक्षा कर रही है।
    failure:

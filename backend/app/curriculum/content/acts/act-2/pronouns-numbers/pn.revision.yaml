- id: conditions
  kind: revision
  title:
    en: When to use which
    hi: कब कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: pron.tad-full
    rule:
      en: '{{तद्}} is the far “that” or the “he, she, it” of a story; {{एतद्}} is the near “this”; {{इदम्}} is also “this”.'
      hi: '{{तद्}} दूर का ‘वह’ या कथा का ‘वह (पुं., स्त्री., नपुं.)’ है; {{एतद्}} पास का ‘यह’; {{इदम्}} भी ‘यह’ है।'
    tag: good
    taught_in: pn.tad#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Only the first-case forms {{सः}} and {{सा}} show an {{स्}}; everything else starts with {{त्}}. Pronouns also
          borrow odd endings: for a masculine or neuter, {{तस्मै}} (for), {{तस्मात्}} (from) and {{तस्मिन्}} (in); for a feminine,
          {{तस्यै}}, {{तस्याः}} and {{तस्याम्}}. The plural genitive is {{तेषाम्}} and {{तासाम्}}.'
        hi: 'केवल प्रथमा के रूप {{सः}} और {{सा}} में {{स्}} दिखता है; बाक़ी सब {{त्}} से शुरू होते हैं। सर्वनाम कुछ विचित्र
          प्रत्यय भी लेते हैं: पुंलिंग और नपुंसक में {{तस्मै}} (के लिए), {{तस्मात्}} (से) और {{तस्मिन्}} (में); स्त्रीलिंग
          में {{तस्यै}}, {{तस्याः}} और {{तस्याम्}}। षष्ठी बहुवचन {{तेषाम्}} और {{तासाम्}} है।'
      items:
      - id: i0
        sa: सः
      - id: i1
        sa: सा
      - id: i2
        sa: स्
      - id: i3
        sa: त्
      - id: i4
        sa: तस्मै
      - id: i5
        sa: तस्मात्
      - id: i6
        sa: तस्मिन्
      - id: i7
        sa: तस्यै
      - id: i8
        sa: तस्याः
      - id: i9
        sa: तस्याम्
      - id: i10
        sa: तेषाम्
      - id: i11
        sa: तासाम्

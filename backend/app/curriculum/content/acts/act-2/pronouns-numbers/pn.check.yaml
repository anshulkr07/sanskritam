- id: p5
  kind: practice
  depth: core
  skills:
  - num.one-ten
  mode: choice
  prompt:
    en: “Four fruits.” Which form?
    hi: ‘चार फल।’ कौन-सा रूप?
  explain:
    en: '{{चत्वारि}}: four, neuter.'
    hi: '{{चत्वारि}}: चार, नपुंसक।'
  roman: after
  options:
  - sa: चत्वारः फलानि
  - sa: चतस्रः फलानि
  - correct: true
    sa: चत्वारि फलानि
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: '{{एक}} is “one” and acts like a pronoun: {{एकः}}, {{एका}}, {{एकम्}}. {{द्वि}} (two) is dual only. {{त्रि}} (three)
        and {{चतुर्}} (four) have a different word for the feminine: {{तिस्रः}}, {{चतस्रः}}. These words agree with the noun,
        like an adjective.'
      hi: '{{एक}} का अर्थ ‘एक’ है और वह सर्वनाम की तरह चलता है: {{एकः}}, {{एका}}, {{एकम्}}। {{द्वि}} (दो) केवल द्विवचन है।
        {{त्रि}} (तीन) और {{चतुर्}} (चार) के स्त्रीलिंग का रूप अलग है: {{तिस्रः}}, {{चतस्रः}}। ये शब्द विशेषण की तरह संज्ञा
        से मेल खाते हैं।'
    items:
    - id: i0
      sa: एक
    - id: i1
      sa: एकः
    - id: i2
      sa: एका
    - id: i3
      sa: एकम्
    - id: i4
      sa: द्वि
    - id: i5
      sa: त्रि
    - id: i6
      sa: चतुर्
    - id: i7
      sa: तिस्रः
    - id: i8
      sa: चतस्रः

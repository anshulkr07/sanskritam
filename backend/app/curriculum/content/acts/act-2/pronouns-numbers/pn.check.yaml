- id: p1
  kind: practice
  depth: core
  skills:
  - pron.tad-full
  mode: engine
  prompt:
    en: Fill in the missing forms of the table.
    hi: तालिका के छूटे रूप भरिए।
  explain:
    en: The {{तद्}} table.
    hi: '{{तद्}} की तालिका।'
  roman: show
  exercise:
    kind: grid_fill
    params:
      pratipadika: तद्
      linga: Pum
      blanks: 3
    seed: 4
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Only the first-case forms {{सः}} and {{सा}} show an {{स्}}; everything else starts with {{त्}}. Pronouns also borrow
        odd endings: for a masculine or neuter, {{तस्मै}} (for), {{तस्मात्}} (from) and {{तस्मिन्}} (in); for a feminine,
        {{तस्यै}}, {{तस्याः}} and {{तस्याम्}}. The plural genitive is {{तेषाम्}} and {{तासाम्}}.'
      hi: 'केवल प्रथमा के रूप {{सः}} और {{सा}} में {{स्}} दिखता है; बाक़ी सब {{त्}} से शुरू होते हैं। सर्वनाम कुछ विचित्र
        प्रत्यय भी लेते हैं: पुंलिंग और नपुंसक में {{तस्मै}} (के लिए), {{तस्मात्}} (से) और {{तस्मिन्}} (में); स्त्रीलिंग में
        {{तस्यै}}, {{तस्याः}} और {{तस्याम्}}। षष्ठी बहुवचन {{तेषाम्}} और {{तासाम्}} है।'
    items:
    - id: i0
      sa: सः
    - id: i1
      sa: सा
    - id: i2
      sa: स्
    - id: i3
      sa: त्
    - id: i4
      sa: तस्मै
    - id: i5
      sa: तस्मात्
    - id: i6
      sa: तस्मिन्
    - id: i7
      sa: तस्यै
    - id: i8
      sa: तस्याः
    - id: i9
      sa: तस्याम्
    - id: i10
      sa: तेषाम्
    - id: i11
      sa: तासाम्

- id: p9
  kind: practice
  depth: core
  skills:
  - num.one-ten
  mode: order
  prompt:
    en: 'Count for Ganaka, neuter: “one, two, three, four.”'
    hi: 'गणक के लिए गिनिए, नपुंसक: ‘एक, दो, तीन, चार।’'
  explain:
    en: '{{एकम् द्वे त्रीणि चत्वारि}}.'
    hi: '{{एकम् द्वे त्रीणि चत्वारि}}।'
  roman: after
  gate: true
  story:
    success:
      en: “एकम्, द्वे, त्रीणि, चत्वारि.” Ganaka ties the last knot, and every cord in the room goes taut and glows, one after
        another, down the shelves. “एकः, द्वौ, त्रयः, चत्वारः,” he adds, a gift, and then points, with a hand of knots, to
        the lowest shelf. There, between two books, a third leaf. “वेतालः श्मशाने वदति,” he says. “The Vetāla speaks in the
        burning ground.”
      hi: “एकम्, द्वे, त्रीणि, चत्वारि।” गणक आख़िरी गाँठ लगाता है, और कमरे की हर डोरी तन जाती है और एक के बाद एक अलमारियों
        में चमक उठती है। “एकः, द्वौ, त्रयः, चत्वारः,” वह उपहार में जोड़ता है, और फिर गाँठों के हाथ से सबसे निचली अलमारी की
        ओर इशारा करता है। वहाँ दो पुस्तकों के बीच एक तीसरा पत्र। “वेतालः श्मशाने वदति,” वह कहता है। “वेताल श्मशान में बोलता
        है।”
    failure:
      en: A cord slips. The neuter count is {{एकम् द्वे त्रीणि चत्वारि}}.
      hi: एक डोरी फिसलती है। नपुंसक गिनती है {{एकम् द्वे त्रीणि चत्वारि}}।
  tokens:
  - एकम्
  - द्वे
  - त्रीणि
  - चत्वारि
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: '{{एक}} is “one” and acts like a pronoun: {{एकः}}, {{एका}}, {{एकम्}}. {{द्वि}} (two) is dual only. {{त्रि}} (three)
        and {{चतुर्}} (four) have a different word for the feminine: {{तिस्रः}}, {{चतस्रः}}. These words agree with the noun,
        like an adjective.'
      hi: '{{एक}} का अर्थ ‘एक’ है और वह सर्वनाम की तरह चलता है: {{एकः}}, {{एका}}, {{एकम्}}। {{द्वि}} (दो) केवल द्विवचन है।
        {{त्रि}} (तीन) और {{चतुर्}} (चार) के स्त्रीलिंग का रूप अलग है: {{तिस्रः}}, {{चतस्रः}}। ये शब्द विशेषण की तरह संज्ञा
        से मेल खाते हैं।'
    items:
    - id: i0
      sa: एक
    - id: i1
      sa: एकः
    - id: i2
      sa: एका
    - id: i3
      sa: एकम्
    - id: i4
      sa: द्वि
    - id: i5
      sa: त्रि
    - id: i6
      sa: चतुर्
    - id: i7
      sa: तिस्रः
    - id: i8
      sa: चतस्रः

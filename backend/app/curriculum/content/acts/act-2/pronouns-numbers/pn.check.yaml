- id: p9
  kind: practice
  depth: core
  skills:
  - num.one-ten
  mode: order
  prompt:
    en: 'Count for Ganaka, neuter: “one, two, three, four.”'
    hi: 'गणक के लिए गिनिए, नपुंसक: ‘एक, दो, तीन, चार।’'
  explain:
    en: '{{एकम् द्वे त्रीणि चत्वारि}}.'
    hi: '{{एकम् द्वे त्रीणि चत्वारि}}।'
  roman: after
  gate: true
  story:
    success:
      en: “एकम्, द्वे, त्रीणि, चत्वारि.” Ganaka ties the last knot, and every cord in the room goes taut and glows, one after another, down the shelves. “एकः, द्वौ, त्रयः, चत्वारः,” he adds, a gift, and then points, with a hand of knots, to the lowest shelf. There, between two books, a third leaf. “वेतालः श्मशाने वदति,” he says. “The Vetāla speaks in the burning ground.”
      hi: “एकम्, द्वे, त्रीणि, चत्वारि।” गणक आख़िरी गाँठ लगाता है, और कमरे की हर डोरी तन जाती है और एक के बाद एक अलमारियों में चमक उठती है। “एकः, द्वौ, त्रयः, चत्वारः,” वह उपहार में जोड़ता है, और फिर गाँठों के हाथ से सबसे निचली अलमारी की ओर इशारा करता है। वहाँ दो पुस्तकों के बीच एक तीसरा पत्र। “वेतालः श्मशाने वदति,” वह कहता है। “वेताल श्मशान में बोलता है।”
    failure:
      en: A cord slips. The neuter count is {{एकम् द्वे त्रीणि चत्वारि}}.
      hi: एक डोरी फिसलती है। नपुंसक गिनती है {{एकम् द्वे त्रीणि चत्वारि}}।
  tokens:
  - एकम्
  - द्वे
  - त्रीणि
  - चत्वारि

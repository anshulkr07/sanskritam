  exercise:
    kind: grid_fill
    params:
      pratipadika: किम्
      linga: Pum
      blanks: 3
    seed: 5
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: कः पठति।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: Who reads?
        hi: कौन पढ़ता है?
      words:
      - sa: कः
        gloss:
          en: who
          hi: कौन
        check:
          type: subanta
          stem: किम्
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: पठति
        gloss:
          en: reads
          hi: पढ़ता है
        check:
          type: tinanta
          dhatu: पठ्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
    - id: i1
      sa: कः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: who
        hi: कौन
      check:
        type: subanta
        stem: किम्
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{किम्}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{किम्}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
    - id: i2
      sa: पठति
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: reads
        hi: पढ़ता है
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
      feature:
        en: 'Root: {{पठ्}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{पठ्}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: '{{किम्}} asks “who? what? which?” Its forms are the forms of {{तद्}} with {{क-}} in place of {{त-}}: {{कः}} (who,
          masculine), {{का}} (who, feminine), {{किम्}} (what). {{यद्}} is “who, which, that”, and goes with {{तद्}}: {{यः
          … सः}}, “who … he”.'
        hi: '{{किम्}} पूछता है ‘कौन? क्या? कौन-सा?’ उसके रूप {{तद्}} के रूप हैं, जिनमें {{त-}} की जगह {{क-}} है: {{कः}} (कौन,
          पुंलिंग), {{का}} (कौन, स्त्रीलिंग), {{किम्}} (क्या)। {{यद्}} का अर्थ ‘जो’ है, और वह {{तद्}} के साथ चलता है: {{यः
          … सः}}, ‘जो … वह’।'
    - id: i5
      sa: कः पठति।
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: Who reads?
        hi: कौन पढ़ता है?
      words:
      - sa: कः
        gloss:
          en: who
          hi: कौन
        check:
          type: subanta
          stem: किम्
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: पठति
        gloss:
          en: reads
          hi: पढ़ता है
        check:
          type: tinanta
          dhatu: पठ्
          lakara: Lat
          purusha: Prathama
          vacana: Eka

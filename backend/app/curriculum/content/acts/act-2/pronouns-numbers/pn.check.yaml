    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'From eleven to nineteen: the unit and then {{दश}}: {{एकादश}}, {{द्वादश}}, {{त्रयोदश}}, {{चतुर्दश}}, {{पञ्चदश}},
        {{षोडश}}, {{सप्तदश}}, {{अष्टादश}}. The tens are {{विंशतिः}} (20), {{त्रिंशत्}} (30), {{चत्वारिंशत्}} (40), {{पञ्चाशत्}}
        (50), {{षष्टिः}} (60), {{सप्ततिः}} (70), {{अशीतिः}} (80), {{नवतिः}} (90). Then {{शतम्}} (100) and {{सहस्रम्}} (1000).'
      hi: 'ग्यारह से उन्नीस तक: इकाई और फिर {{दश}}: {{एकादश}}, {{द्वादश}}, {{त्रयोदश}}, {{चतुर्दश}}, {{पञ्चदश}}, {{षोडश}},
        {{सप्तदश}}, {{अष्टादश}}। दहाइयाँ ये हैं: {{विंशतिः}} (20), {{त्रिंशत्}} (30), {{चत्वारिंशत्}} (40), {{पञ्चाशत्}} (50),
        {{षष्टिः}} (60), {{सप्ततिः}} (70), {{अशीतिः}} (80), {{नवतिः}} (90)। फिर {{शतम्}} (100) और {{सहस्रम्}} (1000)।'

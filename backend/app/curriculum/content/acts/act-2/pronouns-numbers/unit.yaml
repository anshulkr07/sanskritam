status: ready
episode:
  summary:
    en: 'Counting the leaves you have found, and the days of the journey home: pronouns in every case, numbers and the time. In the old library, the third leaf turns up.'
    hi: 'मिले हुए पत्रों और घर लौटने के दिनों की गिनती: हर विभक्ति में सर्वनाम, संख्याएँ और समय। पुराने ग्रंथालय में तीसरा पत्र मिलता है।'
  beats:
  - तद्, एतद्, इदम् in every case.
  - कः, का, किम्; यः … सः.
  - 'Numbers one to a hundred, and telling the time. The third leaf: the boy who heard once.'

  story:
    success:
      en: '“यः पठति सः पण्डितः,” you say. Ganaka goes very still. Then, in a small dry voice, the first thing he has said in days: “कः अहम्?” “Who am I?” “गणकः,” says Dādī. “The counter.” The cords begin to tie themselves into neat rows.'
      hi: '“यः पठति सः पण्डितः,” आप कहते हैं। गणक एकदम स्थिर हो जाता है। फिर छोटी सूखी आवाज़ में, कई दिनों में उसकी पहली बात: “कः अहम्?” “मैं कौन हूँ?” “गणकः,” दादी कहती हैं। “गिनने वाला।” डोरियाँ अपने-आप सुघड़ पंक्तियों में गठने लगती हैं।'

- id: t2
  kind: teach
  title:
    en: 'Pairs: {{यः … सः}}'
    hi: 'जोड़ी: {{यः … सः}}'
  depth: core
  skills:
  - pron.kim-yad
  body:
    en: 'A {{यः}} clause is paired with {{सः}}: {{यः पठति सः पण्डितः}}. They refer to the same person or thing and agree in
      gender and number. Each takes the case needed in its own clause; the cases need not match. {{यम् अहं पश्यामि सः पठति}}:
      the one whom I see reads.'
    hi: '{{यः}} वाले उपवाक्य का सम्बन्ध {{सः}} वाले उपवाक्य से है: {{यः पठति सः पण्डितः}}। दोनों उसी व्यक्ति या वस्तु को बताते
      हैं और लिंग-वचन में मेल खाते हैं। हर सर्वनाम की विभक्ति उसके अपने उपवाक्य में काम से तय होती है; दोनों की विभक्ति अलग
      हो सकती है। {{यम् अहं पश्यामि सः पठति}}: जिसे मैं देखता हूँ, वह पढ़ता है।'
  examples:

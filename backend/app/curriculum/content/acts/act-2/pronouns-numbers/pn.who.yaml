- title: Lesson text and story
  licence: original
- title: Whitney, Sanskrit Grammar, §§508–512 (relative pronouns)
  url: https://en.wikisource.org/wiki/Sanskrit_Grammar/Chapter_VII#512
  licence: public domain
  note: Case distinction supported by the relative/correlative examples in §512a; teaching prose and new example are original.
cards:
- id: s1
  kind: story
  title:
    en: A question for every shelf
    hi: हर अलमारी के लिए एक प्रश्न
  depth: core
  image:
    brief: 'The library at morning: the knotted-cord spirit holding up a book and a question mark made of rope; Dādī tapping
      a shelf, Śuka whispering to you; sunbeams crossing the rows of books.'
    alt:
      en: A knotted-cord spirit holds up a book and a rope question mark in a library
      hi: गाँठदार डोरियों का भूत पुस्तक और रस्सी का प्रश्नचिह्न उठाए हुए
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - ganaka
    place: pathashala
    ratio: '4:3'
    id: pn-who-s1
    text_in_image:
    - '?'
  narration:
    en: 'Ganaka stops pointing and starts asking. “Who wrote this? What is in that? Which one is lost?” He asks it of every
      shelf, and each time Dādī answers with the same small word, one that the shelves seem to enjoy: कः, का, किम्. Śuka whispers
      to you: “Same ending as ‘that’, but with a K.”'
    hi: 'गणक इशारा करना छोड़कर पूछने लगता है। “यह किसने लिखा? उसमें क्या है? कौन-सा खो गया है?” वह हर अलमारी से पूछता है,
      और हर बार दादी एक ही छोटे शब्द से उत्तर देती हैं, जो अलमारियों को भाता है: कः, का, किम्। शुक आपके कान में फुसफुसाता
      है: “‘वह’ जैसे ही प्रत्यय, पर क से शुरू।”'
- id: t1
  kind: teach
  title:
    en: '{{कः}}, {{का}}, {{किम्}}: who and what'
    hi: '{{कः}}, {{का}}, {{किम्}}: कौन और क्या'
  depth: core
  skills:
  - pron.kim-yad
  body:
    en: '{{किम्}} asks “who? what? which?” Its forms are the forms of {{तद्}} with {{क-}} in place of {{त-}}: {{कः}} (who,
      masculine), {{का}} (who, feminine), {{किम्}} (what). {{यद्}} is “who, which, that”, and goes with {{तद्}}: {{यः … सः}},
      “who … he”.'
    hi: '{{किम्}} पूछता है ‘कौन? क्या? कौन-सा?’ उसके रूप {{तद्}} के रूप हैं, जिनमें {{त-}} की जगह {{क-}} है: {{कः}} (कौन,
      पुंलिंग), {{का}} (कौन, स्त्रीलिंग), {{किम्}} (क्या)। {{यद्}} का अर्थ ‘जो’ है, और वह {{तद्}} के साथ चलता है: {{यः … सः}},
      ‘जो … वह’।'

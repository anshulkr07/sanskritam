- id: t2
  kind: teach
  title:
    en: 'Pairs: {{यः … सः}}'
    hi: 'जोड़ी: {{यः … सः}}'
  depth: core
  skills:
  - pron.kim-yad
  body:
    en: 'A sentence with {{यः}} (who) is answered by {{सः}} (he): {{यः पठति सः पण्डितः}}, “who reads, he is learned”. The feminine is {{या … सा}} and the neuter {{यत् … तत्}}. The same pronoun, in any case, in both halves: {{यस्मै … तस्मै}}.'
    hi: '{{यः}} (जो) वाला वाक्य {{सः}} (वह) से पूरा होता है: {{यः पठति सः पण्डितः}}, ‘जो पढ़ता है, वह विद्वान् है’। स्त्रीलिंग {{या … सा}} और नपुंसक {{यत् … तत्}}। दोनों भागों में एक ही सर्वनाम, किसी भी विभक्ति में: {{यस्मै … तस्मै}}।'
  examples:
  - sa: यः पठति सः पण्डितः।
    meaning:
      en: Who reads, he is a scholar.
      hi: जो पढ़ता है, वह विद्वान् है।
    words:
    - sa: यः
      gloss:
        en: who
        hi: जो
    - sa: पठति
      gloss:
        en: reads
        hi: पढ़ता है
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
    - sa: सः
      gloss:
        en: he
        hi: वह
    - sa: पण्डितः
      gloss:
        en: scholar
        hi: विद्वान्
      check:
        type: subanta
        stem: पण्डित
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
  - sa: या लिखति सा कन्या।
    meaning:
      en: She who writes is the girl.
      hi: जो लिखती है, वह कन्या है।
    words:
    - sa: या
      gloss:
        en: who
        hi: जो
    - sa: लिखति
      gloss:
        en: writes
        hi: लिखती है
      check:
        type: tinanta
        dhatu: लिख्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
    - sa: सा
      gloss:
        en: she
        hi: वह
    - sa: कन्या
      gloss:
        en: girl
        hi: कन्या
      check:
        type: subanta
        stem: कन्या
        linga: Stri
        vibhakti: Prathama
        vacana: Eka

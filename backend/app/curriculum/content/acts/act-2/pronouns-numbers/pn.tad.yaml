- id: pn
  kind: teach
  title:
    en: Pāṇini's pronoun rules
    hi: पाणिनि के सर्वनाम-नियम
  depth: panini
  skills:
  - pron.tad-full
  sutras:
  - 7.2.102
  - 7.2.106
  - 7.1.14
  - 7.1.15
  - 7.1.17
  - 7.1.52
  body:
    en: Sūtra 7.2.102, {{त्यदादीनामः}}, makes the stem {{तद्}} end in {{अ}}; 7.2.106, {{तदोः सः सावनन्त्ययोः}}, turns its {{त्}} into {{स्}} before the first-case ending, giving {{सः}}. Then 7.1.14, {{सर्वनाम्नः स्मै}}, gives {{तस्मै}}; 7.1.15, {{ङसिङ्योः स्मात्स्मिनौ}}, gives {{तस्मात्}} and {{तस्मिन्}}; 7.1.17, {{जसः शी}}, gives {{ते}}; and 7.1.52, {{आमि सर्वनाम्नः सुट्}}, gives {{तेषाम्}}.
    hi: सूत्र 7.2.102, {{त्यदादीनामः}}, {{तद्}} को {{अ}}-अन्त बनाता है; 7.2.106, {{तदोः सः सावनन्त्ययोः}}, प्रथमा के प्रत्यय से पहले उसके {{त्}} को {{स्}} कर देता है, जिससे {{सः}} बनता है। फिर 7.1.14, {{सर्वनाम्नः स्मै}}, {{तस्मै}} देता है; 7.1.15, {{ङसिङ्योः स्मात्स्मिनौ}}, {{तस्मात्}} और {{तस्मिन्}} देता है; 7.1.17, {{जसः शी}}, {{ते}} देता है; और 7.1.52, {{आमि सर्वनाम्नः सुट्}}, {{तेषाम्}} देता है।

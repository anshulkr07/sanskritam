cards:
- id: s1
  kind: story
  title:
    en: The one who loses count
    hi: गिनती भूलने वाला
  depth: core
  image:
    brief: 'The inner room of the village school library at morning: the Ācārya unlocking a carved door; high on a shelf a small grey spirit made of knotted cords and pebbles pointing at rows of books and muttering; Dādī and Śuka looking up at it; sunbeams full of dust.'
    alt:
      en: A knotted-cord spirit on a high library shelf points at rows of books while Dādī and a parrot look up
      hi: ऊँची अलमारी पर गाँठदार डोरियों का भूत पुस्तकों की ओर इशारा करता, दादी और तोता ऊपर देखते
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - ganaka
    place: pathashala
    ratio: '4:3'
    id: pn-tad-s1
  narration:
    en: 'Next morning the Ācārya unlocks the inner room of the library. High on a shelf, a knot of cords and pebbles is counting books, losing count and starting again. “That book, those books, that leaf,” it mutters, pointing at everything and naming nothing. Dādī says softly: “He needs a word for ‘that’ in every case.”'
    hi: 'अगली सुबह आचार्य पुस्तकालय का भीतरी कक्ष खोलते हैं। ऊँची अलमारी पर डोरियों और कंकड़ों की एक गाँठ पुस्तकें गिन रही है, गिनती भूल रही है, फिर शुरू कर रही है। “वह पुस्तक, वे पुस्तकें, वह पत्र,” वह बुदबुदाता है, हर चीज़ की ओर इशारा करता और किसी का नाम न लेता। दादी धीमे से कहती हैं: “उसे ‘वह’ के लिए हर विभक्ति में शब्द चाहिए।”'
  lines:
  - speaker: dadi
    sa: तत्, तानि, तस्य, तस्मै।
    gloss:
      en: That, those, of that, for that.
      hi: वह, वे, उसका, उसके लिए।
- id: t1
  kind: teach
  title:
    en: '{{सः}} has more than it shows'
    hi: '{{सः}} के और भी रूप हैं'
  depth: core
  skills:
  - pron.tad-full
  body:
    en: 'Only the first-case forms {{सः}} and {{सा}} show an {{स्}}; everything else starts with {{त्}}. Pronouns also borrow odd endings: for a masculine or neuter, {{तस्मै}} (for), {{तस्मात्}} (from) and {{तस्मिन्}} (in); for a feminine, {{तस्यै}}, {{तस्याः}} and {{तस्याम्}}. The plural genitive is {{तेषाम्}} and {{तासाम्}}.'
    hi: 'केवल प्रथमा के रूप {{सः}} और {{सा}} में {{स्}} दिखता है; बाक़ी सब {{त्}} से शुरू होते हैं। सर्वनाम कुछ विचित्र प्रत्यय भी लेते हैं: पुंलिंग और नपुंसक में {{तस्मै}} (के लिए), {{तस्मात्}} (से) और {{तस्मिन्}} (में); स्त्रीलिंग में {{तस्यै}}, {{तस्याः}} और {{तस्याम्}}। षष्ठी बहुवचन {{तेषाम्}} और {{तासाम्}} है।'
  term:
    sa: सर्वनाम
    meaning:
      en: a word that stands for a noun
      hi: संज्ञा की जगह आने वाला शब्द

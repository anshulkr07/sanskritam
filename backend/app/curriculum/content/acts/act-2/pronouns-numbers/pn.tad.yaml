  depth: core
  points:
  - sa: तस्मै · तस्मात् · तस्मिन्
    text:
      en: The odd masculine and neuter endings.
      hi: पुंलिंग और नपुंसक के विचित्र प्रत्यय।
  - sa: तस्यै · तस्याः · तस्याम्
    text:
      en: The odd feminine endings.
      hi: स्त्रीलिंग के विचित्र प्रत्यय।
  - sa: तेषाम् · तासाम्
    text:
      en: “Of those”, masculine and feminine.
      hi: ‘उनका’, पुंलिंग और स्त्रीलिंग।

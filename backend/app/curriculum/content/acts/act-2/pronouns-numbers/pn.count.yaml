- id: s1
  kind: story
  title:
    en: Knots on a string
    hi: डोरी पर गाँठें
  depth: core
  image:
    brief: Ganaka the knotted-cord spirit tying knots in a long cord with great pride, a row of old palm leaves laid out on a low table; Dādī laughing; Śuka counting on his claws; lamplight.
    alt:
      en: A cord spirit ties knots to count a row of old leaves while Dādī laughs
      hi: डोरी का भूत गाँठें लगाकर पुराने पत्रों की पंक्ति गिन रहा, दादी हँसती हुई
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - ganaka
    place: pathashala
    ratio: '4:3'
    id: pn-count-s1
  narration:
    en: 'Ganaka unwinds one of his cords and ties a knot. “एकम्.” Another. “द्वे.” Another. “त्रीणि.” He is very proud. “And these?” He holds up a row of old leaves. Dādī laughs. “Count them properly: the numbers up to four change with the gender of what you count, and from five they never do.”'
    hi: 'गणक अपनी एक डोरी खोलकर गाँठ लगाता है। “एकम्।” दूसरी। “द्वे।” तीसरी। “त्रीणि।” वह बहुत गर्वित है। “और ये?” वह पुराने पत्रों की एक पंक्ति उठाता है। दादी हँसती हैं। “ठीक से गिनो: चार तक की संख्याएँ गिनी जाने वाली चीज़ के लिंग से बदलती हैं, पाँच से आगे कभी नहीं।”'
- id: t1
  kind: teach
  title:
    en: 'One to four: they change'
    hi: 'एक से चार: बदलते हैं'
  depth: core
  skills:
  - num.one-ten
  body:
    en: '{{एक}} is “one” and acts like a pronoun: {{एकः}}, {{एका}}, {{एकम्}}. {{द्वि}} (two) is dual only. {{त्रि}} (three) and {{चतुर्}} (four) have a different word for the feminine: {{तिस्रः}}, {{चतस्रः}}. These words agree with the noun, like an adjective.'
    hi: '{{एक}} का अर्थ ‘एक’ है और वह सर्वनाम की तरह चलता है: {{एकः}}, {{एका}}, {{एकम्}}। {{द्वि}} (दो) केवल द्विवचन है। {{त्रि}} (तीन) और {{चतुर्}} (चार) के स्त्रीलिंग का रूप अलग है: {{तिस्रः}}, {{चतस्रः}}। ये शब्द विशेषण की तरह संज्ञा से मेल खाते हैं।'

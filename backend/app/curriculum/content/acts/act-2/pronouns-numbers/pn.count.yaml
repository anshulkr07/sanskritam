- id: p4
  kind: practice
  title:
    en: Count the leaves
    hi: पत्र गिनिए
  depth: core
  skills:
  - num.one-ten
  mode: choice
  prompt:
    en: “Two girls” (feminine). Which form?
    hi: ‘दो बालिकाएँ’ (स्त्रीलिंग)। कौन-सा रूप?
  explain:
    en: '{{द्वे}}: two, feminine.'
    hi: '{{द्वे}}: दो, स्त्रीलिंग।'
  roman: after
  gate: true
  story:
    success:
      en: “द्वे बालिके,” you say, counting two figures carved on a leaf. Ganaka ties a knot; the cord glows. Another; another. Down the table the old leaves rise a hand's breadth into the air and, one by one, settle into a neat row.
      hi: “द्वे बालिके,” आप कहते हैं, पत्र पर खुदी दो आकृतियाँ गिनते हुए। गणक एक गाँठ लगाता है; डोरी चमक उठती है। फिर एक; फिर एक। मेज़ पर पुराने पत्र हथेली भर ऊपर उठते हैं और एक-एक करके सुघड़ पंक्ति में बैठ जाते हैं।
    failure:
      en: 'The knot slips. Two, feminine: {{द्वे}}.'
      hi: 'गाँठ फिसल जाती है। दो, स्त्रीलिंग: {{द्वे}}।'
  options:
  - sa: द्वौ बालिके
  - correct: true
    sa: द्वे बालिके
  - sa: तिस्रः बालिकाः

    hi: 'पाँच से आगे केवल बहुवचन, सभी लिंगों के लिए एक रूप: {{पञ्च बालकाः}}, {{षट् लताः}}, {{सप्त फलानि}}। {{अष्ट}} का {{अष्टौ}} भी है।'
- id: t2
  kind: teach
  title:
    en: Counting things
    hi: वस्तुएँ गिनना
  depth: core
  skills:
  - num.one-ten
  body:
    en: 'The number comes before the noun, in the same case: {{पञ्च बालकाः}} (five boys), {{द्वे लते}} (two vines), {{त्रीणि फलानि}} (three fruits). In the instrumental or genitive the number changes too: {{त्रिभिः बालकैः}}, {{त्रयाणां बालकानाम्}}.'
    hi: 'संख्या संज्ञा से पहले आती है, उसी विभक्ति में: {{पञ्च बालकाः}} (पाँच बालक), {{द्वे लते}} (दो लताएँ), {{त्रीणि फलानि}} (तीन फल)। तृतीया या षष्ठी में संख्या भी बदलती है: {{त्रिभिः बालकैः}}, {{त्रयाणां बालकानाम्}}।'
  examples:
  - sa: पञ्च बालकाः पठन्ति।
    meaning:
      en: Five boys read.
      hi: पाँच बालक पढ़ते हैं।
    words:
    - sa: पञ्च
      gloss:
        en: five
        hi: पाँच
    - sa: बालकाः
      gloss:
        en: boys
        hi: बालक
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Prathama
        vacana: Bahu
    - sa: पठन्ति
      gloss:
        en: read
        hi: पढ़ते हैं
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Bahu
  - sa: द्वे लते स्तः।
    meaning:
      en: There are two vines.
      hi: दो लताएँ हैं।
    words:
    - sa: द्वे
      gloss:
        en: two
        hi: दो
    - sa: लते
      gloss:
        en: vines
        hi: लताएँ
      check:
        type: subanta
        stem: लता
        linga: Stri
        vibhakti: Prathama
        vacana: Dvi
    - sa: स्तः
      gloss:
        en: are
        hi: हैं
      check:
        type: tinanta
        dhatu: अस्
        lakara: Lat
        purusha: Prathama
        vacana: Dvi
  - sa: त्रीणि फलानि सन्ति।
    meaning:
      en: There are three fruits.
      hi: तीन फल हैं।
    words:
    - sa: त्रीणि
      gloss:
        en: three
        hi: तीन
    - sa: फलानि
      gloss:
        en: fruits
        hi: फल
      check:
        type: subanta
        stem: फल
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Bahu
    - sa: सन्ति
      gloss:
        en: are
        hi: हैं
      check:
        type: tinanta
        dhatu: अस्
        lakara: Lat
        purusha: Prathama
        vacana: Bahu

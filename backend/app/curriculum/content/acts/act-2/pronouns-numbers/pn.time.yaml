- id: s1
  kind: story
  title:
    en: Days on the road
    hi: मार्ग के दिन
  depth: core
  image:
    brief: 'Dādī and the knotted-cord spirit at a low table: on a clay slate a ladder of written numbers and a circle of a day cut into eight slices, half bright and half dark; Śuka looking at the slate; Dādī pointing.'
    alt:
      en: Dādī draws a day cut into eight watches on a clay slate beside the cord spirit
      hi: दादी पाटी पर आठ पहरों में कटा दिन खींचती हुई, पास में डोरी का भूत
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - ganaka
    place: pathashala
    ratio: '4:3'
    id: pn-time-s1
    text_in_image: ["एकादश", "द्वादश", "त्रयोदश"]
  narration:
    en: 'Ganaka''s cords are long now. “How many days of the road? Eleven? A hundred?” Dādī sits him down with a clay slate and writes a ladder of numbers: eleven, twelve, twenty, a hundred, a thousand. Then she draws a day on the slate, cut into eight equal slices. “The old way of keeping time: eight watches, four of day and four of night.”'
    hi: 'गणक की डोरियाँ अब लम्बी हो गई हैं। “मार्ग के कितने दिन? ग्यारह? सौ?” दादी उसे मिट्टी की पाटी के पास बिठाती हैं और संख्याओं की सीढ़ी लिखती हैं: ग्यारह, बारह, बीस, सौ, हज़ार। फिर वे पाटी पर एक दिन खींचती हैं, आठ बराबर फाँकों में कटा हुआ। “समय गिनने का पुराना ढंग: आठ पहर, चार दिन के और चार रात के।”'
- id: t1
  kind: teach
  title:
    en: Eleven to a thousand
    hi: ग्यारह से हज़ार
  depth: core
  skills:
  - num.big-time
  body:
    en: 'From eleven to nineteen: the unit and then {{दश}}: {{एकादश}}, {{द्वादश}}, {{त्रयोदश}}, {{चतुर्दश}}, {{पञ्चदश}}, {{षोडश}}, {{सप्तदश}}, {{अष्टादश}}. The tens are {{विंशतिः}} (20), {{त्रिंशत्}} (30), {{चत्वारिंशत्}} (40), {{पञ्चाशत्}} (50), {{षष्टिः}} (60), {{सप्ततिः}} (70), {{अशीतिः}} (80), {{नवतिः}} (90). Then {{शतम्}} (100) and {{सहस्रम्}} (1000).'
    hi: 'ग्यारह से उन्नीस तक: इकाई और फिर {{दश}}: {{एकादश}}, {{द्वादश}}, {{त्रयोदश}}, {{चतुर्दश}}, {{पञ्चदश}}, {{षोडश}}, {{सप्तदश}}, {{अष्टादश}}। दहाइयाँ ये हैं: {{विंशतिः}} (20), {{त्रिंशत्}} (30), {{चत्वारिंशत्}} (40), {{पञ्चाशत्}} (50), {{षष्टिः}} (60), {{सप्ततिः}} (70), {{अशीतिः}} (80), {{नवतिः}} (90)। फिर {{शतम्}} (100) और {{सहस्रम्}} (1000)।'

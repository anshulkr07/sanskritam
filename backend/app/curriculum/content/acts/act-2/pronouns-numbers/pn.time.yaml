- id: t2
  kind: teach
  title:
    en: First, second, third
    hi: पहला, दूसरा, तीसरा
  depth: core
  skills:
  - num.big-time
  body:
    en: 'Ordinals say “first, second, third”: {{प्रथमः}}, {{द्वितीयः}}, {{तृतीयः}}, {{चतुर्थः}}, {{पञ्चमः}}, {{षष्ठः}}, {{सप्तमः}}, {{अष्टमः}}, {{नवमः}}, {{दशमः}}. They act like adjectives, so there is also a feminine: {{प्रथमा}}, {{द्वितीया}}, {{तृतीया}}. You have met these as the names of the cases.'
    hi: 'क्रमवाचक ‘पहला, दूसरा, तीसरा’ बताते हैं: {{प्रथमः}}, {{द्वितीयः}}, {{तृतीयः}}, {{चतुर्थः}}, {{पञ्चमः}}, {{षष्ठः}}, {{सप्तमः}}, {{अष्टमः}}, {{नवमः}}, {{दशमः}}। ये विशेषण की तरह चलते हैं, इसलिए स्त्रीलिंग भी है: {{प्रथमा}}, {{द्वितीया}}, {{तृतीया}}। आप इन्हें विभक्तियों के नाम के रूप में मिल चुके हैं।'
  term:
    sa: क्रमवाचकम्
    meaning:
      en: an ordinal number
      hi: क्रमसूचक संख्या
- id: t3
  kind: teach
  title:
    en: The day and the watch
    hi: दिन और पहर
  depth: core
  skills:
  - num.big-time
  body:
    en: 'A day and night has eight watches, {{प्रहराः}}, so one {{प्रहरः}} is three hours. The day-parts are {{प्रातः}} (morning), {{मध्याह्नः}} (midday), {{सायम्}} (evening), {{रात्रिः}} (night). For when: {{अद्य}} (today), {{श्वः}} (tomorrow), {{ह्यः}} (yesterday), {{परश्वः}} (the day after tomorrow).'
    hi: 'एक दिन-रात में आठ पहर होते हैं, {{प्रहराः}}, इसलिए एक {{प्रहरः}} तीन घंटे का है। दिन के भाग हैं {{प्रातः}} (सुबह), {{मध्याह्नः}} (दोपहर), {{सायम्}} (शाम), {{रात्रिः}} (रात)। कब के लिए: {{अद्य}} (आज), {{श्वः}} (कल, आने वाला), {{ह्यः}} (कल, बीता हुआ), {{परश्वः}} (परसों)।'
  examples:
  - sa: अद्य सप्त दिनानि।
    meaning:
      en: Today it is seven days.
      hi: आज सात दिन हो गए।
    words:
    - sa: अद्य
      gloss:
        en: today
        hi: आज
    - sa: सप्त
      gloss:
        en: seven
        hi: सात
    - sa: दिनानि
      gloss:
        en: days
        hi: दिन
      check:
        type: subanta
        stem: दिन
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Bahu
  - sa: श्वः प्रातः।
    meaning:
      en: Tomorrow morning.
      hi: कल सुबह।
    words:
    - sa: श्वः
      gloss:
        en: tomorrow
        hi: कल
    - sa: प्रातः
      gloss:
        en: morning
        hi: सुबह

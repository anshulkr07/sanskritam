        hi: वह
    - sa: पठति
      gloss:
        en: reads
        hi: पढ़ता है
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
  - sa: सा लिखति।
    meaning:
      en: She writes.
      hi: वह लिखती है।
    words:

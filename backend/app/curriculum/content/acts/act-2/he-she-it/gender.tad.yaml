- id: p3
  kind: practice
  title:
    en: Point at the puppets
    hi: कठपुतलियों को दिखाइए
  depth: core
  skills:
  - pron.tad
  mode: choice
  prompt:
    en: “That fruit is sweet.” Which pronoun?
    hi: ‘वह फल मीठा है।’ कौन-सा सर्वनाम?
  explain:
    en: '{{फलम्}} is neuter: {{तत्}}.'
    hi: '{{फलम्}} नपुंसक है: {{तत्}}।'
  roman: after
  gate: true
  story:
    success:
      en: “सः! सा! तत्!” You point at king, queen and crown in turn, and each puppet bows. A little round face with a painted smile pops over the curtain.
      hi: “सः! सा! तत्!” आप राजा, रानी और मुकुट की ओर बारी-बारी इशारा करते हैं और हर कठपुतली झुकती है। परदे के ऊपर चित्रित मुस्कान वाला एक नन्हा गोल चेहरा उभर आता है।
    failure:
      en: 'The puppets stay still. The crown is neuter: {{तत्}}.'
      hi: 'कठपुतलियाँ स्थिर रहती हैं। मुकुट नपुंसक है: {{तत्}}।'
  options:
  - sa: सः
  - sa: सा
  - correct: true
    sa: तत्
- id: sum
  kind: summary
  title:
    en: He, she, it
    hi: वह
  depth: core
  points:
  - sa: सः · सा · तत्
    text:
      en: Masculine, feminine, neuter.
      hi: पुंलिंग, स्त्रीलिंग, नपुंसक।
  - sa: तौ · ते · ताः · ते · तानि
    text:
      en: Two and many.
      hi: दो और अनेक।
  - text:
      en: The pronoun matches its noun.
      hi: सर्वनाम अपनी संज्ञा से मेल खाता है।

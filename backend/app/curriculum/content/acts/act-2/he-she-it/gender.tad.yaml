  body:
    en: 'A pronoun replaces a noun: {{बालकः पठति}} becomes {{सः पठति}}; {{बालिका पठति}} becomes {{सा पठति}}. The verb does
      not change.'
    hi: 'सर्वनाम संज्ञा की जगह आता है: {{बालकः पठति}} का {{सः पठति}} हो जाता है; {{बालिका पठति}} का {{सा पठति}}। क्रिया नहीं
      बदलती।'
  examples:

    en: 'Two forms are alike: {{ते}} is both the feminine and neuter dual, and the masculine plural. Context tells which.'
    hi: 'कुछ रूप एक-से हैं: {{ते}} स्त्रीलिंग और नपुंसक का द्विवचन भी है और पुंलिंग का बहुवचन भी। प्रसंग बताता है कि कौन-सा।'
- id: t2
  kind: teach
  title:
    en: Pronouns in sentences
    hi: वाक्यों में सर्वनाम
  depth: core
  skills:
  - pron.tad
  body:
    en: 'A pronoun replaces a noun: {{बालकः पठति}} becomes {{सः पठति}}; {{बालिका पठति}} becomes {{सा पठति}}. The verb does not change.'
    hi: 'सर्वनाम संज्ञा की जगह आता है: {{बालकः पठति}} का {{सः पठति}} हो जाता है; {{बालिका पठति}} का {{सा पठति}}। क्रिया नहीं बदलती।'
  examples:
  - sa: सः पठति।
    meaning:
      en: He reads.
      hi: वह पढ़ता है।
    words:
    - sa: सः
      gloss:
        en: he
        hi: वह
    - sa: पठति
      gloss:
        en: reads
        hi: पढ़ता है
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
  - sa: सा लिखति।
    meaning:
      en: She writes.
      hi: वह लिखती है।
    words:
    - sa: सा
      gloss:
        en: she
        hi: वह
    - sa: लिखति
      gloss:
        en: writes
        hi: लिखती है
      check:
        type: tinanta
        dhatu: लिख्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
  - sa: तत् फलम् अस्ति।
    meaning:
      en: That is a fruit.
      hi: वह फल है।
    words:
    - sa: तत्
      gloss:
        en: it
        hi: वह
    - sa: फलम्
      gloss:
        en: fruit
        hi: फल
      check:
        type: subanta
        stem: फल
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Eka
    - sa: अस्ति
      gloss:
        en: is
        hi: है
      check:
        type: tinanta
        dhatu: अस्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
- id: p1
  kind: practice
  depth: core
  skills:
  - pron.tad
  mode: choice
  prompt:
    en: You mean the queen. Which pronoun?
    hi: आपका आशय रानी से है। कौन-सा सर्वनाम?
  explain:
    en: A feminine noun takes {{सा}}.
    hi: स्त्रीलिंग संज्ञा के लिए {{सा}}।
  roman: after
  options:
  - sa: सः
  - correct: true
    sa: सा
  - sa: तत्
- id: p2
  kind: practice
  depth: core
  skills:
  - pron.tad
  mode: match
  prompt:
    en: Join each pronoun to the noun it stands for.
    hi: हर सर्वनाम को उस संज्ञा से जोड़िए जिसकी जगह वह आता है।
  explain:
    en: The pronoun takes the gender and number of its noun.
    hi: सर्वनाम अपनी संज्ञा का लिंग और वचन लेता है।
  roman: after
  pairs:

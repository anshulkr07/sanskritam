cards:
- id: s1
  kind: story
  title:
    en: Who is that?
    hi: वह कौन है?
  depth: core
  image:
    brief: 'Śuka on Dādī''s shoulder pointing a wing at three puppets in turn: a king, a queen and a golden crown; the puppeteer''s wife laughing and holding up the crown; the small rainbow-coloured spirit peeking.'
    alt:
      en: A parrot points at a king, a queen and a crown puppet in turn
      hi: राजा, रानी और मुकुट की कठपुतली की ओर बारी-बारी इशारा करता तोता
    cast:
    - you
    - dadi
    - shuka
    - rangaka
    place: utsava
    ratio: '4:3'
    id: gender-tad-s1
  narration:
    en: 'Śuka points at the puppets. “He!” “She!” “It!” The puppeteer''s wife laughs and holds up the crown. Dādī says: “Instead of repeating a noun, use a short word that matches its gender. Sanskrit has one for each.”'
    hi: शुक कठपुतलियों की ओर इशारा करता है। “वह!” “वह!” “वह!” कठपुतली वाले की पत्नी हँसकर मुकुट उठाती है। दादी कहती हैं, “संज्ञा दोहराने की जगह उसी के लिंग से मेल खाता छोटा शब्द बोलिए। संस्कृत में हर लिंग के लिए एक है।”
- id: t1
  kind: teach
  title:
    en: He, she, it
    hi: वह (पुं.), वह (स्त्री.), वह (नपुं.)
  depth: core
  skills:
  - pron.tad
  body:
    en: '{{सः}} means “he”, {{सा}} “she”, {{तत्}} “it”. They stand for a masculine, a feminine and a neuter noun: {{सः बालकः}} (that boy), {{सा बालिका}}, {{तत् फलम्}}.'
    hi: '{{सः}} का अर्थ ‘वह (पुं.)’, {{सा}} ‘वह (स्त्री.)’, {{तत्}} ‘वह (नपुं.)’। ये पुंलिंग, स्त्रीलिंग और नपुंसक संज्ञा के स्थान पर आते हैं: {{सः बालकः}} (वह बालक), {{सा बालिका}}, {{तत् फलम्}}।'
  rows:
  - sa: सः
    gloss:
      en: he, that
      hi: वह
    check:
      type: subanta
      stem: तद्
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: सा
    gloss:
      en: she, that
      hi: वह (स्त्री)
    check:
      type: subanta
      stem: तद्
      linga: Stri
      vibhakti: Prathama
      vacana: Eka
  - sa: तत्
    gloss:
      en: it, that
      hi: वह (नपुं.)
    check:
      type: subanta
      stem: तद्
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka

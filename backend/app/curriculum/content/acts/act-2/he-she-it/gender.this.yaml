- id: s1
  kind: story
  title:
    en: Which one?
    hi: कौन-सा?
  depth: core
  image:
    brief: A sweet-seller's brass tray heaped with sweets at the fair; the boatman, the old man and Dādī each pointing at
      a different one, near and far; Śuka perched on the tray's edge eyeing a sweet.
    alt:
      en: People at a sweet stall pointing at different sweets, near and far
      hi: मिठाई की थाली पर पास और दूर की अलग-अलग चीज़ें दिखाते लोग
    cast:
    - you
    - dadi
    - shuka
    - rangaka
    place: utsava
    ratio: '4:3'
    id: gender-this-s1
  narration:
    en: At a sweet-seller's tray the boatman, the old man and Dādī all point at different things. “That one!” “This one!”
      Dādī taps the tray. “For something right here in front of you, Sanskrit says एषः, एषा, एतत्. For something over there,
      सः, सा, तत्.”
    hi: मिठाई वाले की थाली पर नाविक, बुज़ुर्ग और दादी अलग-अलग चीज़ों की ओर इशारा करते हैं। “वह वाली!” “यह वाली!” दादी थाली
      थपथपाती हैं। “जो ठीक सामने है, उसके लिए संस्कृत कहती है एषः, एषा, एतत्। जो वहाँ दूर है, उसके लिए सः, सा, तत्।”
- id: t1
  kind: teach
  title:
    en: This, here
    hi: यह, यहाँ का
  depth: core
  skills:
  - pron.etad
  body:
    en: '{{एषः}} (masculine), {{एषा}} (feminine), {{एतत्}} (neuter) mean “this”, close by. Use {{सः सा तत्}} for something
      farther off, or already mentioned.'
    hi: '{{एषः}} (पुंलिंग), {{एषा}} (स्त्रीलिंग), {{एतत्}} (नपुंसक) का अर्थ ‘यह’, पास का। जो दूर है या पहले कहा जा चुका है,
      उसके लिए {{सः सा तत्}}।'

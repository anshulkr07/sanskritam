- id: p3
  kind: practice
  title:
    en: This sweet
    hi: यह मिठाई
  depth: core
  skills:
  - pron.etad
  mode: order
  prompt:
    en: 'Say: “This is a fruit.”'
    hi: 'कहिए: ‘यह फल है।’'
  explain:
    en: '{{एतत् फलम्}}: this is a fruit.'
    hi: '{{एतत् फलम्}}: यह फल है।'
  roman: after
  gate: true
  story:
    success:
      en: '“एतत् फलम्,” you say, taking one from the tray. The seller beams. The multi-coloured spirit, hiding in the shadow
        of the tray, whispers: “एषः… एषा… एतत्…” as if counting himself.'
      hi: '“एतत् फलम्,” आप थाली से एक उठाते हैं। विक्रेता खिल उठता है। थाली की छाया में छिपा रंग-बिरंगा भूत फुसफुसाता है:
        “एषः… एषा… एतत्…” मानो ख़ुद को गिन रहा हो।'

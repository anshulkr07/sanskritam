    en: 'Dual and plural follow the same pattern: {{एतौ एते}}, {{एते एताः}}, {{एते एतानि}}.'
    hi: 'द्विवचन और बहुवचन भी इसी ढंग के हैं: {{एतौ एते}}, {{एते एताः}}, {{एते एतानि}}।'
- id: p1
  kind: practice
  depth: core
  skills:
  - pron.etad
  mode: choice
  prompt:
    en: Dādī taps the sweet right in front of her. Which pronoun?
    hi: दादी अपने सामने की मिठाई पर उँगली रखती हैं। कौन-सा सर्वनाम?
  explain:
    en: 'A neuter thing close by: {{एतत्}}.'
    hi: 'पास की नपुंसक वस्तु: {{एतत्}}।'
  roman: after
  options:
  - sa: तत्
  - correct: true
    sa: एतत्
  - sa: सः

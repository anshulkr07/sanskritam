cards:
- id: s1
  kind: story
  title:
    en: The garland-maker
    hi: माला वाली
  depth: core
  image:
    brief: A garland-maker sitting under a banyan tree at the fair with a basket of flowers, a trailing white jasmine vine
      and her small daughter pointing at the river; Śuka tugging at a flower; the rainbow-coloured spirit hiding in the basket.
    alt:
      en: A garland-maker under a banyan tree with her small daughter
      hi: बरगद के नीचे माला वाली और उसकी छोटी बेटी
    cast:
    - you
    - dadi
    - shuka
    - rangaka
    place: utsava
    ratio: '4:3'
    id: gender-lata-s1
  narration:
    en: Under a banyan tree sits a garland-maker with a basket of flowers and a vine of white jasmine. “लता,” she says, holding
      up a trailing creeper. “कन्या,” she says, of her small daughter. “नदी,” says her daughter, pointing at the river. The
      three words end differently from the boys' words, but alike with each other.
    hi: बरगद के नीचे माला वाली बैठी है, उसके पास फूलों की टोकरी और सफ़ेद चमेली की एक बेल है। “लता,” वह फैलती हुई लता उठाकर
      कहती है। “कन्या,” वह अपनी छोटी बेटी के लिए कहती है। “नदी,” बेटी नदी की ओर इशारा करके कहती है। ये तीनों शब्द बालकों के
      शब्दों से अलग समाप्त होते हैं, पर आपस में एक-से हैं।
- id: t1
  kind: teach
  title:
    en: Feminine in -आ
    hi: -आ वाले स्त्रीलिंग
  depth: core
  skills:
  - gen.feminine-a
  sutras:
  - 4.1.4
  body:
    en: 'Many feminine words end in {{आ}}: {{लता}} (creeper), {{कन्या}} (girl), {{बालिका}}, {{माला}} (garland). You can make
      a feminine from a masculine by adding {{आ}}: {{छात्रः}} → {{छात्रा}}.'
    hi: 'अनेक स्त्रीलिंग शब्द {{आ}} पर समाप्त होते हैं: {{लता}}, {{कन्या}}, {{बालिका}}, {{माला}}। पुंलिंग में {{आ}} जोड़कर
      स्त्रीलिंग बनाया जा सकता है: {{छात्रः}} → {{छात्रा}}।'
  examples:
  - sa: लता
    meaning:
      en: a creeper
      hi: लता
    check:
      type: subanta
      stem: लता
      linga: Stri
      vibhakti: Prathama
      vacana: Eka
  - sa: छात्रा

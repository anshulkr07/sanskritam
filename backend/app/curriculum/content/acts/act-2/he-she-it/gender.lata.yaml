- id: pn
  kind: teach
  title:
    en: Pāṇini's feminine makers
    hi: पाणिनि के स्त्रीप्रत्यय
  depth: panini
  skills:
  - gen.feminine-a
  sutras:
  - 4.1.4
  - 4.1.5
  body:
    en: Sūtra 4.1.4 says a word ending in {{अ}} makes its feminine with {{टाप्}}, which shows up as {{आ}}. Sūtra 4.1.5 gives
      {{ङीप्}}, which shows up as {{ई}}, to words in {{ऋ}} and {{न्}} and others.
    hi: सूत्र 4.1.4 कहता है कि -{{अ}} वाला शब्द {{टाप्}} से स्त्रीलिंग बनाता है, जो {{आ}} के रूप में दिखता है। सूत्र 4.1.5
      {{ऋ}} और {{न्}} आदि वाले शब्दों को {{ङीप्}} देता है, जो {{ई}} के रूप में दिखता है।
  term:
    sa: टाप्
    meaning:
      en: the suffix that gives -आ
      hi: -आ देने वाला प्रत्यय
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: Sūtra 4.1.4 says a word ending in {{अ}} makes its feminine with {{टाप्}}, which shows up as {{आ}}. Sūtra 4.1.5 gives
        {{ङीप्}}, which shows up as {{ई}}, to words in {{ऋ}} and {{न्}} and others.
      hi: सूत्र 4.1.4 कहता है कि -{{अ}} वाला शब्द {{टाप्}} से स्त्रीलिंग बनाता है, जो {{आ}} के रूप में दिखता है। सूत्र 4.1.5
        {{ऋ}} और {{न्}} आदि वाले शब्दों को {{ङीप्}} देता है, जो {{ई}} के रूप में दिखता है।
    items:
    - id: i0
      sa: अ
    - id: i1
      sa: टाप्
    - id: i2
      sa: आ
    - id: i3
      sa: ङीप्
    - id: i4
      sa: ई
    - id: i5
      sa: ऋ
    - id: i6
      sa: न्

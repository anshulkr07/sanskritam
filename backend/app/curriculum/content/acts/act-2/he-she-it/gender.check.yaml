- id: p3
  kind: practice
  depth: core
  skills:
  - pron.tad
  mode: choice
  prompt:
    en: You mean the queen. Which pronoun?
    hi: आपका आशय रानी से है। कौन-सा सर्वनाम?
  explain:
    en: '{{सा}}: she.'
    hi: '{{सा}}: वह (स्त्री)।'
  roman: after
  options:
  - sa: सः
  - correct: true
    sa: सा
  - sa: तत्
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: '{{सः}} means “he”, {{सा}} “she”, {{तत्}} “it”. They stand for a masculine, a feminine and a neuter noun: {{सः बालकः}}
        (that boy), {{सा बालिका}}, {{तत् फलम्}}.'
      hi: '{{सः}} का अर्थ ‘वह (पुं.)’, {{सा}} ‘वह (स्त्री.)’, {{तत्}} ‘वह (नपुं.)’। ये पुंलिंग, स्त्रीलिंग और नपुंसक संज्ञा
        के स्थान पर आते हैं: {{सः बालकः}} (वह बालक), {{सा बालिका}}, {{तत् फलम्}}।'
    items:
    - id: i0
      sa: सः
      meaning:
        en: he, that
        hi: वह
      check:
        type: subanta
        stem: तद्
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{तद्}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{तद्}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
    - id: i1
      sa: सा
      meaning:
        en: she, that
        hi: वह (स्त्री)
      check:
        type: subanta
        stem: तद्
        linga: Stri
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{तद्}} · feminine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{तद्}} · {{स्त्रीलिंग}} · {{प्रथमा}} · {{एकवचन}}'
    - id: i2
      sa: तत्
      meaning:
        en: it, that
        hi: वह (नपुं.)
      check:
        type: subanta
        stem: तद्
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{तद्}} · neuter · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{तद्}} · {{नपुंसकलिंग}} · {{प्रथमा}} · {{एकवचन}}'

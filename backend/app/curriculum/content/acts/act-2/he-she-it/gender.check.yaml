id: gender.check
template: check
title:
  en: Name the puppets
  hi: कठपुतलियों के नाम बताइए
title_sa: परीक्षा
minutes: 4
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - gen.three
  mode: match
  prompt:
    en: Match each word with its gender.
    hi: हर शब्द को उसके लिंग से मिलाइए।
  explain:
    en: The ending gives the gender.
    hi: प्रत्यय लिंग बताता है।
  roman: after
  pairs:
  - left:
      sa: वृक्षः
    right:
      text:
        en: masculine
        hi: पुंलिंग
  - left:
      sa: लता
    right:
      text:
        en: feminine
        hi: स्त्रीलिंग
  - left:
      sa: पुष्पम्
    right:
      text:
        en: neuter
        hi: नपुंसक
- id: p2
  kind: practice
  depth: core
  skills:
  - gen.three
  mode: choice
  prompt:
    en: Which word is feminine?
    hi: स्त्रीलिंग शब्द कौन-सा है?
  explain:
    en: '{{कन्या}}: feminine in {{आ}}.'
    hi: '{{कन्या}}: {{आ}} वाला स्त्रीलिंग।'
  roman: after
  options:
  - sa: गृहम्
  - correct: true
    sa: कन्या
  - sa: पर्वतः
- id: p3
  kind: practice
  depth: core
  skills:
  - pron.tad
  mode: choice
  prompt:
    en: You mean the queen. Which pronoun?
    hi: आपका आशय रानी से है। कौन-सा सर्वनाम?
  explain:
    en: '{{सा}}: she.'
    hi: '{{सा}}: वह (स्त्री)।'
  roman: after
  options:
  - sa: सः
  - correct: true
    sa: सा
  - sa: तत्
- id: p4
  kind: practice
  depth: core
  skills:
  - pron.tad
  mode: match
  prompt:
    en: Match each pronoun with its noun.
    hi: हर सर्वनाम को उसकी संज्ञा से मिलाइए।
  explain:
    en: The pronoun takes its noun's gender.
    hi: सर्वनाम अपनी संज्ञा का लिंग लेता है।
  roman: after
  pairs:
  - left:
      sa: सः
    right:
      sa: बालकः
  - left:
      sa: सा
    right:
      sa: बालिका
  - left:
      sa: तत्
    right:
      sa: फलम्
- id: p5
  kind: practice
  depth: core
  skills:
  - pron.etad
  mode: choice
  prompt:
    en: Something right in front of you, a neuter thing. Which pronoun?
    hi: ठीक आपके सामने कोई नपुंसक वस्तु। कौन-सा सर्वनाम?
  explain:
    en: '{{एतत्}}: this (neuter).'
    hi: '{{एतत्}}: यह (नपुं.)।'
  roman: after
  options:
  - sa: तत्
  - correct: true
    sa: एतत्
  - sa: एषा
- id: p6
  kind: practice
  depth: core
  skills:
  - gen.agreement
  mode: choice
  prompt:
    en: “A sweet fruit.” Which phrase?
    hi: ‘एक मीठा फल।’ कौन-सा वाक्यांश?
  explain:
    en: Neuter noun, neuter adjective.
    hi: नपुंसक संज्ञा, नपुंसक विशेषण।
  roman: after
  options:
  - sa: मधुरः फलम्
  - sa: मधुरा फलम्
  - correct: true
    sa: मधुरं फलम्
- id: p7
  kind: practice
  depth: core
  skills:
  - gen.feminine-a
  mode: match
  prompt:
    en: Match each masculine with its feminine.
    hi: हर पुंलिंग को उसके स्त्रीलिंग से मिलाइए।
  explain:
    en: Add {{आ}} or {{ई}}.
    hi: '{{आ}} या {{ई}} जोड़िए।'
  roman: after
  pairs:
  - left:
      sa: छात्रः
    right:
      sa: छात्रा
  - left:
      sa: देवः
    right:
      sa: देवी
  - left:
      sa: बालकः
    right:
      sa: बालिका
- id: p8
  kind: practice
  depth: core
  skills:
  - pron.tad
  - gen.agreement
  - gen.feminine-a
  mode: order
  prompt:
    en: 'Say: “That sweet girl is a student.”'
    hi: 'कहिए: ‘वह मधुर बालिका छात्रा है।’'
  explain:
    en: '{{सा मधुरा बालिका छात्रा}}: every word feminine.'
    hi: '{{सा मधुरा बालिका छात्रा}}: हर शब्द स्त्रीलिंग।'
  roman: after
  gate: true
  story:
    success:
      en: '“सा मधुरा बालिका छात्रा,” you say, and every puppet in the booth turns to bow. The multi-coloured spirit stops flickering and glows one clear gold: “सः मुक्तः, सा मुक्ता, तत् मुक्तम्.” He points to the market stalls: “आपणे फलानि सन्ति।”'
      hi: '“सा मधुरा बालिका छात्रा,” आप कहते हैं, और मंडली की हर कठपुतली झुककर प्रणाम करती है। इन्द्रधनुषी भूत झिलमिलाना छोड़ एक साफ़ सुनहरे रंग में दमकता है: “सः मुक्तः, सा मुक्ता, तत् मुक्तम्।” वह बाज़ार की दुकानों की ओर इशारा करता है: “आपणे फलानि सन्ति।”'
    failure:
      en: The booth waits. Four feminine words in a row.
      hi: मंडली प्रतीक्षा करती है। एक पंक्ति में चार स्त्रीलिंग शब्द।
  tokens:
  - सा
  - मधुरा
  - बालिका
  - छात्रा

id: gender.check
template: check
title:
  en: Name the puppets
  hi: कठपुतलियों के नाम बताइए
title_sa: परीक्षा
minutes: 4
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - gen.three
  mode: match
  prompt:
    en: Match each word with its gender.
    hi: हर शब्द को उसके लिंग से मिलाइए।
  explain:
    en: The ending gives the gender.
    hi: प्रत्यय लिंग बताता है।
  roman: after
  pairs:
  - left:
      sa: वृक्षः
    right:
      text:
        en: masculine
        hi: पुंलिंग
  - left:
      sa: लता
    right:
      text:
        en: feminine
        hi: स्त्रीलिंग
  - left:
      sa: पुष्पम्
    right:
      text:
        en: neuter
        hi: नपुंसक
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Every noun is masculine ({{पुंलिङ्गम्}}), feminine ({{स्त्रीलिङ्गम्}}) or neuter ({{नपुंसकलिङ्गम्}}). The typical
        endings: {{बालकः}} (masculine), {{बालिका}} (feminine), {{फलम्}} (neuter). People follow their sex; things take whatever
        gender their word has.'
      hi: 'हर संज्ञा पुंलिंग, स्त्रीलिंग या नपुंसकलिंग होती है। विशिष्ट प्रत्यय: {{बालकः}} (पुंलिंग), {{बालिका}} (स्त्रीलिंग),
        {{फलम्}} (नपुंसकलिंग)। मनुष्य अपने लिंग के अनुसार चलते हैं; वस्तुएँ अपने शब्द का लिंग लेती हैं।'
    items:
    - id: i0
      sa: पुंलिङ्गम्
    - id: i1
      sa: स्त्रीलिङ्गम्
    - id: i2
      sa: नपुंसकलिङ्गम्
    - id: i3
      sa: बालकः
    - id: i4
      sa: बालिका
    - id: i5
      sa: फलम्

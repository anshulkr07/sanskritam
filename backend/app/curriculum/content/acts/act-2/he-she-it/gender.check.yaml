  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: मधुरः बालकः।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: a sweet boy
        hi: एक मधुर बालक
      words:
      - sa: मधुरः
        gloss:
          en: sweet
          hi: मीठा
        check:
          type: subanta
          stem: मधुर
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: बालकः
        gloss:
          en: boy
          hi: बालक
        check:
          type: subanta
          stem: बालक
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
    - id: i1
      sa: मधुरः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: sweet
        hi: मीठा
      check:
        type: subanta
        stem: मधुर
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{मधुर}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{मधुर}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
    - id: i2
      sa: बालकः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: boy
        hi: बालक
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Prathama

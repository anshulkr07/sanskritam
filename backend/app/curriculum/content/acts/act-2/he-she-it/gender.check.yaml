  mode: choice
  prompt:
    en: “A sweet fruit.” Which phrase?
    hi: ‘एक मीठा फल।’ कौन-सा वाक्यांश?
  explain:
    en: Neuter noun, neuter adjective.
    hi: नपुंसक संज्ञा, नपुंसक विशेषण।
  roman: after
  options:
  - sa: मधुरः फलम्
  - sa: मधुरा फलम्
  - correct: true

        endings: {{बालकः}} (masculine), {{बालिका}} (feminine), {{फलम्}} (neuter). People follow their sex; things take whatever
        gender their word has.'
      hi: 'हर संज्ञा पुंलिंग, स्त्रीलिंग या नपुंसकलिंग होती है। विशिष्ट प्रत्यय: {{बालकः}} (पुंलिंग), {{बालिका}} (स्त्रीलिंग),
        {{फलम्}} (नपुंसकलिंग)। मनुष्य अपने लिंग के अनुसार चलते हैं; वस्तुएँ अपने शब्द का लिंग लेती हैं।'
    items:

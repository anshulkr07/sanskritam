        en: 'Stem: {{बालक}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{बालक}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: A describing word, an adjective ({{विशेषणम्}}), agrees with its noun in gender, number and case. {{मधुरः}} {{बालकः}},
          {{मधुरा}} {{बालिका}}, {{मधुरम्}} {{फलम्}}.
        hi: वर्णन करने वाला शब्द, विशेषण, अपनी संज्ञा से लिंग, वचन और विभक्ति में मेल खाता है। {{मधुरः}} {{बालकः}}, {{मधुरा}}

- id: p5
  kind: practice
  depth: core
  skills:
  - pron.etad
  mode: choice
  prompt:
    en: Something right in front of you, a neuter thing. Which pronoun?
    hi: ठीक आपके सामने कोई नपुंसक वस्तु। कौन-सा सर्वनाम?
  explain:
    en: '{{एतत्}}: this (neuter).'
    hi: '{{एतत्}}: यह (नपुं.)।'
  roman: after
  options:
  - sa: तत्
  - correct: true
    sa: एतत्
  - sa: एषा
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: '{{एषः}} (masculine), {{एषा}} (feminine), {{एतत्}} (neuter) mean “this”, close by. Use {{सः सा तत्}} for something
        farther off, or already mentioned.'
      hi: '{{एषः}} (पुंलिंग), {{एषा}} (स्त्रीलिंग), {{एतत्}} (नपुंसक) का अर्थ ‘यह’, पास का। जो दूर है या पहले कहा जा चुका
        है, उसके लिए {{सः सा तत्}}।'
    items:
    - id: i0
      sa: एषः
      meaning:
        en: this (m)
        hi: यह (पुं.)
      check:
        type: subanta
        stem: एतद्
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{एतद्}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{एतद्}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
    - id: i1

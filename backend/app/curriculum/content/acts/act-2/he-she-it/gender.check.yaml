        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{एतद्}} · neuter · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{एतद्}} · {{नपुंसकलिंग}} · {{प्रथमा}} · {{एकवचन}}'
- id: p6
  kind: practice
  depth: core
  skills:

        gloss:
          en: boy
          hi: बालक
        check:
          type: subanta
          stem: बालक
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
- id: p7
  kind: practice
  depth: core
  skills:
  - gen.feminine-a
  mode: match
  prompt:
    en: Match each masculine with its feminine.
    hi: हर पुंलिंग को उसके स्त्रीलिंग से मिलाइए।
  explain:
    en: Add {{आ}} or {{ई}}.
    hi: '{{आ}} या {{ई}} जोड़िए।'
  roman: after
  pairs:
  - left:
      sa: छात्रः
    right:
      sa: छात्रा
  - left:
      sa: देवः
    right:
      sa: देवी
  - left:
      sa: बालकः
    right:
      sa: बालिका
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: लता
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: a creeper
        hi: लता
      check:
        type: subanta
        stem: लता
        linga: Stri
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{लता}} · feminine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{लता}} · {{स्त्रीलिंग}} · {{प्रथमा}} · {{एकवचन}}'
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'Many feminine words end in {{आ}}: {{लता}} (creeper), {{कन्या}} (girl), {{बालिका}}, {{माला}} (garland). You can
          make a feminine from a masculine by adding {{आ}}: {{छात्रः}} → {{छात्रा}}.'
        hi: 'अनेक स्त्रीलिंग शब्द {{आ}} पर समाप्त होते हैं: {{लता}}, {{कन्या}}, {{बालिका}}, {{माला}}। पुंलिंग में {{आ}} जोड़कर
          स्त्रीलिंग बनाया जा सकता है: {{छात्रः}} → {{छात्रा}}।'
    - id: i3
      sa: लता
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: a creeper
        hi: लता
      check:
        type: subanta
        stem: लता
        linga: Stri
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{लता}} · feminine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{लता}} · {{स्त्रीलिंग}} · {{प्रथमा}} · {{एकवचन}}'
- id: p8
  kind: practice
  depth: core
  skills:
  - pron.tad
  - gen.agreement
  - gen.feminine-a
  mode: order
  prompt:
    en: 'Say: “That sweet girl is a student.”'
    hi: 'कहिए: ‘वह मधुर बालिका छात्रा है।’'
  explain:
    en: '{{सा मधुरा बालिका छात्रा}}: every word feminine.'
    hi: '{{सा मधुरा बालिका छात्रा}}: हर शब्द स्त्रीलिंग।'
  roman: after
  gate: true
  story:
    success:
      en: '“सा मधुरा बालिका छात्रा,” you say, and every puppet in the booth turns to bow. The multi-coloured spirit stops
        flickering and glows one clear gold: “सः मुक्तः, सा मुक्ता, तत् मुक्तम्.” He points to the market stalls: “आपणे फलानि
        सन्ति।”'
      hi: '“सा मधुरा बालिका छात्रा,” आप कहते हैं, और मंडली की हर कठपुतली झुककर प्रणाम करती है। इन्द्रधनुषी भूत झिलमिलाना छोड़
        एक साफ़ सुनहरे रंग में दमकता है: “सः मुक्तः, सा मुक्ता, तत् मुक्तम्।” वह बाज़ार की दुकानों की ओर इशारा करता है: “आपणे
        फलानि सन्ति।”'
    failure:
      en: The booth waits. Four feminine words in a row.
      hi: मंडली प्रतीक्षा करती है। एक पंक्ति में चार स्त्रीलिंग शब्द।

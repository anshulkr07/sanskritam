id: he-she-it
title:
  en: He, she, it
  hi: 'वह: तीन लिंग'
title_sa: लिङ्गम्
status: ready
episode:
  summary:
    en: The village fair downstream is full of people and things. Every noun is masculine, feminine or neuter, and the words around it follow.
    hi: नीचे गाँव का मेला लोगों और चीज़ों से भरा है। हर संज्ञा पुल्लिंग, स्त्रीलिंग या नपुंसकलिंग है, और उसके आसपास के शब्द उसी का पालन करते हैं।
  beats:
  - 'सः, सा, तत्: he, she, it at the fair.'
  - 'एषः, एषा, एतत्: this one.'
  - Adjectives agree with their nouns.

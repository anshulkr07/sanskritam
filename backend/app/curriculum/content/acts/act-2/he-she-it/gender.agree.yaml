- id: p1
  kind: practice
  depth: core
  skills:
  - gen.agreement
  mode: choice
  prompt:
    en: “A sweet girl.” Which adjective?
    hi: ‘एक मधुर बालिका।’ कौन-सा विशेषण?
  explain:
    en: A feminine noun takes {{मधुरा}}.
    hi: स्त्रीलिंग संज्ञा के लिए {{मधुरा}}।
  roman: after
  options:
  - sa: मधुरः
  - correct: true
    sa: मधुरा
  - sa: मधुरम्
- id: p2
  kind: practice
  depth: core
  skills:
  - gen.agreement
  mode: match
  prompt:
    en: Match each adjective with its noun.
    hi: हर विशेषण को उसकी संज्ञा से मिलाइए।
  explain:
    en: Gender, number and case all match.
    hi: लिंग, वचन और विभक्ति सब मेल खाते हैं।
  roman: after
  pairs:
  - left:
      sa: मधुरः
    right:
      sa: बालकः
  - left:
      sa: मधुरा
    right:
      sa: बालिका
  - left:
      sa: मधुरम्
    right:
      sa: फलम्
  - left:
      sa: मधुराणि
    right:
      sa: फलानि
- id: e1
  kind: explore
  depth: core
  skills:
  - gen.agreement
  widget: mark_words
  prompt:
    en: Tap the adjective in each pair.
    hi: हर जोड़ी में विशेषण को छुइए।
  params:
    passage:
    - मधुरम्
    - फलम्
    - श्वेता
    - लता
    - नूतनः
    - मार्गः
    targets:
    - मधुरम्
    - श्वेता
    - नूतनः
  roman: show
- id: p3
  kind: practice
  title:
    en: Describe it
    hi: वर्णन कीजिए
  depth: core
  skills:
  - gen.agreement
  mode: choice
  prompt:
    en: '“A white flower”: {{पुष्पम्}} is neuter. Which?'
    hi: '‘एक सफ़ेद फूल’: {{पुष्पम्}} नपुंसक है। कौन-सा?'
  explain:
    en: A neuter noun takes the neuter adjective {{श्वेतम्}}.
    hi: नपुंसक संज्ञा के लिए नपुंसक विशेषण {{श्वेतम्}}।
  roman: after
  gate: true
  story:
    success:
      en: '“श्वेतं पुष्पम्,” you say, and the multi-coloured spirit flushes white all over, like a petal. Then pink. Then gold: he cannot decide.'
      hi: '“श्वेतं पुष्पम्,” आप कहते हैं, और इन्द्रधनुषी भूत पूरा फूल की पंखुड़ी-सा सफ़ेद हो जाता है। फिर गुलाबी। फिर सुनहरा: वह तय नहीं कर पाता।'
    failure:
      en: 'He stays grey. Neuter noun, neuter adjective: both end in {{अम्}}.'
      hi: 'वह धूसर ही रहता है। नपुंसक संज्ञा, नपुंसक विशेषण: दोनों {{अम्}} पर समाप्त होते हैं।'
  options:
  - sa: श्वेतः पुष्पम्
  - sa: श्वेता पुष्पम्
  - correct: true
    sa: श्वेतं पुष्पम्
- id: sum
  kind: summary
  title:
    en: Agreement
    hi: मेल
  depth: core
  points:
  - sa: मधुरः बालकः · मधुरा बालिका · मधुरं फलम्
    text:
      en: The adjective matches gender.
      hi: विशेषण लिंग से मेल खाता है।
  - sa: मधुरौ · मधुराः · मधुराणि
    text:
      en: …and number.
      hi: …और वचन से।
  - text:
      en: …and, later, case.
      hi: …और आगे चलकर विभक्ति से भी।

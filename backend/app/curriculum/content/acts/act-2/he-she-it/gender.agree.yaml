- id: s1
  kind: story
  title:
    en: Sweet, big, beautiful
    hi: मीठा, बड़ा, सुन्दर
  depth: core
  image:
    brief: The puppeteer's wife at her stall holding up a sweet fruit, a sweet cake and a doll of a pretty girl while Dādī
      listens with a raised finger; the small rainbow-coloured spirit on a lamp changing colour.
    alt:
      en: A stall-keeper describing her wares while a small colour-changing spirit watches
      hi: अपना सामान बखानती दुकानदार और रंग बदलता नन्हा भूत
    cast:
    - you
    - dadi
    - shuka
    - rangaka
    place: utsava
    ratio: '4:3'
    id: gender-agree-s1
  narration:
    en: The puppeteer's wife describes her wares. “A sweet fruit. A sweet cake. A beautiful girl.” Dādī listens carefully.
      “Do you hear it? The describing word changes shape to match what it describes.” The rainbow spirit, perched on a lamp,
      changes colour as each word goes by.
    hi: कठपुतली वाले की पत्नी अपना सामान बखानती है। “मीठा फल। मीठी बर्फ़ी। सुन्दर बालिका।” दादी ध्यान से सुनती हैं। “सुनाई
      दिया? वर्णन करने वाला शब्द उसी के अनुसार रूप बदलता है जिसका वह वर्णन करता है।” दीपक पर बैठा इन्द्रधनुषी भूत हर शब्द
      के साथ रंग बदलता है।
- id: t1
  kind: teach
  title:
    en: Adjectives agree
    hi: विशेषण मेल खाते हैं
  depth: core
  skills:
  - gen.agreement
  body:
    en: A describing word, an adjective ({{विशेषणम्}}), agrees with its noun in gender, number and case. {{मधुरः}} {{बालकः}},
      {{मधुरा}} {{बालिका}}, {{मधुरम्}} {{फलम्}}.
    hi: वर्णन करने वाला शब्द, विशेषण, अपनी संज्ञा से लिंग, वचन और विभक्ति में मेल खाता है। {{मधुरः}} {{बालकः}}, {{मधुरा}}
      {{बालिका}}, {{मधुरम्}} {{फलम्}}।

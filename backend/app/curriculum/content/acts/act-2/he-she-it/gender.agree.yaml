- id: t2
  kind: teach
  title:
    en: Number agrees too
    hi: वचन भी मेल खाता है
  depth: core
  skills:
  - gen.agreement
  body:
    en: 'The adjective follows its noun''s number as well: {{मधुरौ बालकौ}} (two sweet boys), {{मधुराः बालिकाः}}, {{मधुराणि फलानि}}.'
    hi: 'विशेषण अपनी संज्ञा के वचन के अनुसार भी चलता है: {{मधुरौ बालकौ}} (दो मधुर बालक), {{मधुराः बालिकाः}}, {{मधुराणि फलानि}}।'
  examples:
  - sa: मधुरौ बालकौ।
    meaning:
      en: two sweet boys
      hi: दो मधुर बालक
    words:
    - sa: मधुरौ
      gloss:
        en: sweet
        hi: मीठे
      check:
        type: subanta
        stem: मधुर
        linga: Pum
        vibhakti: Prathama
        vacana: Dvi
    - sa: बालकौ
      gloss:
        en: boys
        hi: बालक
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Prathama
        vacana: Dvi
  - sa: मधुराः बालिकाः।
    meaning:
      en: sweet girls
      hi: मधुर बालिकाएँ
    words:
    - sa: मधुराः
      gloss:
        en: sweet
        hi: मीठी
      check:
        type: subanta
        stem: मधुरा
        linga: Stri
        vibhakti: Prathama
        vacana: Bahu
    - sa: बालिकाः
      gloss:
        en: girls
        hi: बालिकाएँ
      check:
        type: subanta
        stem: बालिका
        linga: Stri
        vibhakti: Prathama
        vacana: Bahu
  - sa: मधुराणि फलानि।
    meaning:
      en: sweet fruits
      hi: मीठे फल
    words:
    - sa: मधुराणि

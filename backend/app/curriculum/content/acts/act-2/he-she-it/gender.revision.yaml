  - skill: pron.etad
    formula: एषः एषा एतत्
    rule:
      en: 'This one: {{एषः}}, {{एषा}}, {{एतत्}}.'
      hi: 'यह: {{एषः}}, {{एषा}}, {{एतत्}}।'
    tag: core
    taught_in: gender.this#t1
    visuals:
    - id: v-linked-2
      kind: comparison
      title:
        en: Compare the examples
        hi: उदाहरणों की तुलना करें
      explanation:
        en: '{{एषः}} (masculine), {{एषा}} (feminine), {{एतत्}} (neuter) mean “this”, close by. Use {{सः सा तत्}} for something
          farther off, or already mentioned.'
        hi: '{{एषः}} (पुंलिंग), {{एषा}} (स्त्रीलिंग), {{एतत्}} (नपुंसक) का अर्थ ‘यह’, पास का। जो दूर है या पहले कहा जा चुका
          है, उसके लिए {{सः सा तत्}}।'
      items:
      - id: i0
        sa: एषः
        meaning:
          en: this (m)
          hi: यह (पुं.)
        check:
          type: subanta
          stem: एतद्
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
        feature:
          en: 'Stem: {{एतद्}} · masculine · {{प्रथमा}} · singular'
          hi: 'प्रातिपदिक: {{एतद्}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
        compare_from: एतद्

          vibhakti: Prathama
          vacana: Eka
        feature:
          en: 'Stem: {{एतद्}} · feminine · {{प्रथमा}} · singular'
          hi: 'प्रातिपदिक: {{एतद्}} · {{स्त्रीलिंग}} · {{प्रथमा}} · {{एकवचन}}'
        compare_from: एतद्

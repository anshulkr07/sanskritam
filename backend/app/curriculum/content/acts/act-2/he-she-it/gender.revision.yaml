      hi: '{{अजाद्यतष्टाप्}}: {{टाप्}} ({{आ}} के रूप में) -{{अ}} वाले शब्दों का स्त्रीलिंग बनाता है।'
    sutras:
    - 4.1.4
    tag: core
    taught_in: gender.lata#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 4.1.4 says a word ending in {{अ}} makes its feminine with {{टाप्}}, which shows up as {{आ}}. Sūtra 4.1.5
          gives {{ङीप्}}, which shows up as {{ई}}, to words in {{ऋ}} and {{न्}} and others.
        hi: सूत्र 4.1.4 कहता है कि -{{अ}} वाला शब्द {{टाप्}} से स्त्रीलिंग बनाता है, जो {{आ}} के रूप में दिखता है। सूत्र 4.1.5
          {{ऋ}} और {{न्}} आदि वाले शब्दों को {{ङीप्}} देता है, जो {{ई}} के रूप में दिखता है।
      items:
      - id: i0
        sa: अ
      - id: i1
        sa: टाप्

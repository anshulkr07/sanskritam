- id: t2
  kind: teach
  title:
    en: Grammar gender, not nature
    hi: व्याकरण का लिंग, प्रकृति का नहीं
  depth: core
  skills:
  - gen.three
  body:
    en: A river is feminine, a mountain masculine, water neuter, because of their words, not their nature. Even “wife” can
      be neuter ({{कलत्रम्}}) or plural masculine ({{दाराः}}). Learn the gender with each new noun.
    hi: नदी स्त्रीलिंग है, पर्वत पुंलिंग, जल नपुंसक, इसलिए कि उनके शब्द ऐसे हैं, उनका स्वभाव नहीं। ‘पत्नी’ भी नपुंसक ({{कलत्रम्}})
      या बहुवचन पुंलिंग ({{दाराः}}) हो सकता है। हर नई संज्ञा के साथ उसका लिंग सीखिए।
  examples:
  - sa: नदी
    meaning:
      en: 'a river: feminine'
      hi: 'नदी: स्त्रीलिंग'
    check:
      type: subanta
      stem: नदी
      linga: Stri
      vibhakti: Prathama
      vacana: Eka
  - sa: पर्वतः
    meaning:
      en: 'a mountain: masculine'
      hi: 'पर्वत: पुंलिंग'
    check:
      type: subanta
      stem: पर्वत
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: जलम्
    meaning:
      en: 'water: neuter'
      hi: 'जल: नपुंसक'
    check:
      type: subanta
      stem: जल
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka

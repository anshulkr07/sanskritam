- id: s1
  kind: story
  title:
    en: The fair
    hi: मेला
  depth: core
  image:
    brief: 'A riverside village fair: strings of paper flags, sweet sellers, a wooden wheel and a puppet booth with a red
      curtain where a puppeteer holds up a king, a queen and a golden crown puppet; you, Dādī and Śuka in the crowd, a small
      rainbow-coloured spirit peeping from behind the curtain.'
    alt:
      en: A puppet booth at a village fair with a king, a queen and a crown
      hi: मेले में राजा, रानी और मुकुट वाली कठपुतली मंडली
    cast:
    - you
    - dadi
    - shuka
    - rangaka
    place: utsava
    ratio: '4:3'
    id: gender-three-s1
  narration:
    en: 'Downstream, the river bank is a festival: paper flags, sweet-sellers, a wooden wheel, a puppet booth with a red curtain.
      A puppeteer shows his cast: a king, a queen, a golden crown. Śuka insists the queen is a “he”. “Every Sanskrit word
      has a gender,” says Dādī, “and it is not always the one you expect.”'
    hi: 'नदी के आगे का तट उत्सव बना है: काग़ज़ की झंडियाँ, मिठाई वाले, एक लकड़ी का चक्र, लाल परदे वाली कठपुतली की मंडली। कठपुतली
      वाला अपने पात्र दिखाता है: एक राजा, एक रानी, एक सुनहरा मुकुट। शुक अड़ा है कि रानी ‘पुल्लिंग’ है। दादी कहती हैं, “संस्कृत
      के हर शब्द का एक लिंग होता है, और वह हमेशा वैसा नहीं होता जैसा आप सोचें।”'
  lines:
  - speaker: dadi
    sa: उत्सवे जनाः सन्ति।
    gloss:
      en: There are people at the fair.
      hi: मेले में लोग हैं।
- id: t1
  kind: teach
  title:
    en: Masculine, feminine, neuter
    hi: पुंलिंग, स्त्रीलिंग, नपुंसकलिंग
  depth: core
  skills:
  - gen.three
  body:
    en: 'Every noun is masculine ({{पुंलिङ्गम्}}), feminine ({{स्त्रीलिङ्गम्}}) or neuter ({{नपुंसकलिङ्गम्}}). The typical
      endings: {{बालकः}} (masculine), {{बालिका}} (feminine), {{फलम्}} (neuter). People follow their sex; things take whatever
      gender their word has.'
    hi: 'हर संज्ञा पुंलिंग, स्त्रीलिंग या नपुंसकलिंग होती है। विशिष्ट प्रत्यय: {{बालकः}} (पुंलिंग), {{बालिका}} (स्त्रीलिंग),
      {{फलम्}} (नपुंसकलिंग)। मनुष्य अपने लिंग के अनुसार चलते हैं; वस्तुएँ अपने शब्द का लिंग लेती हैं।'
  term:
    sa: लिङ्गम्
    meaning:
      en: gender
      hi: लिंग
  visuals:

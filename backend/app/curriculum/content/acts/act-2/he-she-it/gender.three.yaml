    hi: कठपुतली के पात्र
  depth: core
  skills:
  - gen.three
  mode: choice
  prompt:
    en: The puppeteer holds up the queen. Which word fits a feminine noun?
    hi: कठपुतली वाला रानी दिखाता है। स्त्रीलिंग संज्ञा के लिए कौन-सा रूप ठीक है?
  explain:
    en: '{{कन्या}}: a feminine word in -{{आ}}.'
    hi: '{{कन्या}}: -{{आ}} वाला स्त्रीलिंग शब्द।'
  roman: after
  gate: true
  story:
    success:
      en: “कन्या,” you say, and the puppeteer lifts the queen high. A small multi-coloured face peeks out from behind the
        curtain, copies your word under its breath, and ducks back.
      hi: “कन्या,” आप कहते हैं, और कठपुतली वाला रानी को ऊँचा उठाता है। परदे के पीछे से एक नन्हा रंग-बिरंगा चेहरा झाँकता है,
        आपका शब्द धीमे से दोहराता है और फिर छिप जाता है।
    failure:
      en: 'The queen does not rise. Feminine: look for an ending in {{आ}}.'
      hi: 'रानी नहीं उठती। स्त्रीलिंग: {{आ}} पर समाप्त होने वाला रूप खोजिए।'
  options:
  - sa: राजकः
  - correct: true
    sa: कन्या
  - sa: गृहम्
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Every noun is masculine ({{पुंलिङ्गम्}}), feminine ({{स्त्रीलिङ्गम्}}) or neuter ({{नपुंसकलिङ्गम्}}). The typical
        endings: {{बालकः}} (masculine), {{बालिका}} (feminine), {{फलम्}} (neuter). People follow their sex; things take whatever
        gender their word has.'
      hi: 'हर संज्ञा पुंलिंग, स्त्रीलिंग या नपुंसकलिंग होती है। विशिष्ट प्रत्यय: {{बालकः}} (पुंलिंग), {{बालिका}} (स्त्रीलिंग),
        {{फलम्}} (नपुंसकलिंग)। मनुष्य अपने लिंग के अनुसार चलते हैं; वस्तुएँ अपने शब्द का लिंग लेती हैं।'
    items:
    - id: i0
      sa: पुंलिङ्गम्
    - id: i1
      sa: स्त्रीलिङ्गम्
    - id: i2
      sa: नपुंसकलिङ्गम्
    - id: i3
      sa: बालकः
    - id: i4
      sa: बालिका
    - id: i5
      sa: फलम्
- id: sum
  kind: summary
  title:
    en: Three genders
    hi: तीन लिंग
  depth: core
  points:
  - sa: बालकः · बालिका · फलम्
    text:
      en: Masculine, feminine, neuter.
      hi: पुंलिंग, स्त्रीलिंग, नपुंसक।
  - sa: अः · आ · ई · अम्
    text:
      en: The typical endings.
      hi: विशिष्ट प्रत्यय।
  - text:
      en: Gender follows the word, not nature.
      hi: लिंग शब्द के अनुसार है, प्रकृति के नहीं।

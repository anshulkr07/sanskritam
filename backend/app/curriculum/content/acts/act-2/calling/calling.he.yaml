      -उ → {{ओ}} ({{गुरो}}), -ऋ → {{अः}} ({{पितः}})।'
- id: t2
  kind: teach
  title:
    en: A call is outside the sentence
    hi: पुकार वाक्य से बाहर
  depth: core
  skills:
  - case.voc
  body:
    en: 'The vocative does not change the verb. It is an extra word, set off by a comma: {{हे बालक, त्वं कुत्र असि?}} The
      verb still agrees with {{त्वम्}}. Plural calls look like the first case plural: {{हे बालकाः!}}'
    hi: 'सम्बोधन क्रिया को नहीं बदलता। यह अतिरिक्त शब्द है, अल्पविराम से अलग: {{हे बालक, त्वं कुत्र असि?}} क्रिया अब भी {{त्वम्}}
      से मेल खाती है। बहुवचन पुकार प्रथमा बहुवचन जैसी दिखती है: {{हे बालकाः!}}'
  examples:
  - sa: हे बालक त्वम् कुत्र असि?
    meaning:
      en: O boy, where are you?
      hi: अरे बालक, तुम कहाँ हो?
    words:
    - sa: हे
      gloss:
        en: O
        hi: अरे
    - sa: बालक
      gloss:
        en: boy
        hi: बालक
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Sambodhana
        vacana: Eka
    - sa: त्वम्
      gloss:
        en: you
        hi: तुम
    - sa: कुत्र
      gloss:
        en: where
        hi: कहाँ
    - sa: असि
      gloss:
        en: are
        hi: हो
      check:
        type: tinanta
        dhatu: अस्
        lakara: Lat
        purusha: Madhyama
        vacana: Eka
  - sa: हे बालकाः आगच्छथ!
    meaning:
      en: Boys, come!
      hi: बालको, आओ!
    words:
    - sa: हे
      gloss:
        en: O
        hi: अरे
    - sa: बालकाः
      gloss:
        en: boys
        hi: बालको
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Sambodhana
        vacana: Bahu
    - sa: आगच्छथ
      gloss:
        en: come
        hi: आओ
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Madhyama
        vacana: Bahu
        prefixes:
        - आ

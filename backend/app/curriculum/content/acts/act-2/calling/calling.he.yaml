  depth: panini
  skills:
  - case.voc
  sutras:
  - 2.3.47
  - 2.3.49
  body:
    en: Sūtra 2.3.47, {{सम्बोधने च}}, gives address the first case in form, and 2.3.49, {{एकवचनं सम्बुद्धिः}}, names the singular
      ending of the call {{सम्बुद्धिः}}. So the call is a special form of the first case.
    hi: सूत्र 2.3.47, {{सम्बोधने च}}, सम्बोधन को रूप में प्रथमा देता है, और 2.3.49, {{एकवचनं सम्बुद्धिः}}, पुकार के एकवचन
      के प्रत्यय को {{सम्बुद्धिः}} नाम देता है। इसलिए सम्बोधन प्रथमा का विशेष रूप है।
  term:
    sa: सम्बुद्धिः
    meaning:
      en: the ending of the call
      hi: सम्बोधन का प्रत्यय

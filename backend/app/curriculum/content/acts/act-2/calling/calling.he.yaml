cards:
- id: s1
  kind: story
  title:
    en: A voice in the lanes
    hi: गलियों में एक आवाज़
  depth: core
  image:
    brief: A narrow dark village lane at night, whitewashed walls lit by the small lamp you carry, Dādī beside you with a
      hand cupped to her mouth calling; a faint blue-grey ripple-shaped spirit with ear-like curls peeking from behind a wall;
      Śuka on your shoulder with his head cocked.
    alt:
      en: Two people with a lamp calling down a dark village lane while a faint echo-spirit peeks from a wall
      hi: अँधेरी गली में दीपक लेकर पुकारते दो लोग और दीवार से झाँकता गूँज-भूत
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - pratidhvanika
    place: grama
    ratio: '4:3'
    id: calling-he-s1
  narration:
    en: A pupil has gone out after dark to fetch water and has not come back. The village lanes are narrow and black. You
      and Dādī go out with a lamp, calling. Your voice bounces back from the walls, a half-second late and strangely sweet.
      Something answers every word you say, and it is not the pupil.
    hi: एक शिष्य अँधेरा होने के बाद पानी लाने गया था और लौटा नहीं। गाँव की गलियाँ तंग और काली हैं। आप और दादी दीपक लेकर पुकारते
      निकलते हैं। आपकी आवाज़ दीवारों से लौटती है, आधा क्षण देर से और अजीब रूप से मधुर। कोई आपके हर शब्द का उत्तर दे रहा है,
      और वह शिष्य नहीं है।
  lines:
  - speaker: dadi
    sa: हे बालक!
    gloss:
      en: O boy!
      hi: अरे बालक!
- id: t1
  kind: teach
  title:
    en: 'The call: the vocative'
    hi: 'पुकार: सम्बोधन'
  depth: core
  skills:
  - case.voc
  sutras:
  - 2.3.47
  - 2.3.49
  body:
    en: 'When you call someone, you use the vocative, {{सम्बोधनम्}}. It is usually the bare stem, often with {{हे}} before
      it: {{हे बालक!}} (O boy!), {{हे मित्र!}} (O friend!). For a few endings the vowel changes.'
    hi: 'जब आप किसी को पुकारते हैं, तब सम्बोधन आता है। यह प्रायः मूल रूप होता है, अक्सर आगे {{हे}} के साथ: {{हे बालक!}} (अरे
      बालक!), {{हे मित्र!}} (अरे मित्र!)। कुछ अन्त वाले शब्दों में स्वर बदल जाता है।'
  examples:
  - sa: बालक
    meaning:
      en: O boy!
      hi: हे बालक!
    check:
      type: subanta
      stem: बालक
      linga: Pum
      vibhakti: Sambodhana
      vacana: Eka
  - sa: मित्र
    meaning:
      en: O friend!
      hi: हे मित्र!
    check:
      type: subanta
      stem: मित्र
      linga: Napumsaka
      vibhakti: Sambodhana
      vacana: Eka
  - sa: आचार्य
    meaning:
      en: O teacher!
      hi: हे आचार्य!
    check:
      type: subanta
      stem: आचार्य
      linga: Pum
      vibhakti: Sambodhana
      vacana: Eka
  term:
    sa: सम्बोधनम्
    meaning:
      en: 'the vocative: calling'
      hi: 'सम्बोधन: पुकारना'

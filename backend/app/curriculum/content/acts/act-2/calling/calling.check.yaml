- id: p8
  kind: practice
  depth: core
  skills:
  - case.voc
  - case.overview
  mode: order
  prompt:
    en: 'Call the echo by her name and say who you are: “O echo, I am here.”'
    hi: 'गूँज को उसके नाम से पुकारकर बताइए कि आप कौन हैं: ‘हे गूँज, मैं यहाँ हूँ।’'
  explain:
    en: '{{हे प्रतिध्वनिक, अहम् अस्मि}}: a call, then a sentence.'
    hi: '{{हे प्रतिध्वनिक, अहम् अस्मि}}: पुकार, फिर वाक्य।'
  roman: after
  gate: true
  story:
    success:
      en: '“हे प्रतिध्वनिक, अहम् अस्मि.” The blue-grey echo hears herself called by name, in the call-form, for the first time ever. She does not repeat it. She answers: “हे बालक! हे मित्र! अहम् अस्मि।” Then she rises, a ripple turning into light, and says one last thing, softly, pointing at the school: “पुस्तकालये शब्दरूपाणि सन्ति।”'
      hi: '“हे प्रतिध्वनिक, अहम् अस्मि।” नीली-धूसर गूँज पहली बार अपना नाम सम्बोधन-रूप में पुकारा जाता सुनती है। वह उसे दोहराती नहीं। वह उत्तर देती है: “हे बालक! हे मित्र! अहम् अस्मि।” फिर वह ऊपर उठती है, एक लहर रोशनी बनती हुई, और आख़िरी बात धीमे से कहती है, पाठशाला की ओर इशारा करके: “पुस्तकालये शब्दरूपाणि सन्ति।”'
    failure:
      en: The echo is silent. A call, then your own sentence.
      hi: गूँज चुप है। पुकार, फिर आपका अपना वाक्य।
  tokens:
  - हे
  - प्रतिध्वनिक
  - अहम्
  - अस्मि

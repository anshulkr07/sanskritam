id: calling.check
template: check
title:
  en: Call and name
  hi: पुकारिए और नाम बताइए
title_sa: परीक्षा
minutes: 4
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - case.voc
  mode: choice
  prompt:
    en: You call a girl. Which word?
    hi: आप एक बालिका को पुकारते हैं। कौन-सा शब्द?
  explain:
    en: 'The call of {{बालिका}}: {{बालिके}}.'
    hi: '{{बालिका}} की पुकार: {{बालिके}}।'
  roman: after
  options:
  - sa: बालिका
  - sa: बालिकाम्
  - correct: true
    sa: बालिके
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: बालक
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: O boy!
        hi: हे बालक!
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Sambodhana
        vacana: Eka
      feature:
        en: 'Stem: {{बालक}} · masculine · {{सम्बोधन}} · singular'
        hi: 'प्रातिपदिक: {{बालक}} · {{पुंलिंग}} · {{सम्बोधन}} · {{एकवचन}}'
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'When you call someone, you use the vocative, {{सम्बोधनम्}}. It is usually the bare stem, often with {{हे}} before
          it: {{हे बालक!}} (O boy!), {{हे मित्र!}} (O friend!). For a few endings the vowel changes.'
        hi: 'जब आप किसी को पुकारते हैं, तब सम्बोधन आता है। यह प्रायः मूल रूप होता है, अक्सर आगे {{हे}} के साथ: {{हे बालक!}}
          (अरे बालक!), {{हे मित्र!}} (अरे मित्र!)। कुछ अन्त वाले शब्दों में स्वर बदल जाता है।'
    - id: i3
      sa: बालक
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: O boy!
        hi: हे बालक!
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Sambodhana
        vacana: Eka
      feature:
        en: 'Stem: {{बालक}} · masculine · {{सम्बोधन}} · singular'
        hi: 'प्रातिपदिक: {{बालक}} · {{पुंलिंग}} · {{सम्बोधन}} · {{एकवचन}}'

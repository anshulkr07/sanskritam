- id: p4
  kind: practice
  depth: core
  skills:
  - case.overview
  mode: match
  prompt:
    en: Match each case with its role.
    hi: हर विभक्ति को उसकी भूमिका से मिलाइए।
  explain:
    en: Case and role go together.
    hi: विभक्ति और भूमिका साथ चलती हैं।
  roman: after
  pairs:
  - left:
      sa: प्रथमा
    right:
      text:
        en: the doer
        hi: कर्ता
  - left:
      sa: द्वितीया
    right:
      text:
        en: the object
        hi: कर्म
  - left:
      sa: तृतीया
    right:
      text:
        en: the means
        hi: साधन
  - left:
      sa: पञ्चमी
    right:
      text:
        en: the source
        hi: स्रोत
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Pāṇini sees six roles in an action, the kārakas: the doer {{कर्ता}}, the object {{कर्म}}, the means {{करणम्}},
        the recipient {{सम्प्रदानम्}}, the source {{अपादानम्}}, and the locus {{अधिकरणम्}}. Each takes its own case.'
      hi: 'पाणिनि क्रिया में छह भूमिकाएँ देखते हैं, कारक: कर्ता, कर्म, करण, सम्प्रदान, अपादान और अधिकरण। हर एक अपनी विभक्ति
        लेती है।'
    items:
    - id: i0
      sa: कर्ता
      meaning:
        en: 'the doer: first case'
        hi: 'करने वाला: प्रथमा'
    - id: i1
      sa: कर्म
      meaning:
        en: 'the object: second case'
        hi: 'जिस पर क्रिया: द्वितीया'
    - id: i2
      sa: करणम्
      meaning:
        en: 'the means: third case'
        hi: 'साधन: तृतीया'
    - id: i3
      sa: सम्प्रदानम्
      meaning:
        en: 'the recipient: fourth case'
        hi: 'पाने वाला: चतुर्थी'
    - id: i4
      sa: अपादानम्
      meaning:
        en: 'the source: fifth case'
        hi: 'स्रोत: पञ्चमी'
    - id: i5
      sa: अधिकरणम्
      meaning:
        en: 'the locus: seventh case'
        hi: 'आधार: सप्तमी'

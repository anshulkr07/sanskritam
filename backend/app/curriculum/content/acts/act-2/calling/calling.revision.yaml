    rule:
      en: 'Do not read the roles from word order: read them from the endings.'
      hi: 'भूमिकाएँ शब्द-क्रम से मत पढ़िए: प्रत्ययों से पढ़िए।'
    tag: core
    taught_in: calling.eight#t1
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Compare the examples
        hi: उदाहरणों की तुलना करें
      explanation:
        en: 'Pāṇini sees six roles in an action, the kārakas: the doer {{कर्ता}}, the object {{कर्म}}, the means {{करणम्}},
          the recipient {{सम्प्रदानम्}}, the source {{अपादानम्}}, and the locus {{अधिकरणम्}}. Each takes its own case.'
        hi: 'पाणिनि क्रिया में छह भूमिकाएँ देखते हैं, कारक: कर्ता, कर्म, करण, सम्प्रदान, अपादान और अधिकरण। हर एक अपनी विभक्ति
          लेती है।'
      items:
      - id: i0
        sa: कर्ता
        meaning:
          en: 'the doer: first case'
          hi: 'करने वाला: प्रथमा'
      - id: i1
        sa: कर्म
        meaning:
          en: 'the object: second case'
          hi: 'जिस पर क्रिया: द्वितीया'
      - id: i2
        sa: करणम्
        meaning:
          en: 'the means: third case'
          hi: 'साधन: तृतीया'
      - id: i3
        sa: सम्प्रदानम्
        meaning:
          en: 'the recipient: fourth case'
          hi: 'पाने वाला: चतुर्थी'
      - id: i4
        sa: अपादानम्
        meaning:
          en: 'the source: fifth case'
          hi: 'स्रोत: पञ्चमी'
      - id: i5
        sa: अधिकरणम्
        meaning:
          en: 'the locus: seventh case'
          hi: 'आधार: सप्तमी'
- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: case.voc
    rule:
      en: '{{सम्बोधने च}}: address; {{एकवचनं सम्बुद्धिः}}: the singular ending of the call is {{सम्बुद्धिः}}.'
      hi: '{{सम्बोधने च}}: सम्बोधन; {{एकवचनं सम्बुद्धिः}}: पुकार का एकवचन प्रत्यय {{सम्बुद्धिः}} है।'
    sutras:
    - 2.3.47
    - 2.3.49
    tag: core
    taught_in: calling.he#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 2.3.47, {{सम्बोधने च}}, gives address the first case in form, and 2.3.49, {{एकवचनं सम्बुद्धिः}}, names the
          singular ending of the call {{सम्बुद्धिः}}. So the call is a special form of the first case.
        hi: सूत्र 2.3.47, {{सम्बोधने च}}, सम्बोधन को रूप में प्रथमा देता है, और 2.3.49, {{एकवचनं सम्बुद्धिः}}, पुकार के एकवचन
          के प्रत्यय को {{सम्बुद्धिः}} नाम देता है। इसलिए सम्बोधन प्रथमा का विशेष रूप है।
      items:
      - id: i0
        sa: सम्बोधने च
      - id: i1
        sa: एकवचनं सम्बुद्धिः
      - id: i2
        sa: सम्बुद्धिः

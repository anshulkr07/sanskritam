- id: mistakes
  kind: revision
  title:
    en: Common mistakes
    hi: आम भूलें
  depth: core
  section: mistakes
  rows:
  - skill: case.voc
    rule:
      en: 'Do not call with the first case: {{हे बालिके}}, not {{हे बालिका}}.'
      hi: 'पुकार के लिए प्रथमा मत लगाइए: {{हे बालिके}}, {{हे बालिका}} नहीं।'
    tag: core
    taught_in: calling.he#tb1
  - skill: case.overview
    rule:
      en: 'Do not read the roles from word order: read them from the endings.'
      hi: 'भूमिकाएँ शब्द-क्रम से मत पढ़िए: प्रत्ययों से पढ़िए।'
    tag: core
    taught_in: calling.eight#t1
- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: case.voc
    rule:
      en: '{{सम्बोधने च}}: address; {{एकवचनं सम्बुद्धिः}}: the singular ending of the call is {{सम्बुद्धिः}}.'
      hi: '{{सम्बोधने च}}: सम्बोधन; {{एकवचनं सम्बुद्धिः}}: पुकार का एकवचन प्रत्यय {{सम्बुद्धिः}} है।'
    sutras:
    - 2.3.47
    - 2.3.49
    tag: core
    taught_in: calling.he#pn

- title: Lesson text and story
  licence: original
cards:
- id: core
  kind: revision
  title:
    en: The rules
    hi: नियम
  depth: core
  section: core
  rows:
  - skill: case.voc
    formula: हे बालक!
    rule:
      en: A call is the stem, often after {{हे}}; it stands outside the sentence and does not change the verb.
      hi: पुकार मूल रूप है, प्रायः {{हे}} के बाद; वह वाक्य से बाहर रहती है और क्रिया को नहीं बदलती।
    sutras:
    - 2.3.47
    - 2.3.49
    tag: core
    taught_in: calling.he#t1
  - skill: case.voc
    formula: बालिके · नदि · कवे · गुरो · पितः
    rule:
      en: 'Changes in the call: -आ → {{ए}}, -ई → {{इ}}, -इ → {{ए}}, -उ → {{ओ}}, -ऋ → {{अः}}.'
      hi: 'पुकार में परिवर्तन: -आ → {{ए}}, -ई → {{इ}}, -इ → {{ए}}, -उ → {{ओ}}, -ऋ → {{अः}}।'
    tag: core
    taught_in: calling.he#tb1
  - skill: case.voc
    rule:
      en: 'The plural call looks like the first plural: {{हे बालकाः}}.'
      hi: 'बहुवचन पुकार प्रथमा बहुवचन जैसी दिखती है: {{हे बालकाः}}।'
    tag: core
    taught_in: calling.he#t2
  - skill: case.overview
    formula: १ २ ३ ४ ५ ६ ७ ८
    rule:
      en: 'Eight cases: first to seventh and the call.'
      hi: 'आठ विभक्तियाँ: प्रथमा से सप्तमी और सम्बोधन।'
    tag: core
    taught_in: calling.eight#tb1
  - skill: case.overview
    formula: कर्ता कर्म करणम् सम्प्रदानम् अपादानम् अधिकरणम्
    rule:
      en: 'Six kārakas: doer, object, means, recipient, source, locus; the sixth case is “the rest”.'
      hi: 'छह कारक: कर्ता, कर्म, करण, सम्प्रदान, अपादान, अधिकरण; षष्ठी ‘शेष’ है।'
    tag: core
    taught_in: calling.eight#t1
- id: conditions
  kind: revision
  title:
    en: When it applies
    hi: कब लागू होता है
  depth: core
  section: conditions
  rows:
  - skill: case.voc
    rule:
      en: 'Neuter words call like their first case ({{हे फल}}); the call of a word in -अन् or -वत् drops its {{त्}}: {{राजन्}},
        {{भगवन्}}.'
      hi: 'नपुंसक शब्द अपनी प्रथमा जैसे पुकारे जाते हैं ({{हे फल}}); -अन् या -वत् वाले शब्द की पुकार में {{त्}} हटता है: {{राजन्}},
        {{भगवन्}}।'
    example:
      sa: फल
      meaning:
        en: O fruit!
        hi: हे फल!
      check:
        type: subanta
        stem: फल
        linga: Napumsaka
        vibhakti: Sambodhana
        vacana: Eka
    tag: good
    new_here: true
    visuals:
    - id: v-source-new-0
      kind: worked
      title:
        en: Read, examine, understand
        hi: पढ़ें, समझें, फिर पढ़ें
      items:
      - id: i0
        sa: फल
        label:
          en: Read the whole example
          hi: पूरा उदाहरण पढ़ें
        meaning:
          en: O fruit!
          hi: हे फल!
        check:
          type: subanta
          stem: फल
          linga: Napumsaka
          vibhakti: Sambodhana
          vacana: Eka
        feature:
          en: 'Stem: {{फल}} · neuter · {{सम्बोधन}} · singular'
          hi: 'प्रातिपदिक: {{फल}} · {{नपुंसकलिंग}} · {{सम्बोधन}} · {{एकवचन}}'
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: 'Neuter words call like their first case ({{हे फल}}); the call of a word in -अन् or -वत् drops its {{त्}}: {{राजन्}},
            {{भगवन्}}.'
          hi: 'नपुंसक शब्द अपनी प्रथमा जैसे पुकारे जाते हैं ({{हे फल}}); -अन् या -वत् वाले शब्द की पुकार में {{त्}} हटता है:
            {{राजन्}}, {{भगवन्}}।'
      - id: i3
        sa: फल
        label:
          en: Read it again with the meaning
          hi: अर्थ समझकर फिर पढ़ें
        meaning:
          en: O fruit!
          hi: हे फल!
        check:
          type: subanta
          stem: फल
          linga: Napumsaka
          vibhakti: Sambodhana
          vacana: Eka
        feature:
          en: 'Stem: {{फल}} · neuter · {{सम्बोधन}} · singular'
          hi: 'प्रातिपदिक: {{फल}} · {{नपुंसकलिंग}} · {{सम्बोधन}} · {{एकवचन}}'
  - skill: case.overview
    rule:
      en: Every sentence combines roles, but most sentences use only two or three of them.
      hi: हर वाक्य में भूमिकाएँ मिलती हैं, पर अधिकतर वाक्य उनमें से दो-तीन ही लेते हैं।
    tag: good
    taught_in: calling.eight#t1
- id: exceptions
  kind: revision
  title:
    en: Odd cases
    hi: विचित्र स्थितियाँ
  depth: core
  section: exceptions
  rows:
  - skill: case.voc
    rule:
      en: '{{भोः}} (hey!) and {{अयि}} (O!) are calling words too; {{भोः}} often precedes a call: {{भोः आचार्य}}.'
      hi: '{{भोः}} (अरे!) और {{अयि}} (अहो!) भी पुकार के शब्द हैं; {{भोः}} अक्सर पुकार से पहले आता है: {{भोः आचार्य}}।'
    example:
      sa: भोः आचार्य!
      meaning:
        en: hey, teacher!
        hi: अरे आचार्य!
    tag: good
    new_here: true
    visuals:

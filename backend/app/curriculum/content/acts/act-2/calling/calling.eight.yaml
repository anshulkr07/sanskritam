- title: Lesson text and story
  licence: original
cards:
- id: s1
  kind: story
  title:
    en: Found
    hi: मिल गया
  depth: core
  image:
    brief: 'A procession returning through a lamplit village lane: the Ācārya with a lamp, the rescued pupil wrapped in Dādī''s
      shawl, you and Śuka beside them; a faint blue-grey echo-spirit walking quietly alongside; the school gate ahead.'
    alt:
      en: A group walking home through a lamplit lane with a rescued pupil and an echo-spirit
      hi: दीपक की रोशनी में गली से घर लौटता समूह, बचाया हुआ शिष्य और गूँज-भूत
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - pratidhvanika
    place: grama
    ratio: '4:3'
    id: calling-eight-s1
  narration:
    en: 'The boy is found curled up in a doorway, safe and cold. Everyone walks home through the lanes together: you, Dādī,
      the pupil, the Ācārya with his lamp, and a blue-grey echo that has stopped repeating and started to listen. At the school
      gate Dādī stops. “Eight cases. You have met all eight. Let us put them side by side.”'
    hi: 'बालक एक द्वार में सिमटा मिलता है, सुरक्षित और ठिठुरा। सब मिलकर गलियों से घर लौटते हैं: आप, दादी, शिष्य, दीपक लिए
      आचार्य, और एक नीली-धूसर गूँज जो दोहराना छोड़कर सुनने लगी है। पाठशाला के फाटक पर दादी रुकती हैं। “आठ विभक्तियाँ। तुम
      आठों से मिल चुके हो। आओ उन्हें साथ-साथ रखें।”'

- id: p4
  kind: practice
  title:
    en: All together
    hi: सब साथ
  depth: core
  skills:
  - case.overview
  mode: order
  prompt:
    en: 'Put all the roles in one sentence: “The boy comes from the village.”'
    hi: 'सारी भूमिकाएँ एक वाक्य में रखिए: ‘बालक गाँव से आता है।’'
  explain:
    en: '{{बालकः ग्रामात् आगच्छति}}: the doer and the source.'
    hi: '{{बालकः ग्रामात् आगच्छति}}: कर्ता और स्रोत।'
  roman: after
  gate: true
  story:
    success:
      en: '“बालकः ग्रामात् आगच्छति,” you say, and the little echo, hearing a full sentence for the first time, hums along:
        “…ग्रामात् आगच्छति…” Then she says, shyly, in her own voice, “अहम् अस्मि.”'
      hi: '“बालकः ग्रामात् आगच्छति,” आप कहते हैं, और नन्ही गूँज, पहली बार पूरा वाक्य सुनकर, साथ-साथ गुनगुनाती है: “…ग्रामात्
        आगच्छति…” फिर वह शर्माकर अपनी ही आवाज़ में कहती है, “अहम् अस्मि।”'
    failure:
      en: The echo waits. Doer, then source, then the verb.
      hi: गूँज प्रतीक्षा करती है। कर्ता, फिर स्रोत, फिर क्रिया।

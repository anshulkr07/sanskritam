  note:
    en: Six of the eight are the kāraka roles; the sixth is “the rest”, and the eighth is the call.
    hi: आठ में से छह कारक-भूमिकाएँ हैं; छठी ‘शेष’ है, और आठवीं पुकार।
- id: t1
  kind: teach
  title:
    en: The roles behind the cases
    hi: विभक्तियों के पीछे की भूमिकाएँ
  depth: core
  skills:
  - case.overview
  body:
    en: 'Pāṇini sees six roles in an action, the kārakas: the doer {{कर्ता}}, the object {{कर्म}}, the means {{करणम्}}, the
      recipient {{सम्प्रदानम्}}, the source {{अपादानम्}}, and the locus {{अधिकरणम्}}. Each takes its own case.'
    hi: 'पाणिनि क्रिया में छह भूमिकाएँ देखते हैं, कारक: कर्ता, कर्म, करण, सम्प्रदान, अपादान और अधिकरण। हर एक अपनी विभक्ति
      लेती है।'
  rows:
  - sa: कर्ता
    gloss:
      en: 'the doer: first case'
      hi: 'करने वाला: प्रथमा'
  - sa: कर्म
    gloss:
      en: 'the object: second case'
      hi: 'जिस पर क्रिया: द्वितीया'
  - sa: करणम्
    gloss:
      en: 'the means: third case'
      hi: 'साधन: तृतीया'
  - sa: सम्प्रदानम्
    gloss:
      en: 'the recipient: fourth case'
      hi: 'पाने वाला: चतुर्थी'
  - sa: अपादानम्
    gloss:
      en: 'the source: fifth case'
      hi: 'स्रोत: पञ्चमी'
  - sa: अधिकरणम्
    gloss:
      en: 'the locus: seventh case'
      hi: 'आधार: सप्तमी'
  term:
    sa: कारकम्
    meaning:
      en: a role in an action
      hi: क्रिया में भूमिका
  visuals:
  - id: v-source-compare
    kind: comparison
    title:
      en: Compare the examples
      hi: उदाहरणों की तुलना करें
    explanation:
      en: 'Pāṇini sees six roles in an action, the kārakas: the doer {{कर्ता}}, the object {{कर्म}}, the means {{करणम्}},
        the recipient {{सम्प्रदानम्}}, the source {{अपादानम्}}, and the locus {{अधिकरणम्}}. Each takes its own case.'
      hi: 'पाणिनि क्रिया में छह भूमिकाएँ देखते हैं, कारक: कर्ता, कर्म, करण, सम्प्रदान, अपादान और अधिकरण। हर एक अपनी विभक्ति
        लेती है।'
    items:
    - id: i0
      sa: कर्ता
      meaning:
        en: 'the doer: first case'
        hi: 'करने वाला: प्रथमा'
    - id: i1
      sa: कर्म
      meaning:
        en: 'the object: second case'
        hi: 'जिस पर क्रिया: द्वितीया'
    - id: i2
      sa: करणम्
      meaning:
        en: 'the means: third case'
        hi: 'साधन: तृतीया'
    - id: i3
      sa: सम्प्रदानम्
      meaning:
        en: 'the recipient: fourth case'
        hi: 'पाने वाला: चतुर्थी'
    - id: i4
      sa: अपादानम्
      meaning:
        en: 'the source: fifth case'
        hi: 'स्रोत: पञ्चमी'
    - id: i5
      sa: अधिकरणम्
      meaning:
        en: 'the locus: seventh case'
        hi: 'आधार: सप्तमी'

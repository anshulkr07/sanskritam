- id: p3
  kind: practice
  title:
    en: At dawn
    hi: भोर में
  depth: core
  skills:
  - case.loc-time
  mode: order
  prompt:
    en: 'Say: “At dawn we read.”'
    hi: 'कहिए: ‘भोर में हम पढ़ते हैं।’'
  explain:
    en: '{{प्रभाते वयं पठामः}}: the time in the seventh case.'
    hi: '{{प्रभाते वयं पठामः}}: समय सप्तमी में।'
  roman: after
  gate: true
  story:
    success:
      en: “प्रभाते वयं पठामः,” you say, and the lamp-spirit blinks, as if he were already a little afraid of dawn. “रात्रौ… दीपः अस्ति,” he says slowly, the first sentence he has ever made himself, and the whole courtyard hushes.
      hi: “प्रभाते वयं पठामः,” आप कहते हैं, और दीप-भूत पलकें झपकाता है, मानो भोर से पहले ही थोड़ा डर रहा हो। “रात्रौ… दीपः अस्ति,” वह धीरे-धीरे कहता है, उसका अपना बनाया पहला वाक्य, और पूरा आँगन चुप हो जाता है।
    failure:
      en: The lamp flickers. “When” goes in the seventh case, before the rest.
      hi: दीपक टिमटिमाता है। ‘कब’ सप्तमी में, बाक़ी से पहले।
  tokens:
  - प्रभाते
  - वयम्
  - पठामः
- id: pn
  kind: teach
  title:
    en: “When that happens”
    hi: ‘जब वह होता है’
  depth: panini
  skills:
  - case.loc-time
  body:
    en: A seventh-case word can also say “while this was happening”. It is the “absolute” construction, {{सति सप्तमी}}, and you will meet it in the syntax chapter.
    hi: सप्तमी वाला शब्द ‘जब यह हो रहा था’ भी कह सकता है। यह ‘सति सप्तमी’ है, जो वाक्य-रचना के अध्याय में मिलेगा।
  examples:
  - sa: सूर्ये उदिते
    meaning:
      en: 'the sun having risen: “when the sun has risen”'
      hi: सूर्य के उदय होने पर
- id: sum
  kind: summary
  title:
    en: When
    hi: कब
  depth: core
  points:
  - sa: प्रभाते · रात्रौ · दिने
    text:
      en: A time takes the seventh case.
      hi: समय सप्तमी लेता है।
  - sa: कदा?
    text:
      en: “When?” asks for this case.
      hi: ‘कब?’ इसी विभक्ति को माँगता है।
  - text:
      en: One case for place and time.
      hi: स्थान और समय के लिए एक विभक्ति।

cards:
- id: s1
  kind: story
  title:
    en: The hours of the house
    hi: घर के पहर
  depth: core
  image:
    brief: 'The Ācārya counting on his fingers in the lamplit house, four small scenes above him: dawn reading, noon meal, evening singing, night sleeping; the flame-shaped spirit flickering a different colour for each; Dādī nodding.'
    alt:
      en: An old teacher counts the hours of the day on his fingers while a flame-spirit changes colour
      hi: दिन के पहर उँगलियों पर गिनते आचार्य और रंग बदलता लौ-भूत
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - dipaka
    place: pathashala
    ratio: '4:3'
    id: in-when-s1
  narration:
    en: 'The little spirit asks: “And when?” The Ācārya counts it out on his fingers. “At dawn we read. At noon we eat. In the evening we sing. At night we sleep.” Each time he says it, the lamp flickers a different colour. Dādī nods: “The same case that says where also says when.”'
    hi: 'नन्हा भूत पूछता है: “और कब?” आचार्य उँगलियों पर गिनते हैं। “भोर में हम पढ़ते हैं। दोपहर में खाते हैं। साँझ को गाते हैं। रात में सोते हैं।” हर बार वे कहते हैं तो दीपक अलग रंग में टिमटिमाता है। दादी सिर हिलाती हैं: “जो विभक्ति ‘कहाँ’ कहती है वही ‘कब’ भी कहती है।”'
  lines:
  - speaker: acarya
    sa: रात्रौ स्वपिमि।
    gloss:
      en: At night I sleep.
      hi: रात में मैं सोता हूँ।
- id: t1
  kind: teach
  title:
    en: 'When: the seventh case again'
    hi: 'कब: फिर सप्तमी'
  depth: core
  skills:
  - case.loc-time
  body:
    en: 'A time when something happens takes the seventh case too: {{प्रभाते}} (in the morning), {{रात्रौ}} (at night), {{दिने}} (by day), {{मासे}} (in the month). It answers “when?”.'
    hi: 'जब कुछ होता है वह समय भी सप्तमी में आता है: {{प्रभाते}} (सुबह), {{रात्रौ}} (रात में), {{दिने}} (दिन में), {{मासे}} (महीने में)। यह ‘कब?’ का उत्तर देती है।'
  examples:
  - sa: प्रभाते वयम् पठामः।
    meaning:
      en: At dawn we read.
      hi: भोर में हम पढ़ते हैं।
    words:
    - sa: प्रभाते
      gloss:
        en: at dawn
        hi: भोर में
      check:
        type: subanta
        stem: प्रभात
        linga: Napumsaka
        vibhakti: Saptami
        vacana: Eka
    - sa: वयम्
      gloss:
        en: we
        hi: हम
    - sa: पठामः
      gloss:
        en: read
        hi: पढ़ते हैं
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Uttama
        vacana: Bahu
  - sa: रात्रौ अहम् स्वपिमि।
    meaning:
      en: At night I sleep.
      hi: रात में मैं सोता हूँ।
    words:
    - sa: रात्रौ
      gloss:
        en: at night
        hi: रात में
      check:
        type: subanta
        stem: रात्रि
        linga: Stri
        vibhakti: Saptami
        vacana: Eka
    - sa: अहम्
      gloss:
        en: I
        hi: मैं
    - sa: स्वपिमि
      gloss:
        en: sleep
        hi: सोता हूँ
      check:
        type: tinanta
        dhatu: स्वप्
        lakara: Lat
        purusha: Uttama
        vacana: Eka
  - sa: दिने दिने शुकः वदति।
    meaning:
      en: Day by day the parrot speaks.
      hi: दिन-दिन तोता बोलता है।
    words:
    - sa: दिने
      gloss:
        en: by day
        hi: दिन में
      check:
        type: subanta
        stem: दिन
        linga: Napumsaka
        vibhakti: Saptami
        vacana: Eka
    - sa: दिने
      gloss:
        en: by day
        hi: दिन में
      check:
        type: subanta
        stem: दिन
        linga: Napumsaka
        vibhakti: Saptami
        vacana: Eka
    - sa: शुकः
      gloss:
        en: parrot
        hi: तोता
      check:
        type: subanta
        stem: शुक
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
    - sa: वदति
      gloss:
        en: speaks
        hi: बोलता है
      check:
        type: tinanta
        dhatu: वद्
        lakara: Lat
        purusha: Prathama
        vacana: Eka

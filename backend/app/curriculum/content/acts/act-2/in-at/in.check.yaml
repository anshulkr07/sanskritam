- id: p4
  kind: practice
  depth: core
  skills:
  - case.loc-time
  mode: choice
  prompt:
    en: “At dawn.” Which word?
    hi: ‘भोर में।’ कौन-सा शब्द?
  explain:
    en: 'A time: seventh case.'
    hi: 'समय: सप्तमी।'
  roman: after
  options:
  - sa: प्रभातम्
  - sa: प्रभातेन
  - correct: true
    sa: प्रभाते
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: प्रभाते वयम् पठामः।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: At dawn we read.
        hi: भोर में हम पढ़ते हैं।
      words:
      - sa: प्रभाते
        gloss:
          en: at dawn
          hi: भोर में
        check:
          type: subanta
          stem: प्रभात
          linga: Napumsaka
          vibhakti: Saptami
          vacana: Eka
      - sa: वयम्
        gloss:
          en: we
          hi: हम
      - sa: पठामः
        gloss:
          en: read
          hi: पढ़ते हैं
        check:
          type: tinanta
          dhatu: पठ्
          lakara: Lat
          purusha: Uttama
          vacana: Bahu
    - id: i1
      sa: प्रभाते
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: at dawn
        hi: भोर में
      check:
        type: subanta
        stem: प्रभात
        linga: Napumsaka
        vibhakti: Saptami
        vacana: Eka
      feature:
        en: 'Stem: {{प्रभात}} · neuter · {{सप्तमी}} · singular'
        hi: 'प्रातिपदिक: {{प्रभात}} · {{नपुंसकलिंग}} · {{सप्तमी}} · {{एकवचन}}'
    - id: i2
      sa: वयम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: we
        hi: हम
    - id: i3
      sa: पठामः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: read
        hi: पढ़ते हैं
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Uttama
        vacana: Bahu
      feature:
        en: 'Root: {{पठ्}} · plural · {{लट्}} · First person ({{उत्तमपुरुष}})'
        hi: 'धातु: {{पठ्}} · {{बहुवचन}} · {{लट्}} · उत्तमपुरुष'
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'A time when something happens takes the seventh case too: {{प्रभाते}} (in the morning), {{रात्रौ}} (at night),
          {{दिने}} (by day), {{मासे}} (in the month). It answers “when?”.'

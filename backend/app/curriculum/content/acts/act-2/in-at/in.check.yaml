          vibhakti: Saptami
          vacana: Eka
      - sa: जलम्
        gloss:
          en: water
          hi: जल
        check:
          type: subanta
          stem: जल
          linga: Napumsaka
          vibhakti: Prathama
          vacana: Eka
      - sa: अस्ति
        gloss:
          en: is
          hi: है
        check:
          type: tinanta
          dhatu: अस्
          lakara: Lat
          purusha: Prathama
          vacana: Eka

cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - case.loc
  mode: choice
  prompt:
    en: “In the house.” Which word?
    hi: ‘घर में।’ कौन-सा शब्द?
  explain:
    en: 'Place: seventh case.'
    hi: 'स्थान: सप्तमी।'
  roman: after
  options:
  - sa: गृहम्
  - sa: गृहेण
  - correct: true
    sa: गृहे
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: कूपे जलम् अस्ति।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: There is water in the well.
        hi: कुएँ में जल है।
      words:
      - sa: कूपे
        gloss:
          en: in the well
          hi: कुएँ में
        check:
          type: subanta
          stem: कूप
          linga: Pum
          vibhakti: Saptami
          vacana: Eka
      - sa: जलम्
        gloss:
          en: water
          hi: जल
        check:
          type: subanta
          stem: जल
          linga: Napumsaka
          vibhakti: Prathama
          vacana: Eka
      - sa: अस्ति
        gloss:
          en: is
          hi: है
        check:
          type: tinanta
          dhatu: अस्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
    - id: i1
      sa: कूपे
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: in the well
        hi: कुएँ में
      check:
        type: subanta
        stem: कूप
        linga: Pum
        vibhakti: Saptami
        vacana: Eka
      feature:
        en: 'Stem: {{कूप}} · masculine · {{सप्तमी}} · singular'
        hi: 'प्रातिपदिक: {{कूप}} · {{पुंलिंग}} · {{सप्तमी}} · {{एकवचन}}'
    - id: i2
      sa: जलम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: water
        hi: जल
      check:
        type: subanta
        stem: जल
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{जल}} · neuter · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{जल}} · {{नपुंसकलिंग}} · {{प्रथमा}} · {{एकवचन}}'
    - id: i3
      sa: अस्ति
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: is
        hi: है
      check:
        type: tinanta
        dhatu: अस्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
      feature:
        en: 'Root: {{अस्}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{अस्}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'The place or support where something is or happens takes the seventh case, {{सप्तमी}}: {{कूपे जलम्}} (water in
          the well), {{गृहे दीपः}} (a lamp in the house), {{वृक्षे शुकः}} (a parrot in the tree).'
        hi: 'जो स्थान या आधार जहाँ कुछ होता है, वह सप्तमी में आता है: {{कूपे जलम्}} (कुएँ में जल), {{गृहे दीपः}} (घर में दीपक),
          {{वृक्षे शुकः}} (पेड़ पर तोता)।'
    - id: i6
      sa: कूपे जलम् अस्ति।
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें

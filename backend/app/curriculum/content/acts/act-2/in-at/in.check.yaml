        a thread of amber light. “कूपे जलम् अस्ति। गृहे दीपः अस्ति,” he says, in a voice as warm as a hearth. Then, from the
        dark lanes beyond the school wall, a faint voice calls, and he turns: “हे मित्र! कुत्र असि?”'
      hi: '“रात्रौ गृहे दीपः अस्ति।” लौ के रंग का भूत ख़ुशी से टिमटिमाता है और अपने दीपक से रात में ऊपर उठता है, अम्बर रोशनी
        का एक धागा। “कूपे जलम् अस्ति। गृहे दीपः अस्ति,” वह चूल्हे जैसी गर्म आवाज़ में कहता है। फिर पाठशाला की दीवार के पार
        की अँधेरी गलियों से एक धीमी आवाज़ पुकारती है, और वह मुड़ता है: “हे मित्र! कुत्र असि?”'

- id: p8
  kind: practice
  depth: core
  skills:
  - case.loc
  - case.loc-time
  mode: order
  prompt:
    en: 'Tell the lamp-spirit where the light is and when: “At night there is a lamp in the house.”'
    hi: 'दीप-भूत से बताइए कि प्रकाश कहाँ और कब है: ‘रात में घर में दीपक है।’'
  explain:
    en: '{{रात्रौ गृहे दीपः अस्ति}}: time and place, both in the seventh case.'
    hi: '{{रात्रौ गृहे दीपः अस्ति}}: समय और स्थान, दोनों सप्तमी में।'
  roman: after
  gate: true
  story:
    success:
      en: '“रात्रौ गृहे दीपः अस्ति.” The flame-coloured spirit gives a joyful flicker and rises from his lamp into the night, a thread of amber light. “कूपे जलम् अस्ति। गृहे दीपः अस्ति,” he says, in a voice as warm as a hearth. Then, from the dark lanes beyond the school wall, a faint voice calls, and he turns: “हे मित्र! कुत्र असि?”'
      hi: '“रात्रौ गृहे दीपः अस्ति।” लौ के रंग का भूत ख़ुशी से टिमटिमाता है और अपने दीपक से रात में ऊपर उठता है, अम्बर रोशनी का एक धागा। “कूपे जलम् अस्ति। गृहे दीपः अस्ति,” वह चूल्हे जैसी गर्म आवाज़ में कहता है। फिर पाठशाला की दीवार के पार की अँधेरी गलियों से एक धीमी आवाज़ पुकारती है, और वह मुड़ता है: “हे मित्र! कुत्र असि?”'
    failure:
      en: The lamp flickers uncertainly. Time and place both go in the seventh case.
      hi: दीपक अनिश्चित-सा टिमटिमाता है। समय और स्थान, दोनों सप्तमी में।
  tokens:
  - रात्रौ
  - गृहे
  - दीपः
  - अस्ति

        gloss:
          en: we
          hi: हम
      - sa: पठामः
        gloss:
          en: read
          hi: पढ़ते हैं
        check:
          type: tinanta
          dhatu: पठ्
          lakara: Lat
          purusha: Uttama
          vacana: Bahu

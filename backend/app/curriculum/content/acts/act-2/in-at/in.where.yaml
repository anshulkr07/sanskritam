- id: p3
  kind: practice
  title:
    en: Where is the light?
    hi: प्रकाश कहाँ है?
  depth: core
  skills:
  - case.loc
  mode: order
  prompt:
    en: 'Say: “There is a lamp in the house.”'
    hi: 'कहिए: ‘घर में दीपक है।’'
  explain:
    en: '{{गृहे दीपः अस्ति}}: the place in the seventh case.'
    hi: '{{गृहे दीपः अस्ति}}: स्थान सप्तमी में।'
  roman: after
  gate: true
  story:
    success:
      en: “गृहे दीपः अस्ति,” you say, and the flame-coloured spirit darts through the open door and back, trailing sparks. “कूपे जलम्,” says Dādī, and the spirit dives toward the well, looking down into the dark water as if checking.
      hi: “गृहे दीपः अस्ति,” आप कहते हैं, और लौ के रंग का भूत खुले द्वार से अन्दर-बाहर झपटता है, चिंगारियाँ बिखेरता। “कूपे जलम्,” दादी कहती हैं, और भूत कुएँ की ओर गोता लगाता है, काले जल में झाँकता हुआ मानो जाँच रहा हो।
    failure:
      en: The spirit hovers. The place goes in the seventh case, first.
      hi: भूत मँडराता है। स्थान सप्तमी में, पहले।
  tokens:
  - गृहे
  - दीपः
  - अस्ति
- id: pn
  kind: teach
  title:
    en: Pāṇini's locus
    hi: पाणिनि का अधिकरण
  depth: panini
  skills:
  - case.loc
  sutras:
  - 1.4.45
  - 2.3.36
  body:
    en: 'Sūtra 1.4.45, {{आधारोऽधिकरणम्}}: the locus is the support. Sūtra 2.3.36, {{सप्तम्यधिकरणे च}}: it takes the seventh case.'
    hi: 'सूत्र 1.4.45, {{आधारोऽधिकरणम्}}: अधिकरण आधार है। सूत्र 2.3.36, {{सप्तम्यधिकरणे च}}: वह सप्तमी लेता है।'
  term:
    sa: अधिकरणम्
    meaning:
      en: 'the locus: where something is'
      hi: 'अधिकरण: जहाँ कुछ है'

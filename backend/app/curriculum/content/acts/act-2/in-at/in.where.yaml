cards:
- id: s1
  kind: story
  title:
    en: Night in the courtyard
    hi: आँगन में रात
  depth: core
  image:
    brief: 'The school courtyard at night: the old Ācārya hanging a lit brass lamp beside a stone well, pupils in a ring,
      a small flickering amber spirit shaped like a flame leaping up from the lamp; stars overhead; you and Dādī at the edge.'
    alt:
      en: Night in a school courtyard, a lamp hung by the well and a flame-shaped spirit leaping up
      hi: आँगन में रात, कुएँ पर टँगा दीपक और उछलता लौ-भूत
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - dipaka
    place: pathashala
    ratio: '4:3'
    id: in-where-s1
  narration:
    en: 'Night falls over the school. The Ācārya hangs a lamp by the well in the courtyard. “Where is the water?” he asks.
      “In the well,” says a pupil. “Where is the lamp?” “At the well.” “Where is the boy?” A flame-coloured spirit leaps up
      from the lamp: “Here!”'
    hi: 'पाठशाला पर रात उतरती है। आचार्य आँगन में कुएँ के पास एक दीपक टाँगते हैं। “जल कहाँ है?” वे पूछते हैं। “कुएँ में,”
      एक शिष्य कहता है। “दीपक कहाँ है?” “कुएँ पर।” “बालक कहाँ है?” दीपक से एक लौ के रंग का भूत उछलता है: “यहाँ!”'
  lines:
  - speaker: acarya
    sa: कूपे जलम् अस्ति।
    gloss:
      en: There is water in the well.
      hi: कुएँ में जल है।
- id: t1
  kind: teach
  title:
    en: 'Where: the seventh case'
    hi: 'कहाँ: सप्तमी'
  depth: core
  skills:
  - case.loc
  sutras:
  - 2.3.36
  - 1.4.45
  body:
    en: 'The place or support where something is or happens takes the seventh case, {{सप्तमी}}: {{कूपे जलम्}} (water in the
      well), {{गृहे दीपः}} (a lamp in the house), {{वृक्षे शुकः}} (a parrot in the tree).'
    hi: 'जो स्थान या आधार जहाँ कुछ होता है, वह सप्तमी में आता है: {{कूपे जलम्}} (कुएँ में जल), {{गृहे दीपः}} (घर में दीपक),
      {{वृक्षे शुकः}} (पेड़ पर तोता)।'

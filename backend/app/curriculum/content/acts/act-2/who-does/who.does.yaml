  note:
    en: 'A few roots change shape: {{गम्}} → {{गच्छति}}, {{दृश्}} → {{पश्यति}}, {{पा}} → {{पिबति}}, {{स्था}} → {{तिष्ठति}}.
      Learn these four as they are.'
    hi: 'कुछ धातुएँ रूप बदलती हैं: {{गम्}} → {{गच्छति}}, {{दृश्}} → {{पश्यति}}, {{पा}} → {{पिबति}}, {{स्था}} → {{तिष्ठति}}।
      इन चारों को जैसे हैं वैसे याद कीजिए।'

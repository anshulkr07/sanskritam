cards:
- id: s1
  kind: story
  title:
    en: Verbs on the steps
    hi: सीढ़ियों पर क्रियाएँ
  depth: core
  image:
    brief: 'Four small scenes along the ghat steps: a boy reading, a girl writing on a slate, a heron standing, a boat gliding;
      Śuka on Dādī''s shoulder squawking happily; the small spirit counting on his fingers.'
    alt:
      en: Four actions on the ghat with a parrot squawking along
      hi: घाट पर चार क्रियाएँ, साथ में चहकता तोता
    cast:
    - you
    - dadi
    - shuka
    - ghataka
    place: naditira
    ratio: '4:3'
    id: who-does-s1
    text_in_image:
    - लिखति
  narration:
    en: The spirit wants to hear what everyone does. The boy reads, the girl writes, the heron stands, the boat moves. Each
      action is a word of its own, and each ends in the same small sound. Śuka repeats every one in a happy squawk.
    hi: भूत सुनना चाहता है कि हर कोई क्या करता है। बालक पढ़ता है, बालिका लिखती है, बगुला खड़ा है, नाव चलती है। हर क्रिया एक
      अलग शब्द है, और सबके अन्त में वही छोटी ध्वनि है। शुक ख़ुशी से हर एक को दोहराता है।
- id: t1
  kind: teach
  title:
    en: 'He does: -ति'
    hi: 'वह करता है: -ति'
  depth: core
  skills:
  - verb.pres-3sg
  sutras:
  - 3.2.123
  body:
    en: 'A verb names an action. For he, she or it, in the present, the root takes {{ति}}: {{पठ्}} + {{ति}} = {{पठति}}. The
      same form serves for a boy, a girl or a boat.'
    hi: 'क्रिया किसी काम का नाम है। वर्तमान काल में वह, वह (स्त्री) या वह (वस्तु) के लिए धातु में {{ति}} लगता है: {{पठ्}}
      + {{ति}} = {{पठति}}। यही रूप बालक, बालिका या नाव, तीनों के लिए चलता है।'
  steps:
  - sa: पठ्
    label:
      en: 'root: read'
      hi: 'धातु: पढ़ना'
  - sa: पठ
    label:
      en: with the joining vowel {{अ}}
      hi: जोड़ने वाले स्वर {{अ}} के साथ
  - sa: पठति
    label:
      en: '+ {{ति}}: he, she, it reads'
      hi: '+ {{ति}}: वह पढ़ता है'
  visuals:
  - id: v-source-forms
    kind: comparison
    title:
      en: Follow the forms
      hi: रूपों पर ध्यान दें
    items:
    - id: i0
      sa: पठ्
      meaning:
        en: 'root: read'
        hi: 'धातु: पढ़ना'
    - id: i1
      sa: पठ
      meaning:
        en: with the joining vowel {{अ}}
        hi: जोड़ने वाले स्वर {{अ}} के साथ
    - id: i2
      sa: पठति
      meaning:
        en: '+ {{ति}}: he, she, it reads'
        hi: '+ {{ति}}: वह पढ़ता है'

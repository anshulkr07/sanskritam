      gloss:
        en: Rāma
        hi: राम
      check:
        type: subanta
        stem: राम
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
    - sa: बालकः
      gloss:
        en: boy
        hi: बालक
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
  - sa: सीता बालिका।
    meaning:
      en: Sītā is a girl.
      hi: सीता बालिका है।
    words:
    - sa: सीता
      gloss:
        en: Sītā
        hi: सीता
      check:
        type: subanta
        stem: सीता
        linga: Stri
        vibhakti: Prathama
        vacana: Eka
    - sa: बालिका
      gloss:
        en: girl
        hi: बालिका
      check:
        type: subanta
        stem: बालिका
        linga: Stri
        vibhakti: Prathama
        vacana: Eka
  - sa: गङ्गा नदी।
    meaning:
      en: The Gaṅgā is a river.
      hi: गंगा एक नदी है।
    words:

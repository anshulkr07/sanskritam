- id: sum
  kind: summary
  title:
    en: No “is”
    hi: ‘है’ नहीं
  depth: core
  points:
  - sa: रामः बालकः
    text:
      en: 'Two first-case words: one is the other.'
      hi: 'दो प्रथमा शब्द: एक दूसरा है।'
  - sa: अस्ति
    text:
      en: “Exists”, “there is”.
      hi: ‘है’, ‘विद्यमान है’।
  - text:
      en: Sanskrit leaves “is” out.
      hi: संस्कृत ‘है’ को छोड़ देती है।

sources:
- title: Lesson text and story
  licence: original
cards:
- id: s1
  kind: story
  title:
    en: Who is who
    hi: कौन कौन है
  depth: core
  image:
    brief: Dādī pointing first at a boy on the ghat steps and then at the small grey-blue spirit, as though introducing them;
      Śuka looking from one to the other; calm river light.
    alt:
      en: A grandmother introduces a boy and a small spirit on the ghat
      hi: घाट पर बालक और नन्हे भूत का परिचय कराती दादी
    cast:
    - you
    - dadi
    - shuka
    - ghataka
    place: naditira
    ratio: '4:3'
    id: who-is-s1
  narration:
    en: 'The spirit points at the boy on the steps and then at himself. Dādī answers for him: “A boy. A spirit.” No “is” anywhere.
      “Sanskrit does not need it,” she says. “Put two names side by side, and one is the other.”'
    hi: भूत सीढ़ियों पर बैठे बालक की ओर, फिर अपनी ओर इशारा करता है। दादी उसकी ओर से उत्तर देती हैं, “बालक। भूत।” ‘है’ कहीं
      नहीं। वे कहती हैं, “संस्कृत को उसकी ज़रूरत नहीं। दो नाम साथ रखिए, एक दूसरा हो जाता है।”
- id: t1
  kind: teach
  title:
    en: Two names, no “is”
    hi: दो नाम, ‘है’ नहीं
  depth: core
  skills:
  - sent.no-verb-to-be
  body:
    en: To say “Rāma is a boy”, put {{रामः}} and {{बालकः}} side by side. Both are in the first case, and no verb is needed.
      The verb {{अस्ति}} means “exists”, “there is”.
    hi: ‘राम बालक है’ कहने के लिए {{रामः}} और {{बालकः}} साथ रखिए। दोनों प्रथमा में हैं, और क्रिया की ज़रूरत नहीं। क्रिया {{अस्ति}}
      का अर्थ है ‘है’, ‘विद्यमान है’।
  examples:
  - sa: रामः बालकः।
    meaning:
      en: Rāma is a boy.
      hi: राम बालक है।
    words:

  - skill: sent.stem-ending
    rule:
      en: '{{सुप्तिङन्तं पदम्}}: a word ends in a noun ending or a verb ending.'
      hi: '{{सुप्तिङन्तं पदम्}}: पद सुप् या तिङ् प्रत्यय पर समाप्त होता है।'
    sutras:
    - 1.4.14
    tag: core
    taught_in: who.endings#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 1.4.14, {{सुप्तिङन्तं पदम्}}: a word ({{पदम्}}) is what ends in a noun ending ({{सुप्}}) or a verb ending
          ({{तिङ्}}). So {{बालकः}} and {{पठति}} are words; the bare stems {{बालक}} and {{पठ्}} are not yet.'
        hi: 'सूत्र 1.4.14, {{सुप्तिङन्तं पदम्}}: पद वह है जो सुप् (नाम का प्रत्यय) या तिङ् (क्रिया का प्रत्यय) पर समाप्त हो।
          इसलिए {{बालकः}} और {{पठति}} पद हैं; केवल मूल {{बालक}} और {{पठ्}} अभी पद नहीं।'
      items:
      - id: i0
        sa: सुप्तिङन्तं पदम्
      - id: i1
        sa: पदम्
      - id: i2
        sa: सुप्
      - id: i3
        sa: तिङ्

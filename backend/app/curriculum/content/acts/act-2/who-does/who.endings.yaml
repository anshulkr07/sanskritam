- id: p4
  kind: practice
  title:
    en: Your first sentence
    hi: आपका पहला वाक्य
  depth: core
  skills:
  - sent.stem-ending
  mode: order
  prompt:
    en: 'Say it for the spirit: put the two words in order, doer first.'
    hi: 'भूत के लिए बोलिए: दो शब्द क्रम में लगाइए, पहले कर्ता।'
  explain:
    en: '{{बालकः पठति}}: the boy reads.'
    hi: '{{बालकः पठति}}: बालक पढ़ता है।'
  roman: after
  gate: true
  story:
    success:
      en: “बालकः पठति,” you say. The small spirit's outline firms up like wet sand. He claps two foggy hands.
      hi: “बालकः पठति,” आप कहते हैं। नन्हे भूत की आकृति गीली रेत की तरह ठोस हो जाती है। वह दो धुँधले हाथों से ताली बजाता है।
    failure:
      en: The spirit tilts his head. Start with the word that does the reading.
      hi: भूत सिर टेढ़ा करता है। पहले वह शब्द रखिए जो पढ़ता है।
  tokens:
  - बालकः
  - पठति
- id: pn
  kind: teach
  title:
    en: Pāṇini's definition of a word
    hi: पद की पाणिनि-परिभाषा
  depth: panini
  skills:
  - sent.stem-ending
  sutras:
  - 1.4.14
  body:
    en: 'Sūtra 1.4.14, {{सुप्तिङन्तं पदम्}}: a word ({{पदम्}}) is what ends in a noun ending ({{सुप्}}) or a verb ending ({{तिङ्}}). So {{बालकः}} and {{पठति}} are words; the bare stems {{बालक}} and {{पठ्}} are not yet.'
    hi: 'सूत्र 1.4.14, {{सुप्तिङन्तं पदम्}}: पद वह है जो सुप् (नाम का प्रत्यय) या तिङ् (क्रिया का प्रत्यय) पर समाप्त हो। इसलिए {{बालकः}} और {{पठति}} पद हैं; केवल मूल {{बालक}} और {{पठ्}} अभी पद नहीं।'
  term:
    sa: पदम्
    meaning:
      en: 'a word: stem + ending'
      hi: 'पद: मूल + प्रत्यय'
- id: sum
  kind: summary
  title:
    en: Stems and endings
    hi: मूल और प्रत्यय
  depth: core
  points:
  - sa: बालक + ः
    text:
      en: A word is a stem plus an ending.
      hi: शब्द = मूल + प्रत्यय।
  - sa: पठ् + ति
    text:
      en: Verbs take their own endings.
      hi: क्रियाओं के अपने प्रत्यय होते हैं।
  - text:
      en: The ending, not the place, tells the job.
      hi: काम प्रत्यय बताता है, स्थान नहीं।

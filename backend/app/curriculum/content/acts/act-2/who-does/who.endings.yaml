- id: p3
  kind: practice
  depth: core
  skills:
  - sent.stem-ending
  mode: choice
  prompt:
    en: In {{बालकः पठति}}, which word shows who is reading?
    hi: '{{बालकः पठति}} में कौन-सा शब्द बताता है कि कौन पढ़ रहा है?'
  explain:

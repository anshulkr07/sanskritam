cards:
- id: s1
  kind: story
  title:
    en: Dawn at the ghat
    hi: घाट पर भोर
  depth: core
  image:
    brief: 'Dawn on the stone ghat steps of a calm river: people bathing, a boy reading on the steps, and on the lowest step a small grey-blue spirit like river mist with his feet in the water, pointing; you, Dādī and Śuka coming down the steps.'
    alt:
      en: Dawn at the river steps with a boy reading and a small mist-spirit pointing
      hi: 'भोर में नदी की सीढ़ियाँ: पढ़ता बालक और इशारा करता नन्हा भूत'
    cast:
    - you
    - dadi
    - shuka
    - ghataka
    place: naditira
    ratio: '4:3'
    id: who-endings-s1
  narration:
    en: Dawn at the river ghats. Wide stone steps run down to the water, and people wash, read and sing. On the lowest step a small grey-blue spirit sits with his feet in the river. He points at a boy reading, then at you. “A sentence,” says Dādī. “Your first.”
    hi: नदी के घाट पर भोर है। चौड़ी पत्थर की सीढ़ियाँ पानी तक उतरती हैं, और लोग नहाते, पढ़ते और गाते हैं। सबसे निचली सीढ़ी पर एक नन्हा नीला-भूरा भूत पैर नदी में डाले बैठा है। वह पढ़ते हुए बालक की ओर, फिर आपकी ओर इशारा करता है। दादी कहती हैं, “एक वाक्य। तुम्हारा पहला।”
  lines:
  - speaker: dadi
    sa: बालकः पठति।
    gloss:
      en: A boy reads.
      hi: एक बालक पढ़ता है।
- id: t1
  kind: teach
  title:
    en: A word is a stem and an ending
    hi: शब्द = मूल + प्रत्यय
  depth: core
  skills:
  - sent.stem-ending
  body:
    en: Every Sanskrit word is a stem plus an ending, and the ending does the work. {{बालक}} (boy) with {{ः}} is {{बालकः}}. {{पठ्}} (read) with {{ति}} is {{पठति}}. The stem carries the meaning; the ending says the job.
    hi: संस्कृत का हर शब्द मूल रूप और प्रत्यय से बनता है, और प्रत्यय ही काम करता है। {{बालक}} में {{ः}} लगा तो {{बालकः}}। {{पठ्}} में {{ति}} लगा तो {{पठति}}। मूल रूप अर्थ देता है; प्रत्यय बताता है कि शब्द का काम क्या है।
  examples:
  - sa: पठति
    meaning:
      en: '{{पठ्}} + {{ति}}: he reads'
      hi: '{{पठ्}} + {{ति}}: वह पढ़ता है'
    check:
      type: tinanta
      dhatu: पठ्
      lakara: Lat
      purusha: Prathama
      vacana: Eka
  steps:
  - sa: बालक
    label:
      en: 'stem: boy'
      hi: 'मूल रूप: बालक'
  - sa: ः
    label:
      en: 'ending: the doer'
      hi: 'प्रत्यय: कर्ता'
  - sa: बालकः
    label:
      en: 'word: the boy (who does)'
      hi: 'शब्द: बालक (जो करता है)'

      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: बालकः
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: the boy (doer)
        hi: बालक (कर्ता)
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{बालक}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{बालक}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
      compare_from: बालक
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: The one who does is the doer, {{कर्ता}}. In a sentence it stands in the first case, {{प्रथमा}}. The dictionary
          gives the stem {{बालक}}; the sentence needs {{बालकः}}.
        hi: जो करता है वह कर्ता है। वाक्य में वह प्रथमा विभक्ति में खड़ा होता है। कोश मूल {{बालक}} देता है; वाक्य को चाहिए
          {{बालकः}}।

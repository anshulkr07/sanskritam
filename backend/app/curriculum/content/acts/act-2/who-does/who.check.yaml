- id: p3
  kind: practice
  depth: core
  skills:
  - sent.nom-sg
  mode: choice
  prompt:
    en: Which word is the doer?
    hi: कर्ता कौन-सा शब्द है?
  explain:
    en: '{{नाविकः}}: first case, the one who does.'
    hi: '{{नाविकः}}: प्रथमा, जो करता है।'

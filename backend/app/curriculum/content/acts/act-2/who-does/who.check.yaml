      sa: बालकः
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: the boy (doer)
        hi: बालक (कर्ता)
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:

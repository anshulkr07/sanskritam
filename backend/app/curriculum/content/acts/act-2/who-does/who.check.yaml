- id: p8
  kind: practice
  depth: core
  skills:
  - sent.nom-sg
  - verb.pres-3sg
  - sent.word-order
  mode: order
  prompt:
    en: 'Describe the ghat for the little spirit: put the sentence in order.'
    hi: 'नन्हे भूत के लिए घाट का वर्णन कीजिए: वाक्य क्रम में लगाइए।'
  explain:
    en: '{{नाविकः गच्छति}}: the boatman goes.'
    hi: '{{नाविकः गच्छति}}: नाविक जाता है।'
  roman: after
  gate: true
  story:
    success:
      en: '“नाविकः गच्छति। बालकः पठति। नदी वहति।” You name everything on the ghat. The little spirit rises from the step,
        clear as dew, and bows: “नदी वहति। अहं मुक्तः।” He points downstream: “नौकाः सन्ति।”'
      hi: '“नाविकः गच्छति। बालकः पठति। नदी वहति।” आप घाट की हर चीज़ का नाम लेते हैं। नन्हा भूत सीढ़ी से ओस की तरह साफ़ उठता
        है और झुककर प्रणाम करता है: “नदी वहति। अहं मुक्तः।” वह नदी की धारा की ओर इशारा करता है: “नौकाः सन्ति।”'
    failure:
      en: The ghat waits. Start with the doer, then the verb.
      hi: घाट प्रतीक्षा करता है। कर्ता से शुरू कीजिए, फिर क्रिया।
  tokens:

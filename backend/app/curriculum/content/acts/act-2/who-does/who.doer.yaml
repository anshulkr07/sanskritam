  - 1.4.54
  - 2.3.46
  body:
    en: 'Sūtra 1.4.54, {{स्वतन्त्रः कर्ता}}, calls the doer “the independent one”: the one who is free to act. Sūtra 2.3.46
      says the first case shows the bare meaning of the word.'
    hi: 'सूत्र 1.4.54, {{स्वतन्त्रः कर्ता}}, कर्ता को ‘स्वतन्त्र’ कहता है: जो करने में स्वतन्त्र हो। सूत्र 2.3.46 कहता है
      कि प्रथमा शब्द का केवल अर्थ बताती है।'
  term:
    sa: कर्ता
    meaning:
      en: the independent doer
      hi: स्वतन्त्र करने वाला

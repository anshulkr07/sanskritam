cards:
- id: s1
  kind: story
  title:
    en: Everyone on the ghat
    hi: घाट पर सब लोग
  depth: core
  image:
    brief: 'The ghat steps full of morning life: a boy reading, a girl singing, a boatman resting beside his boat, a heron
      in the shallows; the small grey-blue spirit sweeping his arm over the scene while Dādī asks a question.'
    alt:
      en: A busy ghat with a reading boy, a singing girl, a boatman and a heron
      hi: 'व्यस्त घाट: पढ़ता बालक, गाती बालिका, नाविक और बगुला'
    cast:
    - you
    - dadi
    - shuka
    - ghataka
    place: naditira
    ratio: '4:3'
    id: who-doer-s1
  narration:
    en: 'The small spirit sweeps his arm over the steps. A boy reads, a girl sings, the boatman rests, a heron stands in the
      shallows. “Who is doing what?” Dādī asks. “First, name the doers: the ones who do.”'
    hi: 'नन्हा भूत सीढ़ियों पर हाथ फेरता है। एक बालक पढ़ता है, एक बालिका गाती है, नाविक विश्राम करता है, एक बगुला उथले पानी
      में खड़ा है। दादी पूछती हैं, “कौन क्या कर रहा है? पहले कर्ताओं के नाम बताओ: जो करते हैं।”'
- id: t1
  kind: teach
  title:
    en: 'The doer: the first case'
    hi: 'कर्ता: प्रथमा विभक्ति'
  depth: core
  skills:
  - sent.nom-sg
  sutras:
  - 2.3.46
  - 1.4.54
  body:
    en: The one who does is the doer, {{कर्ता}}. In a sentence it stands in the first case, {{प्रथमा}}. The dictionary gives
      the stem {{बालक}}; the sentence needs {{बालकः}}.
    hi: जो करता है वह कर्ता है। वाक्य में वह प्रथमा विभक्ति में खड़ा होता है। कोश मूल {{बालक}} देता है; वाक्य को चाहिए {{बालकः}}।
  examples:
  - sa: बालकः
    meaning:
      en: the boy (doer)
      hi: बालक (कर्ता)
    check:
      type: subanta
      stem: बालक
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: बालिका
    meaning:
      en: the girl (doer)
      hi: बालिका (कर्ता)
    check:
      type: subanta
      stem: बालिका
      linga: Stri
      vibhakti: Prathama
      vacana: Eka
  - sa: नाविकः
    meaning:
      en: the boatman (doer)
      hi: नाविक (कर्ता)
    check:
      type: subanta
      stem: नाविक
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  term:
    sa: प्रथमा
    meaning:
      en: 'the first case: the doer'
      hi: 'पहली विभक्ति: कर्ता'
  visuals:
  - id: v-picture-examples
    kind: comparison
    title:
      en: See the meaning; read the form
      hi: अर्थ देखें, रूप पढ़ें
    explanation:

cards:
- id: s1
  kind: story
  title:
    en: The shuffling spirit
    hi: शब्द उलटता भूत
  depth: core
  image:
    brief: Śuka the parrot flapping happily as word-cards float in the air around him, the small grey-blue spirit juggling
      them, Dādī clapping on the ghat steps.
    alt:
      en: A parrot and a small spirit juggling floating word-cards on the ghat
      hi: शब्द-पत्रों से खेलते तोता और नन्हा भूत
    cast:
    - you
    - dadi
    - shuka
    - ghataka
    place: naditira
    ratio: '4:3'
    id: who-order-s1
    text_in_image:
    - बालकः
    - पठति
  narration:
    en: 'Śuka decides to help and says the sentence backwards: “पठति बालकः!” Dādī claps. “Still correct.” The spirit is delighted.
      He shuffles every word he knows, and each time the sentence means the same. “The endings carry it,” Dādī says.'
    hi: 'शुक मदद करने की ठानता है और वाक्य उलटा बोलता है: “पठति बालकः!” दादी ताली बजाती हैं। “अब भी सही है।” भूत मगन हो जाता
      है। वह हर शब्द को उलट-पलट करता है, और वाक्य का अर्थ वही रहता है। दादी कहती हैं, “अर्थ प्रत्ययों में है।”'
- id: t1
  kind: teach
  title:
    en: Any order
    hi: कोई भी क्रम
  depth: core
  skills:
  - sent.word-order
  body:
    en: In Sanskrit the endings carry the meaning, so words may stand in any order. {{बालकः पठति}} and {{पठति बालकः}} both
      say “the boy reads”. Usually the doer comes first and the verb last, but the poets mix freely.
    hi: संस्कृत में अर्थ प्रत्ययों में होता है, इसलिए शब्द किसी भी क्रम में आ सकते हैं। {{बालकः पठति}} और {{पठति बालकः}} दोनों
      का अर्थ है ‘बालक पढ़ता है’। प्रायः कर्ता पहले और क्रिया अन्त में आती है, पर कवि खुलकर क्रम बदलते हैं।
  examples:
  - sa: बालकः पठति।
    meaning:
      en: The boy reads.
      hi: बालक पढ़ता है।
    words:
    - sa: बालकः
      gloss:
        en: boy
        hi: बालक
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
    - sa: पठति
      gloss:
        en: reads
        hi: पढ़ता है
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
  - sa: पठति बालकः।
    meaning:
      en: The boy reads, the same.
      hi: बालक पढ़ता है, वही अर्थ।
    words:
    - sa: पठति
      gloss:
        en: reads
        hi: पढ़ता है
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
    - sa: बालकः
      gloss:
        en: boy
        hi: बालक
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Prathama
        vacana: Eka

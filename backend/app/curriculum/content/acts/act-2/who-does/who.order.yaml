- id: sum
  kind: summary
  title:
    en: Free order
    hi: मुक्त क्रम
  depth: core
  points:
  - sa: बालकः पठति = पठति बालकः
    text:
      en: Same meaning, any order.
      hi: वही अर्थ, कोई भी क्रम।
  - text:
      en: The endings carry the roles.
      hi: प्रत्यय भूमिकाएँ ढोते हैं।
  - text:
      en: 'Usual order: doer, then verb.'
      hi: 'सामान्य क्रम: कर्ता, फिर क्रिया।'

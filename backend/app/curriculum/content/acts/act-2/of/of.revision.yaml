      explanation:
        en: 'Sūtra 2.3.50, {{षष्ठी शेषे}}, gives the sixth case to “the rest”: every link between two nouns that the other
          kāraka-cases do not express. That is why it covers owner, part, kin and more.'
        hi: 'सूत्र 2.3.50, {{षष्ठी शेषे}}, ‘शेष’ को षष्ठी देता है: दो संज्ञाओं के बीच का हर वह सम्बन्ध जिसे अन्य कारक-विभक्तियाँ
          नहीं कहतीं। इसीलिए वह स्वामी, भाग, नाते और बहुत कुछ को ढकती है।'
      items:

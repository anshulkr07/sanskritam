    en: 'Say: “This is the teacher''s book.”'
    hi: 'कहिए: ‘यह आचार्य की पुस्तक है।’'
  explain:
    en: '{{आचार्यस्य पुस्तकम्}}: the owner in the sixth case.'
    hi: '{{आचार्यस्य पुस्तकम्}}: स्वामी षष्ठी में।'
  roman: after
  gate: true
  story:
    success:
      en: “आचार्यस्य पुस्तकम्,” you say, touching the old palm-leaf book. The golden spirit lifts her tiny lamp and the book's
        pages glow, remembering. “आचार्यस्य लेखनी,” says Dādī. The glow runs to the pen.
      hi: “आचार्यस्य पुस्तकम्,” आप कहते हैं, पुराने ताड़पत्र की पुस्तक को छूते हुए। सुनहरा भूत अपना छोटा दीपक उठाती है और
        पुस्तक के पन्ने चमक उठते हैं, याद करते हुए। “आचार्यस्य लेखनी,” दादी कहती हैं। चमक कलम तक दौड़ जाती है।
    failure:
      en: The book stays dim. The owner comes first, in the sixth case.
      hi: पुस्तक धुँधली रहती है। पहले स्वामी, षष्ठी में।

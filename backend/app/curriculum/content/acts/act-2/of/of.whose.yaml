- id: p3
  kind: practice
  title:
    en: The teacher's book
    hi: आचार्य की पुस्तक
  depth: core
  skills:
  - case.gen
  mode: order
  prompt:
    en: 'Say: “This is the teacher''s book.”'
    hi: 'कहिए: ‘यह आचार्य की पुस्तक है।’'
  explain:
    en: '{{आचार्यस्य पुस्तकम्}}: the owner in the sixth case.'
    hi: '{{आचार्यस्य पुस्तकम्}}: स्वामी षष्ठी में।'
  roman: after
  gate: true
  story:
    success:
      en: “आचार्यस्य पुस्तकम्,” you say, touching the old palm-leaf book. The golden spirit lifts her tiny lamp and the book's pages glow, remembering. “आचार्यस्य लेखनी,” says Dādī. The glow runs to the pen.
      hi: “आचार्यस्य पुस्तकम्,” आप कहते हैं, पुराने ताड़पत्र की पुस्तक को छूते हुए। सुनहरा भूत अपना छोटा दीपक उठाती है और पुस्तक के पन्ने चमक उठते हैं, याद करते हुए। “आचार्यस्य लेखनी,” दादी कहती हैं। चमक कलम तक दौड़ जाती है।
    failure:
      en: The book stays dim. The owner comes first, in the sixth case.
      hi: पुस्तक धुँधली रहती है। पहले स्वामी, षष्ठी में।
  tokens:
  - आचार्यस्य
  - पुस्तकम्
- id: pn
  kind: teach
  title:
    en: Pāṇini's “rest”
    hi: पाणिनि का ‘शेष’
  depth: panini
  skills:
  - case.gen
  sutras:
  - 2.3.50
  body:
    en: 'Sūtra 2.3.50, {{षष्ठी शेषे}}, gives the sixth case to “the rest”: every link between two nouns that the other kāraka-cases do not express. That is why it covers owner, part, kin and more.'
    hi: 'सूत्र 2.3.50, {{षष्ठी शेषे}}, ‘शेष’ को षष्ठी देता है: दो संज्ञाओं के बीच का हर वह सम्बन्ध जिसे अन्य कारक-विभक्तियाँ नहीं कहतीं। इसीलिए वह स्वामी, भाग, नाते और बहुत कुछ को ढकती है।'
  term:
    sa: शेषः
    meaning:
      en: 'the remainder: other relations'
      hi: 'शेष: अन्य सम्बन्ध'

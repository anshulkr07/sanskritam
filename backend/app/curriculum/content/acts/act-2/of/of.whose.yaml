cards:
- id: s1
  kind: story
  title:
    en: The Ācārya's house
    hi: आचार्य का घर
  depth: core
  image:
    brief: 'The Ācārya''s small, lamplit house behind the school: a low desk with a palm-leaf book, a reed pen, a folded saffron
      shawl and a string of beads; a slim warm-gold spirit holding a tiny lamp touching each thing softly; you and Dādī sitting
      on the floor mat.'
    alt:
      en: A slim golden spirit with a tiny lamp touches old belongings in a teacher's house
      hi: आचार्य के घर में पुरानी चीज़ों को छूता दीपक थामे भूत
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - smritika
    place: pathashala
    ratio: '4:3'
    id: of-whose-s1
  narration:
    en: 'The storm blows itself out. In the Ācārya''s own small house behind the school, a warm lamp is lit. Everything is
      old and full of use: a book, a pen, a shawl, a string of beads. A slim golden spirit with a tiny lamp moves among the
      things, touching each one softly, as if asking whose it was.'
    hi: 'आँधी थम जाती है। पाठशाला के पीछे आचार्य के छोटे-से घर में एक गर्म दीपक जलता है। हर चीज़ पुरानी है और काम में आती
      हुई: एक पुस्तक, एक कलम, एक शॉल, मनकों की एक माला। छोटा दीपक थामे एक दुबला सुनहरा भूत चीज़ों के बीच घूमता है, हर एक को
      कोमलता से छूता है, मानो पूछ रहा हो कि यह किसकी थी।'
  lines:
  - speaker: dadi
    sa: आचार्यस्य गृहम् अस्ति।
    gloss:
      en: This is the teacher's house.
      hi: यह आचार्य का घर है।
- id: t1
  kind: teach
  title:
    en: 'Of, belonging to: the sixth case'
    hi: 'का, की, के: षष्ठी'
  depth: core
  skills:
  - case.gen
  sutras:
  - 2.3.50
  body:
    en: 'For “of” and “belonging to”, use the sixth case, {{षष्ठी}}: {{आचार्यस्य गृहम्}} (the teacher''s house), {{रामस्य
      पुस्तकम्}} (Rāma''s book). It joins one noun to another.'
    hi: '‘का, की, के’ के लिए षष्ठी विभक्ति: {{आचार्यस्य गृहम्}} (आचार्य का घर), {{रामस्य पुस्तकम्}} (राम की पुस्तक)। यह एक
      संज्ञा को दूसरी से जोड़ती है।'
  examples:

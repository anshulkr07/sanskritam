- id: t2
  kind: teach
  title:
    en: Whose?
    hi: किसका?
  depth: core
  skills:
  - case.gen
  body:
    en: '{{कस्य}} means “whose?” (masculine) and {{कस्याः}} (feminine). {{कस्य पुस्तकम्?}} Whose book? The sixth case also names a part of a whole and any other link the other cases do not cover.'
    hi: '{{कस्य}} का अर्थ ‘किसका?’ (पुंलिंग) और {{कस्याः}} (स्त्रीलिंग)। {{कस्य पुस्तकम्?}} किसकी पुस्तक? षष्ठी पूरे का भाग और अन्य सम्बन्ध भी बताती है जिन्हें दूसरी विभक्तियाँ नहीं कहतीं।'
  examples:
  - sa: कस्य पुस्तकम्?
    meaning:
      en: Whose book?
      hi: किसकी पुस्तक?

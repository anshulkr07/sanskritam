id: of.check
template: check
title:
  en: Whose is it?
  hi: यह किसका है?
title_sa: परीक्षा
minutes: 4
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - case.gen
  mode: choice
  prompt:
    en: “The teacher's house.” Which word for “teacher”?
    hi: ‘आचार्य का घर।’ ‘आचार्य’ के लिए कौन-सा रूप?
  explain:
    en: 'Owner: sixth case.'
    hi: 'स्वामी: षष्ठी।'
  roman: after
  options:
  - sa: आचार्यः
  - sa: आचार्यम्
  - correct: true
    sa: आचार्यस्य
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: आचार्यस्य गृहम्।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: the teacher's house
        hi: आचार्य का घर
      words:
      - sa: आचार्यस्य
        gloss:
          en: of the teacher
          hi: आचार्य का
        check:
          type: subanta
          stem: आचार्य
          linga: Pum
          vibhakti: Sasthi
          vacana: Eka
      - sa: गृहम्
        gloss:
          en: house
          hi: घर
        check:
          type: subanta
          stem: गृह
          linga: Napumsaka
          vibhakti: Prathama
          vacana: Eka
    - id: i1
      sa: आचार्यस्य
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: of the teacher
        hi: आचार्य का
      check:
        type: subanta
        stem: आचार्य
        linga: Pum
        vibhakti: Sasthi
        vacana: Eka
      feature:
        en: 'Stem: {{आचार्य}} · masculine · {{षष्ठी}} · singular'
        hi: 'प्रातिपदिक: {{आचार्य}} · {{पुंलिंग}} · {{षष्ठी}} · {{एकवचन}}'
      compare_from: आचार्य
    - id: i2
      sa: गृहम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: house
        hi: घर
      check:
        type: subanta
        stem: गृह
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{गृह}} · neuter · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{गृह}} · {{नपुंसकलिंग}} · {{प्रथमा}} · {{एकवचन}}'
      compare_from: गृह
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'For “of” and “belonging to”, use the sixth case, {{षष्ठी}}: {{आचार्यस्य गृहम्}} (the teacher''s house), {{रामस्य
          पुस्तकम्}} (Rāma''s book). It joins one noun to another.'
        hi: '‘का, की, के’ के लिए षष्ठी विभक्ति: {{आचार्यस्य गृहम्}} (आचार्य का घर), {{रामस्य पुस्तकम्}} (राम की पुस्तक)। यह
          एक संज्ञा को दूसरी से जोड़ती है।'
    - id: i5
      sa: आचार्यस्य गृहम्।
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: the teacher's house
        hi: आचार्य का घर
      words:
      - sa: आचार्यस्य
        gloss:
          en: of the teacher
          hi: आचार्य का
        check:
          type: subanta
          stem: आचार्य
          linga: Pum
          vibhakti: Sasthi
          vacana: Eka
      - sa: गृहम्
        gloss:
          en: house
          hi: घर
        check:
          type: subanta
          stem: गृह
          linga: Napumsaka
          vibhakti: Prathama
          vacana: Eka

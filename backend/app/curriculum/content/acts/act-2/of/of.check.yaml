  kind: practice
  depth: core
  skills:
  - case.gen-family
  - case.gen
  mode: order
  prompt:
    en: 'Name the things in the teacher''s house for the golden spirit: “my mother, my father, my home.”'
    hi: 'सुनहरे भूत को बताइए: ‘मेरी माता, मेरे पिता, मेरा घर।’'
  explain:
    en: '{{मम माता, मम पिता, मम गृहम्}}.'
    hi: '{{मम माता, मम पिता, मम गृहम्}}।'
  roman: after
  gate: true
  story:
    success:
      en: “मम माता, मम पिता, मम गृहम्.” Smṛtikā breathes the words in like warm air. Her lamp flares gold and she rises, light
        as the memory of a song. “रात्रौ गृहे दीपः अस्ति,” she says, and the lamp she has carried so long she places in your
        hands. Outside, the last of the storm clouds slide off the sky, and a lamp-lit night begins.
      hi: “मम माता, मम पिता, मम गृहम्।” स्मृतिका शब्दों को गर्म हवा की तरह भीतर लेती है। उसका दीपक सुनहरा भड़क उठता है और
        वह किसी गीत की स्मृति-सी हल्की उठती है। “रात्रौ गृहे दीपः अस्ति,” वह कहती है, और जो दीपक इतने समय से थामे थी वह आपके
        हाथों में रख देती है। बाहर आँधी के आख़िरी बादल आकाश से सरक जाते हैं, और दीपों से जगमग रात शुरू होती है।
    failure:

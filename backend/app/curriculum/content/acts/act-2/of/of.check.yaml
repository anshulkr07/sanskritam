- id: p4
  kind: practice
  depth: core
  skills:
  - case.gen-family
  mode: choice
  prompt:
    en: “My father.” Which phrase?
    hi: ‘मेरे पिता।’ कौन-सा वाक्यांश?
  explain:
    en: '{{मम}}: my.'
    hi: '{{मम}}: मेरा।'
  roman: after
  options:
  - correct: true
    sa: मम पिता
  - sa: अहं पिता
  - sa: मयि पिता
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'The sixth case of the pronouns says “my”, “your”, “his”, “her”: {{मम}} (my), {{तव}} (your), {{तस्य}} (his), {{तस्याः}}
        (her), {{अस्माकम्}} (our), {{युष्माकम्}} (your, many).'
      hi: 'सर्वनामों की षष्ठी ‘मेरा’, ‘तेरा’, ‘उसका’ बताती है: {{मम}} (मेरा), {{तव}} (तेरा), {{तस्य}} (उसका), {{तस्याः}} (उसकी),
        {{अस्माकम्}} (हमारा), {{युष्माकम्}} (तुम सबका)।'
    items:
    - id: i0
      sa: मम
      meaning:
        en: my, of me
        hi: मेरा
      check:
        type: subanta
        stem: अस्मद्
        linga: Pum
        vibhakti: Sasthi
        vacana: Eka
      feature:
        en: 'Stem: {{अस्मद्}} · {{षष्ठी}} · singular'
        hi: 'प्रातिपदिक: {{अस्मद्}} · {{षष्ठी}} · {{एकवचन}}'
      compare_from: अस्मद्
    - id: i1
      sa: तव
      meaning:
        en: your, of you
        hi: तेरा
      check:
        type: subanta
        stem: युष्मद्
        linga: Pum
        vibhakti: Sasthi
        vacana: Eka
      feature:
        en: 'Stem: {{युष्मद्}} · {{षष्ठी}} · singular'
        hi: 'प्रातिपदिक: {{युष्मद्}} · {{षष्ठी}} · {{एकवचन}}'
      compare_from: युष्मद्
    - id: i2
      sa: तस्य
      meaning:
        en: his, of him
        hi: उसका
      check:
        type: subanta
        stem: तद्
        linga: Pum
        vibhakti: Sasthi
        vacana: Eka
      feature:
        en: 'Stem: {{तद्}} · masculine · {{षष्ठी}} · singular'
        hi: 'प्रातिपदिक: {{तद्}} · {{पुंलिंग}} · {{षष्ठी}} · {{एकवचन}}'
      compare_from: तद्
    - id: i3
      sa: तस्याः
      meaning:
        en: her, of her
        hi: उसकी
      check:
        type: subanta
        stem: तद्
        linga: Stri
        vibhakti: Sasthi
        vacana: Eka
      feature:
        en: 'Stem: {{तद्}} · feminine · {{षष्ठी}} · singular'
        hi: 'प्रातिपदिक: {{तद्}} · {{स्त्रीलिंग}} · {{षष्ठी}} · {{एकवचन}}'
      compare_from: तद्
    - id: i4
      sa: अस्माकम्
      meaning:
        en: our, of us
        hi: हमारा
      check:
        type: subanta
        stem: अस्मद्
        linga: Pum
        vibhakti: Sasthi
        vacana: Bahu
      feature:
        en: 'Stem: {{अस्मद्}} · {{षष्ठी}} · plural'
        hi: 'प्रातिपदिक: {{अस्मद्}} · {{षष्ठी}} · {{बहुवचन}}'
      compare_from: अस्मद्
    - id: i5
      sa: युष्माकम्
      meaning:
        en: your, of you all
        hi: तुम सबका
      check:
        type: subanta
        stem: युष्मद्
        linga: Pum
        vibhakti: Sasthi
        vacana: Bahu
      feature:
        en: 'Stem: {{युष्मद्}} · {{षष्ठी}} · plural'
        hi: 'प्रातिपदिक: {{युष्मद्}} · {{षष्ठी}} · {{बहुवचन}}'
      compare_from: युष्मद्

- id: p3
  kind: practice
  title:
    en: The family link
    hi: परिवार की कड़ी
  depth: core
  skills:
  - case.gen-family
  mode: order
  prompt:
    en: 'Say: “My grandmother is the teacher''s pupil.”'
    hi: 'कहिए: ‘मेरी दादी आचार्य की शिष्या हैं।’'
  explain:
    en: '{{मम पितामही आचार्यस्य शिष्या}}: two sixth-case words, no verb needed.'
    hi: '{{मम पितामही आचार्यस्य शिष्या}}: दो षष्ठी शब्द, क्रिया की ज़रूरत नहीं।'
  roman: after
  gate: true
  story:
    success:
      en: “मम पितामही आचार्यस्य शिष्या,” you say, and the old Ācārya laughs aloud. “So she is.” Dādī tears up a little. Smṛtikā's lamp burns so bright that every name on the tree shows through the page.
      hi: “मम पितामही आचार्यस्य शिष्या,” आप कहते हैं, और बूढ़े आचार्य खुलकर हँस पड़ते हैं। “हाँ, वे हैं।” दादी की आँखें भर आती हैं। स्मृतिका का दीपक इतना उज्ज्वल जलता है कि वृक्ष का हर नाम पन्ने के आर-पार दिखता है।
    failure:
      en: The tree stays dim. “My” is {{मम}}; then the person; then the teacher's pupil.
      hi: वृक्ष धुँधला रहता है। ‘मेरी’ है {{मम}}; फिर व्यक्ति; फिर आचार्य की शिष्या।
  tokens:
  - मम
  - पितामही
  - आचार्यस्य
  - शिष्या
- id: sum
  kind: summary
  title:
    en: The family
    hi: परिवार
  depth: core
  points:
  - sa: मम · तव · तस्य · तस्याः
    text:
      en: My, your, his, her.
      hi: मेरा, तेरा, उसका, उसकी।
  - sa: पितुः · मातुः · भ्रातुः
    text:
      en: Of the father, mother, brother.
      hi: पिता, माता, भाई का।
  - sa: पितुः माता
    text:
      en: Link names with the sixth case.
      hi: नामों को षष्ठी से जोड़िए।

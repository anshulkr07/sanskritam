- id: s1
  kind: story
  title:
    en: Dādī draws a tree
    hi: दादी वृक्ष बनाती हैं
  depth: core
  image:
    brief: Dādī on the floor mat of the Ācārya's lamplit house drawing a family tree in her cloth-bound notebook with a reed
      pen, a trunk with many named branches; you leaning over her shoulder; the slim golden spirit's lamp glowing brighter
      as each name is read; Śuka on the shelf.
    alt:
      en: A grandmother draws a family tree in her notebook while a golden spirit's lamp brightens
      hi: कॉपी में वंशवृक्ष बनाती दादी और उज्ज्वल होता भूत का दीपक
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - smritika
    place: pathashala
    ratio: '4:3'
    id: of-family-s1
    text_in_image:
    - पिता
    - माता
    - भ्राता
    - भगिनी
    - पुत्रः
    - पितामही
  narration:
    en: 'That evening Dādī takes out her cloth-bound notebook and draws a tree for you: a trunk and many branches, each with
      a name. “Mother. Father. Brother. Sister. Grandmother. Whose are they? Yours.” The golden spirit Smṛtikā watches, and
      each name she reads makes her lamp burn a little brighter.'
    hi: 'उस शाम दादी अपनी कपड़े में बँधी कॉपी निकालती हैं और आपके लिए एक वृक्ष बनाती हैं: एक तना और कई शाखाएँ, हर एक पर एक
      नाम। “माता। पिता। भाई। बहन। दादी। ये किसके हैं? तुम्हारे।” सुनहरी स्मृतिका देखती है, और हर नाम पढ़ने पर उसका दीपक कुछ
      और उज्ज्वल हो उठता है।'
- id: t1
  kind: teach
  title:
    en: My, your, his, her
    hi: मेरा, तेरा, उसका
  depth: core
  skills:
  - case.gen-family
  body:
    en: 'The sixth case of the pronouns says “my”, “your”, “his”, “her”: {{मम}} (my), {{तव}} (your), {{तस्य}} (his), {{तस्याः}}
      (her), {{अस्माकम्}} (our), {{युष्माकम्}} (your, many).'
    hi: 'सर्वनामों की षष्ठी ‘मेरा’, ‘तेरा’, ‘उसका’ बताती है: {{मम}} (मेरा), {{तव}} (तेरा), {{तस्य}} (उसका), {{तस्याः}} (उसकी),
      {{अस्माकम्}} (हमारा), {{युष्माकम्}} (तुम सबका)।'
  rows:
  - sa: मम
    gloss:
      en: my, of me
      hi: मेरा
    check:
      type: subanta
      stem: अस्मद्
      linga: Pum
      vibhakti: Sasthi
      vacana: Eka
  - sa: तव
    gloss:
      en: your, of you
      hi: तेरा
    check:
      type: subanta
      stem: युष्मद्
      linga: Pum
      vibhakti: Sasthi
      vacana: Eka
  - sa: तस्य
    gloss:
      en: his, of him
      hi: उसका
    check:
      type: subanta
      stem: तद्
      linga: Pum
      vibhakti: Sasthi
      vacana: Eka
  - sa: तस्याः
    gloss:
      en: her, of her
      hi: उसकी
    check:
      type: subanta
      stem: तद्
      linga: Stri
      vibhakti: Sasthi
      vacana: Eka
  - sa: अस्माकम्
    gloss:
      en: our, of us
      hi: हमारा
    check:
      type: subanta
      stem: अस्मद्
      linga: Pum
      vibhakti: Sasthi
      vacana: Bahu
  - sa: युष्माकम्
    gloss:
      en: your, of you all
      hi: तुम सबका
    check:
      type: subanta
      stem: युष्मद्
      linga: Pum
      vibhakti: Sasthi
      vacana: Bahu

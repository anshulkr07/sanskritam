- id: t2
  kind: teach
  title:
    en: Reading the tree
    hi: वृक्ष पढ़ना
  depth: core
  skills:
  - case.gen-family
  body:
    en: Link names with the sixth case. {{मम माता}} (my mother), {{पितुः माता}} (father's mother) is {{पितामही}} (grandmother). {{मातुः पिता}} is {{मातामहः}} (mother's father).
    hi: नामों को षष्ठी से जोड़िए। {{मम माता}} (मेरी माता), {{पितुः माता}} (पिता की माता) यानी {{पितामही}} (दादी)। {{मातुः पिता}} यानी {{मातामहः}} (नाना)।
  examples:
  - sa: मम माता।
    meaning:
      en: my mother
      hi: मेरी माता
    words:
    - sa: मम
      gloss:
        en: my
        hi: मेरी
    - sa: माता
      gloss:
        en: mother
        hi: माता
      check:
        type: subanta
        stem: मातृ
        linga: Stri
        vibhakti: Prathama
        vacana: Eka
  - sa: पितुः माता।
    meaning:
      en: 'the father''s mother: grandmother'
      hi: 'पिता की माता: दादी'
    words:
    - sa: पितुः
      gloss:
        en: of the father
        hi: पिता की
      check:
        type: subanta
        stem: पितृ
        linga: Pum
        vibhakti: Sasthi
        vacana: Eka
    - sa: माता
      gloss:
        en: mother
        hi: माता
      check:
        type: subanta
        stem: मातृ
        linga: Stri
        vibhakti: Prathama
        vacana: Eka
  - sa: मातुः पिता।
    meaning:
      en: 'the mother''s father: maternal grandfather'
      hi: 'माता के पिता: नाना'
    words:
    - sa: मातुः
      gloss:
        en: of the mother
        hi: माता का
      check:
        type: subanta
        stem: मातृ
        linga: Stri
        vibhakti: Sasthi
        vacana: Eka
    - sa: पिता
      gloss:
        en: father
        hi: पिता
      check:
        type: subanta
        stem: पितृ
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
- id: p1
  kind: practice
  depth: core
  skills:
  - case.gen-family
  mode: choice
  prompt:
    en: “My mother.” Which phrase?
    hi: ‘मेरी माता।’ कौन-सा वाक्यांश?
  explain:
    en: '{{मम}}: of me, my.'
    hi: '{{मम}}: मेरा।'
  roman: after
  options:
  - sa: अहं माता
  - correct: true
    sa: मम माता
  - sa: माम् माता

- id: p3
  kind: practice
  title:
    en: For what?
    hi: किसलिए?
  depth: core
  skills:
  - case.dat-purpose
  mode: order
  prompt:
    en: 'Say: “We go for the leaves.”'
    hi: 'कहिए: ‘हम पत्रों के लिए जाते हैं।’'
  explain:
    en: '{{वयं पत्रेभ्यः गच्छामः}}: the purpose is in the fourth case.'
    hi: '{{वयं पत्रेभ्यः गच्छामः}}: उद्देश्य चतुर्थी में है।'
  roman: after
  gate: true
  story:
    success:
      en: '“वयं पत्रेभ्यः गच्छामः,” you say, and the Ācārya stops walking. “Then you are who I have been waiting for.” At the end of the courtyard the school''s door stands open. Dānaka sets his grain gently on the threshold: “नमः आचार्याय,” he whispers, and fades into golden light.'
      hi: '“वयं पत्रेभ्यः गच्छामः,” आप कहते हैं, और आचार्य चलना रोक देते हैं। “तब तुम वही हो जिसकी मैं प्रतीक्षा करता था।” आँगन के छोर पर पाठशाला का द्वार खुला है। दानक अपना दाना धीरे से देहली पर रखता है: “नमः आचार्याय,” वह फुसफुसाता है, और सुनहरी रोशनी में घुल जाता है।'
    failure:
      en: The Ācārya waits. The purpose, {{पत्रेभ्यः}}, takes the fourth case.
      hi: आचार्य प्रतीक्षा करते हैं। उद्देश्य {{पत्रेभ्यः}} चतुर्थी लेता है।
  tokens:
  - वयम्
  - पत्रेभ्यः
  - गच्छामः

- id: t2
  kind: teach
  title:
    en: What pleases whom
    hi: क्या किसे भाता है
  depth: core
  skills:
  - case.dat-purpose
  body:
    en: 'With {{रुच्}} (to please), the person pleased is in the fourth case and the thing that pleases is the doer: {{बालकाय फलं रोचते}}, “the fruit pleases the boy”, that is, the boy likes fruit.'
    hi: '{{रुच्}} (भाना) के साथ जिसे कुछ भाता है वह चतुर्थी में आता है और जो भाता है वह कर्ता बनता है: {{बालकाय फलं रोचते}}, ‘बालक को फल भाता है’, यानी बालक को फल पसन्द है।'
  examples:
  - sa: बालकाय फलम् रोचते।
    meaning:
      en: The boy likes fruit (the fruit pleases the boy).
      hi: बालक को फल पसन्द है।
    words:
    - sa: बालकाय
      gloss:
        en: to the boy
        hi: बालक को
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Caturthi
        vacana: Eka
    - sa: फलम्
      gloss:
        en: fruit
        hi: फल
      check:
        type: subanta
        stem: फल
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Eka
    - sa: रोचते
      gloss:
        en: pleases
        hi: भाता है
      check:
        type: tinanta
        dhatu: रुच्
        lakara: Lat
        purusha: Prathama
        vacana: Eka

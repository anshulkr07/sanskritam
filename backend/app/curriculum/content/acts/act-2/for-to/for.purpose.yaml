- id: s1
  kind: story
  title:
    en: Why have you come?
    hi: क्यों आए हो?
  depth: core
  image:
    brief: The courtyard of a village school with a neem tree and children at their slates; the old Ācārya walking beside you and Dādī, listening with a raised hand; Śuka on a low wall; the small golden spirit trailing with a grain of rice in his palms.
    alt:
      en: An old teacher leads visitors through a school courtyard
      hi: पाठशाला के आँगन में अतिथियों को ले जाते वृद्ध आचार्य
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - danaka
    place: pathashala
    ratio: '4:3'
    id: for-purpose-s1
  narration:
    en: The Ācārya leads you into the school courtyard. “Why have you come, child? For what?” he asks. “For learning,” says Dādī on your behalf. “For the leaves,” you say. The old man's eyes light up. Dānaka, the golden spirit, trails behind with his tiny grain, working out what a gift is for.
    hi: आचार्य आपको पाठशाला के आँगन में ले जाते हैं। “क्यों आए हो, बच्चे? किसलिए?” वे पूछते हैं। “पढ़ने के लिए,” दादी आपकी ओर से कहती हैं। “पत्रों के लिए,” आप कहते हैं। बूढ़े की आँखें चमक उठती हैं। सुनहरा भूत दानक अपना नन्हा दाना लिए पीछे-पीछे चलता है, यह सोचता हुआ कि उपहार किसलिए होता है।
  lines:
  - speaker: acarya
    sa: किमर्थम् आगतः असि?
    gloss:
      en: For what have you come?
      hi: किसलिए आए हो?
- id: t1
  kind: teach
  title:
    en: For the sake of
    hi: के लिए, के उद्देश्य से
  depth: core
  skills:
  - case.dat-purpose
  body:
    en: 'The fourth case also gives the purpose, the thing something is for: {{पठनाय गच्छति}} (he goes for study), {{भोजनाय आगच्छति}} (he comes for a meal). It answers “for what?”.'
    hi: 'चतुर्थी उद्देश्य भी बताती है, जिसके लिए कोई काम होता है: {{पठनाय गच्छति}} (वह पढ़ने के लिए जाता है), {{भोजनाय आगच्छति}} (वह भोजन के लिए आता है)। यह ‘किसलिए?’ का उत्तर देती है।'
  examples:
  - sa: बालकः पठनाय गच्छति।
    meaning:
      en: The boy goes for study.
      hi: बालक पढ़ने के लिए जाता है।
    words:
    - sa: बालकः
      gloss:
        en: boy
        hi: बालक
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
    - sa: पठनाय
      gloss:
        en: for study
        hi: पढ़ने के लिए
      check:
        type: subanta
        stem: पठन
        linga: Napumsaka
        vibhakti: Caturthi
        vacana: Eka
    - sa: गच्छति
      gloss:
        en: goes
        hi: जाता है
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
  - sa: सः भोजनाय आगच्छति।
    meaning:
      en: He comes for a meal.
      hi: वह भोजन के लिए आता है।
    words:
    - sa: सः
      gloss:
        en: he
        hi: वह
    - sa: भोजनाय
      gloss:
        en: for a meal
        hi: भोजन के लिए
      check:
        type: subanta
        stem: भोजन
        linga: Napumsaka
        vibhakti: Caturthi
        vacana: Eka
    - sa: आगच्छति
      gloss:
        en: comes
        hi: आता है
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
        prefixes:
        - आ
  - sa: वयम् पत्रेभ्यः गच्छामः।
    meaning:
      en: We go for the leaves.
      hi: हम पत्रों के लिए जाते हैं।
    words:
    - sa: वयम्
      gloss:
        en: we
        hi: हम
    - sa: पत्रेभ्यः
      gloss:
        en: for the leaves
        hi: पत्रों के लिए
      check:
        type: subanta
        stem: पत्र
        linga: Napumsaka
        vibhakti: Caturthi
        vacana: Bahu
    - sa: गच्छामः
      gloss:
        en: go
        hi: जाते हैं
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Uttama
        vacana: Bahu

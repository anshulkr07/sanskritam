- id: p8
  kind: practice
  depth: core
  skills:
  - case.dat
  - case.dat-purpose
  mode: order
  prompt:
    en: 'Tell the Ācārya: “I give a gift to the teacher, for study.”'
    hi: 'आचार्य से कहिए: ‘मैं पढ़ने के लिए आचार्य को उपहार देता हूँ।’'
  explain:
    en: '{{अहम् आचार्याय पठनाय फलं ददामि}}: the recipient and the purpose, both in the fourth case.'
    hi: '{{अहम् आचार्याय पठनाय फलं ददामि}}: पाने वाला और उद्देश्य, दोनों चतुर्थी में।'
  roman: after
  gate: true
  story:
    success:
      en: “आचार्याय पठनाय फलं ददामि.” The golden spirit Dānaka laughs, and each of his fingers lights like a little lamp.
        “नमः आचार्याय,” he says, and bows. Far overhead the sky is turning the colour of a bruise. “झञ्झावातः आगच्छति!” he
        calls, and points upriver, where a dark wall of cloud is rolling in.
      hi: “आचार्याय पठनाय फलं ददामि।” सुनहरा भूत दानक हँसता है, और उसकी हर उँगली छोटे दीपक-सी जल उठती है। “नमः आचार्याय,”
        वह कहता है और झुकता है। बहुत ऊपर आकाश चोट के रंग का होता जा रहा है। “झञ्झावातः आगच्छति!” वह पुकारता है और नदी की ऊपरी
        ओर इशारा करता है, जहाँ बादलों की एक काली दीवार लुढ़कती आ रही है।
    failure:
      en: Dānaka waits. Recipient first, then the gift, then the verb.

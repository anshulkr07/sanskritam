id: for.check
template: check
title:
  en: A gift for the teacher
  hi: आचार्य के लिए उपहार
title_sa: परीक्षा
minutes: 4
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - case.dat
  mode: choice
  prompt:
    en: “To the boy.” Which word?
    hi: ‘बालक को।’ कौन-सा शब्द?
  explain:
    en: 'The recipient: fourth case.'
    hi: 'पाने वाला: चतुर्थी।'
  roman: after
  options:
  - sa: बालकम्
  - sa: बालकेन
  - correct: true
    sa: बालकाय
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: अहम् आचार्याय फलम् ददामि।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: I give fruit to the teacher.
        hi: मैं आचार्य को फल देता हूँ।
      words:
      - sa: अहम्
        gloss:
          en: I
          hi: मैं
      - sa: आचार्याय
        gloss:
          en: to the teacher
          hi: आचार्य को
        check:
          type: subanta
          stem: आचार्य
          linga: Pum
          vibhakti: Caturthi
          vacana: Eka
      - sa: फलम्
        gloss:
          en: fruit
          hi: फल
        check:
          type: subanta
          stem: फल
          linga: Napumsaka
          vibhakti: Dvitiya
          vacana: Eka
      - sa: ददामि
        gloss:
          en: give
          hi: देता हूँ
        check:
          type: tinanta
          dhatu: दा
          lakara: Lat
          purusha: Uttama
          vacana: Eka
    - id: i1
      sa: अहम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: I
        hi: मैं
    - id: i2
      sa: आचार्याय
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: to the teacher
        hi: आचार्य को
      check:
        type: subanta
        stem: आचार्य
        linga: Pum
        vibhakti: Caturthi
        vacana: Eka
      feature:
        en: 'Stem: {{आचार्य}} · masculine · {{चतुर्थी}} · singular'
        hi: 'प्रातिपदिक: {{आचार्य}} · {{पुंलिंग}} · {{चतुर्थी}} · {{एकवचन}}'
      compare_from: आचार्य
    - id: i3
      sa: फलम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: fruit
        hi: फल
      check:
        type: subanta
        stem: फल
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Eka
      feature:
        en: 'Stem: {{फल}} · neuter · {{द्वितीया}} · singular'
        hi: 'प्रातिपदिक: {{फल}} · {{नपुंसकलिंग}} · {{द्वितीया}} · {{एकवचन}}'
      compare_from: फल
    - id: i4
      sa: ददामि
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: give
        hi: देता हूँ
      check:
        type: tinanta
        dhatu: दा
        lakara: Lat
        purusha: Uttama
        vacana: Eka
      feature:
        en: 'Root: {{दा}} · singular · {{लट्}} · First person ({{उत्तमपुरुष}})'
        hi: 'धातु: {{दा}} · {{एकवचन}} · {{लट्}} · उत्तमपुरुष'
      compare_from: दा
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'The one a thing is given to takes the fourth case, {{चतुर्थी}}, the recipient ({{सम्प्रदानम्}}): {{आचार्याय फलं
          ददाति}} (he gives fruit to the teacher).'
        hi: 'जिसे कोई वस्तु दी जाती है वह चतुर्थी में आता है, सम्प्रदान: {{आचार्याय फलं ददाति}} (वह आचार्य को फल देता है)।'
    - id: i7
      sa: अहम् आचार्याय फलम् ददामि।
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: I give fruit to the teacher.
        hi: मैं आचार्य को फल देता हूँ।
      words:
      - sa: अहम्
        gloss:
          en: I
          hi: मैं
      - sa: आचार्याय
        gloss:
          en: to the teacher
          hi: आचार्य को
        check:
          type: subanta
          stem: आचार्य
          linga: Pum
          vibhakti: Caturthi
          vacana: Eka
      - sa: फलम्
        gloss:
          en: fruit
          hi: फल
        check:
          type: subanta
          stem: फल
          linga: Napumsaka
          vibhakti: Dvitiya
          vacana: Eka
      - sa: ददामि
        gloss:
          en: give
          hi: देता हूँ
        check:
          type: tinanta
          dhatu: दा
          lakara: Lat
          purusha: Uttama
          vacana: Eka

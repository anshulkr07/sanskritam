id: for.revision
template: revision
title:
  en: Everything about to and for
  hi: को और के लिए, सब कुछ
title_sa: चतुर्थीसङ्ग्रहः
minutes: 4
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: core
  kind: revision
  title:
    en: The rules
    hi: नियम
  depth: core
  section: core
  rows:
  - skill: case.dat
    formula: आचार्याय फलं ददाति
    rule:
      en: The recipient takes the fourth case.
      hi: पाने वाला चतुर्थी लेता है।
    sutras:
    - 2.3.13
    - 1.4.32
    tag: core
    taught_in: for.giving#t1
  - skill: case.dat
    formula: बालकाय · बालिकायै · नद्यै
    rule:
      en: 'Singular endings: {{आय}} (masculine, neuter -अ), {{आयै}} (feminine -आ), {{यै}} (feminine -ई).'
      hi: 'एकवचन प्रत्यय: {{आय}} (पुंलिंग, नपुंसक -अ), {{आयै}} (स्त्रीलिंग -आ), {{यै}} (स्त्रीलिंग -ई)।'
    tag: core
    taught_in: for.giving#tb1
  - skill: case.dat
    formula: नमः आचार्याय
    rule:
      en: '{{नमः}} and {{स्वस्ति}} take the fourth case.'
      hi: '{{नमः}} और {{स्वस्ति}} चतुर्थी लेते हैं।'
    tag: core
    taught_in: for.giving#t2
  - skill: case.dat-purpose
    formula: पठनाय गच्छति
    rule:
      en: The purpose, “for what”, takes the fourth case.
      hi: उद्देश्य, ‘किसलिए’, चतुर्थी लेता है।
    tag: core
    taught_in: for.purpose#t1
  - skill: case.dat-purpose
    formula: बालकाय फलं रोचते
    rule:
      en: '{{रुच्}} (to please): the person pleased takes the fourth case.'
      hi: '{{रुच्}} (भाना): जिसे भाता है वह चतुर्थी में आता है।'
    tag: core
    taught_in: for.purpose#t2

- id: exceptions
  kind: revision
  title:
    en: Odd cases
    hi: विचित्र स्थितियाँ
  depth: core
  section: exceptions
  rows:
  - skill: case.dat
    rule:
      en: With verbs of going, the goal usually takes the second case, but the fourth case may also appear for a destination
        in poetry.
      hi: जाने की क्रियाओं के साथ गन्तव्य प्रायः द्वितीया लेता है, पर काव्य में गन्तव्य के लिए चतुर्थी भी दिख सकती है।
    example:
      sa: वनाय गच्छति
      meaning:
        en: he goes to the forest (poetic)
        hi: वह वन को जाता है (काव्य में)
    tag: rare
    new_here: true
    visuals:

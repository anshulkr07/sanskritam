- id: mistakes
  kind: revision
  title:
    en: Common mistakes
    hi: आम भूलें
  depth: core
  section: mistakes
  rows:
  - skill: case.dat
    rule:
      en: 'Do not put the recipient in the second case: {{आचार्याय फलं ददाति}}, not {{आचार्यं फलं ददाति}}.'
      hi: 'पाने वाले को द्वितीया में मत रखिए: {{आचार्याय फलं ददाति}}, {{आचार्यं फलं ददाति}} नहीं।'
    tag: core
    taught_in: for.giving#t1
  - skill: case.dat-purpose
    rule:
      en: Do not confuse the purpose {{पठनाय}} with the means {{पठनेन}}.
      hi: उद्देश्य {{पठनाय}} को साधन {{पठनेन}} से मत मिलाइए।
    tag: core
    taught_in: for.purpose#t1
- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: case.dat
    rule:
      en: '{{कर्मणा यमभिप्रैति स सम्प्रदानम्}}: the recipient; {{चतुर्थी सम्प्रदाने}}: the fourth case.'
      hi: '{{कर्मणा यमभिप्रैति स सम्प्रदानम्}}: सम्प्रदान; {{चतुर्थी सम्प्रदाने}}: चतुर्थी विभक्ति।'
    sutras:
    - 1.4.32
    - 2.3.13
    tag: core
    taught_in: for.giving#pn

- id: s1
  kind: story
  title:
    en: The teacher's ghat
    hi: आचार्य का घाट
  depth: core
  image:
    brief: A small village ghat with a whitewashed school among neem trees above it; at the gate a very old scholar with a white beard and a palm-leaf book under his arm, smiling; you, Dādī and Śuka coming up the steps with fruit, a lamp and a length of cloth; a small golden spirit with cupped hands following.
    alt:
      en: Arriving at a village school where an old scholar waits at the gate
      hi: गाँव की पाठशाला पर पहुँचना, फाटक पर प्रतीक्षा करते बूढ़े आचार्य
    cast:
    - you
    - dadi
    - shuka
    - acarya
    - danaka
    place: pathashala
    ratio: '4:3'
    id: for-giving-s1
  narration:
    en: 'The boat bumps against the steps of a small village ghat. Above it, among neem trees, stands a whitewashed school, and at its gate waits a very old scholar with a white beard and a palm-leaf book under his arm: the Ācārya, Dādī''s teacher. You have brought gifts: fruit, a lamp, a length of cloth. Dānaka, a small golden spirit, has followed you ashore, hands cupped, hoping.'
    hi: 'नाव एक छोटे गाँव के घाट की सीढ़ियों से टकराती है। ऊपर नीम के पेड़ों के बीच चूने से पुती एक पाठशाला खड़ी है, और उसके फाटक पर बहुत बूढ़े, सफ़ेद दाढ़ी वाले एक विद्वान प्रतीक्षा करते हैं, बग़ल में ताड़पत्र की पुस्तक दबाए: आचार्य, दादी के गुरु। आप उपहार लाए हैं: फल, दीपक, कपड़े का एक थान। दानक, एक नन्हा सुनहरा भूत, हाथ फैलाए, आशा में, आपके पीछे किनारे तक आ गया है।'
  lines:
  - speaker: dadi
    sa: आचार्याय फलं ददामि।
    gloss:
      en: I give fruit to the teacher.
      hi: मैं आचार्य को फल देता हूँ।
- id: t1
  kind: teach
  title:
    en: 'The one who receives: the fourth case'
    hi: 'पाने वाला: चतुर्थी'
  depth: core
  skills:

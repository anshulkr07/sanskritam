- id: p3
  kind: practice
  title:
    en: A gift
    hi: एक उपहार
  depth: core
  skills:
  - case.dat
  mode: order
  prompt:
    en: 'Say: “I give a lamp to the teacher.”'
    hi: 'कहिए: ‘मैं आचार्य को दीपक देता हूँ।’'
  explain:
    en: '{{अहम् आचार्याय दीपं ददामि}}: the teacher receives.'
    hi: '{{अहम् आचार्याय दीपं ददामि}}: आचार्य पाता है।'
  roman: after
  gate: true
  story:
    success:
      en: “आचार्याय दीपं ददामि,” you say, and the old scholar takes the little lamp with both hands. Beside you Dānaka makes a soft sound of longing. The Ācārya notices him, and lays a single grain of rice in the spirit's cupped palms.
      hi: “आचार्याय दीपं ददामि,” आप कहते हैं, और बूढ़े विद्वान दोनों हाथों से छोटा दीपक लेते हैं। आपके पास दानक ललक की धीमी ध्वनि निकालता है। आचार्य उसे देख लेते हैं और भूत की फैली हथेलियों में चावल का एक दाना रख देते हैं।
    failure:
      en: The Ācārya waits. The one who receives, {{आचार्याय}}, comes before the thing given.
      hi: आचार्य प्रतीक्षा करते हैं। पाने वाला {{आचार्याय}} दी जाने वाली वस्तु से पहले आता है।
  tokens:
  - अहम्
  - आचार्याय
  - दीपम्
  - ददामि
- id: pn
  kind: teach
  title:
    en: Pāṇini's recipient
    hi: पाणिनि का सम्प्रदान
  depth: panini
  skills:
  - case.dat
  sutras:
  - 1.4.32
  - 2.3.13
  body:
    en: 'Sūtra 1.4.32, {{कर्मणा यमभिप्रैति स सम्प्रदानम्}}: the recipient is the one the doer aims at with the object. Sūtra 2.3.13 gives it the fourth case.'
    hi: 'सूत्र 1.4.32, {{कर्मणा यमभिप्रैति स सम्प्रदानम्}}: सम्प्रदान वह है जिसे कर्ता कर्म के द्वारा पाना चाहता है। सूत्र 2.3.13 उसे चतुर्थी देता है।'
  term:
    sa: सम्प्रदानम्
    meaning:
      en: the recipient
      hi: 'सम्प्रदान: पाने वाला'
- id: sum
  kind: summary
  title:
    en: The recipient
    hi: पाने वाला
  depth: core
  points:
  - sa: आचार्याय · बालकाय · बालिकायै

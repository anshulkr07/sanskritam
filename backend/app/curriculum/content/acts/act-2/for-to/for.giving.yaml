    hi: 'जिसे कोई वस्तु दी जाती है वह चतुर्थी में आता है, सम्प्रदान: {{आचार्याय फलं ददाति}} (वह आचार्य को फल देता है)।'
  examples:
  - sa: अहम् आचार्याय फलम् ददामि।
    meaning:
      en: I give fruit to the teacher.
      hi: मैं आचार्य को फल देता हूँ।
    words:
    - sa: अहम्
      gloss:
        en: I
        hi: मैं
    - sa: आचार्याय
      gloss:
        en: to the teacher
        hi: आचार्य को
      check:
        type: subanta
        stem: आचार्य
        linga: Pum
        vibhakti: Caturthi
        vacana: Eka
    - sa: फलम्
      gloss:
        en: fruit
        hi: फल
      check:
        type: subanta
        stem: फल
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Eka
    - sa: ददामि
      gloss:
        en: give
        hi: देता हूँ
      check:
        type: tinanta
        dhatu: दा
        lakara: Lat
        purusha: Uttama
        vacana: Eka

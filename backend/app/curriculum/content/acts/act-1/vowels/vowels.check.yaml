- id: c4
  kind: practice
  mode: choice
  skills:
  - script.vowel.compound
  roman: after
  prompt:
    en: Which vowel is always long?
    hi: कौन-सा स्वर सदा दीर्घ होता है?
  options:
  - sa: इ
  - sa: ओ
    correct: true
  - sa: उ
  explain:
    en: '{{ओ}}, like all four joined vowels, always lasts two beats.'
    hi: '{{ओ}}, चारों संयुक्त स्वरों की तरह, सदा दो मात्रा का होता है।'
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'When {{अ}} meets {{इ}}, they press into one smooth sound, {{ए}}: e as in “they”. {{अ}} with {{उ}} gives {{ओ}}:
        o as in “go”. {{ऐ}} and {{औ}} glide instead: ai as in “aisle”, au as in “out”.'
      hi: 'जब {{अ}} और {{इ}} मिलते हैं, तो वे एक चिकनी ध्वनि {{ए}} बन जाते हैं। {{अ}} और {{उ}} मिलकर {{ओ}} बनते हैं। {{ऐ}}
        और {{औ}} फिसलते हुए बोले जाते हैं: ‘अ’ से ‘इ’ की ओर, और ‘अ’ से ‘उ’ की ओर।'
    items:
    - id: i0
      sa: अ + इ → ए
      meaning:
        en: e, as in “they”
        hi: ए, जैसे ‘एक’ में
    - id: i1
      sa: अ + उ → ओ
      meaning:
        en: o, as in “go”
        hi: ओ, जैसे ‘ओस’ में
    - id: i2
      sa: ऐ
      meaning:
        en: ai, a glide, as in “aisle”
        hi: ऐ, ‘अ’ से ‘इ’ की ओर फिसलता
    - id: i3
      sa: औ
      meaning:
        en: au, a glide, as in “out”
        hi: औ, ‘अ’ से ‘उ’ की ओर फिसलता
- id: c5
  kind: practice
  mode: type
  skills:

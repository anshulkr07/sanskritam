  prompt:
    en: How do you say {{ऋ}}?
    hi: '{{ऋ}} कैसे बोलते हैं?'
  options:
  - text:
      en: One quick vowel r
      hi: एक छोटी ध्वनि, स्वर के रूप में ‘र’
    correct: true
  - text:
      en: r followed by a full i, “ri-i”
      hi: ‘र’ के बाद पूरा ‘इ’
    why:
      en: That is two sounds, {{र}} + {{इ}}. {{ऋ}} is one.
      hi: यह दो ध्वनियाँ हैं, {{र}} + {{इ}}। {{ऋ}} एक है।

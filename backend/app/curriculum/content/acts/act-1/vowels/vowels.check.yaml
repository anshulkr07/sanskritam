  roman: after
  prompt:
    en: 'Build {{क्}} + {{ऐ}}: {{क}} with the sign for {{ऐ}}.'
    hi: 'बनाइए: {{क}} पर {{ऐ}} की मात्रा।'
  answers:
  - कै
  tiles:
  - क
  - ै
  - े
  - ा
  explain:
    en: '{{ै}}, two strokes above the letter: {{कै}}. One stroke, {{े}}, is {{ए}}.'
    hi: '{{ै}}, अक्षर के ऊपर दो रेखाएँ: {{कै}}। एक रेखा, {{े}}, {{ए}} की मात्रा है।'
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: क्
      meaning:
        en: '{{क्}} alone, with no vowel (rare)'
        hi: अकेला क्, बिना स्वर (कम दिखता है)
    - id: i1
      sa: क
      meaning:
        en: '{{क्}} + {{अ}} = {{क}}, ka'
        hi: क् + अ = क
    - id: i2
      sa: का
      meaning:
        en: '{{क्}} + {{आ}} = {{का}}, kā'
        hi: क् + आ = का

- title: Lesson text
  licence: original
cards:
- id: c1
  kind: practice
  mode: choice
  skills:
  - script.vowel.short
  roman: after
  prompt:
    en: Which is a short vowel?
    hi: इनमें से ह्रस्व स्वर कौन-सा है?
  options:
  - sa: आ
  - sa: उ
    correct: true
  - sa: ए
  explain:
    en: '{{उ}} is short; {{आ}} and {{ए}} are long.'
    hi: '{{उ}} ह्रस्व है; {{आ}} और {{ए}} दीर्घ हैं।'
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'A vowel, {{स्वरः}}, is a sound you can hold with your mouth open. Sanskrit gives each vowel its own letter. The
        leaf''s first group holds three of them, all short: say each one quickly, in one beat.'
      hi: 'स्वर ({{स्वरः}}) वह ध्वनि है जिसे मुँह खोलकर देर तक बोला जा सकता है। संस्कृत में हर स्वर का अपना अक्षर है। पत्र
        के पहले समूह में ऐसे तीन स्वर हैं, तीनों ह्रस्व: हर एक को जल्दी, एक मात्रा में बोलिए।'
    items:
    - id: i0
      sa: अ
      meaning:
        en: a, like the u in “but”
        hi: अ, जैसे ‘अब’ में
    - id: i1
      sa: इ
      meaning:
        en: i, like the i in “sit”
        hi: इ, जैसे ‘इमली’ में
    - id: i2
      sa: उ
      meaning:
        en: u, like the u in “put”
        hi: उ, जैसे ‘उधर’ में
- id: c2
  kind: practice
  mode: choice
  skills:
  - script.vowel.long
  prompt:
    en: Which word means “a riverbank”?
    hi: ‘नदी का किनारा’ किस शब्द का अर्थ है?
  options:
  - sa: कुलम्
    why:
      en: '{{कुलम्}}, short {{उ}}: a family.'
      hi: '{{कुलम्}} में ह्रस्व उ: परिवार।'
  - sa: कूलम्
    correct: true
  explain:
    en: '{{कूलम्}} has the long {{ऊ}}: a riverbank.'
    hi: '{{कूलम्}} में दीर्घ ऊ है: नदी का किनारा।'
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Three short vowels have a long twin, held for two beats: {{आ}} ā, {{ई}} ī, {{ऊ}} ū. {{ऋ}} has one too, {{ॠ}} ṝ,
        but you will rarely see it. A long vowel is made at the same place as its short twin, only held twice as long.'
      hi: 'तीन ह्रस्व स्वरों का एक दीर्घ जुड़वाँ है, जो दो मात्रा तक बोला जाता है: {{आ}}, {{ई}}, {{ऊ}}। {{ऋ}} का भी है, {{ॠ}},
        पर वह कम ही दिखता है। दीर्घ स्वर उसी स्थान से बनता है जहाँ से उसका ह्रस्व जुड़वाँ, बस दुगुने समय तक बोला जाता है।'
    items:
    - id: i0
      sa: अ → आ
      meaning:
        en: a → ā, as in “father”
        hi: अ → आ, जैसे ‘आम’ में
    - id: i1
      sa: इ → ई
      meaning:
        en: i → ī, as in “see”
        hi: इ → ई, जैसे ‘ईख’ में
    - id: i2
      sa: उ → ऊ
      meaning:
        en: u → ū, as in “moon”
        hi: उ → ऊ, जैसे ‘ऊन’ में
    - id: i3
      sa: ऋ → ॠ
      meaning:
        en: ṛ → ṝ, held longer (rare)
        hi: ऋ → ॠ, लम्बा खिंचा (दुर्लभ)

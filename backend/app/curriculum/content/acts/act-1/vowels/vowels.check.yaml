- id: c9
  kind: practice
  mode: order
  title:
    en: Read the whole line
    hi: पूरी पंक्ति पढ़िए
  skills:
  - script.vowel.short
  - script.vowel.compound
  roman: after
  gate: true
  prompt:
    en: 'Read the first line aloud for Dhūmaka: put all nine vowels in the leaf''s order.'
    hi: 'धूमक के लिए पहली पंक्ति ज़ोर से पढ़िए: नौ स्वरों को पत्र के क्रम में लगाइए।'
  tokens:
  - अ
  - इ
  - उ
  - ऋ
  - ऌ
  - ए
  - ओ
  - ऐ
  - औ
  explain:
    en: 'Four groups: {{अ}} {{इ}} {{उ}}, {{ऋ}} {{ऌ}}, {{ए}} {{ओ}}, {{ऐ}} {{औ}}.'
    hi: 'चार समूह: {{अ}} {{इ}} {{उ}}, {{ऋ}} {{ऌ}}, {{ए}} {{ओ}}, {{ऐ}} {{औ}}।'
  story:
    success:
      en: You read the line aloud, from अ to औ. The leaf blazes gold, and Dhūmaka rises like smoke from a lamp just put out,
        smiling.
      hi: आप पंक्ति ज़ोर से पढ़ते हैं, अ से औ तक। पत्र सुनहरा दमक उठता है, और धूमक अभी-अभी बुझे दीपक के धुएँ की तरह मुस्कुराता
        हुआ ऊपर उठता है।
    failure:
      en: 'The line flickers. Dhūmaka waits. Take it group by group: अ इ उ, ऋ ऌ, ए ओ, ऐ औ.'
      hi: 'पंक्ति टिमटिमाती है। धूमक प्रतीक्षा करता है। समूह-दर-समूह चलिए: अ इ उ, ऋ ऌ, ए ओ, ऐ औ।'

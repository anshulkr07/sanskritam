        hi: स्वर को ज़रूरत से ज़्यादा खींचिए या छोटा कर दीजिए, तो शब्द ही बदल जाता है। नीचे के हर जोड़े में केवल एक स्वर की
          लम्बाई का अन्तर है। शब्द के भीतर स्वर एक छोटी मात्रा बनकर लिखा जाता है, जिसे आप पत्र की दूसरी पंक्ति में देखेंगे।

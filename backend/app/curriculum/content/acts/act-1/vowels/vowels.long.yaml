- id: t2
  kind: teach
  title:
    en: One beat or two
    hi: एक मात्रा या दो
  skills:
  - script.vowel.long
  body:
    en: Hold a vowel too long, or clip it too short, and you say a different word. Each pair below differs only in one vowel's
      length. Inside a word a vowel is written as a small sign, which you will meet on the leaf's second line. For now, compare
      the Roman letters.
    hi: स्वर को ज़रूरत से ज़्यादा खींचिए या छोटा कर दीजिए, तो शब्द ही बदल जाता है। नीचे के हर जोड़े में केवल एक स्वर की लम्बाई
      का अन्तर है। शब्द के भीतर स्वर एक छोटी मात्रा बनकर लिखा जाता है, जिसे आप पत्र की दूसरी पंक्ति में देखेंगे।
  examples:
  - sa: दिनम्
    meaning:
      en: a day (short {{इ}})
      hi: दिन (ह्रस्व इ)
    check:
      type: subanta
      stem: दिन
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka
  - sa: दीनः
    meaning:
      en: a poor, humble person (long {{ई}})
      hi: दीन व्यक्ति (दीर्घ ई)
    check:
      type: subanta
      stem: दीन
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: कुलम्
    meaning:
      en: a family (short {{उ}})
      hi: कुल, परिवार (ह्रस्व उ)
    check:
      type: subanta
      stem: कुल
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka
  - sa: कूलम्
    meaning:
      en: a riverbank (long {{ऊ}})
      hi: नदी का किनारा (दीर्घ ऊ)
    check:
      type: subanta
      stem: कूल
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka

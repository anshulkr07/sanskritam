      sa: कूलम्
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: a riverbank (long {{ऊ}})
        hi: नदी का किनारा (दीर्घ ऊ)
      check:
        type: subanta
        stem: कूल
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{कूल}} · neuter · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{कूल}} · {{नपुंसकलिंग}} · {{प्रथमा}} · {{एकवचन}}'
      compare_from: कूल
- id: p2
  kind: practice
  mode: choice
  title:
    en: Greet the day
    hi: दिन का स्वागत
  skills:
  - script.vowel.long
  gate: true
  prompt:
    en: Help Śuka greet the morning properly. Which word means “day”?
    hi: शुक को सुबह का ठीक से स्वागत करने में मदद कीजिए। ‘दिन’ के लिए कौन-सा शब्द है?
  options:
  - sa: दिनम्
    correct: true
  - sa: दीनः
    why:
      en: '{{दीनः}} has the long {{ई}}: a poor person. That is how Śuka got into trouble.'
      hi: '{{दीनः}} में दीर्घ ई है: दीन व्यक्ति। शुक इसी से मुसीबत में पड़ा।'
  explain:
    en: '{{दिनम्}}, with a short {{इ}}: a day.'
    hi: '{{दिनम्}} में ह्रस्व इ है: दिन।'
  story:
    success:
      en: Śuka puffs up his feathers and calls, “दिनम्! दिनम्!” Dādī laughs and puts her spectacles back on. Dhūmaka's outline
        grows a little sharper.
      hi: शुक पंख फुलाकर पुकारता है, “दिनम्! दिनम्!” दादी हँसकर फिर से चश्मा लगा लेती हैं। धूमक की आकृति थोड़ी और साफ़ हो
        जाती है।
    failure:
      en: '“दीनः!” squawks Śuka again. Dādī raises an eyebrow: “Still poor, am I?” Listen for the short {{इ}}.'
      hi: “दीनः!” शुक फिर चिल्लाता है। दादी भौंहें उठाती हैं, “अब भी मैं दीन हूँ?” ह्रस्व इ पर ध्यान दीजिए।
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Three short vowels have a long twin, held for two beats: {{आ}} ā, {{ई}} ī, {{ऊ}} ū. {{ऋ}} has one too, {{ॠ}} ṝ,
        but you will rarely see it. A long vowel is made at the same place as its short twin, only held twice as long.'
      hi: 'तीन ह्रस्व स्वरों का एक दीर्घ जुड़वाँ है, जो दो मात्रा तक बोला जाता है: {{आ}}, {{ई}}, {{ऊ}}। {{ऋ}} का भी है, {{ॠ}},
        पर वह कम ही दिखता है। दीर्घ स्वर उसी स्थान से बनता है जहाँ से उसका ह्रस्व जुड़वाँ, बस दुगुने समय तक बोला जाता है।'
    items:
    - id: i0
      sa: अ → आ
      meaning:
        en: a → ā, as in “father”
        hi: अ → आ, जैसे ‘आम’ में
    - id: i1
      sa: इ → ई
      meaning:
        en: i → ī, as in “see”
        hi: इ → ई, जैसे ‘ईख’ में
    - id: i2
      sa: उ → ऊ
      meaning:
        en: u → ū, as in “moon”
        hi: उ → ऊ, जैसे ‘ऊन’ में
    - id: i3
      sa: ऋ → ॠ
      meaning:
        en: ṛ → ṝ, held longer (rare)
        hi: ऋ → ॠ, लम्बा खिंचा (दुर्लभ)

cards:
- id: s1
  kind: story
  title:
    en: Śuka stretches everything
    hi: शुक सब कुछ खींच देता है
  image:
    id: vowels-long-shuka
    text_in_image:
    - अ इ उ
    - ऋ ऌ
    - ए ओ
    - ऐ औ
    brief: 'Early morning in the temple library: Śuka the parrot at an open window with the sunrise behind him, beak wide
      open mid-squawk, wings half spread; Dādī at the reading desk lowering her round spectacles with one eyebrow raised,
      amused; Dhūmaka giggling as a little puff of smoke beside the glowing leaf.'
    alt:
      en: A parrot squawking at a sunrise window while a grandmother raises an eyebrow and a small ghost giggles
      hi: सूर्योदय की खिड़की पर चिल्लाता तोता, भौंहें उठाती दादी और खिलखिलाता नन्हा भूत
    ratio: '4:3'
    cast:
    - shuka
    - dadi
    - dhumaka
    place: granthalaya
  narration:
    en: Śuka wants to help. Every sound Dādī reads, he repeats, but stretched out long. Then morning comes, and he flies to
      the window to greet the day. Dādī puts down her spectacles. “Śuka, why are you calling me poor?”
    hi: शुक मदद करना चाहता है। दादी जो भी ध्वनि पढ़ती हैं, वह उसे दोहराता है, पर खींचकर, लम्बा करके। फिर सुबह होती है, और
      वह दिन का स्वागत करने खिड़की पर उड़ जाता है। दादी अपना चश्मा नीचे रखती हैं, “शुक, तुम मुझे दीन क्यों कह रहे हो?”
  lines:
  - speaker: shuka
    sa: दीनः! दीनः!
    gloss:
      en: “Poor one! Poor one!”
      hi: “दीन! दीन!”
- id: t1
  kind: teach
  title:
    en: The long twins
    hi: दीर्घ जुड़वाँ
  skills:
  - script.vowel.long
  sutras:
  - 1.2.27
  body:
    en: 'Three short vowels have a long twin, held for two beats: {{आ}} ā, {{ई}} ī, {{ऊ}} ū. {{ऋ}} has one too, {{ॠ}} ṝ, but
      you will rarely see it. A long vowel is made at the same place as its short twin, only held twice as long.'
    hi: 'तीन ह्रस्व स्वरों का एक दीर्घ जुड़वाँ है, जो दो मात्रा तक बोला जाता है: {{आ}}, {{ई}}, {{ऊ}}। {{ऋ}} का भी है, {{ॠ}},
      पर वह कम ही दिखता है। दीर्घ स्वर उसी स्थान से बनता है जहाँ से उसका ह्रस्व जुड़वाँ, बस दुगुने समय तक बोला जाता है।'
  rows:
  - sa: अ → आ
    gloss:
      en: a → ā, as in “father”
      hi: अ → आ, जैसे ‘आम’ में
  - sa: इ → ई
    gloss:
      en: i → ī, as in “see”
      hi: इ → ई, जैसे ‘ईख’ में
  - sa: उ → ऊ
    gloss:
      en: u → ū, as in “moon”
      hi: उ → ऊ, जैसे ‘ऊन’ में
  - sa: ऋ → ॠ
    gloss:
      en: ṛ → ṝ, held longer (rare)
      hi: ऋ → ॠ, लम्बा खिंचा (दुर्लभ)
  visuals:

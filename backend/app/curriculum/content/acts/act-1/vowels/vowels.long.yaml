  kind: practice
  mode: choice
  skills:
  - script.vowel.long
  roman: after
  prompt:
    en: Which is the long twin of {{इ}}?
    hi: '{{इ}} का दीर्घ जुड़वाँ कौन-सा है?'
  options:
  - sa: ई
    correct: true
  - sa: ए
    why:
      en: '{{ए}} is a different vowel, made at two places; it is not {{इ}} held longer.'
      hi: '{{ए}} अलग स्वर है, जो दो स्थानों से बनता है; यह {{इ}} का लम्बा रूप नहीं।'
  - sa: ऊ
    why:
      en: '{{ऊ}} is the long twin of {{उ}}.'
      hi: '{{ऊ}} तो {{उ}} का दीर्घ रूप है।'
  explain:
    en: '{{ई}} is {{इ}} held for two beats, at the same place: the palate.'
    hi: '{{ई}} वही {{इ}} है, दो मात्रा तक, उसी स्थान से: तालु।'

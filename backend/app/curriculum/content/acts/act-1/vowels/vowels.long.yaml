- id: pn
  kind: teach
  depth: panini
  title:
    en: Twins in Pāṇini
    hi: पाणिनि में जुड़वाँ
  skills:
  - script.vowel.long
  sutras:
  - 1.1.9
  - 1.1.69
  term:
    sa: सवर्णम्
    meaning:
      en: 'sounds of one kind: same place, same effort'
      hi: एक ही स्थान और प्रयत्न वाली ध्वनियाँ
  body:
    en: 'Sūtra 1.1.9 calls sounds made at one place with one effort {{सवर्ण}}, “of one kind”: {{इ}} and {{ई}} are {{सवर्ण}}.
      By sūtra 1.1.69 a short vowel in a rule stands for its twins too. So the leaf, like Pāṇini''s list, writes only {{अ}}
      {{इ}} {{उ}}, never {{आ}} {{ई}} {{ऊ}}.'
    hi: 'सूत्र 1.1.9 एक ही स्थान और एक ही प्रयत्न से बनी ध्वनियों को {{सवर्ण}} कहता है: {{इ}} और {{ई}} सवर्ण हैं। सूत्र 1.1.69
      के अनुसार नियम में लिखा ह्रस्व स्वर अपने सवर्णों का भी बोध कराता है। इसीलिए पत्र, पाणिनि की सूची की तरह, केवल {{अ}}
      {{इ}} {{उ}} लिखता है, {{आ}} {{ई}} {{ऊ}} कभी नहीं।'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'Sūtra 1.1.9 calls sounds made at one place with one effort {{सवर्ण}}, “of one kind”: {{इ}} and {{ई}} are {{सवर्ण}}.
        By sūtra 1.1.69 a short vowel in a rule stands for its twins too. So the leaf, like Pāṇini''s list, writes only {{अ}}
        {{इ}} {{उ}}, never {{आ}} {{ई}} {{ऊ}}.'
      hi: 'सूत्र 1.1.9 एक ही स्थान और एक ही प्रयत्न से बनी ध्वनियों को {{सवर्ण}} कहता है: {{इ}} और {{ई}} सवर्ण हैं। सूत्र
        1.1.69 के अनुसार नियम में लिखा ह्रस्व स्वर अपने सवर्णों का भी बोध कराता है। इसीलिए पत्र, पाणिनि की सूची की तरह, केवल
        {{अ}} {{इ}} {{उ}} लिखता है, {{आ}} {{ई}} {{ऊ}} कभी नहीं।'
    items:
    - id: i0
      sa: सवर्ण
    - id: i1
      sa: इ
    - id: i2
      sa: ई
    - id: i3
      sa: अ
    - id: i4
      sa: उ
    - id: i5
      sa: आ
    - id: i6
      sa: ऊ
- id: sum
  kind: summary
  title:
    en: The long vowels
    hi: दीर्घ स्वर
  points:
  - sa: आ ई ऊ ॠ
    text:
      en: 'Long vowels: two beats each.'
      hi: 'दीर्घ स्वर: हर एक की दो मात्राएँ।'
  - text:
      en: A long vowel is made where its short twin is made.
      hi: दीर्घ स्वर वहीं बनता है जहाँ उसका ह्रस्व जुड़वाँ।
  - sa: दिनम् · दीनः
    text:
      en: 'Length changes the word: a day, a poor person.'
      hi: 'लम्बाई से शब्द बदलता है: दिन, दीन व्यक्ति।'
  - sa: कुलम् · कूलम्
    text:
      en: A family, a riverbank.
      hi: कुल, नदी का किनारा।

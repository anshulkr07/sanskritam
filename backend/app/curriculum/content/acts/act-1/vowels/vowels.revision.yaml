- id: panini
  kind: revision
  section: panini
  depth: panini
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  rows:
  - skill: script.vowel.short
    rule:
      en: 'Vowels are named by time: {{ह्रस्वः}} one beat, {{दीर्घः}} two, {{प्लुतः}} three.'
      hi: 'स्वरों के नाम समय से: {{ह्रस्वः}} एक मात्रा, {{दीर्घः}} दो, {{प्लुतः}} तीन।'
    sutras:
    - 1.2.27
    taught_in: vowels.short#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Pāṇini names vowels by how long they last. In sūtra 1.2.27 a vowel lasting as long as {{उ}} is {{ह्रस्वः}}, short;
          as long as {{ऊ}}, {{दीर्घः}}, long; held for three beats, {{प्लुतः}}. All five vowels of the leaf's first two groups
          are {{ह्रस्वः}}.
        hi: पाणिनि स्वरों का नाम उनकी अवधि से रखते हैं। सूत्र 1.2.27 के अनुसार जो स्वर {{उ}} जितना समय ले वह {{ह्रस्वः}} है,
          जो {{ऊ}} जितना ले वह {{दीर्घः}}, और जो तीन मात्रा तक खिंचे वह {{प्लुतः}}। पत्र के पहले दो समूहों के पाँचों स्वर
          {{ह्रस्वः}} हैं।
      items:
      - id: i0
        sa: उ
      - id: i1
        sa: ह्रस्वः
      - id: i2
        sa: ऊ
      - id: i3
        sa: दीर्घः
      - id: i4
        sa: प्लुतः
  - skill: script.vowel.long
    rule:
      en: '{{सवर्ण}}: one place, one effort. A short vowel and its long twin are {{सवर्ण}}.'
      hi: '{{सवर्ण}}: एक स्थान, एक प्रयत्न। ह्रस्व स्वर और उसका दीर्घ जुड़वाँ सवर्ण हैं।'
    sutras:
    - 1.1.9
    taught_in: vowels.long#pn
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 1.1.9 calls sounds made at one place with one effort {{सवर्ण}}, “of one kind”: {{इ}} and {{ई}} are {{सवर्ण}}.
          By sūtra 1.1.69 a short vowel in a rule stands for its twins too. So the leaf, like Pāṇini''s list, writes only
          {{अ}} {{इ}} {{उ}}, never {{आ}} {{ई}} {{ऊ}}.'
        hi: 'सूत्र 1.1.9 एक ही स्थान और एक ही प्रयत्न से बनी ध्वनियों को {{सवर्ण}} कहता है: {{इ}} और {{ई}} सवर्ण हैं। सूत्र
          1.1.69 के अनुसार नियम में लिखा ह्रस्व स्वर अपने सवर्णों का भी बोध कराता है। इसीलिए पत्र, पाणिनि की सूची की तरह,
          केवल {{अ}} {{इ}} {{उ}} लिखता है, {{आ}} {{ई}} {{ऊ}} कभी नहीं।'
      items:
      - id: i0
        sa: सवर्ण
      - id: i1
        sa: इ
      - id: i2
        sa: ई
      - id: i3
        sa: अ
      - id: i4
        sa: उ
      - id: i5
        sa: आ
      - id: i6
        sa: ऊ
  - skill: script.vowel.long
    rule:
      en: In a rule, a vowel letter stands for its twins too; so the Śiva sūtras list only {{अ}} {{इ}} {{उ}}.
      hi: नियम में लिखा स्वर अपने सवर्णों का भी बोध कराता है; इसीलिए शिवसूत्रों में केवल {{अ}} {{इ}} {{उ}} हैं।
    sutras:
    - 1.1.69
    taught_in: vowels.long#pn
    visuals:
    - id: v-linked-2
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 1.1.9 calls sounds made at one place with one effort {{सवर्ण}}, “of one kind”: {{इ}} and {{ई}} are {{सवर्ण}}.
          By sūtra 1.1.69 a short vowel in a rule stands for its twins too. So the leaf, like Pāṇini''s list, writes only
          {{अ}} {{इ}} {{उ}}, never {{आ}} {{ई}} {{ऊ}}.'
        hi: 'सूत्र 1.1.9 एक ही स्थान और एक ही प्रयत्न से बनी ध्वनियों को {{सवर्ण}} कहता है: {{इ}} और {{ई}} सवर्ण हैं। सूत्र
          1.1.69 के अनुसार नियम में लिखा ह्रस्व स्वर अपने सवर्णों का भी बोध कराता है। इसीलिए पत्र, पाणिनि की सूची की तरह,
          केवल {{अ}} {{इ}} {{उ}} लिखता है, {{आ}} {{ई}} {{ऊ}} कभी नहीं।'
      items:
      - id: i0
        sa: सवर्ण
      - id: i1
        sa: इ
      - id: i2
        sa: ई
      - id: i3
        sa: अ
      - id: i4
        sa: उ
      - id: i5

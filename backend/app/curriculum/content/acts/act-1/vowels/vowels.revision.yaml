            blue water occupies the upper third. No people, boats, buildings or letters. Emphasize the river BANK, not the
            whole river.'
          alt:
            en: The grassy bank beside a river
            hi: नदी के पास घास वाला तट
          ratio: '1:1'
          text_in_image: []
  - skill: script.vowel.compound
    formula: अ + इ → ए · अ + उ → ओ
    rule:
      en: '{{ए}} and {{ओ}}: two sounds fused into one.'
      hi: '{{ए}} और {{ओ}}: दो ध्वनियाँ एक में जुड़ीं।'
    sutras:
    - SS.3
    taught_in: vowels.compound#t1
    visuals:
    - id: v-linked-4
      kind: comparison
      title:
        en: Compare the examples
        hi: उदाहरणों की तुलना करें
      explanation:
        en: 'When {{अ}} meets {{इ}}, they press into one smooth sound, {{ए}}: e as in “they”. {{अ}} with {{उ}} gives {{ओ}}:
          o as in “go”. {{ऐ}} and {{औ}} glide instead: ai as in “aisle”, au as in “out”.'
        hi: 'जब {{अ}} और {{इ}} मिलते हैं, तो वे एक चिकनी ध्वनि {{ए}} बन जाते हैं। {{अ}} और {{उ}} मिलकर {{ओ}} बनते हैं। {{ऐ}}
          और {{औ}} फिसलते हुए बोले जाते हैं: ‘अ’ से ‘इ’ की ओर, और ‘अ’ से ‘उ’ की ओर।'
      items:
      - id: i0
        sa: अ + इ → ए
        meaning:
          en: e, as in “they”
          hi: ए, जैसे ‘एक’ में
      - id: i1
        sa: अ + उ → ओ
        meaning:
          en: o, as in “go”
          hi: ओ, जैसे ‘ओस’ में
      - id: i2
        sa: ऐ
        meaning:
          en: ai, a glide, as in “aisle”
          hi: ऐ, ‘अ’ से ‘इ’ की ओर फिसलता
      - id: i3
        sa: औ
        meaning:
          en: au, a glide, as in “out”
          hi: औ, ‘अ’ से ‘उ’ की ओर फिसलता
  - skill: script.vowel.compound
    formula: ऐ औ
    rule:
      en: '{{ऐ}} and {{औ}} glide: {{अ}} to {{इ}}, {{अ}} to {{उ}}.'
      hi: '{{ऐ}} और {{औ}} फिसलते हैं: ‘अ’ से ‘इ’, ‘अ’ से ‘उ’।'
    sutras:
    - SS.4

  - skill: script.vowel.long
    rule:
      en: Length changes the word.
      hi: लम्बाई से शब्द बदलता है।
    example:
      sa: दिनम्
      meaning:
        en: a day; {{दीनः}} is a poor person
        hi: दिन; {{दीनः}} यानी दीन व्यक्ति
      check:
        type: subanta
        stem: दिन
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Eka
    taught_in: vowels.long#t2
    visuals:

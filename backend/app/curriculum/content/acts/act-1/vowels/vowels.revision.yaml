  - skill: script.matra
    formula: ि
    rule:
      en: Written before the letter, said after it.
      hi: अक्षर से पहले लिखी जाती है, बाद में बोली जाती है।
    taught_in: vowels.signs#t3
    visuals:
    - id: v-linked-8
      kind: sequence
      title:
        en: Written position and spoken order
        hi: लिखने का स्थान और बोलने का क्रम
      items:
      - id: whole
        sa: कि
        meaning:
          en: See the sign to the left of the consonant.
          hi: व्यञ्जन के बाईं ओर मात्रा देखें।
      - id: first
        sa: क्
        meaning:
          en: Say the consonant first.
          hi: पहले व्यञ्जन बोलें।
      - id: next
        sa: इ
        meaning:
          en: Say its vowel next.
          hi: फिर उसका स्वर बोलें।
      - id: blend
        sa: कि
        meaning:
          en: Blend them into one syllable.
          hi: दोनों को मिलाकर एक अक्षर बोलें।
- id: conditions
  kind: revision
  section: conditions
  title:
    en: Letter or sign?
    hi: अक्षर या मात्रा?
  rows:
  - skill: script.matra
    rule:
      en: A vowel is written as its full letter at the start of a word; inside a word, as a sign on the letter before it.
      hi: शब्द के आरम्भ में स्वर अपना पूरा अक्षर बनकर लिखा जाता है; शब्द के भीतर पहले वाले अक्षर पर मात्रा बनकर।
    new_here: true
    example:
      sa: इति
      meaning:
        en: '“thus”: the first i is the letter {{इ}}, the second is the sign on {{त}}'
        hi: '‘इस प्रकार’: पहला इ पूरा अक्षर {{इ}} है, दूसरा {{त}} पर मात्रा'
    visuals:
    - id: v-source-new-0
      kind: worked
      title:
        en: Read, examine, understand
        hi: पढ़ें, समझें, फिर पढ़ें
      items:
      - id: i0
        sa: इति
        label:
          en: Read the whole example
          hi: पूरा उदाहरण पढ़ें
        meaning:
          en: '“thus”: the first i is the letter {{इ}}, the second is the sign on {{त}}'
          hi: '‘इस प्रकार’: पहला इ पूरा अक्षर {{इ}} है, दूसरा {{त}} पर मात्रा'
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: A vowel is written as its full letter at the start of a word; inside a word, as a sign on the letter before
            it.
          hi: शब्द के आरम्भ में स्वर अपना पूरा अक्षर बनकर लिखा जाता है; शब्द के भीतर पहले वाले अक्षर पर मात्रा बनकर।
      - id: i3
        sa: इति
        label:
          en: Read it again with the meaning
          hi: अर्थ समझकर फिर पढ़ें
        meaning:
          en: '“thus”: the first i is the letter {{इ}}, the second is the sign on {{त}}'
          hi: '‘इस प्रकार’: पहला इ पूरा अक्षर {{इ}} है, दूसरा {{त}} पर मात्रा'

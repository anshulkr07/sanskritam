  - skill: script.vowel.short
    formula: ऋ ऌ
    rule:
      en: '{{ऋ}} and {{ऌ}} are vowels: r and l that carry the syllable.'
      hi: '{{ऋ}} और {{ऌ}} स्वर हैं: ‘र’ और ‘ल’ जो स्वयं अक्षर बनते हैं।'

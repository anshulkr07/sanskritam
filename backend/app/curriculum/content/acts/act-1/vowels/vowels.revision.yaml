          o as in “go”. {{ऐ}} and {{औ}} glide instead: ai as in “aisle”, au as in “out”.'
        hi: 'जब {{अ}} और {{इ}} मिलते हैं, तो वे एक चिकनी ध्वनि {{ए}} बन जाते हैं। {{अ}} और {{उ}} मिलकर {{ओ}} बनते हैं। {{ऐ}}
          और {{औ}} फिसलते हुए बोले जाते हैं: ‘अ’ से ‘इ’ की ओर, और ‘अ’ से ‘उ’ की ओर।'
      items:
      - id: i0
        sa: अ + इ → ए
        meaning:
          en: e, as in “they”
          hi: ए, जैसे ‘एक’ में
      - id: i1
        sa: अ + उ → ओ
        meaning:
          en: o, as in “go”
          hi: ओ, जैसे ‘ओस’ में
      - id: i2
        sa: ऐ
        meaning:
          en: ai, a glide, as in “aisle”
          hi: ऐ, ‘अ’ से ‘इ’ की ओर फिसलता
      - id: i3
        sa: औ
        meaning:
          en: au, a glide, as in “out”
          hi: औ, ‘अ’ से ‘उ’ की ओर फिसलता
  - skill: script.vowel.compound
    rule:
      en: All four joined vowels are always long.
      hi: चारों संयुक्त स्वर सदा दीर्घ हैं।
    example:
      sa: लोकः
      meaning:
        en: 'a world: a long o'
        hi: 'लोक: दीर्घ ओ'
      check:

        en: The first two sūtras of the Aṣṭādhyāyī name vowels you now know. {{आ}} {{ऐ}} {{औ}} are {{वृद्धि}} (1.1.1); {{अ}}
          {{ए}} {{ओ}} are {{गुण}} (1.1.2). Many later rules say “becomes guṇa” or “becomes vṛddhi”, and when words join you
          will watch these vowels appear.
        hi: अष्टाध्यायी के पहले दो सूत्र उन्हीं स्वरों को नाम देते हैं जिन्हें आप अब जानते हैं। {{आ}} {{ऐ}} {{औ}} {{वृद्धि}}
          हैं (1.1.1); {{अ}} {{ए}} {{ओ}} {{गुण}} हैं (1.1.2)। आगे के बहुत-से नियम कहते हैं “गुण होता है” या “वृद्धि होती है”,

- id: s1
  kind: story
  title:
    en: Two shapes pressed together
    hi: आपस में दबी दो आकृतियाँ
  image:
    id: vowels-compound-end
    brief: 'The far end of the glowing palm leaf: Dhūmaka, now a brighter silvery grey, hovers over the last two letter groups
      ए ओ and ऐ औ, which glow faintly; Dādī''s hand points at them with a reed pen; warm lamplight.'
    alt:
      en: A small bright ghost hovers over the last two groups of letters on a glowing leaf
      hi: चमकते पत्र के आख़िरी दो अक्षर-समूहों पर मँडराता नन्हा चमकीला भूत
    text_in_image:
    - ए ओ
    - ऐ औ
    ratio: '4:3'
    cast:
    - dhumaka
    - dadi
    place: granthalaya
  narration:
    en: Dhūmaka is brighter now. He drifts to the end of the line, where the last two groups wait. Each letter looks like
      two shapes pressed together. Dādī taps them with her pen. “The joined vowels. Each one began as two sounds.”
    hi: धूमक अब पहले से ज़्यादा चमकीला है। वह पंक्ति के अन्त की ओर तैर जाता है, जहाँ आख़िरी दो समूह प्रतीक्षा कर रहे हैं।
      हर अक्षर ऐसा लगता है मानो दो आकृतियाँ आपस में दबा दी गई हों। दादी कलम से उन्हें छूती हैं, “ये संयुक्त स्वर हैं। हर एक
      की शुरुआत दो ध्वनियों से हुई थी।”
- id: t1
  kind: teach
  title:
    en: Two sounds in one
    hi: एक में दो ध्वनियाँ
  skills:
  - script.vowel.compound
  sutras:
  - SS.3
  - SS.4
  body:
    en: 'When {{अ}} meets {{इ}}, they press into one smooth sound, {{ए}}: e as in “they”. {{अ}} with {{उ}} gives {{ओ}}: o
      as in “go”. {{ऐ}} and {{औ}} glide instead: ai as in “aisle”, au as in “out”.'
    hi: 'जब {{अ}} और {{इ}} मिलते हैं, तो वे एक चिकनी ध्वनि {{ए}} बन जाते हैं। {{अ}} और {{उ}} मिलकर {{ओ}} बनते हैं। {{ऐ}} और
      {{औ}} फिसलते हुए बोले जाते हैं: ‘अ’ से ‘इ’ की ओर, और ‘अ’ से ‘उ’ की ओर।'
  rows:
  - sa: अ + इ → ए
    gloss:
      en: e, as in “they”
      hi: ए, जैसे ‘एक’ में
  - sa: अ + उ → ओ
    gloss:
      en: o, as in “go”
      hi: ओ, जैसे ‘ओस’ में
  - sa: ऐ
    gloss:
      en: ai, a glide, as in “aisle”
      hi: ऐ, ‘अ’ से ‘इ’ की ओर फिसलता
  - sa: औ
    gloss:
      en: au, a glide, as in “out”
      hi: औ, ‘अ’ से ‘उ’ की ओर फिसलता
  visuals:

- id: t2
  kind: teach
  title:
    en: Always two beats
    hi: सदा दो मात्राएँ
  skills:
  - script.vowel.compound
  body:
    en: Sanskrit has no short {{ए}} or {{ओ}}. All four joined vowels last two beats, like {{आ}}. So {{देवः}}, a god, has a
      long e, and {{लोकः}}, a world, a long o. Never clip them.
    hi: संस्कृत में ह्रस्व {{ए}} या {{ओ}} होता ही नहीं। चारों संयुक्त स्वर {{आ}} की तरह दो मात्रा के होते हैं। इसलिए {{देवः}}
      (देवता) में ए दीर्घ है, और {{लोकः}} (संसार) में ओ। इन्हें कभी छोटा मत कीजिए।
  examples:
  - sa: देवः
    meaning:
      en: a god
      hi: देवता
    check:
      type: subanta
      stem: देव
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: लोकः
    meaning:
      en: a world
      hi: लोक, संसार
    check:
      type: subanta
      stem: लोक
      linga: Pum
      vibhakti: Prathama
      vacana: Eka

- id: p3
  kind: practice
  mode: order
  title:
    en: The line made whole
    hi: पूरी हुई पंक्ति
  skills:
  - script.vowel.compound
  sutras:
  - SS.3
  - SS.4
  roman: after
  gate: true
  prompt:
    en: The fire scattered the last two groups. Put them back in the leaf's order.
    hi: आग ने आख़िरी दो समूह बिखेर दिए हैं। उन्हें पत्र के क्रम में फिर से लगाइए।
  tokens:
  - ए
  - ओ
  - ऐ
  - औ
  explain:
    en: 'The third group is {{ए}} {{ओ}}, the fourth {{ऐ}} {{औ}}: first the fused pair, then the gliding pair.'
    hi: 'तीसरा समूह {{ए}} {{ओ}} है, चौथा {{ऐ}} {{औ}}: पहले जुड़ी हुई जोड़ी, फिर फिसलने वाली।'
  story:
    success:
      en: 'The whole first line glows from end to end. Dhūmaka opens his mouth and, faintly, says it with you: “अ इ उ ऋ ऌ
        ए ओ ऐ औ.” His voice is coming back.'
      hi: 'पूरी पहली पंक्ति शुरू से अन्त तक चमक उठती है। धूमक मुँह खोलता है और धीमे से आपके साथ बोलता है: “अ इ उ ऋ ऌ ए ओ ऐ
        औ।” उसकी आवाज़ लौट रही है।'
    failure:
      en: 'Two letters flare and fade. Dhūmaka shakes his smoky head: the fused pair comes first.'
      hi: 'दो अक्षर चमककर बुझ जाते हैं। धूमक अपना धुएँ-सा सिर हिलाता है: पहले जुड़ी हुई जोड़ी आती है।'
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'When {{अ}} meets {{इ}}, they press into one smooth sound, {{ए}}: e as in “they”. {{अ}} with {{उ}} gives {{ओ}}:
        o as in “go”. {{ऐ}} and {{औ}} glide instead: ai as in “aisle”, au as in “out”.'
      hi: 'जब {{अ}} और {{इ}} मिलते हैं, तो वे एक चिकनी ध्वनि {{ए}} बन जाते हैं। {{अ}} और {{उ}} मिलकर {{ओ}} बनते हैं। {{ऐ}}
        और {{औ}} फिसलते हुए बोले जाते हैं: ‘अ’ से ‘इ’ की ओर, और ‘अ’ से ‘उ’ की ओर।'
    items:
    - id: i0
      sa: अ + इ → ए
      meaning:
        en: e, as in “they”
        hi: ए, जैसे ‘एक’ में
    - id: i1
      sa: अ + उ → ओ
      meaning:
        en: o, as in “go”
        hi: ओ, जैसे ‘ओस’ में
    - id: i2
      sa: ऐ
      meaning:
        en: ai, a glide, as in “aisle”
        hi: ऐ, ‘अ’ से ‘इ’ की ओर फिसलता
    - id: i3
      sa: औ
      meaning:
        en: au, a glide, as in “out”
        hi: औ, ‘अ’ से ‘उ’ की ओर फिसलता

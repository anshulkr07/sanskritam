        hi: 'प्रातिपदिक: {{तैल}} · {{नपुंसकलिंग}} · {{प्रथमा}} · {{एकवचन}}'
      compare_from: तैल
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'In Hindi, {{ऐ}} and {{औ}} are often said flat, as in है and और. In Sanskrit they glide: start at {{अ}} and slide
          to {{इ}} or {{उ}}, in one syllable. Dādī fills the lamp with {{तैलम्}}, oil: “tai-lam”, as in “aisle”. A cow is
          {{गौः}}: “gau”, as in “now”.'
        hi: 'हिन्दी में {{ऐ}} और {{औ}} अक्सर सपाट बोले जाते हैं, जैसे ‘है’ और ‘और’ में। संस्कृत में ये फिसलते हैं: ‘अ’ से
          शुरू होकर ‘इ’ या ‘उ’ तक, एक ही अक्षर में। दादी दीपक में {{तैलम्}} (तेल) भरती हैं: ‘तइ-लम्’ जैसा। गाय है {{गौः}}:
          ‘गउः’ जैसा।'
    - id: i3

- id: t3
  kind: teach
  title:
    en: Let ऐ and औ glide
    hi: ऐ और औ को फिसलने दीजिए
  skills:
  - script.vowel.compound
  body:
    en: 'In Hindi, {{ऐ}} and {{औ}} are often said flat, as in है and और. In Sanskrit they glide: start at {{अ}} and slide
      to {{इ}} or {{उ}}, in one syllable. Dādī fills the lamp with {{तैलम्}}, oil: “tai-lam”, as in “aisle”. A cow is {{गौः}}:
      “gau”, as in “now”.'
    hi: 'हिन्दी में {{ऐ}} और {{औ}} अक्सर सपाट बोले जाते हैं, जैसे ‘है’ और ‘और’ में। संस्कृत में ये फिसलते हैं: ‘अ’ से शुरू
      होकर ‘इ’ या ‘उ’ तक, एक ही अक्षर में। दादी दीपक में {{तैलम्}} (तेल) भरती हैं: ‘तइ-लम्’ जैसा। गाय है {{गौः}}: ‘गउः’ जैसा।'
  examples:
  - sa: तैलम्
    meaning:
      en: oil
      hi: तेल
    check:
      type: subanta
      stem: तैल
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka
  - sa: गौः
    meaning:
      en: a cow
      hi: गाय
    check:
      type: subanta
      stem: गो
      linga: Stri
      vibhakti: Prathama
      vacana: Eka
  image:
    id: vowels-compound-lamp
    brief: Dādī carefully pours golden sesame oil from a small brass pot into the temple library's brass lamp; the flame brightens;
      Dhūmaka floats happily in the curl of smoke above it; Śuka watches from the top of a shelf.
    alt:
      en: A grandmother pours oil into a brass lamp while a small ghost floats in the smoke
      hi: दादी पीतल के दीपक में तेल डालती हैं, धुएँ में नन्हा भूत तैर रहा है
    ratio: '4:3'
    cast:
    - dadi
    - dhumaka
    - shuka
    place: granthalaya

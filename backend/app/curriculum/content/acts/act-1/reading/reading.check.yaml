- id: p1
  kind: practice
  depth: core
  skills:
  - read.syllables
  mode: choice
  prompt:
    en: How many syllables does {{सीता}} have?
    hi: '{{सीता}} में कितने अक्षर हैं?'
  explain:
    en: '{{सी}}-{{ता}}: two.'
    hi: '{{सी}}-{{ता}}: दो।'
  roman: show
  options:
  - text:
      en: one
      hi: एक
  - correct: true
    text:
      en: two
      hi: दो
  - text:
      en: three
      hi: तीन
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'A syllable, an {{अक्षरम्}}, has exactly one vowel, with the consonants that go with it. Count the vowels and you
        have counted the syllables: {{रा}}-{{मः}} has two.'
      hi: 'अक्षर में ठीक एक स्वर होता है, और उसके साथ के व्यंजन। स्वर गिन लीजिए तो अक्षर गिन लिए: {{रा}}-{{मः}} में दो अक्षर
        हैं।'
    items:
    - id: i0
      sa: रामः
      meaning:
        en: '{{रा}} {{मः}}: 2'
        hi: '{{रा}} {{मः}}: 2 अक्षर'
    - id: i1
      sa: सीता
      meaning:
        en: '{{सी}} {{ता}}: 2'
        hi: '{{सी}} {{ता}}: 2 अक्षर'
    - id: i2
      sa: लक्ष्मणः
      meaning:
        en: '{{लक्}} {{ष्म}} {{णः}}: 3'
        hi: '{{लक्}} {{ष्म}} {{णः}}: 3 अक्षर'

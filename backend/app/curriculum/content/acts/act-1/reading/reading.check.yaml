- id: p3
  kind: practice
  depth: core
  skills:
  - read.places
  mode: choice
  prompt:
    en: Which sound is made at the throat and the palate together?
    hi: कौन-सी ध्वनि कण्ठ और तालु दोनों से बनती है?
  explain:
    en: '{{ए}}: throat + palate.'
    hi: '{{ए}}: कण्ठ + तालु।'
  roman: after
  options:
  - correct: true
    sa: ए
  - sa: ओ
  - sa: उ
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Some sounds use two places. {{ए}} is throat + palate; {{ओ}} is throat + lips; {{व}} is teeth + lips. Each nasal
        uses the nose and its own row: {{ङ}} throat + nose, {{म}} lips + nose.'
      hi: 'कुछ ध्वनियाँ दो स्थानों का उपयोग करती हैं। {{ए}} कण्ठ + तालु है; {{ओ}} कण्ठ + ओष्ठ; {{व}} दन्त + ओष्ठ। हर नासिक्य
        नाक और अपनी पंक्ति का स्थान लेता है: {{ङ}} कण्ठ + नाक, {{म}} ओष्ठ + नाक।'
    items:
    - id: i0
      sa: ए
      meaning:
        en: throat and palate
        hi: कण्ठ और तालु
    - id: i1
      sa: ओ
      meaning:
        en: throat and lips
        hi: कण्ठ और ओष्ठ
    - id: i2
      sa: व
      meaning:
        en: teeth and lips
        hi: दन्त और ओष्ठ
    - id: i3
      sa: ङ
      meaning:
        en: throat and nose
        hi: कण्ठ और नाक

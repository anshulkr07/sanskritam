  gate: true
  story:
    success:
      en: '“मौनी अस्मि। वदामि!” The pale-gold spirit''s voice rings out, and he laughs, lighter than before. He points to
        the glowing leaf, then out of the window to the river: “द्वितीयं पत्रं नद्याः तीरे अस्ति।” In the doorway, the tall
        man in the dark coat steps back into the shadows.'
      hi: '“मौनी अस्मि। वदामि!” सुनहरे भूत की आवाज़ गूँजती है, और वह पहले से हल्का होकर हँस पड़ता है। वह चमकते पत्र की ओर,
        फिर खिड़की से नदी की ओर इशारा करता है: “द्वितीयं पत्रं नद्याः तीरे अस्ति।” द्वार पर गहरे कोट वाला लम्बा आदमी परछाईं
        में लौट जाता है।'
    failure:
      en: 'The name will not hold. Two syllables: {{मौ}}, then {{नी}}.'
      hi: 'नाम नहीं टिकता। दो अक्षर: {{मौ}}, फिर {{नी}}।'
  tokens:

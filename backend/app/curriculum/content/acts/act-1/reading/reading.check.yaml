- id: p5
  kind: practice
  depth: core
  skills:
  - read.iast
  mode: choice
  prompt:
    en: Which letter is ṣ?
    hi: कौन-सा अक्षर ṣ है?
  explain:
    en: '{{ष}} is ṣ, the curled-tongue hiss.'
    hi: '{{ष}} यानी ṣ, मुड़ी जीभ की फुफकार।'
  roman: after
  options:
  - sa: श
  - correct: true
    sa: ष
  - sa: स
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'In IAST every sign stands for exactly one Devanagari sound. A bar means long: {{आ}} is ā. A dot below means retroflex:
        {{ट}} is ṭ. {{श}} is ś, {{ष}} is ṣ, {{ङ}} is ṅ, {{ञ}} is ñ.'
      hi: 'IAST में हर चिह्न देवनागरी की ठीक एक ध्वनि के लिए है। ऊपर की रेखा का अर्थ दीर्घ: {{आ}} यानी ā। नीचे का बिन्दु मूर्धन्य
        दिखाता है: {{ट}} यानी ṭ। {{श}} यानी ś, {{ष}} यानी ṣ, {{ङ}} यानी ṅ, {{ञ}} यानी ñ।'
    items:
    - id: i0
      sa: आ
    - id: i1
      sa: ट
    - id: i2
      sa: श
    - id: i3
      sa: ष
    - id: i4
      sa: ङ
    - id: i5
      sa: ञ

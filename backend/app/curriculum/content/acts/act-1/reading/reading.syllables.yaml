- id: t2
  kind: teach
  title:
    en: Joined letters count once
    hi: संयुक्ताक्षर एक बार गिने जाते हैं
  depth: core
  skills:
  - read.syllables
  body:
    en: 'A joined letter has no vowel inside it, so it adds no syllable. {{सत्यम्}} has two vowels, two syllables: {{सत्}}-{{यम्}}.'
    hi: 'संयुक्ताक्षर के भीतर स्वर नहीं होता, इसलिए वह अक्षर नहीं बढ़ाता। {{सत्यम्}} में दो स्वर हैं, दो अक्षर: {{सत्}}-{{यम्}}।'
  examples:
  - sa: सत्यम्
    meaning:
      en: 'truth: two syllables'
      hi: 'सत्य: दो अक्षर'
    check:
      type: subanta
      stem: सत्य
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka
  - sa: लक्ष्मणः
    meaning:
      en: 'Lakṣmaṇa: three syllables'
      hi: 'लक्ष्मण: तीन अक्षर'
    check:
      type: subanta
      stem: लक्ष्मण
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  visuals:

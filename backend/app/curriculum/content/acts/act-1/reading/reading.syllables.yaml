cards:
- id: s1
  kind: story
  title:
    en: The old register
    hi: पुराना रजिस्टर
  depth: core
  image:
    brief: 'The temple library: Dādī lowers a huge cloth-bound register onto the low reading desk; between the shelves a tall
      thin pale-gold spirit stands with one finger to his lips and a scroll under his arm; you and Śuka watching.'
    alt:
      en: A grandmother lowers a huge register while a tall pale-gold spirit stands with a finger to his lips
      hi: विशाल रजिस्टर उतारती दादी और होंठों पर उँगली रखे सुनहरा भूत
    cast:
    - you
    - dadi
    - shuka
    - mauni
    place: granthalaya
    ratio: '4:3'
    id: reading-syllables-s1
    text_in_image:
    - मौनी
  narration:
    en: 'Back in the temple library, Dādī lifts down a huge cloth-bound register: names, names, names, in columns. Nidrālu''s
      carved clue brought you here. Between the shelves stands a tall, thin, pale-gold spirit with a finger pressed to his
      lips. He cannot say a word.'
    hi: 'मंदिर के ग्रंथालय में दादी कपड़े में बँधा एक विशाल रजिस्टर उतारती हैं: नाम, नाम, नाम, स्तम्भों में। निद्रालु का खुदा
      संकेत आपको यहीं लाया। अलमारियों के बीच एक लम्बा, दुबला, हल्का सुनहरा भूत खड़ा है, उँगली होंठों पर रखे। वह एक शब्द नहीं
      बोल पाता।'
  lines:
  - speaker: dadi
    sa: पश्य। मौनी।
    gloss:
      en: Look. Maunī, the silent one.
      hi: देखो। मौनी, चुप रहने वाला।
- id: t1
  kind: teach
  title:
    en: Count the vowels
    hi: स्वर गिनिए
  depth: core
  skills:
  - read.syllables
  body:
    en: 'A syllable, an {{अक्षरम्}}, has exactly one vowel, with the consonants that go with it. Count the vowels and you
      have counted the syllables: {{रा}}-{{मः}} has two.'
    hi: 'अक्षर में ठीक एक स्वर होता है, और उसके साथ के व्यंजन। स्वर गिन लीजिए तो अक्षर गिन लिए: {{रा}}-{{मः}} में दो अक्षर
      हैं।'
  rows:
  - sa: रामः
    gloss:
      en: '{{रा}} {{मः}}: 2'
      hi: '{{रा}} {{मः}}: 2 अक्षर'
  - sa: सीता
    gloss:
      en: '{{सी}} {{ता}}: 2'
      hi: '{{सी}} {{ता}}: 2 अक्षर'
  - sa: लक्ष्मणः
    gloss:
      en: '{{लक्}} {{ष्म}} {{णः}}: 3'
      hi: '{{लक्}} {{ष्म}} {{णः}}: 3 अक्षर'
  term:
    sa: अक्षरम्
    meaning:
      en: 'a syllable (also: a letter)'
      hi: अक्षर (वर्ण भी)
  visuals:
  - id: v-source-compare
    kind: comparison
    title:
      en: Compare the examples
      hi: उदाहरणों की तुलना करें
    explanation:
      en: 'A syllable, an {{अक्षरम्}}, has exactly one vowel, with the consonants that go with it. Count the vowels and you
        have counted the syllables: {{रा}}-{{मः}} has two.'
      hi: 'अक्षर में ठीक एक स्वर होता है, और उसके साथ के व्यंजन। स्वर गिन लीजिए तो अक्षर गिन लिए: {{रा}}-{{मः}} में दो अक्षर
        हैं।'
    items:
    - id: i0
      sa: रामः
      meaning:
        en: '{{रा}} {{मः}}: 2'
        hi: '{{रा}} {{मः}}: 2 अक्षर'
    - id: i1
      sa: सीता
      meaning:
        en: '{{सी}} {{ता}}: 2'
        hi: '{{सी}} {{ता}}: 2 अक्षर'
    - id: i2
      sa: लक्ष्मणः
      meaning:
        en: '{{लक्}} {{ष्म}} {{णः}}: 3'
        hi: '{{लक्}} {{ष्म}} {{णः}}: 3 अक्षर'

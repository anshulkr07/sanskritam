title:
  en: Everything about reading words
  hi: शब्द पढ़ने के बारे में सब कुछ
title_sa: पठनसङ्ग्रहः
minutes: 5
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: core
  kind: revision
  title:
    en: The rules
    hi: नियम
  depth: core
  section: core
  rows:
  - skill: read.syllables
    formula: रा-मः
    rule:
      en: A syllable has exactly one vowel; count the vowels to count the syllables.
      hi: अक्षर में ठीक एक स्वर होता है; अक्षर गिनने के लिए स्वर गिनिए।
    tag: core
    taught_in: reading.syllables#t1
  - skill: read.syllables
    formula: सत्-यम्
    rule:
      en: A joined letter holds no vowel, so it adds no syllable.
      hi: संयुक्ताक्षर में स्वर नहीं होता, इसलिए वह अक्षर नहीं बढ़ाता।
    tag: core
    taught_in: reading.syllables#t2
  - skill: read.places
    rule:
      en: Every sound has a place (throat, palate, roof, teeth, lips, nose) and an effort (open, almost touching, touching
        lightly, touching fully).
      hi: हर ध्वनि का एक स्थान (कण्ठ, तालु, मूर्धा, दन्त, ओष्ठ, नासिका) और एक प्रयत्न (खुला, लगभग छूता, हल्का छूता, पूरा छूता)
        है।
    tag: core
    taught_in: reading.mouth#t1
  - skill: read.places
    rule:
      en: '{{ए}} {{ऐ}} use throat + palate; {{ओ}} {{औ}} throat + lips; {{व}} teeth + lips; nasals add the nose.'
      hi: '{{ए}} {{ऐ}} कण्ठ + तालु; {{ओ}} {{औ}} कण्ठ + ओष्ठ; {{व}} दन्त + ओष्ठ; नासिक्य नाक जोड़ते हैं।'
    tag: core
    taught_in: reading.mouth#t2
  - skill: read.iast
    formula: ā ṭ ś ṣ ṃ ḥ
    rule:
      en: 'IAST: one Roman sign for each Devanagari sound; a bar for long, a dot below for retroflex.'
      hi: 'IAST: हर देवनागरी ध्वनि के लिए एक रोमन चिह्न; रेखा दीर्घ के लिए, नीचे बिन्दु मूर्धन्य के लिए।'
    tag: core
    taught_in: reading.iast#t1
  - skill: read.words
    rule:
      en: Read a word by syllables, check each sound's place, then say it smoothly.
      hi: शब्द को अक्षरों में पढ़िए, हर ध्वनि का स्थान जाँचिए, फिर प्रवाह से बोलिए।
    tag: core
    taught_in: reading.names#t1
- id: conditions
  kind: revision
  title:
    en: Where it matters
    hi: कहाँ महत्त्व है
  depth: core
  section: conditions
  rows:
  - skill: read.syllables
    rule:
      en: The last syllable of a word can end in a consonant with the stroke ({{जगत्}}), the hum ({{संस्कृतम्}}) or the breath
        ({{रामः}}); the vowel before it still counts as one syllable.
      hi: शब्द का अन्तिम अक्षर रेखा वाले व्यंजन ({{जगत्}}), गूँज ({{संस्कृतम्}}) या साँस ({{रामः}}) पर समाप्त हो सकता है;
        उससे पहले का स्वर फिर भी एक अक्षर है।
    example:
      sa: जगत्
      meaning:
        en: 'the world: two syllables, ja-gat'
        hi: 'संसार: दो अक्षर, ज-गत्'
    tag: good
    new_here: true
    visuals:
    - id: v-source-new-0
      kind: worked
      title:
        en: Read, examine, understand
        hi: पढ़ें, समझें, फिर पढ़ें
      items:
      - id: i0
        sa: जगत्
        label:
          en: Read the whole example
          hi: पूरा उदाहरण पढ़ें
        meaning:
          en: 'the world: two syllables, ja-gat'
          hi: 'संसार: दो अक्षर, ज-गत्'
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: The last syllable of a word can end in a consonant with the stroke ({{जगत्}}), the hum ({{संस्कृतम्}}) or the
            breath ({{रामः}}); the vowel before it still counts as one syllable.
          hi: शब्द का अन्तिम अक्षर रेखा वाले व्यंजन ({{जगत्}}), गूँज ({{संस्कृतम्}}) या साँस ({{रामः}}) पर समाप्त हो सकता
            है; उससे पहले का स्वर फिर भी एक अक्षर है।
      - id: i3
        sa: जगत्
        label:
          en: Read it again with the meaning
          hi: अर्थ समझकर फिर पढ़ें
        meaning:
          en: 'the world: two syllables, ja-gat'
          hi: 'संसार: दो अक्षर, ज-गत्'
- id: exceptions
  kind: revision
  title:
    en: Odd cases
    hi: विचित्र स्थितियाँ
  depth: core
  section: exceptions
  rows:
  - skill: read.iast
    rule:
      en: Older books write ṃ as ṁ, and some print {{ऋ}} as ri. IAST itself keeps ṃ and ṛ.
      hi: पुरानी पुस्तकें ṃ को ṁ लिखती हैं, और कुछ {{ऋ}} को ri छापती हैं। IAST स्वयं ṃ और ṛ रखता है।
    example:
      sa: कृष्णः
      meaning:
        en: Kṛṣṇa, not Krishna
        hi: रोमन अक्षरों में इसे सही ढंग से Kṛṣṇa लिखा जाता है
    tag: rare
    new_here: true
    visuals:

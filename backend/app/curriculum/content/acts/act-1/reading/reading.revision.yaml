        compare_from: सत्य
  - skill: read.places
    rule:
      en: Every sound has a place (throat, palate, roof, teeth, lips, nose) and an effort (open, almost touching, touching
        lightly, touching fully).
      hi: हर ध्वनि का एक स्थान (कण्ठ, तालु, मूर्धा, दन्त, ओष्ठ, नासिका) और एक प्रयत्न (खुला, लगभग छूता, हल्का छूता, पूरा छूता)
        है।
    tag: core
    taught_in: reading.mouth#t1
    visuals:
    - id: v-linked-2
      kind: comparison
      title:
        en: Place and effort
        hi: स्थान और प्रयत्न
      items:
      - id: i0
        sa: प्रयत्नः
        meaning:
          en: 'effort: how closely the mouth works'
          hi: 'प्रयत्न: मुँह कितना पास आता है'
      - id: explanation
        meaning:
          en: Every sound has a place, where the tongue or lips work, and an effort, how closely they work. Vowels leave the
            mouth open. Semivowels barely touch. Hisses almost touch. The five rows touch fully.
          hi: हर ध्वनि का एक स्थान होता है, जहाँ जीभ या होंठ काम करते हैं, और एक प्रयत्न, यानी वे कितना पास आते हैं। स्वर
            मुँह खुला रखते हैं। अन्तःस्थ बस छूते हैं। ऊष्म लगभग छूते हैं। पाँच वर्ग पूरी तरह छूते हैं।
  - skill: read.places
    rule:
      en: '{{ए}} {{ऐ}} use throat + palate; {{ओ}} {{औ}} throat + lips; {{व}} teeth + lips; nasals add the nose.'
      hi: '{{ए}} {{ऐ}} कण्ठ + तालु; {{ओ}} {{औ}} कण्ठ + ओष्ठ; {{व}} दन्त + ओष्ठ; नासिक्य नाक जोड़ते हैं।'
    tag: core
    taught_in: reading.mouth#t2
    visuals:
    - id: v-linked-3
      kind: comparison
      title:
        en: Compare the examples
        hi: उदाहरणों की तुलना करें
      explanation:
        en: 'Some sounds use two places. {{ए}} is throat + palate; {{ओ}} is throat + lips; {{व}} is teeth + lips. Each nasal
          uses the nose and its own row: {{ङ}} throat + nose, {{म}} lips + nose.'
        hi: 'कुछ ध्वनियाँ दो स्थानों का उपयोग करती हैं। {{ए}} कण्ठ + तालु है; {{ओ}} कण्ठ + ओष्ठ; {{व}} दन्त + ओष्ठ। हर नासिक्य
          नाक और अपनी पंक्ति का स्थान लेता है: {{ङ}} कण्ठ + नाक, {{म}} ओष्ठ + नाक।'
      items:
      - id: i0
        sa: ए
        meaning:
          en: throat and palate
          hi: कण्ठ और तालु
      - id: i1
        sa: ओ
        meaning:
          en: throat and lips
          hi: कण्ठ और ओष्ठ
      - id: i2
        sa: व
        meaning:
          en: teeth and lips
          hi: दन्त और ओष्ठ
      - id: i3
        sa: ङ
        meaning:
          en: throat and nose
          hi: कण्ठ और नाक
  - skill: read.iast
    formula: ā ṭ ś ṣ ṃ ḥ
    rule:
      en: 'IAST: one Roman sign for each Devanagari sound; a bar for long, a dot below for retroflex.'
      hi: 'IAST: हर देवनागरी ध्वनि के लिए एक रोमन चिह्न; रेखा दीर्घ के लिए, नीचे बिन्दु मूर्धन्य के लिए।'
    tag: core
    taught_in: reading.iast#t1
    visuals:
    - id: v-linked-4
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'In IAST every sign stands for exactly one Devanagari sound. A bar means long: {{आ}} is ā. A dot below means retroflex:
          {{ट}} is ṭ. {{श}} is ś, {{ष}} is ṣ, {{ङ}} is ṅ, {{ञ}} is ñ.'
        hi: 'IAST में हर चिह्न देवनागरी की ठीक एक ध्वनि के लिए है। ऊपर की रेखा का अर्थ दीर्घ: {{आ}} यानी ā। नीचे का बिन्दु
          मूर्धन्य दिखाता है: {{ट}} यानी ṭ। {{श}} यानी ś, {{ष}} यानी ṣ, {{ङ}} यानी ṅ, {{ञ}} यानी ñ।'
      items:
      - id: i0
        sa: आ
      - id: i1
        sa: ट
      - id: i2
        sa: श
      - id: i3
        sa: ष
      - id: i4
        sa: ङ
      - id: i5
        sa: ञ

    formula: स्थान + प्रयत्न
    rule:
      en: '{{तुल्यास्यप्रयत्नं सवर्णम्}}: sounds with the same place and effort are of one kind.'
      hi: '{{तुल्यास्यप्रयत्नं सवर्णम्}}: जिन ध्वनियों का स्थान और प्रयत्न एक हो, वे सवर्ण हैं।'
    sutras:
    - 1.1.9
    tag: core
    taught_in: reading.mouth#pn

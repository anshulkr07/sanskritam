    hi: कहाँ महत्त्व है
  depth: core
  section: conditions
  rows:
  - skill: read.syllables
    rule:
      en: The last syllable of a word can end in a consonant with the stroke ({{जगत्}}), the hum ({{संस्कृतम्}}) or the breath
        ({{रामः}}); the vowel before it still counts as one syllable.
      hi: शब्द का अन्तिम अक्षर रेखा वाले व्यंजन ({{जगत्}}), गूँज ({{संस्कृतम्}}) या साँस ({{रामः}}) पर समाप्त हो सकता है;
        उससे पहले का स्वर फिर भी एक अक्षर है।
    example:
      sa: जगत्
      meaning:
        en: 'the world: two syllables, ja-gat'
        hi: 'संसार: दो अक्षर, ज-गत्'

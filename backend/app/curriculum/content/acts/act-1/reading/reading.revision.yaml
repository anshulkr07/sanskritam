          hi: रोमन अक्षरों में इसे सही ढंग से Kṛṣṇa लिखा जाता है
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: Older books write ṃ as ṁ, and some print {{ऋ}} as ri. IAST itself keeps ṃ and ṛ.
          hi: पुरानी पुस्तकें ṃ को ṁ लिखती हैं, और कुछ {{ऋ}} को ri छापती हैं। IAST स्वयं ṃ और ṛ रखता है।
      - id: i3
        sa: कृष्णः
        label:
          en: Read it again with the meaning
          hi: अर्थ समझकर फिर पढ़ें
        meaning:
          en: Kṛṣṇa, not Krishna
          hi: रोमन अक्षरों में इसे सही ढंग से Kṛṣṇa लिखा जाता है
  - skill: read.places
    rule:
      en: Classical teachers also list {{ह}} and the breath {{ः}} as throat sounds, and the hum as a nose sound.
      hi: शास्त्रीय शिक्षक {{ह}} और साँस {{ः}} को कण्ठ्य, तथा गूँज को नासिक्य गिनते हैं।
    tag: good
    taught_in: reading.mouth#t2
- id: mistakes
  kind: revision
  title:
    en: Common mistakes
    hi: आम भूलें
  depth: core
  section: mistakes
  rows:
  - skill: read.iast
    rule:
      en: 'Do not read Roman letters like English: ś is not s, ṭ is not t.'
      hi: 'रोमन अक्षरों को अंग्रेज़ी की तरह मत पढ़िए: ś का मतलब s नहीं, ṭ का मतलब t नहीं।'
    tag: core
    taught_in: reading.iast#t1
  - skill: read.syllables
    rule:
      en: 'Do not drop a final {{अ}} while counting: {{रामः}} has two syllables, not one.'
      hi: 'गिनते समय अन्त का {{अ}} मत छोड़िए: {{रामः}} में दो अक्षर हैं, एक नहीं।'
    tag: core
    taught_in: reading.syllables#t1
  - skill: read.words
    rule:
      en: 'Do not guess a word from its first letters: read every syllable.'
      hi: 'पहले अक्षरों से शब्द का अनुमान मत लगाइए: हर अक्षर पढ़िए।'
    tag: core
    taught_in: reading.names#t1
- id: panini
  kind: revision
  title:

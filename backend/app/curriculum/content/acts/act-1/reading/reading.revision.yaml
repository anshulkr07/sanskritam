      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 1.1.9 says sounds with the same place and the same effort are {{सवर्ण}}, of one kind: {{इ}} and {{ई}} differ
          only in length; {{क}} and {{ख}} share a place but not an effort.'
        hi: 'सूत्र 1.1.9 कहता है कि जिन ध्वनियों का स्थान और प्रयत्न एक हो, वे {{सवर्ण}} हैं: {{इ}} और {{ई}} केवल लम्बाई में
          अलग हैं; {{क}} और {{ख}} का स्थान एक है, पर प्रयत्न नहीं।'

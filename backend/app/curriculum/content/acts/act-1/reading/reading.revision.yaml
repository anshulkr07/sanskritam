  rows:
  - skill: read.syllables
    formula: रा-मः
    rule:
      en: A syllable has exactly one vowel; count the vowels to count the syllables.
      hi: अक्षर में ठीक एक स्वर होता है; अक्षर गिनने के लिए स्वर गिनिए।
    tag: core
    taught_in: reading.syllables#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Compare the examples
        hi: उदाहरणों की तुलना करें
      explanation:
        en: 'A syllable, an {{अक्षरम्}}, has exactly one vowel, with the consonants that go with it. Count the vowels and
          you have counted the syllables: {{रा}}-{{मः}} has two.'
        hi: 'अक्षर में ठीक एक स्वर होता है, और उसके साथ के व्यंजन। स्वर गिन लीजिए तो अक्षर गिन लिए: {{रा}}-{{मः}} में दो अक्षर
          हैं।'
      items:
      - id: i0
        sa: रामः
        meaning:
          en: '{{रा}} {{मः}}: 2'
          hi: '{{रा}} {{मः}}: 2 अक्षर'
      - id: i1
        sa: सीता
        meaning:
          en: '{{सी}} {{ता}}: 2'
          hi: '{{सी}} {{ता}}: 2 अक्षर'
      - id: i2
        sa: लक्ष्मणः
        meaning:
          en: '{{लक्}} {{ष्म}} {{णः}}: 3'
          hi: '{{लक्}} {{ष्म}} {{णः}}: 3 अक्षर'
  - skill: read.syllables
    formula: सत्-यम्
    rule:
      en: A joined letter holds no vowel, so it adds no syllable.
      hi: संयुक्ताक्षर में स्वर नहीं होता, इसलिए वह अक्षर नहीं बढ़ाता।
    tag: core
    taught_in: reading.syllables#t2
    visuals:
    - id: v-linked-1
      kind: worked
      title:
        en: Read, examine, understand
        hi: पढ़ें, समझें, फिर पढ़ें
      items:
      - id: i0
        sa: सत्यम्
        label:
          en: Read the whole example
          hi: पूरा उदाहरण पढ़ें
        meaning:
          en: 'truth: two syllables'
          hi: 'सत्य: दो अक्षर'
        check:
          type: subanta
          stem: सत्य
          linga: Napumsaka
          vibhakti: Prathama
          vacana: Eka
        feature:
          en: 'Stem: {{सत्य}} · neuter · {{प्रथमा}} · singular'
          hi: 'प्रातिपदिक: {{सत्य}} · {{नपुंसकलिंग}} · {{प्रथमा}} · {{एकवचन}}'
        compare_from: सत्य
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: 'A joined letter has no vowel inside it, so it adds no syllable. {{सत्यम्}} has two vowels, two syllables: {{सत्}}-{{यम्}}.'
          hi: 'संयुक्ताक्षर के भीतर स्वर नहीं होता, इसलिए वह अक्षर नहीं बढ़ाता। {{सत्यम्}} में दो स्वर हैं, दो अक्षर: {{सत्}}-{{यम्}}।'
      - id: i3
        sa: सत्यम्
        label:
          en: Read it again with the meaning
          hi: अर्थ समझकर फिर पढ़ें
        meaning:

- id: s1
  kind: story
  title:
    en: A shadow in the doorway
    hi: द्वार पर एक छाया
  depth: core
  image:
    brief: 'The temple library''s arched doorway: a tall man in an expensive dark coat over a kurta with rings on his fingers
      and a leather satchel stands half in shadow, watching the glowing leaf on the desk; in the foreground Dādī reads the
      open register to you and Maunī.'
    alt:
      en: A tall man in a dark coat watches from a library doorway as a grandmother reads a register
      hi: दरवाज़े से देखता गहरे कोट वाला आदमी, रजिस्टर पढ़ती दादी
    cast:
    - you
    - dadi
    - mauni
    - lubdhaka
    place: granthalaya
    ratio: '4:3'
    id: reading-names-s1
    text_in_image:
    - रामः
    - सीता
    - लक्ष्मणः
  narration:
    en: The register is open, names in long columns. Dādī reads the first aloud, and the second, and the third. In the arched
      doorway a tall man in a dark coat watches, rings on his fingers, a leather satchel on his shoulder. He says nothing.
      His eyes are on the glowing leaf.
    hi: रजिस्टर खुला है, लम्बे स्तम्भों में नाम। दादी पहला नाम ज़ोर से पढ़ती हैं, फिर दूसरा, फिर तीसरा। मेहराबदार द्वार पर
      गहरे कोट में एक लम्बा आदमी देख रहा है, उँगलियों में अँगूठियाँ, कंधे पर चमड़े का थैला। वह कुछ नहीं बोलता। उसकी नज़र चमकते
      पत्र पर है।
- id: t1
  kind: teach
  title:
    en: Read it whole
    hi: पूरा पढ़िए
  depth: core
  skills:
  - read.words
  body:
    en: 'To read a word aloud, split it into syllables, check each sound''s place, then say it smoothly. Try a column of names:
      {{रामः}} {{सीता}} {{लक्ष्मणः}} {{भरतः}}.'
    hi: 'शब्द ज़ोर से पढ़ने के लिए उसे अक्षरों में बाँटिए, हर ध्वनि का स्थान देखिए, फिर एक प्रवाह में बोलिए। नामों का एक स्तम्भ
      आज़माइए: {{रामः}} {{सीता}} {{लक्ष्मणः}} {{भरतः}}।'

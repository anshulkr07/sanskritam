id: reading
title:
  en: Reading words
  hi: शब्द पढ़ना
title_sa: पठनम्
status: ready
ghost: mauni
episode:
  summary:
    en: The library's old register is full of names. Maunī cannot speak until someone reads his name aloud. Reading whole words, syllable by syllable, makes the first leaf whole.
    hi: ग्रंथालय का पुराना रजिस्टर नामों से भरा है। मौनी तब तक नहीं बोल सकता जब तक कोई उसका नाम ज़ोर से न पढ़े। अक्षर-अक्षर पूरे शब्द पढ़ते ही पहला पत्र पूरा हो जाता है।
  beats:
  - Words split into syllables, each with one vowel.
  - Roman letters can help, but the leaf is read in Devanagari.
  - You read Maunī's name; he speaks and points you to the river, where the second leaf lies. Lubdhaka watches from the doorway.
skills:

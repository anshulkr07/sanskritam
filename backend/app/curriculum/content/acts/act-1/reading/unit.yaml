- id: read.iast
  title:
    en: Roman letters (IAST) as a helper
    hi: रोमन लिपि (IAST) सहायक के रूप में
- id: read.words
  title:
    en: Reading whole words aloud
    hi: पूरे शब्द ज़ोर से पढ़ना

- id: s1
  kind: story
  title:
    en: A friend from far away
    hi: दूर से आया मित्र
  depth: core
  image:
    brief: Dādī reading a letter written in Roman letters with dots and bars over them, beside the register; Śuka peering
      at it upside down; the tall silent spirit leaning in; warm lamplight.
    alt:
      en: A grandmother reads a letter in Roman letters with dots and bars while a parrot peers at it
      hi: बिन्दु और रेखा वाले रोमन अक्षरों का पत्र पढ़ती दादी
    cast:
    - you
    - dadi
    - shuka
    - mauni
    place: granthalaya
    ratio: '4:3'
    id: reading-iast-s1
    text_in_image:
    - ā ś ṣ ṭ ṃ ḥ
  narration:
    en: 'A letter arrives in the library from a friend abroad. It is written in Roman letters with little dots and bars on
      them: ā, ś, ṣ, ṛ. “It is called IAST,” says Dādī. “A helper, so that people who cannot read Devanagari yet can still
      say our words. But the leaf is read in Devanagari.”'
    hi: 'पुस्तकालय में विदेश से एक मित्र का पत्र आता है। वह रोमन अक्षरों में है, जिन पर छोटे बिन्दु और रेखाएँ हैं: ā, ś, ṣ,
      ṛ। दादी कहती हैं, “इसे IAST कहते हैं। यह एक सहायक है, ताकि जो अभी देवनागरी नहीं पढ़ सकते, वे भी हमारे शब्द बोल सकें।
      पर पत्र देवनागरी में पढ़ा जाता है।”'
- id: t1
  kind: teach
  title:
    en: One sign, one sound
    hi: एक चिह्न, एक ध्वनि
  depth: core
  skills:
  - read.iast
  body:
    en: 'In IAST every sign stands for exactly one Devanagari sound. A bar means long: {{आ}} is ā. A dot below means retroflex:
      {{ट}} is ṭ. {{श}} is ś, {{ष}} is ṣ, {{ङ}} is ṅ, {{ञ}} is ñ.'
    hi: 'IAST में हर चिह्न देवनागरी की ठीक एक ध्वनि के लिए है। ऊपर की रेखा का अर्थ दीर्घ: {{आ}} यानी ā। नीचे का बिन्दु मूर्धन्य
      दिखाता है: {{ट}} यानी ṭ। {{श}} यानी ś, {{ष}} यानी ṣ, {{ङ}} यानी ṅ, {{ञ}} यानी ñ।'
  term:
    sa: रोमनलिप्यन्तरम्
    meaning:
      en: 'IAST: the standard Roman letters for Sanskrit'
      hi: 'IAST: संस्कृत के लिए मानक रोमन अक्षर'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'In IAST every sign stands for exactly one Devanagari sound. A bar means long: {{आ}} is ā. A dot below means retroflex:
        {{ट}} is ṭ. {{श}} is ś, {{ष}} is ṣ, {{ङ}} is ṅ, {{ञ}} is ñ.'
      hi: 'IAST में हर चिह्न देवनागरी की ठीक एक ध्वनि के लिए है। ऊपर की रेखा का अर्थ दीर्घ: {{आ}} यानी ā। नीचे का बिन्दु मूर्धन्य

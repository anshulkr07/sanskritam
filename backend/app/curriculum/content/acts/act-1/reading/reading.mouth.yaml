  title:
    en: The mirror
    hi: दर्पण
  depth: core
  skills:
  - read.places
  mode: choice
  prompt:
    en: Which sound is made at the throat and the lips together?
    hi: कौन-सी ध्वनि कण्ठ और होंठ दोनों से बनती है?
  explain:
    en: '{{ओ}}: throat + lips. {{ए}} and {{ऐ}} use the throat + palate.'
    hi: '{{ओ}}: कण्ठ + ओष्ठ। {{ए}} और {{ऐ}} कण्ठ + तालु लेते हैं।'
  roman: after
  gate: true
  story:
    success:
      en: 'Maunī shapes his lips into an ‘o’ in the mirror. A breath comes out, the first sound he has made in a very long
        time: “ओ…”'
      hi: 'मौनी दर्पण में होंठों को ‘ओ’ का आकार देता है। साँस निकलती है, बहुत लम्बे समय में उसकी पहली ध्वनि: “ओ…”'
    failure:
      en: The mirror shows nothing new. Try again, with the throat and the lips.
      hi: 'दर्पण में कुछ नया नहीं दिखता। फिर कोशिश कीजिए: कण्ठ और होंठ से।'

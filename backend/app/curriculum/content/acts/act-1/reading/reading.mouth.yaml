- id: t2
  kind: teach
  title:
    en: Two places at once
    hi: एक साथ दो स्थान
  depth: core
  skills:
  - read.places
  body:
    en: 'Some sounds use two places. {{ए}} is throat + palate; {{ओ}} is throat + lips; {{व}} is teeth + lips. Each nasal uses
      the nose and its own row: {{ङ}} throat + nose, {{म}} lips + nose.'
    hi: 'कुछ ध्वनियाँ दो स्थानों का उपयोग करती हैं। {{ए}} कण्ठ + तालु है; {{ओ}} कण्ठ + ओष्ठ; {{व}} दन्त + ओष्ठ। हर नासिक्य
      नाक और अपनी पंक्ति का स्थान लेता है: {{ङ}} कण्ठ + नाक, {{म}} ओष्ठ + नाक।'
  rows:
  - sa: ए
    gloss:
      en: throat and palate
      hi: कण्ठ और तालु
  - sa: ओ
    gloss:
      en: throat and lips
      hi: कण्ठ और ओष्ठ
  - sa: व

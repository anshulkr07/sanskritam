- id: pn
  kind: teach
  title:
    en: The test for ‘same kind’
    hi: ‘एक-सा’ की कसौटी
  depth: panini
  skills:
  - read.places
  sutras:
  - 1.1.9
  body:
    en: 'Sūtra 1.1.9 says sounds with the same place and the same effort are {{सवर्ण}}, of one kind: {{इ}} and {{ई}} differ
      only in length; {{क}} and {{ख}} share a place but not an effort.'
    hi: 'सूत्र 1.1.9 कहता है कि जिन ध्वनियों का स्थान और प्रयत्न एक हो, वे {{सवर्ण}} हैं: {{इ}} और {{ई}} केवल लम्बाई में अलग
      हैं; {{क}} और {{ख}} का स्थान एक है, पर प्रयत्न नहीं।'
  term:
    sa: सवर्णम्
    meaning:
      en: 'of one kind: same place and effort'
      hi: 'एक-सा: वही स्थान और प्रयत्न'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'Sūtra 1.1.9 says sounds with the same place and the same effort are {{सवर्ण}}, of one kind: {{इ}} and {{ई}} differ
        only in length; {{क}} and {{ख}} share a place but not an effort.'
      hi: 'सूत्र 1.1.9 कहता है कि जिन ध्वनियों का स्थान और प्रयत्न एक हो, वे {{सवर्ण}} हैं: {{इ}} और {{ई}} केवल लम्बाई में
        अलग हैं; {{क}} और {{ख}} का स्थान एक है, पर प्रयत्न नहीं।'
    items:
    - id: i0
      sa: सवर्ण
    - id: i1
      sa: इ
    - id: i2
      sa: ई
    - id: i3
      sa: क
    - id: i4
      sa: ख

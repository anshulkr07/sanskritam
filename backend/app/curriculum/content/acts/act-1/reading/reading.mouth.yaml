- id: s1
  kind: story
  title:
    en: The mouth lesson
    hi: मुँह का पाठ
  depth: core
  image:
    brief: Dādī setting a small brass hand mirror on the low reading desk beside the register; the pale-gold spirit Maunī
      pointing from the register to his own mouth; Śuka on the shelf looking at himself in the mirror.
    alt:
      en: A grandmother sets a brass mirror on a desk while a silent spirit points to his mouth
      hi: पीतल का दर्पण रखती दादी और अपने मुँह की ओर इशारा करता भूत
    cast:
    - you
    - dadi
    - shuka
    - mauni
    place: granthalaya
    ratio: '4:3'
    id: reading-mouth-s1
  narration:
    en: 'Maunī points at the register and then at his own mouth. Dādī understands: “To read his name properly you must know
      how each sound is made, where the mouth is, and what it does.” She sets a small brass mirror on the desk.'
    hi: मौनी रजिस्टर की ओर, फिर अपने मुँह की ओर इशारा करता है। दादी समझ जाती हैं, “उसका नाम ठीक से पढ़ने के लिए जानना होगा
      कि हर ध्वनि कैसे बनती है, मुँह कहाँ है और क्या करता है।” वह मेज़ पर एक छोटा पीतल का दर्पण रख देती हैं।
- id: t1
  kind: teach
  title:
    en: Place and effort
    hi: स्थान और प्रयत्न
  depth: core
  skills:
  - read.places
  body:
    en: Every sound has a place, where the tongue or lips work, and an effort, how closely they work. Vowels leave the mouth
      open. Semivowels barely touch. Hisses almost touch. The five rows touch fully.
    hi: हर ध्वनि का एक स्थान होता है, जहाँ जीभ या होंठ काम करते हैं, और एक प्रयत्न, यानी वे कितना पास आते हैं। स्वर मुँह खुला
      रखते हैं। अन्तःस्थ बस छूते हैं। ऊष्म लगभग छूते हैं। पाँच वर्ग पूरी तरह छूते हैं।
  term:
    sa: प्रयत्नः
    meaning:
      en: 'effort: how closely the mouth works'
      hi: 'प्रयत्न: मुँह कितना पास आता है'

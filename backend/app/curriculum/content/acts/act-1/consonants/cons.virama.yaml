    success:
      en: Chāyikā hears her own name read aloud. The gold thread in her hair blazes. “छायिका!” she whispers. It is a very
        small, very happy sound.
      hi: छायिका अपना नाम ज़ोर से पढ़ा जाता सुनती है। उसके बालों का सुनहरा धागा दमक उठता है। “छायिका!” वह फुसफुसाती है। बहुत

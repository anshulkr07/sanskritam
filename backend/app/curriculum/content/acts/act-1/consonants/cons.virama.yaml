- id: s1
  kind: story
  title:
    en: A stroke at the foot
    hi: पाँव पर एक रेखा
  depth: core
  image:
    brief: Dādī's finger resting on one carved letter of the temple door that has a small slanted stroke at its foot; Chāyikā,
      a slim lavender shadow with a gold thread in her hair, standing in the open beside her and nodding.
    alt:
      en: A grandmother's finger on a carved letter with a stroke at its foot, beside a nodding shadow
      hi: पाँव पर रेखा वाले खुदे अक्षर पर दादी की उँगली
    cast:
    - you
    - dadi
    - shuka
    - chayika
    place: devalaya
    ratio: '4:3'
    id: cons-virama-s1
    text_in_image:
    - क्
  narration:
    en: Some carved letters wear a small slanted stroke at their foot. Dādī lays a finger on one. “Every consonant carries
      a hidden {{अ}}. This stroke tells the {{अ}} to be quiet.” Chāyikā, now standing in the open, nods.
    hi: कुछ खुदे अक्षरों के पाँव पर एक छोटी तिरछी रेखा है। दादी एक पर उँगली रखती हैं, “हर व्यंजन में एक छिपा {{अ}} रहता है।
      यह रेखा उस {{अ}} को चुप करा देती है।” अब खुले में खड़ी छायिका सिर हिलाती है।
- id: t1
  kind: teach
  title:
    en: A hidden {{अ}}
    hi: छिपा हुआ {{अ}}
  depth: core
  skills:
  - script.cons.inherent-a
  body:
    en: 'Write {{क}} and you say ka: the consonant carries {{अ}}. To take the {{अ}} away, add the stroke {{्}}, the {{हलन्तः}}
      or virāma: {{क्}} is just k.'
    hi: '{{क}} लिखिए तो बोला जाता है क + अ: व्यंजन में {{अ}} रहता है। {{अ}} हटाने के लिए रेखा {{्}} लगाइए, इसे {{हलन्तः}}
      या विराम कहते हैं: {{क्}} केवल ‘क्’ है।'
  steps:
  - sa: क्
    label:
      en: 'k alone: the stroke removes {{अ}}'
      hi: 'अकेला क्: रेखा {{अ}} हटा देती है'
  - sa: क
    label:
      en: k + a = ka
      hi: क् + अ = क
  - sa: का
    label:
      en: k + ā = kā
      hi: क् + आ = का
  term:
    sa: हलन्तः
    meaning:
      en: a consonant with no vowel
      hi: बिना स्वर का व्यंजन
  visuals:
  - id: v-source-forms
    kind: comparison
    title:
      en: Follow the forms
      hi: रूपों पर ध्यान दें
    items:
    - id: i0
      sa: क्
      meaning:
        en: 'k alone: the stroke removes {{अ}}'
        hi: 'अकेला क्: रेखा {{अ}} हटा देती है'
    - id: i1
      sa: क
      meaning:
        en: k + a = ka
        hi: क् + अ = क
    - id: i2
      sa: का
      meaning:
        en: k + ā = kā
        hi: क् + आ = का
- id: t2
  kind: teach
  title:
    en: The final sound counts
    hi: अन्त की ध्वनि गिनी जाती है
  depth: core
  skills:
  - script.cons.inherent-a
  body:
    en: 'Many Sanskrit words end in a consonant with the stroke: {{जगत्}} (world), {{तत्}} (that). Words that end in plain
      {{अ}} are different: {{राम}} is rāma, with the final a said aloud. Hindi drops it; Sanskrit does not.'
    hi: 'संस्कृत के कई शब्द रेखा वाले व्यंजन पर समाप्त होते हैं: {{जगत्}} (संसार), {{तत्}} (वह)। अन्त में सादा {{अ}} वाले
      शब्द अलग हैं: {{राम}} बोला जाता है रा-म, अन्त का अ सुनाई देता है। हिन्दी इसे छोड़ देती है; संस्कृत नहीं।'
  examples:
  - sa: रामः
    meaning:
      en: 'Rāma: say the final {{अ}}'
      hi: 'राम: अन्त का {{अ}} बोलिए'
    check:
      type: subanta
      stem: राम
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: जगत्
    meaning:
      en: 'the world: ends in {{त्}}, no vowel'
      hi: 'संसार: {{त्}} पर समाप्त, कोई स्वर नहीं'
    check:
      type: subanta
      stem: जगत्
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka
  visuals:
  - id: v-source-example-0

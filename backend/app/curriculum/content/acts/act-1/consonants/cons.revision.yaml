  kind: revision
  title:
    en: Quick sheet
    hi: एक नज़र में
  depth: core
  section: quick_sheet
  rows:
  - skill: script.cons.grid
    formula: क ख ग घ ङ · च छ ज झ ञ · ट ठ ड ढ ण · त थ द ध न · प फ ब भ म
    rule:
      en: five rows by place
      hi: स्थान के अनुसार पाँच पंक्तियाँ
    tag: core
    taught_in: cons.grid#tb1
  - skill: script.cons.voice
    formula: 1 · 2 · 3 · 4 · 5
    rule:
      en: plain, breathy, voiced, voiced and breathy, nasal
      hi: सादा, महाप्राण, घोष, घोष-महाप्राण, नासिक्य
    tag: core
    taught_in: cons.breath#tb1
  - skill: script.cons.semivowels
    formula: य र ल व
    rule:
      en: semivowels
      hi: अन्तःस्थ
    tag: core
    taught_in: cons.semivowels#t1
  - skill: script.cons.sibilants
    formula: श ष स ह
    rule:
      en: hisses and a breath
      hi: ऊष्म और साँस
    tag: core
    taught_in: cons.sibilants#t1
  - skill: script.cons.inherent-a
    formula: क्
    rule:
      en: no vowel
      hi: बिना स्वर
    tag: core
    taught_in: cons.virama#t1

      explanation:
        en: 'Pāṇini names each row by its first letter plus {{उ}}: {{कु}} is the throat row, {{चु}} the palate row, {{टु}}
          the roof row, {{तु}} the teeth row, {{पु}} the lip row. By sūtra 1.1.69 a letter with {{उ}} stands for its whole
          row.'
        hi: 'पाणिनि हर पंक्ति को उसके पहले अक्षर और {{उ}} से नाम देते हैं: {{कु}} कण्ठ की पंक्ति, {{चु}} तालु की, {{टु}} मूर्धा
          की, {{तु}} दन्त की, {{पु}} ओष्ठ की। सूत्र 1.1.69 के अनुसार {{उ}} लगा अक्षर अपनी पूरी पंक्ति का बोध कराता है।'

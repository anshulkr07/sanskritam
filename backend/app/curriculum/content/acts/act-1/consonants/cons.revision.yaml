  - skill: script.cons.semivowels
    formula: इ→य · ऋ→र · ऌ→ल · उ→व
    rule:
      en: '{{य}} {{र}} {{ल}} {{व}} are half vowel, half consonant; each grows from a vowel.'
      hi: '{{य}} {{र}} {{ल}} {{व}} आधे स्वर, आधे व्यंजन हैं; हर एक किसी स्वर से बनता है।'
    sutras:
    - SS.5
    - SS.6
    tag: core
    taught_in: cons.semivowels#t1
    visuals:
    - id: v-linked-3
      kind: comparison
      title:
        en: Compare the examples
        hi: उदाहरणों की तुलना करें
      explanation:
        en: '{{य}} {{र}} {{ल}} {{व}} are made like the vowels {{इ}} {{ऋ}} {{ऌ}} {{उ}}, only the tongue or lip touches lightly.
          Say {{इ}}, then slide into {{अ}}: you have said {{य}}. Say {{उ}} and slide: {{व}}.'
        hi: '{{य}} {{र}} {{ल}} {{व}} स्वर {{इ}} {{ऋ}} {{ऌ}} {{उ}} की तरह बनते हैं, बस जीभ या होंठ हल्के से छूते हैं। {{इ}}
          बोलकर {{अ}} में फिसलिए: {{य}} बन गया। {{उ}} बोलकर फिसलिए: {{व}}।'
      items:
      - id: i0
        sa: य
        meaning:
          en: 'y in “yes”: palate, like {{इ}}'
          hi: 'यश के ‘य’ जैसा: तालु, {{इ}} की तरह'
      - id: i1
        sa: र
        meaning:
          en: 'tapped r: roof of the mouth, like {{ऋ}}'
          hi: 'जीभ की नोक से ‘र’: मूर्धा, {{ऋ}} की तरह'
      - id: i2
        sa: ल
        meaning:
          en: 'l: teeth, like {{ऌ}}'
          hi: '‘ल’: दन्त, {{ऌ}} की तरह'
      - id: i3
        sa: व
        meaning:
          en: 'between v and w: teeth and lips, like {{उ}}'
          hi: '‘व’ और ‘w’ के बीच: दाँत और होंठ, {{उ}} की तरह'
  - skill: script.cons.sibilants
    formula: श ष स ह
    rule:
      en: '{{श}} (palate), {{ष}} (roof), {{स}} (teeth) hiss; {{ह}} is a breath from the throat.'
      hi: '{{श}} (तालु), {{ष}} (मूर्धा), {{स}} (दन्त) फुफकारते हैं; {{ह}} गले की साँस है।'
    sutras:
    - SS.13
    - SS.14
    tag: core
    taught_in: cons.sibilants#t1
    visuals:
    - id: v-linked-4
      kind: comparison
      title:
        en: Compare the examples
        hi: उदाहरणों की तुलना करें
      explanation:
        en: '{{श}} is a soft hiss at the palate, like “sh” in “ship”. {{ष}} is the same hiss with the tongue curled back to
          the roof. {{स}} is the “s” of “sun”, at the teeth. {{ह}} is a plain breath from the throat.'
        hi: '{{श}} तालु की कोमल फुफकार है, अंग्रेज़ी ‘sh’ जैसी। {{ष}} वही फुफकार है, पर जीभ मुड़कर मूर्धा पर। {{स}} दाँतों
          वाला ‘स’ है। {{ह}} गले से निकलती साफ़ साँस है।'
      items:
      - id: i0
        sa: श
        meaning:
          en: palate, “sh” in “ship”
          hi: तालु, ‘श’
      - id: i1
        sa: ष
        meaning:
          en: roof, tongue curled back
          hi: मूर्धा, जीभ मुड़ी हुई
      - id: i2
        sa: स
        meaning:
          en: teeth, “s” in “sun”
          hi: दन्त, ‘स’
      - id: i3
        sa: ह
        meaning:
          en: throat, a breath
          hi: कण्ठ, साँस
  - skill: script.cons.inherent-a
    formula: क → क्
    rule:
      en: A bare consonant carries {{अ}}; the stroke {{्}} removes it.
      hi: अकेला व्यंजन {{अ}} साथ रखता है; रेखा {{्}} उसे हटा देती है।
    tag: core
    taught_in: cons.virama#t1
    visuals:
    - id: v-linked-5
      kind: comparison
      title:
        en: Keep or remove the inherent vowel
        hi: अन्तर्निहित स्वर रखें या हटाएँ
      items:
      - id: with
        sa: क
        meaning:
          en: Consonant with अ.
          hi: अ के साथ व्यञ्जन।
      - id: without
        sa: क्
        meaning:
          en: Virāma removes that vowel.
          hi: हलन्त उस स्वर को हटाता है।
- id: conditions
  kind: revision
  title:
    en: Where sounds may stand
    hi: ध्वनियाँ कहाँ आती हैं
  depth: core
  section: conditions
  rows:
  - skill: script.cons.grid
    rule:
      en: The nasals {{ङ}} and {{ञ}} never begin a word, and {{ण}} almost never does; they stand inside words, after a vowel.
      hi: नासिक्य {{ङ}} और {{ञ}} किसी शब्द के आरम्भ में नहीं आते, {{ण}} भी लगभग नहीं; ये शब्द के भीतर, स्वर के बाद आते हैं।
    example:
      sa: गङ्गा
      meaning:
        en: 'the river Gaṅgā: {{ङ}} inside the word'
        hi: 'गंगा नदी: शब्द के भीतर {{ङ}}'
    tag: good
    new_here: true
    visuals:
    - id: v-source-new-0
      kind: worked
      title:
        en: Read, examine, understand
        hi: पढ़ें, समझें, फिर पढ़ें
      items:
      - id: i0
        sa: गङ्गा
        label:
          en: Read the whole example
          hi: पूरा उदाहरण पढ़ें
        meaning:
          en: 'the river Gaṅgā: {{ङ}} inside the word'
          hi: 'गंगा नदी: शब्द के भीतर {{ङ}}'
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: The nasals {{ङ}} and {{ञ}} never begin a word, and {{ण}} almost never does; they stand inside words, after a
            vowel.
          hi: नासिक्य {{ङ}} और {{ञ}} किसी शब्द के आरम्भ में नहीं आते, {{ण}} भी लगभग नहीं; ये शब्द के भीतर, स्वर के बाद आते
            हैं।
      - id: i3
        sa: गङ्गा
        label:

- id: core
  kind: revision
  title:
    en: The rules
    hi: नियम
  depth: core
  section: core
  rows:
  - skill: script.cons.grid
    formula: क च ट त प
    rule:
      en: 'Twenty-five consonants stand in five rows by place: throat, palate, roof, teeth, lips.'
      hi: 'पच्चीस व्यंजन स्थान के अनुसार पाँच पंक्तियों में हैं: कण्ठ, तालु, मूर्धा, दन्त, ओष्ठ।'
    tag: core
    taught_in: cons.grid#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Compare the examples
        hi: उदाहरणों की तुलना करें
      explanation:
        en: 'A consonant, {{व्यञ्जनम्}}, is a sound made by closing or narrowing the mouth. The door''s five rows follow your
          mouth from the back to the front: throat, palate, roof, teeth, lips. Say {{क}} {{च}} {{ट}} {{त}} {{प}} and feel
          the sound move forward.'
        hi: 'व्यंजन ({{व्यञ्जनम्}}) वह ध्वनि है जो मुँह को बन्द या तंग करके बनती है। द्वार की पाँच पंक्तियाँ मुँह के पिछले
          भाग से अगले भाग तक चलती हैं: कण्ठ, तालु, मूर्धा, दाँत, होंठ। {{क}} {{च}} {{ट}} {{त}} {{प}} बोलिए और ध्वनि को आगे
          बढ़ते महसूस कीजिए।'
      items:
      - id: i0
        sa: क
        meaning:
          en: throat (कण्ठ)
          hi: कण्ठ (गला)
      - id: i1
        sa: च
        meaning:
          en: palate (तालु)
          hi: तालु
      - id: i2
        sa: ट
        meaning:
          en: roof of the mouth, tongue curled back (मूर्धा)
          hi: मूर्धा, जीभ मुड़ी हुई
      - id: i3
        sa: त
        meaning:
          en: teeth (दन्त)
          hi: दन्त (दाँत)
      - id: i4
        sa: प
        meaning:
          en: lips (ओष्ठ)
          hi: ओष्ठ (होंठ)
  - skill: script.cons.voice
    formula: क ख ग घ ङ
    rule:
      en: Each row runs plain, breathy, voiced, voiced and breathy, nasal.
      hi: 'हर पंक्ति का क्रम: सादा, महाप्राण, घोष, घोष-महाप्राण, नासिक्य।'
    tag: core
    taught_in: cons.breath#t1
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Compare the examples
        hi: उदाहरणों की तुलना करें
      explanation:
        en: 'Every row runs in the same order: plain, breathy, voiced, voiced and breathy, nasal. Put your hand before your
          mouth: {{ख}} is {{क}} with a puff of air. Touch your throat: {{ग}} buzzes, {{क}} does not.'
        hi: 'हर पंक्ति एक ही क्रम में चलती है: सादा, साँस वाला, नाद वाला, नाद और साँस वाला, नासिक्य। हाथ मुँह के आगे रखिए:
          {{ख}} यानी {{क}} पर साँस का झोंका। गले को छुइए: {{ग}} में गूँज है, {{क}} में नहीं।'
      items:
      - id: i0
        sa: क
        meaning:
          en: 'plain: k in “skin”, no buzz, no puff'
          hi: 'अल्पप्राण, अघोष: सादा, न गूँज, न झोंका'
      - id: i1
        sa: ख
        meaning:
          en: 'breathy: {{क}} with a puff of air'
          hi: 'महाप्राण, अघोष: {{क}} पर साँस का झोंका'
      - id: i2
        sa: ग
        meaning:
          en: 'voiced: g in “go”, the throat buzzes'
          hi: 'अल्पप्राण, घोष: गले में गूँज'
      - id: i3
        sa: घ
        meaning:
          en: 'voiced and breathy: {{ग}} with a puff'
          hi: 'महाप्राण, घोष: {{ग}} पर झोंका'
      - id: i4
        sa: ङ
        meaning:
          en: 'nasal: ng in “sing”'
          hi: 'नासिक्य: नाक से'
  - skill: script.cons.voice
    rule:
      en: The 2nd and 4th letters carry a puff of air; the 3rd, 4th and 5th buzz in the throat.
      hi: दूसरे और चौथे अक्षर में साँस का झोंका है; तीसरे, चौथे और पाँचवें में गले की गूँज है।
    tag: core
    taught_in: cons.breath#tb1

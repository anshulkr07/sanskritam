cards:
- id: s1
  kind: story
  title:
    en: Śuka's puffs of air
    hi: शुक की साँस के झोंके
  depth: core
  image:
    brief: Śuka the parrot on Dādī's shoulder squawking beside the carved temple door, a hand held up in front of his open beak to feel the puff of air; Dādī covering her ears, amused; a lavender shadow giggling in the carving.
    alt:
      en: A parrot squawks beside a carved door while a grandmother covers her ears
      hi: नक्काशीदार द्वार के पास चिल्लाता तोता, कान ढकती दादी
    cast:
    - you
    - dadi
    - shuka
    - chayika
    place: devalaya
    ratio: '4:3'
    id: cons-breath-s1
  narration:
    en: Śuka wants to help read the door. He squawks {{खरः}} for every {{करः}}. Dādī covers her ears. “One puff of breath, Śuka, and a hand becomes a donkey.” Behind the carving, a lavender giggle.
    hi: शुक द्वार पढ़ने में मदद करना चाहता है। वह हर {{करः}} को {{खरः}} चिल्लाता है। दादी कान बन्द कर लेती हैं, “शुक, साँस के एक झोंके से हाथ गधा बन जाता है।” नक्काशी के पीछे बैंगनी हँसी गूँजती है।
  lines:
  - speaker: shuka
    sa: खरः! खरः!
    gloss:
      en: Donkey! Donkey!
      hi: गधा! गधा!
- id: t1
  kind: teach
  title:
    en: Five sounds in a row
    hi: एक पंक्ति में पाँच ध्वनियाँ
  depth: core
  skills:
  - script.cons.voice
  body:
    en: 'Every row runs in the same order: plain, breathy, voiced, voiced and breathy, nasal. Put your hand before your mouth: {{ख}} is {{क}} with a puff of air. Touch your throat: {{ग}} buzzes, {{क}} does not.'
    hi: 'हर पंक्ति एक ही क्रम में चलती है: सादा, साँस वाला, नाद वाला, नाद और साँस वाला, नासिक्य। हाथ मुँह के आगे रखिए: {{ख}} यानी {{क}} पर साँस का झोंका। गले को छुइए: {{ग}} में गूँज है, {{क}} में नहीं।'
  rows:
  - sa: क
    gloss:
      en: 'plain: k in “skin”, no buzz, no puff'
      hi: 'अल्पप्राण, अघोष: सादा, न गूँज, न झोंका'
  - sa: ख
    gloss:
      en: 'breathy: {{क}} with a puff of air'
      hi: 'महाप्राण, अघोष: {{क}} पर साँस का झोंका'
  - sa: ग
    gloss:
      en: 'voiced: g in “go”, the throat buzzes'
      hi: 'अल्पप्राण, घोष: गले में गूँज'
  - sa: घ
    gloss:
      en: 'voiced and breathy: {{ग}} with a puff'
      hi: 'महाप्राण, घोष: {{ग}} पर झोंका'
  - sa: ङ
    gloss:
      en: 'nasal: ng in “sing”'
      hi: 'नासिक्य: नाक से'

- id: t2
  kind: teach
  title:
    en: A puff makes a new word
    hi: झोंके से नया शब्द
  depth: core
  skills:
  - script.cons.voice
  body:
    en: 'Keep the puff, or lose it: the word changes. Hindi speakers know this from {{कल}} and {{खल}}; Sanskrit keeps the difference everywhere.'
    hi: 'झोंका रखिए या हटाइए: शब्द बदल जाता है। हिन्दी बोलने वाले इसे जानते हैं; संस्कृत हर जगह यह अन्तर रखती है।'
  examples:
  - sa: करः
    meaning:
      en: a hand; a ray of light (plain {{क}})
      hi: हाथ; किरण (सादा {{क}})
    check:
      type: subanta
      stem: कर
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: खरः
    meaning:
      en: a donkey (breathy {{ख}})
      hi: गधा (महाप्राण {{ख}})
    check:
      type: subanta
      stem: खर
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: पलम्
    meaning:
      en: a moment (plain {{प}})
      hi: पल, क्षण (सादा {{प}})
    check:
      type: subanta
      stem: पल
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka
  - sa: फलम्
    meaning:
      en: a fruit (breathy {{फ}})
      hi: फल (महाप्राण {{फ}})
    check:
      type: subanta
      stem: फल
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka

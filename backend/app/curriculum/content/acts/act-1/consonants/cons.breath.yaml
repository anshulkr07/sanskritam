  note:
    en: Column 1 and 2 are unvoiced (no buzz); columns 3, 4 and 5 buzz. Columns 2 and 4 carry the puff.
    hi: स्तम्भ 1 और 2 में गूँज नहीं (अघोष); 3, 4 और 5 में गूँज है (घोष)। स्तम्भ 2 और 4 में साँस का झोंका (महाप्राण) है।
- id: p1
  kind: practice
  depth: core
  skills:
  - script.cons.voice
  mode: choice
  prompt:
    en: Which letter is the plain, unvoiced one in the throat row?
    hi: कण्ठ की पंक्ति में सादा, बिना गूँज वाला अक्षर कौन-सा है?
  explain:
    en: '{{क}}: no puff and no buzz. {{ख}} has the puff, {{ग}} the buzz.'
    hi: '{{क}} में न झोंका है, न गूँज। {{ख}} में झोंका है, {{ग}} में गूँज।'
  roman: after
  options:

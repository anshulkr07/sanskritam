- id: p3
  kind: practice
  title:
    en: The right word
    hi: सही शब्द
  depth: core
  skills:
  - script.cons.voice
  mode: choice
  prompt:
    en: Śuka should say “fruit”, not “moment”. Which word is it?
    hi: शुक को ‘फल’ कहना है, ‘पल’ नहीं। कौन-सा शब्द है?
  explain:
    en: '{{फलम्}} has the breathy {{फ}}: a fruit.'
    hi: '{{फलम्}} में महाप्राण {{फ}} है: फल।'
  roman: show
  gate: true
  story:
    success:
      en: “फलम्! फलम्!” Śuka crunches an imaginary fruit. From the carving comes a lavender laugh, brighter than before.
      hi: “फलम्! फलम्!” शुक काल्पनिक फल चबाता है। नक्काशी से पहले से ज़्यादा उजली बैंगनी हँसी सुनाई देती है।
    failure:
      en: '“पलम्! पलम्!” Śuka bites the air. Dādī smiles: “A moment is not a fruit.” Feel for the puff.'
      hi: “पलम्! पलम्!” शुक हवा को काटता है। दादी मुस्कुराती हैं, “पल कोई फल नहीं होता।” झोंके को महसूस कीजिए।
  options:
  - sa: पलम्
  - correct: true
    sa: फलम्

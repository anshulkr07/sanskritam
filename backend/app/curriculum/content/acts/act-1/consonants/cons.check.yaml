- id: p3
  kind: practice
  depth: core
  skills:
  - script.cons.voice
  mode: choice
  prompt:
    en: Which letter carries a puff of air?
    hi: किस अक्षर में साँस का झोंका है?
  explain:
    en: '{{घ}} is voiced and breathy: {{ग}} with a puff.'
    hi: '{{घ}} घोष-महाप्राण है: {{ग}} पर झोंका।'
  roman: after
  options:
  - sa: ग
  - correct: true
    sa: घ
  - sa: ङ
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Every row runs in the same order: plain, breathy, voiced, voiced and breathy, nasal. Put your hand before your
        mouth: {{ख}} is {{क}} with a puff of air. Touch your throat: {{ग}} buzzes, {{क}} does not.'
      hi: 'हर पंक्ति एक ही क्रम में चलती है: सादा, साँस वाला, नाद वाला, नाद और साँस वाला, नासिक्य। हाथ मुँह के आगे रखिए: {{ख}}
        यानी {{क}} पर साँस का झोंका। गले को छुइए: {{ग}} में गूँज है, {{क}} में नहीं।'
    items:
    - id: i0
      sa: क
      meaning:
        en: 'plain: k in “skin”, no buzz, no puff'
        hi: 'अल्पप्राण, अघोष: सादा, न गूँज, न झोंका'
    - id: i1
      sa: ख
      meaning:
        en: 'breathy: {{क}} with a puff of air'
        hi: 'महाप्राण, अघोष: {{क}} पर साँस का झोंका'
    - id: i2
      sa: ग
      meaning:
        en: 'voiced: g in “go”, the throat buzzes'
        hi: 'अल्पप्राण, घोष: गले में गूँज'
    - id: i3
      sa: घ
      meaning:
        en: 'voiced and breathy: {{ग}} with a puff'
        hi: 'महाप्राण, घोष: {{ग}} पर झोंका'
    - id: i4
      sa: ङ
      meaning:
        en: 'nasal: ng in “sing”'
        hi: 'नासिक्य: नाक से'

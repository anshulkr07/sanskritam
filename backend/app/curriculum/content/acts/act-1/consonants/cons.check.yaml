cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - script.cons.grid
  mode: choice
  prompt:
    en: Which letter is made at the lips?
    hi: कौन-सा अक्षर होंठों से बनता है?
  explain:
    en: '{{म}} is in the lip row.'
    hi: '{{म}} ओष्ठ की पंक्ति में है।'
  roman: after
  options:
  - sa: क
  - sa: च
  - correct: true
    sa: म
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'A consonant, {{व्यञ्जनम्}}, is a sound made by closing or narrowing the mouth. The door''s five rows follow your
        mouth from the back to the front: throat, palate, roof, teeth, lips. Say {{क}} {{च}} {{ट}} {{त}} {{प}} and feel the
        sound move forward.'
      hi: 'व्यंजन ({{व्यञ्जनम्}}) वह ध्वनि है जो मुँह को बन्द या तंग करके बनती है। द्वार की पाँच पंक्तियाँ मुँह के पिछले भाग
        से अगले भाग तक चलती हैं: कण्ठ, तालु, मूर्धा, दाँत, होंठ। {{क}} {{च}} {{ट}} {{त}} {{प}} बोलिए और ध्वनि को आगे बढ़ते
        महसूस कीजिए।'
    items:
    - id: i0
      sa: क
      meaning:
        en: throat (कण्ठ)
        hi: कण्ठ (गला)
    - id: i1
      sa: च
      meaning:
        en: palate (तालु)
        hi: तालु
    - id: i2
      sa: ट
      meaning:
        en: roof of the mouth, tongue curled back (मूर्धा)
        hi: मूर्धा, जीभ मुड़ी हुई
    - id: i3
      sa: त
      meaning:
        en: teeth (दन्त)
        hi: दन्त (दाँत)
    - id: i4
      sa: प
      meaning:
        en: lips (ओष्ठ)
        hi: ओष्ठ (होंठ)

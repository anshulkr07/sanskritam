- id: p5
  kind: practice
  depth: core
  skills:
  - script.cons.semivowels
  mode: choice
  prompt:
    en: Which of these is a semivowel?
    hi: इनमें अन्तःस्थ कौन-सा है?
  explain:
    en: '{{व}} is one of {{य}} {{र}} {{ल}} {{व}}.'
    hi: '{{व}} {{य}} {{र}} {{ल}} {{व}} में से एक है।'
  roman: after
  options:
  - sa: ग
  - correct: true
    sa: व
  - sa: स
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: '{{य}} {{र}} {{ल}} {{व}} are made like the vowels {{इ}} {{ऋ}} {{ऌ}} {{उ}}, only the tongue or lip touches lightly.
        Say {{इ}}, then slide into {{अ}}: you have said {{य}}. Say {{उ}} and slide: {{व}}.'
      hi: '{{य}} {{र}} {{ल}} {{व}} स्वर {{इ}} {{ऋ}} {{ऌ}} {{उ}} की तरह बनते हैं, बस जीभ या होंठ हल्के से छूते हैं। {{इ}} बोलकर
        {{अ}} में फिसलिए: {{य}} बन गया। {{उ}} बोलकर फिसलिए: {{व}}।'
    items:
    - id: i0
      sa: य
      meaning:
        en: 'y in “yes”: palate, like {{इ}}'
        hi: 'यश के ‘य’ जैसा: तालु, {{इ}} की तरह'
    - id: i1
      sa: र
      meaning:
        en: 'tapped r: roof of the mouth, like {{ऋ}}'
        hi: 'जीभ की नोक से ‘र’: मूर्धा, {{ऋ}} की तरह'
    - id: i2
      sa: ल
      meaning:
        en: 'l: teeth, like {{ऌ}}'
        hi: '‘ल’: दन्त, {{ऌ}} की तरह'
    - id: i3
      sa: व
      meaning:
        en: 'between v and w: teeth and lips, like {{उ}}'
        hi: '‘व’ और ‘w’ के बीच: दाँत और होंठ, {{उ}} की तरह'

- id: p7
  kind: practice
  depth: core
  skills:
  - script.cons.sibilants
  mode: choice
  prompt:
    en: Which letter is the curled-tongue hiss?
    hi: कौन-सा अक्षर मुड़ी जीभ वाली फुफकार है?
  explain:
    en: '{{ष}} is made with the tongue curled back to the roof.'
    hi: '{{ष}} जीभ को मूर्धा की ओर मोड़कर बनता है।'
  roman: after
  options:
  - sa: श
  - correct: true
    sa: ष
  - sa: स
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: '{{श}} is a soft hiss at the palate, like “sh” in “ship”. {{ष}} is the same hiss with the tongue curled back to
        the roof. {{स}} is the “s” of “sun”, at the teeth. {{ह}} is a plain breath from the throat.'
      hi: '{{श}} तालु की कोमल फुफकार है, अंग्रेज़ी ‘sh’ जैसी। {{ष}} वही फुफकार है, पर जीभ मुड़कर मूर्धा पर। {{स}} दाँतों वाला
        ‘स’ है। {{ह}} गले से निकलती साफ़ साँस है।'
    items:
    - id: i0
      sa: श
      meaning:
        en: palate, “sh” in “ship”
        hi: तालु, ‘श’
    - id: i1
      sa: ष
      meaning:
        en: roof, tongue curled back
        hi: मूर्धा, जीभ मुड़ी हुई
    - id: i2
      sa: स
      meaning:
        en: teeth, “s” in “sun”
        hi: दन्त, ‘स’
    - id: i3
      sa: ह
      meaning:
        en: throat, a breath
        hi: कण्ठ, साँस

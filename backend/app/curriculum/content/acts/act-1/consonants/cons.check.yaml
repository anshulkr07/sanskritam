    hi: '{{म्}} बनाइए: {{म}} से स्वर हटाइए।'
  explain:
    en: '{{म}} plus the stroke {{्}} is {{म्}}.'
    hi: '{{म}} और रेखा {{्}} मिलकर {{म्}} बनते हैं।'
  roman: after
  answers:
  - म्
  tiles:
  - म
  - ्
  - ा
  - ि
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: क्
      meaning:
        en: 'k alone: the stroke removes {{अ}}'
        hi: 'अकेला क्: रेखा {{अ}} हटा देती है'
    - id: i1
      sa: क
      meaning:
        en: k + a = ka
        hi: क् + अ = क
    - id: i2
      sa: का
      meaning:
        en: k + ā = kā
        hi: क् + आ = का
- id: p9
  kind: practice
  depth: core
  skills:
  - script.cons.inherent-a
  - script.cons.grid
  mode: order
  prompt:
    en: 'Read Chāyikā''s name aloud: put {{छा}} {{यि}} {{का}} in order.'
    hi: 'छायिका का नाम ज़ोर से पढ़िए: {{छा}} {{यि}} {{का}} को क्रम में लगाइए।'
  explain:
    en: '{{छायिका}}: {{छा}} + {{यि}} + {{का}}.'
    hi: '{{छायिका}}: {{छा}} + {{यि}} + {{का}}।'
  roman: after
  gate: true
  story:
    success:
      en: 'You read the name from the door, letter by letter. Chāyikā steps out of the carvings, whole and bright, and smiles:
        “मुक्ता अस्मि!” Her gold thread lifts like smoke, and she points at the pillar.'
      hi: 'आप द्वार से अक्षर-अक्षर नाम पढ़ते हैं। छायिका नक्काशी से पूरी और उजली बाहर आती है और मुस्कुराती है: “मुक्ता अस्मि!”
        उसका सुनहरा धागा धुएँ-सा उठता है, और वह स्तम्भ की ओर इशारा करती है।'
    failure:
      en: 'The name does not hold. Read it again: {{छा}}, {{यि}}, {{का}}.'
      hi: 'नाम नहीं टिकता। फिर पढ़िए: {{छा}}, {{यि}}, {{का}}।'
  tokens:
  - छा
  - यि
  - का
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example

- id: t2
  kind: teach
  title:
    en: Same hiss, three places
    hi: एक फुफकार, तीन स्थान
  depth: core
  skills:
  - script.cons.sibilants
  body:
    en: 'Śiva, a name of the god, begins with {{श}}; {{विष्णुः}} has {{ष}} in the middle; {{सूर्यः}}, the sun, starts with {{स}}. In Hindi {{श}} and {{ष}} sound alike. In Sanskrit keep them apart: curl the tongue for {{ष}}.'
    hi: 'देवता का नाम {{शिवः}} {{श}} से शुरू होता है; {{विष्णुः}} के बीच में {{ष}} है; {{सूर्यः}} {{स}} से शुरू होता है। हिन्दी में {{श}} और {{ष}} एक-से सुनाई देते हैं। संस्कृत में इन्हें अलग रखिए: {{ष}} के लिए जीभ मोड़िए।'
  examples:
  - sa: शिवः
    meaning:
      en: 'Śiva: palatal {{श}}'
      hi: 'शिव: तालव्य {{श}}'
    check:
      type: subanta
      stem: शिव
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: विष्णुः
    meaning:
      en: 'Viṣṇu: curled {{ष}}'
      hi: 'विष्णु: मूर्धन्य {{ष}}'
    check:
      type: subanta
      stem: विष्णु
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: सूर्यः
    meaning:
      en: 'the sun: dental {{स}}'
      hi: 'सूर्य: दन्त्य {{स}}'
    check:
      type: subanta
      stem: सूर्य
      linga: Pum
      vibhakti: Prathama
      vacana: Eka

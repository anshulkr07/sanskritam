cards:
- id: s1
  kind: story
  title:
    en: The hissing carvings
    hi: फुफकारती नक्काशी
  depth: core
  image:
    brief: The last carved line of the temple door with four letters; Śuka hissing with his beak narrowed, Dādī pointing at the letters, a lavender shadow laughing in the open, no longer hiding.
    alt:
      en: A parrot hissing at four carved letters while a shy shadow laughs
      hi: चार खुदे अक्षरों पर फुफकारता तोता, खुलकर हँसती छाया
    cast:
    - you
    - dadi
    - shuka
    - chayika
    place: devalaya
    ratio: '4:3'
    id: cons-sibilants-s1
  narration:
    en: 'On the door''s last line Śuka starts to hiss. Four letters hiss or sigh: three like a snake, one like a breath. He tries each one and gets them all wrong. Chāyikā forgets to hide and laughs out loud.'
    hi: 'द्वार की आख़िरी पंक्ति पर शुक फुफकारने लगता है। चार अक्षर फुफकारते या साँस छोड़ते हैं: तीन साँप की तरह, एक साँस की तरह। वह हर एक आज़माता है और सब ग़लत बोलता है। छायिका छिपना भूलकर ज़ोर से हँस पड़ती है।'
- id: t1
  kind: teach
  title:
    en: Hiss and breath
    hi: फुफकार और साँस
  depth: core
  skills:
  - script.cons.sibilants
  body:
    en: '{{श}} is a soft hiss at the palate, like “sh” in “ship”. {{ष}} is the same hiss with the tongue curled back to the roof. {{स}} is the “s” of “sun”, at the teeth. {{ह}} is a plain breath from the throat.'
    hi: '{{श}} तालु की कोमल फुफकार है, अंग्रेज़ी ‘sh’ जैसी। {{ष}} वही फुफकार है, पर जीभ मुड़कर मूर्धा पर। {{स}} दाँतों वाला ‘स’ है। {{ह}} गले से निकलती साफ़ साँस है।'
  rows:
  - sa: श
    gloss:
      en: palate, “sh” in “ship”
      hi: तालु, ‘श’
  - sa: ष
    gloss:
      en: roof, tongue curled back
      hi: मूर्धा, जीभ मुड़ी हुई
  - sa: स
    gloss:
      en: teeth, “s” in “sun”
      hi: दन्त, ‘स’
  - sa: ह
    gloss:
      en: throat, a breath
      hi: कण्ठ, साँस

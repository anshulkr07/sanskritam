- id: p3
  kind: practice
  title:
    en: The last line
    hi: आख़िरी पंक्ति
  depth: core
  skills:
  - script.cons.sibilants
  mode: order
  prompt:
    en: 'Put the four in the door''s order: three hisses, then the breath.'
    hi: 'चारों को द्वार के क्रम में लगाइए: तीन फुफकारें, फिर साँस।'
  explain:
    en: '{{श}} {{ष}} {{स}} {{ह}}: the last line of the door.'
    hi: '{{श}} {{ष}} {{स}} {{ह}}: द्वार की आख़िरी पंक्ति।'
  roman: after
  gate: true
  story:
    success:
      en: 'The last line glows. Chāyikā steps halfway out of the carving: a slim lavender shadow with a gold thread in her hair. She still cannot say her name.'
      hi: 'आख़िरी पंक्ति चमक उठती है। छायिका आधी नक्काशी से बाहर आ जाती है: बालों में सुनहरे धागे वाली दुबली बैंगनी छाया। फिर भी वह अपना नाम नहीं बोल पाती।'
    failure:
      en: The letters flicker. Hiss, hiss, hiss, then the breath.
      hi: अक्षर टिमटिमाते हैं। फुफकार, फुफकार, फुफकार, फिर साँस।
  tokens:
  - श
  - ष
  - स
  - ह
- id: pn
  kind: teach
  title:
    en: Pāṇini's names
    hi: पाणिनि के नाम
  depth: panini
  skills:
  - script.cons.sibilants
  sutras:
  - SS.13
  - SS.14
  body:
    en: The Śiva sūtra {{शषसर्}} (13) ends in the marker {{र्}}; {{हल्}} (14) ends in {{ल्}}. From {{श}} to that {{ल्}} Pāṇini's group {{शल्}} holds exactly {{श}} {{ष}} {{स}} {{ह}}. And {{हल्}}, from the {{ह}} of sūtra 5, is every consonant.
    hi: शिवसूत्र {{शषसर्}} (13) का अन्तिम चिह्न {{र्}} है; {{हल्}} (14) का {{ल्}}। {{श}} से उस {{ल्}} तक पाणिनि का समूह {{शल्}} ठीक {{श}} {{ष}} {{स}} {{ह}} है। और {{हल्}}, सूत्र 5 के {{ह}} से, सभी व्यंजन हैं।
  term:
    sa: शल्
    meaning:
      en: the hissing group {{श}} {{ष}} {{स}} {{ह}}
      hi: ऊष्म समूह {{श}} {{ष}} {{स}} {{ह}}

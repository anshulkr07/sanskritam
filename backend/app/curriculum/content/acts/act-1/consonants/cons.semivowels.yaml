cards:
- id: s1
  kind: story
  title:
    en: Between the rows
    hi: पंक्तियों के बीच
  depth: core
  image:
    brief: 'Close-up of the carved door below its five rows: one extra line of four letters set slightly apart, two lavender
      eyes glinting from the carving beside them, Dādī''s finger pointing.'
    alt:
      en: A line of four carved letters under five rows, with two eyes glinting beside them
      hi: पाँच पंक्तियों के नीचे चार खुदे अक्षर, पास में चमकती दो आँखें
    cast:
    - dadi
    - chayika
    place: devalaya
    ratio: '4:3'
    id: cons-semivowels-s1
    text_in_image:
    - य र ल व
  narration:
    en: Under the five rows, the door has one more line of four letters that fit no row. Chāyikā's eyes glint between them.
      “These stand in between,” says Dādī. “Half vowel, half consonant. The old name is {{अन्तःस्थाः}}, the ones that stand
      within.”
    hi: पाँच पंक्तियों के नीचे द्वार पर चार अक्षरों की एक और पंक्ति है जो किसी वर्ग में नहीं आती। उनके बीच छायिका की आँखें
      चमकती हैं। दादी कहती हैं, “ये बीच में खड़े हैं। आधे स्वर, आधे व्यंजन। पुराना नाम {{अन्तःस्थाः}} है, यानी भीतर खड़े होने
      वाले।”
- id: t1
  kind: teach
  title:
    en: Half vowel, half consonant
    hi: आधा स्वर, आधा व्यंजन
  depth: core
  skills:
  - script.cons.semivowels
  body:
    en: '{{य}} {{र}} {{ल}} {{व}} are made like the vowels {{इ}} {{ऋ}} {{ऌ}} {{उ}}, only the tongue or lip touches lightly.
      Say {{इ}}, then slide into {{अ}}: you have said {{य}}. Say {{उ}} and slide: {{व}}.'
    hi: '{{य}} {{र}} {{ल}} {{व}} स्वर {{इ}} {{ऋ}} {{ऌ}} {{उ}} की तरह बनते हैं, बस जीभ या होंठ हल्के से छूते हैं। {{इ}} बोलकर
      {{अ}} में फिसलिए: {{य}} बन गया। {{उ}} बोलकर फिसलिए: {{व}}।'
  rows:
  - sa: य
    gloss:
      en: 'y in “yes”: palate, like {{इ}}'
      hi: 'यश के ‘य’ जैसा: तालु, {{इ}} की तरह'
  - sa: र
    gloss:
      en: 'tapped r: roof of the mouth, like {{ऋ}}'
      hi: 'जीभ की नोक से ‘र’: मूर्धा, {{ऋ}} की तरह'
  - sa: ल
    gloss:
      en: 'l: teeth, like {{ऌ}}'
      hi: '‘ल’: दन्त, {{ऌ}} की तरह'
  - sa: व
    gloss:
      en: 'between v and w: teeth and lips, like {{उ}}'
      hi: '‘व’ और ‘w’ के बीच: दाँत और होंठ, {{उ}} की तरह'

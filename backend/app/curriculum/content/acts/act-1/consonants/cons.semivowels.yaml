- id: pn
  kind: teach
  title:
    en: Pāṇini's name for them
    hi: पाणिनि का नाम
  depth: panini
  skills:
  - script.cons.semivowels
  sutras:
  - SS.5
  - SS.6
  body:
    en: 'Pāṇini''s Śiva sūtras 5 and 6 are {{हयवरट्}} and {{लण्}}. Drop the marker letters {{ट्}} and {{ण्}}, and {{य}} {{व}}
      {{र}} {{ल}} remain. He calls this group {{यण्}}: from {{य}} up to the marker {{ण्}}.'
    hi: 'पाणिनि के शिवसूत्र 5 और 6 हैं {{हयवरट्}} और {{लण्}}। चिह्न {{ट्}} और {{ण्}} हटाइए, तो {{य}} {{व}} {{र}} {{ल}} बचते
      हैं। वे इस समूह को {{यण्}} कहते हैं: {{य}} से चिह्न {{ण्}} तक।'
  term:
    sa: यण्
    meaning:
      en: the four semivowels
      hi: चारों अन्तःस्थ

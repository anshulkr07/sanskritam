- id: pn
  kind: teach
  title:
    en: The row names
    hi: पंक्तियों के नाम
  depth: panini
  skills:
  - script.cons.grid
  sutras:
  - 1.1.69
  body:
    en: 'Pāṇini names each row by its first letter plus {{उ}}: {{कु}} is the throat row, {{चु}} the palate row, {{टु}} the
      roof row, {{तु}} the teeth row, {{पु}} the lip row. By sūtra 1.1.69 a letter with {{उ}} stands for its whole row.'

cards:
- id: s1
  kind: story
  title:
    en: The carved door
    hi: नक्काशीदार द्वार
  depth: core
  image:
    brief: 'The sandstone temple''s carved wooden door at dusk: five rows of Devanagari-like carved letters across it, a small
      lavender shadow half hidden in the carving, you seen from behind with Dādī and Śuka on her shoulder.'
    alt:
      en: A carved temple door with five rows of letters and a shy shadow hiding in the carving
      hi: पाँच पंक्तियों में अक्षर खुदा नक्काशीदार मंदिर द्वार, जिसमें शर्मीली छाया छिपी है
    cast:
    - you
    - dadi
    - shuka
    - chayika
    place: devalaya
    ratio: '4:3'
    id: cons-grid-s1
    text_in_image:
    - क ख ग घ ङ
    - च छ ज झ ञ
    - ट ठ ड ढ ण
    - त थ द ध न
    - प फ ब भ म
  narration:
    en: Dhūmaka's clue leads you to the temple door. Its wood is carved with rows of letters, five rows in all. Something
      small and lavender flickers between the carvings and hides again. Dādī reads the door's first words aloud.
    hi: धूमक का संकेत आपको मंदिर के द्वार तक ले जाता है। उसकी लकड़ी पर अक्षरों की पंक्तियाँ खुदी हैं, कुल पाँच। नक्काशी के
      बीच कोई छोटी, बैंगनी-सी चीज़ झिलमिलाती है और फिर छिप जाती है। दादी द्वार के पहले शब्द ज़ोर से पढ़ती हैं।
  lines:
  - speaker: dadi
    sa: द्वारे व्यञ्जनानि सन्ति।
    gloss:
      en: There are consonants on the door.
      hi: द्वार पर व्यंजन हैं।
- id: t1
  kind: teach
  title:
    en: Where the mouth touches
    hi: मुँह कहाँ छूता है
  depth: core
  skills:
  - script.cons.grid
  body:
    en: 'A consonant, {{व्यञ्जनम्}}, is a sound made by closing or narrowing the mouth. The door''s five rows follow your
      mouth from the back to the front: throat, palate, roof, teeth, lips. Say {{क}} {{च}} {{ट}} {{त}} {{प}} and feel the
      sound move forward.'
    hi: 'व्यंजन ({{व्यञ्जनम्}}) वह ध्वनि है जो मुँह को बन्द या तंग करके बनती है। द्वार की पाँच पंक्तियाँ मुँह के पिछले भाग
      से अगले भाग तक चलती हैं: कण्ठ, तालु, मूर्धा, दाँत, होंठ। {{क}} {{च}} {{ट}} {{त}} {{प}} बोलिए और ध्वनि को आगे बढ़ते महसूस
      कीजिए।'
  rows:
  - sa: क
    gloss:
      en: throat (कण्ठ)
      hi: कण्ठ (गला)
  - sa: च
    gloss:
      en: palate (तालु)
      hi: तालु
  - sa: ट
    gloss:
      en: roof of the mouth, tongue curled back (मूर्धा)
      hi: मूर्धा, जीभ मुड़ी हुई
  - sa: त
    gloss:
      en: teeth (दन्त)
      hi: दन्त (दाँत)
  - sa: प
    gloss:
      en: lips (ओष्ठ)
      hi: ओष्ठ (होंठ)
  term:
    sa: व्यञ्जनम्
    meaning:
      en: consonant
      hi: व्यंजन
  visuals:
  - id: v-source-compare
    kind: comparison
    title:
      en: Compare the examples
      hi: उदाहरणों की तुलना करें
    explanation:
      en: 'A consonant, {{व्यञ्जनम्}}, is a sound made by closing or narrowing the mouth. The door''s five rows follow your
        mouth from the back to the front: throat, palate, roof, teeth, lips. Say {{क}} {{च}} {{ट}} {{त}} {{प}} and feel the
        sound move forward.'
      hi: 'व्यंजन ({{व्यञ्जनम्}}) वह ध्वनि है जो मुँह को बन्द या तंग करके बनती है। द्वार की पाँच पंक्तियाँ मुँह के पिछले भाग
        से अगले भाग तक चलती हैं: कण्ठ, तालु, मूर्धा, दाँत, होंठ। {{क}} {{च}} {{ट}} {{त}} {{प}} बोलिए और ध्वनि को आगे बढ़ते
        महसूस कीजिए।'

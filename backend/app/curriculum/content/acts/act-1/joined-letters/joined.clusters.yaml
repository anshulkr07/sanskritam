      hi: 'पुत्र: {{त्}} + {{र}}'
    check:
      type: subanta
      stem: पुत्र
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: सत्यम्
    meaning:
      en: 'truth: {{त्}} + {{य}}'
      hi: 'सत्य: {{त्}} + {{य}}'
    check:
      type: subanta
      stem: सत्य
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka
  visuals:
  - id: v-source-example-0
    kind: worked
    title:
      en: Read, examine, understand
      hi: पढ़ें, समझें, फिर पढ़ें

- id: t2
  kind: teach
  title:
    en: Half letters and stacks
    hi: आधे अक्षर और ढेर
  depth: core
  skills:
  - script.conjunct
  body:
    en: 'Letters with an upright bar lose it as the first half: {{स्}} + {{त}} = {{स्त}}. Letters without a bar sit on top
      of the next: {{ट्}} + {{ट}} = {{ट्ट}}. A joined letter is still read left to right, top to bottom.'
    hi: 'खड़ी पाई वाले अक्षर पहले आधे के रूप में उसे खो देते हैं: {{स्}} + {{त}} = {{स्त}}। बिना पाई वाले अगले अक्षर के ऊपर
      बैठते हैं: {{ट्}} + {{ट}} = {{ट्ट}}। संयुक्ताक्षर बाएँ से दाएँ, ऊपर से नीचे पढ़ा जाता है।'
  examples:
  - sa: अस्ति
    meaning:
      en: is, exists
      hi: है, विद्यमान है
  - sa: पुत्रः
    meaning:

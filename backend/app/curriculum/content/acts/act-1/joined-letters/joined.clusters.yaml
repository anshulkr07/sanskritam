- title: Lesson text and story
  licence: original
cards:
- id: s1
  kind: story
  title:
    en: The crowded pillar
    hi: भीड़ भरा स्तम्भ
  depth: core
  image:
    brief: A tall carved stone pillar in the temple courtyard covered in crowded joined Devanagari-style letters; curled up
      in the carving a sleeping pale sage-green round spirit with a tiny nightcap of mist; you, Dādī and Śuka looking up at
      it.
    alt:
      en: A stone pillar crowded with joined letters and a sleeping green spirit in a nightcap
      hi: संयुक्ताक्षरों से भरा पत्थर का स्तम्भ और टोपी पहने सोया हरा भूत
    cast:
    - you
    - dadi
    - shuka
    - nidralu
    place: devalaya
    ratio: '4:3'
    id: joined-clusters-s1
    text_in_image:
    - क्ष त्र ज्ञ श्र
  narration:
    en: Chāyikā's clue leads you into the temple courtyard, to a stone pillar covered in letters. They crowd so close they
      seem to hold hands. In the carving, curled up like a cat, sleeps a pale green spirit in a nightcap of mist.
    hi: छायिका का संकेत आपको मंदिर के आँगन में एक पत्थर के स्तम्भ तक ले जाता है, जो अक्षरों से ढका है। वे इतने पास-पास हैं
      मानो हाथ थामे हों। नक्काशी में बिल्ली की तरह सिमटा, धुंध की टोपी पहने, एक हल्का हरा भूत सो रहा है।
  lines:
  - speaker: dadi
    sa: स्तम्भे संयुक्ताक्षराणि सन्ति।
    gloss:
      en: There are joined letters on the pillar.
      hi: स्तम्भ पर संयुक्ताक्षर हैं।
- id: t1
  kind: teach
  title:
    en: Two consonants, one shape
    hi: दो व्यंजन, एक आकृति
  depth: core
  skills:
  - script.conjunct
  body:
    en: 'When two consonants meet with no vowel between them, they join into one shape, a {{संयुक्ताक्षरम्}}. The first drops
      its vowel, the second keeps it: {{क्}} + {{ष}} = {{क्ष}}.'
    hi: 'जब दो व्यंजन बिना स्वर के मिलते हैं, तो वे एक आकृति में जुड़ जाते हैं, {{संयुक्ताक्षरम्}}। पहला अपना स्वर छोड़ देता
      है, दूसरा रखता है: {{क्}} + {{ष}} = {{क्ष}}।'
  steps:
  - sa: क्
    label:
      en: the first, with no vowel
      hi: पहला, बिना स्वर
  - sa: ष
    label:
      en: the second keeps its vowel
      hi: दूसरा अपना स्वर रखता है
  - sa: क्ष
    label:
      en: one joined letter
      hi: एक संयुक्ताक्षर
  term:
    sa: संयुक्ताक्षरम्
    meaning:
      en: a joined letter
      hi: जुड़ा हुआ अक्षर
  visuals:
  - id: v-source-forms
    kind: comparison
    title:
      en: Follow the forms
      hi: रूपों पर ध्यान दें
    items:
    - id: i0
      sa: क्
      meaning:
        en: the first, with no vowel
        hi: पहला, बिना स्वर
    - id: i1
      sa: ष
      meaning:
        en: the second keeps its vowel
        hi: दूसरा अपना स्वर रखता है
    - id: i2
      sa: क्ष
      meaning:
        en: one joined letter
        hi: एक संयुक्ताक्षर
- id: tb1
  kind: table
  title:
    en: Four famous joins
    hi: चार प्रसिद्ध संयोग
  depth: core
  skills:
  - script.conjunct
  caption:
    en: Four joined letters you will meet everywhere
    hi: चार संयुक्ताक्षर जो हर जगह मिलेंगे
  columns:
  - en: Joined
    hi: संयुक्त
  - en: Made of
    hi: से बना
  - en: In a word
    hi: शब्द में
  rows:
  - - sa: क्ष
    - sa: क् + ष
    - sa: क्षत्रियः
      check:
        type: subanta
        stem: क्षत्रिय
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
  - - sa: त्र
    - sa: त् + र
    - sa: मित्रम्
      check:
        type: subanta
        stem: मित्र
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Eka
  - - sa: ज्ञ
    - sa: ज् + ञ
    - sa: ज्ञानम्
      check:
        type: subanta
        stem: ज्ञान
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Eka
  - - sa: श्र
    - sa: श् + र
    - sa: श्रमः
      check:
        type: subanta
        stem: श्रम
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
  note:
    en: 'Hindi says {{ज्ञ}} as “gya”; Sanskrit says it as ज् with the nasal {{ञ}}: “jña”.'
    hi: 'हिन्दी {{ज्ञ}} को ‘ग्य’ बोलती है; संस्कृत में यह ज् और नासिक्य {{ञ}} है: ‘ज्ञ’।'

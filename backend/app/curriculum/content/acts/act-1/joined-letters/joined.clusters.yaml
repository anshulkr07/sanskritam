          ऊपर बैठते हैं: {{ट्}} + {{ट}} = {{ट्ट}}। संयुक्ताक्षर बाएँ से दाएँ, ऊपर से नीचे पढ़ा जाता है।'
    - id: i3
      sa: अस्ति
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें

  rows:
  - skill: script.conjunct
    formula: क् + ष → क्ष
    rule:
      en: Consonants with no vowel between them join; the first loses its vowel.
      hi: बिना स्वर के मिलने वाले व्यंजन जुड़ते हैं; पहला अपना स्वर खो देता है।
    tag: core
    taught_in: joined.clusters#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Follow the forms
        hi: रूपों पर ध्यान दें
      items:
      - id: i0
        sa: क्
        meaning:
          en: the first, with no vowel
          hi: पहला, बिना स्वर
      - id: i1
        sa: ष
        meaning:
          en: the second keeps its vowel
          hi: दूसरा अपना स्वर रखता है
      - id: i2
        sa: क्ष
        meaning:
          en: one joined letter
          hi: एक संयुक्ताक्षर

      title:
        en: Read, examine, understand
        hi: पढ़ें, समझें, फिर पढ़ें
      items:
      - id: i0
        sa: राष्ट्रम्
        label:
          en: Read the whole example
          hi: पूरा उदाहरण पढ़ें
        meaning:
          en: 'a nation: {{ष्ट्र}}'
          hi: 'राष्ट्र: {{ष्ट्र}}'
        check:
          type: subanta
          stem: राष्ट्र
          linga: Napumsaka
          vibhakti: Prathama
          vacana: Eka
        feature:

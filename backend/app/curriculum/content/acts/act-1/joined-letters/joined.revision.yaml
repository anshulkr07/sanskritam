  - skill: script.reph
    formula: र्म · प्र
    rule:
      en: '{{र}} first in a join is a curl on top; {{र}} second hangs below.'
      hi: संयोग में {{र}} पहले हो तो ऊपर मोड़; दूसरा हो तो नीचे काँटा।
    tag: core
    taught_in: joined.ra#t1
    visuals:
    - id: v-linked-2
      kind: sequence
      title:
        en: र् is spoken first
        hi: र् पहले बोला जाता है
      items:
      - id: parts
        sa: र् + म
        meaning:
          en: र् comes before म in sound order.
          hi: बोलने में र्, म से पहले है।
      - id: shape
        sa: र्म
        meaning:
          en: The repha is written above. Read र् before म.
          hi: रेफ ऊपर लिखा है। र् को म से पहले पढ़ें।
      - id: word
        sa: धर्मः
        meaning:
          en: Find that order inside the word.
          hi: शब्द के भीतर वही क्रम पहचानें।
  - skill: script.anusvara
    formula: म् → ं
    rule:
      en: The dot {{ं}} is a nasal hum; a final {{म्}} before a consonant becomes it.
      hi: बिन्दु {{ं}} नासिक्य गूँज है; व्यंजन से पहले अन्त का {{म्}} इसमें बदलता है।
    sutras:
    - 8.3.23
    tag: core
    taught_in: joined.hum-breath#t1
    visuals:
    - id: v-linked-3
      kind: worked
      title:
        en: Read, examine, understand
        hi: पढ़ें, समझें, फिर पढ़ें
      items:
      - id: i0
        sa: गंगा
        label:
          en: Read the whole example
          hi: पूरा उदाहरण पढ़ें
        meaning:
          en: 'the river Gaṅgā: the dot hums as {{ङ्}} before {{ग}}'
          hi: 'गंगा नदी: {{ग}} से पहले बिन्दु {{ङ्}} की तरह गूँजता है'
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: 'The dot above a letter, the {{अनुस्वारः}}, is a nasal hum through the nose: {{अं}}. At the end of a word it
            stands for {{म्}}: {{रामम्}} may be written {{रामं}}. Inside a word it hums like the nasal of the letter after
            it.'
          hi: 'अक्षर के ऊपर का बिन्दु, {{अनुस्वारः}}, नाक से निकलने वाली नासिक्य गूँज है: {{अं}}। शब्द के अन्त में यह {{म्}}
            का काम करता है: {{रामम्}} को {{रामं}} भी लिखते हैं। शब्द के भीतर यह अगले अक्षर के नासिक्य की तरह गूँजता है।'
      - id: i3
        sa: गंगा
        label:
          en: Read it again with the meaning
          hi: अर्थ समझकर फिर पढ़ें
        meaning:
          en: 'the river Gaṅgā: the dot hums as {{ङ्}} before {{ग}}'
          hi: 'गंगा नदी: {{ग}} से पहले बिन्दु {{ङ्}} की तरह गूँजता है'
  - skill: script.visarga
    formula: ः
    rule:
      en: '{{ः}} is a soft breath after a vowel.'
      hi: '{{ः}} स्वर के बाद हल्की साँस है।'
    tag: core
    taught_in: joined.hum-breath#t2
    visuals:
    - id: v-linked-4
      kind: worked
      title:
        en: Read, examine, understand
        hi: पढ़ें, समझें, फिर पढ़ें
      items:
      - id: i0
        sa: रामः
        label:
          en: Read the whole example
          hi: पूरा उदाहरण पढ़ें
        meaning:
          en: 'Rāma: ends in a breath'
          hi: 'राम: साँस पर समाप्त'
        check:
          type: subanta
          stem: राम
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
        feature:
          en: 'Stem: {{राम}} · masculine · {{प्रथमा}} · singular'
          hi: 'प्रातिपदिक: {{राम}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
        compare_from: राम
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: 'Two dots after a vowel, the {{विसर्गः}}, are a soft breath that echoes the vowel: {{रामः}} ends in a light
            “ha”. It is never a letter of its own at the start of a word.'
          hi: 'स्वर के बाद दो बिन्दु, {{विसर्गः}}, हल्की साँस हैं जो उस स्वर की गूँज बनती है: {{रामः}} अन्त में हल्के ‘ह’
            पर रुकता है। यह कभी शब्द के आरम्भ का अक्षर नहीं होता।'
      - id: i3
        sa: रामः
        label:
          en: Read it again with the meaning
          hi: अर्थ समझकर फिर पढ़ें
        meaning:
          en: 'Rāma: ends in a breath'
          hi: 'राम: साँस पर समाप्त'
        check:
          type: subanta
          stem: राम
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
        feature:
          en: 'Stem: {{राम}} · masculine · {{प्रथमा}} · singular'
          hi: 'प्रातिपदिक: {{राम}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
        compare_from: राम
  - skill: script.signs
    formula: । ॥ ऽ ॐ
    rule:
      en: '{{।}} line; {{॥}} verse; {{ऽ}} dropped {{अ}}; {{ॐ}} the sacred syllable.'
      hi: '{{।}} पंक्ति; {{॥}} श्लोक; {{ऽ}} छूटा {{अ}}; {{ॐ}} पवित्र अक्षर।'
    tag: core
    taught_in: joined.marks#t1
    visuals:
    - id: v-linked-5
      kind: comparison
      title:
        en: Compare the examples
        hi: उदाहरणों की तुलना करें
      explanation:
        en: '{{।}} the {{दण्डः}} ends a line or sentence; {{॥}} ends a verse. {{ऽ}}, the avagraha, marks a dropped {{अ}}:
          {{सोऽहम्}}. {{ॐ}} is the sacred syllable, {{अ}} + {{उ}} + {{म्}}.'
        hi: '{{।}} {{दण्डः}} पंक्ति या वाक्य का अन्त करता है; {{॥}} श्लोक का अन्त। {{ऽ}}, अवग्रह, छूटे हुए {{अ}} का चिह्न
          है: {{सोऽहम्}}। {{ॐ}} पवित्र अक्षर है, {{अ}} + {{उ}} + {{म्}}।'
      items:
      - id: i0
        sa: ।
        meaning:
          en: ends a line or sentence
          hi: पंक्ति या वाक्य का अन्त
      - id: i1
        sa: ॥
        meaning:
          en: ends a verse
          hi: श्लोक का अन्त
      - id: i2
        sa: ऽ
        meaning:
          en: a dropped {{अ}} (avagraha)
          hi: छूटा हुआ {{अ}} (अवग्रह)
      - id: i3
        sa: ॐ
        meaning:
          en: the sacred syllable
          hi: पवित्र अक्षर

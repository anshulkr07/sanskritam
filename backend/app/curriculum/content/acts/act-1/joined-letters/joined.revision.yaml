          hi: 'प्रातिपदिक: {{राष्ट्र}} · {{नपुंसकलिंग}} · {{प्रथमा}} · {{एकवचन}}'
        compare_from: राष्ट्र
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: '{{ट्र}} and {{ड्र}} take a different mark, not the hook: {{राष्ट्रम्}} (nation). And {{ऋ}} is a vowel, not

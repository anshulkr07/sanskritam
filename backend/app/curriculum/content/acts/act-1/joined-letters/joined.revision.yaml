    formula: क्ष त्र ज्ञ श्र
    rule:
      en: '{{क्ष}} {{त्र}} {{ज्ञ}} {{श्र}} are four common joins.'
      hi: '{{क्ष}} {{त्र}} {{ज्ञ}} {{श्र}} चार सामान्य संयोग हैं।'
    tag: core
    taught_in: joined.clusters#tb1

id: joined-letters
title:
  en: Joined letters
  hi: संयुक्ताक्षर
title_sa: संयुक्ताक्षराणि
status: ready
ghost: nidralu
episode:
  summary:
    en: Chāyikā's clue points to a pillar where letters crowd together. Nidrālu sleeps among them; only someone who can read joined letters, the hum and the breath can wake him.
    hi: छायिका का संकेत एक स्तंभ की ओर है जहाँ अक्षर एक-दूसरे से सटे हैं। निद्रालु उनके बीच सोया है; उसे वही जगा सकता है जो संयुक्ताक्षर, अनुस्वार और विसर्ग पढ़ सके।
  beats:
  - Letters with no vowel between them join into one shape.
  - Two small marks, ं and ः, close many words.
  - You read the pillar's line, numbers and all, and Nidrālu wakes with a yawn.

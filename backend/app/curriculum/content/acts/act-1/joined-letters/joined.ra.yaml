    hi: किस शब्द के पहले अक्षर के नीचे काँटा है?
  explain:
    en: In {{प्रियः}} the {{र}} hangs below {{प}}.
    hi: '{{प्रियः}} में {{र}} {{प}} के नीचे लटकता है।'

- id: p3
  kind: practice
  title:
    en: Another word
    hi: एक और शब्द
  depth: core
  skills:
  - script.reph
  mode: type
  prompt:
    en: 'Wake the pillar again: build {{धर्मः}} from the pieces.'
    hi: 'स्तम्भ को फिर जगाइए: टुकड़ों से {{धर्मः}} बनाइए।'
  explain:
    en: '{{ध}} + {{र्मः}}: {{धर्मः}}.'
    hi: '{{ध}} + {{र्मः}}: {{धर्मः}}।'
  roman: after
  gate: true
  story:
    success:
      en: '{{धर्मः}} lights up. The green spirit sits up halfway, rubs his eyes, and says one word in his sleep: “धर्मः”.'
      hi: '{{धर्मः}} जगमगा उठता है। हरा भूत आधा उठ बैठता है, आँखें मलता है, और नींद में एक शब्द बोलता है: “धर्मः”।'
    failure:
      en: 'The pillar stays dark. Put the curl-carrying syllable last: {{र्मः}}.'
      hi: 'स्तम्भ अँधेरा रहता है। मोड़ वाला अक्षर आख़िर में रखिए: {{र्मः}}।'
  answers:
  - धर्मः
  tiles:
  - ध
  - र्मः
  - र्
  - म
- id: t3
  kind: teach
  title:
    en: Odd ones
    hi: कुछ विचित्र
  depth: core
  skills:
  - script.reph
  body:
    en: '{{ट्र}} and {{ड्र}} take a different mark, not the hook: {{राष्ट्रम्}} (nation). And {{ऋ}} is a vowel, not {{र}} with a sign. Read {{ऋषिः}} as ṛ-ṣi, never ri-ṣi.'
    hi: '{{ट्र}} और {{ड्र}} काँटे की जगह दूसरा चिह्न लेते हैं: {{राष्ट्रम्}} (राष्ट्र)। और {{ऋ}} स्वर है, चिह्न लगा {{र}} नहीं। {{ऋषिः}} को ऋ-षि पढ़िए, रि-षि नहीं।'
  examples:
  - sa: राष्ट्रम्
    meaning:
      en: 'a nation: {{ष्ट्र}}'
      hi: 'राष्ट्र: {{ष्ट्र}}'
    check:
      type: subanta
      stem: राष्ट्र
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka

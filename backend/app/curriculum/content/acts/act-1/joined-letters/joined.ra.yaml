- id: p1
  kind: practice
  depth: core
  skills:
  - script.reph
  mode: match
  prompt:
    en: Join each shape to where the {{र}} sits.
    hi: हर आकार को उस स्थान से जोड़िए जहाँ {{र}} बैठा है।
  explain:
    en: In {{र्म}} the {{र}} comes first and curls on top; in {{प्र}} it comes second and hangs below.
    hi: '{{र्म}} में {{र}} पहले है और ऊपर मुड़ता है; {{प्र}} में दूसरा है और नीचे लटकता है।'
  roman: after

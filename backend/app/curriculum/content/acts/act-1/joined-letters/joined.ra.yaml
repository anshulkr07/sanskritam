id: joined.ra
template: scene
title:
  en: The many shapes of र
  hi: र के कई रूप
title_sa: रेफः
minutes: 6
teaches:
- script.reph
needs:
- script.conjunct
review: engine_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: s1
  kind: story
  title:
    en: Nidrālu mumbles
    hi: निद्रालु बड़बड़ाता है
  depth: core
  image:
    brief: The stone pillar in close-up with several joined letters containing the letter ra in different forms, a small curl above one and a hook below another; Śuka on Dādī's shoulder cross-eyed with effort; the sleeping green spirit mumbling in the background.
    alt:
      en: A pillar with joined letters containing many shapes of ra, and a parrot cross-eyed with effort
      hi: र के कई रूपों वाला स्तम्भ और जीभ उलझाता तोता
    cast:
    - you
    - dadi
    - shuka
    - nidralu
    place: devalaya
    ratio: '4:3'
    id: joined-ra-s1
  narration:
    en: 'The sleeping spirit mumbles in his dream: “र… र…”. On the pillar the letter {{र}} wears many costumes: a curl on top, a hook below, even a new shape. Śuka tries to read them aloud and gets his tongue in a knot.'
    hi: 'सोया हुआ भूत सपने में बड़बड़ाता है: “र… र…”। स्तम्भ पर {{र}} कई रूप धरता है: ऊपर एक मोड़, नीचे एक काँटा, कभी बिलकुल नया आकार। शुक उन्हें ज़ोर से पढ़ने की कोशिश करता है और जीभ उलझा बैठता है।'
- id: t1
  kind: teach
  title:
    en: The curl on top
    hi: ऊपर का मोड़
  depth: core
  skills:
  - script.reph
  body:
    en: 'When {{र}} comes first in a joined letter, it becomes a small curl on top of the next letter: {{र्}} + {{म}} = {{र्म}}. It is called {{रेफः}}. You say it first, but write it last, above the end of the syllable.'
    hi: 'जब {{र}} संयुक्ताक्षर में पहले आता है, तो अगले अक्षर के ऊपर छोटा मोड़ बन जाता है: {{र्}} + {{म}} = {{र्म}}। इसे {{रेफः}} कहते हैं। बोला जाता है पहले, पर लिखा जाता है अन्त में, अक्षर के सिरे पर।'
  examples:
  - sa: धर्मः
    meaning:
      en: 'duty: {{ध}} + {{र्म}}'
      hi: 'धर्म: {{ध}} + {{र्म}}'
    check:
      type: subanta
      stem: धर्म
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: कर्म
    meaning:
      en: 'action: {{क}} + {{र्म}}'
      hi: 'कर्म: {{क}} + {{र्म}}'
    check:
      type: subanta
      stem: कर्मन्
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka
  term:
    sa: रेफः
    meaning:
      en: the curl for r at the start of a join
      hi: संयोग के आरम्भ के र का मोड़
- id: t2
  kind: teach
  title:
    en: The hook below
    hi: नीचे का काँटा
  depth: core
  skills:
  - script.reph
  body:
    en: 'When {{र}} comes second, it hangs below the first letter as a small hook: {{प्}} + {{र}} = {{प्र}}, {{क्}} + {{र}} = {{क्र}}. Two have their own shapes: {{त्र}} and {{श्र}}.'
    hi: 'जब {{र}} दूसरा आता है, तो पहले अक्षर के नीचे छोटे काँटे की तरह लटकता है: {{प्}} + {{र}} = {{प्र}}, {{क्}} + {{र}} = {{क्र}}। दो के अपने आकार हैं: {{त्र}} और {{श्र}}।'
  examples:
  - sa: प्रियः
    meaning:
      en: 'dear: {{प्र}}'
      hi: 'प्रिय: {{प्र}}'
    check:
      type: subanta
      stem: प्रिय
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: क्रमः
    meaning:
      en: 'order: {{क्र}}'
      hi: 'क्रम: {{क्र}}'
    check:
      type: subanta
      stem: क्रम
      linga: Pum
      vibhakti: Prathama
      vacana: Eka

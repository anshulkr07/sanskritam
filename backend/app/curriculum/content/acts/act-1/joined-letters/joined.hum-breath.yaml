- id: p4
  kind: practice
  title:
    en: The great word
    hi: बड़ा शब्द
  depth: core
  skills:
  - script.anusvara
  - script.visarga
  mode: order
  prompt:
    en: 'The hum, the conjunct, the vowel: put the pieces of {{संस्कृतम्}} in order.'
    hi: 'गूँज, संयुक्ताक्षर, स्वर: {{संस्कृतम्}} के टुकड़े क्रम में लगाइए।'
  explain:
    en: '{{सं}} + {{स्कृ}} + {{तम्}}: the hum, the join, the end.'
    hi: '{{सं}} + {{स्कृ}} + {{तम्}}: गूँज, संयोग, अन्त।'
  roman: after
  gate: true
  story:
    success:
      en: 'The pillar hums with you: “संस्कृतम्”. The green spirit''s nightcap slides over one eye as he stretches. “Hmm… breath… hum…”'
      hi: 'स्तम्भ आपके साथ गूँजता है: “संस्कृतम्”। हरे भूत की टोपी एक आँख पर खिसक जाती है और वह अँगड़ाई लेता है। “हम्म… साँस… गूँज…”'
    failure:
      en: 'The pillar goes quiet. Start with the hum: {{सं}}.'
      hi: 'स्तम्भ चुप हो जाता है। गूँज से शुरू कीजिए: {{सं}}।'
  tokens:
  - सं
  - स्कृ
  - तम्
- id: pn
  kind: teach
  title:
    en: Pāṇini's rule for the hum
    hi: गूँज का पाणिनि-नियम
  depth: panini
  skills:
  - script.anusvara
  sutras:
  - 8.3.23
  body:
    en: 'Sūtra 8.3.23, {{मोऽनुस्वारः}}: a final {{म्}} before a consonant becomes the dot. So {{रामम्}} + {{नमति}} is written {{रामं नमति}}.'
    hi: 'सूत्र 8.3.23, {{मोऽनुस्वारः}}: व्यंजन से पहले अन्त का {{म्}} बिन्दु बन जाता है। इसलिए {{रामम्}} + {{नमति}} लिखा जाता है {{रामं नमति}}।'

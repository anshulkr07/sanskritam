cards:
- id: s1
  kind: story
  title:
    en: Hum and sigh
    hi: गूँज और आह
  depth: core
  image:
    brief: The pillar with two carved marks highlighted, a single dot above one letter and a pair of dots after another; the sleeping green spirit humming, with tiny wavy lines of sound drifting from his nose and a puff of breath from his mouth.
    alt:
      en: A pillar with a dot above one letter and two dots after another, and a sleeping spirit humming and sighing
      hi: एक बिन्दु और दो बिन्दुओं वाला स्तम्भ, गुनगुनाता सोया भूत
    cast:
    - you
    - dadi
    - shuka
    - nidralu
    place: devalaya
    ratio: '4:3'
    id: joined-hum-breath-s1
  narration:
    en: The green spirit hums in his sleep, a soft nasal sound, then sighs out a little breath. Above one letter on the pillar sits a dot, after another two dots, just like his hum and sigh. “The pillar is breathing,” whispers Śuka.
    hi: हरा भूत नींद में गुनगुनाता है, एक कोमल नासिक्य ध्वनि, फिर हल्की साँस छोड़ता है। स्तम्भ पर एक अक्षर के ऊपर एक बिन्दु है, दूसरे के बाद दो बिन्दु, ठीक उसकी गूँज और आह की तरह। “स्तम्भ साँस ले रहा है,” शुक फुसफुसाता है।
- id: t1
  kind: teach
  title:
    en: 'The hum: ं'
    hi: 'गूँज: ं'
  depth: core
  skills:
  - script.anusvara
  - script.visarga
  sutras:
  - 8.3.23
  body:
    en: 'The dot above a letter, the {{अनुस्वारः}}, is a nasal hum through the nose: {{अं}}. At the end of a word it stands for {{म्}}: {{रामम्}} may be written {{रामं}}. Inside a word it hums like the nasal of the letter after it.'
    hi: 'अक्षर के ऊपर का बिन्दु, {{अनुस्वारः}}, नाक से निकलने वाली नासिक्य गूँज है: {{अं}}। शब्द के अन्त में यह {{म्}} का काम करता है: {{रामम्}} को {{रामं}} भी लिखते हैं। शब्द के भीतर यह अगले अक्षर के नासिक्य की तरह गूँजता है।'
  examples:
  - sa: गंगा
    meaning:
      en: 'the river Gaṅgā: the dot hums as {{ङ्}} before {{ग}}'
      hi: 'गंगा नदी: {{ग}} से पहले बिन्दु {{ङ्}} की तरह गूँजता है'
  - sa: संस्कृतम्
    meaning:
      en: 'Sanskrit: {{सं}} hums before {{स्}}'
      hi: 'संस्कृत: {{स्}} से पहले {{सं}} गूँजता है'
  term:
    sa: अनुस्वारः
    meaning:
      en: 'the dot: a nasal hum'
      hi: 'बिन्दु: नासिक्य गूँज'
- id: t2
  kind: teach
  title:
    en: 'The breath: ः'
    hi: 'साँस: ः'
  depth: core
  skills:
  - script.anusvara
  - script.visarga
  body:
    en: 'Two dots after a vowel, the {{विसर्गः}}, are a soft breath that echoes the vowel: {{रामः}} ends in a light “ha”. It is never a letter of its own at the start of a word.'
    hi: 'स्वर के बाद दो बिन्दु, {{विसर्गः}}, हल्की साँस हैं जो उस स्वर की गूँज बनती है: {{रामः}} अन्त में हल्के ‘ह’ पर रुकता है। यह कभी शब्द के आरम्भ का अक्षर नहीं होता।'
  examples:
  - sa: रामः
    meaning:
      en: 'Rāma: ends in a breath'
      hi: 'राम: साँस पर समाप्त'
    check:
      type: subanta
      stem: राम
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
  - sa: नमः
    meaning:
      en: 'homage: {{नमः}}'
      hi: 'नमन: {{नमः}}'
    check:
      type: subanta
      stem: नमस्
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka
  term:
    sa: विसर्गः
    meaning:
      en: 'the two dots: a soft breath'
      hi: 'दो बिन्दु: हल्की साँस'
- id: p1
  kind: practice
  depth: core
  skills:
  - script.anusvara
  - script.visarga
  mode: match
  prompt:
    en: Join each mark to its sound.
    hi: हर चिह्न को उसकी ध्वनि से जोड़िए।
  explain:
    en: '{{ं}} hums, {{ः}} breathes, {{्}} silences the vowel.'
    hi: '{{ं}} गूँजता है, {{ः}} साँस लेता है, {{्}} स्वर को चुप कराता है।'
  roman: after
  pairs:
  - left:
      sa: ं
    right:
      text:
        en: a nasal hum
        hi: नासिक्य गूँज
  - left:
      sa: ः
    right:
      text:
        en: a soft breath
        hi: हल्की साँस
  - left:
      sa: ्
    right:
      text:
        en: no vowel
        hi: बिना स्वर

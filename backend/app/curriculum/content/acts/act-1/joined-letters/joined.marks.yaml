- id: p4
  kind: practice
  title:
    en: The last line
    hi: आख़िरी पंक्ति
  depth: core
  skills:
  - script.signs
  - script.numerals
  mode: order
  prompt:
    en: Read the pillar's last line. Put its three pieces in order.
    hi: स्तम्भ की आख़िरी पंक्ति पढ़िए। उसके तीन टुकड़े क्रम में लगाइए।
  explain:
    en: '{{सत्यमेव जयते नानृतं}}: truth alone prevails, not falsehood (Muṇḍaka Upaniṣad 3.1.6).'
    hi: '{{सत्यमेव जयते नानृतं}}: सत्य की ही जीत होती है, असत्य की नहीं (मुण्डक उपनिषद् 3.1.6)।'
  roman: after
  gate: true
  story:
    success:
      en: 'You read the line aloud, bars and all. The green spirit yawns, stretches, and opens both eyes: “जागर्मि!” His nightcap pops like a bubble.'
      hi: 'आप पूरी पंक्ति, रेखाओं सहित, ज़ोर से पढ़ते हैं। हरा भूत उबासी लेता है, अँगड़ाई लेता है और दोनों आँखें खोल देता है: “जागर्मि!” उसकी टोपी बुलबुले की तरह फूट जाती है।'
    failure:
      en: 'The line will not wake him. Say it as you read it: {{सत्यमेव}} first.'
      hi: 'पंक्ति उसे जगा नहीं पाती। पढ़ते हुए बोलिए: पहले {{सत्यमेव}}।'
  tokens:
  - सत्यमेव
  - जयते
  - नानृतं
- id: p5
  kind: practice
  depth: core
  skills:
  - script.signs
  - script.numerals
  mode: choice
  prompt:
    en: What does the curl {{ऽ}} in {{सोऽहम्}} stand for?
    hi: '{{सोऽहम्}} में मोड़ {{ऽ}} किसकी जगह है?'
  explain:
    en: '{{सोऽहम्}} is {{सः}} + {{अहम्}}: the {{अ}} is dropped and marked by {{ऽ}}.'
    hi: '{{सोऽहम्}} यानी {{सः}} + {{अहम्}}: {{अ}} छूट गया और {{ऽ}} से दिखाया गया।'
  roman: show
  options:
  - correct: true
    text:
      en: a dropped {{अ}}
      hi: छूटे हुए {{अ}} की
  - text:
      en: a hum
      hi: गूँज की
  - text:
      en: a breath
      hi: साँस की

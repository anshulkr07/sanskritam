cards:
- id: s1
  kind: story
  title:
    en: The last lines
    hi: आख़िरी पंक्तियाँ
  depth: core
  image:
    brief: 'The foot of the temple pillar with carved marks: a small avagraha curl, a tall single bar and a double bar, the sacred Om sign, and a row of Devanagari numerals; the green spirit stirring awake above them, Dādī pointing.'
    alt:
      en: The foot of a pillar with carved marks, the Om sign and numbers, and a spirit stirring
      hi: चिह्नों, ॐ और अंकों वाला स्तम्भ का पाँव, हिलता हुआ भूत
    cast:
    - you
    - dadi
    - shuka
    - nidralu
    place: devalaya
    ratio: '4:3'
    id: joined-marks-s1
    text_in_image: ["ऽ", "।", "॥", "ॐ", "० १ २ ३ ४ ५ ६ ७ ८ ९"]
  narration:
    en: 'At the pillar''s foot, below the letters, stand strange marks: a small curl like an S, tall bars, a great round sign, and a row of numbers. The green spirit stirs. “Read the last line,” says Dādī, “and he will wake.”'
    hi: 'स्तम्भ के पाँव पर, अक्षरों के नीचे, अजीब चिह्न खुदे हैं: ‘S’ जैसा छोटा मोड़, ऊँची खड़ी रेखाएँ, एक बड़ा गोल चिह्न, और अंकों की एक पंक्ति। हरा भूत हिलता है। दादी कहती हैं, “आख़िरी पंक्ति पढ़ो, वह जाग जाएगा।”'
  quote:
    sa: सत्यमेव जयते नानृतं
    gloss:
      en: Truth alone prevails, not falsehood.
      hi: सत्य की ही जीत होती है, असत्य की नहीं।
    source: Muṇḍaka Upaniṣad 3.1.6
- id: t1
  kind: teach
  title:
    en: Bars, a curl and a sacred sound
    hi: रेखाएँ, एक मोड़ और एक पवित्र ध्वनि
  depth: core
  skills:
  - script.signs
  - script.numerals
  body:
    en: '{{।}} the {{दण्डः}} ends a line or sentence; {{॥}} ends a verse. {{ऽ}}, the avagraha, marks a dropped {{अ}}: {{सोऽहम्}}. {{ॐ}} is the sacred syllable, {{अ}} + {{उ}} + {{म्}}.'
    hi: '{{।}} {{दण्डः}} पंक्ति या वाक्य का अन्त करता है; {{॥}} श्लोक का अन्त। {{ऽ}}, अवग्रह, छूटे हुए {{अ}} का चिह्न है: {{सोऽहम्}}। {{ॐ}} पवित्र अक्षर है, {{अ}} + {{उ}} + {{म्}}।'
  rows:
  - sa: ।
    gloss:
      en: ends a line or sentence
      hi: पंक्ति या वाक्य का अन्त
  - sa: ॥
    gloss:
      en: ends a verse
      hi: श्लोक का अन्त
  - sa: ऽ
    gloss:
      en: a dropped {{अ}} (avagraha)
      hi: छूटा हुआ {{अ}} (अवग्रह)
  - sa: ॐ
    gloss:
      en: the sacred syllable
      hi: पवित्र अक्षर

- id: p9
  kind: practice
  depth: core
  skills:
  - script.conjunct
  - script.signs
  mode: order
  prompt:
    en: 'Read the pillar''s line once more, aloud: put its three pieces in order.'
    hi: 'स्तम्भ की पंक्ति एक बार फिर ज़ोर से पढ़िए: उसके तीन टुकड़े क्रम में लगाइए।'
  explain:
    en: '{{सत्यमेव जयते नानृतं}}: Muṇḍaka Upaniṣad 3.1.6.'
    hi: '{{सत्यमेव जयते नानृतं}}: मुण्डक उपनिषद् 3.1.6।'
  roman: after
  gate: true
  story:
    success:
      en: 'The line rings out. Nidrālu, the green spirit, springs up, his nightcap gone: “जागर्मि! जागर्मि!” He bows to you,
        then flutters toward the courtyard door, where the old register waits in the library.'
      hi: 'पंक्ति गूँज उठती है। हरा भूत, निद्रालु, टोपी गँवाकर उछल पड़ता है: “जागर्मि! जागर्मि!” वह आपको प्रणाम करता है और
        आँगन के द्वार की ओर उड़ चलता है, जहाँ पुस्तकालय में पुराना रजिस्टर प्रतीक्षा कर रहा है।'
    failure:
      en: The pillar stays silent. Read the pieces in order, from {{सत्यमेव}}.
      hi: स्तम्भ चुप रहता है। {{सत्यमेव}} से शुरू कर टुकड़े क्रम से पढ़िए।
  tokens:
  - सत्यमेव
  - जयते
  - नानृतं
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:

- id: p3
  kind: practice
  depth: core
  skills:
  - script.reph
  mode: match
  prompt:
    en: Match each shape with where the {{र}} sits.
    hi: हर आकार को {{र}} के स्थान से मिलाइए।
  explain:
    en: A first {{र}} curls on top; a second hangs below.
    hi: पहला {{र}} ऊपर मुड़ता है; दूसरा नीचे लटकता है।
  roman: after
  pairs:
  - left:
      sa: र्म
    right:
      text:
        en: on top
        hi: ऊपर
  - left:
      sa: प्र
    right:
      text:
        en: below
        hi: नीचे
  - left:
      sa: र्त
    right:
      text:
        en: on top
        hi: ऊपर
  - left:
      sa: क्र
    right:
      text:
        en: below
        hi: नीचे
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: धर्मः
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: 'duty: {{ध}} + {{र्म}}'
        hi: 'धर्म: {{ध}} + {{र्म}}'
      check:
        type: subanta
        stem: धर्म
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{धर्म}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{धर्म}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'When {{र}} comes first in a joined letter, it becomes a small curl on top of the next letter: {{र्}} + {{म}}
          = {{र्म}}. It is called {{रेफः}}. You say it first, but write it last, above the end of the syllable.'
        hi: 'जब {{र}} संयुक्ताक्षर में पहले आता है, तो अगले अक्षर के ऊपर छोटा मोड़ बन जाता है: {{र्}} + {{म}} = {{र्म}}। इसे
          {{रेफः}} कहते हैं। बोला जाता है पहले, पर लिखा जाता है अन्त में, अक्षर के सिरे पर।'
    - id: i3
      sa: धर्मः
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: 'duty: {{ध}} + {{र्म}}'
        hi: 'धर्म: {{ध}} + {{र्म}}'
      check:
        type: subanta
        stem: धर्म
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{धर्म}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{धर्म}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'

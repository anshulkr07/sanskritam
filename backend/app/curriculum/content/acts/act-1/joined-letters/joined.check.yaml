id: joined.check
template: check
title:
  en: Wake the pillar
  hi: स्तम्भ को जगाइए
title_sa: परीक्षा
minutes: 4
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - script.conjunct
  mode: choice
  prompt:
    en: Which is {{त्}} + {{र}}?
    hi: '{{त्}} + {{र}} कौन-सा है?'
  explain:
    en: '{{त्र}}: the first loses its vowel and joins {{र}}.'
    hi: '{{त्र}}: पहला स्वर खोकर {{र}} से जुड़ता है।'
  roman: after
  options:
  - correct: true
    sa: त्र
  - sa: र्त
  - sa: तर
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: क्
      meaning:
        en: the first, with no vowel
        hi: पहला, बिना स्वर
    - id: i1
      sa: ष
      meaning:
        en: the second keeps its vowel
        hi: दूसरा अपना स्वर रखता है
    - id: i2
      sa: क्ष
      meaning:
        en: one joined letter
        hi: एक संयुक्ताक्षर

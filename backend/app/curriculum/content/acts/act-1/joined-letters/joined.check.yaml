- id: p5
  kind: practice
  depth: core
  skills:
  - script.anusvara
  mode: choice
  prompt:
    en: Which mark is the nasal hum?
    hi: नासिक्य गूँज का चिह्न कौन-सा है?
  explain:
    en: '{{ं}} is the hum.'
    hi: '{{ं}} गूँज है।'
  roman: after
  options:
  - sa: ः
  - correct: true
    sa: ं
  - sa: ऽ
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: गंगा
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: 'the river Gaṅgā: the dot hums as {{ङ्}} before {{ग}}'
        hi: 'गंगा नदी: {{ग}} से पहले बिन्दु {{ङ्}} की तरह गूँजता है'
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'The dot above a letter, the {{अनुस्वारः}}, is a nasal hum through the nose: {{अं}}. At the end of a word it stands
          for {{म्}}: {{रामम्}} may be written {{रामं}}. Inside a word it hums like the nasal of the letter after it.'
        hi: 'अक्षर के ऊपर का बिन्दु, {{अनुस्वारः}}, नाक से निकलने वाली नासिक्य गूँज है: {{अं}}। शब्द के अन्त में यह {{म्}}
          का काम करता है: {{रामम्}} को {{रामं}} भी लिखते हैं। शब्द के भीतर यह अगले अक्षर के नासिक्य की तरह गूँजता है।'
    - id: i3
      sa: गंगा
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: 'the river Gaṅgā: the dot hums as {{ङ्}} before {{ग}}'
        hi: 'गंगा नदी: {{ग}} से पहले बिन्दु {{ङ्}} की तरह गूँजता है'

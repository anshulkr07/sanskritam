- id: p6
  kind: practice
  title:
    en: The chisel
    hi: छेनी
  depth: core
  skills:
  - sandhi.split
  mode: choice
  prompt:
    en: '{{उज्ज्वलः}} comes from…'
    hi: '{{उज्ज्वलः}} बना है…'
  explain:
    en: '{{ज्ज}} from {{त् + ज}}.'
    hi: '{{ज्ज}}, {{त् + ज}} से।'
  roman: after
  gate: true
  story:
    success:
      en: '“उत् + ज्वलः,” you say, and the thirteenth statue lays the thin chisel on the word, and the word comes apart, cleanly, with a sound like a thread parting: उत्, ज्वलः. The foreman gives a small shaky laugh. “Two words,” he says. “It was two words all the time.” He writes them in his notebook, and for the first time, crossly, he asks Dādī: “And that one?”'
      hi: '“उत् + ज्वलः,” आप कहते हैं, और तेरहवीं प्रतिमा पतली छेनी शब्द पर रखती है, और शब्द साफ़ दो टुकड़े हो जाता है, धागा टूटने की ध्वनि के साथ: उत्, ज्वलः। मुखिया हल्की काँपती हँसी हँसता है। “दो शब्द,” वह कहता है। “यह हमेशा से दो शब्द थे।” वह उन्हें अपनी पुस्तिका में लिखता है, और पहली बार, चिढ़कर, दादी से पूछता है: “और वह वाला?”'
    failure:
      en: 'The word stays whole. {{ज्ज}} from {{त् + ज}}: {{उत् + ज्वलः}}.'
      hi: 'शब्द साबुत रहता है। {{ज्ज}}, {{त् + ज}} से: {{उत् + ज्वलः}}।'
  options:
  - sa: उद् + ज्वलः
  - sa: उक् + ज्वलः
  - correct: true
    sa: उत् + ज्वलः
- id: pn
  kind: teach
  title:
    en: Pāṇini in reverse
    hi: पाणिनि उलटे क्रम में
  depth: panini
  skills:
  - sandhi.split
  sutras:
  - 6.1.101
  - 6.1.87
  - 8.2.39
  body:
    en: Pāṇini's sūtras only join; the splitting is the reader's work, done by undoing each rule. {{अकः सवर्णे दीर्घः}} tells you a long {{आ}} may hide two {{अ/आ}}. {{आद्गुणः}} tells you {{ए}} may hide {{अ + इ}}. {{झलां जशोऽन्ते}} tells you a soft stop may be a hard one.
    hi: पाणिनि के सूत्र केवल जोड़ते हैं; विच्छेद पाठक का काम है, जो हर नियम को उलटकर किया जाता है। {{अकः सवर्णे दीर्घः}} बताता है कि दीर्घ {{आ}} दो {{अ/आ}} छिपा सकता है। {{आद्गुणः}} बताता है कि {{ए}} {{अ + इ}} छिपा सकता है। {{झलां जशोऽन्ते}} बताता है कि कोमल स्पर्श कठोर हो सकता है।

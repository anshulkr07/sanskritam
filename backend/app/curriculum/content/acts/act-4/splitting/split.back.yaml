cards:
- id: s1
  kind: story
  title:
    en: The thirteenth statue
    hi: तेरहवीं प्रतिमा
  depth: core
  image:
    brief: The thirteenth statue holding a thin chisel; Lubdhaka's foreman crouched at an inscription on the plinth with his lamp beside him, frowning; Dādī kneeling beside him and pointing to one letter; Śuka on the plinth.
    alt:
      en: A statue with a thin chisel while an old woman points at one letter and a frowning man crouches by his lamp
      hi: पतली छेनी वाली प्रतिमा, एक अक्षर की ओर इशारा करती दादी, दीपक के पास झुका उलझा आदमी
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - vicchedika
    place: simhasana-shala
    ratio: '4:3'
    id: split-back-s1
  narration:
    en: 'The thirteenth statue holds a thin chisel. Lubdhaka''s foreman has put his lamp on the plinth and is staring at the nearest inscription: “विद्यालयः”. He cannot read it. “You have to take it apart,” says Dādī, not unkindly. “Look at the sound that has changed, and work backwards to what must have been there. Then check that both halves are real words.”'
    hi: तेरहवीं प्रतिमा के हाथ में पतली छेनी है। लुब्धक के मुखिया ने अपना दीपक आसन पर रख दिया है और निकटतम अभिलेख “विद्यालयः” को घूर रहा है। वह उसे पढ़ नहीं पाता। “उसे अलग करना होगा,” दादी बिना कठोरता के कहती हैं। “जो ध्वनि बदली है उसे देखिए, और पीछे चलकर सोचिए कि वहाँ क्या रहा होगा। फिर जाँचिए कि दोनों भाग असली शब्द हैं।”
- id: t1
  kind: teach
  title:
    en: Spot the tell-tale sound
    hi: पहचान की ध्वनि खोजिए
  depth: core
  skills:
  - sandhi.split
  body:
    en: To split, look for the sound that gave the join away. A long {{आ}} may be {{अ/आ + अ/आ}}; {{ए}} may be {{अ + इ}}; {{ओ}} may be {{अ + उ}}; {{य्}} or {{व्}} between a consonant and a vowel may be {{इ}} or {{उ}}; {{ज्ज}} may be {{त् + ज}}; {{ोऽ}} may be {{अः + अ}}. Then test both halves as words.
    hi: अलग करने के लिए वह ध्वनि खोजिए जिसने सन्धि का भेद खोला। दीर्घ {{आ}} {{अ/आ + अ/आ}} हो सकता है; {{ए}} {{अ + इ}} हो सकता है; {{ओ}} {{अ + उ}} हो सकता है; व्यंजन और स्वर के बीच {{य्}} या {{व्}} {{इ}} या {{उ}} हो सकता है; {{ज्ज}} {{त् + ज}} हो सकता है; {{ोऽ}} {{अः + अ}} हो सकता है। फिर दोनों भागों को शब्द की तरह परखिए।
  term:
    sa: सन्धिविच्छेदः
    meaning:
      en: taking a join apart
      hi: सन्धि को अलग करना
- id: tb1
  kind: table
  title:
    en: Clues to the split
    hi: विच्छेद के संकेत
  depth: core
  skills:
  - sandhi.split
  caption:
    en: What the joined sound may hide
    hi: जुड़ी हुई ध्वनि क्या छिपा सकती है
  columns:
  - en: Joined sound
    hi: जुड़ी ध्वनि
  - en: May be
    hi: हो सकता है
  - en: Example
    hi: उदाहरण
  rows:
  - - sa: आ
    - sa: अ/आ + अ/आ
    - sa: विद्यालयः = विद्या + आलयः
  - - sa: ए, ओ
    - sa: अ + इ, अ + उ
    - sa: गणेशः = गण + ईशः
  - - sa: ऐ, औ
    - sa: अ + ए, अ + ओ
    - sa: सदैव = सदा + एव
  - - sa: य्, व्, र्
    - text:
        en: इ, उ, ऋ + vowel
        hi: इ, उ, ऋ + स्वर
    - sa: इत्यादि = इति + आदि
  - - sa: ोऽ
    - sa: अः + अ
    - sa: रामोऽस्ति = रामः + अस्ति
  - - sa: ज्ज, च्च, ल्ल
    - sa: त् + ज, च, ल
    - sa: सज्जनः = सत् + जनः
  - - sa: न्म, ङ्म
    - sa: त्, क् + म
    - sa: सन्मार्गः = सत् + मार्गः
  note:
    en: Several answers may be possible; the right one gives two real words.
    hi: कई उत्तर सम्भव हो सकते हैं; सही वह है जो दो असली शब्द दे।

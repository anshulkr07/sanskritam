- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: sandhi.split
    rule:
      en: 'To split, undo each sūtra you have met: {{अकः सवर्णे दीर्घः}}, {{आद्गुणः}}, {{झलां जशोऽन्ते}}.'
      hi: 'अलग करने के लिए अब तक के हर सूत्र को उलटिए: {{अकः सवर्णे दीर्घः}}, {{आद्गुणः}}, {{झलां जशोऽन्ते}}।'
    sutras:
    - 6.1.101
    - 6.1.87
    - 8.2.39
    tag: core
    taught_in: split.back#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Pāṇini's sūtras only join; the splitting is the reader's work, done by undoing each rule. {{अकः सवर्णे दीर्घः}}
          tells you a long {{आ}} may hide two {{अ/आ}}. {{आद्गुणः}} tells you {{ए}} may hide {{अ + इ}}. {{झलां जशोऽन्ते}} tells
          you a soft stop may be a hard one.
        hi: पाणिनि के सूत्र केवल जोड़ते हैं; विच्छेद पाठक का काम है, जो हर नियम को उलटकर किया जाता है। {{अकः सवर्णे दीर्घः}}
          बताता है कि दीर्घ {{आ}} दो {{अ/आ}} छिपा सकता है। {{आद्गुणः}} बताता है कि {{ए}} {{अ + इ}} छिपा सकता है। {{झलां जशोऽन्ते}}
          बताता है कि कोमल स्पर्श कठोर हो सकता है।
      items:
      - id: i0
        sa: अकः सवर्णे दीर्घः
      - id: i1
        sa: आ
      - id: i2
        sa: अ/आ
      - id: i3
        sa: आद्गुणः
      - id: i4
        sa: ए
      - id: i5
        sa: अ + इ
      - id: i6
        sa: झलां जशोऽन्ते

- id: conditions
  kind: revision
  title:
    en: Choosing a word split
    hi: सही पदच्छेद चुनना
  depth: core
  section: splitting
  rows:
  - skill: sandhi.split
    rule:
      en: More than one split may be possible; choose the one that gives real words that fit the sentence.
      hi: एक से अधिक विच्छेद सम्भव हो सकते हैं; वह चुनिए जो वाक्य में बैठने वाले असली शब्द दे।
    tag: good
    taught_in: split.back#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: To split, look for the sound that gave the join away. A long {{आ}} may be {{अ/आ + अ/आ}}; {{ए}} may be {{अ + इ}};
          {{ओ}} may be {{अ + उ}}; {{य्}} or {{व्}} between a consonant and a vowel may be {{इ}} or {{उ}}; {{ज्ज}} may be {{त्
          + ज}}; {{ोऽ}} may be {{अः + अ}}. Then test both halves as words.
        hi: अलग करने के लिए वह ध्वनि खोजिए जिसने सन्धि का भेद खोला। दीर्घ {{आ}} {{अ/आ + अ/आ}} हो सकता है; {{ए}} {{अ + इ}}
          हो सकता है; {{ओ}} {{अ + उ}} हो सकता है; व्यंजन और स्वर के बीच {{य्}} या {{व्}} {{इ}} या {{उ}} हो सकता है; {{ज्ज}}
          {{त् + ज}} हो सकता है; {{ोऽ}} {{अः + अ}} हो सकता है। फिर दोनों भागों को शब्द की तरह परखिए।
      items:
      - id: i0
        sa: आ
      - id: i1
        sa: अ/आ + अ/आ
      - id: i2
        sa: ए
      - id: i3
        sa: अ + इ
      - id: i4
        sa: ओ
      - id: i5
        sa: अ + उ
      - id: i6
        sa: य्
      - id: i7
        sa: व्
      - id: i8
        sa: इ
      - id: i9
        sa: उ
      - id: i10
        sa: ज्ज
      - id: i11
        sa: त् + ज
      - id: i12
        sa: ोऽ
      - id: i13
        sa: अः + अ
  - skill: sandhi.padaccheda
    rule:
      en: After padaccheda comes anvaya, then the meaning.
      hi: पदच्छेद के बाद अन्वय, फिर अर्थ।
    tag: good
    taught_in: split.line#pn
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'After padaccheda comes {{अन्वयः}}, putting the words in prose order, and then the meaning. For now, you have
          the first step: you can see where every word begins and ends.'
        hi: 'पदच्छेद के बाद {{अन्वयः}} आता है, शब्दों को गद्य के क्रम में रखना, और फिर अर्थ। अभी आपके पास पहला चरण है: आप
          देख सकते हैं कि हर शब्द कहाँ शुरू और कहाँ समाप्त होता है।'
      items:
      - id: i0
        sa: अन्वयः

- id: conditions
  kind: revision
  title:
    en: Choosing a word split
    hi: सही पदच्छेद चुनना
  depth: core
  section: splitting
  rows:
  - skill: sandhi.split
    rule:
      en: More than one split may be possible; choose the one that gives real words that fit the sentence.
      hi: एक से अधिक विच्छेद सम्भव हो सकते हैं; वह चुनिए जो वाक्य में बैठने वाले असली शब्द दे।
    tag: good
    taught_in: split.back#t1
  - skill: sandhi.padaccheda
    rule:
      en: After padaccheda comes anvaya, then the meaning.
      hi: पदच्छेद के बाद अन्वय, फिर अर्थ।
    tag: good
    taught_in: split.line#pn
- id: mistakes
  kind: revision
  title:
    en: Common mistakes
    hi: आम भूलें
  depth: core
  section: mistakes
  rows:
  - skill: sandhi.split
    rule:
      en: 'Do not split into non-words: {{सज्जनः}} is {{सत् + जनः}}, not {{सज् + जनः}}.'
      hi: 'अशब्दों में मत तोड़िए: {{सज्जनः}} {{सत् + जनः}} है, {{सज् + जनः}} नहीं।'
    tag: core
    taught_in: split.back#p3
  - skill: sandhi.padaccheda
    rule:
      en: 'Do not stop at the first join: check the whole line.'
      hi: 'पहली सन्धि पर मत रुकिए: पूरी पंक्ति जाँचिए।'
    tag: core
    taught_in: split.line#t1
- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: sandhi.split
    rule:
      en: 'To split, undo each sūtra you have met: {{अकः सवर्णे दीर्घः}}, {{आद्गुणः}}, {{झलां जशोऽन्ते}}.'
      hi: 'अलग करने के लिए अब तक के हर सूत्र को उलटिए: {{अकः सवर्णे दीर्घः}}, {{आद्गुणः}}, {{झलां जशोऽन्ते}}।'
    sutras:
    - 6.1.101
    - 6.1.87
    - 8.2.39
    tag: core
    taught_in: split.back#pn

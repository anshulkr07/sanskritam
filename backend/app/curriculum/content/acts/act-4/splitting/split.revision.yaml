    rule:
      en: 'A compound is joined too: {{रामलक्ष्मणौ}} is two words in a compound, not a sandhi; you will meet that next.'
      hi: 'समास भी जुड़ा हुआ है: {{रामलक्ष्मणौ}} समास में दो शब्द हैं, सन्धि नहीं; वह आगे मिलेगा।'

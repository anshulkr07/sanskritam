- id: p1
  kind: practice
  depth: core
  skills:
  - sandhi.split
  mode: choice
  prompt:
    en: '{{महात्मा}} comes from…'
    hi: '{{महात्मा}} बना है…'
  explain:
    en: '{{आ}} + {{आ}} = {{आ}}.'
    hi: '{{आ}} + {{आ}} = {{आ}}।'
  roman: after
  options:
  - sa: महा + अत्मा
  - sa: महे + आत्मा
  - correct: true
    sa: महा + आत्मा
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: To split, look for the sound that gave the join away. A long {{आ}} may be {{अ/आ + अ/आ}}; {{ए}} may be {{अ + इ}};
        {{ओ}} may be {{अ + उ}}; {{य्}} or {{व्}} between a consonant and a vowel may be {{इ}} or {{उ}}; {{ज्ज}} may be {{त्
        + ज}}; {{ोऽ}} may be {{अः + अ}}. Then test both halves as words.
      hi: अलग करने के लिए वह ध्वनि खोजिए जिसने सन्धि का भेद खोला। दीर्घ {{आ}} {{अ/आ + अ/आ}} हो सकता है; {{ए}} {{अ + इ}} हो
        सकता है; {{ओ}} {{अ + उ}} हो सकता है; व्यंजन और स्वर के बीच {{य्}} या {{व्}} {{इ}} या {{उ}} हो सकता है; {{ज्ज}} {{त्
        + ज}} हो सकता है; {{ोऽ}} {{अः + अ}} हो सकता है। फिर दोनों भागों को शब्द की तरह परखिए।

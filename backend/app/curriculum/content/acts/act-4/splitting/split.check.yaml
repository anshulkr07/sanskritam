- id: p7
  kind: practice
  depth: core
  skills:
  - sandhi.split
  mode: order
  prompt:
    en: 'Say Vicchedikā''s three splits: “vidyā + ālayaḥ, sat + janaḥ, rāmaḥ + asti.”'
    hi: 'विच्छेदिका के तीन विच्छेद कहिए: ‘विद्या + आलयः, सत् + जनः, रामः + अस्ति।’'
  explain:
    en: '{{विद्यालयः सज्जनः रामोऽस्ति}}: three joined words.'
    hi: '{{विद्यालयः सज्जनः रामोऽस्ति}}: तीन जुड़े शब्द।'
  roman: after
  gate: true
  story:
    success:
      en: “विद्या + आलयः, सत् + जनः, रामः + अस्ति,” you say, and Vicchedikā lays her thin chisel down and puts one finger
        to the faint line that runs down the middle of her face. The line opens, softly, and she is two statues, side by side,
        who look at each other, delighted, and then, in a single movement, are one again, whole and clear. “Now I can,” she
        says, and lifts her chin. “रामलक्ष्मणौ,” she says. “Look, they are two, and they are one.” Beyond her, in the lamplight,
        the next statues' names are carved in long, gleaming, joined shapes.
      hi: “विद्या + आलयः, सत् + जनः, रामः + अस्ति,” आप कहते हैं, और विच्छेदिका अपनी पतली छेनी रख देती है और अपने चेहरे के
        बीच की धुँधली रेखा पर एक उँगली रखती है। रेखा कोमलता से खुलती है, और वह दो प्रतिमाएँ बन जाती है, साथ-साथ, जो एक-दूसरे
        को आनन्द से देखती हैं, और फिर एक ही गति में फिर एक हो जाती हैं, पूरी और साफ़। “अब मैं कर सकती हूँ,” वह कहती है और
        ठुड्डी उठाती है। “रामलक्ष्मणौ,” वह कहती है। “देखिए, वे दो हैं, और वे एक हैं।” उसके आगे, दीपक की रोशनी में, अगली प्रतिमाओं
        के नाम लम्बी, चमकती, जुड़ी आकृतियों में खुदे हैं।
    failure:
      en: 'Her face stays one line. The three: {{विद्यालयः सज्जनः रामोऽस्ति}}.'
      hi: 'उसका चेहरा एक ही रेखा रहता है। तीन: {{विद्यालयः सज्जनः रामोऽस्ति}}।'
  tokens:
  - विद्यालयः
  - सज्जनः
  - रामोऽस्ति
  feedback_visuals:
  - id: v-source-feedback

      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'A real line often has several joins. Take them one at a time, from the left: find the first joined sound, split
        it, check both words, and carry on. Then write the line with spaces. This is {{पदच्छेदः}}. After it comes the meaning.'
      hi: 'असली पंक्ति में अक्सर कई सन्धियाँ होती हैं। उन्हें बाएँ से एक-एक करके लीजिए: पहली जुड़ी ध्वनि खोजिए, उसे तोड़िए,
        दोनों शब्द जाँचिए, और आगे बढ़िए। फिर पंक्ति को अन्तराल के साथ लिखिए। यह {{पदच्छेदः}} है। उसके बाद अर्थ आता है।'
    items:
    - id: i0
      sa: पदच्छेदः
- id: p5
  kind: practice
  title:
    en: The whole line
    hi: पूरी पंक्ति
  depth: core
  skills:
  - sandhi.padaccheda
  mode: choice
  prompt:
    en: '{{बालोऽयम्}} comes from…'
    hi: '{{बालोऽयम्}} बना है…'
  explain:
    en: '{{ओऽ}} from {{अः + अ}}.'
    hi: '{{ओऽ}}, {{अः + अ}} से।'
  roman: after
  gate: true
  story:
    success:
      en: “बालः अयम्,” you say, “this boy,” and the statue's carved line falls apart, all down its length, into separate,
        clear words, each with its own small gap, like beads on a string that has been cut. The statue steps down from her
        base. “Now I can read my own line,” she says. “There was always a space between. I could not see it for the stone.”
      hi: “बालः अयम्,” आप कहते हैं, “यह बालक,” और प्रतिमा की खुदी पंक्ति अपनी पूरी लम्बाई में अलग, साफ़ शब्दों में बिखर जाती
        है, हर एक के बीच अपना छोटा अन्तराल, कटी माला के मनकों की तरह। प्रतिमा अपने आसन से उतरती है। “अब मैं अपनी ही पंक्ति
        पढ़ सकती हूँ,” वह कहती है। “बीच में हमेशा जगह थी। मैं उसे पत्थर के कारण देख नहीं पाती थी।”
    failure:
      en: 'The line stays joined. {{ओऽ}} from {{अः + अ}}: {{बालः अयम्}}.'
      hi: 'पंक्ति जुड़ी रहती है। {{ओऽ}}, {{अः + अ}} से: {{बालः अयम्}}।'
  options:
  - sa: बालम् + अयम्
  - sa: बालु + अयम्
  - correct: true
    sa: बालः + अयम्

  passage:
  - sa: काव्यशास्त्रविनोदेन कालो गच्छति धीमताम्
    meaning:
      en: “The wise pass their time in the delight of poetry and learning.” (Vetālapañcaviṃśatikā, introduction)
      hi: “बुद्धिमानों का समय काव्य और शास्त्र के आनन्द में बीतता है।” (वेतालपञ्चविंशतिका, भूमिका)
    words:
    - sa: काव्यशास्त्रविनोदेन
      gloss:
        en: by the delight of poetry and learning
        hi: काव्य-शास्त्र के आनन्द से
    - sa: कालः
      gloss:
        en: time
        hi: समय (कालः + गच्छति → कालो गच्छति)
    - sa: गच्छति
      gloss:
        en: goes, passes
        hi: बीतता है
    - sa: धीमताम्
      gloss:
        en: of the wise
        hi: बुद्धिमानों का
  - sa: तदा राजा साश्चर्यो बभूव
    meaning:
      en: “Then the king was astonished.” (Vetālapañcaviṃśatikā, introduction)
      hi: “तब राजा आश्चर्य से भर गया।” (वेतालपञ्चविंशतिका, भूमिका)
    words:
    - sa: तदा
      gloss:
        en: then
        hi: तब
    - sa: राजा
      gloss:
        en: the king
        hi: राजा
    - sa: साश्चर्यः
      gloss:
        en: astonished (सः + आश्चर्यः)
        hi: चकित (स + आश्चर्य)
    - sa: बभूव
      gloss:
        en: became
        hi: हो गया
  - sa: एकश्रुतधरः प्राप्तो बालो ऽयं तनयस्तव
    meaning:
      en: '“A boy who holds what he hears once has been found: this son of yours.” (Kathāsaritsāgara 1.2)'
      hi: '“एक बार सुना धारण करने वाला बालक मिल गया: यह तुम्हारा पुत्र।” (कथासरित्सागर 1.2)'
    words:

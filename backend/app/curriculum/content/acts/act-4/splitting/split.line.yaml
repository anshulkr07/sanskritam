- id: s1
  kind: story
  title:
    en: The fourteenth statue
    hi: चौदहवीं प्रतिमा
  depth: core
  image:
    brief: The fourteenth statue with a long carved line running across her stone base; Dādī taking the chisel from the statue's
      hand and marking gaps between words; Lubdhaka's foreman standing back with his arms folded; Śuka reading over her shoulder.
    alt:
      en: An old woman marks gaps between words in a carved line across a statue's base
      hi: दादी प्रतिमा के आसन पर खुदी पंक्ति में शब्दों के बीच अन्तराल बनाती
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - vicchedika
    place: simhasana-shala
    ratio: '4:3'
    id: split-line-s1
    text_in_image:
    - काव्यशास्त्रविनोदेन कालो गच्छति धीमताम्
  narration:
    en: 'The fourteenth statue holds a whole line, carved across her base. “Not one word,” she says. “A line. A real one,
      from the old tales.” Lubdhaka''s foreman steps back. “That is a sentence,” he says, and nobody laughs, because he is
      right: it is joined all the way along. Dādī takes the chisel. “Word by word. That is called padaccheda.”'
    hi: 'चौदहवीं प्रतिमा के आसन पर आर-पार एक पूरी पंक्ति खुदी है। “एक शब्द नहीं,” वह कहती है। “एक पंक्ति। पुरानी कथाओं से,
      असली।” लुब्धक का मुखिया पीछे हटता है। “यह तो पूरा वाक्य है,” वह कहता है, और कोई नहीं हँसता, क्योंकि वह ठीक कहता है:
      वह पूरी लम्बाई में जुड़ा है। दादी छेनी लेती हैं। “शब्द-शब्द। इसे पदच्छेद कहते हैं।”'
- id: t1
  kind: teach
  title:
    en: Padaccheda
    hi: पदच्छेद
  depth: core
  skills:
  - sandhi.padaccheda
  body:
    en: 'A real line often has several joins. Take them one at a time, from the left: find the first joined sound, split it,
      check both words, and carry on. Then write the line with spaces. This is {{पदच्छेदः}}. After it comes the meaning.'
    hi: 'असली पंक्ति में अक्सर कई सन्धियाँ होती हैं। उन्हें बाएँ से एक-एक करके लीजिए: पहली जुड़ी ध्वनि खोजिए, उसे तोड़िए,
      दोनों शब्द जाँचिए, और आगे बढ़िए। फिर पंक्ति को अन्तराल के साथ लिखिए। यह {{पदच्छेदः}} है। उसके बाद अर्थ आता है।'
  term:
    sa: पदच्छेदः
    meaning:
      en: splitting a line into words
      hi: पंक्ति को शब्दों में तोड़ना
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'A real line often has several joins. Take them one at a time, from the left: find the first joined sound, split
        it, check both words, and carry on. Then write the line with spaces. This is {{पदच्छेदः}}. After it comes the meaning.'
      hi: 'असली पंक्ति में अक्सर कई सन्धियाँ होती हैं। उन्हें बाएँ से एक-एक करके लीजिए: पहली जुड़ी ध्वनि खोजिए, उसे तोड़िए,
        दोनों शब्द जाँचिए, और आगे बढ़िए। फिर पंक्ति को अन्तराल के साथ लिखिए। यह {{पदच्छेदः}} है। उसके बाद अर्थ आता है।'
    items:
    - id: i0
      sa: पदच्छेदः

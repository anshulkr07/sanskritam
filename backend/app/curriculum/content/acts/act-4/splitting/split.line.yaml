      gloss:
        en: who holds what he hears once
        hi: एक बार सुना धारण करने वाला
    - sa: प्राप्तः
      gloss:
        en: found
        hi: मिला
    - sa: बालः
      gloss:
        en: boy
        hi: बालक
    - sa: अयम्
      gloss:
        en: this
        hi: यह
    - sa: तनयः
      gloss:
        en: son
        hi: पुत्र
    - sa: तव
      gloss:
        en: your
        hi: तुम्हारा

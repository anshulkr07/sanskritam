- id: pn
  kind: teach
  title:
    en: Reading order
    hi: पढ़ने का क्रम
  depth: panini
  skills:
  - sandhi.padaccheda
  body:
    en: 'After padaccheda comes {{अन्वयः}}, putting the words in prose order, and then the meaning. For now, you have the
      first step: you can see where every word begins and ends.'
    hi: 'पदच्छेद के बाद {{अन्वयः}} आता है, शब्दों को गद्य के क्रम में रखना, और फिर अर्थ। अभी आपके पास पहला चरण है: आप देख
      सकते हैं कि हर शब्द कहाँ शुरू और कहाँ समाप्त होता है।'

- id: pn
  kind: teach
  title:
    en: Pāṇini's not and maker
    hi: पाणिनि का न और बनाने वाला
  depth: panini
  skills:
  - sam.nan-upapada
  sutras:
  - 2.2.6
  - 6.3.73
  - 6.3.74
  - 2.2.19
  - 3.2.1
  body:
    en: 'Sūtra 2.2.6, {{नञ्}}, joins {{नञ्}}, “not”, to the following word as a compound. 6.3.73, {{नलोपो नञः}}, drops its
      {{न्}}, and 6.3.74, {{तस्मान्नुडचि}}, adds {{न्}} before a vowel. For the maker, 2.2.19, {{उपपदमतिङ्}}, joins the word
      that stands next to a verb-noun, and 3.2.1, {{कर्मण्यण्}}, makes the doer: {{कुम्भकारः}}.'
    hi: 'सूत्र 2.2.6, {{नञ्}}, {{नञ्}}, ‘नहीं’, को अगले शब्द से समास में जोड़ता है। 6.3.73, {{नलोपो नञः}}, उसका {{न्}} हटाता
      है, और 6.3.74, {{तस्मान्नुडचि}}, स्वर से पहले {{न्}} जोड़ता है। बनाने वाले के लिए 2.2.19, {{उपपदमतिङ्}}, कृदन्त के पास
      खड़े शब्द को जोड़ता है, और 3.2.1, {{कर्मण्यण्}}, कर्ता बनाता है: {{कुम्भकारः}}।'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'Sūtra 2.2.6, {{नञ्}}, joins {{नञ्}}, “not”, to the following word as a compound. 6.3.73, {{नलोपो नञः}}, drops its
        {{न्}}, and 6.3.74, {{तस्मान्नुडचि}}, adds {{न्}} before a vowel. For the maker, 2.2.19, {{उपपदमतिङ्}}, joins the
        word that stands next to a verb-noun, and 3.2.1, {{कर्मण्यण्}}, makes the doer: {{कुम्भकारः}}.'
      hi: 'सूत्र 2.2.6, {{नञ्}}, {{नञ्}}, ‘नहीं’, को अगले शब्द से समास में जोड़ता है। 6.3.73, {{नलोपो नञः}}, उसका {{न्}} हटाता
        है, और 6.3.74, {{तस्मान्नुडचि}}, स्वर से पहले {{न्}} जोड़ता है। बनाने वाले के लिए 2.2.19, {{उपपदमतिङ्}}, कृदन्त के
        पास खड़े शब्द को जोड़ता है, और 3.2.1, {{कर्मण्यण्}}, कर्ता बनाता है: {{कुम्भकारः}}।'

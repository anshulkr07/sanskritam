- id: s1
  kind: story
  title:
    en: The eighteenth statue
    hi: अठारहवीं प्रतिमा
  depth: core
  image:
    brief: The eighteenth statue holding a clay pot, tapping it with one finger; a potter's wheel carved at her feet; Śuka
      cocking his head; Lubdhaka's foreman holding up his notebook to show a column of compounds.
    alt:
      en: A statue taps a clay pot beside a carved potter's wheel while a man holds up a notebook of compounds
      hi: मिट्टी के घड़े पर थपथपाती प्रतिमा, कुम्हार का चाक, समासों की पुस्तिका दिखाता आदमी
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - samasika
    place: simhasana-shala
    ratio: '4:3'
    id: c1-nan-s1
    text_in_image:
    - असत्यम्
    - अधर्मः
    - अनन्तः
  narration:
    en: 'The eighteenth statue holds a clay pot. “कुम्भकारः,” she says, tapping it: “the pot-maker.” “असत्यम्,” and she shakes
      her head: “not true.” “These are the last two kinds,” says Dādī. “A न before a word makes its opposite, अ-. And a word
      like -कारः after a thing means ‘the one who makes it’, a compound with the doer in the second place.”'
    hi: 'अठारहवीं प्रतिमा के हाथ में मिट्टी का घड़ा है। “कुम्भकारः,” वह कहती है, उस पर थपथपाते हुए: “घड़ा बनाने वाला।” “असत्यम्,”
      और वह सिर हिलाती है: “सच नहीं।” “ये अन्तिम दो प्रकार हैं,” दादी कहती हैं। “शब्द के आगे न उसका उलटा बनाता है, अ-। और
      किसी वस्तु के बाद -कारः जैसा शब्द ‘उसे बनाने वाला’ का अर्थ देता है, दूसरे स्थान पर कर्ता वाला समास।”'
  lines:
  - speaker: samasika
    sa: कुम्भकारः
    gloss:
      en: The pot-maker.
      hi: कुम्हार।
    check:
      type: subanta
      stem: कुम्भकार
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
- id: t1
  kind: teach
  title:
    en: Not-X and X-maker
    hi: क नहीं और क बनाने वाला
  depth: core
  skills:
  - sam.nan-upapada
  body:
    en: 'A {{न}} before a word makes the opposite: {{न सत्यम्}} gives {{असत्यम्}} (untrue); before a vowel it is {{अन्}}:
      {{न अन्तः}} gives {{अनन्तः}} (endless). A word before a doer-word names the thing done: {{कुम्भं करोति}} gives {{कुम्भकारः}}
      (pot-maker); {{शास्त्रं जानाति}} gives {{शास्त्रज्ञः}} (knower of the śāstras).'
    hi: 'शब्द के आगे {{न}} उसका उलटा बनाता है: {{न सत्यम्}} से {{असत्यम्}} (झूठ); स्वर से पहले वह {{अन्}} होता है: {{न अन्तः}}
      से {{अनन्तः}} (अनन्त)। कर्ता-शब्द के आगे का शब्द बताता है कि क्या किया जाता है: {{कुम्भं करोति}} से {{कुम्भकारः}} (घड़ा
      बनाने वाला); {{शास्त्रं जानाति}} से {{शास्त्रज्ञः}} (शास्त्रों का ज्ञाता)।'
  term:
    sa: नञ्तत्पुरुषः
    meaning:
      en: a compound with न, “not”
      hi: न, ‘नहीं’ वाला समास
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'A {{न}} before a word makes the opposite: {{न सत्यम्}} gives {{असत्यम्}} (untrue); before a vowel it is {{अन्}}:
        {{न अन्तः}} gives {{अनन्तः}} (endless). A word before a doer-word names the thing done: {{कुम्भं करोति}} gives {{कुम्भकारः}}
        (pot-maker); {{शास्त्रं जानाति}} gives {{शास्त्रज्ञः}} (knower of the śāstras).'
      hi: 'शब्द के आगे {{न}} उसका उलटा बनाता है: {{न सत्यम्}} से {{असत्यम्}} (झूठ); स्वर से पहले वह {{अन्}} होता है: {{न अन्तः}}
        से {{अनन्तः}} (अनन्त)। कर्ता-शब्द के आगे का शब्द बताता है कि क्या किया जाता है: {{कुम्भं करोति}} से {{कुम्भकारः}}
        (घड़ा बनाने वाला); {{शास्त्रं जानाति}} से {{शास्त्रज्ञः}} (शास्त्रों का ज्ञाता)।'

- id: p4
  kind: practice
  title:
    en: The pot
    hi: घड़ा
  depth: core
  skills:
  - sam.nan-upapada
  mode: choice
  prompt:
    en: '{{अनन्तः}} unpacks as…'
    hi: '{{अनन्तः}} का विग्रह…'
  explain:
    en: '{{न}} + {{अन्तः}}: {{अन्-}} before a vowel.'
    hi: '{{न}} + {{अन्तः}}: स्वर से पहले {{अन्-}}।'
  roman: after
  gate: true
  story:
    success:
      en: “न अन्तः, अनन्तः,” you say, “endless,” and the clay pot in the statue's hand, which has been closed at the mouth
        for a thousand years, opens. Out of it comes not water, nor grain, but a long, soft, smooth sound, rising, without
        edge or end. “असत्यम्,” she says, shaking her head, once more, smiling now. “Nothing here is not true.” Samāsikā steps
        out of the pair behind her, a small granite figure with two lotuses, and takes her hand.
      hi: “न अन्तः, अनन्तः,” आप कहते हैं, “अनन्त,” और प्रतिमा के हाथ का मिट्टी का घड़ा, जो हज़ार वर्षों से मुँह बन्द था, खुल
        जाता है। उसमें से न पानी निकलता है, न अनाज, बल्कि एक लम्बी, कोमल, चिकनी ध्वनि, ऊपर उठती, बिना किनारे या अन्त के। “असत्यम्,”
        वह कहती है, एक बार फिर सिर हिलाते, अब मुस्कराते हुए। “यहाँ कुछ भी असत्य नहीं।” समासिका उसके पीछे की जोड़ी से बाहर
        आती है, दो कमलों वाली नन्ही ग्रेनाइट आकृति, और उसका हाथ थाम लेती है।
    failure:
      en: The pot stays closed. {{न}} + {{अन्तः}} gives {{अनन्तः}}.
      hi: घड़ा बन्द रहता है। {{न}} + {{अन्तः}} से {{अनन्तः}}।
  options:
  - sa: न नन्तः
  - sa: अ अन्तः
  - correct: true
    sa: न अन्तः
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'A {{न}} before a word makes the opposite: {{न सत्यम्}} gives {{असत्यम्}} (untrue); before a vowel it is {{अन्}}:
        {{न अन्तः}} gives {{अनन्तः}} (endless). A word before a doer-word names the thing done: {{कुम्भं करोति}} gives {{कुम्भकारः}}
        (pot-maker); {{शास्त्रं जानाति}} gives {{शास्त्रज्ञः}} (knower of the śāstras).'
      hi: 'शब्द के आगे {{न}} उसका उलटा बनाता है: {{न सत्यम्}} से {{असत्यम्}} (झूठ); स्वर से पहले वह {{अन्}} होता है: {{न अन्तः}}
        से {{अनन्तः}} (अनन्त)। कर्ता-शब्द के आगे का शब्द बताता है कि क्या किया जाता है: {{कुम्भं करोति}} से {{कुम्भकारः}}
        (घड़ा बनाने वाला); {{शास्त्रं जानाति}} से {{शास्त्रज्ञः}} (शास्त्रों का ज्ञाता)।'
    items:

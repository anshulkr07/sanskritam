- id: conditions
  kind: revision
  title:
    en: How to tell which
    hi: कैसे पहचानें कि कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: sam.dvandva
    rule:
      en: 'Ask: does it mean “and”? Then a dvandva.'
      hi: 'पूछिए: क्या इसका अर्थ ‘और’ है? तब द्वन्द्व।'
    tag: good
    taught_in: c1.dvandva#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'A compound is a word made of two or more words, with the endings of the first left off. A {{द्वन्द्वः}} means
          “and”: {{रामः च लक्ष्मणः च}} becomes {{रामलक्ष्मणौ}}. The compound takes the number of the whole: dual for two,
          plural for several. A set of things is neuter singular: {{पाणिपादम्}}, “hands and feet”.'
        hi: 'समास दो या अधिक शब्दों से बना एक शब्द है, जिसमें पहले शब्दों के प्रत्यय छूट जाते हैं। {{द्वन्द्वः}} का अर्थ ‘और’
          है: {{रामः च लक्ष्मणः च}} से {{रामलक्ष्मणौ}}। समास पूरे का वचन लेता है: दो के लिए द्विवचन, कई के लिए बहुवचन। वस्तुओं
          का समूह नपुंसक एकवचन होता है: {{पाणिपादम्}}, ‘हाथ और पैर’।'
      items:
      - id: i0
        sa: द्वन्द्वः
      - id: i1
        sa: रामः च लक्ष्मणः च
      - id: i2
        sa: रामलक्ष्मणौ
      - id: i3
        sa: पाणिपादम्
  - skill: sam.tatpurusha
    rule:
      en: 'Ask: is the first word “of”, “to”, “by” the second? Then a tatpuruṣa.'
      hi: 'पूछिए: क्या पहला शब्द दूसरे का ‘का’, ‘को’, ‘से’ है? तब तत्पुरुष।'
    tag: good
    taught_in: c1.tatpurusha#t1
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'In a {{तत्पुरुषः}} the first word relates to the second as a case would: {{राज्ञः पुरुषः}}, “the king''s man”,
          becomes {{राजपुरुषः}}. The case may be any of seven: {{ग्रामगतः}} (gone to the village), {{वृक्षमूलम्}} (root of
          a tree), {{विद्यालयः}} (house of learning). The second word gives the gender and ending.'
        hi: '{{तत्पुरुषः}} में पहला शब्द दूसरे से वैसे सम्बन्धित होता है जैसे कोई विभक्ति: {{राज्ञः पुरुषः}}, ‘राजा का पुरुष’,
          से {{राजपुरुषः}}। विभक्ति सात में से कोई भी हो सकती है: {{ग्रामगतः}} (गाँव गया हुआ), {{वृक्षमूलम्}} (वृक्ष की जड़),
          {{विद्यालयः}} (विद्या का घर)। दूसरा शब्द लिंग और प्रत्यय देता है।'
      items:
      - id: i0
        sa: तत्पुरुषः
      - id: i1
        sa: राज्ञः पुरुषः
      - id: i2
        sa: राजपुरुषः
      - id: i3
        sa: ग्रामगतः
      - id: i4
        sa: वृक्षमूलम्
      - id: i5
        sa: विद्यालयः
  - skill: sam.karmadharaya
    rule:
      en: 'Ask: does the first word describe or count the second? Then a karmadhāraya or dvigu.'
      hi: 'पूछिए: क्या पहला शब्द दूसरे का वर्णन या गिनती करता है? तब कर्मधारय या द्विगु।'
    tag: good
    taught_in: c1.karmadharaya#t1
    visuals:
    - id: v-linked-2
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'In a {{कर्मधारयः}} the first word describes the second: {{नीलम् उत्पलम्}} gives {{नीलोत्पलम्}} (blue lotus);
          {{महान् आत्मा}} gives {{महात्मा}} (great soul). In a {{द्विगुः}} a number counts a group: {{त्रयाणां लोकानां समाहारः}}
          gives {{त्रिलोकी}} (the three worlds), {{अष्टानाम् अध्यायानां समाहारः}} gives {{अष्टाध्यायी}} (the eight chapters,
          Pāṇini''s book).'
        hi: '{{कर्मधारयः}} में पहला शब्द दूसरे का वर्णन करता है: {{नीलम् उत्पलम्}} से {{नीलोत्पलम्}} (नीला कमल); {{महान् आत्मा}}
          से {{महात्मा}} (महान् आत्मा)। {{द्विगुः}} में संख्या एक समूह गिनती है: {{त्रयाणां लोकानां समाहारः}} से {{त्रिलोकी}}
          (तीन लोक), {{अष्टानाम् अध्यायानां समाहारः}} से {{अष्टाध्यायी}} (आठ अध्याय, पाणिनि की पुस्तक)।'
      items:

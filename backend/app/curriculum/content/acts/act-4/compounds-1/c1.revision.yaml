- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: sam.dvandva
    rule:
      en: '{{चार्थे द्वन्द्वः}}: dvandva. {{तत्पुरुषः}}, {{षष्ठी}}: tatpuruṣa. {{संख्यापूर्वो द्विगुः}}: dvigu. {{नञ्}}: nañ.'
      hi: '{{चार्थे द्वन्द्वः}}: द्वन्द्व। {{तत्पुरुषः}}, {{षष्ठी}}: तत्पुरुष। {{संख्यापूर्वो द्विगुः}}: द्विगु। {{नञ्}}:
        नञ्।'
    sutras:
    - 2.2.29
    - 2.1.22
    - 2.2.8
    - 2.1.52
    - 2.2.6
    tag: core
    taught_in: c1.dvandva#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 2.2.29, {{चार्थे द्वन्द्वः}}, says that words joined with the sense of {{च}} (and) form a {{द्वन्द्वः}}.
          2.2.30, {{उपसर्जनं पूर्वम्}}, says the subordinate word goes first; and 2.1.22, {{तत्पुरुषः}}, 2.1.4, {{सह सुपा}},
          say every compound is made by joining with the case endings.
        hi: सूत्र 2.2.29, {{चार्थे द्वन्द्वः}}, कहता है कि {{च}} (और) के अर्थ में जुड़े शब्द {{द्वन्द्वः}} बनाते हैं। 2.2.30,
          {{उपसर्जनं पूर्वम्}}, कहता है कि गौण शब्द पहले रखा जाता है; और 2.1.4, {{सह सुपा}}, कहता है कि हर समास विभक्ति-सहित
          शब्दों को जोड़कर बनता है।
      items:

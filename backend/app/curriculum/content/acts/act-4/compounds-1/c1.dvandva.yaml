    - dadi
    - shuka
    - lubdhaka
    - samasika
    place: simhasana-shala
    ratio: '4:3'
    id: c1-dvandva-s1
  narration:
    en: 'The fifteenth statue is two figures standing back to back, one holding a lotus, the other a bow. Their plinth reads one long name: “रामलक्ष्मणौ.” “One name,” says Śuka, “for two people.” “It is a compound,” says Dādī. “Two words packed into one so that they walk together. This kind means ‘and’: Rāma and Lakṣmaṇa. We call it dvandva, the pair.”'
    hi: 'पन्द्रहवीं प्रतिमा पीठ से पीठ टिकाए दो आकृतियाँ हैं, एक के हाथ में कमल, दूसरी के हाथ में धनुष। उनके आसन पर एक लम्बा नाम लिखा है: “रामलक्ष्मणौ।” “एक नाम,” शुक कहता है, “दो व्यक्तियों के लिए।” “यह समास है,” दादी कहती हैं। “दो शब्द एक में बँधे ताकि वे साथ चलें। इस प्रकार का अर्थ ‘और’ है: राम और लक्ष्मण। इसे द्वन्द्व कहते हैं, जोड़ी।”'
  lines:
  - speaker: dadi
    sa: रामः च लक्ष्मणः च = रामलक्ष्मणौ।
    gloss:
      en: Rāma and Lakṣmaṇa = Rāma-Lakṣmaṇa.
      hi: राम और लक्ष्मण = रामलक्ष्मण।
- id: t1
  kind: teach
  title:
    en: The pair
    hi: जोड़ी
  depth: core
  skills:
  - sam.dvandva
  body:
    en: 'A compound is a word made of two or more words, with the endings of the first left off. A {{द्वन्द्वः}} means “and”: {{रामः च लक्ष्मणः च}} becomes {{रामलक्ष्मणौ}}. The compound takes the number of the whole: dual for two, plural for several. A set of things is neuter singular: {{पाणिपादम्}}, “hands and feet”.'
    hi: 'समास दो या अधिक शब्दों से बना एक शब्द है, जिसमें पहले शब्दों के प्रत्यय छूट जाते हैं। {{द्वन्द्वः}} का अर्थ ‘और’ है: {{रामः च लक्ष्मणः च}} से {{रामलक्ष्मणौ}}। समास पूरे का वचन लेता है: दो के लिए द्विवचन, कई के लिए बहुवचन। वस्तुओं का समूह नपुंसक एकवचन होता है: {{पाणिपादम्}}, ‘हाथ और पैर’।'
  term:
    sa: समासः
    meaning:
      en: a compound word
      hi: समस्त शब्द

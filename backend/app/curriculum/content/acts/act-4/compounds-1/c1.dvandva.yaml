      en: Four
      hi: चार
- id: pn
  kind: teach
  title:
    en: Pāṇini's pair
    hi: पाणिनि की जोड़ी
  depth: panini
  skills:
  - sam.dvandva
  sutras:
  - 2.2.29
  - 2.2.30
  - 2.1.4
  body:
    en: Sūtra 2.2.29, {{चार्थे द्वन्द्वः}}, says that words joined with the sense of {{च}} (and) form a {{द्वन्द्वः}}. 2.2.30, {{उपसर्जनं पूर्वम्}}, says the subordinate word goes first; and 2.1.22, {{तत्पुरुषः}}, 2.1.4, {{सह सुपा}}, say every compound is made by joining with the case endings.
    hi: सूत्र 2.2.29, {{चार्थे द्वन्द्वः}}, कहता है कि {{च}} (और) के अर्थ में जुड़े शब्द {{द्वन्द्वः}} बनाते हैं। 2.2.30, {{उपसर्जनं पूर्वम्}}, कहता है कि गौण शब्द पहले रखा जाता है; और 2.1.4, {{सह सुपा}}, कहता है कि हर समास विभक्ति-सहित शब्दों को जोड़कर बनता है।

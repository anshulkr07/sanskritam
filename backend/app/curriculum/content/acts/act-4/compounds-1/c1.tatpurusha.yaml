- id: s1
  kind: story
  title:
    en: The sixteenth statue
    hi: सोलहवीं प्रतिमा
  depth: core
  image:
    brief: The sixteenth statue holding a staff, a king's crown carved at her feet; Lubdhaka's foreman writing in his notebook; Dādī shaking her head gently and tapping the word; Śuka reading over his shoulder.
    alt:
      en: A statue holds a staff while an old woman gently corrects a man's notebook
      hi: दण्ड थामे प्रतिमा, आदमी की पुस्तिका सुधारती दादी
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - samasika
    place: simhasana-shala
    ratio: '4:3'
    id: c1-tatpurusha-s1
  narration:
    en: 'The sixteenth statue holds a staff. “राजपुरुषः,” she says. “Rāja-puruṣaḥ.” Lubdhaka''s foreman, who has begun to follow along with his notebook, writes: ‘the king, the man’. “No,” says Dādī. “The king''s man. The first word stands for a case ending that has been left off: here, ‘of’. Each of the seven cases can hide in the first half of a compound like this.”'
    hi: 'सोलहवीं प्रतिमा के हाथ में दण्ड है। “राजपुरुषः,” वह कहती है। “राज-पुरुषः।” लुब्धक का मुखिया, जो अब अपनी पुस्तिका लिए पीछे-पीछे चलने लगा है, लिखता है: ‘राजा, पुरुष’। “नहीं,” दादी कहती हैं। “राजा का पुरुष। पहला शब्द एक ऐसे विभक्ति-प्रत्यय का स्थान लेता है जो छूट गया है: यहाँ, ‘का’। सातों विभक्तियाँ इस तरह के समास के पहले भाग में छिप सकती हैं।”'
- id: t1
  kind: teach
  title:
    en: X's Y
    hi: क का ख
  depth: core
  skills:
  - sam.tatpurusha
  body:
    en: 'In a {{तत्पुरुषः}} the first word relates to the second as a case would: {{राज्ञः पुरुषः}}, “the king''s man”, becomes {{राजपुरुषः}}. The case may be any of seven: {{ग्रामगतः}} (gone to the village), {{वृक्षमूलम्}} (root of a tree), {{विद्यालयः}} (house of learning). The second word gives the gender and ending.'
    hi: '{{तत्पुरुषः}} में पहला शब्द दूसरे से वैसे सम्बन्धित होता है जैसे कोई विभक्ति: {{राज्ञः पुरुषः}}, ‘राजा का पुरुष’, से {{राजपुरुषः}}। विभक्ति सात में से कोई भी हो सकती है: {{ग्रामगतः}} (गाँव गया हुआ), {{वृक्षमूलम्}} (वृक्ष की जड़), {{विद्यालयः}} (विद्या का घर)। दूसरा शब्द लिंग और प्रत्यय देता है।'
  term:
    sa: तत्पुरुषः
    meaning:
      en: a compound where the first word stands for a case
      hi: वह समास जिसमें पहला शब्द किसी विभक्ति का स्थान लेता है

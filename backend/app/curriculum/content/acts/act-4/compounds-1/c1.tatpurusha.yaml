- id: p4
  kind: practice
  title:
    en: The staff
    hi: दण्ड
  depth: core
  skills:
  - sam.tatpurusha
  mode: choice
  prompt:
    en: '{{ग्रामगतः}} means…'
    hi: '{{ग्रामगतः}} का अर्थ…'
  explain:
    en: The first word stands for “to the village” (the second case).
    hi: पहला शब्द ‘गाँव को’ (द्वितीया) के स्थान पर है।
  roman: after
  gate: true
  story:
    success:
      en: “ग्रामगतः,” you say, “gone to the village,” and the staff in her hand begins to bud. A single green shoot unfurls at its tip, as if it had remembered that it was once a branch. “राजपुरुषः,” she says. “The king's man. And I am not any longer a thing he holds but a thing that grows.” Lubdhaka's foreman closes his notebook and, after a moment, opens it again to the first page.
      hi: “ग्रामगतः,” आप कहते हैं, “गाँव गया हुआ,” और उसके हाथ का दण्ड अंकुरित होने लगता है। उसकी नोक पर एक हरा अंकुर खुलता है, मानो उसे याद आ गया हो कि वह कभी डाल था। “राजपुरुषः,” वह कहती है। “राजा का पुरुष। और अब मैं उसके हाथ की वस्तु नहीं रही, बल्कि उगने वाली वस्तु हूँ।” लुब्धक का मुखिया अपनी पुस्तिका बन्द करता है और, एक क्षण के बाद, उसे फिर पहले पृष्ठ पर खोलता है।
    failure:
      en: 'The staff stays bare. The first word is “to the village”: {{ग्रामगतः}}.'
      hi: 'दण्ड सूना रहता है। पहला शब्द ‘गाँव को’ है: {{ग्रामगतः}}।'
  options:
  - text:
      en: village and gone
      hi: गाँव और गया
  - text:
      en: of the village, gone
      hi: गाँव का, गया
  - correct: true
    text:
      en: gone to the village
      hi: गाँव को गया हुआ
- id: pn
  kind: teach
  title:
    en: Pāṇini's X's Y
    hi: पाणिनि का क का ख
  depth: panini
  skills:
  - sam.tatpurusha
  sutras:
  - 2.1.22
  - 2.2.8
  - 2.1.24
  body:
    en: 'Sūtra 2.1.22, {{तत्पुरुषः}}, names the class. 2.2.8, {{षष्ठी}}, makes the second case-pair for “of” into a compound: {{राज्ञः पुरुषः}} gives {{राजपुरुषः}}. And 2.1.24, {{द्वितीया श्रितातीतपतितगतात्यस्तप्राप्तापन्नैः}}, joins the second case with words like {{गत}}: {{ग्रामगतः}}.'
    hi: 'सूत्र 2.1.22, {{तत्पुरुषः}}, वर्ग का नाम देता है। 2.2.8, {{षष्ठी}}, ‘का’ वाली षष्ठी को समास बनाता है: {{राज्ञः पुरुषः}} से {{राजपुरुषः}}। और 2.1.24, {{द्वितीया श्रितातीतपतितगतात्यस्तप्राप्तापन्नैः}}, द्वितीया को {{गत}} जैसे शब्दों से जोड़ता है: {{ग्रामगतः}}।'

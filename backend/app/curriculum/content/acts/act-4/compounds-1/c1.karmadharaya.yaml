- id: pn
  kind: teach
  title:
    en: Pāṇini's describing and counting
    hi: पाणिनि का वर्णन और गिनती
  depth: panini
  skills:
  - sam.karmadharaya
  sutras:
  - 1.2.42
  - 2.1.57
  - 2.1.52
  - 2.1.51
  body:
    en: Sūtra 1.2.42, {{तत्पुरुषः समानाधिकरणः कर्मधारयः}}, calls a tatpuruṣa whose members share a case a {{कर्मधारयः}}; 2.1.57,
      {{विशेषणं विशेष्येण बहुलम्}}, joins a describing word to the described. 2.1.52, {{संख्यापूर्वो द्विगुः}}, calls a compound
      with a number first {{द्विगुः}}; 2.1.51 gives its sense of a group.
    hi: सूत्र 1.2.42, {{तत्पुरुषः समानाधिकरणः कर्मधारयः}}, उस तत्पुरुष को {{कर्मधारयः}} कहता है जिसके सदस्यों की विभक्ति एक
      है; 2.1.57, {{विशेषणं विशेष्येण बहुलम्}}, वर्णन करने वाले शब्द को वर्णित से जोड़ता है। 2.1.52, {{संख्यापूर्वो द्विगुः}},
      उस समास को {{द्विगुः}} कहता है जिसमें संख्या पहले है; 2.1.51 उसे समूह का अर्थ देता है।

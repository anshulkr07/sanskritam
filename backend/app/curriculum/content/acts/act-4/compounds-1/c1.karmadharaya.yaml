    en: '{{अष्टाध्यायी}} means…'
    hi: '{{अष्टाध्यायी}} का अर्थ…'
  explain:
    en: 'A number counts a group: a dvigu. It is Pāṇini''s book.'
    hi: 'संख्या एक समूह गिनती है: द्विगु। यह पाणिनि की पुस्तक है।'
  roman: after
  gate: true
  story:
    success:
      en: “अष्टाध्यायी,” you say, and the seventeenth statue's lotus lifts a little, as if at the name of a mountain. “The
        eight chapters,” she says, in a voice that has changed. “That is the name of the book in the last room. Do not forget
        it.” Lubdhaka's foreman writes it down, and underlines it twice, though he has no idea why.
      hi: “अष्टाध्यायी,” आप कहते हैं, और सत्रहवीं प्रतिमा का कमल थोड़ा ऊपर उठ जाता है, मानो किसी पर्वत का नाम सुनकर। “आठ अध्याय,”
        वह कहती है, बदली हुई आवाज़ में। “यह अन्तिम कक्ष की पुस्तक का नाम है। इसे मत भूलिए।” लुब्धक का मुखिया उसे लिखता है
        और दो बार रेखांकित करता है, यद्यपि उसे पता नहीं क्यों।
    failure:
      en: 'The lotus stays still. A number counts a group: {{अष्टाध्यायी}}.'
      hi: 'कमल स्थिर रहता है। संख्या समूह गिनती है: {{अष्टाध्यायी}}।'

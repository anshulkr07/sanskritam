cards:
- id: s1
  kind: story
  title:
    en: The seventeenth statue
    hi: सत्रहवीं प्रतिमा
  depth: core
  image:
    brief: The seventeenth statue holding a blue lotus; behind her a carved trio of small worlds like three bowls; Śuka looking
      from one to the other; Dādī counting on her fingers.
    alt:
      en: A statue holds a blue lotus with three carved bowls behind her while a parrot looks from one to the other
      hi: नीला कमल थामे प्रतिमा, पीछे तीन कटोरे, उन्हें देखता तोता
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - samasika
    place: simhasana-shala
    ratio: '4:3'
    id: c1-karmadharaya-s1
  narration:
    en: 'The seventeenth statue holds a flower. “नीलोत्पलम्,” she says: “a blue lotus.” “महात्मा”: “a great soul.” “त्रिलोकी”:
      “the three worlds.” “These are different,” says Śuka. “Nothing is ‘of’ anything.” “Right,” says Dādī. “In the first
      two, the first word describes the second: blue lotus, great soul. In the third, a number counts a group: three worlds.”'
    hi: 'सत्रहवीं प्रतिमा के हाथ में एक फूल है। “नीलोत्पलम्,” वह कहती है: “नीला कमल।” “महात्मा”: “महान् आत्मा।” “त्रिलोकी”:
      “तीन लोक।” “ये अलग हैं,” शुक कहता है। “कोई किसी का नहीं है।” “ठीक,” दादी कहती हैं। “पहले दो में पहला शब्द दूसरे का वर्णन
      करता है: नीला कमल, महान् आत्मा। तीसरे में संख्या एक समूह गिनती है: तीन लोक।”'
  lines:
  - speaker: samasika
    sa: नीलोत्पलम्
    gloss:
      en: A blue lotus.
      hi: नीला कमल।
    check:
      type: subanta
      stem: नीलोत्पल
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka
- id: t1
  kind: teach
  title:
    en: Describing and counting
    hi: वर्णन और गिनती
  depth: core
  skills:
  - sam.karmadharaya
  body:
    en: 'In a {{कर्मधारयः}} the first word describes the second: {{नीलम् उत्पलम्}} gives {{नीलोत्पलम्}} (blue lotus); {{महान्
      आत्मा}} gives {{महात्मा}} (great soul). In a {{द्विगुः}} a number counts a group: {{त्रयाणां लोकानां समाहारः}} gives
      {{त्रिलोकी}} (the three worlds), {{अष्टानाम् अध्यायानां समाहारः}} gives {{अष्टाध्यायी}} (the eight chapters, Pāṇini''s
      book).'
    hi: '{{कर्मधारयः}} में पहला शब्द दूसरे का वर्णन करता है: {{नीलम् उत्पलम्}} से {{नीलोत्पलम्}} (नीला कमल); {{महान् आत्मा}}
      से {{महात्मा}} (महान् आत्मा)। {{द्विगुः}} में संख्या एक समूह गिनती है: {{त्रयाणां लोकानां समाहारः}} से {{त्रिलोकी}}
      (तीन लोक), {{अष्टानाम् अध्यायानां समाहारः}} से {{अष्टाध्यायी}} (आठ अध्याय, पाणिनि की पुस्तक)।'
  term:
    sa: कर्मधारयः
    meaning:
      en: a compound where the first word describes the second
      hi: वह समास जिसमें पहला शब्द दूसरे का वर्णन करता है
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'In a {{कर्मधारयः}} the first word describes the second: {{नीलम् उत्पलम्}} gives {{नीलोत्पलम्}} (blue lotus); {{महान्
        आत्मा}} gives {{महात्मा}} (great soul). In a {{द्विगुः}} a number counts a group: {{त्रयाणां लोकानां समाहारः}} gives
        {{त्रिलोकी}} (the three worlds), {{अष्टानाम् अध्यायानां समाहारः}} gives {{अष्टाध्यायी}} (the eight chapters, Pāṇini''s
        book).'
      hi: '{{कर्मधारयः}} में पहला शब्द दूसरे का वर्णन करता है: {{नीलम् उत्पलम्}} से {{नीलोत्पलम्}} (नीला कमल); {{महान् आत्मा}}
        से {{महात्मा}} (महान् आत्मा)। {{द्विगुः}} में संख्या एक समूह गिनती है: {{त्रयाणां लोकानां समाहारः}} से {{त्रिलोकी}}
        (तीन लोक), {{अष्टानाम् अध्यायानां समाहारः}} से {{अष्टाध्यायी}} (आठ अध्याय, पाणिनि की पुस्तक)।'

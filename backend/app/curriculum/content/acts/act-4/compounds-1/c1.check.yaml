  mode: choice
  prompt:
    en: '{{राजपुरुषः}} means…'
    hi: '{{राजपुरुषः}} का अर्थ…'
  explain:
    en: 'A tatpuruṣa: “of”.'
    hi: 'तत्पुरुष: ‘का’।'
  roman: after
  options:
  - text:
      en: king and man
      hi: राजा और पुरुष
  - correct: true
    text:
      en: the king's man
      hi: राजा का पुरुष
  - text:
      en: a man like a king
      hi: राजा जैसा पुरुष
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'In a {{तत्पुरुषः}} the first word relates to the second as a case would: {{राज्ञः पुरुषः}}, “the king''s man”,
        becomes {{राजपुरुषः}}. The case may be any of seven: {{ग्रामगतः}} (gone to the village), {{वृक्षमूलम्}} (root of a
        tree), {{विद्यालयः}} (house of learning). The second word gives the gender and ending.'
      hi: '{{तत्पुरुषः}} में पहला शब्द दूसरे से वैसे सम्बन्धित होता है जैसे कोई विभक्ति: {{राज्ञः पुरुषः}}, ‘राजा का पुरुष’,
        से {{राजपुरुषः}}। विभक्ति सात में से कोई भी हो सकती है: {{ग्रामगतः}} (गाँव गया हुआ), {{वृक्षमूलम्}} (वृक्ष की जड़),
        {{विद्यालयः}} (विद्या का घर)। दूसरा शब्द लिंग और प्रत्यय देता है।'
    items:
    - id: i0
      sa: तत्पुरुषः
    - id: i1
      sa: राज्ञः पुरुषः
    - id: i2
      sa: राजपुरुषः
    - id: i3
      sa: ग्रामगतः
    - id: i4
      sa: वृक्षमूलम्
    - id: i5
      sa: विद्यालयः

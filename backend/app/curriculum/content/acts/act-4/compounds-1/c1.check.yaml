- id: p7
  kind: practice
  depth: core
  skills:
  - sam.dvandva
  - sam.tatpurusha
  - sam.karmadharaya
  mode: order
  prompt:
    en: 'Say what Samāsikā says: “Rāma and Lakṣmaṇa; the king''s man; a blue lotus.”'
    hi: 'वह कहिए जो समासिका कहती है: ‘राम और लक्ष्मण; राजा का पुरुष; नीला कमल।’'
  explain:
    en: '{{रामलक्ष्मणौ राजपुरुषः नीलोत्पलम्}}: three kinds of compound.'
    hi: '{{रामलक्ष्मणौ राजपुरुषः नीलोत्पलम्}}: समास के तीन प्रकार।'
  roman: after
  gate: true
  story:
    success:
      en: '“रामलक्ष्मणौ, राजपुरुषः, नीलोत्पलम्,” you say, and Samāsikā, the two-figured granite spirit, steps down, and for the first time the two figures do not hold on to one another. They stand side by side, one with a lotus, one with a bow, and smile. “We are two,” they say, “and we are one name.” In the next alcove a statue lifts her head: a woman with a pale blue throat, carved in a stone the colour of the sky before rain. “नीलकण्ठः,” she says. “Not the blue throat. The one who has it.”'
      hi: '“रामलक्ष्मणौ, राजपुरुषः, नीलोत्पलम्,” आप कहते हैं, और समासिका, दो आकृतियों वाली ग्रेनाइट भूत, उतरती है, और पहली बार दोनों आकृतियाँ एक-दूसरे को थामे नहीं हैं। वे साथ-साथ खड़ी हैं, एक कमल लिए, एक धनुष, और मुस्कराती हैं। “हम दो हैं,” वे कहती हैं, “और हम एक नाम हैं।” अगले आले में एक प्रतिमा सिर उठाती है: हल्के नीले कण्ठ वाली स्त्री, वर्षा से पहले के आकाश के रंग के पत्थर में तराशी हुई। “नीलकण्ठः,” वह कहती है। “नीला कण्ठ नहीं। वह जिसके पास वह है।”'
    failure:
      en: 'The pair stays joined. Her three: {{रामलक्ष्मणौ राजपुरुषः नीलोत्पलम्}}.'
      hi: 'जोड़ी जुड़ी रहती है। उसके तीन: {{रामलक्ष्मणौ राजपुरुषः नीलोत्पलम्}}।'
  tokens:
  - रामलक्ष्मणौ
  - राजपुरुषः
  - नीलोत्पलम्

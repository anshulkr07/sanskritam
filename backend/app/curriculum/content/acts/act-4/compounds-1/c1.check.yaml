  mode: choice
  prompt:
    en: '{{रामलक्ष्मणौ}} means…'
    hi: '{{रामलक्ष्मणौ}} का अर्थ…'
  explain:
    en: 'A dvandva: “and”.'
    hi: 'द्वन्द्व: ‘और’।'
  roman: after
  options:
  - text:
      en: Rāma's Lakṣmaṇa
      hi: राम का लक्ष्मण
  - correct: true
    text:
      en: Rāma and Lakṣmaṇa
      hi: राम और लक्ष्मण
  - text:
      en: the Lakṣmaṇa who is Rāma
      hi: वह लक्ष्मण जो राम है
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'A compound is a word made of two or more words, with the endings of the first left off. A {{द्वन्द्वः}} means “and”:
        {{रामः च लक्ष्मणः च}} becomes {{रामलक्ष्मणौ}}. The compound takes the number of the whole: dual for two, plural for
        several. A set of things is neuter singular: {{पाणिपादम्}}, “hands and feet”.'
      hi: 'समास दो या अधिक शब्दों से बना एक शब्द है, जिसमें पहले शब्दों के प्रत्यय छूट जाते हैं। {{द्वन्द्वः}} का अर्थ ‘और’
        है: {{रामः च लक्ष्मणः च}} से {{रामलक्ष्मणौ}}। समास पूरे का वचन लेता है: दो के लिए द्विवचन, कई के लिए बहुवचन। वस्तुओं
        का समूह नपुंसक एकवचन होता है: {{पाणिपादम्}}, ‘हाथ और पैर’।'
    items:
    - id: i0
      sa: द्वन्द्वः
    - id: i1
      sa: रामः च लक्ष्मणः च
    - id: i2
      sa: रामलक्ष्मणौ
    - id: i3
      sa: पाणिपादम्
- id: p2
  kind: practice

- id: p4
  kind: practice
  title:
    en: The scales
    hi: तराज़ू
  depth: core
  skills:
  - tad.comparison
  mode: choice
  prompt:
    en: '{{प्रियतमः}} means…'
    hi: '{{प्रियतमः}} का अर्थ…'
  explain:
    en: '{{प्रिय}} + {{-तम}}.'
    hi: '{{प्रिय}} + {{-तम}}।'
  roman: after
  gate: true
  story:
    success:
      en: “प्रियतमः,” you say, “dearest,” and both pans of the scales settle, exactly level, with a small sound like a held
        breath let out. “लघुतरः. गरीयान्. प्रियतमः,” says the statue. “Everything has a weight. But it is the word that tells
        you which is more.” Taddhitikā, the green-bronze spirit, steps off the plinth. She is surprisingly light.
      hi: “प्रियतमः,” आप कहते हैं, “सबसे प्रिय,” और तराज़ू के दोनों पलड़े ठीक बराबर बैठ जाते हैं, रोकी साँस छोड़ने जैसी हल्की
        आवाज़ के साथ। “लघुतरः। गरीयान्। प्रियतमः,” प्रतिमा कहती है। “हर चीज़ का एक भार है। पर कौन अधिक है, यह शब्द बताता है।”
        तद्धितिका, हरे काँसे की भूत, आसन से उतरती है। वह आश्चर्यजनक रूप से हल्की है।
    failure:
      en: 'The scales keep tilting. {{-तम}}: dearest: {{प्रियतमः}}.'
      hi: 'तराज़ू झुकता रहता है। {{-तम}}: सबसे प्रिय: {{प्रियतमः}}।'
  options:
  - text:

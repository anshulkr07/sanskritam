- id: pn
  kind: teach
  title:
    en: Pāṇini's more and most
    hi: पाणिनि का अधिक और सबसे अधिक
  depth: panini
  skills:
  - tad.comparison
  sutras:
  - 5.3.57
  - 5.3.55
  - 6.4.157
  body:
    en: 'Sūtra 5.3.57, {{द्विवचनविभज्योपपदे तरबीयसुनौ}}, gives {{तरप्}} and {{ईयसुन्}} when comparing two; 5.3.55, {{अतिशायने
      तमबिष्ठनौ}}, gives {{तमप्}} and {{इष्ठन्}} for “most”. 6.4.157, {{प्रियस्थिरस्फिरोरुबहुलगुरुवृद्धतृप्रदीर्घवृन्दारकाणां
      प्रस्थस्फवर्बंहिगर्वर्षित्रब्द्राघिवृन्दाः}}, replaces the stem of a few adjectives: {{गुरु}} becomes {{गर्}}.'
    hi: 'सूत्र 5.3.57, {{द्विवचनविभज्योपपदे तरबीयसुनौ}}, दो की तुलना में {{तरप्}} और {{ईयसुन्}} देता है; 5.3.55, {{अतिशायने
      तमबिष्ठनौ}}, ‘सबसे अधिक’ के लिए {{तमप्}} और {{इष्ठन्}} देता है। 6.4.157 कुछ विशेषणों का आधार बदल देता है: {{गुरु}} का
      {{गर्}}।'

- id: s1
  kind: story
  title:
    en: The twenty-fifth statue
    hi: पच्चीसवीं प्रतिमा
  depth: core
  image:
    brief: The twenty-fifth statue holding a pair of stone scales that tilt gently; Dādī pointing at the beam; Śuka perched
      on one pan which sinks slightly; Lubdhaka's foreman watching the scales hold his breath.
    alt:
      en: A statue holds stone scales tilting gently while a parrot perches on one pan
      hi: पत्थर का तराज़ू थामे प्रतिमा, एक पलड़े पर बैठा तोता
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - taddhitika
    place: simhasana-shala
    ratio: '4:3'
    id: tad-more-s1
  narration:
    en: 'The twenty-fifth statue holds a pair of scales. “लघुः,” she says: light. “लघुतरः”: lighter. “लघुतमः”: lightest. The
      scales tilt, tilt, tilt. “गुरुः,” she says, and the other pan sinks. “गरीयान्. गरिष्ठः.” Dādī: “Two ways to say more
      and most. One adds -तर and -तम to any word. The other is a special set for a few old adjectives.”'
    hi: 'पच्चीसवीं प्रतिमा के हाथ में तराज़ू है। “लघुः,” वह कहती है: हल्का। “लघुतरः”: अधिक हल्का। “लघुतमः”: सबसे हल्का। तराज़ू
      झुकता है, झुकता है, झुकता है। “गुरुः,” वह कहती है, और दूसरा पलड़ा डूबता है। “गरीयान्। गरिष्ठः।” दादी: “अधिक और सबसे
      अधिक कहने के दो तरीक़े। एक किसी भी शब्द में -तर और -तम जोड़ता है। दूसरा कुछ पुराने विशेषणों का विशेष समूह है।”'
  lines:
  - speaker: taddhitika
    sa: लघुतरः
    gloss:
      en: Lighter.
      hi: अधिक हल्का।
    check:
      type: taddhita
      stem: लघु
      taddhita: tarap
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
- id: t1
  kind: teach
  title:
    en: More and most
    hi: अधिक और सबसे अधिक
  depth: core
  skills:
  - tad.comparison
  body:
    en: '{{-तरः}} means “more”, for two things; {{-तमः}} means “most”, for many: {{लघु}} gives {{लघुतरः}}, {{लघुतमः}}. A few
      adjectives have older forms: {{गुरु}} gives {{गरीयान्}} (heavier), {{गरिष्ठः}} (heaviest); {{प्रिय}} gives {{प्रेयान्}},
      {{प्रेष्ठः}}; {{बहु}} gives {{भूयान्}}, {{भूयिष्ठः}}.'
    hi: '{{-तरः}} का अर्थ ‘अधिक’ है, दो वस्तुओं के लिए; {{-तमः}} का अर्थ ‘सबसे अधिक’ है, कई के लिए: {{लघु}} से {{लघुतरः}},
      {{लघुतमः}}। कुछ विशेषणों के पुराने रूप हैं: {{गुरु}} से {{गरीयान्}} (अधिक भारी), {{गरिष्ठः}} (सबसे भारी); {{प्रिय}}
      से {{प्रेयान्}}, {{प्रेष्ठः}}; {{बहु}} से {{भूयान्}}, {{भूयिष्ठः}}।'
  term:
    sa: तरप् / तमप्
    meaning:
      en: the “more” and “most” suffixes
      hi: ‘अधिक’ और ‘सबसे अधिक’ प्रत्यय
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: '{{-तरः}} means “more”, for two things; {{-तमः}} means “most”, for many: {{लघु}} gives {{लघुतरः}}, {{लघुतमः}}. A
        few adjectives have older forms: {{गुरु}} gives {{गरीयान्}} (heavier), {{गरिष्ठः}} (heaviest); {{प्रिय}} gives {{प्रेयान्}},
        {{प्रेष्ठः}}; {{बहु}} gives {{भूयान्}}, {{भूयिष्ठः}}.'
      hi: '{{-तरः}} का अर्थ ‘अधिक’ है, दो वस्तुओं के लिए; {{-तमः}} का अर्थ ‘सबसे अधिक’ है, कई के लिए: {{लघु}} से {{लघुतरः}},
        {{लघुतमः}}। कुछ विशेषणों के पुराने रूप हैं: {{गुरु}} से {{गरीयान्}} (अधिक भारी), {{गरिष्ठः}} (सबसे भारी); {{प्रिय}}
        से {{प्रेयान्}}, {{प्रेष्ठः}}; {{बहु}} से {{भूयान्}}, {{भूयिष्ठः}}।'

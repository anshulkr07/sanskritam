- id: p7
  kind: practice
  depth: core
  skills:
  - tad.apatya
  - tad.tva-ta
  - tad.matup
  mode: order
  prompt:
    en: 'Say what Taddhitikā says: “Raghu''s descendant; humanity; a rich man.”'
    hi: 'वह कहिए जो तद्धितिका कहती है: ‘रघु का वंशज; मनुष्यता; धनी।’'
  explain:
    en: '{{राघवः मनुष्यत्वम् धनवान्}}: three suffixes.'
    hi: '{{राघवः मनुष्यत्वम् धनवान्}}: तीन प्रत्यय।'
  roman: after
  gate: true
  story:
    success:
      en: “राघवः, मनुष्यत्वम्, धनवान्,” you say, and Taddhitikā, the green-bronze spirit, lowers her tiny crown, and the little
        letters on it, one by one, loosen and settle into her hair like leaves. “Every word I made,” she says, “was made for
        something. Now it knows what.” She looks past you into the next alcove, where a heavy stone statue is holding up a
        hand. “यः पठति,” it says, “सः जानाति.” “Who reads, he knows.” “The last one,” says Dādī, very quietly.
      hi: “राघवः, मनुष्यत्वम्, धनवान्,” आप कहते हैं, और तद्धितिका, हरे काँसे की भूत, अपना नन्हा मुकुट नीचे करती है, और उस
        पर के छोटे अक्षर, एक-एक करके, ढीले होकर उसके बालों में पत्तों की तरह बैठ जाते हैं। “मैंने जो भी शब्द बनाया,” वह कहती
        है, “किसी के लिए बनाया। अब वह जानता है किसके लिए।” वह आपके पार अगले आले की ओर देखती है, जहाँ एक भारी पत्थर की प्रतिमा
        हाथ उठाए खड़ी है। “यः पठति,” वह कहती है, “सः जानाति।” “जो पढ़ता है, वह जानता है।” “अन्तिम,” दादी बहुत धीमे कहती हैं।
    failure:
      en: 'Her crown stays on. Her three: {{राघवः मनुष्यत्वम् धनवान्}}.'
      hi: 'उसका मुकुट बना रहता है। उसके तीन: {{राघवः मनुष्यत्वम् धनवान्}}।'
  tokens:

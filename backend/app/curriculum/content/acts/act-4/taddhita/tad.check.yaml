  prompt:
    en: '{{राघवः}} means…'
    hi: '{{राघवः}} का अर्थ…'
  explain:
    en: '{{तस्यापत्यम्}}.'
    hi: '{{तस्यापत्यम्}}।'
  roman: after
  options:
  - text:
      en: Raghu
      hi: रघु
  - correct: true
    text:
      en: a descendant of Raghu
      hi: रघु का वंशज
  - text:
      en: Raghu's house
      hi: रघु का घर
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'To say “son or descendant of X”, take X, make its first vowel grow (vṛddhi) and add an ending: {{रघु}} gives {{राघवः}},
        {{पाण्डु}} gives {{पाण्डवः}}, {{कुरु}} gives {{कौरवः}}. For a mother''s name in {{-ई}} or {{-आ}} it is {{-एय}}: {{कुन्ती}}
        gives {{कौन्तेयः}}.'
      hi: '‘X का पुत्र या वंशज’ कहने के लिए X लीजिए, उसका पहला स्वर बढ़ाइए (वृद्धि) और प्रत्यय जोड़िए: {{रघु}} से {{राघवः}},
        {{पाण्डु}} से {{पाण्डवः}}, {{कुरु}} से {{कौरवः}}। {{-ई}} या {{-आ}} वाले माता के नाम से {{-एय}} बनता है: {{कुन्ती}}
        से {{कौन्तेयः}}।'

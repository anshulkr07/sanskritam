- id: p4
  kind: practice
  title:
    en: The purse
    hi: थैली
  depth: core
  skills:
  - tad.matup
  - tad.ika
  mode: choice
  prompt:
    en: '{{वैदिकः}} means…'
    hi: '{{वैदिकः}} का अर्थ…'
  explain:
    en: '{{-इक}}: related to.'
    hi: '{{-इक}}: सम्बन्धी।'
  roman: after
  gate: true
  story:
    success:
      en: '“वैदिकः,” you say, “related to the Veda,” and the purse in the statue''s hand opens, and out of it pour, not coins,
        but small bright letters, which hang a moment in the air and assemble: धनवान्, बुद्धिमान्, श्रीमान्, धार्मिकः. “All
        of these,” she says, “carry what they own, or what is theirs.” Lubdhaka''s foreman, who has been looking at the purse
        for some time, reaches for it, then thinks better of it.'
      hi: '“वैदिकः,” आप कहते हैं, “वेद से सम्बन्धित,” और प्रतिमा के हाथ की थैली खुल जाती है, और उसमें से सिक्के नहीं, छोटे
        चमकदार अक्षर बहते हैं, जो क्षण भर हवा में टँगे रहते हैं और जुड़ जाते हैं: धनवान्, बुद्धिमान्, श्रीमान्, धार्मिकः।
        “ये सब,” वह कहती है, “वह ढोते हैं जो इनका है।” लुब्धक का मुखिया, जो काफ़ी देर से थैली को देख रहा था, उसकी ओर हाथ बढ़ाता
        है, फिर बेहतर सोचकर रुक जाता है।'
    failure:
      en: 'The purse stays shut. {{-इक}}: related to: {{वैदिकः}}.'
      hi: 'थैली बन्द रहती है। {{-इक}}: सम्बन्धी: {{वैदिकः}}।'

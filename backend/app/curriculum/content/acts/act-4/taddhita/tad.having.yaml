- id: pn
  kind: teach
  title:
    en: Pāṇini's owner
    hi: पाणिनि का स्वामी
  depth: panini
  skills:
  - tad.matup
  - tad.ika
  sutras:
  - 5.2.94
  - 8.2.9
  - 5.1.18
  - 7.3.50
  body:
    en: Sūtra 5.2.94, {{तदस्यास्त्यस्मिन्निति मतुप्}}, gives {{मतुप्}} to say “he has it”; 8.2.9, {{मादुपधायाश्च मतोर्वोऽयवादिभ्यः}},
      makes it {{वत्}} after a stem with {{म्}}, {{अ}} or {{आ}} before the end. For “related to”, 5.1.18, {{प्राग्वतेष्ठञ्}},
      gives {{ठञ्}}, which 7.3.50, {{ठस्येकः}}, turns into {{इक}}.
    hi: सूत्र 5.2.94, {{तदस्यास्त्यस्मिन्निति मतुप्}}, ‘उसके पास है’ कहने के लिए {{मतुप्}} देता है; 8.2.9, {{मादुपधायाश्च
      मतोर्वोऽयवादिभ्यः}}, म्, अ या आ वाले आधार के बाद उसे {{वत्}} बनाता है। ‘सम्बन्धी’ के लिए 5.1.18, {{प्राग्वतेष्ठञ्}},
      {{ठञ्}} देता है, जिसे 7.3.50, {{ठस्येकः}}, {{इक}} बना देता है।
  visuals:
  - id: v-source-terms

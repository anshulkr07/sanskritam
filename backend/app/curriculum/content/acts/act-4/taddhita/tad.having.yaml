- id: s1
  kind: story
  title:
    en: The twenty-fourth statue
    hi: चौबीसवीं प्रतिमा
  depth: core
  image:
    brief: The twenty-fourth statue holding a small purse of coins that clink; Dādī counting a few on her palm; Śuka trying
      words aloud; Lubdhaka's foreman eyeing the purse hungrily.
    alt:
      en: A statue holds a purse of clinking coins while a man eyes it hungrily
      hi: खनकते सिक्कों की थैली थामे प्रतिमा, लालच से देखता आदमी
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - taddhitika
    place: simhasana-shala
    ratio: '4:3'
    id: tad-having-s1
  narration:
    en: 'The twenty-fourth statue holds a purse of coins. “धनवान्,” she says, and the coins clink: “the one who has wealth.”
      “बुद्धिमान्”: “the one who has intelligence.” “धार्मिकः”: “related to dharma, righteous.” Śuka tries one: “श्रीमान्.”
      “Yes,” says Dādī. “Two small endings. One names the owner of something. The other names what belongs to it.”'
    hi: 'चौबीसवीं प्रतिमा के हाथ में सिक्कों की थैली है। “धनवान्,” वह कहती है, और सिक्के खनकते हैं: “जिसके पास धन है।” “बुद्धिमान्”:
      “जिसके पास बुद्धि है।” “धार्मिकः”: “धर्म से सम्बन्धित, धर्मात्मा।” शुक एक आज़माता है: “श्रीमान्।” “हाँ,” दादी कहती हैं।
      “दो छोटे प्रत्यय। एक किसी वस्तु के स्वामी का नाम बताता है। दूसरा उससे सम्बन्धित का।”'
  lines:
  - speaker: taddhitika
    sa: धनवान्
    gloss:
      en: One who has wealth.
      hi: जिसके पास धन है।
    check:
      type: taddhita
      stem: धन
      taddhita: matup
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
- id: t1
  kind: teach
  title:
    en: Having, and related to
    hi: वाला, और सम्बन्धी
  depth: core
  skills:
  - tad.matup
  - tad.ika
  body:
    en: '{{-वत्}} or {{-मत्}} means “having”: {{धन}} gives {{धनवान्}} (wealthy), {{बुद्धि}} gives {{बुद्धिमान्}} (intelligent);
      the feminine is {{-वती}}, {{-मती}}. After a stem in {{-इ}}, {{-ई}}, {{-उ}} it is {{-मत्}}, otherwise {{-वत्}}. {{-इक}}
      means “related to”: {{धर्म}} gives {{धार्मिकः}}, {{दिन}} gives {{दैनिकः}} (daily).'
    hi: '{{-वत्}} या {{-मत्}} का अर्थ ‘वाला’ है: {{धन}} से {{धनवान्}} (धनी), {{बुद्धि}} से {{बुद्धिमान्}} (बुद्धिमान्); स्त्रीलिंग
      {{-वती}}, {{-मती}}। {{-इ}}, {{-ई}}, {{-उ}} वाले आधार के बाद {{-मत्}} होता है, अन्यथा {{-वत्}}। {{-इक}} का अर्थ ‘सम्बन्धी’
      है: {{धर्म}} से {{धार्मिकः}}, {{दिन}} से {{दैनिकः}} (दैनिक)।'
  term:
    sa: मतुप्
    meaning:
      en: the “having” suffix
      hi: ‘वाला’ प्रत्यय
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: '{{-वत्}} or {{-मत्}} means “having”: {{धन}} gives {{धनवान्}} (wealthy), {{बुद्धि}} gives {{बुद्धिमान्}} (intelligent);
        the feminine is {{-वती}}, {{-मती}}. After a stem in {{-इ}}, {{-ई}}, {{-उ}} it is {{-मत्}}, otherwise {{-वत्}}. {{-इक}}
        means “related to”: {{धर्म}} gives {{धार्मिकः}}, {{दिन}} gives {{दैनिकः}} (daily).'
      hi: '{{-वत्}} या {{-मत्}} का अर्थ ‘वाला’ है: {{धन}} से {{धनवान्}} (धनी), {{बुद्धि}} से {{बुद्धिमान्}} (बुद्धिमान्);

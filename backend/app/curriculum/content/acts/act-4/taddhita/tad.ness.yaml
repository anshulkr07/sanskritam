- id: s1
  kind: story
  title:
    en: The twenty-third statue
    hi: तेईसवीं प्रतिमा
  depth: core
  image:
    brief: 'The twenty-third statue holding a shallow bowl of still water that shivers; Dādī touching the rim; Śuka looking
      into the water at three faces reflected: a man, a god, a stone; lamplight on the water.'
    alt:
      en: A statue holds a bowl of still water shivering, with three reflected faces
      hi: ठहरे जल का कटोरा थामे प्रतिमा, जल में तीन प्रतिबिम्ब
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - taddhitika
    place: simhasana-shala
    ratio: '4:3'
    id: tad-ness-s1
  narration:
    en: 'The twenty-third statue carries a bowl of still water. “मनुष्यत्वम्,” she says, and the water shivers. “Humanness.”
      “देवता”: “divinity.” “गुरुता”: “weight.” “They are all names of a state,” says Dādī. “‘Being a man’, ‘being a god’,
      ‘being heavy’. Add -त्व or -ता to a word and it becomes the name of what it is to be that.”'
    hi: 'तेईसवीं प्रतिमा के हाथ में शान्त जल का कटोरा है। “मनुष्यत्वम्,” वह कहती है, और जल सिहरता है। “मनुष्यता।” “देवता”:
      “देवत्व।” “गुरुता”: “भारीपन।” “ये सब अवस्था के नाम हैं,” दादी कहती हैं। “‘मनुष्य होना’, ‘देव होना’, ‘भारी होना’। किसी
      शब्द में -त्व या -ता जोड़िए और वह उस होने का नाम बन जाता है।”'
  lines:
  - speaker: taddhitika
    sa: मनुष्यत्वम्
    gloss:
      en: Humanness.
      hi: मनुष्य होने का भाव।
    check:
      type: taddhita
      stem: मनुष्य
      taddhita: tva
      linga: Napumsaka
      vibhakti: Prathama
      vacana: Eka
- id: t1
  kind: teach
  title:
    en: The state of being
    hi: होने की अवस्था
  depth: core
  skills:
  - tad.tva-ta
  body:
    en: '{{-त्वम्}} (neuter) and {{-ता}} (feminine) make a word that names the state of being something: {{मनुष्य}} gives
      {{मनुष्यत्वम्}} or {{मनुष्यता}}, “humanity”; {{देव}} gives {{देवत्वम्}} or {{देवता}}, “divinity”; {{गुरु}} gives {{गुरुत्वम्}}
      or {{गुरुता}}, “weight, greatness”. Both mean the same.'
    hi: '{{-त्वम्}} (नपुंसक) और {{-ता}} (स्त्रीलिंग) किसी शब्द से उसके होने की अवस्था का नाम बनाते हैं: {{मनुष्य}} से {{मनुष्यत्वम्}}
      या {{मनुष्यता}}, ‘मनुष्यता’; {{देव}} से {{देवत्वम्}} या {{देवता}}, ‘देवत्व’; {{गुरु}} से {{गुरुत्वम्}} या {{गुरुता}},
      ‘भार, महत्ता’। दोनों का अर्थ एक है।'
  visuals:

- id: pn
  kind: teach
  title:
    en: Pāṇini's state
    hi: पाणिनि की अवस्था
  depth: panini
  skills:
  - tad.tva-ta
  sutras:
  - 5.1.119
  body:
    en: 'Sūtra 5.1.119, {{तस्य भावस्त्वतलौ}}, gives {{त्व}} and {{तल्}} to a word to name its “being”. {{तल्}} makes a feminine
      in {{-ता}} by 4.1.4, and {{त्व}} a neuter. {{महत् + त्व}} doubles: {{महत्त्वम्}}.'
    hi: 'सूत्र 5.1.119, {{तस्य भावस्त्वतलौ}}, किसी शब्द को उसके ‘होने’ का नाम देने के लिए {{त्व}} और {{तल्}} देता है। {{तल्}}
      से स्त्रीलिंग {{-ता}} बनता है और {{त्व}} से नपुंसक। {{महत् + त्व}} में द्वित्व: {{महत्त्वम्}}।'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'Sūtra 5.1.119, {{तस्य भावस्त्वतलौ}}, gives {{त्व}} and {{तल्}} to a word to name its “being”. {{तल्}} makes a feminine
        in {{-ता}} by 4.1.4, and {{त्व}} a neuter. {{महत् + त्व}} doubles: {{महत्त्वम्}}.'
      hi: 'सूत्र 5.1.119, {{तस्य भावस्त्वतलौ}}, किसी शब्द को उसके ‘होने’ का नाम देने के लिए {{त्व}} और {{तल्}} देता है। {{तल्}}
        से स्त्रीलिंग {{-ता}} बनता है और {{त्व}} से नपुंसक। {{महत् + त्व}} में द्वित्व: {{महत्त्वम्}}।'
    items:

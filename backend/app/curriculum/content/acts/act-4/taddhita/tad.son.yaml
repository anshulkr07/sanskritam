- id: p4
  kind: practice
  title:
    en: Descendants
    hi: वंशज
  depth: core
  skills:
  - tad.apatya
  mode: choice
  prompt:
    en: '{{भारत}} in the Gītā line is a taddhita from {{भरत}}. It means…'
    hi: गीता की पंक्ति में {{भारत}}, {{भरत}} से बना तद्धित है। इसका अर्थ…
  explain:
    en: '{{अ}} → {{आ}}: {{भरत}} → {{भारत}}.'
    hi: '{{अ}} → {{आ}}: {{भरत}} → {{भारत}}।'
  roman: after
  gate: true
  story:
    success:
      en: “भारत,” you say, “a descendant of Bharata,” and the mirror in the twenty-second statue's hand ripples. The names settle into rows of children, and each child, the way a face is behind a face, shows its parent behind it, and behind that parent another. “All of these,” she says, “carry somebody.” She lowers the mirror. “So do you.” You think of Dādī.
      hi: “भारत,” आप कहते हैं, “भरत का वंशज,” और बाईसवीं प्रतिमा के हाथ का दर्पण लहराता है। नाम सन्तानों की पंक्तियों में बैठ जाते हैं, और हर सन्तान, चेहरे के पीछे चेहरे की तरह, अपने पीछे अपने माता-पिता को दिखाती है, और उनके पीछे उनके। “इन सबके भीतर,” वह कहती है, “कोई-न-कोई है।” वह दर्पण नीचे करती है। “आपके भी।” आप दादी के बारे में सोचते हैं।
    failure:
      en: 'The mirror stays still. {{भरत}} → {{भारत}}: a descendant.'
      hi: 'दर्पण स्थिर रहता है। {{भरत}} → {{भारत}}: वंशज।'
  options:
  - text:
      en: Bharata himself
      hi: स्वयं भरत
  - correct: true
    text:
      en: descendant of Bharata
      hi: भरत का वंशज
  - text:
      en: Bharata's land only
      hi: केवल भरत की भूमि
- id: pn
  kind: teach
  title:
    en: Pāṇini's descendant
    hi: पाणिनि का वंशज
  depth: panini
  skills:
  - tad.apatya
  sutras:
  - 4.1.92
  - 4.1.83
  - 7.2.117
  - 4.1.95
  - 4.1.120
  body:
    en: Sūtra 4.1.92, {{तस्यापत्यम्}}, gives a taddhita for “his descendant”; 4.1.83, {{प्राग्दीव्यतोऽण्}}, makes {{अण्}} the usual ending, and 7.2.117, {{तद्धितेष्वचामादेः}}, makes the first vowel grow. 4.1.95, {{अत इञ्}}, gives {{इञ्}} after {{अ}}-ending names ({{दाशरथिः}}), and 4.1.120, {{स्त्रीभ्यो ढक्}}, {{ढक्}} after feminines ({{कौन्तेयः}}).
    hi: सूत्र 4.1.92, {{तस्यापत्यम्}}, ‘उसका वंशज’ के लिए तद्धित देता है; 4.1.83, {{प्राग्दीव्यतोऽण्}}, {{अण्}} को सामान्य प्रत्यय बनाता है, और 7.2.117, {{तद्धितेष्वचामादेः}}, पहले स्वर को बढ़ाता है। 4.1.95, {{अत इञ्}}, {{अ}}-अन्त नामों के बाद {{इञ्}} देता है ({{दाशरथिः}}), और 4.1.120, {{स्त्रीभ्यो ढक्}}, स्त्रीलिंग शब्दों के बाद {{ढक्}} ({{कौन्तेयः}})।

- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: tad.apatya
    rule:
      en: '{{तस्यापत्यम्}}: the descendant. {{तस्य भावस्त्वतलौ}}: the state. {{तदस्यास्त्यस्मिन्निति मतुप्}}: the owner.'
      hi: '{{तस्यापत्यम्}}: वंशज। {{तस्य भावस्त्वतलौ}}: अवस्था। {{तदस्यास्त्यस्मिन्निति मतुप्}}: स्वामी।'
    sutras:
    - 4.1.92
    - 5.1.119
    - 5.2.94
    tag: core
    taught_in: tad.son#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 4.1.92, {{तस्यापत्यम्}}, gives a taddhita for “his descendant”; 4.1.83, {{प्राग्दीव्यतोऽण्}}, makes {{अण्}}
          the usual ending, and 7.2.117, {{तद्धितेष्वचामादेः}}, makes the first vowel grow. 4.1.95, {{अत इञ्}}, gives {{इञ्}}
          after {{अ}}-ending names ({{दाशरथिः}}), and 4.1.120, {{स्त्रीभ्यो ढक्}}, {{ढक्}} after feminines ({{कौन्तेयः}}).
        hi: सूत्र 4.1.92, {{तस्यापत्यम्}}, ‘उसका वंशज’ के लिए तद्धित देता है; 4.1.83, {{प्राग्दीव्यतोऽण्}}, {{अण्}} को सामान्य
          प्रत्यय बनाता है, और 7.2.117, {{तद्धितेष्वचामादेः}}, पहले स्वर को बढ़ाता है। 4.1.95, {{अत इञ्}}, {{अ}}-अन्त नामों
          के बाद {{इञ्}} देता है ({{दाशरथिः}}), और 4.1.120, {{स्त्रीभ्यो ढक्}}, स्त्रीलिंग शब्दों के बाद {{ढक्}} ({{कौन्तेयः}})।

- id: core
  kind: revision
  title:
    en: The suffixes
    hi: प्रत्यय
  depth: core
  section: core
  rows:
  - skill: tad.apatya
    rule:
      en: 'Son of: grow the first vowel and add {{-अ}}: {{राघवः}}, {{पाण्डवः}}, {{कौन्तेयः}}, {{भारतः}}.'
      hi: 'का पुत्र: पहला स्वर बढ़ाइए और {{-अ}} जोड़िए: {{राघवः}}, {{पाण्डवः}}, {{कौन्तेयः}}, {{भारतः}}।'
    sutras:
    - 4.1.92
    - 7.2.117
    tag: core
    taught_in: tad.son#tb1
  - skill: tad.tva-ta
    rule:
      en: '-ness: {{-त्वम्}} or {{-ता}}: {{मनुष्यत्वम्}}, {{देवता}}.'
      hi: 'भाव: {{-त्वम्}} या {{-ता}}: {{मनुष्यत्वम्}}, {{देवता}}।'
    sutras:
    - 5.1.119
    tag: core
    taught_in: tad.ness#tb1
  - skill: tad.matup
    rule:
      en: 'Having: {{-वत्}}, {{-मत्}}: {{धनवान्}}, {{बुद्धिमान्}}; feminine {{-वती}}, {{-मती}}.'
      hi: 'वाला: {{-वत्}}, {{-मत्}}: {{धनवान्}}, {{बुद्धिमान्}}; स्त्रीलिंग {{-वती}}, {{-मती}}।'
    sutras:
    - 5.2.94
    - 8.2.9
    tag: core
    taught_in: tad.having#tb1
  - skill: tad.ika
    rule:
      en: 'Related to: {{-इक}}: {{धार्मिकः}}, {{दैनिकः}}.'
      hi: 'सम्बन्धी: {{-इक}}: {{धार्मिकः}}, {{दैनिकः}}।'
    sutras:
    - 5.1.18
    - 7.3.50
    tag: core
    taught_in: tad.having#tb2
  - skill: tad.comparison
    rule:
      en: 'More, most: {{-तर}}, {{-तम}}: {{लघुतरः}}, {{लघुतमः}}; old forms {{गरीयान्}}, {{गरिष्ठः}}.'
      hi: 'अधिक, सबसे अधिक: {{-तर}}, {{-तम}}: {{लघुतरः}}, {{लघुतमः}}; पुराने रूप {{गरीयान्}}, {{गरिष्ठः}}।'
    sutras:
    - 5.3.57
    - 5.3.55
    tag: core
    taught_in: tad.more#tb1
- id: conditions
  kind: revision
  title:
    en: When to use which
    hi: कब कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: tad.tva-ta
    rule:
      en: '{{-त्वम्}} and {{-ता}} mean the same; {{-ता}} is feminine and {{-त्वम्}} neuter.'
      hi: '{{-त्वम्}} और {{-ता}} का अर्थ एक है; {{-ता}} स्त्रीलिंग और {{-त्वम्}} नपुंसक है।'
    tag: good
    taught_in: tad.ness#t1
  - skill: tad.matup
    rule:
      en: '{{-मत्}} after {{-इ}}, {{-उ}}, {{-ई}}; {{-वत्}} otherwise.'
      hi: '{{-इ}}, {{-उ}}, {{-ई}} के बाद {{-मत्}}; अन्यथा {{-वत्}}।'
    tag: good
    taught_in: tad.having#t1
  - skill: tad.comparison
    rule:
      en: '{{-तर}} compares two; {{-तम}} picks from many.'
      hi: '{{-तर}} दो की तुलना करता है; {{-तम}} कई में से चुनता है।'
    tag: good
    taught_in: tad.more#t1

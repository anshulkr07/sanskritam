- id: mistakes
  kind: revision
  title:
    en: Common mistakes
    hi: आम भूलें
  depth: core
  section: mistakes
  rows:
  - skill: tad.apatya
    rule:
      en: 'Do not forget the grown vowel: {{राघवः}}, not {{रघवः}}.'
      hi: 'बढ़ा हुआ स्वर मत भूलिए: {{राघवः}}, {{रघवः}} नहीं।'
    tag: core
    taught_in: tad.son#p1
  - skill: tad.matup
    rule:
      en: 'Do not say {{बुद्धिवान्}}: it is {{बुद्धिमान्}}.'
      hi: '{{बुद्धिवान्}} मत कहिए: यह {{बुद्धिमान्}} है।'
    tag: core
    taught_in: tad.having#p2
- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: tad.apatya
    rule:
      en: '{{तस्यापत्यम्}}: the descendant. {{तस्य भावस्त्वतलौ}}: the state. {{तदस्यास्त्यस्मिन्निति मतुप्}}: the owner.'
      hi: '{{तस्यापत्यम्}}: वंशज। {{तस्य भावस्त्वतलौ}}: अवस्था। {{तदस्यास्त्यस्मिन्निति मतुप्}}: स्वामी।'
    sutras:
    - 4.1.92
    - 5.1.119
    - 5.2.94
    tag: core
    taught_in: tad.son#pn
  - skill: tad.comparison
    rule:
      en: '{{द्विवचनविभज्योपपदे तरबीयसुनौ}} and {{अतिशायने तमबिष्ठनौ}}: more and most.'
      hi: '{{द्विवचनविभज्योपपदे तरबीयसुनौ}} और {{अतिशायने तमबिष्ठनौ}}: अधिक और सबसे अधिक।'
    sutras:
    - 5.3.57
    - 5.3.55
    tag: core
    taught_in: tad.more#pn

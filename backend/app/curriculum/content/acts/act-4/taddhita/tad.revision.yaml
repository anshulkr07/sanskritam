    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: '{{-त्वम्}} (neuter) and {{-ता}} (feminine) make a word that names the state of being something: {{मनुष्य}} gives
          {{मनुष्यत्वम्}} or {{मनुष्यता}}, “humanity”; {{देव}} gives {{देवत्वम्}} or {{देवता}}, “divinity”; {{गुरु}} gives
          {{गुरुत्वम्}} or {{गुरुता}}, “weight, greatness”. Both mean the same.'
        hi: '{{-त्वम्}} (नपुंसक) और {{-ता}} (स्त्रीलिंग) किसी शब्द से उसके होने की अवस्था का नाम बनाते हैं: {{मनुष्य}} से
          {{मनुष्यत्वम्}} या {{मनुष्यता}}, ‘मनुष्यता’; {{देव}} से {{देवत्वम्}} या {{देवता}}, ‘देवत्व’; {{गुरु}} से {{गुरुत्वम्}}
          या {{गुरुता}}, ‘भार, महत्ता’। दोनों का अर्थ एक है।'

    en: '{{सः + बालकः}} gives…'
    hi: '{{सः + बालकः}} से…'
  explain:
    en: '{{सः}} drops its visarga before a consonant.'
    hi: '{{सः}} व्यंजन से पहले विसर्ग छोड़ देता है।'
  roman: after
  gate: true
  story:
    success:
      en: “स बालकः,” you say, “that boy,” and the ninth statue closes her eyes. The breath that she has carried for a thousand years leaves her all at once, not as mist but as a faint warmth, like the last of a sunset. “कविरस्ति,” she says. “The poet is. And I.” She steps down from her plinth, as a spirit of grey marble, and stands beside the other two, who are already waiting.
      hi: “स बालकः,” आप कहते हैं, “वह बालक,” और नौवीं प्रतिमा आँखें बन्द कर लेती है। जो श्वास उसने हज़ार वर्ष ढोई, वह एक साथ उससे निकल जाती है, धुंध नहीं बल्कि हल्की ऊष्मा बनकर, सूर्यास्त के अन्तिम क्षण की तरह। “कविरस्ति,” वह कहती है। “कवि है। और मैं भी।” वह अपने आसन से उतरती है, ग्रे संगमरमर का भूत बनकर, और उन दो के पास खड़ी हो जाती है जो पहले से प्रतीक्षा में हैं।
    failure:
      en: 'She does not move. {{सः}} before a consonant drops its breath: {{स बालकः}}.'
      hi: 'वह हिलती नहीं। व्यंजन से पहले {{सः}} श्वास छोड़ देता है: {{स बालकः}}।'
  options:
  - sa: सः बालकः
  - sa: सो बालकः
  - correct: true
    sa: स बालकः
- id: pn
  kind: teach
  title:
    en: Pāṇini's r and gone
    hi: पाणिनि का र् और लोप
  depth: panini
  skills:
  - sandhi.visarga-r
  sutras:
  - 8.2.66
  - 8.3.15
  - 8.3.17
  - 8.3.19
  - 6.1.132
  body:
    en: The visarga is a changed {{रु}}, so after {{इ}} or {{उ}} the {{र्}} stays before a soft sound (8.2.66, 8.3.15). After {{अ}}, {{आ}}, 8.3.17, {{भोभगघपूर्वस्य योऽशि}}, makes it {{य्}} before a soft sound and 8.3.19, {{लोपः शाकल्यस्य}}, drops it. 6.1.132, {{एतत्तदोः सुलोपोऽकोरनञ्समासे हलि}}, drops the {{सु}} of {{सः}} and {{एषः}} before a consonant.
    hi: विसर्ग बदला हुआ {{रु}} है, इसलिए {{इ}} या {{उ}} के बाद {{र्}} कोमल ध्वनि से पहले रहता है (8.2.66, 8.3.15)। {{अ}}, {{आ}} के बाद 8.3.17, {{भोभगघपूर्वस्य योऽशि}}, उसे कोमल ध्वनि से पहले {{य्}} बनाता है और 8.3.19, {{लोपः शाकल्यस्य}}, उसे हटा देता है। 6.1.132, {{एतत्तदोः सुलोपोऽकोरनञ्समासे हलि}}, व्यंजन से पहले {{सः}} और {{एषः}} का {{सु}} हटा देता है।

- id: s1
  kind: story
  title:
    en: The ninth statue
    hi: नौवीं प्रतिमा
  depth: core
  image:
    brief: The ninth statue with a calm, steady expression, one hand lifted as if to hold a thought; Śuka checking words on his claws; Dādī nodding; the earlier eight statues behind her in the lamplight; the first stars outside the hall.
    alt:
      en: A calm statue with one hand lifted as the lamp-lit hall fills with earlier statues
      hi: शान्त प्रतिमा, एक हाथ उठाए, दीपक-प्रकाशित कक्ष में पिछली प्रतिमाएँ
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - visargika
    place: simhasana-shala
    ratio: '4:3'
    id: vis-r-s1
  narration:
    en: 'The ninth statue speaks in a low, sure voice. “कविरस्ति,” she says: “the poet is.” “स गच्छति”: “he goes.” “Two more things,” says Dādī. “After इ or उ the breath becomes र् before a vowel or a soft sound. And after other vowels it sometimes just vanishes: सः does not keep its breath before most consonants.”'
    hi: 'नौवीं प्रतिमा नीची और दृढ़ आवाज़ में बोलती है। “कविरस्ति,” वह कहती है: “कवि है।” “स गच्छति”: “वह जाता है।” “दो बातें और,” दादी कहती हैं। “इ या उ के बाद श्वास स्वर या कोमल ध्वनि से पहले र् बन जाता है। और अन्य स्वरों के बाद वह कभी-कभी बस लुप्त हो जाता है: सः अधिकतर व्यंजनों से पहले अपनी श्वास नहीं रखता।”'
- id: t1
  kind: teach
  title:
    en: र् and gone
    hi: र् और लुप्त
  depth: core
  skills:
  - sandhi.visarga-r
  body:
    en: 'After {{-इः}} or {{-उः}}, the visarga becomes {{र्}} before a vowel or a soft sound: {{कविः + अस्ति}} gives {{कविरस्ति}}; {{गुरुः + ददाति}} gives {{गुरुर्ददाति}}. After {{-अः}} and {{-आः}}, before a vowel other than {{अ}}, it vanishes: {{रामः + इह}} gives {{राम इह}}. {{सः}} and {{एषः}} lose it before consonants: {{स गच्छति}}.'
    hi: '{{-इः}} या {{-उः}} के बाद विसर्ग स्वर या कोमल ध्वनि से पहले {{र्}} बन जाता है: {{कविः + अस्ति}} से {{कविरस्ति}}; {{गुरुः + ददाति}} से {{गुरुर्ददाति}}। {{-अः}} और {{-आः}} के बाद, {{अ}} को छोड़कर किसी स्वर से पहले, वह लुप्त हो जाता है: {{रामः + इह}} से {{राम इह}}। {{सः}} और {{एषः}} व्यंजन से पहले उसे खो देते हैं: {{स गच्छति}}।'

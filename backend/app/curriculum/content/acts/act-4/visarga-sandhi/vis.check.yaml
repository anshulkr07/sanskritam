    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'After {{-इः}} or {{-उः}}, the visarga becomes {{र्}} before a vowel or a soft sound: {{कविः + अस्ति}} gives {{कविरस्ति}};
        {{गुरुः + ददाति}} gives {{गुरुर्ददाति}}. After {{-अः}} and {{-आः}}, before a vowel other than {{अ}}, it vanishes:
        {{रामः + इह}} gives {{राम इह}}. {{सः}} and {{एषः}} lose it before consonants: {{स गच्छति}}.'
      hi: '{{-इः}} या {{-उः}} के बाद विसर्ग स्वर या कोमल ध्वनि से पहले {{र्}} बन जाता है: {{कविः + अस्ति}} से {{कविरस्ति}};
        {{गुरुः + ददाति}} से {{गुरुर्ददाति}}। {{-अः}} और {{-आः}} के बाद, {{अ}} को छोड़कर किसी स्वर से पहले, वह लुप्त हो जाता
        है: {{रामः + इह}} से {{राम इह}}। {{सः}} और {{एषः}} व्यंजन से पहले उसे खो देते हैं: {{स गच्छति}}।'

- id: p8
  kind: practice
  depth: core
  skills:
  - sandhi.visarga-o
  - sandhi.visarga-s
  - sandhi.visarga-r
  mode: order
  prompt:
    en: 'Say what Visargikā says: “Rāma is; the poet is; and Rāma.”'
    hi: 'वह कहिए जो विसर्गिका कहती है: ‘राम है; कवि है; और राम।’'
  explain:
    en: '{{रामोऽस्ति कविरस्ति रामश्च}}: the three breaths.'
    hi: '{{रामोऽस्ति कविरस्ति रामश्च}}: तीन श्वास।'
  roman: after
  gate: true
  story:
    success:
      en: “रामोऽस्ति, कविरस्ति, रामश्च,” you say, and Visargikā steps down, a small marble woman with a finger at her lips,
        and lowers it. “At last,” she says, in her own voice, quite plain and low, “every breath has a name.” She breathes,
        aloud, once. Behind her the tenth statue is already holding a stone lamp. “तदस्ति,” she says, in a voice like a bell.
        “Tat and asti. They have joined, but what happened to the t?”
      hi: “रामोऽस्ति, कविरस्ति, रामश्च,” आप कहते हैं, और विसर्गिका उतरती है, संगमरमर की नन्ही स्त्री, जिसकी होंठों पर उँगली
        है, और उसे नीचे कर लेती है। “आख़िर,” वह अपनी ही आवाज़ में, बहुत सादी और नीची, कहती है, “हर श्वास का एक नाम है।” वह
        एक बार ज़ोर से साँस लेती है। उसके पीछे दसवीं प्रतिमा पहले से पत्थर का दीपक थामे है। “तदस्ति,” वह घण्टी-सी आवाज़ में
        कहती है। “तत् और अस्ति। वे जुड़ गए, पर त् का क्या हुआ?”
    failure:
      en: 'The breath hangs unnamed. Her three: {{रामोऽस्ति कविरस्ति रामश्च}}.'
      hi: 'श्वास बिना नाम का टँगा रहता है। उसके तीन: {{रामोऽस्ति कविरस्ति रामश्च}}।'

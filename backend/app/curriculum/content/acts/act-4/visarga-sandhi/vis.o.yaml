  story:
    success:
      en: “बालको वदति,” you say, “the boy speaks,” and the breath-statue's mist, which had been hanging in the air in a nervous little cloud, settles in a line across the hall, like a word written in air, and is gone. “रामोऽस्ति,” she says. “Rāma is. And someone is listening.” She breathes in, for the first time in a thousand years.
      hi: “बालको वदति,” आप कहते हैं, “बालक बोलता है,” और श्वास-प्रतिमा की धुंध, जो बेचैन-सी नन्ही बदली बनकर हवा में टँगी थी, कक्ष के आर-पार एक रेखा में बैठ जाती है, हवा में लिखे शब्द की तरह, और ओझल हो जाती है। “रामोऽस्ति,” वह कहती है। “राम है। और कोई सुन रहा है।” वह भीतर साँस खींचती है, हज़ार वर्षों में पहली बार।
    failure:
      en: 'The mist hangs. {{-अः}} before a soft sound becomes {{-ओ}}: {{बालको वदति}}.'
      hi: 'धुंध टँगी रहती है। कोमल ध्वनि से पहले {{-अः}} बनता है {{-ओ}}: {{बालको वदति}}।'
  options:
  - sa: बालकः वदति
  - sa: बालकस्वदति
  - correct: true
    sa: बालको वदति
- id: pn
  kind: teach
  title:
    en: Pāṇini's breath
    hi: पाणिनि की श्वास
  depth: panini
  skills:
  - sandhi.visarga-o
  sutras:
  - 8.2.66
  - 8.3.15
  - 6.1.113
  - 6.1.114
  body:
    en: Sūtra 8.2.66, {{ससजुषो रुः}}, turns a final {{स्}} into {{रु}}, and 8.3.15, {{खरवसानयोर्विसर्जनीयः}}, makes the {{र्}} a visarga at a pause. But 6.1.113, {{अतो रोरप्लुतादप्लुते}}, makes {{रु}} after {{अ}} into {{उ}} before a short {{अ}}, and 6.1.114, {{हशि च}}, does the same before a soft consonant.
    hi: सूत्र 8.2.66, {{ससजुषो रुः}}, पद के अन्तिम {{स्}} को {{रु}} बनाता है, और 8.3.15, {{खरवसानयोर्विसर्जनीयः}}, विराम पर {{र्}} को विसर्ग बनाता है। पर 6.1.113, {{अतो रोरप्लुतादप्लुते}}, {{अ}} के बाद ह्रस्व {{अ}} से पहले {{रु}} को {{उ}} बनाता है, और 6.1.114, {{हशि च}}, कोमल व्यंजन से पहले भी यही करता है।

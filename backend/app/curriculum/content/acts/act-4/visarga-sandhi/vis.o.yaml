- id: s1
  kind: story
  title:
    en: The seventh statue
    hi: सातवीं प्रतिमा
  depth: core
  image:
    brief: The seventh statue with a finger lifted to her lips, a fine mist of breath leaving her mouth and drifting up in the cold air; Śuka testing words with a raised wing; Dādī listening; Lubdhaka's foreman at a distance holding a lamp.
    alt:
      en: A stone statue with a finger at her lips, a trail of mist leaving her mouth
      hi: होंठों पर उँगली रखे प्रतिमा, मुँह से उठती धुंध की रेखा
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - visargika
    place: simhasana-shala
    ratio: '4:3'
    id: vis-o-s1
  narration:
    en: 'The seventh statue has a finger to her lips and a faint mist at her mouth, as if breathing out. “रामोऽस्ति,” she says. “Rāma is.” Dādī: “Any Sanskrit word can end in that breath, ः, the visarga. What happens to it depends on what comes next. Before a soft sound, अः becomes ओ.” Śuka tests it: “रामो गच्छति.” “Yes,” says the statue.'
    hi: 'सातवीं प्रतिमा ने होंठों पर उँगली रखी है और उसके मुँह पर हल्की धुंध है, मानो वह निःश्वास छोड़ रही हो। “रामोऽस्ति,” वह कहती है। “राम है।” दादी: “संस्कृत का हर शब्द उसी श्वास, ः, विसर्ग पर समाप्त हो सकता है। उसका क्या होता है, यह इस पर निर्भर है कि आगे क्या आता है। कोमल ध्वनि से पहले अः ओ बन जाता है।” शुक परखता है। “रामो गच्छति।” “हाँ,” प्रतिमा कहती है, और श्वास लेती है।'
  lines:
  - speaker: dadi
    sa: रामः + अस्ति = रामोऽस्ति।
    gloss:
      en: Rāma + is = Rāma is.
      hi: राम + है = राम है।
  quote:
    sa: कस्मिंश्चिद् दिवसे कुतो ऽपि स्थानाच्छान्तिशीलो नाम योगी
    gloss:
      en: One day, from somewhere, a yogī named Śāntiśīla came.
      hi: एक दिन, कहीं से, शान्तिशील नाम का एक योगी आया।
    source: Vetālapañcaviṃśatikā, introduction (read in the Digital Corpus of Sanskrit); kuto 'pi is kutaḥ + api
- id: t1
  kind: teach
  title:
    en: The breath ः
    hi: श्वास ः
  depth: core
  skills:
  - sandhi.visarga-o
  body:
    en: 'A word can end in the breath {{ः}}, the {{विसर्गः}}: {{रामः}}, {{देवः}}, {{सः}}. Before a soft sound, a vowel, or a soft consonant, the ending {{-अः}} becomes {{-ओ}}. Before {{अ}} the {{अ}} is dropped, leaving {{ऽ}}: {{रामः + अस्ति}} gives {{रामोऽस्ति}}; {{रामः + गच्छति}} gives {{रामो गच्छति}}.'
    hi: 'शब्द श्वास {{ः}}, अर्थात् {{विसर्गः}} पर समाप्त हो सकता है: {{रामः}}, {{देवः}}, {{सः}}। कोमल ध्वनि, स्वर या कोमल व्यंजन से पहले {{-अः}} {{-ओ}} बन जाता है। {{अ}} से पहले {{अ}} गिर जाता है और {{ऽ}} बचता है: {{रामः + अस्ति}} से {{रामोऽस्ति}}; {{रामः + गच्छति}} से {{रामो गच्छति}}।'
  term:
    sa: विसर्गः
    meaning:
      en: the breath sound ः
      hi: श्वास की ध्वनि ः

  story:
    success:
      en: “कविश्च,” you say, “and the poet,” and the statue's faint hiss swells and clears into a full, cool, rushing sound, like wind through a very long hall. The oil lamps all lean one way. “रामश्च, कविश्च,” she says. “And and and.” She laughs, a little unevenly, because she has not laughed in a thousand years.
      hi: “कविश्च,” आप कहते हैं, “और कवि,” और प्रतिमा की हल्की फुफकार बढ़कर पूरी, ठंडी, बहती ध्वनि में साफ़ हो जाती है, किसी बहुत लम्बे कक्ष में हवा की तरह। सारे तेल-दीपक एक ओर झुक जाते हैं। “रामश्च, कविश्च,” वह कहती है। “और और और।” वह हँसती है, कुछ असमान-सी, क्योंकि वह हज़ार वर्षों से नहीं हँसी।
    failure:
      en: 'The hiss stays faint. Before {{च}}: {{श्}}: {{कविश्च}}.'
      hi: 'फुफकार हल्की रहती है। {{च}} से पहले: {{श्}}: {{कविश्च}}।'
  options:
  - sa: कविःच
  - sa: कविसच
  - correct: true
    sa: कविश्च
- id: pn
  kind: teach
  title:
    en: Pāṇini's hiss
    hi: पाणिनि की फुफकार
  depth: panini
  skills:
  - sandhi.visarga-s
  sutras:
  - 8.3.34
  - 8.4.40
  - 8.4.41
  - 8.3.35
  body:
    en: Sūtra 8.3.34, {{विसर्जनीयस्य सः}}, turns a visarga into {{स्}} before a hard consonant; 8.4.40, {{स्तोः श्चुना श्चुः}}, makes that {{स्}} into {{श्}} before {{च}}; and 8.4.41, {{ष्टुना ष्टुः}}, into {{ष्}} before {{ट}}. 8.3.35, {{शर्परे विसर्जनीयः}}, keeps it when a hard consonant is followed by a hiss.
    hi: सूत्र 8.3.34, {{विसर्जनीयस्य सः}}, कठोर व्यंजन से पहले विसर्ग को {{स्}} बनाता है; 8.4.40, {{स्तोः श्चुना श्चुः}}, उस {{स्}} को {{च}} से पहले {{श्}} बनाता है; और 8.4.41, {{ष्टुना ष्टुः}}, {{ट}} से पहले {{ष्}}। 8.3.35, {{शर्परे विसर्जनीयः}}, उसे तब रखता है जब कठोर व्यंजन के बाद फुफकार हो।

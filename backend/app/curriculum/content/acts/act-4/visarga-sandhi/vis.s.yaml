  title:
    en: The eighth statue
    hi: आठवीं प्रतिमा
  depth: core
  image:
    brief: The eighth statue with her lips slightly parted as if hissing, a faint curl of breath; Śuka counting on his claws; Dādī pointing at three inscribed words on a pillar; Lubdhaka's foreman holding his lamp higher.
    alt:
      en: A statue with parted lips faintly hissing while a parrot counts and an old woman points at an inscribed pillar
      hi: हल्की फुफकारती प्रतिमा, गिनता तोता, अभिलेख वाले स्तम्भ की ओर इशारा करती दादी

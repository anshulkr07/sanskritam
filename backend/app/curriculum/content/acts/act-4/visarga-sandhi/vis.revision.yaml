- id: conditions
  kind: revision
  title:
    en: How to tell which
    hi: कैसे पहचानें कि कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: sandhi.visarga-o
    rule:
      en: 'Look at the vowel before the breath: {{अः}} gives {{ओ}}; {{इः}}/{{उः}} give {{र्}}; {{आः}} before a vowel just
        drops it.'
      hi: 'श्वास से पहले का स्वर देखिए: {{अः}} से {{ओ}}; {{इः}}/{{उः}} से {{र्}}; {{आः}} स्वर से पहले उसे गिरा देता है।'
    tag: good
    taught_in: vis.o#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'A word can end in the breath {{ः}}, the {{विसर्गः}}: {{रामः}}, {{देवः}}, {{सः}}. Before a soft sound, a vowel,
          or a soft consonant, the ending {{-अः}} becomes {{-ओ}}. Before {{अ}} the {{अ}} is dropped, leaving {{ऽ}}: {{रामः
          + अस्ति}} gives {{रामोऽस्ति}}; {{रामः + गच्छति}} gives {{रामो गच्छति}}.'
        hi: 'शब्द श्वास {{ः}}, अर्थात् {{विसर्गः}} पर समाप्त हो सकता है: {{रामः}}, {{देवः}}, {{सः}}। कोमल ध्वनि, स्वर या कोमल
          व्यंजन से पहले {{-अः}} {{-ओ}} बन जाता है। {{अ}} से पहले {{अ}} गिर जाता है और {{ऽ}} बचता है: {{रामः + अस्ति}} से
          {{रामोऽस्ति}}; {{रामः + गच्छति}} से {{रामो गच्छति}}।'
      items:
      - id: i0
        sa: ः
      - id: i1
        sa: विसर्गः
      - id: i2
        sa: रामः
      - id: i3
        sa: देवः
      - id: i4
        sa: सः
      - id: i5
        sa: -अः
      - id: i6
        sa: -ओ
      - id: i7
        sa: अ
      - id: i8
        sa: ऽ
      - id: i9
        sa: रामः + अस्ति
      - id: i10
        sa: रामोऽस्ति
      - id: i11
        sa: रामः + गच्छति
      - id: i12
        sa: रामो गच्छति
  - skill: sandhi.visarga-s
    rule:
      en: 'Look at the sound after: hard {{च}}, {{त}}, {{ट}} give a hiss; {{क}}, {{प}} keep the breath.'
      hi: 'बाद की ध्वनि देखिए: कठोर {{च}}, {{त}}, {{ट}} फुफकार देते हैं; {{क}}, {{प}} श्वास रखते हैं।'
    tag: good
    taught_in: vis.s#t1
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Before a hard consonant the visarga turns into a hiss in the same place as that consonant: before {{च}}/{{छ}}
          it is {{श्}}, before {{त}}/{{थ}} it is {{स्}}, before {{ट}}/{{ठ}} it is {{ष्}}. {{रामः + च}} gives {{रामश्च}}; {{रामः
          + तत्र}} gives {{रामस्तत्र}}. Before {{क}}, {{ख}}, {{प}}, {{फ}} the visarga stays.'
        hi: 'कठोर व्यंजन से पहले विसर्ग उसी स्थान की फुफकार बन जाता है: {{च}}/{{छ}} से पहले {{श्}}, {{त}}/{{थ}} से पहले {{स्}},
          {{ट}}/{{ठ}} से पहले {{ष्}}। {{रामः + च}} से {{रामश्च}}; {{रामः + तत्र}} से {{रामस्तत्र}}। {{क}}, {{ख}}, {{प}}, {{फ}}
          से पहले विसर्ग रहता है।'
      items:
      - id: i0
        sa: च
      - id: i1
        sa: छ
      - id: i2
        sa: श्
      - id: i3
        sa: त
      - id: i4
        sa: थ
      - id: i5
        sa: स्
      - id: i6
        sa: ट
      - id: i7
        sa: ठ
      - id: i8
        sa: ष्
      - id: i9
        sa: रामः + च
      - id: i10
        sa: रामश्च
      - id: i11
        sa: रामः + तत्र
      - id: i12
        sa: रामस्तत्र
      - id: i13
        sa: क
      - id: i14
        sa: ख
      - id: i15
        sa: प
      - id: i16
        sa: फ

- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: sandhi.visarga-o
    rule:
      en: '{{ससजुषो रुः}}, {{अतो रोरप्लुतादप्लुते}}, {{हशि च}}: the breath as {{रु}}, then {{उ}}, then {{ओ}}.'
      hi: '{{ससजुषो रुः}}, {{अतो रोरप्लुतादप्लुते}}, {{हशि च}}: श्वास {{रु}} के रूप में, फिर {{उ}}, फिर {{ओ}}।'
    sutras:
    - 8.2.66
    - 6.1.113
    - 6.1.114
    tag: core
    taught_in: vis.o#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 8.2.66, {{ससजुषो रुः}}, turns a final {{स्}} into {{रु}}, and 8.3.15, {{खरवसानयोर्विसर्जनीयः}}, makes the
          {{र्}} a visarga at a pause. But 6.1.113, {{अतो रोरप्लुतादप्लुते}}, makes {{रु}} after {{अ}} into {{उ}} before a
          short {{अ}}, and 6.1.114, {{हशि च}}, does the same before a soft consonant.
        hi: सूत्र 8.2.66, {{ससजुषो रुः}}, पद के अन्तिम {{स्}} को {{रु}} बनाता है, और 8.3.15, {{खरवसानयोर्विसर्जनीयः}}, विराम
          पर {{र्}} को विसर्ग बनाता है। पर 6.1.113, {{अतो रोरप्लुतादप्लुते}}, {{अ}} के बाद ह्रस्व {{अ}} से पहले {{रु}} को
          {{उ}} बनाता है, और 6.1.114, {{हशि च}}, कोमल व्यंजन से पहले भी यही करता है।
      items:
      - id: i0
        sa: ससजुषो रुः
      - id: i1
        sa: स्
      - id: i2
        sa: रु
      - id: i3
        sa: खरवसानयोर्विसर्जनीयः
      - id: i4
        sa: र्
      - id: i5
        sa: अतो रोरप्लुतादप्लुते
      - id: i6
        sa: अ
      - id: i7
        sa: उ
      - id: i8
        sa: हशि च
  - skill: sandhi.visarga-s
    rule:
      en: '{{विसर्जनीयस्य सः}}, {{स्तोः श्चुना श्चुः}}, {{ष्टुना ष्टुः}}: the hiss takes the place of the next sound.'
      hi: '{{विसर्जनीयस्य सः}}, {{स्तोः श्चुना श्चुः}}, {{ष्टुना ष्टुः}}: फुफकार अगली ध्वनि का स्थान ले लेती है।'
    sutras:
    - 8.3.34
    - 8.4.40
    - 8.4.41
    tag: core
    taught_in: vis.s#pn
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 8.3.34, {{विसर्जनीयस्य सः}}, turns a visarga into {{स्}} before a hard consonant; 8.4.40, {{स्तोः श्चुना
          श्चुः}}, makes that {{स्}} into {{श्}} before {{च}}; and 8.4.41, {{ष्टुना ष्टुः}}, into {{ष्}} before {{ट}}. 8.3.35,
          {{शर्परे विसर्जनीयः}}, keeps it when a hard consonant is followed by a hiss.
        hi: सूत्र 8.3.34, {{विसर्जनीयस्य सः}}, कठोर व्यंजन से पहले विसर्ग को {{स्}} बनाता है; 8.4.40, {{स्तोः श्चुना श्चुः}},
          उस {{स्}} को {{च}} से पहले {{श्}} बनाता है; और 8.4.41, {{ष्टुना ष्टुः}}, {{ट}} से पहले {{ष्}}। 8.3.35, {{शर्परे
          विसर्जनीयः}}, उसे तब रखता है जब कठोर व्यंजन के बाद फुफकार हो।
      items:
      - id: i0
        sa: विसर्जनीयस्य सः
      - id: i1

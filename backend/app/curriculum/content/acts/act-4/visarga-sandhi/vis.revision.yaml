  - skill: sandhi.visarga-s
    rule:
      en: 'Do not write {{रामःच}}: it is {{रामश्च}}.'
      hi: '{{रामःच}} मत लिखिए: यह {{रामश्च}} है।'
    tag: core
    taught_in: vis.s#p1
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Compare with a taught example
        hi: सीखे हुए उदाहरण से तुलना करें
      explanation:
        en: 'Before a hard consonant the visarga turns into a hiss in the same place as that consonant: before {{च}}/{{छ}}
          it is {{श्}}, before {{त}}/{{थ}} it is {{स्}}, before {{ट}}/{{ठ}} it is {{ष्}}. {{रामः + च}} gives {{रामश्च}}; {{रामः
          + तत्र}} gives {{रामस्तत्र}}. Before {{क}}, {{ख}}, {{प}}, {{फ}} the visarga stays.'
        hi: 'कठोर व्यंजन से पहले विसर्ग उसी स्थान की फुफकार बन जाता है: {{च}}/{{छ}} से पहले {{श्}}, {{त}}/{{थ}} से पहले {{स्}},
          {{ट}}/{{ठ}} से पहले {{ष्}}। {{रामः + च}} से {{रामश्च}}; {{रामः + तत्र}} से {{रामस्तत्र}}। {{क}}, {{ख}}, {{प}}, {{फ}}
          से पहले विसर्ग रहता है।'

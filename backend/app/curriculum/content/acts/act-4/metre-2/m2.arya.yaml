- id: s1
  kind: story
  title:
    en: The scales
    hi: तराज़ू
  depth: core
  image:
    brief: A stone balance with two pans at the foot of a spiral stair; Dādī laying a palm-leaf verse on one pan and small
      stone grains on the other; Vṛttikā drifting past; Śuka reading the pans; Lubdhaka at a distance, taking notes.
    alt:
      en: A stone balance at the foot of a stair, a verse in one pan and grains in the other
      hi: सीढ़ी के नीचे पत्थर की तराज़ू, एक पलड़े में श्लोक और दूसरे में दाने
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - vrttika
    place: simhasana-shala
    ratio: '4:3'
    id: m2-arya-s1
    text_in_image:
    - दानं भोगो नाशस्
    - तिस्रो गतयो भवन्ति वित्तस्य
    - यो न ददाति न भुङ्क्ते
    - तस्य तृतीया गतिर्भवति
  narration:
    en: 'At the foot of the stair stands a stone balance. Dādī puts a verse on it. “Some metres do not count syllables; they
      count time. A light syllable weighs one grain, a heavy one two. This is Āryā.” She reads: दानं भोगो नाशस्… Vṛttikā,
      drifting past, watches the pans tip. “Twelve, eighteen, twelve, fifteen,” Dādī says. “Weigh it yourself.”'
    hi: 'सीढ़ी के नीचे पत्थर की एक तराज़ू खड़ी है। दादी उस पर एक श्लोक रखती हैं। “कुछ छन्द अक्षर नहीं गिनते; वे समय गिनते
      हैं। लघु अक्षर का वज़न एक दाना, गुरु का दो। यह आर्या है।” वे पढ़ती हैं: दानं भोगो नाशस्… वृत्तिका, पास से तैरती हुई,
      पलड़ों को झुकते देखती है। “बारह, अठारह, बारह, पन्द्रह,” दादी कहती हैं। “आप स्वयं तौलिए।”'
  quote:
    sa: दानं भोगो नाशस् तिस्रो गतयो भवन्ति वित्तस्य यो न ददाति न भुङ्क्ते तस्य तृतीया गतिर् भवति
    gloss:
      en: Giving, enjoying and losing are the three courses of wealth; for one who neither gives nor enjoys, the third course
        is the one that comes.
      hi: 'दान, भोग और नाश: धन की ये तीन गतियाँ हैं; जो न देता है न भोगता है, उसकी तीसरी गति होती है।'
    source: Bhartṛhari, Nītiśataka (GRETIL numbering 1.43); the verse is in Āryā
- id: t1
  kind: teach
  title:
    en: Counting time
    hi: समय की गिनती
  depth: core
  skills:
  - chandas.arya
  body:
    en: 'Some metres count time, not syllables: a light syllable is one {{मात्रा}}, a heavy one two. These are called {{जाति}}.
      In the {{आर्या}} the four quarters have 12, 18, 12 and 15 mātrās. The last syllable of a quarter may be counted heavy
      to make the sum.'
    hi: 'कुछ छन्द अक्षर नहीं, समय गिनते हैं: लघु अक्षर एक {{मात्रा}}, गुरु दो। इन्हें {{जाति}} कहते हैं। {{आर्या}} के चार
      चरणों में 12, 18, 12 और 15 मात्राएँ होती हैं। योग पूरा करने के लिए चरण का अन्तिम अक्षर गुरु गिना जा सकता है।'
  term:
    sa: मात्रा
    meaning:
      en: 'a beat of time: light 1, heavy 2'
      hi: 'समय की इकाई: लघु 1, गुरु 2'

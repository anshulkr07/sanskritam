- id: p5
  kind: practice
  title:
    en: The scales
    hi: तराज़ू
  depth: core
  skills:
  - chandas.arya
  mode: choice
  prompt:
    en: '{{यो न ददाति न भुङ्क्ते}} is heavy, light, light, heavy, light, light, heavy, heavy. How many mātrās?'
    hi: '{{यो न ददाति न भुङ्क्ते}} है गुरु, लघु, लघु, गुरु, लघु, लघु, गुरु, गुरु। कितनी मात्राएँ?'
  explain:
    en: 2+1+1+2+1+1+2+2 = 12.
    hi: 2+1+1+2+1+1+2+2 = 12।
  roman: after
  gate: true
  story:
    success:
      en: '“Twelve,” you say, and the pan with the third quarter in it sinks, slowly, to rest on the grains: exactly level.
        Dādī nods. Vṛttikā, drifting past, reaches out and touches the beam of the scales with one smoky finger, and the beam
        rocks gently, in time, like a pendulum. “Time,” she says, “not syllables. That is why my song never ended: I was counting
        the wrong thing.”'
      hi: '“बारह,” आप कहते हैं, और तीसरे चरण वाला पलड़ा धीरे-धीरे दानों पर ठहर जाता है: ठीक बराबर। दादी सिर हिलाती हैं। वृत्तिका,
        पास से तैरती हुई, तराज़ू की डंडी को अपनी धुएँ-सी उँगली से छूती है, और डंडी लोलक की तरह लय में हौले-हौले डोलती है।
        “समय,” वह कहती है, “अक्षर नहीं। इसीलिए मेरा गीत कभी पूरा नहीं हुआ: मैं गलत चीज़ गिन रही थी।”'
    failure:
      en: 'The pan stays up. Add the beats: 2+1+1+2+1+1+2+2.'
      hi: 'पलड़ा ऊपर रहता है। ताल जोड़िए: 2+1+1+2+1+1+2+2।'
  options:
  - text:
      en: '10'
      hi: १०
  - correct: true
    text:
      en: '12'
      hi: १२
  - text:
      en: '15'
      hi: १५

- id: p4
  kind: practice
  title:
    en: The mixed verse
    hi: मिला हुआ श्लोक
  depth: core
  skills:
  - chandas.vrtta
  mode: choice
  prompt:
    en: A quarter begins {{ग ग ल ग ग}}; another, in the same verse, begins {{ल ग ल ग ग}}. What is the verse?
    hi: एक चरण {{ग ग ल ग ग}} से शुरू होता है; उसी श्लोक का दूसरा {{ल ग ल ग ग}} से। वह श्लोक क्या है?
  explain:
    en: A verse that mixes indravajrā and upendravajrā quarters is {{उपजाति}}.
    hi: जिस श्लोक में इन्द्रवज्रा और उपेन्द्रवज्रा के चरण मिले हों, वह {{उपजाति}} है।
  roman: after
  gate: true
  story:
    success:
      en: “उपजाति,” you say, and Vṛttikā, who has circled the throne since before the statues stood, stops, for one breath, with her sleeve in the air. “Two kinds of eleven,” she says, “in the same verse. I had thought they were my mistakes.” She looks at her fingers, which have been counting all this while, and begins to count aloud.
      hi: “उपजाति,” आप कहते हैं, और वृत्तिका, जो प्रतिमाओं के खड़े होने से पहले से सिंहासन का चक्कर लगा रही है, एक साँस के लिए, हवा में आस्तीन उठाए रुक जाती है। “एक ही श्लोक में दो तरह के ग्यारह,” वह कहती है। “मैं सोचती थी कि वे मेरी भूलें हैं।” वह अपनी उँगलियों को देखती है, जो इतनी देर से गिन रही थीं, और ज़ोर से गिनना शुरू करती है।
    failure:
      en: She keeps circling. A verse mixing the two elevens is {{उपजाति}}.
      hi: वह घूमती रहती है। दोनों ग्यारहों को मिलाने वाला श्लोक {{उपजाति}} है।
  options:
  - sa: वसन्ततिलका
  - correct: true
    sa: उपजाति
  - sa: अनुष्टुप्

- id: s1
  kind: story
  title:
    en: The circling spirit
    hi: घेरे में घूमती भूत
  depth: core
  image:
    brief: Behind a slid-open stone panel, a tall thin spirit of pale smoke drifting in a ring around the golden throne, her long sleeves trailing, one hand counting on her fingers; Dādī and Śuka watching from the opening; Chandikā's small drum resting on the throne's arm; warm light.
    alt:
      en: A smoky spirit drifts in a ring around a golden throne counting on her fingers
      hi: धुएँ जैसी भूत सोने के सिंहासन के चारों ओर घेरे में उँगलियों पर गिनती हुई
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - vrttika
    place: simhasana-shala
    ratio: '4:3'
    id: m2-vrtta-s1
  narration:
    en: Behind the opened panel, a smoky spirit walks round and round the throne, humming a line far longer than a śloka. “These are the vṛttas, the great metres,” says Dādī. “Every quarter has the same number of syllables in the same pattern. Count the syllables of one quarter, and you can name the metre.” Vṛttikā begins again. She has never reached the end of her song.
    hi: खुले फलक के पीछे धुएँ जैसी एक भूत सिंहासन के चारों ओर घूमती हुई श्लोक से कहीं लम्बी पंक्ति गुनगुना रही है। “ये वृत्त हैं, बड़े छन्द,” दादी कहती हैं। “हर चरण में अक्षरों की संख्या बराबर होती है और ढाँचा भी वही। एक चरण के अक्षर गिन लीजिए, तो छन्द का नाम बता सकते हैं।” वृत्तिका फिर शुरू करती है। वह अपने गीत के अन्त तक कभी नहीं पहुँची।
  quote:
    sa: कश्चित् कान्ताविरहगुरुणा स्वाधिकारात् प्रमत्तः शापेनास्तंगमितमहिमा वर्षभोग्येण भर्तुः यक्षश् चक्रे जनकतनयास्नानपुण्योदकेषु स्निग्धछायातरुषु वसतिं रामगिर्याश्रमेषु
    gloss:
      en: A certain yakṣa, careless in his duty and heavy with parting from his beloved, was cursed by his master to a year away from his power; he made his home in the hermitages of Rāmagiri, where the waters are holy from Sītā's bathing and the trees give soft shade.
      hi: एक यक्ष, कर्तव्य में प्रमत्त और प्रिया के विरह से भारी, स्वामी के शाप से एक वर्ष के लिए अपनी महिमा से वंचित हुआ; उसने रामगिरि के आश्रमों में निवास किया, जहाँ के जल सीता के स्नान से पवित्र हैं और वृक्षों की छाया स्निग्ध है।
    source: Meghadūta, Pūrvamegha 1 (read in the Digital Corpus of Sanskrit); the verse is in mandākrāntā
- id: t1
  kind: teach
  title:
    en: Counting the quarter
    hi: चरण की गिनती
  depth: core
  skills:
  - chandas.vrtta
  body:
    en: 'A {{वृत्तम्}} is a metre counted in syllables: all four quarters have the same number, in the same pattern. Count one quarter. Eleven: {{इन्द्रवज्रा}} or {{उपेन्द्रवज्रा}}. Fourteen: {{वसन्ततिलका}}. Seventeen: {{मन्दाक्रान्ता}}. Nineteen: {{शार्दूलविक्रीडित}}.'
    hi: '{{वृत्तम्}} अक्षरों से गिना जाने वाला छन्द है: चारों चरणों में संख्या बराबर और ढाँचा वही। एक चरण गिनिए। ग्यारह: {{इन्द्रवज्रा}} या {{उपेन्द्रवज्रा}}। चौदह: {{वसन्ततिलका}}। सत्रह: {{मन्दाक्रान्ता}}। उन्नीस: {{शार्दूलविक्रीडित}}।'
  term:
    sa: वृत्तम्
    meaning:
      en: a metre counted in syllables
      hi: अक्षरों से गिना जाने वाला छन्द

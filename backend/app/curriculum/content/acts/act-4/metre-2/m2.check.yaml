    hi: आर्या के इस चरण के हर अक्षर को चिह्नित कीजिए।
  explain:
    en: 'Heavy, light, light, heavy, light, light, heavy, heavy: 12 beats.'
    hi: 'गुरु, लघु, लघु, गुरु, लघु, लघु, गुरु, गुरु: 12 ताल।'

- id: p9
  kind: practice
  depth: core
  skills:
  - chandas.arya
  mode: choice
  prompt:
    en: The Āryā is counted by…
    hi: आर्या गिनी जाती है…
  explain:
    en: A {{जाति}} counts time.
    hi: '{{जाति}} समय गिनता है।'
  roman: after
  gate: true
  story:
    success:
      en: '“मात्राभिः,” says Vṛttikā, “by the beats,” and finishes a circle for the first time: eleven, fourteen, seventeen, nineteen, and the long swing of the Āryā at the end. She is no longer smoke; she is a tall, plain figure with a counting-cord in one hand. “इन्द्रवज्रा उपजाति,” she says, setting it down. On the lowest step of the stair, a clear, new line has appeared: पदच्छेदः, अन्वयः, अर्थः।'
      hi: '“मात्राभिः,” वृत्तिका कहती है, “ताल से,” और पहली बार एक घेरा पूरा करती है: ग्यारह, चौदह, सत्रह, उन्नीस, और अन्त में आर्या का लम्बा झूला। वह अब धुआँ नहीं है; वह एक लम्बी, सादी आकृति है, जिसके एक हाथ में गिनने की डोरी है। “इन्द्रवज्रा उपजाति,” वह कहती है, और उसे नीचे रख देती है। सीढ़ी की सबसे नीची पौड़ी पर एक नई स्पष्ट पंक्ति उभर आई है: पदच्छेदः, अन्वयः, अर्थः।'
    failure:
      en: Her circle stays open. The Āryā counts mātrās, beats of time.
      hi: उसका घेरा खुला रहता है। आर्या मात्राएँ, समय की ताल, गिनती है।
  options:
  - text:
      en: syllables
      hi: अक्षरों से
  - correct: true
    text:
      en: mātrās
      hi: मात्राओं से
  - text:
      en: words
      hi: शब्दों से

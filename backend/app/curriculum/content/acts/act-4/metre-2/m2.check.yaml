- id: p6
  kind: practice
  depth: core
  skills:
  - chandas.arya
  mode: choice
  prompt:
    en: How many mātrās in {{विद्या}}?
    hi: '{{विद्या}} में कितनी मात्राएँ हैं?'
  explain:
    en: 2 + 2 = 4.
    hi: 2 + 2 = 4।
  roman: after
  options:
  - text:
      en: '3'
      hi: ३
  - correct: true
    text:
      en: '4'
      hi: ४
  - text:
      en: '5'
      hi: ५
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Some metres count time, not syllables: a light syllable is one {{मात्रा}}, a heavy one two. These are called {{जाति}}.
        In the {{आर्या}} the four quarters have 12, 18, 12 and 15 mātrās. The last syllable of a quarter may be counted heavy
        to make the sum.'
      hi: 'कुछ छन्द अक्षर नहीं, समय गिनते हैं: लघु अक्षर एक {{मात्रा}}, गुरु दो। इन्हें {{जाति}} कहते हैं। {{आर्या}} के चार
        चरणों में 12, 18, 12 और 15 मात्राएँ होती हैं। योग पूरा करने के लिए चरण का अन्तिम अक्षर गुरु गिना जा सकता है।'
    items:
    - id: i0
      sa: मात्रा
    - id: i1
      sa: जाति
    - id: i2
      sa: आर्या

- id: conditions
  kind: revision
  title:
    en: How to tell which
    hi: कैसे पहचानें कि कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: sandhi.savarna
    rule:
      en: 'Same family: long vowel. {{अ}} with {{इ}}/{{उ}}/{{ऋ}}: guṇa. {{अ}} with {{ए}}/{{ओ}}: vṛddhi. {{इ}}/{{उ}}/{{ऋ}}
        with another vowel: glide.'
      hi: 'एक कुल: दीर्घ स्वर। {{अ}} के साथ {{इ}}/{{उ}}/{{ऋ}}: गुण। {{अ}} के साथ {{ए}}/{{ओ}}: वृद्धि। {{इ}}/{{उ}}/{{ऋ}} के
        साथ अन्य स्वर: अर्धस्वर।'
    tag: good
    taught_in: vs.like#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'When two words meet, the last sound of the first and the first sound of the second may join. This is {{सन्धिः}}.
          When two vowels of the same family meet, {{अ}}/{{आ}}, {{इ}}/{{ई}}, {{उ}}/{{ऊ}}, they merge into one long vowel:
          {{विद्या + आलयः}} gives {{विद्यालयः}}.'
        hi: 'जब दो शब्द मिलते हैं, तो पहले शब्द की अन्तिम और दूसरे की पहली ध्वनि जुड़ सकती हैं। यह {{सन्धिः}} है। जब एक ही
          कुल के दो स्वर मिलते हैं, {{अ}}/{{आ}}, {{इ}}/{{ई}}, {{उ}}/{{ऊ}}, तो वे मिलकर एक दीर्घ स्वर बन जाते हैं: {{विद्या
          + आलयः}} से {{विद्यालयः}}।'
      items:
      - id: i0
        sa: सन्धिः
      - id: i1
        sa: अ
      - id: i2
        sa: आ
      - id: i3
        sa: इ
      - id: i4
        sa: ई
      - id: i5
        sa: उ
      - id: i6
        sa: ऊ
      - id: i7
        sa: विद्या + आलयः
      - id: i8
        sa: विद्यालयः
  - skill: sandhi.ayadi
    rule:
      en: '{{ऽ}} shows a lost {{अ}} after {{ए}} or {{ओ}}.'
      hi: '{{ऽ}} {{ए}} या {{ओ}} के बाद लुप्त {{अ}} को दिखाता है।'
    tag: good
    taught_in: vs.e-o#t1
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: '{{औ}} before a vowel becomes {{आव्}}: {{नौ + इकः}} gives {{नाविकः}}. {{ऐ}} becomes {{आय्}} (often written {{आ}}
          before a vowel: {{तस्मै + इदम्}} gives {{तस्मा इदम्}}). {{ए}} before {{इ}} or {{आ}} drops to {{अ}}: {{हरे + इह}}
          gives {{हर इह}}. Before {{अ}} it leaves {{ऽ}}: {{वने + अस्ति}} gives {{वनेऽस्ति}}.'
        hi: 'स्वर से पहले {{औ}} {{आव्}} बन जाता है: {{नौ + इकः}} से {{नाविकः}}। {{ऐ}} {{आय्}} बनता है (स्वर से पहले अक्सर
          {{आ}} लिखा जाता है: {{तस्मै + इदम्}} से {{तस्मा इदम्}})। {{इ}} या {{आ}} से पहले {{ए}} घटकर {{अ}} हो जाता है: {{हरे
          + इह}} से {{हर इह}}। {{अ}} से पहले वह {{ऽ}} छोड़ जाता है: {{वने + अस्ति}} से {{वनेऽस्ति}}।'
      items:
      - id: i0
        sa: औ
      - id: i1
        sa: आव्
      - id: i2
        sa: नौ + इकः
      - id: i3
        sa: नाविकः
      - id: i4
        sa: ऐ
      - id: i5
        sa: आय्
      - id: i6
        sa: आ
      - id: i7
        sa: तस्मै + इदम्
      - id: i8
        sa: तस्मा इदम्
      - id: i9
        sa: ए
      - id: i10
        sa: इ
      - id: i11
        sa: अ
      - id: i12
        sa: हरे + इह
      - id: i13
        sa: हर इह
      - id: i14
        sa: ऽ
      - id: i15
        sa: वने + अस्ति
      - id: i16
        sa: वनेऽस्ति

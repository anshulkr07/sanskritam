  - skill: sandhi.yan
    formula: इति + आदि = इत्यादि
    rule:
      en: glide
      hi: अर्धस्वर
    tag: core
    taught_in: vs.glide#tb1
  - skill: sandhi.ayadi
    formula: नौ + इकः = नाविकः · वने + अस्ति = वनेऽस्ति
    rule:
      en: ay, av, ऽ
      hi: अय्, अव्, ऽ

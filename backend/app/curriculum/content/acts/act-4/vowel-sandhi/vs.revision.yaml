      hi: '{{अकः सवर्णे दीर्घः}}, {{आद्गुणः}}, {{वृद्धिरेचि}}, {{इको यणचि}}, {{एचोऽयवायावः}}: पाँच जोड़ने वाले नियम।'
    sutras:
    - 6.1.101
    - 6.1.87
    - 6.1.88
    - 6.1.77
    - 6.1.78
    tag: core
    taught_in: vs.like#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 6.1.101, {{अकः सवर्णे दीर्घः}}, says that when {{अ}}, {{इ}}, {{उ}} or {{ऋ}} (short or long) meets a vowel
          of its own family, the two become one long vowel. 1.1.9, {{तुल्यास्यप्रयत्नं सवर्णम्}}, defines “own family”: sounds
          made in the same place with the same effort.'
        hi: 'सूत्र 6.1.101, {{अकः सवर्णे दीर्घः}}, कहता है कि जब {{अ}}, {{इ}}, {{उ}} या {{ऋ}} (ह्रस्व या दीर्घ) अपने कुल के
          स्वर से मिलता है, तो दोनों एक दीर्घ स्वर बन जाते हैं। 1.1.9, {{तुल्यास्यप्रयत्नं सवर्णम्}}, ‘अपने कुल’ की परिभाषा
          देता है: एक स्थान और एक प्रयत्न से बनी ध्वनियाँ।'
      items:
      - id: i0
        sa: अकः सवर्णे दीर्घः

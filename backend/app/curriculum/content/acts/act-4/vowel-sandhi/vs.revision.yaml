- id: mistakes
  kind: revision
  title:
    en: Common mistakes
    hi: आम भूलें
  depth: core
  section: mistakes
  rows:
  - skill: sandhi.savarna
    rule:
      en: 'Do not leave two vowels side by side when they should join: {{विद्यालयः}}, not {{विद्याआलयः}}.'
      hi: 'जहाँ जुड़ना चाहिए, वहाँ दो स्वर साथ-साथ मत छोड़िए: {{विद्यालयः}}, {{विद्याआलयः}} नहीं।'
    tag: core
    taught_in: vs.like#p1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Compare with a taught example
        hi: सीखे हुए उदाहरण से तुलना करें
      explanation:
        en: 'When two words meet, the last sound of the first and the first sound of the second may join. This is {{सन्धिः}}.
          When two vowels of the same family meet, {{अ}}/{{आ}}, {{इ}}/{{ई}}, {{उ}}/{{ऊ}}, they merge into one long vowel:
          {{विद्या + आलयः}} gives {{विद्यालयः}}.'
        hi: 'जब दो शब्द मिलते हैं, तो पहले शब्द की अन्तिम और दूसरे की पहली ध्वनि जुड़ सकती हैं। यह {{सन्धिः}} है। जब एक ही
          कुल के दो स्वर मिलते हैं, {{अ}}/{{आ}}, {{इ}}/{{ई}}, {{उ}}/{{ऊ}}, तो वे मिलकर एक दीर्घ स्वर बन जाते हैं: {{विद्या
          + आलयः}} से {{विद्यालयः}}।'
      items:
      - id: i0
        sa: सन्धिः
      - id: i1
        sa: अ
      - id: i2
        sa: आ
      - id: i3
        sa: इ
      - id: i4
        sa: ई
      - id: i5
        sa: उ
      - id: i6
        sa: ऊ
      - id: i7
        sa: विद्या + आलयः
      - id: i8
        sa: विद्यालयः
  - skill: sandhi.blocked
    rule:
      en: Do not join the dual {{हरी एतौ}} into {{हर्येतौ}}.
      hi: द्विवचन {{हरी एतौ}} को {{हर्येतौ}} मत बनाइए।
    tag: core
    taught_in: vs.stop#p1
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Compare with a taught example
        hi: सीखे हुए उदाहरण से तुलना करें
      explanation:
        en: 'Some words never join. The dual forms ending in {{ई}}, {{ऊ}} or {{ए}} stay apart before a vowel: {{हरी + एतौ}}
          stays {{हरी एतौ}}; {{ते + अत्र}} stays {{ते अत्र}}. These are {{प्रगृह्याः}}. Interjections such as {{अहो}} also
          stand apart.'
        hi: 'कुछ शब्द कभी नहीं जुड़ते। {{ई}}, {{ऊ}} या {{ए}} पर समाप्त द्विवचन के रूप स्वर से पहले भी अलग रहते हैं: {{हरी
          + एतौ}} {{हरी एतौ}} ही रहता है; {{ते + अत्र}} {{ते अत्र}} ही रहता है। ये {{प्रगृह्याः}} हैं। {{अहो}} जैसे विस्मयादिबोधक
          भी अलग रहते हैं।'
      items:
      - id: i0
        sa: ई
      - id: i1
        sa: ऊ
      - id: i2
        sa: ए
      - id: i3
        sa: हरी + एतौ
      - id: i4
        sa: हरी एतौ
      - id: i5
        sa: ते + अत्र
      - id: i6
        sa: ते अत्र
      - id: i7
        sa: प्रगृह्याः
      - id: i8
        sa: अहो
- id: panini
  kind: revision
  title:

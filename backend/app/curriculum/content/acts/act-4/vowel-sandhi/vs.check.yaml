- id: p8
  kind: practice
  depth: core
  skills:
  - sandhi.savarna
  mode: order
  prompt:
    en: 'Say what Svarikā says: “school, great soul, good saying.”'
    hi: 'वह कहिए जो स्वरिका कहती है: ‘विद्यालय, महात्मा, सुभाषित।’'
  explain:
    en: '{{विद्यालयः महात्मा सूक्तम्}}: three joins of like vowels.'
    hi: '{{विद्यालयः महात्मा सूक्तम्}}: एक-से स्वरों की तीन सन्धियाँ।'
  roman: after
  gate: true
  story:
    success:
      en: '“विद्यालयः, महात्मा, सूक्तम्,” you say, and Svarikā, the small stone spirit at the lotus statue''s feet, is released: she steps out of the hall''s shadow with a rustle of dust, a very small woman of grey stone. “I have been saying it for a thousand years,” she says, “and no one heard the words inside the word.” She puts down her lotus. “रामोऽस्ति,” she says, listening for the answer. “Rāma is.” But the next word is not for her to join. The next statue is already breathing.'
      hi: '“विद्यालयः, महात्मा, सूक्तम्,” आप कहते हैं, और स्वरिका, कमल वाली प्रतिमा के पैरों के पास का नन्हा पत्थर का भूत, मुक्त हो जाती है: वह धूल की सरसराहट के साथ कक्ष की छाया से बाहर आती है, ग्रे पत्थर की बहुत छोटी स्त्री। “मैं हज़ार वर्षों से यह कहती रही,” वह कहती है, “और किसी ने शब्द के भीतर के शब्द नहीं सुने।” वह अपना कमल रख देती है। “रामोऽस्ति,” वह उत्तर की प्रतीक्षा में कहती है। “राम है।” पर अगला शब्द उसके जोड़ने का नहीं है। अगली प्रतिमा पहले ही साँस ले रही है।'
    failure:
      en: 'The statue waits. Her three joins: {{विद्यालयः महात्मा सूक्तम्}}.'
      hi: 'प्रतिमा प्रतीक्षा करती है। उसकी तीन सन्धियाँ: {{विद्यालयः महात्मा सूक्तम्}}।'
  tokens:
  - विद्यालयः
  - महात्मा
  - सूक्तम्

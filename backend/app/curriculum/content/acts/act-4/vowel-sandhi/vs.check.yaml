  mode: choice
  prompt:
    en: '{{विद्या + आलयः}} gives…'
    hi: '{{विद्या + आलयः}} से…'
  explain:
    en: '{{आ}} + {{आ}} = {{आ}}.'
    hi: '{{आ}} + {{आ}} = {{आ}}।'
  roman: after
  options:
  - sa: विद्यैलयः
  - correct: true
    sa: विद्यालयः
  - sa: विद्योलयः
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'When two words meet, the last sound of the first and the first sound of the second may join. This is {{सन्धिः}}.
        When two vowels of the same family meet, {{अ}}/{{आ}}, {{इ}}/{{ई}}, {{उ}}/{{ऊ}}, they merge into one long vowel: {{विद्या
        + आलयः}} gives {{विद्यालयः}}.'
      hi: 'जब दो शब्द मिलते हैं, तो पहले शब्द की अन्तिम और दूसरे की पहली ध्वनि जुड़ सकती हैं। यह {{सन्धिः}} है। जब एक ही कुल
        के दो स्वर मिलते हैं, {{अ}}/{{आ}}, {{इ}}/{{ई}}, {{उ}}/{{ऊ}}, तो वे मिलकर एक दीर्घ स्वर बन जाते हैं: {{विद्या + आलयः}}
        से {{विद्यालयः}}।'

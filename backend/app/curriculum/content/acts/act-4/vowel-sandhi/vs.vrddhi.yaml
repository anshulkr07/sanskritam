  body:
    en: Sūtra 6.1.88, {{वृद्धिरेचि}}, says that when {{अ}} or {{आ}} meets an {{एच्}} vowel ({{ए}}, {{ओ}}, {{ऐ}}, {{औ}}) the
      result is vṛddhi. 1.1.1, {{वृद्धिरादैच्}}, names {{आ}}, {{ऐ}}, {{औ}} vṛddhi. So {{अ + ए}} gives {{ऐ}} and {{अ + ओ}}
      gives {{औ}}.
    hi: सूत्र 6.1.88, {{वृद्धिरेचि}}, कहता है कि जब {{अ}} या {{आ}} {{एच्}} स्वर ({{ए}}, {{ओ}}, {{ऐ}}, {{औ}}) से मिलते हैं
      तो वृद्धि होती है। 1.1.1, {{वृद्धिरादैच्}}, {{आ}}, {{ऐ}}, {{औ}} को वृद्धि कहता है। इसलिए {{अ + ए}} से {{ऐ}} और {{अ +
      ओ}} से {{औ}}।

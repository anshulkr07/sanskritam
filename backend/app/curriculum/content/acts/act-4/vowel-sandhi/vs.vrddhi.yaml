        + ओ}} gives {{औ}}.
      hi: सूत्र 6.1.88, {{वृद्धिरेचि}}, कहता है कि जब {{अ}} या {{आ}} {{एच्}} स्वर ({{ए}}, {{ओ}}, {{ऐ}}, {{औ}}) से मिलते हैं

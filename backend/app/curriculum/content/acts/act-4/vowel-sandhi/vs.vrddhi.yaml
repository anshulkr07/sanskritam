cards:
- id: s1
  kind: story
  title:
    en: The third statue
    hi: तीसरी प्रतिमा
  depth: core
  image:
    brief: The third statue holding a small drum, her fingers poised to tap; the first two statues beside her; Śuka squinting
      up at her; Lubdhaka's foreman wiping his brow; morning light.
    alt:
      en: A stone statue with a small drum poised to tap while a parrot squints up
      hi: छोटा ढोल थामे पत्थर की प्रतिमा, ऊपर देखता तोता
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - svarika
    place: simhasana-shala
    ratio: '4:3'
    id: vs-vrddhi-s1
  narration:
    en: 'The third statue holds a small drum. “सदैव,” she says: “always.” “तथैव”: “just so.” “जलौघः”: “a flood of water.”
      Śuka squints. “Those have an ऐ and an औ in the middle. Where did they come from?” “From a vowel that grew twice,” says
      Dādī. “अ meeting ए or ओ does not just strengthen: it grows to the top.”'
    hi: 'तीसरी प्रतिमा के हाथ में छोटा ढोल है। “सदैव,” वह कहती है: “हमेशा।” “तथैव”: “वैसे ही।” “जलौघः”: “जल की बाढ़।” शुक
      आँखें सिकोड़ता है। “इनके बीच में ऐ और औ हैं। ये कहाँ से आए?” “एक ऐसे स्वर से जो दो बार बढ़ा,” दादी कहती हैं। “अ का ए
      या ओ से मिलना केवल बलवान् करना नहीं है: वह चरम तक बढ़ जाता है।”'
  quote:
    sa: कात्यायनो जगादैनमुपविष्टः क्षणान्तरे
    gloss:
      en: Kātyāyana, sitting down, said to him a moment later.
      hi: बैठकर कात्यायन ने क्षण भर बाद उससे कहा।
    source: Kathāsaritsāgara 1.2 (read in the Digital Corpus of Sanskrit); jagādainam is jagāda + enam
  lines:
  - speaker: svarika
    sa: सदैव
    gloss:
      en: Always.
      hi: सदा।
    check:
      type: sandhi
      first: सदा
      second: एव
      joined: सदैव
- id: t1
  kind: teach
  title:
    en: Growing to the top
    hi: चरम तक बढ़ना
  depth: core
  skills:
  - sandhi.vrddhi
  body:
    en: When {{अ}} or {{आ}} meets {{ए}} or {{ऐ}}, the result is {{ऐ}}; when it meets {{ओ}} or {{औ}}, it is {{औ}}. {{सदा +
      एव}} gives {{सदैव}}; {{जल + ओघः}} gives {{जलौघः}}. This is {{वृद्धिः}}, the strongest grade.
    hi: जब {{अ}} या {{आ}}, {{ए}} या {{ऐ}} से मिलते हैं तो {{ऐ}} बनता है; {{ओ}} या {{औ}} से {{औ}}। {{सदा + एव}} से {{सदैव}};
      {{जल + ओघः}} से {{जलौघः}}। यह {{वृद्धिः}} है, सबसे प्रबल दर्जा।
  term:
    sa: वृद्धिः
    meaning:
      en: 'growth: आ, ऐ, औ'
      hi: 'वृद्धि: आ, ऐ, औ'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:

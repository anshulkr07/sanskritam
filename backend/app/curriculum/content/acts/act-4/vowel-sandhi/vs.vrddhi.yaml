  story:
    success:
      en: “वनौषधिः,” you say, and the drum statue taps, once. The note is dry and bright, like a branch breaking in frost.
        “Forest herbs,” she says, and taps again. “जलौघः, a flood. सदैव, always.” Lubdhaka's foreman has stopped writing.
        He is staring at a wall of statues that are all, quietly, speaking.
      hi: “वनौषधिः,” आप कहते हैं, और ढोल वाली प्रतिमा एक बार थाप देती है। ध्वनि सूखी और उजली है, पाले में टूटती डाल की तरह।
        “वन की औषधियाँ,” वह कहती है, और फिर थाप देती है। “जलौघः, बाढ़। सदैव, हमेशा।” लुब्धक का मुखिया लिखना बन्द कर चुका है।
        वह प्रतिमाओं की उस दीवार को घूर रहा है जो सब चुपचाप बोल रही हैं।
    failure:
      en: 'The drum stays silent. {{अ}} + {{औ}} = {{औ}}: {{वनौषधिः}}.'
      hi: 'ढोल चुप रहता है। {{अ}} + {{औ}} = {{औ}}: {{वनौषधिः}}।'

  roman: after
  gate: true
  story:
    success:
      en: “मुनी इमौ,” you say, “these two sages,” and you leave a clear gap between the words, as you would between two people at a door. The empty-handed statue smiles, for the first time, a little crookedly. “Yes,” she says. “Not everything joins. Sometimes the right thing is to leave the door shut.” Behind her, quietly, six statues begin to hum together.
      hi: “मुनी इमौ,” आप कहते हैं, “ये दो मुनि,” और शब्दों के बीच साफ़ अन्तराल छोड़ते हैं, जैसे द्वार पर खड़े दो लोगों के बीच। ख़ाली हाथ वाली प्रतिमा पहली बार हल्का-सा टेढ़ा मुस्कराती है। “हाँ,” वह कहती है। “हर चीज़ जुड़ती नहीं। कभी-कभी सही यही है कि द्वार बन्द रहने दिया जाए।” उसके पीछे, धीमे से, छह प्रतिमाएँ एक साथ गुनगुनाने लगती हैं।
    failure:
      en: 'The statue stays grave. A dual in {{-ई}} does not join: {{मुनी इमौ}}.'
      hi: 'प्रतिमा गम्भीर रहती है। {{-ई}} वाला द्विवचन नहीं जुड़ता: {{मुनी इमौ}}।'
  options:
  - sa: मुन्यिमौ
  - sa: मुनीमौ
  - correct: true
    sa: मुनी इमौ
- id: pn
  kind: teach
  title:
    en: Pāṇini's closed door
    hi: पाणिनि का बन्द द्वार
  depth: panini
  skills:
  - sandhi.blocked
  sutras:
  - 1.1.11
  - 6.1.125
  body:
    en: Sūtra 1.1.11, {{ईदूदेद्द्विवचनं प्रगृह्यम्}}, names the dual forms ending in {{ई}}, {{ऊ}}, {{ए}} {{प्रगृह्य}}. And 6.1.125, {{प्लुतप्रगृह्या अचि नित्यम्}}, says a {{प्रगृह्य}} stays as it is before a vowel. So there is no sandhi.
    hi: सूत्र 1.1.11, {{ईदूदेद्द्विवचनं प्रगृह्यम्}}, {{ई}}, {{ऊ}}, {{ए}} पर समाप्त द्विवचन के रूपों को {{प्रगृह्य}} नाम देता है। और 6.1.125, {{प्लुतप्रगृह्या अचि नित्यम्}}, कहता है कि {{प्रगृह्य}} स्वर से पहले जैसा है वैसा ही रहता है। इसलिए सन्धि नहीं होती।

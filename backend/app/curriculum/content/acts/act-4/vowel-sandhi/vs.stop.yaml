- id: p3
  kind: practice
  title:
    en: The closed door
    hi: बन्द द्वार
  depth: core
  skills:
  - sandhi.blocked
  mode: choice
  prompt:
    en: '{{मुनी + इमौ}} gives…'
    hi: '{{मुनी + इमौ}} से…'

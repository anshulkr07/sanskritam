- id: s1
  kind: story
  title:
    en: The sixth statue
    hi: छठी प्रतिमा
  depth: core
  image:
    brief: The sixth statue standing with open empty hands, a closed carved door behind her base; Śuka narrowing his eyes; Dādī pointing at an inscription with two words kept apart by a small gap; Lubdhaka's foreman scratching his head.
    alt:
      en: A statue with open empty hands before a closed carved door, a parrot narrowing his eyes
      hi: ख़ाली खुले हाथों वाली प्रतिमा, बन्द नक्काशीदार द्वार के सामने, आँखें सिकोड़ता तोता
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - svarika
    place: simhasana-shala
    ratio: '4:3'
    id: vs-stop-s1
  narration:
    en: 'The sixth statue holds nothing. “हरी एतौ,” she says: “these two Haris.” “ते अत्र.” “मुनी इमौ.” Śuka narrows his eyes. “Those are not joined. Look, two vowels meet and nothing happens.” “Some words are like that,” says Dādī. “Dual forms ending in ई, ऊ, ए stay apart. They are pragṛhya: the door is shut.”'
    hi: 'छठी प्रतिमा के हाथ ख़ाली हैं। “हरी एतौ,” वह कहती है: “ये दो हरि।” “ते अत्र।” “मुनी इमौ।” शुक आँखें सिकोड़ता है। “ये जुड़े नहीं हैं। देखिए, दो स्वर मिलते हैं और कुछ नहीं होता।” “कुछ शब्द ऐसे ही होते हैं,” दादी कहती हैं। “ई, ऊ, ए पर समाप्त द्विवचन के रूप अलग रहते हैं। वे प्रगृह्य हैं: दरवाज़ा बन्द है।”'
- id: t1
  kind: teach
  title:
    en: Words that stay apart
    hi: जो अलग रहते हैं
  depth: core
  skills:
  - sandhi.blocked
  body:
    en: 'Some words never join. The dual forms ending in {{ई}}, {{ऊ}} or {{ए}} stay apart before a vowel: {{हरी + एतौ}} stays {{हरी एतौ}}; {{ते + अत्र}} stays {{ते अत्र}}. These are {{प्रगृह्याः}}. Interjections such as {{अहो}} also stand apart.'
    hi: 'कुछ शब्द कभी नहीं जुड़ते। {{ई}}, {{ऊ}} या {{ए}} पर समाप्त द्विवचन के रूप स्वर से पहले भी अलग रहते हैं: {{हरी + एतौ}} {{हरी एतौ}} ही रहता है; {{ते + अत्र}} {{ते अत्र}} ही रहता है। ये {{प्रगृह्याः}} हैं। {{अहो}} जैसे विस्मयादिबोधक भी अलग रहते हैं।'
  term:
    sa: प्रगृह्यम्
    meaning:
      en: a word that does not join
      hi: वह शब्द जो नहीं जुड़ता

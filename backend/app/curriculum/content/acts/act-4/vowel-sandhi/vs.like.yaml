- id: s1
  kind: story
  title:
    en: The throne hall
    hi: सिंहासन का कक्ष
  depth: core
  image:
    brief: 'A hill above Ujjayinī at dawn: workmen''s tents and ropes around a half-uncovered stone throne ringed by thirty-two weathered statues of women; the first statue, holding a lotus, close to the viewer; Lubdhaka''s foreman frowning at her; you, Dādī and Śuka at the edge of the dig.'
    alt:
      en: A dig site with a stone throne ringed by thirty-two statues, the first holding a lotus
      hi: पत्थर के सिंहासन के चारों ओर बत्तीस प्रतिमाएँ, पहली कमल थामे
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - svarika
    place: simhasana-shala
    ratio: '4:3'
    id: vs-like-s1
  narration:
    en: 'A day''s walk from the grove, on a hill above Ujjayinī, workmen have uncovered a throne ringed by thirty-two stone women. Lubdhaka''s tents are everywhere. The first statue, a woman holding a lotus, says one word: “विद्यालयः.” His foreman frowns: “Nonsense.” “Two words,” says Dādī. “विद्या and आलयः, run together. Learn how they join and every statue will speak.”'
    hi: 'वन से एक दिन की दूरी पर, उज्जयिनी के ऊपर एक पहाड़ी पर, मज़दूरों ने बत्तीस पत्थर की नारियों से घिरा एक सिंहासन खोद निकाला है। लुब्धक के तम्बू चारों ओर हैं। पहली प्रतिमा, कमल थामे एक नारी, एक शब्द कहती है: “विद्यालयः।” उसका मुखिया भौंहें चढ़ाता है: “बकवास।” “दो शब्द,” दादी कहती हैं। “विद्या और आलयः, घुले-मिले। जोड़ना सीख लो तो हर प्रतिमा बोलेगी।”'
  lines:
  - speaker: dadi
    sa: विद्या + आलयः = विद्यालयः।
    gloss:
      en: Knowledge + home = school.
      hi: विद्या + घर = विद्यालय।
  quote:
    sa: इति व्याडिवचः श्रुत्वा मन्माता सादरावदत्
    gloss:
      en: Hearing Vyāḍi's words, my mother said respectfully.
      hi: व्याडि के ये वचन सुनकर मेरी माता ने आदर से कहा।
    source: Kathāsaritsāgara 1.2 (read in the Digital Corpus of Sanskrit); the last word is sādarā + avadat
- id: t1
  kind: teach
  title:
    en: Joining sounds
    hi: ध्वनियों का जुड़ना
  depth: core
  skills:
  - sandhi.savarna
  body:
    en: 'When two words meet, the last sound of the first and the first sound of the second may join. This is {{सन्धिः}}. When two vowels of the same family meet, {{अ}}/{{आ}}, {{इ}}/{{ई}}, {{उ}}/{{ऊ}}, they merge into one long vowel: {{विद्या + आलयः}} gives {{विद्यालयः}}.'
    hi: 'जब दो शब्द मिलते हैं, तो पहले शब्द की अन्तिम और दूसरे की पहली ध्वनि जुड़ सकती हैं। यह {{सन्धिः}} है। जब एक ही कुल के दो स्वर मिलते हैं, {{अ}}/{{आ}}, {{इ}}/{{ई}}, {{उ}}/{{ऊ}}, तो वे मिलकर एक दीर्घ स्वर बन जाते हैं: {{विद्या + आलयः}} से {{विद्यालयः}}।'
  term:
    sa: सन्धिः
    meaning:
      en: the joining of sounds
      hi: ध्वनियों का जुड़ना

  roman: after
  gate: true
  story:
    success:
      en: “सूक्तम्,” you say, “su-uktam, a good saying,” and the lotus statue turns her head, with a small grinding sound, towards you. Her fine crack closes a little. “विद्यालयः,” she says, to Lubdhaka's foreman. “महात्मा. सूक्तम्.” She lowers her lotus, and the foreman takes a step back. He did not know that stone could speak.
      hi: “सूक्तम्,” आप कहते हैं, “सु-उक्तम्, सुभाषित,” और कमल वाली प्रतिमा हल्की घिसने की आवाज़ के साथ आपकी ओर सिर घुमाती है। उसकी बारीक दरार थोड़ी भर जाती है। “विद्यालयः,” वह लुब्धक के मुखिया से कहती है। “महात्मा। सूक्तम्।” वह अपना कमल नीचे करती है, और मुखिया एक क़दम पीछे हटता है। उसे पता नहीं था कि पत्थर बोल सकता है।
    failure:
      en: 'The statue stays still. {{उ}} + {{उ}} = {{ऊ}}: {{सूक्तम्}}.'
      hi: 'प्रतिमा स्थिर रहती है। {{उ}} + {{उ}} = {{ऊ}}: {{सूक्तम्}}।'
  options:
  - sa: सुक्तम्
  - sa: सोक्तम्
  - correct: true
    sa: सूक्तम्
- id: pn
  kind: teach
  title:
    en: Pāṇini's merging
    hi: पाणिनि का मिलना
  depth: panini
  skills:
  - sandhi.savarna
  sutras:
  - 6.1.101
  - 1.1.9
  body:
    en: 'Sūtra 6.1.101, {{अकः सवर्णे दीर्घः}}, says that when {{अ}}, {{इ}}, {{उ}} or {{ऋ}} (short or long) meets a vowel of its own family, the two become one long vowel. 1.1.9, {{तुल्यास्यप्रयत्नं सवर्णम्}}, defines “own family”: sounds made in the same place with the same effort.'
    hi: 'सूत्र 6.1.101, {{अकः सवर्णे दीर्घः}}, कहता है कि जब {{अ}}, {{इ}}, {{उ}} या {{ऋ}} (ह्रस्व या दीर्घ) अपने कुल के स्वर से मिलता है, तो दोनों एक दीर्घ स्वर बन जाते हैं। 1.1.9, {{तुल्यास्यप्रयत्नं सवर्णम्}}, ‘अपने कुल’ की परिभाषा देता है: एक स्थान और एक प्रयत्न से बनी ध्वनियाँ।'

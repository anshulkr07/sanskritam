cards:
- id: s1
  kind: story
  title:
    en: The fourth statue
    hi: चौथी प्रतिमा
  depth: core
  image:
    brief: The fourth statue holding a polished bronze mirror, in which the three travellers are reflected; Śuka peering into
      it; Dādī smiling; the earlier three statues behind; Lubdhaka's foreman in the background with a notebook.
    alt:
      en: A stone statue holds a mirror in which three travellers are reflected
      hi: दर्पण थामे पत्थर की प्रतिमा, जिसमें तीन यात्रियों का प्रतिबिम्ब दिखता है
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - svarika
    place: simhasana-shala
    ratio: '4:3'
    id: vs-glide-s1
  narration:
    en: The fourth statue holds a mirror. “इत्यादि,” she says. “यद्यपि.” “स्वागतम्.” “Those have a य, a द्य, a व,” says Śuka.
      “Something is wearing a different vowel.” “The इ turns into य्,” says Dādī, “the उ into व्, the ऋ into र्. A vowel becomes
      a glide when another, different, vowel follows.”
    hi: चौथी प्रतिमा के हाथ में दर्पण है। “इत्यादि,” वह कहती है। “यद्यपि।” “स्वागतम्।” “इनमें य है, द्य है, व है,” शुक कहता
      है। “कोई स्वर दूसरा रूप पहने हुए है।” “इ य् बन जाता है,” दादी कहती हैं, “उ व्, ऋ र्। एक स्वर अर्धस्वर बन जाता है जब
      उसके बाद कोई और, भिन्न स्वर आता है।”
  lines:
  - speaker: svarika
    sa: इत्यादि
    gloss:
      en: And so on.
      hi: इत्यादि।
    check:
      type: sandhi
      first: इति
      second: आदि
      joined: इत्यादि
- id: t1
  kind: teach
  title:
    en: Vowel to glide
    hi: स्वर से अर्धस्वर
  depth: core
  skills:
  - sandhi.yan
  body:
    en: 'When {{इ}}/{{ई}}, {{उ}}/{{ऊ}} or {{ऋ}} meets a different vowel, it becomes {{य्}}, {{व्}} or {{र्}}: {{इति + आदि}}
      gives {{इत्यादि}}, {{सु + आगतम्}} gives {{स्वागतम्}}, {{पितृ + आज्ञा}} gives {{पित्राज्ञा}}. This is {{यण्}}.'
    hi: 'जब {{इ}}/{{ई}}, {{उ}}/{{ऊ}} या {{ऋ}} किसी भिन्न स्वर से मिलते हैं, तो वे {{य्}}, {{व्}} या {{र्}} बन जाते हैं: {{इति
      + आदि}} से {{इत्यादि}}, {{सु + आगतम्}} से {{स्वागतम्}}, {{पितृ + आज्ञा}} से {{पित्राज्ञा}}। यह {{यण्}} है।'
  term:
    sa: यण्
    meaning:
      en: the glides य्, व्, र्, ल्
      hi: अर्धस्वर य्, व्, र्, ल्
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:

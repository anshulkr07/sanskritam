- id: p5
  kind: practice
  title:
    en: The mirror
    hi: दर्पण
  depth: core
  skills:
  - sandhi.yan
  mode: choice
  prompt:
    en: '{{पितृ + आज्ञा}} gives…'
    hi: '{{पितृ + आज्ञा}} से…'
  explain:
    en: '{{ऋ}} → {{र्}}.'
    hi: '{{ऋ}} → {{र्}}।'
  roman: after
  gate: true
  story:
    success:
      en: “पित्राज्ञा,” you say, “a father's command,” and the mirror in the statue's hand clears. In it the travellers are
        reflected, and behind them, in the glass, a long procession of other people, walking up the hill to the throne for
        a thousand years, each saying a word of welcome. “स्वागतम्,” the statue says. “Welcome.”
      hi: “पित्राज्ञा,” आप कहते हैं, “पिता की आज्ञा,” और प्रतिमा के हाथ का दर्पण साफ़ हो जाता है। उसमें यात्री दिखते हैं,
        और उनके पीछे काँच में, अन्य लोगों की लम्बी शोभायात्रा, हज़ार वर्षों से पहाड़ी चढ़कर सिंहासन तक आते, हर एक स्वागत का
        एक शब्द कहता हुआ। “स्वागतम्,” प्रतिमा कहती है। “स्वागत है।”
    failure:
      en: 'The mirror stays dim. {{ऋ}} → {{र्}}: {{पित्राज्ञा}}.'
      hi: 'दर्पण धुँधला रहता है। {{ऋ}} → {{र्}}: {{पित्राज्ञा}}।'

  - sa: पितृआज्ञा
  - sa: पितराज्ञा
  - correct: true
    sa: पित्राज्ञा
- id: pn
  kind: teach
  title:
    en: Pāṇini's glide
    hi: पाणिनि का अर्धस्वर
  depth: panini
  skills:
  - sandhi.yan
  sutras:
  - 6.1.77
  body:
    en: Sūtra 6.1.77, {{इको यणचि}}, says that {{इक्}} (the vowels {{इ}}, {{उ}}, {{ऋ}}, {{ऌ}}) is replaced by {{यण्}} ({{य्}}, {{व्}}, {{र्}}, {{ल्}}) before a vowel. So {{इति + आदि}} gives {{इत्यादि}}, {{सु + आगतम्}} gives {{स्वागतम्}}.
    hi: सूत्र 6.1.77, {{इको यणचि}}, कहता है कि स्वर के पहले {{इक्}} ({{इ}}, {{उ}}, {{ऋ}}, {{ऌ}}) की जगह {{यण्}} ({{य्}}, {{व्}}, {{र्}}, {{ल्}}) हो जाता है। इसलिए {{इति + आदि}} से {{इत्यादि}}, {{सु + आगतम्}} से {{स्वागतम्}}।

  - sandhi.ayadi
  mode: choice
  prompt:
    en: '{{वने + अस्ति}} gives…'
    hi: '{{वने + अस्ति}} से…'
  explain:
    en: '{{ए}} + {{अ}} keeps the {{ए}} and marks the {{अ}} with {{ऽ}}.'
    hi: '{{ए}} + {{अ}} में {{ए}} रहता है और {{अ}} को {{ऽ}} चिह्नित करता है।'
  roman: after
  gate: true
  story:
    success:
      en: '“वनेऽस्ति,” you say, “it is in the forest,” and the oar statue dips her oar. In the stone floor of the hall, where there was only dust, a thin line of water runs across and vanishes in a crack: a river that is not there any more. “नाविकः,” she says gently. “The boatman has gone.” But the small curl on the wall of the hall, the ऽ, is still shining.'
      hi: '“वनेऽस्ति,” आप कहते हैं, “वह वन में है,” और पतवार वाली प्रतिमा अपनी पतवार डुबोती है। कक्ष के पत्थर के फ़र्श पर, जहाँ केवल धूल थी, पानी की एक पतली लकीर बहती है और एक दरार में खो जाती है: एक नदी जो अब नहीं है। “नाविकः,” वह कोमलता से कहती है। “नाविक चला गया।” पर कक्ष की दीवार पर वह छोटा मोड़, ऽ, अब भी चमक रहा है।'
    failure:
      en: 'The oar stays dry. {{ए}} + {{अ}} = {{एऽ}}: {{वनेऽस्ति}}.'
      hi: 'पतवार सूखी रहती है। {{ए}} + {{अ}} = {{एऽ}}: {{वनेऽस्ति}}।'
  options:
  - sa: वनेअस्ति
  - sa: वनयस्ति
  - correct: true
    sa: वनेऽस्ति
- id: pn
  kind: teach
  title:
    en: Pāṇini's ay, av
    hi: पाणिनि के अय्, अव्
  depth: panini
  skills:
  - sandhi.ayadi
  sutras:
  - 6.1.78
  - 6.1.109
  body:
    en: Sūtra 6.1.78, {{एचोऽयवायावः}}, replaces {{ए}}, {{ओ}}, {{ऐ}}, {{औ}} before a vowel with {{अय्}}, {{अव्}}, {{आय्}}, {{आव्}}. And 6.1.109, {{एङः पदान्तादति}}, says that a word-final {{ए}} or {{ओ}} before {{अ}} keeps itself and the {{अ}} is dropped, marked {{ऽ}}.
    hi: सूत्र 6.1.78, {{एचोऽयवायावः}}, स्वर से पहले {{ए}}, {{ओ}}, {{ऐ}}, {{औ}} की जगह {{अय्}}, {{अव्}}, {{आय्}}, {{आव्}} करता है। और 6.1.109, {{एङः पदान्तादति}}, कहता है कि पद के अन्त के {{ए}} या {{ओ}} के बाद {{अ}} आए तो {{ए}}/{{ओ}} रहता है और {{अ}} गिरा दिया जाता है, {{ऽ}} से चिह्नित।
- id: sum
  kind: summary
  title:
    en: Vowels before vowels
    hi: स्वर से पहले ए, ओ, ऐ, औ
  depth: core
  points:
  - sa: औ + इ = आवि
    text:
      en: नौ + इकः = नाविकः.
      hi: नौ + इकः = नाविकः।
  - sa: ए + अ = एऽ
    text:
      en: वने + अस्ति = वनेऽस्ति.
      hi: वने + अस्ति = वनेऽस्ति।
  - sa: ए + इ = अ इ
    text:
      en: हरे + इह = हर इह.
      hi: हरे + इह = हर इह।

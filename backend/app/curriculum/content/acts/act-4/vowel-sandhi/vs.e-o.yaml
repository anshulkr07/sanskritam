- id: s1
  kind: story
  title:
    en: The fifth statue
    hi: पाँचवीं प्रतिमा
  depth: core
  image:
    brief: The fifth statue holding a carved stone oar upright, a faint wave pattern carved on her base; Śuka tilting his head; Dādī pointing at the small curl on a rubbing of an inscription; morning light.
    alt:
      en: A stone statue holds an oar upright while a parrot tilts his head at an inscription rubbing
      hi: पतवार थामे पत्थर की प्रतिमा, अभिलेख की छाप देखता तोता
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - svarika
    place: simhasana-shala
    ratio: '4:3'
    id: vs-e-o-s1
  narration:
    en: 'The fifth statue holds an oar. “नाविकः,” she says. “पावकः.” “वनेऽस्ति.” Śuka tilts his head: “नाविकः has a व. And वनेऽस्ति has a little curl, ऽ. Where did a letter go?” “Two things,” says Dādī. “An ऐ or औ before a vowel turns into आय् or आव्. And an ए before अ drops the अ, leaving the little curl behind.”'
    hi: 'पाँचवीं प्रतिमा के हाथ में पतवार है। “नाविकः,” वह कहती है। “पावकः।” “वनेऽस्ति।” शुक सिर टेढ़ा करता है: “नाविकः में व है। और वनेऽस्ति में एक छोटा मोड़ है, ऽ। कोई अक्षर कहाँ गया?” “दो बातें,” दादी कहती हैं। “स्वर से पहले ऐ या औ आय् या आव् बन जाता है। और अ से पहले ए अपना अ गिरा देता है, और छोटा मोड़ छोड़ जाता है।”'
- id: t1
  kind: teach
  title:
    en: ए, ओ, ऐ, औ before a vowel
    hi: स्वर से पहले ए, ओ, ऐ, औ
  depth: core
  skills:
  - sandhi.ayadi
  body:
    en: '{{औ}} before a vowel becomes {{आव्}}: {{नौ + इकः}} gives {{नाविकः}}. {{ऐ}} becomes {{आय्}} (often written {{आ}} before a vowel: {{तस्मै + इदम्}} gives {{तस्मा इदम्}}). {{ए}} before {{इ}} or {{आ}} drops to {{अ}}: {{हरे + इह}} gives {{हर इह}}. Before {{अ}} it leaves {{ऽ}}: {{वने + अस्ति}} gives {{वनेऽस्ति}}.'
    hi: 'स्वर से पहले {{औ}} {{आव्}} बन जाता है: {{नौ + इकः}} से {{नाविकः}}। {{ऐ}} {{आय्}} बनता है (स्वर से पहले अक्सर {{आ}} लिखा जाता है: {{तस्मै + इदम्}} से {{तस्मा इदम्}})। {{इ}} या {{आ}} से पहले {{ए}} घटकर {{अ}} हो जाता है: {{हरे + इह}} से {{हर इह}}। {{अ}} से पहले वह {{ऽ}} छोड़ जाता है: {{वने + अस्ति}} से {{वनेऽस्ति}}।'
  term:
    sa: ऽ
    meaning:
      en: the avagraha, a missing अ
      hi: अवग्रह, लुप्त अ

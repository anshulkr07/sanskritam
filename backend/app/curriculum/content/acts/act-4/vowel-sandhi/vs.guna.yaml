- id: s1
  kind: story
  title:
    en: The second statue
    hi: दूसरी प्रतिमा
  depth: core
  image:
    brief: The second statue, a woman holding a conch, with Śuka on Dādī's shoulder counting on his claws; Lubdhaka's foreman looking on with arms folded; the first statue beside her with a lotus; morning light on the dig.
    alt:
      en: A stone statue holding a conch while a parrot counts on his claws and a foreman watches
      hi: शंख थामे पत्थर की प्रतिमा, पंजों पर गिनता तोता, देखता मुखिया
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - svarika
    place: simhasana-shala
    ratio: '4:3'
    id: vs-guna-s1
  narration:
    en: 'The second statue holds a conch. “गणेशः,” she says, and “महोत्सवः,” and “सप्तर्षयः.” “These are different,” says Śuka, who has been counting. “In the first, two vowels became one long one. Here, a vowel turned into something else.” “Yes,” says Dādī. “When अ meets इ or उ, it does not merge: it strengthens.”'
    hi: 'दूसरी प्रतिमा के हाथ में शंख है। “गणेशः,” वह कहती है, और “महोत्सवः,” और “सप्तर्षयः।” “ये अलग हैं,” शुक कहता है, जो गिन रहा था। “पहले में दो स्वर मिलकर एक दीर्घ बने थे। यहाँ एक स्वर कुछ और बन गया है।” “हाँ,” दादी कहती हैं। “जब अ इ या उ से मिलता है, तो वह मिलता नहीं: वह बलवान् हो जाता है।”'
  lines:
  - speaker: svarika
    sa: गणेशः
    gloss:
      en: Gaṇeśa.
      hi: गणेश।
    check:
      type: sandhi
      first: गण
      second: ईशः
      joined: गणेशः
- id: t1
  kind: teach
  title:
    en: Strengthening
    hi: बलवान् होना
  depth: core
  skills:
  - sandhi.guna
  body:
    en: When {{अ}} or {{आ}} meets {{इ}} or {{ई}}, the result is {{ए}}; with {{उ}} or {{ऊ}}, it is {{ओ}}; with {{ऋ}}, it is {{अर्}}. {{गण + ईशः}} gives {{गणेशः}}, {{महा + उत्सवः}} gives {{महोत्सवः}}, {{सप्त + ऋषयः}} gives {{सप्तर्षयः}}. This is {{गुणः}}.
    hi: जब {{अ}} या {{आ}}, {{इ}} या {{ई}} से मिलते हैं तो {{ए}} बनता है; {{उ}} या {{ऊ}} से {{ओ}}; {{ऋ}} से {{अर्}}। {{गण + ईशः}} से {{गणेशः}}, {{महा + उत्सवः}} से {{महोत्सवः}}, {{सप्त + ऋषयः}} से {{सप्तर्षयः}}। यह {{गुणः}} है।
  term:
    sa: गुणः
    meaning:
      en: 'strengthening: अ→अ, इ→ए, उ→ओ, ऋ→अर्'
      hi: 'बलवान् होना: इ→ए, उ→ओ, ऋ→अर्'
  formula: अ + इ → ए · अ + उ → ओ · अ + ऋ → अर्

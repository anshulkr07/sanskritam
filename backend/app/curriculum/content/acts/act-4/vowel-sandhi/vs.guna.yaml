- id: pn
  kind: teach
  title:
    en: Pāṇini's guṇa
    hi: पाणिनि का गुण
  depth: panini
  skills:
  - sandhi.guna
  sutras:
  - 6.1.87
  - 1.1.2
  body:
    en: Sūtra 6.1.87, {{आद्गुणः}}, says that after {{अ}} or {{आ}}, a following vowel merges with it into its guṇa. 1.1.2, {{अदेङ् गुणः}}, names {{अ}}, {{ए}}, {{ओ}} guṇa. So {{अ + इ}} gives {{ए}}, {{अ + उ}} gives {{ओ}}.
    hi: सूत्र 6.1.87, {{आद्गुणः}}, कहता है कि {{अ}} या {{आ}} के बाद आने वाला स्वर उसके साथ मिलकर अपने गुण में बदल जाता है। 1.1.2, {{अदेङ् गुणः}}, {{अ}}, {{ए}}, {{ओ}} को गुण कहता है। इसलिए {{अ + इ}} से {{ए}}, {{अ + उ}} से {{ओ}}।

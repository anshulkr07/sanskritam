      hi: पाँचवाँ लघु, छठा गुरु।
  - text:
      en: 'Seventh: heavy in quarters 1 and 3, light in 2 and 4.'
      hi: 'सातवाँ: चरण 1 और 3 में गुरु, 2 और 4 में लघु।'

  kind: practice
  title:
    en: The first śloka
    hi: पहला श्लोक
  depth: core
  skills:
  - chandas.shloka
  mode: choice
  prompt:
    en: In {{मा निषाद प्रतिष्ठाम्}} the seventh syllable is heavy. Which quarter is it?
    hi: '{{मा निषाद प्रतिष्ठाम्}} में सातवाँ अक्षर गुरु है। यह कौन-सा चरण है?'
  explain:
    en: Heavy in the seventh place belongs to quarters one and three.
    hi: सातवें स्थान पर गुरु चरण एक और तीन का है।
  roman: after
  gate: true
  story:
    success:
      en: “मा निषाद प्रतिष्ठां त्वमगमः शाश्वतीं समाः,” you chant, and Chandikā beats it with you, beat for beat, and the half-verse
        closes square on its sixteenth syllable. The spirit lets her sticks fall. “That is the shape,” she says. “Grief had
        to be held.” Across the hall, a long-sealed stone panel with a carved line on it slides open a hand's breadth.
      hi: “मा निषाद प्रतिष्ठां त्वमगमः शाश्वतीं समाः,” आप पढ़ते हैं, और छन्दिका आपके साथ ताल पर ताल देती है, और आधा श्लोक
        अपने सोलहवें अक्षर पर ठीक बैठ जाता है। भूत अपनी डंडियाँ छोड़ देती है। “यही आकार है,” वह कहती है। “शोक को थामना था।”
        कक्ष के पार, एक बन्द पत्थर का फलक, जिस पर पंक्ति खुदी है, हाथ भर सरक जाता है।
    failure:
      en: 'Her sticks stay up. The seventh place: heavy in quarters one and three.'
      hi: 'उसकी डंडियाँ उठी रहती हैं। सातवाँ स्थान: चरण एक और तीन में गुरु।'

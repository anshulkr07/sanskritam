- id: s1
  kind: story
  title:
    en: Grief into verse
    hi: शोक से श्लोक
  depth: core
  image:
    brief: Dādī telling the legend with a hand raised; behind her, a faint painted vision of a sage by a river looking up
      at a hunter who has lowered his bow, and a pair of cranes, one fallen, one crying; Chandikā listening with her drum
      in her lap; Śuka perched wide-eyed on the throne; Lubdhaka at the back, no longer smiling.
    alt:
      en: Dādī tells a legend while a faint vision shows a sage, a hunter and two cranes
      hi: दादी कथा सुनाती हैं, पीछे ऋषि, व्याध और दो सारस की धुँधली छवि
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - chandika
    place: simhasana-shala
    ratio: '4:3'
    id: m1-shloka-s1
  narration:
    en: 'Chandikā''s drum is steady now. “Do you know where the śloka was born?” says Dādī. “A sage saw a hunter shoot one
      of two birds, and his grief came out in measured words: मा निषाद, hunter, may you find no rest! It had four quarters
      of eight syllables, and he said: the grief had become śloka.” At the back, Lubdhaka stops smiling.'
    hi: 'छन्दिका का ढोल अब स्थिर है। “क्या आप जानते हैं श्लोक का जन्म कहाँ हुआ?” दादी कहती हैं। “एक ऋषि ने देखा कि व्याध ने
      दो पक्षियों में से एक को मार दिया, और उनका शोक नपे-तुले शब्दों में फूट पड़ा: मा निषाद, व्याध, तुझे चैन न मिले! उसके
      चार चरण थे, आठ-आठ अक्षर के, और उन्होंने कहा: शोक ही श्लोक बन गया।” पीछे, लुब्धक की मुस्कान रुक जाती है।'
  quote:
    sa: समाक्षरैश् चतुर्भिर् यः पादैर् गीतो महर्षिणा सो ऽनुव्याहरणाद् भूयः शोकः श्लोकत्वम् आगतः
    gloss:
      en: 'What the great sage sang in four quarters of equal syllables: by his saying it again, that grief became a śloka.'
      hi: 'महर्षि ने जो चार समान अक्षरों वाले चरणों में गाया: उसे दोबारा कहने से वह शोक श्लोक बन गया।'
    source: Rāmāyaṇa, Bālakāṇḍa 2 (read in the Digital Corpus of Sanskrit)
- id: t1
  kind: teach
  title:
    en: Four quarters of eight
    hi: आठ-आठ के चार चरण
  depth: core
  skills:
  - chandas.shloka
  body:
    en: 'A śloka has four quarters ({{पाद}}) of eight syllables: 32 in all, or 16 in each half. The first four syllables and
      the eighth are free. In the middle the pattern is fixed: the fifth light, the sixth heavy, and the seventh heavy in
      quarters one and three, light in two and four.'
    hi: 'श्लोक में चार चरण ({{पाद}}) होते हैं, आठ-आठ अक्षर के: कुल 32, या हर आधे में 16। पहले चार अक्षर और आठवाँ स्वतन्त्र
      हैं। बीच में ढाँचा बँधा है: पाँचवाँ लघु, छठा गुरु, और सातवाँ पहले-तीसरे चरण में गुरु, दूसरे-चौथे में लघु।'
  term:
    sa: पादः
    meaning:
      en: a quarter of a verse
      hi: श्लोक का चरण

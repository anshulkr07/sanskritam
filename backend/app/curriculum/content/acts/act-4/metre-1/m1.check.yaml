- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - chandas.weight
  mode: choice
  prompt:
    en: Which syllable is heavy?
    hi: कौन-सा अक्षर गुरु है?
  explain:
    en: '{{का}} has a long vowel.'
    hi: '{{का}} में दीर्घ स्वर है।'
  roman: after
  options:
  - sa: कि
  - sa: कु
  - correct: true
    sa: का
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: Every syllable is light ({{लघु}}) or heavy ({{गुरु}}). It is light when its vowel is short and nothing joined follows.
        It is heavy when its vowel is long, or when a short vowel is followed by a joined letter, an anusvāra or a visarga.
        Light takes one beat; heavy takes two.
      hi: हर अक्षर लघु ({{लघु}}) होता है या गुरु ({{गुरु}})। स्वर ह्रस्व हो और आगे संयुक्त अक्षर न हो, तो वह लघु है। स्वर
        दीर्घ हो, या ह्रस्व स्वर के बाद संयुक्त अक्षर, अनुस्वार या विसर्ग हो, तो वह गुरु है। लघु में एक मात्रा लगती है; गुरु
        में दो।
    items:
    - id: i0
      sa: लघु
    - id: i1
      sa: गुरु

- id: p5
  kind: practice
  depth: core
  skills:
  - chandas.shloka
  mode: choice
  prompt:
    en: How many syllables are in a quarter of a śloka?
    hi: श्लोक के एक चरण में कितने अक्षर होते हैं?
  explain:
    en: Eight; two quarters make 16.
    hi: आठ; दो चरणों के 16।
  roman: after
  options:
  - correct: true
    text:
      en: '8'
      hi: ८
  - text:
      en: '16'
      hi: १६
  - text:
      en: '32'
      hi: ३२
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'A śloka has four quarters ({{पाद}}) of eight syllables: 32 in all, or 16 in each half. The first four syllables
        and the eighth are free. In the middle the pattern is fixed: the fifth light, the sixth heavy, and the seventh heavy
        in quarters one and three, light in two and four.'
      hi: 'श्लोक में चार चरण ({{पाद}}) होते हैं, आठ-आठ अक्षर के: कुल 32, या हर आधे में 16। पहले चार अक्षर और आठवाँ स्वतन्त्र
        हैं। बीच में ढाँचा बँधा है: पाँचवाँ लघु, छठा गुरु, और सातवाँ पहले-तीसरे चरण में गुरु, दूसरे-चौथे में लघु।'
    items:
    - id: i0
      sa: पाद

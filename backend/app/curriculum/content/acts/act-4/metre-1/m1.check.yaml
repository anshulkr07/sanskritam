- id: p8
  kind: practice
  depth: core
  skills:
  - chandas.shloka
  mode: choice
  prompt:
    en: The seventh syllable of the second quarter is…
    hi: दूसरे चरण का सातवाँ अक्षर होता है…
  explain:
    en: Heavy in quarters one and three; light in two and four.
    hi: चरण एक और तीन में गुरु; दो और चार में लघु।
  roman: after
  gate: true
  story:
    success:
      en: '“अनुष्टुप्,” says Chandikā, and for the first time her drum names the beat before she plays it. The stone panel
        across the hall slides open: behind it, set into the wall, a line in a clear, deeper hand, a longer measure than any
        you have chanted: इन्द्रवज्रा उपजाति। The spirit lays her drum in your hands, gently, and fades into the throne''s
        hum, light as a note.'
      hi: '“अनुष्टुप्,” छन्दिका कहती है, और पहली बार उसका ढोल ताल को बजाने से पहले उसका नाम लेता है। कक्ष के पार पत्थर का
        फलक खुल जाता है: उसके पीछे दीवार में जड़ी, गहरे स्पष्ट अक्षरों की एक पंक्ति, आपके पढ़े किसी भी छन्द से लम्बी माप की:
        इन्द्रवज्रा उपजाति। भूत अपना ढोल धीरे से आपके हाथों में रखती है और सिंहासन की गुनगुनाहट में घुल जाती है, किसी स्वर
        की तरह हल्की।'
    failure:
      en: Her drum is silent. The seventh place of quarter two is light.
      hi: उसका ढोल मौन है। दूसरे चरण का सातवाँ स्थान लघु है।
  options:

- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: chandas.weight
    rule:
      en: '{{ह्रस्वं लघु}}, {{संयोगे गुरु}}, {{दीर्घं च}}: light, heavy before a joined letter, and long.'
      hi: '{{ह्रस्वं लघु}}, {{संयोगे गुरु}}, {{दीर्घं च}}: लघु, संयुक्त से पहले गुरु, और दीर्घ।'
    sutras:
    - 1.4.10
    - 1.4.11
    - 1.4.12
    tag: core
    taught_in: m1.weight#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Pāṇini defines the terms for his own use: 1.4.10, {{ह्रस्वं लघु}}, a short vowel is light; 1.4.11, {{संयोगे गुरु}},
          a short vowel before a joined letter is heavy; 1.4.12, {{दीर्घं च}}, and a long vowel is heavy. The books of metre
          add the anusvāra and the visarga.'
        hi: 'पाणिनि अपने काम के लिए ये संज्ञाएँ बनाते हैं: 1.4.10, {{ह्रस्वं लघु}}, ह्रस्व स्वर लघु है; 1.4.11, {{संयोगे गुरु}},
          संयुक्त अक्षर से पहले ह्रस्व स्वर गुरु है; 1.4.12, {{दीर्घं च}}, और दीर्घ स्वर गुरु है। छन्द के ग्रन्थ अनुस्वार
          और विसर्ग को जोड़ते हैं।'
      items:
      - id: i0
        sa: ह्रस्वं लघु
      - id: i1
        sa: संयोगे गुरु
      - id: i2
        sa: दीर्घं च

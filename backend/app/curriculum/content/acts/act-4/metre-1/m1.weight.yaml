- id: pn
  kind: teach
  title:
    en: Pāṇini's weights
    hi: पाणिनि के भार
  depth: panini
  skills:
  - chandas.weight
  sutras:
  - 1.4.10
  - 1.4.11
  - 1.4.12
  body:
    en: 'Pāṇini defines the terms for his own use: 1.4.10, {{ह्रस्वं लघु}}, a short vowel is light; 1.4.11, {{संयोगे गुरु}},
      a short vowel before a joined letter is heavy; 1.4.12, {{दीर्घं च}}, and a long vowel is heavy. The books of metre add
      the anusvāra and the visarga.'
    hi: 'पाणिनि अपने काम के लिए ये संज्ञाएँ बनाते हैं: 1.4.10, {{ह्रस्वं लघु}}, ह्रस्व स्वर लघु है; 1.4.11, {{संयोगे गुरु}},
      संयुक्त अक्षर से पहले ह्रस्व स्वर गुरु है; 1.4.12, {{दीर्घं च}}, और दीर्घ स्वर गुरु है। छन्द के ग्रन्थ अनुस्वार और विसर्ग
      को जोड़ते हैं।'

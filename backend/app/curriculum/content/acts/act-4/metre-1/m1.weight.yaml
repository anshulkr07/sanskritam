- id: s1
  kind: story
  title:
    en: The drum spirit
    hi: ढोल की भूत
  depth: core
  image:
    brief: A small grey-blue stone spirit with a drum sitting on the carved arm of a golden throne, tapping with both hands;
      Dādī crouching to talk to her; Śuka on the throne's back tilting his head at a line of carved verse on the seat; Lubdhaka
      at the back in the shadows.
    alt:
      en: A tiny stone spirit with a drum sits on a throne's arm while a parrot studies a carved line
      hi: सिंहासन की बाँह पर ढोल लिए नन्ही पत्थर की भूत, खुदी पंक्ति देखता तोता
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - chandika
    place: simhasana-shala
    ratio: '4:3'
    id: m1-weight-s1
    text_in_image:
    - धर्मक्षेत्रे कुरुक्षेत्रे
  narration:
    en: 'The fifth leaf glows in your hand, but the throne still hums. On its arm sits a stone spirit with a drum, tapping
      every beat the same: tap, tap, tap. “Every syllable has a weight,” says Dādī. “Light is one beat; heavy is two. Chandikā
      cannot hear the difference, so she cannot follow a verse.” Śuka tilts his head at a line carved on the seat.'
    hi: 'पाँचवाँ पत्र आपके हाथ में चमक रहा है, पर सिंहासन अब भी गुनगुना रहा है। उसकी बाँह पर पत्थर की एक नन्ही भूत बैठी है,
      हाथ में ढोल लिए, हर ताल एक-सी बजाती हुई: ठक, ठक, ठक। “हर अक्षर का एक भार होता है,” दादी कहती हैं। “लघु एक ताल है; गुरु
      दो। छन्दिका को यह अन्तर सुनाई नहीं देता, इसलिए वह श्लोक के साथ नहीं चल पाती।” शुक आसन पर खुदी एक पंक्ति की ओर सिर झुकाता
      है।'
  quote:
    sa: धर्मक्षेत्रे कुरुक्षेत्रे समवेता युयुत्सवः मामकाः पाण्डवाश् चैव किम् अकुर्वत सञ्जय
    gloss:
      en: 'On the field of dharma, the field of the Kurus, gathered and eager to fight: what did my people and the Pāṇḍavas
        do, Sañjaya?'
      hi: धर्म के क्षेत्र, कुरुक्षेत्र में, युद्ध की इच्छा से एकत्र होकर, मेरे और पाण्डु के पुत्रों ने क्या किया, सञ्जय?
    source: Bhagavadgītā 1.1 (read at GRETIL)
- id: t1
  kind: teach
  title:
    en: Light and heavy
    hi: लघु और गुरु
  depth: core
  skills:
  - chandas.weight
  body:
    en: Every syllable is light ({{लघु}}) or heavy ({{गुरु}}). It is light when its vowel is short and nothing joined follows.
      It is heavy when its vowel is long, or when a short vowel is followed by a joined letter, an anusvāra or a visarga.
      Light takes one beat; heavy takes two.
    hi: हर अक्षर लघु ({{लघु}}) होता है या गुरु ({{गुरु}})। स्वर ह्रस्व हो और आगे संयुक्त अक्षर न हो, तो वह लघु है। स्वर दीर्घ
      हो, या ह्रस्व स्वर के बाद संयुक्त अक्षर, अनुस्वार या विसर्ग हो, तो वह गुरु है। लघु में एक मात्रा लगती है; गुरु में दो।
  term:
    sa: लघु · गुरु
    meaning:
      en: light · heavy
      hi: हल्का · भारी
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: Every syllable is light ({{लघु}}) or heavy ({{गुरु}}). It is light when its vowel is short and nothing joined follows.
        It is heavy when its vowel is long, or when a short vowel is followed by a joined letter, an anusvāra or a visarga.
        Light takes one beat; heavy takes two.
      hi: हर अक्षर लघु ({{लघु}}) होता है या गुरु ({{गुरु}})। स्वर ह्रस्व हो और आगे संयुक्त अक्षर न हो, तो वह लघु है। स्वर
        दीर्घ हो, या ह्रस्व स्वर के बाद संयुक्त अक्षर, अनुस्वार या विसर्ग हो, तो वह गुरु है। लघु में एक मात्रा लगती है; गुरु
        में दो।
    items:

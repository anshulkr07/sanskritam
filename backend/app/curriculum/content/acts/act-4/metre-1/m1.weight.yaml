        a short vowel before a joined letter is heavy; 1.4.12, {{दीर्घं च}}, and a long vowel is heavy. The books of metre
        add the anusvāra and the visarga.'
      hi: 'पाणिनि अपने काम के लिए ये संज्ञाएँ बनाते हैं: 1.4.10, {{ह्रस्वं लघु}}, ह्रस्व स्वर लघु है; 1.4.11, {{संयोगे गुरु}},
        संयुक्त अक्षर से पहले ह्रस्व स्वर गुरु है; 1.4.12, {{दीर्घं च}}, और दीर्घ स्वर गुरु है। छन्द के ग्रन्थ अनुस्वार और
        विसर्ग को जोड़ते हैं।'
    items:
    - id: i0
      sa: ह्रस्वं लघु
    - id: i1
      sa: संयोगे गुरु
    - id: i2
      sa: दीर्घं च
- id: sum
  kind: summary
  title:
    en: Light and heavy
    hi: लघु और गुरु
  depth: core
  points:
  - sa: लघु
    text:
      en: 'Light: one beat.'
      hi: 'लघु: एक ताल।'
  - sa: गुरु
    text:
      en: 'Heavy: two beats.'
      hi: 'गुरु: दो ताल।'
  - text:
      en: 'Heavy: long vowel; short vowel before a joined letter, anusvāra or visarga.'
      hi: 'गुरु: दीर्घ स्वर; संयुक्त अक्षर, अनुस्वार या विसर्ग से पहले ह्रस्व स्वर।'

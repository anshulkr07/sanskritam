- id: p5
  kind: practice
  title:
    en: The drum
    hi: ढोल
  depth: core
  skills:
  - chandas.weight
  mode: choice
  prompt:
    en: '{{विद्या}}: how does it weigh?'
    hi: '{{विद्या}}: उसका भार क्या है?'
  explain:
    en: '{{वि}} is short but heavy, because the joined {{द्य}} follows; {{द्या}} is long.'
    hi: '{{वि}} ह्रस्व है पर भारी, क्योंकि आगे संयुक्त {{द्य}} है; {{द्या}} दीर्घ है।'
  roman: after
  gate: true
  story:
    success:
      en: “विद्या,” you say. “Heavy, heavy.” The little spirit's sticks come down twice for each syllable, long, long, and
        then, to her own surprise, she stops. Her even tapping has split into two kinds of beat. “Short and long,” she whispers.
        Under her hands the hum of the throne steadies, like a held note. “Now I can hear that there is something to follow.”
      hi: “विद्या,” आप कहते हैं। “गुरु, गुरु।” नन्ही भूत की डंडियाँ हर अक्षर पर दो बार गिरती हैं, लम्बी, लम्बी, और फिर, अपने
        ही आश्चर्य से, वह रुक जाती है। उसकी एक-सी थाप दो तरह की ताल में बँट गई है। “छोटी और लम्बी,” वह फुसफुसाती है। उसके
        हाथों के नीचे सिंहासन की गुनगुनाहट स्थिर हो जाती है, जैसे थामा हुआ स्वर। “अब मैं सुन सकती हूँ कि चलने के लिए कुछ है।”
    failure:
      en: Her tapping stays even. {{वि}} is short, but the joined {{द्य}} follows.
      hi: उसकी थाप एक-सी रहती है। {{वि}} ह्रस्व है, पर आगे संयुक्त {{द्य}} है।
  options:
  - sa: ल ल
  - sa: ल ग
  - correct: true
    sa: ग ग

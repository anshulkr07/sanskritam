- id: p9
  kind: practice
  depth: core
  skills:
  - verse.read
  mode: choice
  prompt:
    en: Which step turns the carved line into separate words?
    hi: कौन-सा चरण खुदी पंक्ति को अलग-अलग शब्दों में बदलता है?
  explain:
    en: '{{पदच्छेदः}}: splitting.'
    hi: '{{पदच्छेदः}}: तोड़ना।'
  roman: after
  gate: true
  story:
    success:
      en: '“पदच्छेदः, अन्वयः, अर्थः,” says Ślokikā, in one breath, and the cord that bound her falls away like a thread of
        ink in water. She stands, small and upright, with her verse in the air round her: विद्या ददाति विनयम्, every word
        standing clear. Behind her, in the wall of the vault, a glass-fronted case swings open, and in it lies a palm leaf,
        whole, glowing: the sixth. Written on its edge, in a quick hand: कथा, महाकथा।'
      hi: '“पदच्छेदः, अन्वयः, अर्थः,” श्लोकिका एक साँस में कहती है, और उसे बाँधने वाली डोरी पानी में स्याही के धागे की तरह
        गिर जाती है। वह खड़ी होती है, छोटी और सीधी, उसका श्लोक उसके चारों ओर हवा में: विद्या ददाति विनयम्, हर शब्द साफ़ खड़ा
        हुआ। उसके पीछे, तहख़ाने की दीवार में, काँच-जड़ा एक सन्दूक खुल जाता है, और उसमें एक ताड़पत्र पड़ा है, पूरा, चमकता:
        छठा। उसके किनारे पर, तेज़ हाथ से लिखा: कथा, महाकथा।'
    failure:
      en: 'The cord holds. Splitting comes first: {{पदच्छेदः}}.'
      hi: 'डोरी कसी रहती है। तोड़ना पहले आता है: {{पदच्छेदः}}।'
  options:
  - sa: अन्वयः
  - sa: अर्थः
  - correct: true
    sa: पदच्छेदः
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison

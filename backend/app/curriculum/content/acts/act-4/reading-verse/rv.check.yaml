- id: p6
  kind: practice
  depth: core
  skills:
  - verse.commentary
  mode: match
  prompt:
    en: Match each word of the verse with the commentary's word.
    hi: श्लोक के हर शब्द को टीका के शब्द से मिलाइए।
  explain:
    en: The commentary puts its own word beside the verse's.
    hi: टीका श्लोक के शब्द के पास अपना शब्द रखती है।
  roman: after
  pairs:
  - left:
      sa: भुञ्जीथाः
    right:
      sa: पालयेथाः
  - left:
      sa: त्यक्तेन
    right:
      sa: त्यागेन
  - left:
      sa: मा गृधः
    right:
      sa: गृधिं मा कार्षीः
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: A commentary ({{टीका}}) walks along the verse. It repeats a word, gives another with the same meaning, and closes
        with {{इत्यर्थः}}, “that is the meaning”. It asks {{कस्मात्}}, “why?”, and answers. {{अथवा}}, “or else”, offers a
        second reading. Read it for the sense, not word for word.
      hi: टीका श्लोक के साथ-साथ चलती है। वह एक शब्द दोहराती है, उसी अर्थ का दूसरा शब्द देती है, और {{इत्यर्थः}}, ‘यही अर्थ
        है’, पर बन्द करती है। वह {{कस्मात्}}, ‘क्यों?’, पूछती है और उत्तर देती है। {{अथवा}}, ‘या फिर’, दूसरा पाठ देता है।
        उसे अर्थ के लिए पढ़िए, शब्द-दर-शब्द नहीं।
    items:
    - id: i0
      sa: टीका
    - id: i1
      sa: इत्यर्थः
    - id: i2
      sa: कस्मात्
    - id: i3
      sa: अथवा

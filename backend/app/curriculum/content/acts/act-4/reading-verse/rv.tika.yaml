- id: s1
  kind: story
  title:
    en: The margins
    hi: हाशिये
  depth: core
  image:
    brief: The round vault wall covered in carved verses, each with small notes in faded ink all round it; Śuka on a ledge reading the notes round one verse aloud; Dādī beside him following with a finger; the small spirit Ślokikā with her cord slack on her lap, listening; warm lamplight.
    alt:
      en: A vault wall of carved verses with faded margin notes while a parrot reads them aloud
      hi: खुदे श्लोकों वाली दीवार पर फीके हाशिये के नोट, ज़ोर से पढ़ता तोता
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - shlokika
    place: simhasana-shala
    ratio: '4:3'
    id: rv-tika-s1
  narration:
    en: 'Ślokikā''s cord is slack, and the vault is full of margins: small notes in faded ink round every carved verse. “That is a commentary,” says Dādī, “a teacher''s voice beside the verse.” Śuka reads aloud the notes round the Īśā verse. Each repeats a word and puts another beside it, like a hand held out. Ślokikā loosens her cord to listen.'
    hi: 'श्लोकिका की डोरी ढीली है, और तहख़ाना हाशियों से भरा है: हर खुदे श्लोक के चारों ओर फीकी स्याही के छोटे नोट। “यह टीका है,” दादी कहती हैं, “श्लोक के पास एक गुरु की आवाज़।” शुक ईशा-श्लोक के चारों ओर के नोट ज़ोर से पढ़ता है। हर नोट एक शब्द दोहराता है और उसके पास दूसरा रख देता है, जैसे बढ़ा हुआ हाथ। श्लोकिका सुनने के लिए अपनी डोरी ढीली करती है।'
  quote:
    sa: ईशा वास्यम् इदं सर्वं यत् किञ्च जगत्यां जगत् तेन त्यक्तेन भुञ्जीथा मा गृधः कस्य स्विद्धनम्
    gloss:
      en: 'Whatever moves in this moving world is to be clothed by the Lord. Take your enjoyment through renunciation; do not covet: whose is wealth?'
      hi: 'इस गतिशील जगत् में जो कुछ गतिशील है, वह सब ईश्वर से आच्छादित होने योग्य है। त्याग से भोग कीजिए; लालच न कीजिए: धन किसका है?'
    source: Īśāvāsyopaniṣad 1 (read at GRETIL, with the commentary ascribed to Śaṅkara)
- id: t1
  kind: teach
  title:
    en: The commentary's moves
    hi: टीका की चालें
  depth: core
  skills:
  - verse.commentary
  body:
    en: A commentary ({{टीका}}) walks along the verse. It repeats a word, gives another with the same meaning, and closes with {{इत्यर्थः}}, “that is the meaning”. It asks {{कस्मात्}}, “why?”, and answers. {{अथवा}}, “or else”, offers a second reading. Read it for the sense, not word for word.
    hi: टीका श्लोक के साथ-साथ चलती है। वह एक शब्द दोहराती है, उसी अर्थ का दूसरा शब्द देती है, और {{इत्यर्थः}}, ‘यही अर्थ है’, पर बन्द करती है। वह {{कस्मात्}}, ‘क्यों?’, पूछती है और उत्तर देती है। {{अथवा}}, ‘या फिर’, दूसरा पाठ देता है। उसे अर्थ के लिए पढ़िए, शब्द-दर-शब्द नहीं।
  term:
    sa: टीका
    meaning:
      en: a commentary on a text
      hi: किसी ग्रन्थ की व्याख्या

- id: p5
  kind: practice
  title:
    en: The margins
    hi: हाशिये
  depth: core
  skills:
  - verse.commentary
  mode: choice
  prompt:
    en: The verse says {{मा गृधः}}; the commentary says {{गृधिम् आकाङ्क्षां मा कार्षीः}}. It means…
    hi: श्लोक में {{मा गृधः}} है; टीका कहती है {{गृधिम् आकाङ्क्षां मा कार्षीः}}। अर्थ है…
  explain:
    en: '{{मा कार्षीः}}: do not make.'
    hi: '{{मा कार्षीः}}: मत कीजिए।'
  roman: after
  gate: true
  story:
    success:
      en: “Do not make a longing,” you read, and in the margin the ink brightens, and Śuka, who has been reading the notes aloud, goes silent, and the whole vault listens. Ślokikā lets the last loop of her cord slide to the floor. “The teacher kept the verse company,” she says. “He did not leave it alone in its knots.” On the stair behind you, Lubdhaka's step has stopped.
      hi: “लालसा मत कीजिए,” आप पढ़ते हैं, और हाशिये की स्याही चमक उठती है, और शुक, जो नोट ज़ोर से पढ़ रहा था, चुप हो जाता है, और पूरा तहख़ाना सुनने लगता है। श्लोकिका अपनी डोरी का अन्तिम फन्दा फर्श पर सरक जाने देती है। “गुरु श्लोक का साथ निभाते थे,” वह कहती है। “उन्होंने उसे उसकी गाँठों में अकेला नहीं छोड़ा।” आपके पीछे सीढ़ी पर लुब्धक के पैरों की आहट रुक गई है।
    failure:
      en: 'The ink stays dim. {{मा कार्षीः}} means: do not make.'
      hi: 'स्याही मद्धम रहती है। {{मा कार्षीः}} का अर्थ है: मत कीजिए।'
  options:
  - text:
      en: do not give
      hi: मत दीजिए
  - correct: true
    text:
      en: do not make a longing
      hi: लालसा मत कीजिए
  - text:
      en: go away
      hi: चले जाइए

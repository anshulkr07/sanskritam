- id: p5
  kind: practice
  title:
    en: The first knot
    hi: पहली गाँठ
  depth: core
  skills:
  - verse.read
  mode: choice
  prompt:
    en: In reading a verse, which step comes first?
    hi: श्लोक पढ़ते समय पहला चरण कौन-सा है?
  explain:
    en: 'First split the joins: {{पदच्छेदः}}.'
    hi: 'पहले जोड़ खोलिए: {{पदच्छेदः}}।'
  roman: after
  gate: true
  story:
    success:
      en: '“पदच्छेदः,” you say, and you put your finger on the first knot in Ślokikā''s cord: विनयात् + याति. It comes undone,
        a loop falls away, and the cord loosens round her wrist. One by one, as you name the joins, the knots give: पात्रत्वात्
        + धनम्, धनात् + धर्मम्. She breathes, and for the first time says the verse aloud with every word standing separate
        and clear.'
      hi: '“पदच्छेदः,” आप कहते हैं, और श्लोकिका की डोरी की पहली गाँठ पर उँगली रखते हैं: विनयात् + याति। वह खुल जाती है, एक
        फन्दा गिर जाता है, और डोरी उसकी कलाई पर ढीली पड़ जाती है। जैसे-जैसे आप जोड़ों के नाम लेते हैं, गाँठें एक-एक कर खुलती
        हैं: पात्रत्वात् + धनम्, धनात् + धर्मम्। वह साँस लेती है, और पहली बार श्लोक को ज़ोर से बोलती है, हर शब्द अलग और साफ़
        खड़ा हुआ।'
    failure:
      en: 'The knots hold. The first step is {{पदच्छेदः}}: split the joins.'
      hi: 'गाँठें कसी रहती हैं। पहला चरण {{पदच्छेदः}} है: जोड़ खोलना।'
  options:
  - sa: अन्वयः
  - sa: अर्थः
  - correct: true
    sa: पदच्छेदः
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:

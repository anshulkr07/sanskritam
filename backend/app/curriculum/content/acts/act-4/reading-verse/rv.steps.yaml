- id: sum
  kind: summary
  title:
    en: Split, order, understand
    hi: पदच्छेद, अन्वय, अर्थ
  depth: core
  points:
  - sa: पदच्छेदः
    text:
      en: Split the joins.
      hi: जोड़ खोलिए।

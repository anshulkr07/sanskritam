- id: s1
  kind: story
  title:
    en: The knotted cord
    hi: गाँठों वाली डोरी
  depth: core
  image:
    brief: A round stone vault at the foot of a spiral stair; a small ink-dark spirit tangled in a long cord of tiny knotted
      letters, knots at every joint; a carved verse on the wall with no gaps between words; Dādī kneeling beside the spirit;
      Śuka on the carved ledge reading; at the top of the stair, a tall figure in a dark coat in silhouette.
    alt:
      en: A small spirit sits tangled in a cord of knotted letters beneath a carved verse
      hi: खुदे श्लोक के नीचे गाँठ-गाँठ अक्षरों की डोरी में उलझी नन्ही भूत
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - shlokika
    place: simhasana-shala
    ratio: '4:3'
    id: rv-steps-s1
    text_in_image:
    - विद्याददातिविनयंविनयाद्यातिपात्रताम्
  narration:
    en: 'The stair ends in a round vault. On its wall a verse is carved with the words run together, and a small spirit sits
      tangled in a cord with a knot at every join. “This is Ślokikā,” says Dādī. “She knows her verse by heart but cannot
      untie it. Three steps: split, order, understand.” Behind you, softly, Lubdhaka''s step sounds on the stair.'
    hi: 'सीढ़ी एक गोल तहख़ाने में खुलती है। उसकी दीवार पर एक श्लोक खुदा है, शब्द आपस में जुड़े हुए, और एक नन्ही भूत डोरी में
      उलझी बैठी है, हर जोड़ पर एक गाँठ। “यह श्लोकिका है,” दादी कहती हैं। “उसे अपना श्लोक कण्ठस्थ है, पर वह उसे खोल नहीं पाती।
      तीन चरण: तोड़ो, क्रम दो, समझो।” आपके पीछे, धीरे-धीरे, सीढ़ी पर लुब्धक के पैरों की आहट आती है।'
  quote:
    sa: विद्या ददाति विनयं विनयाद् याति पात्रताम् पात्रत्वात् धनम् आप्नोति धनाद् धर्मं ततः सुखम्
    gloss:
      en: Learning gives humility; from humility one reaches worthiness; from worthiness, wealth; from wealth, dharma, and
        from that, happiness.
      hi: विद्या विनय देती है; विनय से पात्रता मिलती है; पात्रता से धन; धन से धर्म, और उससे सुख।
    source: Hitopadeśa, introduction (read in the Digital Corpus of Sanskrit)
- id: t1
  kind: teach
  title:
    en: Three steps
    hi: तीन चरण
  depth: core
  skills:
  - verse.read
  body:
    en: 'To read a verse, take three steps. First {{पदच्छेदः}}: split the joins into words. Then {{अन्वयः}}: put the words
      in prose order, verb first to find. Last {{अर्थः}}: say what it means. Never skip the first: you cannot order words
      you have not separated.'
    hi: 'श्लोक पढ़ने के लिए तीन चरण लीजिए। पहले {{पदच्छेदः}}: जोड़ खोलकर शब्द अलग कीजिए। फिर {{अन्वयः}}: शब्दों को गद्य के
      क्रम में रखिए, पहले क्रिया खोजिए। अन्त में {{अर्थः}}: बताइए कि वह क्या कहता है। पहला चरण कभी न छोड़िए: जिन शब्दों को
      अलग नहीं किया, उन्हें क्रम नहीं दे सकते।'
  steps:
  - sa: पदच्छेदः
    label:
      en: split the joins
      hi: जोड़ खोलना
  - sa: अन्वयः
    label:
      en: prose order
      hi: गद्य का क्रम
  - sa: अर्थः
    label:
      en: the meaning
      hi: अर्थ
  term:
    sa: पदच्छेदः
    meaning:
      en: splitting a verse into its words
      hi: श्लोक को उसके शब्दों में तोड़ना
  visuals:
  - id: v-source-forms
    kind: comparison
    title:
      en: Follow the forms
      hi: रूपों पर ध्यान दें
    items:

episode:
  summary:
    en: 'Statues with hard edges: the last sound of a word takes on its neighbour''s voice, place or nasal sound.'
    hi: 'कठोर किनारों वाली प्रतिमाएँ: शब्द की अंतिम ध्वनि पड़ोसी की घोषता, स्थान या नासिक्यता ले लेती है।'
  beats:
  - सत् + जनः → सज्जनः.
  - म् → ं before consonants.
  - Nasals and ṣ/ṇ inside words.

- id: s1
  kind: story
  title:
    en: The eleventh statue
    hi: ग्यारहवीं प्रतिमा
  depth: core
  image:
    brief: The eleventh statue, smooth and smiling calmly, with her palm turned up; Śuka looking at the stone beside her; Dādī tracing a letter in the dust with one finger; the long hall lit by oil lamps.
    alt:
      en: A smooth smiling statue with her palm turned up while an old woman traces a letter in the dust
      hi: चिकनी मुस्कराती प्रतिमा, हथेली ऊपर किए; धूल में अक्षर खींचती दादी
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - vyanjanika
    place: simhasana-shala
    ratio: '4:3'
    id: cs-place-s1
  narration:
    en: 'The eleventh statue is smooth and wears a calm smile. “सज्जनः,” she says: “a good person.” “तच्च”: “and that.” Śuka looks at the stone. “In सज्जनः there was a त from सत्. Now there is a ज. In तच्च there was a त. Now there is a च.” “It has moved,” says Dādī. “A त beside a palatal sound becomes palatal too. The place spreads.”'
    hi: 'ग्यारहवीं प्रतिमा चिकनी है और शान्त मुस्कान पहने है। “सज्जनः,” वह कहती है: “भला मनुष्य।” “तच्च”: “और वह।” शुक पत्थर को देखता है। “सज्जनः में सत् का त था। अब ज है। तच्च में त था। अब च है।” “वह खिसक गया है,” दादी कहती हैं। “तालव्य ध्वनि के पास त भी तालव्य हो जाता है। स्थान फैलता है।”'
- id: t1
  kind: teach
  title:
    en: The tongue moves
    hi: जीभ खिसकती है
  depth: core
  skills:
  - sandhi.place
  body:
    en: 'A dental {{त्}} or {{न्}} moves to the place of the sound that follows: before {{च}}/{{छ}}/{{ज}}/{{श}} it becomes {{च्}}/{{ज्}}, before {{ट}} it becomes {{ट्}}, before {{ल}} it becomes {{ल्}}. {{सत् + जनः}} gives {{सज्जनः}}; {{तत् + च}} gives {{तच्च}}; {{तत् + लीनः}} gives {{तल्लीनः}}.'
    hi: 'दन्त्य {{त्}} या {{न्}} अगली ध्वनि के स्थान पर चला जाता है: {{च}}/{{छ}}/{{ज}}/{{श}} से पहले {{च्}}/{{ज्}}, {{ट}} से पहले {{ट्}}, {{ल}} से पहले {{ल्}}। {{सत् + जनः}} से {{सज्जनः}}; {{तत् + च}} से {{तच्च}}; {{तत् + लीनः}} से {{तल्लीनः}}।'
  term:
    sa: श्चुत्वम्
    meaning:
      en: dentals becoming palatals
      hi: दन्त्य का तालव्य बनना

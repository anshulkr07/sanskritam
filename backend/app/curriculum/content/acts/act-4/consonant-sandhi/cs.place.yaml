- id: p5
  kind: practice
  title:
    en: The calm statue
    hi: शान्त प्रतिमा
  depth: core
  skills:
  - sandhi.place
  mode: choice
  prompt:
    en: '{{उत् + लेखः}} gives…'
    hi: '{{उत् + लेखः}} से…'
  explain:
    en: '{{त्}} becomes {{ल्}} before {{ल}}.'
    hi: '{{ल}} से पहले {{त्}} बनता है {{ल्}}।'
  roman: after
  gate: true
  story:
    success:
      en: “उल्लेखः,” you say, “a mention,” and the eleventh statue turns her palm over, and in it, very small, lies a seed. “सज्जनः,” she says. “तच्च. उल्लेखः.” She closes her hand, and her calm smile deepens, because somewhere, on her very smooth stone, a sound has found its place.
      hi: “उल्लेखः,” आप कहते हैं, “उल्लेख,” और ग्यारहवीं प्रतिमा हथेली पलटती है, और उसमें, बहुत छोटा, एक बीज रखा है। “सज्जनः,” वह कहती है। “तच्च। उल्लेखः।” वह मुट्ठी बन्द करती है, और उसकी शान्त मुस्कान गहरी हो जाती है, क्योंकि कहीं, उसके बहुत चिकने पत्थर पर, एक ध्वनि को अपना स्थान मिल गया है।
    failure:
      en: 'The palm stays empty. {{त्}} becomes {{ल्}} before {{ल}}: {{उल्लेखः}}.'
      hi: 'हथेली ख़ाली रहती है। {{ल}} से पहले {{त्}} बनता है {{ल्}}: {{उल्लेखः}}।'
  options:
  - sa: उत्लेखः
  - sa: उद्लेखः
  - correct: true
    sa: उल्लेखः
- id: pn
  kind: teach
  title:
    en: Pāṇini's place
    hi: पाणिनि का स्थान
  depth: panini
  skills:
  - sandhi.place
  sutras:
  - 8.4.40
  - 8.4.41
  - 8.4.60
  body:
    en: Sūtra 8.4.40, {{स्तोः श्चुना श्चुः}}, says that {{स्}} or a dental ({{तवर्ग}}) next to a palatal ({{श्चु}}) becomes palatal. 8.4.41, {{ष्टुना ष्टुः}}, makes it cerebral next to a cerebral. Next to {{ल}}, 8.4.60, {{तोर्लि}}, makes {{त्}} into {{ल्}}.
    hi: सूत्र 8.4.40, {{स्तोः श्चुना श्चुः}}, कहता है कि तालव्य ({{श्चु}}) के पास {{स्}} या दन्त्य ({{तवर्ग}}) तालव्य हो जाता है। 8.4.41, {{ष्टुना ष्टुः}}, मूर्धन्य के पास उसे मूर्धन्य बनाता है। {{ल}} के पास 8.4.60, {{तोर्लि}}, {{त्}} को {{ल्}} बनाता है।

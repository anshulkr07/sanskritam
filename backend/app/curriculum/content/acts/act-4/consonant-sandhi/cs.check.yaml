- id: p5
  kind: practice
  depth: core
  skills:
  - sandhi.nasal
  mode: choice
  prompt:
    en: '{{सत् + मार्गः}} gives…'
    hi: '{{सत् + मार्गः}} से…'
  explain:
    en: '{{त्}} → {{न्}}.'
    hi: '{{त्}} → {{न्}}।'
  roman: after
  options:
  - sa: सत्मार्गः
  - sa: सद्मार्गः
  - correct: true
    sa: सन्मार्गः
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'A stop before a nasal ({{न}} or {{म}}) becomes the nasal of its own class: {{तत् + मात्रम्}} gives {{तन्मात्रम्}};
        {{वाक् + मयम्}} gives {{वाङ्मयम्}}. A final {{म्}} before a consonant becomes the dot {{ं}}: {{त्वम् + गच्छसि}} gives
        {{त्वं गच्छसि}}. Inside {{संस्कृतम्}} it is the same. Before a vowel {{म्}} stays: {{अहम् + अपि}} gives {{अहमपि}}.'
      hi: '{{न}} या {{म}} से पहले स्पर्श अपने वर्ग का नासिक्य बन जाता है: {{तत् + मात्रम्}} से {{तन्मात्रम्}}; {{वाक् + मयम्}}
        से {{वाङ्मयम्}}। व्यंजन से पहले अन्त का {{म्}} बिन्दु {{ं}} बन जाता है: {{त्वम् + गच्छसि}} से {{त्वं गच्छसि}}। {{संस्कृतम्}}
        में भी यही है। स्वर से पहले {{म्}} रहता है: {{अहम् + अपि}} से {{अहमपि}}।'
    items:
    - id: i0
      sa: न
    - id: i1
      sa: म
    - id: i2
      sa: तत् + मात्रम्
    - id: i3
      sa: तन्मात्रम्
    - id: i4
      sa: वाक् + मयम्
    - id: i5
      sa: वाङ्मयम्
    - id: i6
      sa: म्
    - id: i7
      sa: ं
    - id: i8
      sa: त्वम् + गच्छसि
    - id: i9
      sa: त्वं गच्छसि
    - id: i10
      sa: संस्कृतम्
    - id: i11
      sa: अहम् + अपि
    - id: i12
      sa: अहमपि

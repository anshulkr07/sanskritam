- id: p8
  kind: practice
  depth: core
  skills:
  - sandhi.voice
  - sandhi.place
  - sandhi.nasal
  mode: order
  prompt:
    en: 'Say what Vyañjanikā says: “a good person; for that; Sanskrit.”'
    hi: 'वह कहिए जो व्यञ्जनिका कहती है: ‘सज्जन; क्योंकि वह; संस्कृत।’'
  explain:
    en: '{{सज्जनः तद्धि संस्कृतम्}}: place, voice, nasal.'
    hi: '{{सज्जनः तद्धि संस्कृतम्}}: स्थान, घोष, नासिक्य।'
  roman: after
  gate: true
  story:
    success:
      en: “सज्जनः, तद्धि, संस्कृतम्,” you say, and Vyañjanikā, with a clink, steps down from her plinth, rough sandstone gone
        soft at the edges. “All my life,” she says, “I have been one sound off from the next one.” She touches the nearest
        statue's shoulder and her outline softens into it, like a word meeting a word. “विद्यालयः,” she says. “I can say it,
        but I cannot take it apart. That is for the thirteenth.”
      hi: “सज्जनः, तद्धि, संस्कृतम्,” आप कहते हैं, और व्यञ्जनिका, खनक के साथ, अपने आसन से उतरती है, खुरदरा बलुआ पत्थर अब किनारों
        पर नरम। “सारी उम्र,” वह कहती है, “मैं अगली ध्वनि से एक ध्वनि दूर रही।” वह निकटतम प्रतिमा के कंधे को छूती है और उसकी
        रूपरेखा उसमें पिघल जाती है, शब्द से मिलते शब्द की तरह। “विद्यालयः,” वह कहती है। “मैं इसे कह सकती हूँ, पर अलग नहीं
        कर सकती। वह तेरहवीं का काम है।”
    failure:
      en: 'Her edges stay sharp. Her three: {{सज्जनः तद्धि संस्कृतम्}}.'
      hi: 'उसके किनारे तीखे रहते हैं। उसके तीन: {{सज्जनः तद्धि संस्कृतम्}}।'
  tokens:
  - सज्जनः
  - तद्धि
  - संस्कृतम्
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'A final hard stop ({{क्}}, {{ट्}}, {{त्}}, {{प्}}) becomes its soft partner ({{ग्}}, {{ड्}}, {{द्}}, {{ब्}}) when

- id: s1
  kind: story
  title:
    en: The tenth statue
    hi: दसवीं प्रतिमा
  depth: core
  image:
    brief: The tenth statue with sharp sandstone edges holding a small stone bell, an inscription on her plinth; Śuka peering at it; Dādī pointing at a single letter; Lubdhaka's foreman holding up a lamp behind them; early evening light.
    alt:
      en: A statue with sharp edges holding a stone bell while a parrot peers at the inscription on her plinth
      hi: तीखे किनारों वाली प्रतिमा पत्थर की घण्टी थामे, आसन के अभिलेख को झाँकता तोता
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - vyanjanika
    place: simhasana-shala
    ratio: '4:3'
    id: cs-voice-s1
  narration:
    en: 'The tenth statue has hard stone edges and a stone bell in her hand. “तदस्ति,” she says: “that is.” Śuka peers at the inscription on her base. “The word was तत्, with a त्. Now it has a द. Why did the sound go soft?” “Because it is next to a soft one,” says Dādī. “The अ after it is voiced, and the voice has spread backwards.”'
    hi: 'दसवीं प्रतिमा के किनारे कठोर पत्थर के हैं और हाथ में पत्थर की घण्टी। “तदस्ति,” वह कहती है: “वह है।” शुक उसके आसन पर लिखे अभिलेख को झाँकता है। “शब्द तत् था, त के साथ। अब उसमें द है। ध्वनि कोमल क्यों हो गई?” “क्योंकि वह कोमल ध्वनि के पास है,” दादी कहती हैं। “उसके बाद का अ घोष है, और घोष पीछे की ओर फैल गया है।”'
  lines:
  - speaker: dadi
    sa: तत् + अस्ति = तदस्ति।
    gloss:
      en: That + is = that is.
      hi: वह + है = वह है।
- id: t1
  kind: teach
  title:
    en: Hard becomes soft
    hi: कठोर बनता है कोमल
  depth: core
  skills:
  - sandhi.voice
  body:
    en: 'A final hard stop ({{क्}}, {{ट्}}, {{त्}}, {{प्}}) becomes its soft partner ({{ग्}}, {{ड्}}, {{द्}}, {{ब्}}) when a soft sound or a vowel follows: {{तत् + अस्ति}} gives {{तदस्ति}}; {{जगत् + ईशः}} gives {{जगदीशः}}; {{दिक् + गजः}} gives {{दिग्गजः}}. Voice spreads from the next sound.'
    hi: 'अन्त का कठोर स्पर्श ({{क्}}, {{ट्}}, {{त्}}, {{प्}}) अपने कोमल जोड़ीदार ({{ग्}}, {{ड्}}, {{द्}}, {{ब्}}) में बदल जाता है जब आगे कोमल ध्वनि या स्वर हो: {{तत् + अस्ति}} से {{तदस्ति}}; {{जगत् + ईशः}} से {{जगदीशः}}; {{दिक् + गजः}} से {{दिग्गजः}}। घोष अगली ध्वनि से फैलता है।'
  term:
    sa: जश्त्वम्
    meaning:
      en: hard to soft at the end of a word
      hi: पद के अन्त में कठोर से कोमल

- id: p5
  kind: practice
  title:
    en: The stone bell
    hi: पत्थर की घण्टी
  depth: core
  skills:
  - sandhi.voice
  mode: choice
  prompt:
    en: '{{वाक् + दानम्}} gives…'
    hi: '{{वाक् + दानम्}} से…'
  explain:
    en: '{{क्}} becomes {{ग्}} before {{द}}.'
    hi: '{{द}} से पहले {{क्}} बनता है {{ग्}}।'
  roman: after
  gate: true
  story:
    success:
      en: “वाग्दानम्,” you say, “a promise of speech,” and the stone bell in the statue's hand rings, once, clear, a soft round note, not the hard clack it made before. “तदस्ति,” she says. “That is.” Her sharp edges, one by one, grow a little less sharp, as if the voice had run back through the stone.
      hi: “वाग्दानम्,” आप कहते हैं, “वाणी का वचन,” और प्रतिमा के हाथ की पत्थर की घण्टी एक बार बजती है, साफ़, कोमल गोल स्वर, पहले की कठोर टकराहट नहीं। “तदस्ति,” वह कहती है। “वह है।” उसके तीखे किनारे एक-एक करके कुछ कम तीखे हो जाते हैं, मानो घोष पत्थर में पीछे की ओर दौड़ गया हो।
    failure:
      en: 'The bell stays hard. {{क्}} becomes {{ग्}} before {{द}}: {{वाग्दानम्}}.'
      hi: 'घण्टी कठोर रहती है। {{द}} से पहले {{क्}} बनता है {{ग्}}: {{वाग्दानम्}}।'
  options:
  - sa: वाक्दानम्
  - sa: वाघदानम्
  - correct: true
    sa: वाग्दानम्
- id: pn
  kind: teach
  title:
    en: Pāṇini's voicing
    hi: पाणिनि का घोष
  depth: panini
  skills:
  - sandhi.voice
  sutras:
  - 8.2.39
  - 8.4.53
  body:
    en: 'Sūtra 8.2.39, {{झलां जशोऽन्ते}}, says that at the end of a word, any hard or aspirated stop ({{झल्}}) becomes the soft unaspirated stop ({{जश्}}) of its own class: {{त्}} becomes {{द्}}, {{क्}} becomes {{ग्}}. 8.4.53, {{झलां जश् झशि}}, does the same inside a word before a soft aspirate.'
    hi: 'सूत्र 8.2.39, {{झलां जशोऽन्ते}}, कहता है कि पद के अन्त में कोई भी कठोर या महाप्राण स्पर्श ({{झल्}}) अपने वर्ग का कोमल अल्पप्राण ({{जश्}}) बन जाता है: {{त्}} से {{द्}}, {{क्}} से {{ग्}}। 8.4.53, {{झलां जश् झशि}}, पद के भीतर कोमल महाप्राण से पहले वही करता है।'

    text:
      en: सन्मार्गः, तन्मात्रम्.
      hi: सन्मार्गः, तन्मात्रम्।
  - sa: म् + व्यंजन = ं
    text:
      en: संसारः, त्वं गच्छसि.
      hi: संसारः, त्वं गच्छसि।
  - sa: म् + स्वर = म्
    text:
      en: अहमपि.
      hi: अहमपि।

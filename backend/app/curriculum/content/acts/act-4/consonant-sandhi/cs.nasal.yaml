  story:
    success:
      en: '“संस्कृतम्,” you say, “perfected speech,” and the twelfth statue stops humming. In the quiet, she says it, and each of the twelve statues you have freed or heard repeats it from its plinth: संस्कृतम्, संस्कृतम्. It goes round the hall, not as a word but as a long soft note, like a bell being rung a very long way off. Vyañjanikā, the consonant statue, is the third to step down.'
      hi: '“संस्कृतम्,” आप कहते हैं, “परिष्कृत वाणी,” और बारहवीं प्रतिमा गुनगुनाना बन्द करती है। शान्ति में वह उसे कहती है, और जिन बारह प्रतिमाओं को आपने मुक्त किया या सुना, हर एक अपने आसन से उसे दोहराती है: संस्कृतम्, संस्कृतम्। वह कक्ष का चक्कर लगाता है, शब्द नहीं बल्कि लम्बे कोमल स्वर की तरह, बहुत दूर बजती घण्टी की तरह। व्यञ्जनिका, व्यञ्जन-प्रतिमा, तीसरी है जो उतरती है।'
    failure:
      en: 'The hum continues. {{म्}} before a consonant becomes {{ं}}: {{संस्कृतम्}}.'
      hi: 'गुनगुनाहट चलती रहती है। व्यंजन से पहले {{म्}} बनता है {{ं}}: {{संस्कृतम्}}।'
  options:
  - sa: सम्स्कृतम्
  - sa: सनस्कृतम्
  - correct: true
    sa: संस्कृतम्
- id: pn
  kind: teach
  title:
    en: Pāṇini's nose
    hi: पाणिनि की नासिका
  depth: panini
  skills:
  - sandhi.nasal
  sutras:
  - 8.4.45
  - 8.3.23
  - 8.4.58
  body:
    en: 'Sūtra 8.4.45, {{यरोऽनुनासिकेऽनुनासिको वा}}, lets a stop before a nasal become the nasal of its class. 8.3.23, {{मोऽनुस्वारः}}, turns a final {{म्}} before a consonant into the dot. 8.4.58, {{अनुस्वारस्य ययि परसवर्णः}}, lets that dot take the nasal of the following class: {{संकल्पः}} or {{सङ्कल्पः}}.'
    hi: 'सूत्र 8.4.45, {{यरोऽनुनासिकेऽनुनासिको वा}}, नासिक्य से पहले स्पर्श को अपने वर्ग का नासिक्य बनने देता है। 8.3.23, {{मोऽनुस्वारः}}, व्यंजन से पहले अन्त के {{म्}} को बिन्दु बनाता है। 8.4.58, {{अनुस्वारस्य ययि परसवर्णः}}, उस बिन्दु को आगे के वर्ग का नासिक्य लेने देता है: {{संकल्पः}} या {{सङ्कल्पः}}।'
- id: sum
  kind: summary
  title:
    en: The nasal
    hi: नासिक्य
  depth: core
  points:

      explanation:
        en: 'A dental {{त्}} or {{न्}} moves to the place of the sound that follows: before {{च}}/{{छ}}/{{ज}}/{{श}} it becomes
          {{च्}}/{{ज्}}, before {{ट}} it becomes {{ट्}}, before {{ल}} it becomes {{ल्}}. {{सत् + जनः}} gives {{सज्जनः}}; {{तत्

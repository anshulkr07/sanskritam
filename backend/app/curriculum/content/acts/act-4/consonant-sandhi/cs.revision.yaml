          से पहले {{ट्}}, {{ल}} से पहले {{ल्}}। {{सत् + जनः}} से {{सज्जनः}}; {{तत् + च}} से {{तच्च}}; {{तत् + लीनः}} से {{तल्लीनः}}।'

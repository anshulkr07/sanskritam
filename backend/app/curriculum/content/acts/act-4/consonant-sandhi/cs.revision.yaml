  - skill: sandhi.voice
    rule:
      en: Do not leave {{तत् अस्ति}} unjoined when it should be {{तदस्ति}}.
      hi: जहाँ {{तदस्ति}} होना चाहिए, वहाँ {{तत् अस्ति}} अलग मत छोड़िए।
    tag: core
    taught_in: cs.voice#p1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Compare with a taught example
        hi: सीखे हुए उदाहरण से तुलना करें
      explanation:
        en: 'A final hard stop ({{क्}}, {{ट्}}, {{त्}}, {{प्}}) becomes its soft partner ({{ग्}}, {{ड्}}, {{द्}}, {{ब्}})
          when a soft sound or a vowel follows: {{तत् + अस्ति}} gives {{तदस्ति}}; {{जगत् + ईशः}} gives {{जगदीशः}}; {{दिक्
          + गजः}} gives {{दिग्गजः}}. Voice spreads from the next sound.'
        hi: 'अन्त का कठोर स्पर्श ({{क्}}, {{ट्}}, {{त्}}, {{प्}}) अपने कोमल जोड़ीदार ({{ग्}}, {{ड्}}, {{द्}}, {{ब्}}) में
          बदल जाता है जब आगे कोमल ध्वनि या स्वर हो: {{तत् + अस्ति}} से {{तदस्ति}}; {{जगत् + ईशः}} से {{जगदीशः}}; {{दिक् +
          गजः}} से {{दिग्गजः}}। घोष अगली ध्वनि से फैलता है।'

- id: conditions
  kind: revision
  title:
    en: How to tell which
    hi: कैसे पहचानें कि कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: sandhi.voice
    rule:
      en: 'Look at the next sound: soft or a vowel gives voice.'
      hi: 'अगली ध्वनि देखिए: कोमल या स्वर घोष देता है।'
    tag: good
    taught_in: cs.voice#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'A final hard stop ({{क्}}, {{ट्}}, {{त्}}, {{प्}}) becomes its soft partner ({{ग्}}, {{ड्}}, {{द्}}, {{ब्}})
          when a soft sound or a vowel follows: {{तत् + अस्ति}} gives {{तदस्ति}}; {{जगत् + ईशः}} gives {{जगदीशः}}; {{दिक्
          + गजः}} gives {{दिग्गजः}}. Voice spreads from the next sound.'
        hi: 'अन्त का कठोर स्पर्श ({{क्}}, {{ट्}}, {{त्}}, {{प्}}) अपने कोमल जोड़ीदार ({{ग्}}, {{ड्}}, {{द्}}, {{ब्}}) में
          बदल जाता है जब आगे कोमल ध्वनि या स्वर हो: {{तत् + अस्ति}} से {{तदस्ति}}; {{जगत् + ईशः}} से {{जगदीशः}}; {{दिक् +
          गजः}} से {{दिग्गजः}}। घोष अगली ध्वनि से फैलता है।'
      items:
      - id: i0
        sa: क्
      - id: i1
        sa: ट्
      - id: i2
        sa: त्
      - id: i3
        sa: प्
      - id: i4
        sa: ग्
      - id: i5
        sa: ड्
      - id: i6
        sa: द्
      - id: i7
        sa: ब्
      - id: i8
        sa: तत् + अस्ति
      - id: i9
        sa: तदस्ति
      - id: i10
        sa: जगत् + ईशः
      - id: i11
        sa: जगदीशः
      - id: i12
        sa: दिक् + गजः
      - id: i13
        sa: दिग्गजः
  - skill: sandhi.place
    rule:
      en: A palatal ({{च}}, {{ज}}, {{श}}), cerebral ({{ट}}) or {{ल}} next gives place.
      hi: बाद में तालव्य ({{च}}, {{ज}}, {{श}}), मूर्धन्य ({{ट}}) या {{ल}} हो तो स्थान बदलता है।
    tag: good
    taught_in: cs.place#t1
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'A dental {{त्}} or {{न्}} moves to the place of the sound that follows: before {{च}}/{{छ}}/{{ज}}/{{श}} it becomes
          {{च्}}/{{ज्}}, before {{ट}} it becomes {{ट्}}, before {{ल}} it becomes {{ल्}}. {{सत् + जनः}} gives {{सज्जनः}}; {{तत्
          + च}} gives {{तच्च}}; {{तत् + लीनः}} gives {{तल्लीनः}}.'
        hi: 'दन्त्य {{त्}} या {{न्}} अगली ध्वनि के स्थान पर चला जाता है: {{च}}/{{छ}}/{{ज}}/{{श}} से पहले {{च्}}/{{ज्}}, {{ट}}
          से पहले {{ट्}}, {{ल}} से पहले {{ल्}}। {{सत् + जनः}} से {{सज्जनः}}; {{तत् + च}} से {{तच्च}}; {{तत् + लीनः}} से {{तल्लीनः}}।'
      items:
      - id: i0
        sa: त्
      - id: i1
        sa: न्
      - id: i2
        sa: च
      - id: i3
        sa: छ
      - id: i4
        sa: ज
      - id: i5
        sa: श
      - id: i6
        sa: च्
      - id: i7
        sa: ज्
      - id: i8
        sa: ट
      - id: i9
        sa: ट्
      - id: i10
        sa: ल
      - id: i11
        sa: ल्
      - id: i12
        sa: सत् + जनः
      - id: i13
        sa: सज्जनः
      - id: i14
        sa: तत् + च
      - id: i15
        sa: तच्च
      - id: i16
        sa: तत् + लीनः
      - id: i17
        sa: तल्लीनः
  - skill: sandhi.nasal
    rule:
      en: A nasal ({{न}}, {{म}}) next gives a nasal; a final {{म्}} before a vowel stays.
      hi: बाद में नासिक्य ({{न}}, {{म}}) हो तो नासिक्य बनता है; स्वर से पहले अन्त का {{म्}} रहता है।
    tag: good
    taught_in: cs.nasal#t1
    visuals:
    - id: v-linked-2
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'A stop before a nasal ({{न}} or {{म}}) becomes the nasal of its own class: {{तत् + मात्रम्}} gives {{तन्मात्रम्}};
          {{वाक् + मयम्}} gives {{वाङ्मयम्}}. A final {{म्}} before a consonant becomes the dot {{ं}}: {{त्वम् + गच्छसि}}
          gives {{त्वं गच्छसि}}. Inside {{संस्कृतम्}} it is the same. Before a vowel {{म्}} stays: {{अहम् + अपि}} gives {{अहमपि}}.'
        hi: '{{न}} या {{म}} से पहले स्पर्श अपने वर्ग का नासिक्य बन जाता है: {{तत् + मात्रम्}} से {{तन्मात्रम्}}; {{वाक् +
          मयम्}} से {{वाङ्मयम्}}। व्यंजन से पहले अन्त का {{म्}} बिन्दु {{ं}} बन जाता है: {{त्वम् + गच्छसि}} से {{त्वं गच्छसि}}।
          {{संस्कृतम्}} में भी यही है। स्वर से पहले {{म्}} रहता है: {{अहम् + अपि}} से {{अहमपि}}।'
      items:
      - id: i0
        sa: न
      - id: i1
        sa: म
      - id: i2
        sa: तत् + मात्रम्
      - id: i3
        sa: तन्मात्रम्
      - id: i4
        sa: वाक् + मयम्
      - id: i5
        sa: वाङ्मयम्
      - id: i6
        sa: म्
      - id: i7
        sa: ं
      - id: i8
        sa: त्वम् + गच्छसि
      - id: i9
        sa: त्वं गच्छसि
      - id: i10
        sa: संस्कृतम्
      - id: i11
        sa: अहम् + अपि
      - id: i12
        sa: अहमपि

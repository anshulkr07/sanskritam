- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: sandhi.voice
    rule:
      en: '{{झलां जशोऽन्ते}} and {{झलां जश् झशि}}: the hard stop turns soft.'
      hi: '{{झलां जशोऽन्ते}} और {{झलां जश् झशि}}: कठोर स्पर्श कोमल हो जाता है।'
    sutras:
    - 8.2.39
    - 8.4.53
    tag: core
    taught_in: cs.voice#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 8.2.39, {{झलां जशोऽन्ते}}, says that at the end of a word, any hard or aspirated stop ({{झल्}}) becomes
          the soft unaspirated stop ({{जश्}}) of its own class: {{त्}} becomes {{द्}}, {{क्}} becomes {{ग्}}. 8.4.53, {{झलां
          जश् झशि}}, does the same inside a word before a soft aspirate.'
        hi: 'सूत्र 8.2.39, {{झलां जशोऽन्ते}}, कहता है कि पद के अन्त में कोई भी कठोर या महाप्राण स्पर्श ({{झल्}}) अपने वर्ग
          का कोमल अल्पप्राण ({{जश्}}) बन जाता है: {{त्}} से {{द्}}, {{क्}} से {{ग्}}। 8.4.53, {{झलां जश् झशि}}, पद के भीतर
          कोमल महाप्राण से पहले वही करता है।'
      items:
      - id: i0
        sa: झलां जशोऽन्ते
      - id: i1
        sa: झल्
      - id: i2
        sa: जश्
      - id: i3
        sa: त्
      - id: i4
        sa: द्
      - id: i5
        sa: क्
      - id: i6
        sa: ग्
      - id: i7
        sa: झलां जश् झशि
  - skill: sandhi.place
    rule:
      en: '{{स्तोः श्चुना श्चुः}} and {{ष्टुना ष्टुः}}: the tongue takes the next place.'
      hi: '{{स्तोः श्चुना श्चुः}} और {{ष्टुना ष्टुः}}: जीभ अगला स्थान ले लेती है।'
    sutras:
    - 8.4.40
    - 8.4.41
    tag: core
    taught_in: cs.place#pn
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 8.4.40, {{स्तोः श्चुना श्चुः}}, says that {{स्}} or a dental ({{तवर्ग}}) next to a palatal ({{श्चु}}) becomes
          palatal. 8.4.41, {{ष्टुना ष्टुः}}, makes it cerebral next to a cerebral. Next to {{ल}}, 8.4.60, {{तोर्लि}}, makes
          {{त्}} into {{ल्}}.
        hi: सूत्र 8.4.40, {{स्तोः श्चुना श्चुः}}, कहता है कि तालव्य ({{श्चु}}) के पास {{स्}} या दन्त्य ({{तवर्ग}}) तालव्य
          हो जाता है। 8.4.41, {{ष्टुना ष्टुः}}, मूर्धन्य के पास उसे मूर्धन्य बनाता है। {{ल}} के पास 8.4.60, {{तोर्लि}}, {{त्}}
          को {{ल्}} बनाता है।
      items:
      - id: i0
        sa: स्तोः श्चुना श्चुः
      - id: i1
        sa: स्
      - id: i2
        sa: तवर्ग
      - id: i3
        sa: श्चु
      - id: i4
        sa: ष्टुना ष्टुः
      - id: i5
        sa: ल
      - id: i6
        sa: तोर्लि
      - id: i7
        sa: त्
      - id: i8
        sa: ल्
  - skill: sandhi.nasal
    rule:
      en: '{{मोऽनुस्वारः}}: a final {{म्}} becomes a dot.'
      hi: '{{मोऽनुस्वारः}}: अन्त का {{म्}} बिन्दु बन जाता है।'
    sutras:
    - 8.3.23
    tag: core
    taught_in: cs.nasal#pn
    visuals:
    - id: v-linked-2
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 8.4.45, {{यरोऽनुनासिकेऽनुनासिको वा}}, lets a stop before a nasal become the nasal of its class. 8.3.23,
          {{मोऽनुस्वारः}}, turns a final {{म्}} before a consonant into the dot. 8.4.58, {{अनुस्वारस्य ययि परसवर्णः}}, lets
          that dot take the nasal of the following class: {{संकल्पः}} or {{सङ्कल्पः}}.'
        hi: 'सूत्र 8.4.45, {{यरोऽनुनासिकेऽनुनासिको वा}}, नासिक्य से पहले स्पर्श को अपने वर्ग का नासिक्य बनने देता है। 8.3.23,
          {{मोऽनुस्वारः}}, व्यंजन से पहले अन्त के {{म्}} को बिन्दु बनाता है। 8.4.58, {{अनुस्वारस्य ययि परसवर्णः}}, उस बिन्दु
          को आगे के वर्ग का नासिक्य लेने देता है: {{संकल्पः}} या {{सङ्कल्पः}}।'
      items:
      - id: i0
        sa: यरोऽनुनासिकेऽनुनासिको वा
      - id: i1
        sa: मोऽनुस्वारः
      - id: i2
        sa: म्
      - id: i3
        sa: अनुस्वारस्य ययि परसवर्णः
      - id: i4
        sa: संकल्पः
      - id: i5
        sa: सङ्कल्पः

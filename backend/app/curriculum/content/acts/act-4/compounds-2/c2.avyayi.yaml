        hi: जितनी शक्ति हो
    - sa: कर्म
      gloss:
        en: work
        hi: कर्म
      check:
        type: subanta
        stem: कर्मन्
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Eka
    - sa: करोति
      gloss:
        en: does
        hi: करता है
      check:
        type: tinanta
        dhatu: कृ
        lakara: Lat
        purusha: Prathama
        vacana: Eka
  - sa: सः प्रतिदिनम् पठति।
    meaning:
      en: He reads every day.
      hi: वह प्रतिदिन पढ़ता है।
    words:
    - sa: सः
      gloss:
        en: he
        hi: वह
    - sa: प्रतिदिनम्
      gloss:
        en: every day
        hi: हर दिन
    - sa: पठति

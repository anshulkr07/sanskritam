- id: p4
  kind: practice
  title:
    en: The lantern
    hi: लालटेन
  depth: core
  skills:
  - sam.avyayibhava
  mode: choice
  prompt:
    en: '“Until death”: which compound?'
    hi: '‘मृत्यु तक’: कौन-सा समास?'
  explain:
    en: '{{आ-}}: up to.'
    hi: '{{आ-}}: तक।'
  roman: after
  gate: true
  story:
    success:
      en: '“आमरणम्,” you say, “until death,” and the twentieth statue''s lantern lights, with a small calm flame. “यथाशक्ति,” she says. “I will keep it as far as I can.” She lowers the lamp. The hall gets a little brighter, each lamp leaning towards hers, as if the news had come to them: someone is going to keep the light on, every day, until the end.'
      hi: '“आमरणम्,” आप कहते हैं, “मृत्यु तक,” और बीसवीं प्रतिमा की लालटेन एक छोटी शान्त लौ से जल उठती है। “यथाशक्ति,” वह कहती है। “मैं इसे जितना हो सकेगा, जलाए रखूँगी।” वह दीपक नीचे करती है। कक्ष कुछ और उजला हो जाता है, हर दीपक उसकी ओर झुकता है, मानो ख़बर पहुँची हो: कोई प्रकाश जलाए रखेगा, हर दिन, अन्त तक।'
    failure:
      en: 'The lantern stays dark. {{आ-}} means “up to”: {{आमरणम्}}.'
      hi: 'लालटेन अँधेरी रहती है। {{आ-}} का अर्थ ‘तक’ है: {{आमरणम्}}।'
  options:
  - sa: प्रतिमरणम्
  - correct: true
    sa: आमरणम्
  - sa: उपमरणम्
- id: pn
  kind: teach
  title:
    en: Pāṇini's adverb
    hi: पाणिनि का क्रियाविशेषण
  depth: panini
  skills:
  - sam.avyayibhava
  sutras:
  - 2.1.5
  - 2.1.6
  - 1.1.41
  body:
    en: Sūtra 2.1.5, {{अव्ययीभावः}}, names the class, and 2.1.6, {{अव्ययं विभक्तिसमीपसमृद्धिव्यृद्ध्यर्थाभावात्ययासम्प्रतिशब्दप्रादुर्भावपश्चाद्यथानुपूर्व्ययौगपद्यसादृश्यसम्पत्तिसाकल्यान्तवचनेषु}}, lists the senses in which an indeclinable joins a word. The result is {{अव्यय}} by 1.1.41, {{अव्ययीभावश्च}}.
    hi: सूत्र 2.1.5, {{अव्ययीभावः}}, वर्ग का नाम देता है, और 2.1.6 उन अर्थों की सूची देता है जिनमें अव्यय किसी शब्द से जुड़ता है। परिणाम 1.1.41, {{अव्ययीभावश्च}}, से {{अव्यय}} है।

      en: 'The same words can be a bahuvrīhi or a karmadhāraya: {{नीलकण्ठः}} is Śiva (bahuvrīhi); the context decides.'
      hi: 'वही शब्द बहुव्रीहि या कर्मधारय हो सकते हैं: {{नीलकण्ठः}} शिव है (बहुव्रीहि); प्रसंग तय करता है।'
    example:
      sa: नीलकण्ठः।

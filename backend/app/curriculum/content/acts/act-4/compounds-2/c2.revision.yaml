        label:
          en: Decide the joins
          hi: जोड़ तय कीजिए
        meaning:
          en: “whose brilliance is like ten million suns”
          hi: ‘जिसकी चमक करोड़ सूर्यों-सी है’
      - id: conclusion
        label:
          en: What the steps show
          hi: इन चरणों से क्या समझें
        meaning:
          en: 'The whole compound is a bahuvrīhi: it names the king.'
          hi: 'पूरा समास बहुव्रीहि है: वह राजा का नाम बताता है।'
- id: conditions
  kind: revision
  title:
    en: How to tell which
    hi: कैसे पहचानें कि कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: sam.bahuvrihi
    rule:
      en: If the compound names a person or thing outside itself, it is a bahuvrīhi.
      hi: यदि समास अपने से बाहर किसी व्यक्ति या वस्तु का नाम बताए, तो वह बहुव्रीहि है।
    tag: good
    taught_in: c2.bahuvrihi#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'In a {{बहुव्रीहिः}} the whole compound describes a third person: {{नीलः कण्ठः यस्य सः}}, “he whose throat is
          blue”, is {{नीलकण्ठः}}, Śiva. {{पीतम् अम्बरम् यस्य सः}} is {{पीताम्बरः}}, Viṣṇu. A bahuvrīhi is an adjective, and
          takes the gender of the person it describes.'
        hi: '{{बहुव्रीहिः}} में पूरा समास किसी तीसरे का वर्णन करता है: {{नीलः कण्ठः यस्य सः}}, ‘जिसका कण्ठ नीला है’, {{नीलकण्ठः}}
          है, शिव। {{पीतम् अम्बरम् यस्य सः}} {{पीताम्बरः}} है, विष्णु। बहुव्रीहि विशेषण है, और वह जिस व्यक्ति का वर्णन करता
          है उसी का लिंग लेता है।'
      items:
      - id: i0
        sa: बहुव्रीहिः
      - id: i1
        sa: नीलः कण्ठः यस्य सः
      - id: i2
        sa: नीलकण्ठः
      - id: i3
        sa: पीतम् अम्बरम् यस्य सः
      - id: i4
        sa: पीताम्बरः
  - skill: sam.avyayibhava
    rule:
      en: If it never takes an ending and means “as far as, every, until”, it is an avyayībhāva.
      hi: यदि वह कभी प्रत्यय नहीं लेता और उसका अर्थ ‘जितना, हर, तक’ है, तो वह अव्ययीभाव है।
    tag: good
    taught_in: c2.avyayi#t1
    visuals:
    - id: v-linked-1
      kind: worked
      title:
        en: Read, examine, understand
        hi: पढ़ें, समझें, फिर पढ़ें
      items:

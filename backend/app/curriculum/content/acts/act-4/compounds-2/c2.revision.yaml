- id: mistakes
  kind: revision
  title:
    en: Common mistakes
    hi: आम भूलें
  depth: core
  section: mistakes
  rows:
  - skill: sam.bahuvrihi
    rule:
      en: 'Do not translate {{पीताम्बरः}} as “a yellow cloth”: it is “the one in yellow cloth”.'
      hi: '{{पीताम्बरः}} का अनुवाद ‘पीला वस्त्र’ मत कीजिए: यह ‘पीले वस्त्र वाला’ है।'
    tag: core
    taught_in: c2.bahuvrihi#p1
  - skill: sam.long
    rule:
      en: 'Do not read a long compound from the left: start from the last member.'
      hi: 'लम्बे समास को बाईं ओर से मत पढ़िए: अन्तिम सदस्य से शुरू कीजिए।'
    tag: core
    taught_in: c2.long#p1
- id: panini
  kind: revision
  title:

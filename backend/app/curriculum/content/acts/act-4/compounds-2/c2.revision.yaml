          hi: जितनी शक्ति हो
      - id: i3
        sa: कर्म
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: work
          hi: कर्म
        check:
          type: subanta
          stem: कर्मन्
          linga: Napumsaka
          vibhakti: Dvitiya
          vacana: Eka
        feature:
          en: 'Stem: {{कर्मन्}} · neuter · {{द्वितीया}} · singular'
          hi: 'प्रातिपदिक: {{कर्मन्}} · {{नपुंसकलिंग}} · {{द्वितीया}} · {{एकवचन}}'
        compare_from: कर्मन्
      - id: i4
        sa: करोति
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: does
          hi: करता है
        check:
          type: tinanta
          dhatu: कृ
          lakara: Lat
          purusha: Prathama
          vacana: Eka
        feature:
          en: 'Root: {{कृ}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
          hi: 'धातु: {{कृ}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
        compare_from: कृ
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: 'In an {{अव्ययीभावः}} the first word is an indeclinable, and the whole is an indeclinable: {{यथा + शक्ति}} gives
            {{यथाशक्ति}} (as far as one can); {{प्रति + दिनम्}} gives {{प्रतिदिनम्}} (every day); {{आ + मरणम्}} gives {{आमरणम्}}
            (until death); {{उप + कृष्णम्}} gives {{उपकृष्णम्}} (near Kṛṣṇa). Such words never change.'
          hi: '{{अव्ययीभावः}} में पहला शब्द अव्यय होता है, और पूरा भी अव्यय बन जाता है: {{यथा + शक्ति}} से {{यथाशक्ति}} (जितनी
            शक्ति हो); {{प्रति + दिनम्}} से {{प्रतिदिनम्}} (हर दिन); {{आ + मरणम्}} से {{आमरणम्}} (मृत्यु तक); {{उप + कृष्णम्}}
            से {{उपकृष्णम्}} (कृष्ण के पास)। ऐसे शब्द कभी नहीं बदलते।'

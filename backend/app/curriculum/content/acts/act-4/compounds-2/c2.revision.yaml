    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: sam.bahuvrihi
    rule:
      en: '{{शेषो बहुव्रीहिः}} and {{अनेकमन्यपदार्थे}}: the compound of the one who has.'
      hi: '{{शेषो बहुव्रीहिः}} और {{अनेकमन्यपदार्थे}}: वह जिसके पास है, उसका समास।'
    sutras:
    - 2.2.23
    - 2.2.24
    tag: core
    taught_in: c2.bahuvrihi#pn
  - skill: sam.avyayibhava
    rule:
      en: '{{अव्ययीभावः}}: the compound that becomes indeclinable.'
      hi: '{{अव्ययीभावः}}: वह समास जो अव्यय बन जाता है।'
    sutras:
    - 2.1.5
    tag: core
    taught_in: c2.avyayi#pn

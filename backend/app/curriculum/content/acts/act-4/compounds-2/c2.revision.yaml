  - skill: sam.bahuvrihi
    rule:
      en: 'Do not translate {{पीताम्बरः}} as “a yellow cloth”: it is “the one in yellow cloth”.'
      hi: '{{पीताम्बरः}} का अनुवाद ‘पीला वस्त्र’ मत कीजिए: यह ‘पीले वस्त्र वाला’ है।'
    tag: core
    taught_in: c2.bahuvrihi#p1
  - skill: sam.long
    rule:
      en: 'Do not read a long compound from the left: start from the last member.'
      hi: 'लम्बे समास को बाईं ओर से मत पढ़िए: अन्तिम सदस्य से शुरू कीजिए।'
    tag: core
    taught_in: c2.long#p1
- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: sam.bahuvrihi
    rule:
      en: '{{शेषो बहुव्रीहिः}} and {{अनेकमन्यपदार्थे}}: the compound of the one who has.'
      hi: '{{शेषो बहुव्रीहिः}} और {{अनेकमन्यपदार्थे}}: वह जिसके पास है, उसका समास।'
    sutras:
    - 2.2.23
    - 2.2.24
    tag: core
    taught_in: c2.bahuvrihi#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 2.2.23, {{शेषो बहुव्रीहिः}}, calls the remaining compounds {{बहुव्रीहिः}}, and 2.2.24, {{अनेकमन्यपदार्थे}},
          says several words join in the sense of another word, someone outside the compound. The compound's own gender and
          number come from the one it describes.
        hi: सूत्र 2.2.23, {{शेषो बहुव्रीहिः}}, शेष समासों को {{बहुव्रीहिः}} कहता है, और 2.2.24, {{अनेकमन्यपदार्थे}}, कहता
          है कि कई शब्द किसी अन्य पद के अर्थ में जुड़ते हैं, अर्थात् समास से बाहर कोई। समास का अपना लिंग और वचन उसी से आता
          है जिसका वह वर्णन करता है।
      items:
      - id: i0
        sa: शेषो बहुव्रीहिः
      - id: i1
        sa: बहुव्रीहिः
      - id: i2
        sa: अनेकमन्यपदार्थे
  - skill: sam.avyayibhava
    rule:
      en: '{{अव्ययीभावः}}: the compound that becomes indeclinable.'
      hi: '{{अव्ययीभावः}}: वह समास जो अव्यय बन जाता है।'
    sutras:
    - 2.1.5
    tag: core
    taught_in: c2.avyayi#pn
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 2.1.5, {{अव्ययीभावः}}, names the class, and 2.1.6, {{अव्ययं विभक्तिसमीपसमृद्धिव्यृद्ध्यर्थाभावात्ययासम्प्रतिशब्दप्रादुर्भावपश्चाद्यथानुपूर्व्ययौगपद्यसादृश्यसम्पत्तिसाकल्यान्तवचनेषु}},
          lists the senses in which an indeclinable joins a word. The result is {{अव्यय}} by 1.1.41, {{अव्ययीभावश्च}}.
        hi: सूत्र 2.1.5, {{अव्ययीभावः}}, वर्ग का नाम देता है, और 2.1.6 उन अर्थों की सूची देता है जिनमें अव्यय किसी शब्द से
          जुड़ता है। परिणाम 1.1.41, {{अव्ययीभावश्च}}, से {{अव्यय}} है।
      items:
      - id: i0
        sa: अव्ययीभावः
      - id: i1
        sa: अव्ययं विभक्तिसमीपसमृद्धिव्यृद्ध्यर्थाभावात्ययासम्प्रतिशब्दप्रादुर्भावपश्चाद्यथानुपूर्व्ययौगपद्यसादृश्यसम्पत्तिसाकल्यान्तवचनेषु
      - id: i2
        sa: अव्यय
      - id: i3
        sa: अव्ययीभावश्च

- title: Lesson text and story
  licence: original
cards:
- id: core
  kind: revision
  title:
    en: The kinds
    hi: प्रकार
  depth: core
  section: core
  rows:
  - skill: sam.bahuvrihi
    rule:
      en: 'Bahuvrīhi: “the one who has”: {{नीलकण्ठः}}, {{पीताम्बरः}}, {{चन्द्रमुखी}}.'
      hi: 'बहुव्रीहि: ‘वह जिसके पास है’: {{नीलकण्ठः}}, {{पीताम्बरः}}, {{चन्द्रमुखी}}।'
    sutras:
    - 2.2.23
    - 2.2.24
    tag: core
    taught_in: c2.bahuvrihi#tb1
  - skill: sam.avyayibhava
    rule:
      en: 'Avyayībhāva: an adverb made by a compound: {{यथाशक्ति}}, {{प्रतिदिनम्}}, {{आमरणम्}}.'
      hi: 'अव्ययीभाव: समास से बना क्रियाविशेषण: {{यथाशक्ति}}, {{प्रतिदिनम्}}, {{आमरणम्}}।'
    sutras:
    - 2.1.5
    - 2.1.6
    - 1.1.41
    tag: core
    taught_in: c2.avyayi#tb1
  - skill: sam.long
    rule:
      en: 'Long compound: read from the last member back, cut in halves, then decide each join.'
      hi: 'लम्बा समास: अन्तिम सदस्य से पीछे की ओर पढ़िए, दो-दो भागों में काटिए, फिर हर जोड़ तय कीजिए।'
    sutras:
    - 2.1.3
    - 2.2.30
    tag: core
    taught_in: c2.long#tb1
- id: conditions
  kind: revision
  title:
    en: How to tell which
    hi: कैसे पहचानें कि कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: sam.bahuvrihi
    rule:
      en: If the compound names a person or thing outside itself, it is a bahuvrīhi.
      hi: यदि समास अपने से बाहर किसी व्यक्ति या वस्तु का नाम बताए, तो वह बहुव्रीहि है।
    tag: good
    taught_in: c2.bahuvrihi#t1
  - skill: sam.avyayibhava
    rule:
      en: If it never takes an ending and means “as far as, every, until”, it is an avyayībhāva.
      hi: यदि वह कभी प्रत्यय नहीं लेता और उसका अर्थ ‘जितना, हर, तक’ है, तो वह अव्ययीभाव है।
    tag: good
    taught_in: c2.avyayi#t1

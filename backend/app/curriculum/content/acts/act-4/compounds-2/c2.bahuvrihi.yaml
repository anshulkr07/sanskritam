- id: s1
  kind: story
  title:
    en: The nineteenth statue
    hi: उन्नीसवीं प्रतिमा
  depth: core
  image:
    brief: The nineteenth statue with a pale blue throat carved into the stone, a faint crescent moon over her brow; Dādī touching the throat and pointing outward; Śuka looking up the hall; Lubdhaka's foreman reading from his notebook.
    alt:
      en: A statue with a pale blue carved throat while an old woman touches it and points outward
      hi: हल्के नीले कण्ठ वाली प्रतिमा, उसे छूकर बाहर इशारा करती दादी
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - malika
    place: simhasana-shala
    ratio: '4:3'
    id: c2-bahuvrihi-s1
  narration:
    en: 'The nineteenth statue has a pale blue throat carved into the stone. “नीलकण्ठः,” she says. “A blue throat.” “No,” says Dādī. “A karmadhāraya would be the throat itself. This is the one who has the blue throat. The compound points outside itself, to someone else: Śiva. It is called bahuvrīhi, which itself means ‘the one who has much rice’.”'
    hi: 'उन्नीसवीं प्रतिमा के पत्थर में हल्का नीला कण्ठ तराशा गया है। “नीलकण्ठः,” वह कहती है। “नीला कण्ठ।” “नहीं,” दादी कहती हैं। “कर्मधारय होता तो वही कण्ठ होता। यह वह है जिसके पास नीला कण्ठ है। समास अपने से बाहर किसी और की ओर संकेत करता है: शिव की ओर। इसे बहुव्रीहि कहते हैं, जिसका अपना अर्थ है ‘बहुत चावल वाला’।”'
  quote:
    sa: पूर्णचन्द्रमुखी नीलनीरजोत्तमलोचना
    gloss:
      en: Moon-faced, with lotus eyes of the finest blue.
      hi: पूर्ण चन्द्र-सा मुख वाली, श्रेष्ठ नील कमल-सी आँखों वाली।
    source: Kathāsaritsāgara 1.4 (read in the Digital Corpus of Sanskrit)
- id: t1
  kind: teach
  title:
    en: The one who has
    hi: जिसके पास है
  depth: core
  skills:
  - sam.bahuvrihi
  body:
    en: 'In a {{बहुव्रीहिः}} the whole compound describes a third person: {{नीलः कण्ठः यस्य सः}}, “he whose throat is blue”, is {{नीलकण्ठः}}, Śiva. {{पीतम् अम्बरम् यस्य सः}} is {{पीताम्बरः}}, Viṣṇu. A bahuvrīhi is an adjective, and takes the gender of the person it describes.'
    hi: '{{बहुव्रीहिः}} में पूरा समास किसी तीसरे का वर्णन करता है: {{नीलः कण्ठः यस्य सः}}, ‘जिसका कण्ठ नीला है’, {{नीलकण्ठः}} है, शिव। {{पीतम् अम्बरम् यस्य सः}} {{पीताम्बरः}} है, विष्णु। बहुव्रीहि विशेषण है, और वह जिस व्यक्ति का वर्णन करता है उसी का लिंग लेता है।'
  term:
    sa: बहुव्रीहिः
    meaning:
      en: a compound that describes someone else
      hi: वह समास जो किसी और का वर्णन करता है

- id: p4
  kind: practice
  title:
    en: The blue throat
    hi: नीला कण्ठ
  depth: core
  skills:
  - sam.bahuvrihi
  mode: choice
  prompt:
    en: '{{चन्द्रमुखी}} (feminine) means…'
    hi: '{{चन्द्रमुखी}} (स्त्रीलिंग) का अर्थ…'
  explain:
    en: A bahuvrīhi in the feminine, as it describes a woman.
    hi: स्त्रीलिंग में बहुव्रीहि, क्योंकि वह स्त्री का वर्णन करता है।
  roman: after
  gate: true
  story:
    success:
      en: “चन्द्रमुखी,” you say, “she whose face is the moon,” and the nineteenth statue lifts her face to the lamplight. The pale blue of her carved throat deepens, from the throat upwards, into the whole stone, and her expression changes, the way a face changes when its name is finally said right. “नीलकण्ठः,” she says. “The one who has it. Yes. I was never the throat. I belong to someone.”
      hi: “चन्द्रमुखी,” आप कहते हैं, “वह जिसका मुख चन्द्र है,” और उन्नीसवीं प्रतिमा अपना मुख दीपक की रोशनी की ओर उठाती है। उसके तराशे कण्ठ का हल्का नीला रंग गहरा होता है, कण्ठ से ऊपर पूरे पत्थर में, और उसका भाव बदल जाता है, जैसे किसी चेहरे का तब बदलता है जब उसका नाम अन्ततः ठीक कहा जाए। “नीलकण्ठः,” वह कहती है। “वह जिसके पास है। हाँ। मैं कभी कण्ठ नहीं थी। मैं किसी की हूँ।”
    failure:
      en: 'Her throat stays pale. A bahuvrīhi names the owner: “she whose face is the moon”.'
      hi: 'उसका कण्ठ हल्का रहता है। बहुव्रीहि स्वामी का नाम बताता है: ‘वह जिसका मुख चन्द्र है’।'
  options:
  - text:
      en: a moon and a face
      hi: चन्द्र और मुख
  - text:
      en: the moon of the face
      hi: मुख का चन्द्र
  - correct: true
    text:
      en: a woman whose face is like the moon
      hi: वह स्त्री जिसका मुख चन्द्र-सा है
- id: pn
  kind: teach
  title:
    en: Pāṇini's “whose”
    hi: पाणिनि का ‘जिसका’
  depth: panini
  skills:
  - sam.bahuvrihi
  sutras:
  - 2.2.23
  - 2.2.24
  body:
    en: Sūtra 2.2.23, {{शेषो बहुव्रीहिः}}, calls the remaining compounds {{बहुव्रीहिः}}, and 2.2.24, {{अनेकमन्यपदार्थे}}, says several words join in the sense of another word, someone outside the compound. The compound's own gender and number come from the one it describes.
    hi: सूत्र 2.2.23, {{शेषो बहुव्रीहिः}}, शेष समासों को {{बहुव्रीहिः}} कहता है, और 2.2.24, {{अनेकमन्यपदार्थे}}, कहता है कि कई शब्द किसी अन्य पद के अर्थ में जुड़ते हैं, अर्थात् समास से बाहर कोई। समास का अपना लिंग और वचन उसी से आता है जिसका वह वर्णन करता है।

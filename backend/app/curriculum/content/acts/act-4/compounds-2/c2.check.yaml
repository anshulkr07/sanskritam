- id: p7
  kind: practice
  depth: core
  skills:
  - sam.bahuvrihi
  - sam.avyayibhava
  mode: order
  prompt:
    en: 'Say what Mālikā says: “the blue-throated one; as far as possible; every day.”'
    hi: 'वह कहिए जो मालिका कहती है: ‘नीले कण्ठ वाला; यथाशक्ति; प्रतिदिन।’'
  explain:
    en: '{{नीलकण्ठः यथाशक्ति प्रतिदिनम्}}: a bahuvrīhi and two adverbs.'
    hi: '{{नीलकण्ठः यथाशक्ति प्रतिदिनम्}}: एक बहुव्रीहि और दो क्रियाविशेषण।'
  roman: after
  gate: true
  story:
    success:
      en: '“नीलकण्ठः, यथाशक्ति, प्रतिदिनम्,” you say, and Mālikā, the garland spirit, steps down and takes off her garland. Each flower, laid on the floor, opens like a hand and rests. “All my life,” she says, “I held them together.” She looks at the long chain on the floor, and then up at you. “राघवः,” she says, “कौन्तेयः. These are the sons: Raghu''s, Kuntī''s. I have never been able to say how.” In the lamplight, further off, the next two statues stir.'
      hi: '“नीलकण्ठः, यथाशक्ति, प्रतिदिनम्,” आप कहते हैं, और मालिका, माला-भूत, उतरती है और अपनी माला उतार देती है। फर्श पर रखा हर फूल हाथ की तरह खुलकर विश्राम करता है। “सारी उम्र,” वह कहती है, “मैंने इन्हें साथ थामा।” वह फर्श की लम्बी श्रृंखला को देखती है, और फिर आपको। “राघवः,” वह कहती है, “कौन्तेयः। ये पुत्र हैं: रघु के, कुन्ती के। मैं कभी बता नहीं पाई कैसे।” दीपक की रोशनी में, कुछ दूर, अगली दो प्रतिमाएँ हिलती हैं।'
    failure:
      en: 'The garland stays on. Her three: {{नीलकण्ठः यथाशक्ति प्रतिदिनम्}}.'
      hi: 'माला पहनी रहती है। उसके तीन: {{नीलकण्ठः यथाशक्ति प्रतिदिनम्}}।'
  tokens:
  - नीलकण्ठः
  - यथाशक्ति
  - प्रतिदिनम्

- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - sam.bahuvrihi
  mode: choice
  prompt:
    en: '{{पीताम्बरः}} means…'
    hi: '{{पीताम्बरः}} का अर्थ…'
  explain:
    en: A bahuvrīhi.
    hi: बहुव्रीहि।
  roman: after
  options:
  - text:
      en: a yellow cloth
      hi: पीला वस्त्र
  - correct: true
    text:
      en: the one in yellow cloth
      hi: पीले वस्त्र वाला
  - text:
      en: of the yellow cloth
      hi: पीले वस्त्र का
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'In a {{बहुव्रीहिः}} the whole compound describes a third person: {{नीलः कण्ठः यस्य सः}}, “he whose throat is blue”,
        is {{नीलकण्ठः}}, Śiva. {{पीतम् अम्बरम् यस्य सः}} is {{पीताम्बरः}}, Viṣṇu. A bahuvrīhi is an adjective, and takes the
        gender of the person it describes.'
      hi: '{{बहुव्रीहिः}} में पूरा समास किसी तीसरे का वर्णन करता है: {{नीलः कण्ठः यस्य सः}}, ‘जिसका कण्ठ नीला है’, {{नीलकण्ठः}}
        है, शिव। {{पीतम् अम्बरम् यस्य सः}} {{पीताम्बरः}} है, विष्णु। बहुव्रीहि विशेषण है, और वह जिस व्यक्ति का वर्णन करता
        है उसी का लिंग लेता है।'
    items:
    - id: i0
      sa: बहुव्रीहिः
    - id: i1
      sa: नीलः कण्ठः यस्य सः
    - id: i2
      sa: नीलकण्ठः
    - id: i3
      sa: पीतम् अम्बरम् यस्य सः
    - id: i4
      sa: पीताम्बरः

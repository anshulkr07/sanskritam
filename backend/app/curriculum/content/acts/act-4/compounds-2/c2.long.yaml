    - id: parts
      sa: '[ सूर्य + कोटि ] + सम + आभास'
      meaning:
        en: First group sun and ten million. Then connect the comparison and brightness.
        hi: पहले सूर्य और कोटि को समूहित करें। फिर समानता और आभास को जोड़ें।
    - id: comparison
      sa: '[ [ सूर्य + कोटि ] + सम ] + आभास'
      meaning:
        en: The comparison belongs to the brightness, not to an isolated word read without context.
        hi: समानता आभास के सम्बन्ध में है; शब्दों को सन्दर्भ से अलग न पढ़ें।
    - id: referent
      sa: सूर्यकोटिसमाभासः

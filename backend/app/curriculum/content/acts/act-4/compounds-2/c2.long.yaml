    title:
      en: Nested groups, then the whole referent
      hi: भीतर के समूह, फिर पूरा अभिप्राय
    explanation:
      en: Brackets below are reading aids. Identify the relationship at each join and check the whole compound in context.
      hi: नीचे के कोष्ठक पढ़ने की सहायता हैं। हर जोड़ का सम्बन्ध पहचानें और पूरे समास को सन्दर्भ में जाँचें।
    items:
    - id: whole
      sa: सूर्यकोटिसमाभासः

- id: p4
  kind: practice
  title:
    en: The garland
    hi: माला
  depth: core
  skills:
  - sam.long
  mode: choice
  prompt:
    en: '{{पीनस्तनोज्ज्वला}} ends in {{-ज्ज्वला}}. This tells you it is…'
    hi: '{{पीनस्तनोज्ज्वला}} {{-ज्ज्वला}} पर समाप्त होता है। इससे पता चलता है कि यह है…'
  explain:
    en: The last member {{उज्ज्वला}} is feminine.
    hi: अन्तिम सदस्य {{उज्ज्वला}} स्त्रीलिंग है।
  roman: after
  gate: true
  story:
    success:
      en: '“सूर्यकोटिसमाभासः,” you say, and the twenty-first statue slips her garland over her head and lays it on the plinth.
        It is not stone but a chain of small, perfect, separate flowers, and you read it, from the end, flower by flower:
        shining, like, ten million, sun. When you reach the first, the garland begins to glow, quietly, the colour of her
        sandstone, rose. “That was my name,” she says, “and my work: to hold a long thing together.”'
      hi: '“सूर्यकोटिसमाभासः,” आप कहते हैं, और इक्कीसवीं प्रतिमा अपनी माला सिर से उतारकर आसन पर रख देती है। वह पत्थर की नहीं,
        छोटे, पूर्ण, अलग-अलग फूलों की श्रृंखला है, और आप उसे अन्त से, फूल-फूल पढ़ते हैं: चमकने वाला, जैसा, करोड़, सूर्य। जब
        आप पहले तक पहुँचते हैं, माला हल्के-हल्के चमकने लगती है, उसके बलुआ पत्थर के रंग में, गुलाबी। “यही मेरा नाम था,” वह
        कहती है, “और मेरा काम: लम्बी चीज़ को साथ थामना।”'
    failure:
      en: 'The garland stays stone. The last member is feminine: {{उज्ज्वला}}.'
      hi: 'माला पत्थर रहती है। अन्तिम सदस्य स्त्रीलिंग है: {{उज्ज्वला}}।'
  options:

  story:
    success:
      en: '“सूर्यकोटिसमाभासः,” you say, and the twenty-first statue slips her garland over her head and lays it on the plinth. It is not stone but a chain of small, perfect, separate flowers, and you read it, from the end, flower by flower: shining, like, ten million, sun. When you reach the first, the garland begins to glow, quietly, the colour of her sandstone, rose. “That was my name,” she says, “and my work: to hold a long thing together.”'
      hi: '“सूर्यकोटिसमाभासः,” आप कहते हैं, और इक्कीसवीं प्रतिमा अपनी माला सिर से उतारकर आसन पर रख देती है। वह पत्थर की नहीं, छोटे, पूर्ण, अलग-अलग फूलों की श्रृंखला है, और आप उसे अन्त से, फूल-फूल पढ़ते हैं: चमकने वाला, जैसा, करोड़, सूर्य। जब आप पहले तक पहुँचते हैं, माला हल्के-हल्के चमकने लगती है, उसके बलुआ पत्थर के रंग में, गुलाबी। “यही मेरा नाम था,” वह कहती है, “और मेरा काम: लम्बी चीज़ को साथ थामना।”'
    failure:
      en: 'The garland stays stone. The last member is feminine: {{उज्ज्वला}}.'
      hi: 'माला पत्थर रहती है। अन्तिम सदस्य स्त्रीलिंग है: {{उज्ज्वला}}।'
  options:
  - text:
      en: masculine
      hi: पुंलिंग
  - text:
      en: neuter
      hi: नपुंसक
  - correct: true
    text:
      en: feminine, describing a woman
      hi: स्त्रीलिंग, स्त्री का वर्णन करता
- id: pn
  kind: teach
  title:
    en: Pāṇini's long compounds
    hi: पाणिनि के लम्बे समास
  depth: panini
  skills:
  - sam.long
  sutras:
  - 2.1.3
  - 2.2.30
  body:
    en: Sūtra 2.1.3, {{प्राक् कडारात् समासः}}, says compounding is allowed before {{कडार}} in the order of the sūtras, which gives the grammar's own order of types. And 2.2.30, {{उपसर्जनं पूर्वम्}}, puts the subordinate member first. Long compounds are made by repeating the same rules.
    hi: सूत्र 2.1.3, {{प्राक् कडारात् समासः}}, कहता है कि {{कडार}} से पहले तक समास की अनुमति है, जिससे व्याकरण के अपने प्रकारों का क्रम मिलता है। और 2.2.30, {{उपसर्जनं पूर्वम्}}, गौण सदस्य को पहले रखता है। लम्बे समास उन्हीं नियमों को दोहराने से बनते हैं।

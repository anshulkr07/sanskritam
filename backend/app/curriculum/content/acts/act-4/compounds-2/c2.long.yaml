- id: s1
  kind: story
  title:
    en: The twenty-first statue
    hi: इक्कीसवीं प्रतिमा
  depth: core
  image:
    brief: The twenty-first statue wearing a long garland of carved stone flowers, each a different shape, trailing to the
      floor; Śuka counting on his claws; Dādī tracing the garland from its last flower back to its first; Lubdhaka's foreman
      following her finger.
    alt:
      en: A statue wears a long stone garland while an old woman traces it from the last flower to the first
      hi: लम्बी पत्थर की माला पहने प्रतिमा, अन्तिम फूल से पहले तक उसे खोजती दादी
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - malika
    place: simhasana-shala
    ratio: '4:3'
    id: c2-long-s1
  narration:
    en: 'The twenty-first statue wears a garland of stone flowers trailing to the floor, each a different shape. “सूर्यकोटिसमाभासः,”
      she says, and takes a breath. “One word: ‘shining like ten million suns’.” Śuka counts on his claws. “Five pieces!”
      “Read it from the end,” says Dādī. “The last member gives the case and gender. Then take each piece from the right.”'
    hi: इक्कीसवीं प्रतिमा पत्थर के फूलों की माला पहने है जो ज़मीन तक लटकती है, और हर फूल का रूप अलग है। “सूर्यकोटिसमाभासः,”
      वह कहती है, और साँस लेती है। “यह एक शब्द है। इसका अर्थ है ‘करोड़ सूर्यों-सा चमकने वाला’।” शुक पंजों पर गिनता है। “पाँच
      टुकड़े!” “अन्त से पढ़िए,” दादी कहती हैं। “अन्तिम सदस्य विभक्ति और लिंग देता है। फिर हर टुकड़े को दाईं ओर से लीजिए।”
  quote:
    sa: सूर्यकोटिसमाभासो विद्युज्ज्योतिःसमप्रभः
    gloss:
      en: Shining like ten million suns, radiant like the light of lightning.
      hi: करोड़ सूर्यों-सा चमकने वाला, बिजली की ज्योति-सी प्रभा वाला।
    source: Vetālapañcaviṃśatikā, introduction (read in the Digital Corpus of Sanskrit)
- id: t1
  kind: teach
  title:
    en: Read from the end
    hi: अन्त से पढ़िए
  depth: core
  skills:
  - sam.long
  body:
    en: 'To unpack a long compound, identify its final member, then test meaningful groups in context. A group may itself
      be a compound. Resolve each relation: coordination, a case relation, description, or an external possessor. The last
      member is a useful clue; the whole compound’s gender and reference also depend on its construction.'
    hi: 'लम्बा समास खोलने के लिए अन्तिम सदस्य पहचानें, फिर सन्दर्भ में अर्थपूर्ण समूह जाँचें। कोई समूह स्वयं समास हो सकता
      है। हर सम्बन्ध पहचानें: समुच्चय, विभक्ति-सम्बन्ध, विशेषण या बाहरी स्वामी। अन्तिम सदस्य उपयोगी संकेत है; पूरे समास का
      लिंग और अभिप्राय उसकी रचना पर भी निर्भर करते हैं।'
  term:
    sa: समासविग्रहः
    meaning:
      en: unpacking a compound
      hi: समास को खोलना
  visuals:
  - id: v-foundation-concept
    kind: comparison
    title:
      en: Read from the end
      hi: अन्त से पढ़िए
    items:
    - id: i0
      sa: समासविग्रहः
      meaning:
        en: unpacking a compound
        hi: समास को खोलना
    - id: explanation
      meaning:
        en: 'To unpack a long compound, identify its final member, then test meaningful groups in context. A group may itself
          be a compound. Resolve each relation: coordination, a case relation, description, or an external possessor. The
          last member is a useful clue; the whole compound’s gender and reference also depend on its construction.'
        hi: 'लम्बा समास खोलने के लिए अन्तिम सदस्य पहचानें, फिर सन्दर्भ में अर्थपूर्ण समूह जाँचें। कोई समूह स्वयं समास हो सकता
          है। हर सम्बन्ध पहचानें: समुच्चय, विभक्ति-सम्बन्ध, विशेषण या बाहरी स्वामी। अन्तिम सदस्य उपयोगी संकेत है; पूरे समास
          का लिंग और अभिप्राय उसकी रचना पर भी निर्भर करते हैं।'

        hi: ‘जिसकी चमक करोड़ सूर्यों-सी है’
  note:
    en: 'The whole compound is a bahuvrīhi: it names the king.'
    hi: 'पूरा समास बहुव्रीहि है: वह राजा का नाम बताता है।'

        hi: शेष को दो में काटिए
    - sa: सूर्यकोटिसम + आभासः
  - - text:
        en: '3'
        hi: ३
    - text:
        en: Cut again
        hi: फिर काटिए
    - sa: सूर्यकोटिः + सम + आभासः
  - - text:
        en: '4'
        hi: ४
    - text:
        en: Cut the first part
        hi: पहले भाग को काटिए
    - sa: सूर्य + कोटिः + सम + आभासः

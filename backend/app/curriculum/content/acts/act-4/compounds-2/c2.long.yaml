- id: pn
  kind: teach
  title:
    en: Pāṇini's long compounds
    hi: पाणिनि के लम्बे समास
  depth: panini
  skills:
  - sam.long
  sutras:
  - 2.1.3
  - 2.2.30
  body:
    en: Sūtra 2.1.3, {{प्राक् कडारात् समासः}}, says compounding is allowed before {{कडार}} in the order of the sūtras, which
      gives the grammar's own order of types. And 2.2.30, {{उपसर्जनं पूर्वम्}}, puts the subordinate member first. Long compounds
      are made by repeating the same rules.
    hi: सूत्र 2.1.3, {{प्राक् कडारात् समासः}}, कहता है कि {{कडार}} से पहले तक समास की अनुमति है, जिससे व्याकरण के अपने प्रकारों
      का क्रम मिलता है। और 2.2.30, {{उपसर्जनं पूर्वम्}}, गौण सदस्य को पहले रखता है। लम्बे समास उन्हीं नियमों को दोहराने से
      बनते हैं।
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: Sūtra 2.1.3, {{प्राक् कडारात् समासः}}, says compounding is allowed before {{कडार}} in the order of the sūtras, which
        gives the grammar's own order of types. And 2.2.30, {{उपसर्जनं पूर्वम्}}, puts the subordinate member first. Long
        compounds are made by repeating the same rules.
      hi: सूत्र 2.1.3, {{प्राक् कडारात् समासः}}, कहता है कि {{कडार}} से पहले तक समास की अनुमति है, जिससे व्याकरण के अपने प्रकारों
        का क्रम मिलता है। और 2.2.30, {{उपसर्जनं पूर्वम्}}, गौण सदस्य को पहले रखता है। लम्बे समास उन्हीं नियमों को दोहराने
        से बनते हैं।
    items:
    - id: i0
      sa: प्राक् कडारात् समासः
    - id: i1
      sa: कडार
    - id: i2
      sa: उपसर्जनं पूर्वम्

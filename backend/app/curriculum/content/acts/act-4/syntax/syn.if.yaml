- id: p4
  kind: practice
  title:
    en: If… then
    hi: यदि… तो
  depth: core
  skills:
  - syn.conditional
  mode: choice
  prompt:
    en: “If he were to read, he would know.” Which verb pair?
    hi: ‘यदि वह पढ़े, तो जान जाए।’ कौन-सी क्रिया-जोड़ी?
  explain:
    en: A supposition takes the optative in both halves.
    hi: कल्पना दोनों भागों में विधिलिङ् लेती है।
  roman: after
  gate: true
  story:
    success:
      en: “पठेत् … जानीयात्,” you say, and the thirty-second statue's raised fingers come down together, and the throne behind
        her, bare and plain for a thousand years, shines, from within, as if someone had at last turned a lamp on in it. “If
        he were to read,” she says, in the plainest voice of all the statues, “he would know. यदि… तर्हि. That is the throne.”
      hi: “पठेत् … जानीयात्,” आप कहते हैं, और बत्तीसवीं प्रतिमा की उठी उँगलियाँ साथ-साथ नीचे आती हैं, और उसके पीछे का सिंहासन,
        हज़ार वर्षों से सादा और नंगा, भीतर से चमक उठता है, मानो किसी ने आख़िरकार उसमें दीपक जला दिया हो। “यदि वह पढ़े,” वह
        सब प्रतिमाओं में सबसे सादी आवाज़ में कहती है, “तो वह जान जाए। यदि… तर्हि। यही सिंहासन है।”
    failure:
      en: 'Her fingers stay raised. A supposition takes the optative: {{पठेत् … जानीयात्}}.'
      hi: 'उसकी उँगलियाँ उठी रहती हैं। कल्पना विधिलिङ् लेती है: {{पठेत् … जानीयात्}}।'
  options:
  - sa: पठति … जानाति
  - sa: पठिष्यति … ज्ञास्यति
  - correct: true
    sa: पठेत् … जानीयात्

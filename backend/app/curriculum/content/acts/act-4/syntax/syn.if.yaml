cards:
- id: s1
  kind: story
  title:
    en: The thirty-second statue
    hi: बत्तीसवीं प्रतिमा
  depth: core
  image:
    brief: The thirty-second statue, the last, stern-faced, with a very small hand held up showing two fingers; at her feet
      the throne itself, bare and plain; Dādī and Śuka looking up at her; Lubdhaka's foreman at the back, quiet.
    alt:
      en: The last statue with a stern face and two raised fingers before a plain stone throne
      hi: कठोर मुख, उठी दो उँगलियों वाली अन्तिम प्रतिमा, सादे पत्थर के सिंहासन के सामने
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - vakyika
    place: simhasana-shala
    ratio: '4:3'
    id: syn-if-s1
  narration:
    en: 'The thirty-second statue has a stern face and a very small hand holding up two fingers. “यदि सः पठति, तर्हि सः जानाति,”
      she says: “if he reads, then he knows.” “And if he does not?” “यदि न पठति, तर्हि न जानाति.” Dādī: “Three flavours of
      if: what is, what will be, what would be. The words यदि and तर्हि stay the same.”'
    hi: 'बत्तीसवीं प्रतिमा का मुख कठोर है और उसके बहुत छोटे हाथ में दो उँगलियाँ उठी हैं। “यदि सः पठति, तर्हि सः जानाति,” वह
      कहती है: “अगर वह पढ़ता है, तो वह जानता है।” “और यदि नहीं?” “यदि न पठति, तर्हि न जानाति।” दादी: “‘अगर’ के तीन स्वाद हैं:
      जो होता है (वर्तमान), जो होगा (भविष्यत्), जो होता (विधिलिङ्)। शब्द यदि और तर्हि वही रहते हैं।”'
  quote:
    sa: यदि वदसि तर्हि तन्मृतकं पुनर् वृक्षे यास्यति
    gloss:
      en: If you speak, then that corpse will go back to the tree.
      hi: यदि तुम बोलोगे, तो वह शव फिर वृक्ष पर चला जाएगा।
    source: Vetālapañcaviṃśatikā, introduction (read in the Digital Corpus of Sanskrit)
- id: t1
  kind: teach
  title:
    en: If… then
    hi: यदि… तो
  depth: core
  skills:
  - syn.conditional
  body:
    en: '{{यदि}} (if) opens the condition, and {{तर्हि}} or {{तदा}} (then) opens the result: {{यदि सः पठति, तर्हि जानाति}}.
      A condition about the future takes the future: {{यदि वदसि, तर्हि यास्यति}}. A condition that is only supposed takes
      {{विधिलिङ्}}: {{यदि पठेत्, तर्हि जानीयात्}}. A negative condition adds {{न}}.'
    hi: '{{यदि}} (अगर) शर्त खोलता है, और {{तर्हि}} या {{तदा}} (तब) परिणाम खोलता है: {{यदि सः पठति, तर्हि जानाति}}। भविष्य
      की शर्त भविष्यत् लेती है: {{यदि वदसि, तर्हि यास्यति}}। केवल मानी हुई शर्त {{विधिलिङ्}} लेती है: {{यदि पठेत्, तर्हि जानीयात्}}।
      नकारात्मक शर्त में {{न}} जुड़ता है।'

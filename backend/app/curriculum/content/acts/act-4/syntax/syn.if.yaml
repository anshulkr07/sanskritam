        so they never change.
      hi: सूत्र 3.3.156, {{हेतुहेतुमतोर्लिङ्}}, शर्त और उसके परिणाम दोनों को {{लिङ्}} देता है। 3.3.139, {{लिङ्निमित्ते लृङ्
        क्रियातिपत्तौ}}, जब शर्त पूरी नहीं हुई तब {{लृङ्}} देता है। {{यदि}} और {{तर्हि}} निपात हैं, इसलिए कभी नहीं बदलते।

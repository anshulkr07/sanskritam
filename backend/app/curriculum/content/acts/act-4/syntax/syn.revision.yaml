- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: syn.absolute
    rule:
      en: '{{यस्य च भावेन भावलक्षणम्}} and {{सप्तम्यधिकरणे च}}: the little scene.'
      hi: '{{यस्य च भावेन भावलक्षणम्}} और {{सप्तम्यधिकरणे च}}: छोटा दृश्य।'
    sutras:
    - 2.3.37
    - 2.3.36
    tag: core
    taught_in: syn.when#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 2.3.37, {{यस्य च भावेन भावलक्षणम्}}, says that when one action marks the time of another, the first is put
          in the seventh case with its doer. 2.3.36, {{सप्तम्यधिकरणे च}}, gives the seventh case for the place or setting
          of an action.
        hi: सूत्र 2.3.37, {{यस्य च भावेन भावलक्षणम्}}, कहता है कि जब एक क्रिया दूसरी का समय बताए, तब पहली को उसके कर्ता के
          साथ सप्तमी में रखा जाता है। 2.3.36, {{सप्तम्यधिकरणे च}}, क्रिया के स्थान या परिवेश के लिए सप्तमी देता है।
      items:
      - id: i0
        sa: यस्य च भावेन भावलक्षणम्
      - id: i1
        sa: सप्तम्यधिकरणे च
  - skill: syn.conditional
    rule:
      en: '{{हेतुहेतुमतोर्लिङ्}}: the optative for a condition and its result.'
      hi: '{{हेतुहेतुमतोर्लिङ्}}: शर्त और परिणाम के लिए विधिलिङ्।'
    sutras:
    - 3.3.156
    tag: core
    taught_in: syn.if#pn
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 3.3.156, {{हेतुहेतुमतोर्लिङ्}}, gives {{लिङ्}} to both the condition and its result. 3.3.139, {{लिङ्निमित्ते
          लृङ् क्रियातिपत्तौ}}, gives {{लृङ्}} when the condition was not met. {{यदि}} and {{तर्हि}} are particles, {{निपात}}s,
          so they never change.
        hi: सूत्र 3.3.156, {{हेतुहेतुमतोर्लिङ्}}, शर्त और उसके परिणाम दोनों को {{लिङ्}} देता है। 3.3.139, {{लिङ्निमित्ते लृङ्
          क्रियातिपत्तौ}}, जब शर्त पूरी नहीं हुई तब {{लृङ्}} देता है। {{यदि}} और {{तर्हि}} निपात हैं, इसलिए कभी नहीं बदलते।
      items:
      - id: i0
        sa: हेतुहेतुमतोर्लिङ्
      - id: i1
        sa: लिङ्
      - id: i2
        sa: लिङ्निमित्ते लृङ् क्रियातिपत्तौ
      - id: i3
        sa: लृङ्
      - id: i4
        sa: यदि
      - id: i5
        sa: तर्हि
      - id: i6
        sa: निपात

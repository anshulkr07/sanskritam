cards:
- id: s1
  kind: story
  title:
    en: The thirty-first statue
    hi: इकतीसवीं प्रतिमा
  depth: core
  image:
    brief: The thirty-first statue holding a small stone bowl in which a golden sun rises; carved lotuses opening along her
      plinth; Dādī pointing at the sun; Śuka watching; early gold light in the hall.
    alt:
      en: A statue holds a stone bowl with a rising sun while carved lotuses open along her plinth
      hi: पत्थर के कटोरे में उगता सूर्य थामे प्रतिमा, आसन पर खिलते कमल
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - vakyika
    place: simhasana-shala
    ratio: '4:3'
    id: syn-when-s1
  narration:
    en: 'The thirty-first statue holds a rising sun in a stone bowl. “सूर्ये उदिते,” she says: “the sun having risen.” “कमलानि
      विकसन्ति”: “the lotuses open.” “The first half stands apart,” says Dādī. “Its own subject and its own verb-word, both
      in the seventh case, say when. A little scene; then the main sentence says what happens.”'
    hi: 'इकतीसवीं प्रतिमा पत्थर के कटोरे में उगता सूर्य थामे है। “सूर्ये उदिते,” वह कहती है: “सूर्य के उदय होने पर।” “कमलानि
      विकसन्ति”: “कमल खिलते हैं।” “पहला भाग अलग खड़ा है,” दादी कहती हैं। “उसका अपना कर्ता है और अपना क्रिया-शब्द, दोनों सप्तमी
      में, और वह बताता है कब। यह एक छोटे दृश्य जैसा है। ‘सूर्य के उदित होने पर’, और फिर मुख्य वाक्य में: क्या होता है।”'
  quote:
    sa: मार्गे चलिते सति शवसंक्रमितेन वेतालेन राजानं प्रत्यभिहितम्
    gloss:
      en: As the king walked on, the Vetāla, who had entered the corpse, spoke to him.
      hi: राजा के मार्ग पर चलते हुए, शव में प्रविष्ट वेताल ने उससे कहा।
    source: Vetālapañcaviṃśatikā, introduction (read in the Digital Corpus of Sanskrit); mārge calite sati is the absolute
      locative
- id: t1
  kind: teach
  title:
    en: The little scene
    hi: छोटा दृश्य
  depth: core
  skills:
  - syn.absolute
  body:
    en: 'A word and its participle, both in the seventh case, set the scene: {{सूर्ये उदिते}}, “the sun having risen”; {{रामे
      गते}}, “Rāma having gone”. If a present sense is meant, use {{शतृ}} or {{सति}}: {{बालके पठति}}, “while the boy reads”.
      This is {{सति सप्तमी}}, the absolute locative. The main clause has a different subject.'
    hi: 'एक शब्द और उसका कृदन्त, दोनों सप्तमी में, दृश्य रचते हैं: {{सूर्ये उदिते}}, ‘सूर्य के उदित होने पर’; {{रामे गते}},
      ‘राम के जाने पर’। वर्तमान का भाव हो तो {{शतृ}} या {{सति}} लीजिए: {{बालके पठति}}, ‘बालक के पढ़ते हुए’। यह {{सति सप्तमी}}
      है। मुख्य वाक्य का कर्ता अलग होता है।'
  examples:

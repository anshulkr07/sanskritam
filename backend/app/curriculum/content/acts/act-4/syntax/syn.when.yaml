        dhatu: गम्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
        prefixes:
        - आ
  - sa: बालके पठति गुरुः हसति।
    meaning:
      en: While the boy reads, the teacher smiles.
      hi: बालक के पढ़ते हुए गुरु हँसता है।
    words:
    - sa: बालके

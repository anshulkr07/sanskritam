  sutras:
  - 2.3.37
  - 2.3.36
  body:
    en: Sūtra 2.3.37, {{यस्य च भावेन भावलक्षणम्}}, says that when one action marks the time of another, the first is put in
      the seventh case with its doer. 2.3.36, {{सप्तम्यधिकरणे च}}, gives the seventh case for the place or setting of an action.
    hi: सूत्र 2.3.37, {{यस्य च भावेन भावलक्षणम्}}, कहता है कि जब एक क्रिया दूसरी का समय बताए, तब पहली को उसके कर्ता के साथ
      सप्तमी में रखा जाता है। 2.3.36, {{सप्तम्यधिकरणे च}}, क्रिया के स्थान या परिवेश के लिए सप्तमी देता है।

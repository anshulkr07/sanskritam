        stem: बालक
        linga: Pum
        vibhakti: Saptami
        vacana: Eka
    - sa: पठति
      gloss:
        en: reading
        hi: पढ़ते हुए
      check:
        type: krdanta
        dhatu: पठ्
        krt: Satf
        linga: Pum
        vibhakti: Saptami
        vacana: Eka
    - sa: गुरुः

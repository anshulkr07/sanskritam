  roman: after
  gate: true
  story:
    success:
      en: '“सूर्ये उदिते,” you say, and the golden sun in the thirty-first statue''s bowl rises, a hand''s breadth, and warms
        your face. On her plinth, one by one, the carved lotuses open, as in a very slow film: कमलानि विकसन्ति. “It takes
        a whole scene to say it,” she says. “Two words in the seventh case, and the world changes.”'
      hi: '“सूर्ये उदिते,” आप कहते हैं, और इकतीसवीं प्रतिमा के कटोरे का सुनहरा सूर्य हथेली भर ऊपर उठता है और आपका चेहरा गरमाता
        है। उसके आसन पर, एक-एक करके, तराशे कमल खिलते हैं, बहुत धीमी फ़िल्म की तरह: कमलानि विकसन्ति। “एक पूरा दृश्य लगता है
        इसे कहने में,” वह कहती है। “सप्तमी में दो शब्द, और संसार बदल जाता है।”'
    failure:
      en: The sun stays low. The scene's subject is {{मार्गे}}.
      hi: सूर्य नीचा रहता है। दृश्य का कर्ता {{मार्गे}} है।

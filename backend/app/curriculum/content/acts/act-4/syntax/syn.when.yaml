- id: p4
  kind: practice
  title:
    en: The little scene
    hi: छोटा दृश्य
  depth: core
  skills:
  - syn.absolute
  mode: choice
  prompt:
    en: In “मार्गे चलिते सति”, what is the subject of the little scene?
    hi: “मार्गे चलिते सति” में दृश्य का कर्ता क्या है?
  explain:
    en: '{{मार्गे}} (the road): the scene''s own subject.'
    hi: '{{मार्गे}} (मार्ग): दृश्य का अपना कर्ता।'
  roman: after
  gate: true
  story:
    success:
      en: '“सूर्ये उदिते,” you say, and the golden sun in the thirty-first statue''s bowl rises, a hand''s breadth, and warms your face. On her plinth, one by one, the carved lotuses open, as in a very slow film: कमलानि विकसन्ति. “It takes a whole scene to say it,” she says. “Two words in the seventh case, and the world changes.”'
      hi: '“सूर्ये उदिते,” आप कहते हैं, और इकतीसवीं प्रतिमा के कटोरे का सुनहरा सूर्य हथेली भर ऊपर उठता है और आपका चेहरा गरमाता है। उसके आसन पर, एक-एक करके, तराशे कमल खिलते हैं, बहुत धीमी फ़िल्म की तरह: कमलानि विकसन्ति। “एक पूरा दृश्य लगता है इसे कहने में,” वह कहती है। “सप्तमी में दो शब्द, और संसार बदल जाता है।”'
    failure:
      en: The sun stays low. The scene's subject is {{मार्गे}}.
      hi: सूर्य नीचा रहता है। दृश्य का कर्ता {{मार्गे}} है।
  options:
  - sa: सति
  - sa: चलिते
  - correct: true
    sa: मार्गे
- id: pn
  kind: teach
  title:
    en: Pāṇini's scene
    hi: पाणिनि का दृश्य
  depth: panini
  skills:
  - syn.absolute
  sutras:
  - 2.3.37
  - 2.3.36
  body:
    en: Sūtra 2.3.37, {{यस्य च भावेन भावलक्षणम्}}, says that when one action marks the time of another, the first is put in the seventh case with its doer. 2.3.36, {{सप्तम्यधिकरणे च}}, gives the seventh case for the place or setting of an action.
    hi: सूत्र 2.3.37, {{यस्य च भावेन भावलक्षणम्}}, कहता है कि जब एक क्रिया दूसरी का समय बताए, तब पहली को उसके कर्ता के साथ सप्तमी में रखा जाता है। 2.3.36, {{सप्तम्यधिकरणे च}}, क्रिया के स्थान या परिवेश के लिए सप्तमी देता है।

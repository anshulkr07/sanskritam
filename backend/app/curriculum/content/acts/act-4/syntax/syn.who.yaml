- id: p1
  kind: practice
  depth: core
  skills:
  - syn.relative
  mode: choice
  prompt:
    en: “She who writes, she …” Which pair?
    hi: ‘जो लिखती है, वह …’ कौन-सी जोड़ी?
  explain:
    en: 'Feminine: {{या}} … {{सा}}.'
    hi: 'स्त्रीलिंग: {{या}} … {{सा}}।'

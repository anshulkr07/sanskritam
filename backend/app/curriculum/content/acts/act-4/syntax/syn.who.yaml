- id: pn
  kind: teach
  title:
    en: Pāṇini's pair
    hi: पाणिनि की जोड़ी
  depth: panini
  skills:
  - syn.relative
  sutras:
  - 7.1.14
  - 7.1.15
  - 7.2.106
  body:
    en: 'Pāṇini does not give a rule for the pair itself: it is part of how {{यद्}} and {{तद्}} are defined. {{यद्}} is {{सर्वनाम}},
      taking the odd endings {{यस्मै}}, {{यस्मात्}}, {{यस्मिन्}} by 7.1.14 and 7.1.15; {{तद्}} answers it, and 7.2.106 gives
      {{सः}}.'
    hi: 'पाणिनि जोड़ी के लिए स्वतन्त्र नियम नहीं देते: वह {{यद्}} और {{तद्}} की परिभाषा का भाग है। {{यद्}} {{सर्वनाम}} है,
      जो 7.1.14 और 7.1.15 से {{यस्मै}}, {{यस्मात्}}, {{यस्मिन्}} जैसे विचित्र प्रत्यय लेता है; {{तद्}} उसका उत्तर देता है,
      और 7.2.106 से {{सः}} बनता है।'

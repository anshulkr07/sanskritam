- id: s1
  kind: story
  title:
    en: The thirtieth statue
    hi: तीसवीं प्रतिमा
  depth: core
  image:
    brief: The thirtieth statue holding a long unrolled scroll that trails behind her; Śuka reading it aloud with a raised
      wing; Dādī smiling; Lubdhaka's foreman following the words with his finger.
    alt:
      en: A statue holds a long scroll while a parrot reads aloud and a man follows with his finger
      hi: लम्बा पत्र थामे प्रतिमा, ज़ोर से पढ़ता तोता, उँगली से पढ़ता आदमी
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - vakyika
    place: simhasana-shala
    ratio: '4:3'
    id: syn-who-s1
    text_in_image:
    - यः पठति सः जानाति।
  narration:
    en: 'The thirtieth statue holds a long scroll. “यः पठति, सः जानाति,” she says. Śuka, who has been getting good at this,
      says: “Who reads, he knows.” “It comes in two halves,” says Dādī. “The first, with यः (who), says who we mean. The second,
      with सः (he), says what we say about him. They always pair: यः… सः, या… सा, यत्… तत्. It works for any case.”'
    hi: 'तीसवीं प्रतिमा के हाथ में लम्बा पत्र है। “यः पठति, सः जानाति,” वह कहती है। शुक, जो इसमें माहिर होता जा रहा है, कहता
      है: “जो पढ़ता है, वह जानता है।” “यह दो भागों में आता है,” दादी कहती हैं। “पहला, यः (जो) के साथ, बताता है कि हम किसकी
      बात कर रहे हैं। दूसरा, सः (वह) के साथ, बताता है कि हम उसके बारे में क्या कहते हैं। वे सदा जोड़ी में आते हैं: यः… सः,
      या… सा, यत्… तत्। यह किसी भी विभक्ति में चलता है।”'
  quote:
    sa: यद् यद् आचरति श्रेष्ठस् तत् तद् एवेतरो जनः स यत् प्रमाणं कुरुते लोकस् तद् अनुवर्तते
    gloss:
      en: Whatever the best person does, that and that others do; whatever standard he sets, the world follows.
      hi: श्रेष्ठ जन जो-जो करता है, वही-वही अन्य लोग करते हैं; वह जो प्रमाण रखता है, संसार उसी का अनुसरण करता है।
    source: Bhagavadgītā 3.21 (read at GRETIL)
- id: t1
  kind: teach
  title:
    en: Who… he
    hi: जो… वह
  depth: core
  skills:
  - syn.relative
  body:
    en: 'A sentence with {{यः}} (who) is answered by {{सः}} (he): {{यः पठति सः जानाति}}, “who reads, he knows”. The pair agrees
      in gender and number, and either can stand in any case: {{यम्}} … {{तम्}}, {{येन}} … {{तेन}}, {{यस्य}} … {{तस्य}}. The
      {{यद्}}-half usually comes first.'
    hi: '{{यः}} (जो) वाले वाक्य का उत्तर {{सः}} (वह) देता है: {{यः पठति सः जानाति}}, ‘जो पढ़ता है, वह जानता है’। जोड़ी लिंग
      और वचन में मेल खाती है, और कोई भी किसी भी विभक्ति में आ सकता है: {{यम्}} … {{तम्}}, {{येन}} … {{तेन}}, {{यस्य}} … {{तस्य}}।
      {{यद्}}-भाग प्रायः पहले आता है।'

- id: p4
  kind: practice
  title:
    en: The scroll
    hi: पत्र
  depth: core
  skills:
  - syn.relative
  mode: choice
  prompt:
    en: “Whose intellect, his strength.” Which pair?
    hi: ‘जिसकी बुद्धि, उसका बल।’ कौन-सी जोड़ी?
  explain:
    en: 'The sixth case: {{यस्य}} … {{तस्य}}.'
    hi: 'षष्ठी: {{यस्य}} … {{तस्य}}।'
  roman: after
  gate: true
  story:
    success:
      en: “यस्य बुद्धिः, तस्य बलम्,” you say. The thirtieth statue unrolls her scroll a little further and lets you read the
        line she has been carrying. Her sentence is long, in two halves, but the halves answer each other, यः… सः, यत्… तत्,
        and for the first time she reads it through to the end. “Who… he,” she says, breathless. “And I did not know where
        to stop.”
      hi: “यस्य बुद्धिः, तस्य बलम्,” आप कहते हैं। तीसवीं प्रतिमा अपना पत्र थोड़ा और खोलती है और आपको वह पंक्ति पढ़ने देती
        है जो वह ढोती रही है। उसका वाक्य लम्बा है, दो भागों में, पर भाग एक-दूसरे का उत्तर देते हैं, यः… सः, यत्… तत्, और पहली
        बार वह उसे अन्त तक पढ़ जाती है। “जो… वह,” वह हाँफते हुए कहती है। “और मुझे नहीं पता था कि कहाँ रुकना है।”
    failure:
      en: 'The scroll stays rolled. The sixth case: {{यस्य}} … {{तस्य}}.'
      hi: 'पत्र लिपटा रहता है। षष्ठी: {{यस्य}} … {{तस्य}}।'

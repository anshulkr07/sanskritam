        gloss:
          en: reads
          hi: पढ़ता है
        check:
          type: tinanta
          dhatu: पठ्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
      - sa: सः
        gloss:
          en: he
          hi: वह
      - sa: जानाति
        gloss:
          en: knows
          hi: जानता है
        check:
          type: tinanta
          dhatu: ज्ञा
          lakara: Lat
          purusha: Prathama
          vacana: Eka
    - id: i1
      sa: यः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: who
        hi: जो
    - id: i2
      sa: पठति
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: reads
        hi: पढ़ता है
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
      feature:
        en: 'Root: {{पठ्}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{पठ्}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'

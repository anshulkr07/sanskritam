- id: pn
  kind: teach
  title:
    en: Pāṇini's order
    hi: पाणिनि का क्रम
  depth: panini
  skills:
  - syn.anvaya
  sutras:
  - 2.3.1
  body:
    en: 'Pāṇini does not fix a word order, because a case ending already says each word''s job: 2.3.1, {{अनभिहिते}}, says
      a case is used for the relation not already expressed by the verb. So prose order is for the reader''s comfort, and
      verse may use any order.'
    hi: 'पाणिनि शब्द-क्रम तय नहीं करते, क्योंकि विभक्ति प्रत्यय पहले से हर शब्द का काम बताता है: 2.3.1, {{अनभिहिते}}, कहता
      है कि विभक्ति उस सम्बन्ध के लिए आती है जो क्रिया ने पहले से नहीं कहा। इसलिए गद्य का क्रम पाठक की सुविधा के लिए है, और
      श्लोक कोई भी क्रम ले सकता है।'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation

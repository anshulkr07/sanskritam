- id: p6
  kind: practice
  title:
    en: The last word
    hi: अन्तिम शब्द
  depth: core
  skills:
  - syn.anvaya
  mode: choice
  prompt:
    en: In “रिक्तपाणिः न पश्येत् राजानम्”, who is the doer?
    hi: “रिक्तपाणिः न पश्येत् राजानम्” में कर्ता कौन है?
  explain:
    en: '{{रिक्तपाणिः}}: the one empty-handed.'
    hi: '{{रिक्तपाणिः}}: खाली हाथ वाला।'
  roman: after
  gate: true
  story:
    success:
      en: '“रिक्तपाणिः राजानं भिषजं गुरुं न पश्येत्,” you say, in the order of sense, “one empty-handed should not see a king,
        a doctor, a teacher.” Vākyikā lowers her scroll, and the throne''s light brightens, so that the whole hall is gold.
        “Whoever sits here,” she says, “must know that the last word is not a command. It is an order: the order that makes
        sense.” Lubdhaka''s foot comes off the step. In the stone of the throne''s base, a slab, long sealed, slides gently
        aside.'
      hi: '“रिक्तपाणिः राजानं भिषजं गुरुं न पश्येत्,” आप अर्थ के क्रम में कहते हैं, “खाली हाथ वाला राजा, वैद्य, गुरु से न
        मिले।” वाक्यिका अपना पत्र नीचे करती है, और सिंहासन का प्रकाश तेज़ हो जाता है, पूरा कक्ष सुनहरा हो जाता है। “जो भी
        यहाँ बैठे,” वह कहती है, “उसे जानना चाहिए कि अन्तिम शब्द आज्ञा नहीं है। वह क्रम है: वह क्रम जिसका अर्थ बनता है।” लुब्धक
        का पैर सीढ़ी से हट जाता है। सिंहासन के आधार के पत्थर में, बहुत समय से बन्द एक पटिया धीरे से सरक जाती है।'
    failure:
      en: The light stays dim. The doer is {{रिक्तपाणिः}}.
      hi: प्रकाश मद्धम रहता है। कर्ता {{रिक्तपाणिः}} है।
  options:

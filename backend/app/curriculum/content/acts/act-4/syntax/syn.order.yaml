cards:
- id: s1
  kind: story
  title:
    en: The throne
    hi: सिंहासन
  depth: core
  image:
    brief: The thirty-two statues standing in a ring around a lit stone throne; Lubdhaka with one foot on the first step and
      his foreman beside him; a small basalt spirit holding out a scroll with a line on it to the travellers; Dādī and Śuka
      stepping forward; warm light from inside the throne.
    alt:
      en: Thirty-two statues ring a lit throne as a man puts a foot on the step and a small spirit holds out a line
      hi: प्रकाशित सिंहासन के चारों ओर बत्तीस प्रतिमाएँ, सीढ़ी पर पैर रखता आदमी, पंक्ति बढ़ाती नन्ही भूत
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - vakyika
    place: simhasana-shala
    ratio: '4:3'
    id: syn-order-s1
    text_in_image:
    - रिक्तपाणिर् न पश्येत राजानं भिषजं गुरुम्
  narration:
    en: 'The thirty-two statues stand in a ring, the throne lit from within. Lubdhaka steps forward and puts one foot on the
      first step. “Wait,” says Vākyikā, the basalt spirit. “To sit here you must read the last word. It is in verse.” She
      holds out a line. “Verse puts words in the order of the metre. Read it in the order of sense: that is anvaya.”'
    hi: 'बत्तीस प्रतिमाएँ घेरे में खड़ी हैं, और सिंहासन भीतर से प्रकाशित है। लुब्धक आगे बढ़ता है, उसका मुखिया उसके पास, और
      पहली सीढ़ी पर एक पैर रखता है। “रुकिए,” वाक्यिका, बेसाल्ट की भूत, पत्र से कहती है। “यहाँ बैठने के लिए अन्तिम शब्द पढ़ना
      होगा। और वह श्लोक में है।” वह एक पंक्ति आगे बढ़ाती है। “शब्द छन्द के क्रम में हैं। उन्हें अर्थ के क्रम में पढ़िए: उसे
      अन्वय कहते हैं।”'
  quote:
    sa: रिक्तपाणिर् न पश्येत राजानं भिषजं गुरुम्
    gloss:
      en: One should not go empty-handed to see a king, a doctor or a teacher.
      hi: राजा, वैद्य या गुरु से खाली हाथ नहीं मिलना चाहिए।
    source: Vetālapañcaviṃśatikā, introduction (read in the Digital Corpus of Sanskrit)
- id: t1
  kind: teach
  title:
    en: Anvaya
    hi: अन्वय
  depth: core
  skills:
  - syn.anvaya
  body:
    en: 'Verse puts words in the order of the metre; prose puts them in the order of sense. To find the {{अन्वयः}}: first
      split the joins (padaccheda); then find the verb; then its doer; then the object, and describing words next to the words
      they describe. {{रिक्तपाणिः राजानं भिषजं गुरुं न पश्येत्}}: who, whom, what, how.'
    hi: 'श्लोक शब्दों को छन्द के क्रम में रखता है; गद्य अर्थ के क्रम में। {{अन्वयः}} खोजने के लिए: पहले सन्धि खोलिए (पदच्छेद);
      फिर क्रिया खोजिए; फिर उसका कर्ता; फिर कर्म, और विशेषण उन शब्दों के पास जिनका वे वर्णन करते हैं। {{रिक्तपाणिः राजानं
      भिषजं गुरुं न पश्येत्}}: कौन, किसे, कैसे।'
  term:
    sa: अन्वयः
    meaning:
      en: the prose order of a verse
      hi: श्लोक का गद्य-क्रम
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'Verse puts words in the order of the metre; prose puts them in the order of sense. To find the {{अन्वयः}}: first
        split the joins (padaccheda); then find the verb; then its doer; then the object, and describing words next to the
        words they describe. {{रिक्तपाणिः राजानं भिषजं गुरुं न पश्येत्}}: who, whom, what, how.'
      hi: 'श्लोक शब्दों को छन्द के क्रम में रखता है; गद्य अर्थ के क्रम में। {{अन्वयः}} खोजने के लिए: पहले सन्धि खोलिए (पदच्छेद);
        फिर क्रिया खोजिए; फिर उसका कर्ता; फिर कर्म, और विशेषण उन शब्दों के पास जिनका वे वर्णन करते हैं। {{रिक्तपाणिः राजानं
        भिषजं गुरुं न पश्येत्}}: कौन, किसे, कैसे।'
    items:
    - id: i0
      sa: अन्वयः

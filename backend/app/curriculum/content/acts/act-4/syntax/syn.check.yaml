  explain:
    en: '{{रिक्तपाणिः राजानं न पश्येत्}}: doer, object, negative, verb.'
    hi: '{{रिक्तपाणिः राजानं न पश्येत्}}: कर्ता, कर्म, निषेध, क्रिया।'
  roman: after
  tokens:
  - रिक्तपाणिः
  - राजानम्
  - न
  - पश्येत्
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Verse puts words in the order of the metre; prose puts them in the order of sense. To find the {{अन्वयः}}: first
        split the joins (padaccheda); then find the verb; then its doer; then the object, and describing words next to the
        words they describe. {{रिक्तपाणिः राजानं भिषजं गुरुं न पश्येत्}}: who, whom, what, how.'
      hi: 'श्लोक शब्दों को छन्द के क्रम में रखता है; गद्य अर्थ के क्रम में। {{अन्वयः}} खोजने के लिए: पहले सन्धि खोलिए (पदच्छेद);
        फिर क्रिया खोजिए; फिर उसका कर्ता; फिर कर्म, और विशेषण उन शब्दों के पास जिनका वे वर्णन करते हैं। {{रिक्तपाणिः राजानं
        भिषजं गुरुं न पश्येत्}}: कौन, किसे, कैसे।'
    items:
    - id: i0
      sa: अन्वयः
    - id: i1
      sa: रिक्तपाणिः राजानं भिषजं गुरुं न पश्येत्

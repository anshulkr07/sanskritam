- id: p8
  kind: practice
  depth: core
  skills:
  - syn.relative
  mode: order
  prompt:
    en: 'Say what Vākyikā says: “Who reads, he knows.”'
    hi: 'वह कहिए जो वाक्यिका कहती है: ‘जो पढ़ता है, वह जानता है।’'
  explain:
    en: '{{यः पठति सः जानाति}}: her sentence, at last in order.'
    hi: '{{यः पठति सः जानाति}}: उसका वाक्य, आख़िरकार क्रम में।'
  roman: after
  gate: true
  story:
    success:
      en: “यः पठति, सः जानाति,” you say, and Vākyikā, the heavy little basalt spirit, rolls up her scroll, which has no end,
        and finds the end. She sets it down. “At last,” she says. “Who reads, he knows.” The thirty-two statues step down,
        one by one, into the light of the throne, and become thirty-two small figures standing together, no longer carved,
        and the throne, plain and warm, is only a seat. In the stone of its base, a long-sealed slab has slid aside, and in
        the dark space behind it lies a palm leaf, whole, glowing, the fifth.
      hi: “यः पठति, सः जानाति,” आप कहते हैं, और वाक्यिका, भारी नन्ही बेसाल्ट भूत, अपना पत्र लपेटती है, जिसका कोई अन्त नहीं
        था, और अन्त पा लेती है। वह उसे रख देती है। “आख़िर,” वह कहती है। “जो पढ़ता है, वह जानता है।” बत्तीसों प्रतिमाएँ एक-एक
        करके सिंहासन के प्रकाश में उतरती हैं, और बत्तीस नन्ही आकृतियाँ बन जाती हैं जो साथ खड़ी हैं, अब तराशी हुई नहीं, और
        सिंहासन, सादा और गरम, केवल एक आसन है। उसके आधार के पत्थर में, बहुत समय से बन्द एक पटिया सरक गई है, और पीछे के अँधेरे
        स्थान में एक ताड़पत्र पड़ा है, पूरा, चमकता, पाँचवाँ।

id: syn.check
template: check
title:
  en: Put the sentence in order
  hi: वाक्य को क्रम में रखिए
title_sa: परीक्षा
minutes: 6
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - syn.relative
  mode: choice
  prompt:
    en: “Who reads, he knows.” Which pair?
    hi: ‘जो पढ़ता है, वह जानता है।’ कौन-सी जोड़ी?
  explain:
    en: Masculine.
    hi: पुंलिंग।
  roman: after
  options:
  - sa: यत् … तत्
  - correct: true
    sa: यः … सः
  - sa: या … सा
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: यः पठति सः जानाति।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: Who reads, he knows.
        hi: जो पढ़ता है, वह जानता है।
      words:
      - sa: यः
        gloss:
          en: who
          hi: जो
      - sa: पठति
        gloss:
          en: reads
          hi: पढ़ता है
        check:
          type: tinanta
          dhatu: पठ्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
      - sa: सः
        gloss:
          en: he
          hi: वह
      - sa: जानाति
        gloss:
          en: knows
          hi: जानता है
        check:
          type: tinanta
          dhatu: ज्ञा
          lakara: Lat
          purusha: Prathama
          vacana: Eka
    - id: i1
      sa: यः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: who
        hi: जो
    - id: i2
      sa: पठति
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: reads
        hi: पढ़ता है
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
      feature:
        en: 'Root: {{पठ्}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{पठ्}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
      compare_from: पठ्
    - id: i3
      sa: सः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: he
        hi: वह
    - id: i4
      sa: जानाति
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: knows
        hi: जानता है
      check:
        type: tinanta
        dhatu: ज्ञा
        lakara: Lat
        purusha: Prathama
        vacana: Eka
      feature:
        en: 'Root: {{ज्ञा}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{ज्ञा}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
      compare_from: ज्ञा
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'A sentence with {{यः}} (who) is answered by {{सः}} (he): {{यः पठति सः जानाति}}, “who reads, he knows”. The pair
          agrees in gender and number, and either can stand in any case: {{यम्}} … {{तम्}}, {{येन}} … {{तेन}}, {{यस्य}} …
          {{तस्य}}. The {{यद्}}-half usually comes first.'
        hi: '{{यः}} (जो) वाले वाक्य का उत्तर {{सः}} (वह) देता है: {{यः पठति सः जानाति}}, ‘जो पढ़ता है, वह जानता है’। जोड़ी
          लिंग और वचन में मेल खाती है, और कोई भी किसी भी विभक्ति में आ सकता है: {{यम्}} … {{तम्}}, {{येन}} … {{तेन}}, {{यस्य}}
          … {{तस्य}}। {{यद्}}-भाग प्रायः पहले आता है।'
    - id: i7
      sa: यः पठति सः जानाति।
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: Who reads, he knows.
        hi: जो पढ़ता है, वह जानता है।
      words:
      - sa: यः
        gloss:
          en: who
          hi: जो
      - sa: पठति
        gloss:
          en: reads
          hi: पढ़ता है
        check:
          type: tinanta
          dhatu: पठ्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
      - sa: सः
        gloss:
          en: he
          hi: वह
      - sa: जानाति
        gloss:
          en: knows
          hi: जानता है
        check:
          type: tinanta
          dhatu: ज्ञा
          lakara: Lat
          purusha: Prathama
          vacana: Eka

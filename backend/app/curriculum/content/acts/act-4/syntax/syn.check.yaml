        gloss:
          en: Rāma
          hi: राम
        check:
          type: subanta
          stem: राम
          linga: Pum
          vibhakti: Saptami
          vacana: Eka
      - sa: गते
        gloss:
          en: having gone
          hi: जाने पर
        check:
          type: krdanta
          dhatu: गम्
          krt: kta
          linga: Pum
          vibhakti: Saptami
          vacana: Eka
      - sa: लक्ष्मणः
        gloss:
          en: Lakṣmaṇa
          hi: लक्ष्मण
        check:
          type: subanta
          stem: लक्ष्मण
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: आगच्छति
        gloss:
          en: comes
          hi: आता है
        check:
          type: tinanta
          dhatu: गम्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
          prefixes:
          - आ

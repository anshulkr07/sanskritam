- id: p3
  kind: practice
  depth: core
  skills:
  - syn.absolute
  mode: choice
  prompt:
    en: “The sun having risen.” Which words?
    hi: ‘सूर्य के उदित होने पर।’ कौन-से शब्द?
  explain:
    en: Both in the seventh case.
    hi: दोनों सप्तमी में।
  roman: after
  options:
  - sa: सूर्यः उदितः
  - correct: true
    sa: सूर्ये उदिते
  - sa: सूर्यं उदितम्
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: रामे गते लक्ष्मणः आगच्छति।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: Rāma having gone, Lakṣmaṇa comes.
        hi: राम के जाने पर लक्ष्मण आता है।
      words:
      - sa: रामे
        gloss:
          en: Rāma
          hi: राम
        check:
          type: subanta
          stem: राम
          linga: Pum
          vibhakti: Saptami
          vacana: Eka
      - sa: गते
        gloss:
          en: having gone
          hi: जाने पर
        check:
          type: krdanta
          dhatu: गम्
          krt: kta
          linga: Pum
          vibhakti: Saptami
          vacana: Eka
      - sa: लक्ष्मणः
        gloss:
          en: Lakṣmaṇa
          hi: लक्ष्मण
        check:
          type: subanta
          stem: लक्ष्मण
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: आगच्छति
        gloss:
          en: comes
          hi: आता है
        check:
          type: tinanta
          dhatu: गम्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
          prefixes:
          - आ
    - id: i1
      sa: रामे
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: Rāma
        hi: राम
      check:
        type: subanta
        stem: राम
        linga: Pum
        vibhakti: Saptami
        vacana: Eka
      feature:
        en: 'Stem: {{राम}} · masculine · {{सप्तमी}} · singular'
        hi: 'प्रातिपदिक: {{राम}} · {{पुंलिंग}} · {{सप्तमी}} · {{एकवचन}}'
      compare_from: राम
    - id: i2
      sa: गते
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: having gone
        hi: जाने पर
      check:
        type: krdanta
        dhatu: गम्
        krt: kta
        linga: Pum
        vibhakti: Saptami
        vacana: Eka
      feature:
        en: 'Root: {{गम्}} · masculine · {{सप्तमी}} · singular'
        hi: 'धातु: {{गम्}} · {{पुंलिंग}} · {{सप्तमी}} · {{एकवचन}}'
      compare_from: गम्
    - id: i3
      sa: लक्ष्मणः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: Lakṣmaṇa
        hi: लक्ष्मण
      check:
        type: subanta
        stem: लक्ष्मण
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{लक्ष्मण}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{लक्ष्मण}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
      compare_from: लक्ष्मण
    - id: i4
      sa: आगच्छति
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: comes
        hi: आता है
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
        prefixes:
        - आ
      feature:
        en: 'Root: {{गम्}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{गम्}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
      compare_from: गम्
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'A word and its participle, both in the seventh case, set the scene: {{सूर्ये उदिते}}, “the sun having risen”;
          {{रामे गते}}, “Rāma having gone”. If a present sense is meant, use {{शतृ}} or {{सति}}: {{बालके पठति}}, “while the
          boy reads”. This is {{सति सप्तमी}}, the absolute locative. The main clause has a different subject.'
        hi: 'एक शब्द और उसका कृदन्त, दोनों सप्तमी में, दृश्य रचते हैं: {{सूर्ये उदिते}}, ‘सूर्य के उदित होने पर’; {{रामे गते}},
          ‘राम के जाने पर’। वर्तमान का भाव हो तो {{शतृ}} या {{सति}} लीजिए: {{बालके पठति}}, ‘बालक के पढ़ते हुए’। यह {{सति सप्तमी}}
          है। मुख्य वाक्य का कर्ता अलग होता है।'

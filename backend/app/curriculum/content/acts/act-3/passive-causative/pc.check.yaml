- id: p3
  kind: practice
  depth: core
  skills:
  - verb.causative
  mode: choice
  prompt:
    en: “He teaches.” Which form?
    hi: ‘वह पढ़ाता है।’ कौन-सा रूप?
  explain:
    en: '{{पाठयति}}.'
    hi: '{{पाठयति}}।'
  roman: after
  options:
  - sa: पठति
  - sa: पठ्यते
  - correct: true
    sa: पाठयति
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: गुरुः बालकम् पाठम् पाठयति।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: The teacher makes the boy read the lesson.
        hi: गुरु बालक को पाठ पढ़ाता है।
      words:
      - sa: गुरुः
        gloss:
          en: the teacher
          hi: गुरु
        check:
          type: subanta
          stem: गुरु
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: बालकम्
        gloss:
          en: the boy
          hi: बालक को
        check:
          type: subanta
          stem: बालक
          linga: Pum
          vibhakti: Dvitiya
          vacana: Eka
      - sa: पाठम्
        gloss:
          en: the lesson
          hi: पाठ
        check:
          type: subanta
          stem: पाठ
          linga: Napumsaka
          vibhakti: Dvitiya
          vacana: Eka
      - sa: पाठयति
        gloss:
          en: makes read
          hi: पढ़ाता है
        check:
          type: tinanta
          dhatu: पठ्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
          sanadi:
          - Nic
    - id: i1
      sa: गुरुः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: the teacher
        hi: गुरु
      check:
        type: subanta
        stem: गुरु
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{गुरु}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{गुरु}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
    - id: i2
      sa: बालकम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: the boy
        hi: बालक को
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Dvitiya
        vacana: Eka
      feature:
        en: 'Stem: {{बालक}} · masculine · {{द्वितीया}} · singular'
        hi: 'प्रातिपदिक: {{बालक}} · {{पुंलिंग}} · {{द्वितीया}} · {{एकवचन}}'
    - id: i3
      sa: पाठम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: the lesson
        hi: पाठ
      check:
        type: subanta
        stem: पाठ
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Eka
      feature:
        en: 'Stem: {{पाठ}} · neuter · {{द्वितीया}} · singular'
        hi: 'प्रातिपदिक: {{पाठ}} · {{नपुंसकलिंग}} · {{द्वितीया}} · {{एकवचन}}'
    - id: i4
      sa: पाठयति
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: makes read
        hi: पढ़ाता है
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
        sanadi:
        - Nic
      feature:
        en: 'Root: {{पठ्}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{पठ्}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'The causative adds {{-अय-}} after a strengthened root and means “makes do”: {{पठ्}} gives {{पाठयति}} (makes read,
          teaches), {{कृ}} gives {{कारयति}} (makes do), {{भुज्}} gives {{भोजयति}} (feeds), {{गम्}} gives {{गमयति}} (sends).
          The one made to act goes in the second case.'
        hi: 'प्रेरणार्थक रूप दृढ़ किए हुए धातु के बाद {{-अय-}} जोड़ता है और ‘करवाता है’ का अर्थ देता है: {{पठ्}} से {{पाठयति}}
          (पढ़वाता है, पढ़ाता है), {{कृ}} से {{कारयति}} (करवाता है), {{भुज्}} से {{भोजयति}} (खिलाता है), {{गम्}} से {{गमयति}}
          (भेजता है)। जिससे कराया जाए, वह द्वितीया में जाता है।'
    - id: i7
      sa: गुरुः बालकम् पाठम् पाठयति।
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: The teacher makes the boy read the lesson.
        hi: गुरु बालक को पाठ पढ़ाता है।
      words:
      - sa: गुरुः
        gloss:
          en: the teacher
          hi: गुरु
        check:
          type: subanta
          stem: गुरु
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: बालकम्
        gloss:
          en: the boy
          hi: बालक को
        check:
          type: subanta
          stem: बालक
          linga: Pum
          vibhakti: Dvitiya
          vacana: Eka
      - sa: पाठम्
        gloss:
          en: the lesson
          hi: पाठ
        check:
          type: subanta
          stem: पाठ
          linga: Napumsaka
          vibhakti: Dvitiya
          vacana: Eka
      - sa: पाठयति
        gloss:
          en: makes read
          hi: पढ़ाता है
        check:
          type: tinanta
          dhatu: पठ्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
          sanadi:
          - Nic

  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - verb.passive
  mode: choice
  prompt:
    en: “It is read.” Which form?
    hi: ‘वह पढ़ा जाता है।’ कौन-सा रूप?
  explain:
    en: '{{पठ्यते}}.'
    hi: '{{पठ्यते}}।'
  roman: after
  options:
  - sa: पठति
  - correct: true
    sa: पठ्यते
  - sa: पाठयति
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: रामेण पुस्तकम् पठ्यते।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: The book is read by Rāma.
        hi: पुस्तक राम द्वारा पढ़ी जाती है।
      words:
      - sa: रामेण
        gloss:
          en: by Rāma
          hi: राम द्वारा
        check:
          type: subanta
          stem: राम
          linga: Pum
          vibhakti: Trtiya
          vacana: Eka
      - sa: पुस्तकम्
        gloss:
          en: the book
          hi: पुस्तक
        check:
          type: subanta
          stem: पुस्तक
          linga: Napumsaka
          vibhakti: Prathama
          vacana: Eka
      - sa: पठ्यते
        gloss:
          en: is read
          hi: पढ़ी जाती है
        check:
          type: tinanta
          dhatu: पठ्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
          prayoga: Karmani
    - id: i1
      sa: रामेण
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: by Rāma
        hi: राम द्वारा
      check:
        type: subanta
        stem: राम
        linga: Pum
        vibhakti: Trtiya
        vacana: Eka
      feature:
        en: 'Stem: {{राम}} · masculine · {{तृतीया}} · singular'
        hi: 'प्रातिपदिक: {{राम}} · {{पुंलिंग}} · {{तृतीया}} · {{एकवचन}}'
    - id: i2
      sa: पुस्तकम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: the book
        hi: पुस्तक
      check:
        type: subanta
        stem: पुस्तक
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{पुस्तक}} · neuter · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{पुस्तक}} · {{नपुंसकलिंग}} · {{प्रथमा}} · {{एकवचन}}'
    - id: i3
      sa: पठ्यते
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: is read
        hi: पढ़ी जाती है
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
        prayoga: Karmani
      feature:
        en: 'Root: {{पठ्}} · singular · {{लट्}} · {{कर्मणि}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{पठ्}} · {{एकवचन}} · {{लट्}} · {{कर्मणि}} · प्रथमपुरुष'
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'Active: {{रामः पुस्तकं पठति}}, Rāma reads the book. Passive: {{रामेण पुस्तकं पठ्यते}}, the book is read by Rāma.
          The doer goes into the third case, the object becomes the subject, and the verb takes {{-य-}} and the endings for
          oneself: {{पठ्}} gives {{पठ्यते}}.'
        hi: 'कर्तृवाच्य: {{रामः पुस्तकं पठति}}, राम पुस्तक पढ़ता है। कर्मवाच्य: {{रामेण पुस्तकं पठ्यते}}, पुस्तक राम द्वारा
          पढ़ी जाती है। कर्ता तृतीया में जाता है, कर्म उद्देश्य बन जाता है, और क्रिया {{-य-}} तथा अपने लिए वाले प्रत्यय लेती
          है: {{पठ्}} से {{पठ्यते}}।'
    - id: i6
      sa: रामेण पुस्तकम् पठ्यते।
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: The book is read by Rāma.
        hi: पुस्तक राम द्वारा पढ़ी जाती है।
      words:
      - sa: रामेण
        gloss:
          en: by Rāma
          hi: राम द्वारा
        check:
          type: subanta
          stem: राम
          linga: Pum
          vibhakti: Trtiya
          vacana: Eka
      - sa: पुस्तकम्
        gloss:
          en: the book
          hi: पुस्तक
        check:
          type: subanta
          stem: पुस्तक
          linga: Napumsaka
          vibhakti: Prathama
          vacana: Eka
      - sa: पठ्यते
        gloss:
          en: is read
          hi: पढ़ी जाती है
        check:
          type: tinanta
          dhatu: पठ्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
          prayoga: Karmani

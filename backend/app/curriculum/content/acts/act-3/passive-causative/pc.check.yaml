- id: p7
  kind: practice
  depth: core
  skills:
  - verb.passive
  - verb.causative
  - verb.desiderative
  mode: order
  prompt:
    en: 'Complete the pusher: “It is read; he makes read; he wants to read.”'
    hi: 'प्रेरक को पूरा कीजिए: ‘वह पढ़ा जाता है; वह पढ़वाता है; वह पढ़ना चाहता है।’'
  explain:
    en: '{{पठ्यते पाठयति पिपठिषति}}: one root, three forms.'
    hi: '{{पठ्यते पाठयति पिपठिषति}}: एक धातु, तीन रूप।'
  roman: after
  gate: true
  story:
    success:
      en: '“पठ्यते, पाठयति, पिपठिषति,” you say, and Preraka claps all twelve hands. Every small hand opens and lets go: the
        book, the spoon, the cup, the path. “It was read, I read, I wanted to read,” he says, jumbling it all in his delight.
        “गत्वा!” he cries suddenly, springing back: “Having gone! गन्तुम्! To go! गतः! Gone!” He streaks off into the dark
        with the rose light behind him, shouting the three words over and over, and the trees take them up.'
      hi: '“पठ्यते, पाठयति, पिपठिषति,” आप कहते हैं, और प्रेरक बारहों हाथों से ताली बजाता है। हर नन्हा हाथ खुलकर छोड़ देता
        है: पुस्तक, चम्मच, प्याला, राह। “पढ़ी गई, मैंने पढ़वाई, मैं पढ़ना चाहता था,” वह आनन्द में सब गड्डमड्ड कर देता है।
        “गत्वा!” वह अचानक पीछे उछलकर चिल्लाता है: “जाकर! गन्तुम्! जाने के लिए! गतः! गया हुआ!” वह गुलाबी रोशनी पीछे छोड़ता
        अँधेरे में दौड़ जाता है, तीनों शब्द बार-बार चिल्लाता हुआ, और वृक्ष उन्हें दोहराने लगते हैं।'
    failure:
      en: 'A hand still holds on. The three: {{पठ्यते पाठयति पिपठिषति}}.'
      hi: 'एक हाथ अब भी पकड़े है। तीनों: {{पठ्यते पाठयति पिपठिषति}}।'

  prompt:
    en: “He wants to drink.” Which form?
    hi: ‘वह पीना चाहता है।’ कौन-सा रूप?
  explain:
    en: '{{पिपासति}}.'
    hi: '{{पिपासति}}।'
  roman: after
  options:
  - sa: पिबति
  - correct: true
    sa: पिपासति
  - sa: पाययति
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'The desiderative doubles the root and adds {{-स-}} (with {{-इ-}} before it for many roots): {{पा}} gives {{पिपासति}}
        (wants to drink), {{पठ्}} gives {{पिपठिषति}} (wants to read), {{गम्}} gives {{जिगमिषति}} (wants to go), {{भू}} gives
        {{बुभूषति}} (wants to be). It is called {{सन्}}.'
      hi: 'इच्छार्थक रूप धातु को दुगुना करता है और {{-स-}} जोड़ता है (अनेक धातुओं में उससे पहले {{-इ-}}): {{पा}} से {{पिपासति}}
        (पीना चाहता है), {{पठ्}} से {{पिपठिषति}} (पढ़ना चाहता है), {{गम्}} से {{जिगमिषति}} (जाना चाहता है), {{भू}} से {{बुभूषति}}
        (होना चाहता है)। इसे {{सन्}} कहते हैं।'

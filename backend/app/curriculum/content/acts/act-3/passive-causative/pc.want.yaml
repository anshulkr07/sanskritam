- id: p5
  kind: practice
  title:
    en: Wanting to know
    hi: जानना चाहता है
  depth: core
  skills:
  - verb.desiderative
  mode: choice
  prompt:
    en: “He wants to know.” Which form?
    hi: ‘वह जानना चाहता है।’ कौन-सा रूप?
  explain:
    en: '{{जिज्ञासते}}: {{ज्ञा}} + {{सन्}}.'
    hi: '{{जिज्ञासते}}: {{ज्ञा}} + {{सन्}}।'
  roman: after
  gate: true
  story:
    success:
      en: “जिज्ञासते,” you say, and the twelfth hand, the one with the cup, trembles. Water wells up in the cup, slowly, from nowhere, and spills a single drop that glows. “It wanted,” the pusher says, in a small voice, “and wanting was enough.” He drinks. The Vetāla puts both hands over his mouth to hide a smile.
      hi: “जिज्ञासते,” आप कहते हैं, और बारहवाँ हाथ, जिसमें प्याला है, काँपता है। प्याले में पानी धीरे-धीरे कहीं से भर आता है और एक बूँद छलकती है जो चमकती है। “उसने चाहा,” प्रेरक छोटी आवाज़ में कहता है, “और चाहना ही काफ़ी था।” वह पी लेता है। वेताल अपने दोनों हाथ मुँह पर रखकर मुस्कान छिपाता है।
    failure:
      en: 'The cup stays dry. “He wants to know”: {{जिज्ञासते}}.'
      hi: 'प्याला सूखा रहता है। ‘वह जानना चाहता है’: {{जिज्ञासते}}।'
  options:
  - sa: जानाति
  - sa: ज्ञायते
  - correct: true
    sa: जिज्ञासते
- id: pn
  kind: teach
  title:
    en: Pāṇini's wanting
    hi: पाणिनि की इच्छा
  depth: panini
  skills:
  - verb.desiderative
  sutras:
  - 3.1.7
  - 6.1.9
  - 7.4.58
  - 7.2.35
  body:
    en: 'Sūtra 3.1.7, {{धातोः कर्मणः समानकर्तृकादिच्छायां वा}}, gives {{सन्}} to a root when the same person wants to do the action. 6.1.9, {{सन्यङोः}}, orders the doubling, and 7.4.58, {{अत्र लोपोऽभ्यासस्य}}, shortens the first half. 7.2.35 adds the {{इ}}: {{पिपठिषति}}.'
    hi: 'सूत्र 3.1.7, {{धातोः कर्मणः समानकर्तृकादिच्छायां वा}}, धातु को {{सन्}} देता है जब वही व्यक्ति काम करना चाहे। 6.1.9, {{सन्यङोः}}, द्वित्व का आदेश देता है, और 7.4.58, {{अत्र लोपोऽभ्यासस्य}}, पहले भाग को छोटा करता है। 7.2.35 {{इ}} जोड़ता है: {{पिपठिषति}}।'

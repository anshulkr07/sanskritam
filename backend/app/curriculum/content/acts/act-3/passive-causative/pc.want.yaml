  prompt:
    en: “He wants to know.” Which form?
    hi: ‘वह जानना चाहता है।’ कौन-सा रूप?
  explain:
    en: '{{जिज्ञासते}}: {{ज्ञा}} + {{सन्}}.'
    hi: '{{जिज्ञासते}}: {{ज्ञा}} + {{सन्}}।'
  roman: after
  gate: true
  story:
    success:
      en: “जिज्ञासते,” you say, and the twelfth hand, the one with the cup, trembles. Water wells up in the cup, slowly, from
        nowhere, and spills a single drop that glows. “It wanted,” the pusher says, in a small voice, “and wanting was enough.”
        He drinks. The Vetāla puts both hands over his mouth to hide a smile.
      hi: “जिज्ञासते,” आप कहते हैं, और बारहवाँ हाथ, जिसमें प्याला है, काँपता है। प्याले में पानी धीरे-धीरे कहीं से भर आता
        है और एक बूँद छलकती है जो चमकती है। “उसने चाहा,” प्रेरक छोटी आवाज़ में कहता है, “और चाहना ही काफ़ी था।” वह पी लेता
        है। वेताल अपने दोनों हाथ मुँह पर रखकर मुस्कान छिपाता है।
    failure:
      en: 'The cup stays dry. “He wants to know”: {{जिज्ञासते}}.'
      hi: 'प्याला सूखा रहता है। ‘वह जानना चाहता है’: {{जिज्ञासते}}।'

- id: s1
  kind: story
  title:
    en: The last hand
    hi: अन्तिम हाथ
  depth: core
  image:
    brief: The twelfth tiny hand of the rose-mist spirit holding out a small clay cup, empty and very still; Śuka tilting
      his head; Dādī nodding; the Vetāla watching with half-closed eyes.
    alt:
      en: A tiny hand holds out an empty clay cup very still while a parrot tilts his head
      hi: नन्हा हाथ ख़ाली मिट्टी का प्याला स्थिर बढ़ाए, सिर टेढ़ा करता तोता
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - preraka
    place: smashana
    ratio: '4:3'
    id: pc-want-s1
  narration:
    en: 'The twelfth hand has a clay cup, and it is empty. It holds it out, very still. “पिपासति,” says the Vetāla. “He wants
      to drink.” “It is not drinking,” Śuka says. “It is wanting to.” Dādī nods: “That is the third form: neither ‘he does’,
      nor ‘he is made to’, but ‘he wants to’. The root doubles, and an स comes after it.”'
    hi: 'बारहवें हाथ में मिट्टी का प्याला है, और वह ख़ाली है। वह उसे बहुत स्थिर पकड़े हुए बढ़ाता है। “पिपासति,” वेताल कहता
      है। “वह पीना चाहता है।” “यह पी नहीं रहा,” शुक कहता है। “यह चाह रहा है।” दादी सिर हिलाती हैं: “यह तीसरा रूप है: न ‘वह
      करता है’, न ‘उससे करवाया जाता है’, बल्कि ‘वह करना चाहता है’। धातु दुगुनी होती है, और उसके बाद एक स आता है।”'
  lines:
  - speaker: vetala
    sa: पिपासति
    gloss:
      en: He wants to drink.
      hi: वह पीना चाहता है।
    check:
      type: tinanta
      dhatu: पा
      lakara: Lat
      purusha: Prathama
      vacana: Eka
      sanadi:
      - San
- id: t1
  kind: teach
  title:
    en: Wanting to
    hi: चाहना
  depth: core
  skills:
  - verb.desiderative
  body:
    en: 'The desiderative doubles the root and adds {{-स-}} (with {{-इ-}} before it for many roots): {{पा}} gives {{पिपासति}}
      (wants to drink), {{पठ्}} gives {{पिपठिषति}} (wants to read), {{गम्}} gives {{जिगमिषति}} (wants to go), {{भू}} gives
      {{बुभूषति}} (wants to be). It is called {{सन्}}.'
    hi: 'इच्छार्थक रूप धातु को दुगुना करता है और {{-स-}} जोड़ता है (अनेक धातुओं में उससे पहले {{-इ-}}): {{पा}} से {{पिपासति}}
      (पीना चाहता है), {{पठ्}} से {{पिपठिषति}} (पढ़ना चाहता है), {{गम्}} से {{जिगमिषति}} (जाना चाहता है), {{भू}} से {{बुभूषति}}
      (होना चाहता है)। इसे {{सन्}} कहते हैं।'
  term:
    sa: सन्नन्तम्
    meaning:
      en: the desiderative stem
      hi: इच्छार्थक अंग
  visuals:
  - id: v-scene-desire
    kind: comparison
    title:
      en: Wanting and doing
      hi: चाहना और करना
    explanation:
      en: The desire form expresses wanting. By itself it does not tell us that the desired action takes place.
      hi: इच्छार्थक रूप चाहना बताता है। केवल इस रूप से यह नहीं कहा जाता कि चाहा गया काम हो रहा है।
    items:

    hi: अन्तिम हाथ
  depth: core
  image:
    brief: The twelfth tiny hand of the rose-mist spirit holding out a small clay cup, empty and very still; Śuka tilting his head; Dādī nodding; the Vetāla watching with half-closed eyes.
    alt:
      en: A tiny hand holds out an empty clay cup very still while a parrot tilts his head
      hi: नन्हा हाथ ख़ाली मिट्टी का प्याला स्थिर बढ़ाए, सिर टेढ़ा करता तोता

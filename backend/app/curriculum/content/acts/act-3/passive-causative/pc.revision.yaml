- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: verb.passive
    rule:
      en: '{{लः कर्मणि च भावे चाकर्मकेभ्यः}}, {{सार्वधातुके यक्}}, {{भावकर्मणोः}}: the passive.'
      hi: '{{लः कर्मणि च भावे चाकर्मकेभ्यः}}, {{सार्वधातुके यक्}}, {{भावकर्मणोः}}: कर्मवाच्य।'
    sutras:
    - 3.4.69
    - 3.1.67
    - 1.3.13
    tag: core
    taught_in: pc.passive#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 3.4.69, {{लः कर्मणि च भावे चाकर्मकेभ्यः}}, says the verb endings can state the object, or the action itself
          for roots with no object. 3.1.67, {{सार्वधातुके यक्}}, adds {{यक्}}; and 1.3.13, {{भावकर्मणोः}}, gives the endings
          for oneself: {{पठ्यते}}.'
        hi: 'सूत्र 3.4.69, {{लः कर्मणि च भावे चाकर्मकेभ्यः}}, कहता है कि क्रिया-प्रत्यय कर्म को कह सकते हैं, या बिना कर्म
          वाली धातुओं में क्रिया को ही। 3.1.67, {{सार्वधातुके यक्}}, {{यक्}} जोड़ता है; और 1.3.13, {{भावकर्मणोः}}, अपने लिए
          वाले प्रत्यय देता है: {{पठ्यते}}।'
      items:
      - id: i0
        sa: लः कर्मणि च भावे चाकर्मकेभ्यः
      - id: i1
        sa: सार्वधातुके यक्
      - id: i2
        sa: यक्
      - id: i3
        sa: भावकर्मणोः
      - id: i4
        sa: पठ्यते
  - skill: verb.causative
    rule:
      en: '{{हेतुमति च}} and {{अचो ञ्णिति}}: the causative.'
      hi: '{{हेतुमति च}} और {{अचो ञ्णिति}}: प्रेरणार्थक।'
    sutras:
    - 3.1.26
    - 7.2.115
    tag: core
    taught_in: pc.cause#pn
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 3.1.26, {{हेतुमति च}}, adds {{णिच्}} when someone gets the action done. 7.2.115, {{अचो ञ्णिति}}, lengthens
          the root''s vowel before it: {{पठ्}} becomes {{पाठ्}}. 3.1.32, {{सनाद्यन्ता धातवः}}, says the new stem is itself
          a root: {{पाठयति}}.'
        hi: 'सूत्र 3.1.26, {{हेतुमति च}}, जब कोई क्रिया करवाए तब {{णिच्}} जोड़ता है। 7.2.115, {{अचो ञ्णिति}}, उससे पहले धातु
          का स्वर दीर्घ करता है: {{पठ्}} से {{पाठ्}}। 3.1.32, {{सनाद्यन्ता धातवः}}, कहता है कि नया अंग स्वयं एक धातु है: {{पाठयति}}।'
      items:
      - id: i0
        sa: हेतुमति च
      - id: i1
        sa: णिच्
      - id: i2
        sa: अचो ञ्णिति
      - id: i3
        sa: पठ्
      - id: i4
        sa: पाठ्
      - id: i5
        sa: सनाद्यन्ता धातवः
      - id: i6
        sa: पाठयति
  - skill: verb.desiderative
    rule:
      en: '{{धातोः कर्मणः समानकर्तृकादिच्छायां वा}}: the desiderative.'
      hi: '{{धातोः कर्मणः समानकर्तृकादिच्छायां वा}}: इच्छार्थक।'
    sutras:

        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: 'The causative adds {{-अय-}} after a strengthened root and means “makes do”: {{पठ्}} gives {{पाठयति}} (makes
            read, teaches), {{कृ}} gives {{कारयति}} (makes do), {{भुज्}} gives {{भोजयति}} (feeds), {{गम्}} gives {{गमयति}}
            (sends). The one made to act goes in the second case.'
          hi: 'प्रेरणार्थक रूप दृढ़ किए हुए धातु के बाद {{-अय-}} जोड़ता है और ‘करवाता है’ का अर्थ देता है: {{पठ्}} से {{पाठयति}}
            (पढ़वाता है, पढ़ाता है), {{कृ}} से {{कारयति}} (करवाता है), {{भुज्}} से {{भोजयति}} (खिलाता है), {{गम्}} से {{गमयति}}
            (भेजता है)। जिससे कराया जाए, वह द्वितीया में जाता है।'
      - id: i7
        sa: गुरुः बालकम् पाठम् पाठयति।
        label:
          en: Read it again with the meaning
          hi: अर्थ समझकर फिर पढ़ें
        meaning:

  - skill: verb.desiderative
    rule:
      en: 'A few desideratives change the root: {{दा}} gives {{दित्सति}}, {{हन्}} gives {{जिघांसति}}, {{पा}} gives {{पिपासति}}.'
      hi: 'कुछ इच्छार्थक में धातु बदलती है: {{दा}} से {{दित्सति}}, {{हन्}} से {{जिघांसति}}, {{पा}} से {{पिपासति}}।'
    example:

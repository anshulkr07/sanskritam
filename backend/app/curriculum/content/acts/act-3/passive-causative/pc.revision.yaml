    tag: core
    taught_in: pc.want#pn
    visuals:
    - id: v-linked-2
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 3.1.7, {{धातोः कर्मणः समानकर्तृकादिच्छायां वा}}, gives {{सन्}} to a root when the same person wants to
          do the action. 6.1.9, {{सन्यङोः}}, orders the doubling, and 7.4.58, {{अत्र लोपोऽभ्यासस्य}}, shortens the first half.
          7.2.35 adds the {{इ}}: {{पिपठिषति}}.'
        hi: 'सूत्र 3.1.7, {{धातोः कर्मणः समानकर्तृकादिच्छायां वा}}, धातु को {{सन्}} देता है जब वही व्यक्ति काम करना चाहे।
          6.1.9, {{सन्यङोः}}, द्वित्व का आदेश देता है, और 7.4.58, {{अत्र लोपोऽभ्यासस्य}}, पहले भाग को छोटा करता है। 7.2.35
          {{इ}} जोड़ता है: {{पिपठिषति}}।'
      items:
      - id: i0
        sa: धातोः कर्मणः समानकर्तृकादिच्छायां वा
      - id: i1
        sa: सन्
      - id: i2
        sa: सन्यङोः
      - id: i3
        sa: अत्र लोपोऽभ्यासस्य
      - id: i4
        sa: इ
      - id: i5
        sa: पिपठिषति

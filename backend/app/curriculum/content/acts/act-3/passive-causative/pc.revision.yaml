- id: mistakes
  kind: revision
  title:
    en: Common mistakes
    hi: आम भूलें
  depth: core
  section: mistakes
  rows:
  - skill: verb.passive
    rule:
      en: 'Do not leave the doer in the first case: {{रामेण पठ्यते}}, not {{रामः पठ्यते}}.'
      hi: 'कर्ता को प्रथमा में मत छोड़िए: {{रामेण पठ्यते}}, {{रामः पठ्यते}} नहीं।'
    tag: core
    taught_in: pc.passive#p1
  - skill: verb.causative
    rule:
      en: Do not confuse {{पाठयति}} (teaches) with {{पठति}} (reads).
      hi: '{{पाठयति}} (पढ़ाता है) और {{पठति}} (पढ़ता है) को मत मिलाइए।'
    tag: core
    taught_in: pc.cause#p1
- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: verb.passive
    rule:
      en: '{{लः कर्मणि च भावे चाकर्मकेभ्यः}}, {{सार्वधातुके यक्}}, {{भावकर्मणोः}}: the passive.'
      hi: '{{लः कर्मणि च भावे चाकर्मकेभ्यः}}, {{सार्वधातुके यक्}}, {{भावकर्मणोः}}: कर्मवाच्य।'
    sutras:
    - 3.4.69
    - 3.1.67
    - 1.3.13
    tag: core
    taught_in: pc.passive#pn
  - skill: verb.causative
    rule:
      en: '{{हेतुमति च}} and {{अचो ञ्णिति}}: the causative.'
      hi: '{{हेतुमति च}} और {{अचो ञ्णिति}}: प्रेरणार्थक।'
    sutras:
    - 3.1.26
    - 7.2.115
    tag: core
    taught_in: pc.cause#pn
  - skill: verb.desiderative
    rule:
      en: '{{धातोः कर्मणः समानकर्तृकादिच्छायां वा}}: the desiderative.'
      hi: '{{धातोः कर्मणः समानकर्तृकादिच्छायां वा}}: इच्छार्थक।'
    sutras:
    - 3.1.7
    tag: core
    taught_in: pc.want#pn

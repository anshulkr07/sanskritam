  rows:
  - skill: verb.passive
    rule:
      en: Use the passive when the thing done matters more than who did it.
      hi: जब किया गया कार्य करने वाले से अधिक महत्त्वपूर्ण हो, तब कर्मवाच्य।
    tag: good
    taught_in: pc.passive#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: One event, two descriptions
        hi: एक घटना के दो वर्णन
      explanation:
        en: The boy eats in both pictures. In the passive description, फलम् agrees with खाद्यते; बालकेन identifies the actual
          eater.
        hi: दोनों चित्रों में खाने वाला बालक ही है। कर्मवाच्य में फलम् का खाद्यते से अन्वय है; बालकेन वास्तविक खाने वाले को
          बताता है।
      items:
      - id: i0
        sa: बालकः फलम् खादति।
        meaning:
          en: The boy eats a fruit.
          hi: बालक फल खाता है।
        words:
        - sa: बालकः
          gloss:
            en: boy
            hi: बालक
          check:
            type: subanta
            stem: बालक
            linga: Pum
            vibhakti: Prathama
            vacana: Eka
        - sa: फलम्
          gloss:
            en: fruit (object)
            hi: फल (कर्म)
          check:
            type: subanta
            stem: फल
            linga: Napumsaka
            vibhakti: Dvitiya
            vacana: Eka
        - sa: खादति
          gloss:
            en: eats
            hi: खाता है
          check:
            type: tinanta
            dhatu: खाद्
            lakara: Lat
            purusha: Prathama
            vacana: Eka
        image:
          id: teaching-boy-eats
          brief: 'Use case: scientific-educational. One 4:3 landscape Sanskrit teaching illustration. Refined Indian watercolor
            and restrained gouache on warm ivory paper, quiet ochre, sage and muted indigo. Exactly one complete person, compact
            central grouping readable at 320px phone width, very simple quiet courtyard background. No other people, reflections,
            letterlike decoration, border or watermark. A school-age boy in an ochre kurta is eating one ripe yellow mango,
            holding it near his mouth and taking a visible bite. He is seated, empty other hand on his knee. Exactly one fruit,
            no plate of additional food, no writing or symbols. The eating action must be unmistakable.'
          alt: &id001
            en: A boy eats one mango
            hi: एक आम खाता बालक
          ratio: '4:3'
          text_in_image: &id002 []

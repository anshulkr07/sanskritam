    rule:
      en: '{{लः कर्मणि च भावे चाकर्मकेभ्यः}}, {{सार्वधातुके यक्}}, {{भावकर्मणोः}}: the passive.'
      hi: '{{लः कर्मणि च भावे चाकर्मकेभ्यः}}, {{सार्वधातुके यक्}}, {{भावकर्मणोः}}: कर्मवाच्य।'
    sutras:
    - 3.4.69
    - 3.1.67
    - 1.3.13
    tag: core
    taught_in: pc.passive#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 3.4.69, {{लः कर्मणि च भावे चाकर्मकेभ्यः}}, says the verb endings can state the object, or the action itself
          for roots with no object. 3.1.67, {{सार्वधातुके यक्}}, adds {{यक्}}; and 1.3.13, {{भावकर्मणोः}}, gives the endings
          for oneself: {{पठ्यते}}.'
        hi: 'सूत्र 3.4.69, {{लः कर्मणि च भावे चाकर्मकेभ्यः}}, कहता है कि क्रिया-प्रत्यय कर्म को कह सकते हैं, या बिना कर्म
          वाली धातुओं में क्रिया को ही। 3.1.67, {{सार्वधातुके यक्}}, {{यक्}} जोड़ता है; और 1.3.13, {{भावकर्मणोः}}, अपने लिए
          वाले प्रत्यय देता है: {{पठ्यते}}।'
      items:
      - id: i0
        sa: लः कर्मणि च भावे चाकर्मकेभ्यः
      - id: i1
        sa: सार्वधातुके यक्

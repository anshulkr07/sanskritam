- id: s1
  kind: story
  title:
    en: The eleventh night
    hi: ग्यारहवीं रात
  depth: core
  image:
    brief: 'A small round spirit of warm rose-coloured mist with a dozen tiny hands, like a starfish, bustling in: one hand
      pushing a book towards you, one a spoon, one setting a foot on a path; the Vetāla seated on a root beginning a tale
      with a raised finger; Dādī and Śuka watching.'
    alt:
      en: A rose-coloured spirit with a dozen tiny hands pushes a book, a spoon and a path towards a child
      hi: गुलाबी भूत दर्जन भर हाथों से बच्चे की ओर पुस्तक, चम्मच और राह धकेलता
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - preraka
    place: smashana
    ratio: '4:3'
    id: pc-passive-s1
  narration:
    en: 'Tonight the Vetāla tells a tale in which things happen to people. “राजन्, श्रूयताम्,” he begins. “Let it be heard.”
      A small rose-mist spirit with a dozen tiny hands pushes a book towards you, a spoon to your lips, a foot on a path.
      “It is done,” Dādī says. “Not ‘he does’: ‘it is done by him’. That is the passive.”'
    hi: 'आज वेताल एक कथा सुनाता है जिसमें लोगों पर बातें घटती हैं। “राजन्, श्रूयताम्,” वह राजा से कहे जाने वाले स्वर में शुरू
      करता है। “सुनी जाए।” गुलाबी धुंध का एक नन्हा भूत, दर्जन भर नन्हे हाथों वाला, प्रकट होकर आपकी ओर एक पुस्तक धकेलता है,
      होंठों की ओर एक चम्मच, राह पर एक पैर। “किया जाता है,” दादी कहती हैं। “‘वह करता है’ नहीं: ‘उसके द्वारा किया जाता है’।
      यही कर्मवाच्य है।”'
  lines:
  - speaker: dadi
    sa: पठ्यते। क्रियते।
    gloss:
      en: It is read. It is done.
      hi: वह पढ़ा जाता है। वह किया जाता है।
  quote:
    sa: राजन् श्रूयताम् तावत् कथाम् एकां कथयामि
    gloss:
      en: 'O king, let it be heard: I tell one tale.'
      hi: 'हे राजन्, सुनिए: मैं एक कथा कहता हूँ।'
    source: Vetālapañcaviṃśatikā, introduction (read in the Digital Corpus of Sanskrit)
- id: t1
  kind: teach
  title:
    en: By and is
    hi: ‘द्वारा’ और ‘जाता है’
  depth: core
  skills:
  - verb.passive
  body:
    en: 'Active: {{रामः पुस्तकं पठति}}, Rāma reads the book. Passive: {{रामेण पुस्तकं पठ्यते}}, the book is read by Rāma.
      The doer goes into the third case, the object becomes the subject, and the verb takes {{-य-}} and the endings for oneself:
      {{पठ्}} gives {{पठ्यते}}.'
    hi: 'कर्तृवाच्य: {{रामः पुस्तकं पठति}}, राम पुस्तक पढ़ता है। कर्मवाच्य: {{रामेण पुस्तकं पठ्यते}}, पुस्तक राम द्वारा पढ़ी
      जाती है। कर्ता तृतीया में जाता है, कर्म उद्देश्य बन जाता है, और क्रिया {{-य-}} तथा अपने लिए वाले प्रत्यय लेती है: {{पठ्}}
      से {{पठ्यते}}।'

- id: p5
  kind: practice
  title:
    en: It is given
    hi: दिया जाता है
  depth: core
  skills:
  - verb.passive
  mode: choice
  prompt:
    en: “It is given.” Which passive of {{दा}}?
    hi: ‘वह दिया जाता है।’ {{दा}} का कौन-सा कर्मवाच्य?
  explain:
    en: '{{दीयते}}: {{दा}} → {{दी-}} + {{-यते}}.'
    hi: '{{दीयते}}: {{दा}} → {{दी-}} + {{-यते}}।'
  roman: after
  gate: true
  story:
    success:
      en: “दीयते,” you say, and one of the pusher's twelve tiny hands lets go of what it holds. A fruit rolls gently across
        the ground towards you. “It is given,” he says in a rosy voice, “and I did not give it. It simply was given.” He looks
        at his other eleven hands with great interest, as if he had never counted them.
      hi: “दीयते,” आप कहते हैं, और प्रेरक के बारह नन्हे हाथों में से एक अपनी पकड़ छोड़ देता है। एक फल हल्के से ज़मीन पर लुढ़कता
        आपकी ओर आता है। “दिया जाता है,” वह गुलाबी आवाज़ में कहता है, “और मैंने नहीं दिया। वह बस दिया गया।” वह अपने बाक़ी ग्यारह
        हाथों को बड़ी रुचि से देखता है, मानो उन्हें कभी गिना ही न हो।
    failure:
      en: 'The hand keeps hold. “It is given”: {{दीयते}}.'
      hi: 'हाथ पकड़े रहता है। ‘दिया जाता है’: {{दीयते}}।'

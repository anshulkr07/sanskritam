    hi: '{{दर्शयति}}: {{दृश्}} + {{-अय-}}।'
  roman: after
  gate: true
  story:
    success:
      en: '“दर्शयति,” you say, and the pusher''s hand that was holding a path up to the dark spreads its fingers, and the dark opens: a long lane of old trees, a lamp at the far end, someone small waiting under it. “It shows,” says the Vetāla softly, “what it wants you to see.”'
      hi: '“दर्शयति,” आप कहते हैं, और प्रेरक का जो हाथ अँधेरे की ओर राह थामे था, वह उँगलियाँ फैला देता है, और अँधेरा खुल जाता है: पुराने वृक्षों की लम्बी गली, उसके दूर के छोर पर दीपक, और उसके नीचे प्रतीक्षा करता कोई नन्हा। “वह दिखाता है,” वेताल धीमे से कहता है, “जो वह आपको दिखाना चाहता है।”'
    failure:
      en: 'The dark stays closed. “He shows”: {{दर्शयति}}.'
      hi: 'अँधेरा बन्द रहता है। ‘वह दिखाता है’: {{दर्शयति}}।'
  options:
  - sa: पश्यति
  - sa: दृश्यते
  - correct: true
    sa: दर्शयति
- id: pn
  kind: teach
  title:
    en: Pāṇini's causative
    hi: पाणिनि का प्रेरणार्थक
  depth: panini
  skills:
  - verb.causative
  sutras:
  - 3.1.26
  - 7.2.115
  - 3.1.32
  body:
    en: 'Sūtra 3.1.26, {{हेतुमति च}}, adds {{णिच्}} when someone gets the action done. 7.2.115, {{अचो ञ्णिति}}, lengthens the root''s vowel before it: {{पठ्}} becomes {{पाठ्}}. 3.1.32, {{सनाद्यन्ता धातवः}}, says the new stem is itself a root: {{पाठयति}}.'
    hi: 'सूत्र 3.1.26, {{हेतुमति च}}, जब कोई क्रिया करवाए तब {{णिच्}} जोड़ता है। 7.2.115, {{अचो ञ्णिति}}, उससे पहले धातु का स्वर दीर्घ करता है: {{पठ्}} से {{पाठ्}}। 3.1.32, {{सनाद्यन्ता धातवः}}, कहता है कि नया अंग स्वयं एक धातु है: {{पाठयति}}।'

- id: s1
  kind: story
  title:
    en: A hand for every job
    hi: हर काम के लिए एक हाथ
  depth: core
  image:
    brief: 'The rose-mist pusher spirit with its dozen hands: one tilting a small boy''s head towards a book, one lifting a spoon to a sleepy ghost''s lips, one setting a foot on a path; the Vetāla pointing at each; Dādī laughing.'
    alt:
      en: A rose-mist spirit with many hands tilts a boy to a book, feeds a sleepy ghost and sets a foot on a path
      hi: गुलाबी धुंध का भूत अनेक हाथों से बालक को पुस्तक की ओर मोड़ता, ऊँघते भूत को खिलाता, राह पर पैर रखता
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - preraka
    place: smashana
    ratio: '4:3'
    id: pc-cause-s1
  narration:
    en: 'The pusher claps all twelve hands. “पाठयति!” says the Vetāla, pointing: one hand has taken a boy''s head and tilted it to a book. “भोजयति!” Another has lifted a spoon to the lips of a sleepy ghost. “गमयति!” A third has set a foot on a path. “He makes read, makes eat, makes go,” says Dādī. “He does not do the thing himself: he gets it done.”'
    hi: 'प्रेरक बारहों हाथ ताली में मिलाता है। “पाठयति!” वेताल इशारा करता है: एक हाथ ने एक बालक का सिर पुस्तक की ओर झुका दिया है। “भोजयति!” दूसरे ने एक ऊँघते भूत के होंठों तक चम्मच उठाया है। “गमयति!” तीसरे ने राह पर एक पैर रखा है। “वह पढ़वाता है, खिलाता है, भेजता है,” दादी कहती हैं। “वह स्वयं नहीं करता: वह करवाता है।”'
- id: t1
  kind: teach
  title:
    en: Making someone do it
    hi: किसी से करवाना
  depth: core
  skills:
  - verb.causative
  body:
    en: 'The causative adds {{-अय-}} after a strengthened root and means “makes do”: {{पठ्}} gives {{पाठयति}} (makes read, teaches), {{कृ}} gives {{कारयति}} (makes do), {{भुज्}} gives {{भोजयति}} (feeds), {{गम्}} gives {{गमयति}} (sends). The one made to act goes in the second case.'
    hi: 'प्रेरणार्थक रूप दृढ़ किए हुए धातु के बाद {{-अय-}} जोड़ता है और ‘करवाता है’ का अर्थ देता है: {{पठ्}} से {{पाठयति}} (पढ़वाता है, पढ़ाता है), {{कृ}} से {{कारयति}} (करवाता है), {{भुज्}} से {{भोजयति}} (खिलाता है), {{गम्}} से {{गमयति}} (भेजता है)। जिससे कराया जाए, वह द्वितीया में जाता है।'
  examples:
  - sa: गुरुः बालकम् पाठम् पाठयति।
    meaning:
      en: The teacher makes the boy read the lesson.
      hi: गुरु बालक को पाठ पढ़ाता है।
    words:
    - sa: गुरुः
      gloss:
        en: the teacher
        hi: गुरु
      check:
        type: subanta
        stem: गुरु
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
    - sa: बालकम्
      gloss:
        en: the boy
        hi: बालक को
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Dvitiya
        vacana: Eka
    - sa: पाठम्
      gloss:
        en: the lesson
        hi: पाठ
      check:
        type: subanta
        stem: पाठ
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Eka
    - sa: पाठयति
      gloss:
        en: makes read
        hi: पढ़ाता है
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
        sanadi:
        - Nic
  - sa: माता बालम् भोजयति।
    meaning:
      en: The mother feeds the child.
      hi: माता बच्चे को खिलाती है।
    words:
    - sa: माता
      gloss:
        en: the mother
        hi: माता
      check:

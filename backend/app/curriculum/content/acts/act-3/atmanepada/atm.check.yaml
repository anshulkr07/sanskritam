- id: p7
  kind: practice
  depth: core
  skills:
  - verb.atmane
  mode: order
  prompt:
    en: 'Say to Sevaka: “He serves, he obtains, he abides.”'
    hi: 'सेवक से कहिए: ‘वह सेवा करता है, पाता है, रहता है।’'
  explain:
    en: '{{सेवते लभते वर्तते}}: three verbs for oneself.'
    hi: '{{सेवते लभते वर्तते}}: अपने लिए तीन क्रियाएँ।'
  roman: after
  gate: true
  story:
    success:
      en: '“सेवते, लभते, वर्तते,” you say, and Sevaka lays down his tray, which is no longer empty, and places a cup of warm
        broth in your hands. “For you,” he says, in the other set, with a smile: “ददाति.” The Vetāla laughs outright. “A servant,”
        he says, “who has learned to give and to keep. Now watch him go.” Sevaka walks off, lighter, and as he goes, a short
        line of light hangs in the air behind him: “आगच्छति, निर्गच्छति.”'
      hi: '“सेवते, लभते, वर्तते,” आप कहते हैं, और सेवक अपना थाल रख देता है, जो अब ख़ाली नहीं है, और आपके हाथों में गर्म शोरबे
        का कटोरा थमा देता है। “आपके लिए,” वह दूसरे समूह में मुस्कराकर कहता है: “ददाति।” वेताल ठहाका मारकर हँसता है। “एक सेवक,”
        वह कहता है, “जिसने देना और रखना सीख लिया। अब देखो वह कैसे जाता है।” सेवक हल्का होकर चल देता है, और जाते हुए उसके पीछे
        हवा में प्रकाश की एक छोटी पंक्ति टँगी रहती है: “आगच्छति, निर्गच्छति।”'
    failure:
      en: 'Sevaka waits. Three verbs for oneself: {{सेवते लभते वर्तते}}.'
      hi: 'सेवक प्रतीक्षा करता है। अपने लिए तीन क्रियाएँ: {{सेवते लभते वर्तते}}।'

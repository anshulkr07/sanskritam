minutes: 6
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - verb.atmane
  mode: choice
  prompt:
    en: “He obtains.” Which form?
    hi: ‘वह पाता है।’ कौन-सा रूप?
  explain:
    en: '{{लभते}}.'
    hi: '{{लभते}}।'
  roman: after
  options:
  - sa: लभति
  - correct: true
    sa: लभते
  - sa: लभन्ति
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: सेवकः गुरुम् सेवते।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: The servant serves the teacher.
        hi: सेवक गुरु की सेवा करता है।
      words:
      - sa: सेवकः
        gloss:
          en: servant
          hi: सेवक
        check:
          type: subanta
          stem: सेवक
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: गुरुम्
        gloss:
          en: teacher
          hi: गुरु
        check:
          type: subanta
          stem: गुरु
          linga: Pum
          vibhakti: Dvitiya
          vacana: Eka
      - sa: सेवते
        gloss:
          en: serves
          hi: सेवा करता है
        check:
          type: tinanta
          dhatu: सेव्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
    - id: i1
      sa: सेवकः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: servant
        hi: सेवक
      check:
        type: subanta
        stem: सेवक
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{सेवक}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{सेवक}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
      compare_from: सेवक
    - id: i2
      sa: गुरुम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: teacher
        hi: गुरु
      check:
        type: subanta
        stem: गुरु
        linga: Pum
        vibhakti: Dvitiya
        vacana: Eka
      feature:
        en: 'Stem: {{गुरु}} · masculine · {{द्वितीया}} · singular'
        hi: 'प्रातिपदिक: {{गुरु}} · {{पुंलिंग}} · {{द्वितीया}} · {{एकवचन}}'
      compare_from: गुरु
    - id: i3
      sa: सेवते
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: serves
        hi: सेवा करता है
      check:
        type: tinanta
        dhatu: सेव्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
      feature:
        en: 'Root: {{सेव्}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{सेव्}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
      compare_from: सेव्
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'So far all your verbs ended in {{-ति}}: {{परस्मैपदम्}}, “word for another”. The other set is {{आत्मनेपदम्}},
          “word for oneself”: {{-ते}}, {{-एते}}, {{-न्ते}}. Some roots take only these: {{सेव्}} gives {{सेवते}}, {{लभ्}}
          gives {{लभते}}, {{वृत्}} gives {{वर्तते}}.'

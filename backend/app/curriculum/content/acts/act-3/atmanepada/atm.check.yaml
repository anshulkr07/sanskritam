- id: p4
  kind: practice
  depth: core
  skills:
  - verb.both-padas
  mode: choice
  prompt:
    en: “He cooks for himself.” Which form?
    hi: ‘वह अपने लिए पकाता है।’ कौन-सा रूप?
  explain:
    en: '{{पचते}}.'
    hi: '{{पचते}}।'
  roman: after
  options:
  - sa: पचति
  - correct: true
    sa: पचते
  - sa: पचतु
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Many roots take both sets. The set can say who gets the benefit: {{पचति}} (he cooks, for others), {{पचते}} (he
        cooks for himself); {{यजति}} / {{यजते}} (he sacrifices for another / for himself); {{करोति}} / {{कुरुते}} (he does
        / he does for himself). In everyday Sanskrit the difference is often slight.'
      hi: 'अनेक धातुएँ दोनों समूह लेती हैं। समूह बता सकता है कि लाभ किसे मिलता है: {{पचति}} (वह पकाता है, दूसरों के लिए),
        {{पचते}} (वह अपने लिए पकाता है); {{यजति}} / {{यजते}} (वह दूसरे के लिए / अपने लिए यज्ञ करता है); {{करोति}} / {{कुरुते}}
        (वह करता है / अपने लिए करता है)। रोज़ की संस्कृत में यह भेद अक्सर हल्का होता है।'
    items:
    - id: i0
      sa: पचति
    - id: i1
      sa: पचते
    - id: i2
      sa: यजति
    - id: i3
      sa: यजते
    - id: i4
      sa: करोति
    - id: i5
      sa: कुरुते

  - skill: verb.atmane
    rule:
      en: 'Do not say {{लभति}} or {{सेवति}}: those roots take only {{-ते}}.'
      hi: '{{लभति}} या {{सेवति}} मत कहिए: वे धातुएँ केवल {{-ते}} लेती हैं।'
    tag: core
    taught_in: atm.te#p1
  - skill: verb.both-padas
    rule:
      en: 'Do not mix the sets in one verb form: {{पचते}}, not {{पचति}}, when it is for oneself.'
      hi: 'एक क्रिया-रूप में समूह मत मिलाइए: अपने लिए हो तो {{पचते}}, {{पचति}} नहीं।'
    tag: core
    taught_in: atm.both#p1
- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: verb.atmane
    rule:
      en: '{{तङानावात्मनेपदम्}} names the endings; {{अनुदात्तङित आत्मनेपदम्}} says which roots take them.'
      hi: '{{तङानावात्मनेपदम्}} प्रत्ययों का नाम देता है; {{अनुदात्तङित आत्मनेपदम्}} बताता है कि कौन-सी धातुएँ उन्हें लेती
        हैं।'
    sutras:
    - 1.4.100
    - 1.3.12
    tag: core
    taught_in: atm.te#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 1.4.99, {{लः परस्मैपदम्}}, and 1.4.100, {{तङानावात्मनेपदम्}}, name the two sets; the second is the {{तङ्}}
          endings. 1.3.12, {{अनुदात्तङित आत्मनेपदम्}}, says roots with a marked sign take the second set. And 3.4.79, {{टित
          आत्मनेपदानां टेरे}}, turns the end of {{-त}} into {{-ते}}.
        hi: सूत्र 1.4.99, {{लः परस्मैपदम्}}, और 1.4.100, {{तङानावात्मनेपदम्}}, दोनों समूहों के नाम बताते हैं; दूसरा {{तङ्}}
          प्रत्ययों का है। 1.3.12, {{अनुदात्तङित आत्मनेपदम्}}, कहता है कि चिह्नित धातुएँ दूसरा समूह लेती हैं। और 3.4.79, {{टित
          आत्मनेपदानां टेरे}}, {{-त}} के अन्त को {{-ते}} बना देता है।
      items:
      - id: i0
        sa: लः परस्मैपदम्
      - id: i1
        sa: तङानावात्मनेपदम्
      - id: i2
        sa: तङ्
      - id: i3
        sa: अनुदात्तङित आत्मनेपदम्
      - id: i4
        sa: टित आत्मनेपदानां टेरे
      - id: i5
        sa: -त
      - id: i6
        sa: -ते
  - skill: verb.both-padas
    rule:
      en: '{{स्वरितञितः कर्त्रभिप्राये क्रियाफले}}: the set for oneself when the fruit goes to the doer.'
      hi: '{{स्वरितञितः कर्त्रभिप्राये क्रियाफले}}: फल कर्ता को जाए तो अपने लिए वाला समूह।'
    sutras:
    - 1.3.72
    tag: core
    taught_in: atm.both#pn
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 1.3.72, {{स्वरितञितः कर्त्रभिप्राये क्रियाफले}}, says the second set is used when the fruit of the action
          goes to the doer. And 1.3.78, {{शेषात् कर्तरि परस्मैपदम्}}, says that for all other roots the first set is the default.
          Prefixes can change the set; for example {{विपराभ्यां जेः}}, 1.3.19, gives {{विजयते}}.
        hi: सूत्र 1.3.72, {{स्वरितञितः कर्त्रभिप्राये क्रियाफले}}, कहता है कि जब क्रिया का फल कर्ता को जाए तब दूसरा समूह आता
          है। और 1.3.78, {{शेषात् कर्तरि परस्मैपदम्}}, कहता है कि बाक़ी सब धातुओं में पहला समूह डिफ़ॉल्ट है। उपसर्ग समूह बदल
          सकते हैं; जैसे {{विपराभ्यां जेः}}, 1.3.19, {{विजयते}} देता है।
      items:
      - id: i0
        sa: स्वरितञितः कर्त्रभिप्राये क्रियाफले
      - id: i1
        sa: शेषात् कर्तरि परस्मैपदम्
      - id: i2
        sa: विपराभ्यां जेः
      - id: i3
        sa: विजयते

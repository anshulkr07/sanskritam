title:
  en: Everything about the two sets
  hi: दोनों समूहों के बारे में सब कुछ
title_sa: पदसङ्ग्रहः
minutes: 6
review: engine_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: core
  kind: revision
  title:
    en: The endings
    hi: प्रत्यय
  depth: core
  section: core
  rows:
  - skill: verb.atmane
    rule:
      en: '{{सेव्}}: {{सेवते सेवेते सेवन्ते}}, {{सेवसे सेवेथे सेवध्वे}}, {{सेवे सेवावहे सेवामहे}}.'
      hi: '{{सेव्}}: {{सेवते सेवेते सेवन्ते}}, {{सेवसे सेवेथे सेवध्वे}}, {{सेवे सेवावहे सेवामहे}}।'
    sutras:
    - 1.4.100
    - 1.3.12
    - 3.4.79
    tag: core
    taught_in: atm.te#tb1
  - skill: verb.both-padas
    rule:
      en: '{{पच्}}: {{पचति}} / {{पचते}}; {{कृ}}: {{करोति}} / {{कुरुते}}.'
      hi: '{{पच्}}: {{पचति}} / {{पचते}}; {{कृ}}: {{करोति}} / {{कुरुते}}।'
    sutras:
    - 1.3.72
    - 1.3.78
    tag: core
    taught_in: atm.both#tb1
- id: conditions
  kind: revision
  title:
    en: When to use which
    hi: कब कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: verb.atmane
    rule:
      en: 'Some roots take only {{-ते}}: {{सेव्}}, {{लभ्}}, {{वृत्}}, {{मुद्}}, {{रुच्}}.'
      hi: 'कुछ धातुएँ केवल {{-ते}} लेती हैं: {{सेव्}}, {{लभ्}}, {{वृत्}}, {{मुद्}}, {{रुच्}}।'
    tag: good
    taught_in: atm.te#tb2
  - skill: verb.both-padas
    rule:
      en: With roots that take both, {{-ते}} suggests the fruit goes to the doer.
      hi: दोनों लेने वाली धातुओं में {{-ते}} सुझाता है कि फल कर्ता को जाता है।
    tag: good
    taught_in: atm.both#t1
- id: exceptions
  kind: revision
  title:
    en: Odd cases
    hi: विचित्र स्थितियाँ
  depth: core
  section: exceptions
  rows:
  - skill: verb.both-padas
    rule:
      en: 'A prefix may fix the set: {{विजयते}}, {{पराजयते}}, {{प्रतिष्ठते}}.'
      hi: 'उपसर्ग समूह तय कर सकता है: {{विजयते}}, {{पराजयते}}, {{प्रतिष्ठते}}।'
    example:
      sa: प्रतिष्ठते
      meaning:
        en: he sets out
        hi: वह प्रस्थान करता है
      check:
        type: tinanta
        dhatu: स्था
        lakara: Lat
        purusha: Prathama
        vacana: Eka
        prefixes:
        - प्र
    tag: rare
    new_here: true
  - skill: verb.atmane
    rule:
      en: 'Some roots of class 4 are only ātmanepada: {{जन्}} gives {{जायते}}, {{युध्}} gives {{युध्यते}}.'
      hi: 'गण 4 की कुछ धातुएँ केवल आत्मनेपद की हैं: {{जन्}} से {{जायते}}, {{युध्}} से {{युध्यते}}।'
    example:
      sa: जायते
      meaning:
        en: he is born
        hi: वह जन्म लेता है
      check:
        type: tinanta
        dhatu: जन्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
        gana: Divadi
    tag: rare
    new_here: true
- id: mistakes
  kind: revision
  title:
    en: Common mistakes
    hi: आम भूलें
  depth: core
  section: mistakes
  rows:
  - skill: verb.atmane
    rule:
      en: 'Do not say {{लभति}} or {{सेवति}}: those roots take only {{-ते}}.'
      hi: '{{लभति}} या {{सेवति}} मत कहिए: वे धातुएँ केवल {{-ते}} लेती हैं।'
    tag: core
    taught_in: atm.te#p1
  - skill: verb.both-padas
    rule:
      en: 'Do not mix the sets in one verb form: {{पचते}}, not {{पचति}}, when it is for oneself.'
      hi: 'एक क्रिया-रूप में समूह मत मिलाइए: अपने लिए हो तो {{पचते}}, {{पचति}} नहीं।'
    tag: core
    taught_in: atm.both#p1
- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: verb.atmane
    rule:
      en: '{{तङानावात्मनेपदम्}} names the endings; {{अनुदात्तङित आत्मनेपदम्}} says which roots take them.'
      hi: '{{तङानावात्मनेपदम्}} प्रत्ययों का नाम देता है; {{अनुदात्तङित आत्मनेपदम्}} बताता है कि कौन-सी धातुएँ उन्हें लेती हैं।'
    sutras:
    - 1.4.100
    - 1.3.12
    tag: core
    taught_in: atm.te#pn
  - skill: verb.both-padas
    rule:
      en: '{{स्वरितञितः कर्त्रभिप्राये क्रियाफले}}: the set for oneself when the fruit goes to the doer.'
      hi: '{{स्वरितञितः कर्त्रभिप्राये क्रियाफले}}: फल कर्ता को जाए तो अपने लिए वाला समूह।'
    sutras:
    - 1.3.72
    tag: core
    taught_in: atm.both#pn
- id: sheet
  kind: revision
  title:
    en: Quick sheet
    hi: एक नज़र में
  depth: core
  section: quick_sheet
  rows:
  - skill: verb.atmane
    formula: सेवते · लभते · वर्तते
    rule:
      en: for oneself
      hi: अपने लिए
    tag: core
    taught_in: atm.te#tb1
  - skill: verb.both-padas
    formula: पचति / पचते · करोति / कुरुते
    rule:
      en: both sets
      hi: दोनों समूह
    tag: core
    taught_in: atm.both#tb1

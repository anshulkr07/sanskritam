- id: pn
  kind: teach
  title:
    en: Pāṇini's choice
    hi: पाणिनि का चुनाव
  depth: panini
  skills:
  - verb.both-padas
  sutras:
  - 1.3.72
  - 1.3.78
  - 1.3.19
  body:
    en: Sūtra 1.3.72, {{स्वरितञितः कर्त्रभिप्राये क्रियाफले}}, says the second set is used when the fruit of the action goes
      to the doer. And 1.3.78, {{शेषात् कर्तरि परस्मैपदम्}}, says that for all other roots the first set is the default. Prefixes
      can change the set; for example {{विपराभ्यां जेः}}, 1.3.19, gives {{विजयते}}.
    hi: सूत्र 1.3.72, {{स्वरितञितः कर्त्रभिप्राये क्रियाफले}}, कहता है कि जब क्रिया का फल कर्ता को जाए तब दूसरा समूह आता है।
      और 1.3.78, {{शेषात् कर्तरि परस्मैपदम्}}, कहता है कि बाक़ी सब धातुओं में पहला समूह डिफ़ॉल्ट है। उपसर्ग समूह बदल सकते
      हैं; जैसे {{विपराभ्यां जेः}}, 1.3.19, {{विजयते}} देता है।
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: Sūtra 1.3.72, {{स्वरितञितः कर्त्रभिप्राये क्रियाफले}}, says the second set is used when the fruit of the action
        goes to the doer. And 1.3.78, {{शेषात् कर्तरि परस्मैपदम्}}, says that for all other roots the first set is the default.
        Prefixes can change the set; for example {{विपराभ्यां जेः}}, 1.3.19, gives {{विजयते}}.
      hi: सूत्र 1.3.72, {{स्वरितञितः कर्त्रभिप्राये क्रियाफले}}, कहता है कि जब क्रिया का फल कर्ता को जाए तब दूसरा समूह आता
        है। और 1.3.78, {{शेषात् कर्तरि परस्मैपदम्}}, कहता है कि बाक़ी सब धातुओं में पहला समूह डिफ़ॉल्ट है। उपसर्ग समूह बदल
        सकते हैं; जैसे {{विपराभ्यां जेः}}, 1.3.19, {{विजयते}} देता है।
    items:
    - id: i0
      sa: स्वरितञितः कर्त्रभिप्राये क्रियाफले
    - id: i1
      sa: शेषात् कर्तरि परस्मैपदम्
    - id: i2
      sa: विपराभ्यां जेः
    - id: i3
      sa: विजयते

- id: s1
  kind: story
  title:
    en: The cook
    hi: रसोइया
  depth: core
  image:
    brief: The small servant spirit crouched by the fire cooking in a little clay pot, one hand stirring, a thin smile; Dādī
      watching; Śuka sniffing the steam; the Vetāla in the background with an amused expression.
    alt:
      en: A small servant spirit cooks by the fire in a clay pot while a parrot sniffs the steam
      hi: अलाव के पास मिट्टी की हाँडी में पकाता सेवक भूत, भाप सूँघता तोता
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - sevaka
    place: smashana
    ratio: '4:3'
    id: atm-both-s1
  narration:
    en: 'Sevaka sits beside the fire and takes out a small pot. He lights a twig and begins to cook, and as he cooks he talks.
      “पचति,” he murmurs, thinking of the beggars he once cooked for. Then, looking at the pot, and at himself: “पचते.” “He
      cooks for himself,” says Dādī. “The same root, two sets. The set you choose says who gets the fruit.”'
    hi: 'सेवक अलाव के पास बैठता है और एक छोटी हाँडी निकालता है। वह तिनका जलाता है और पकाने लगता है, और पकाते हुए बोलता जाता
      है। “पचति,” वह बुदबुदाता है, उन भिखारियों को याद करते जिनके लिए कभी पकाता था। फिर हाँडी को और स्वयं को देखकर: “पचते।”
      “वह अपने लिए पकाता है,” दादी कहती हैं। “एक ही धातु, दो समूह। जो समूह चुनें, वह बताता है कि फल किसे मिलेगा।”'
  lines:
  - speaker: sevaka
    sa: पचते
    gloss:
      en: He cooks for himself.
      hi: वह अपने लिए पकाता है।
    check:
      type: tinanta
      dhatu: पच्
      lakara: Lat
      purusha: Prathama
      vacana: Eka
- id: t1
  kind: teach
  title:
    en: Both sets
    hi: दोनों समूह
  depth: core
  skills:
  - verb.both-padas
  body:
    en: 'Many roots take both sets. The set can say who gets the benefit: {{पचति}} (he cooks, for others), {{पचते}} (he cooks
      for himself); {{यजति}} / {{यजते}} (he sacrifices for another / for himself); {{करोति}} / {{कुरुते}} (he does / he does
      for himself). In everyday Sanskrit the difference is often slight.'
    hi: 'अनेक धातुएँ दोनों समूह लेती हैं। समूह बता सकता है कि लाभ किसे मिलता है: {{पचति}} (वह पकाता है, दूसरों के लिए), {{पचते}}
      (वह अपने लिए पकाता है); {{यजति}} / {{यजते}} (वह दूसरे के लिए / अपने लिए यज्ञ करता है); {{करोति}} / {{कुरुते}} (वह करता
      है / अपने लिए करता है)। रोज़ की संस्कृत में यह भेद अक्सर हल्का होता है।'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'Many roots take both sets. The set can say who gets the benefit: {{पचति}} (he cooks, for others), {{पचते}} (he
        cooks for himself); {{यजति}} / {{यजते}} (he sacrifices for another / for himself); {{करोति}} / {{कुरुते}} (he does
        / he does for himself). In everyday Sanskrit the difference is often slight.'
      hi: 'अनेक धातुएँ दोनों समूह लेती हैं। समूह बता सकता है कि लाभ किसे मिलता है: {{पचति}} (वह पकाता है, दूसरों के लिए),
        {{पचते}} (वह अपने लिए पकाता है); {{यजति}} / {{यजते}} (वह दूसरे के लिए / अपने लिए यज्ञ करता है); {{करोति}} / {{कुरुते}}
        (वह करता है / अपने लिए करता है)। रोज़ की संस्कृत में यह भेद अक्सर हल्का होता है।'

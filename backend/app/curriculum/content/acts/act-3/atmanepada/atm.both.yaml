      gloss:
        en: he
        hi: वह
    - sa: विजयते
      gloss:
        en: is victorious
        hi: विजयी होता है
      check:
        type: tinanta
        dhatu: जि
        lakara: Lat
        purusha: Prathama
        vacana: Eka
        prefixes:
        - वि
  - sa: सः पराजयते।
    meaning:
      en: He is defeated.
      hi: वह हारता है।
    words:
    - sa: सः
      gloss:
        en: he
        hi: वह
    - sa: पराजयते
      gloss:
        en: is defeated
        hi: हारता है
      check:
        type: tinanta
        dhatu: जि
        lakara: Lat
        purusha: Prathama
        vacana: Eka
        prefixes:
        - परा

- id: t2
  kind: teach
  title:
    en: The prefix can decide
    hi: उपसर्ग भी तय करता है
  depth: core
  skills:
  - verb.both-padas
  body:
    en: 'With some prefixes the set is fixed: {{जि}} gives {{जयति}} (wins), but {{वि + जि}} gives {{विजयते}} (is victorious)
      and {{परा + जि}} gives {{पराजयते}} (is defeated). {{स्था}} gives {{तिष्ठति}} but {{प्र + स्था}} gives {{प्रतिष्ठते}}
      (sets out).'
    hi: 'कुछ उपसर्गों के साथ समूह तय हो जाता है: {{जि}} से {{जयति}} (जीतता है), पर {{वि + जि}} से {{विजयते}} (विजयी होता है)
      और {{परा + जि}} से {{पराजयते}} (हारता है)। {{स्था}} से {{तिष्ठति}}, पर {{प्र + स्था}} से {{प्रतिष्ठते}} (प्रस्थान करता
      है)।'
  examples:
  - sa: सः विजयते।
    meaning:
      en: He is victorious.
      hi: वह विजयी होता है।
    words:

  mode: choice
  prompt:
    en: “He does (it) for himself.” Which form of {{कृ}}?
    hi: ‘वह (उसे) अपने लिए करता है।’ {{कृ}} का कौन-सा रूप?
  explain:
    en: '{{कुरुते}}: the form for oneself.'
    hi: '{{कुरुते}}: अपने लिए वाला रूप।'
  roman: after
  gate: true
  story:
    success:
      en: '“कुरुते,” you say, and Sevaka tastes his stew. His face does something it has not done in a thousand years: it
        relaxes, as if a very old tightness had been let go. “For myself,” he says, and he is quiet a long while. When he
        looks up, he is almost whole. “सेवते, लभते, वर्तते,” he says. “I serve myself, I obtain, I am.”'
      hi: '“कुरुते,” आप कहते हैं, और सेवक अपना शोरबा चखता है। उसके चेहरे पर वह भाव आता है जो हज़ार वर्षों से नहीं आया था:
        वह ढीला हो जाता है, मानो कोई बहुत पुरानी कसावट छूट गई हो। “अपने लिए,” वह कहता है, और बहुत देर चुप रहता है। जब वह ऊपर
        देखता है, वह लगभग पूर्ण है। “सेवते, लभते, वर्तते,” वह कहता है। “मैं अपनी सेवा करता हूँ, पाता हूँ, हूँ।”'
    failure:
      en: 'The stew stays hot and untasted. For himself: {{कुरुते}}.'
      hi: 'शोरबा गर्म और बिना चखा रहता है। अपने लिए: {{कुरुते}}।'

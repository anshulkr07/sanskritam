- id: pn
  kind: teach
  title:
    en: Pāṇini's two sets
    hi: पाणिनि के दो समूह
  depth: panini
  skills:
  - verb.atmane
  sutras:
  - 1.4.99
  - 1.4.100
  - 1.3.12
  - 3.4.79
  body:
    en: Sūtra 1.4.99, {{लः परस्मैपदम्}}, and 1.4.100, {{तङानावात्मनेपदम्}}, name the two sets; the second is the {{तङ्}} endings.
      1.3.12, {{अनुदात्तङित आत्मनेपदम्}}, says roots with a marked sign take the second set. And 3.4.79, {{टित आत्मनेपदानां
      टेरे}}, turns the end of {{-त}} into {{-ते}}.
    hi: सूत्र 1.4.99, {{लः परस्मैपदम्}}, और 1.4.100, {{तङानावात्मनेपदम्}}, दोनों समूहों के नाम बताते हैं; दूसरा {{तङ्}} प्रत्ययों
      का है। 1.3.12, {{अनुदात्तङित आत्मनेपदम्}}, कहता है कि चिह्नित धातुएँ दूसरा समूह लेती हैं। और 3.4.79, {{टित आत्मनेपदानां
      टेरे}}, {{-त}} के अन्त को {{-ते}} बना देता है।
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: Sūtra 1.4.99, {{लः परस्मैपदम्}}, and 1.4.100, {{तङानावात्मनेपदम्}}, name the two sets; the second is the {{तङ्}}
        endings. 1.3.12, {{अनुदात्तङित आत्मनेपदम्}}, says roots with a marked sign take the second set. And 3.4.79, {{टित
        आत्मनेपदानां टेरे}}, turns the end of {{-त}} into {{-ते}}.
      hi: सूत्र 1.4.99, {{लः परस्मैपदम्}}, और 1.4.100, {{तङानावात्मनेपदम्}}, दोनों समूहों के नाम बताते हैं; दूसरा {{तङ्}}
        प्रत्ययों का है। 1.3.12, {{अनुदात्तङित आत्मनेपदम्}}, कहता है कि चिह्नित धातुएँ दूसरा समूह लेती हैं। और 3.4.79, {{टित
        आत्मनेपदानां टेरे}}, {{-त}} के अन्त को {{-ते}} बना देता है।
    items:
    - id: i0

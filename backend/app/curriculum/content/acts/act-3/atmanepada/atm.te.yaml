  mode: choice
  prompt:
    en: “They serve.” Which form?
    hi: ‘वे सेवा करते हैं।’ कौन-सा रूप?
  explain:
    en: '{{सेवन्ते}}: they, many.'
    hi: '{{सेवन्ते}}: वे, अनेक।'
  roman: after
  gate: true
  story:
    success:
      en: '“सेवन्ते,” you say, and the little servant straightens his back a little. The tray of nothing in his hands becomes,
        very faintly, a tray of something: warm bread, a cup. “They serve,” he says slowly, “and I could serve myself.” He
        eats the bread. It is the first thing he has eaten in a thousand years.'
      hi: '“सेवन्ते,” आप कहते हैं, और नन्हा सेवक थोड़ा सीधा हो जाता है। उसके हाथ का ख़ाली थाल, बहुत हल्के-हल्के, कुछ भरा थाल
        बन जाता है: गर्म रोटी, एक कटोरा। “वे सेवा करते हैं,” वह धीरे से कहता है, “और मैं अपनी सेवा कर सकता हूँ।” वह रोटी खाता
        है। यह हज़ार वर्षों में उसने पहली चीज़ खाई है।'
    failure:
      en: 'The tray stays empty. “They serve (for themselves)”: {{सेवन्ते}}.'
      hi: 'थाल ख़ाली रहता है। ‘वे सेवा करते हैं (अपने लिए)’: {{सेवन्ते}}।'

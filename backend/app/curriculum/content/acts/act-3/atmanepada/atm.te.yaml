- id: s1
  kind: story
  title:
    en: The ninth night
    hi: नौवीं रात
  depth: core
  image:
    brief: A small stooped spirit in a patched servant's wrap shuffling into the firelight with an empty tray, baffled; the Vetāla pointing a lazy finger at him; Dādī explaining with two raised hands, one pointing away and one curling back to herself; Śuka cocking his head.
    alt:
      en: A stooped servant spirit with an empty tray in firelight while an old woman gestures away and back
      hi: ख़ाली थाल लिए झुका सेवक भूत, दादी दूर और अपनी ओर इशारा करती हुई
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - sevaka
    place: smashana
    ratio: '4:3'
    id: atm-te-s1
  narration:
    en: 'A small stooped spirit shuffles into the firelight, holding a tray of nothing. “सेवते,” says the Vetāla. “He serves. For himself.” The little servant looks at him, baffled. “All my life I served others,” he says. “‘सेवति’ I would have said.” Dādī: “There are two sets of verb endings. One looks away from the doer, the other turns back to him.”'
    hi: 'एक छोटा झुका हुआ भूत अलाव की रोशनी में घिसटता आता है, ख़ाली थाल लिए। “सेवते,” वेताल कहता है। “वह सेवा करता है। अपने लिए।” नन्हा सेवक उसे भौंचक देखता है। “जीवन भर मैंने दूसरों की सेवा की,” वह कहता है। “‘सेवति’ मैं कहता।” दादी: “क्रिया-प्रत्ययों के दो समूह हैं। एक कर्ता से दूर देखता है, दूसरा उसकी ओर लौटता है।”'
  lines:
  - speaker: dadi
    sa: सेवते। लभते।
    gloss:
      en: He serves (for himself). He obtains.
      hi: वह (अपने लिए) सेवा करता है। वह पाता है।
- id: t1
  kind: teach
  title:
    en: Two sets of endings
    hi: प्रत्ययों के दो समूह
  depth: core
  skills:
  - verb.atmane
  body:
    en: 'So far all your verbs ended in {{-ति}}: {{परस्मैपदम्}}, “word for another”. The other set is {{आत्मनेपदम्}}, “word for oneself”: {{-ते}}, {{-एते}}, {{-न्ते}}. Some roots take only these: {{सेव्}} gives {{सेवते}}, {{लभ्}} gives {{लभते}}, {{वृत्}} gives {{वर्तते}}.'
    hi: 'अब तक आपकी क्रियाएँ {{-ति}} पर समाप्त होती थीं: {{परस्मैपदम्}}, ‘दूसरे के लिए शब्द’। दूसरा समूह {{आत्मनेपदम्}} है, ‘अपने लिए शब्द’: {{-ते}}, {{-एते}}, {{-न्ते}}। कुछ धातुएँ केवल यही लेती हैं: {{सेव्}} से {{सेवते}}, {{लभ्}} से {{लभते}}, {{वृत्}} से {{वर्तते}}।'
  examples:

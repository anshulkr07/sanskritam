- id: p4
  kind: practice
  title:
    en: For themselves
    hi: अपने लिए
  depth: core
  skills:
  - verb.atmane
  mode: choice
  prompt:
    en: “They serve.” Which form?
    hi: ‘वे सेवा करते हैं।’ कौन-सा रूप?
  explain:
    en: '{{सेवन्ते}}: they, many.'
    hi: '{{सेवन्ते}}: वे, अनेक।'
  roman: after
  gate: true
  story:
    success:
      en: '“सेवन्ते,” you say, and the little servant straightens his back a little. The tray of nothing in his hands becomes, very faintly, a tray of something: warm bread, a cup. “They serve,” he says slowly, “and I could serve myself.” He eats the bread. It is the first thing he has eaten in a thousand years.'
      hi: '“सेवन्ते,” आप कहते हैं, और नन्हा सेवक थोड़ा सीधा हो जाता है। उसके हाथ का ख़ाली थाल, बहुत हल्के-हल्के, कुछ भरा थाल बन जाता है: गर्म रोटी, एक कटोरा। “वे सेवा करते हैं,” वह धीरे से कहता है, “और मैं अपनी सेवा कर सकता हूँ।” वह रोटी खाता है। यह हज़ार वर्षों में उसने पहली चीज़ खाई है।'
    failure:
      en: 'The tray stays empty. “They serve (for themselves)”: {{सेवन्ते}}.'
      hi: 'थाल ख़ाली रहता है। ‘वे सेवा करते हैं (अपने लिए)’: {{सेवन्ते}}।'
  options:
  - sa: सेवन्ति
  - sa: सेवेते
  - correct: true
    sa: सेवन्ते
- id: pn
  kind: teach
  title:
    en: Pāṇini's two sets
    hi: पाणिनि के दो समूह
  depth: panini
  skills:
  - verb.atmane
  sutras:
  - 1.4.99
  - 1.4.100
  - 1.3.12
  - 3.4.79
  body:
    en: Sūtra 1.4.99, {{लः परस्मैपदम्}}, and 1.4.100, {{तङानावात्मनेपदम्}}, name the two sets; the second is the {{तङ्}} endings. 1.3.12, {{अनुदात्तङित आत्मनेपदम्}}, says roots with a marked sign take the second set. And 3.4.79, {{टित आत्मनेपदानां टेरे}}, turns the end of {{-त}} into {{-ते}}.
    hi: सूत्र 1.4.99, {{लः परस्मैपदम्}}, और 1.4.100, {{तङानावात्मनेपदम्}}, दोनों समूहों के नाम बताते हैं; दूसरा {{तङ्}} प्रत्ययों का है। 1.3.12, {{अनुदात्तङित आत्मनेपदम्}}, कहता है कि चिह्नित धातुएँ दूसरा समूह लेती हैं। और 3.4.79, {{टित आत्मनेपदानां टेरे}}, {{-त}} के अन्त को {{-ते}} बना देता है।

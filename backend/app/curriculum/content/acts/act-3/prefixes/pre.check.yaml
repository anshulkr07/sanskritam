- id: p7
  kind: practice
  depth: core
  skills:
  - verb.upasarga
  mode: choice
  prompt:
    en: Which of these is NOT a verb with a prefix?
    hi: इनमें कौन-सी क्रिया उपसर्ग वाली नहीं है?
  explain:
    en: '{{पठ्यते}}: not a prefix but a new form, the passive.'
    hi: '{{पठ्यते}}: उपसर्ग नहीं, एक नया रूप, कर्मवाच्य।'
  roman: after
  gate: true
  story:
    success:
      en: '“पठ्यते,” you say, to see what will happen. Yojaka''s beads all stop clicking at once. He leans very close and
        whispers: “That is not one of mine. That is a different kind of change. I hear it from the Vetāla and from the old
        ones.” He bows. “आगच्छति, निर्गच्छति, उपगच्छति. Take them, they are yours.” He gives you a bead. Then he clicks his
        string closed and calls into the dark: “पठ्यते! पाठयति!” and something answers from deep in the trees.'
      hi: '“पठ्यते,” आप कहते हैं, यह देखने कि क्या होता है। योजक के सारे मनके एक साथ खटखटाना बन्द कर देते हैं। वह बहुत पास
        झुककर फुसफुसाता है: “यह मेरा नहीं है। यह किसी और तरह का परिवर्तन है। मैंने इसे वेताल और पुराने भूतों से सुना है।”
        वह झुकता है। “आगच्छति, निर्गच्छति, उपगच्छति। लो, ये आपके हैं।” वह आपको एक मनका देता है। फिर वह अपनी माला बन्द करता
        है और अँधेरे में पुकारता है: “पठ्यते! पाठयति!” और पेड़ों के गहरे से कुछ उत्तर देता है।'
    failure:
      en: 'The beads keep waiting. {{पठ्यते}}: “it is read”.'
      hi: 'मनके प्रतीक्षा करते रहते हैं। {{पठ्यते}}: ‘वह पढ़ा जाता है’।'

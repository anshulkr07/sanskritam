        join a verb {{उपसर्ग}}. The list of twenty-two is a tradition from the grammarians and is memorised as a verse.
      hi: सूत्र 1.4.58, {{प्रादयः}}, {{प्र}} से आगे की सूची देता है, और 1.4.59, {{उपसर्गाः क्रियायोगे}}, उनमें से क्रिया से

- id: s1
  kind: story
  title:
    en: The whole string
    hi: पूरी माला
  depth: core
  image:
    brief: The bead-spirit unwinding a long string of twenty-two glass beads across a mossy root, each bead catching the firelight,
      a different colour; Dādī leaning in to count them; Śuka pecking at the beads gently.
    alt:
      en: A long string of twenty-two glass beads laid across a mossy root in firelight
      hi: काई लगी जड़ पर फैली बाईस काँच के मनकों की लम्बी माला
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - yojaka
    place: smashana
    ratio: '4:3'
    id: pre-list-s1
  narration:
    en: 'Yojaka unwinds his whole string and lays it across the root. There are twenty-two beads on it. “प्र, परा, अप, सम्,
      अनु, अव,” he counts, clicking each in turn; “निस्, निर्, दुस्, दुर्, वि, आ, नि,” on, to the last: “उप.” Dādī: “Twenty-two
      little words, and between them they change every verb you will ever read.”'
    hi: 'योजक अपनी पूरी माला खोलकर धातु पर फैला देता है। उसमें बाईस मनके हैं। “प्र, परा, अप, सम्, अनु, अव,” वह गिनता है, हर
      एक को बारी-बारी खटखटाते; “निस्, निर्, दुस्, दुर्, वि, आ, नि,” आगे, आख़िरी तक: “उप।” दादी: “बाईस छोटे शब्द, और इनके बीच
      आपके पढ़े हर क्रियापद का अर्थ बदलता है।”'

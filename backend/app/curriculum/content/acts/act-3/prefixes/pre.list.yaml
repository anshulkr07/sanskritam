- id: t2
  kind: teach
  title:
    en: Two meanings may differ
    hi: दो अर्थ अलग हो सकते हैं
  depth: core
  skills:
  - verb.upasarga-list
  body:
    en: 'A prefix can turn a meaning around: {{जानाति}} (knows) but {{अवजानाति}} (despises); {{भवति}} (is) but {{पराभवति}}
      (is defeated); {{नयति}} (leads) but {{विनयति}} (trains). Always check the meaning of the whole word.'
    hi: 'उपसर्ग अर्थ पलट सकता है: {{जानाति}} (जानता है) पर {{अवजानाति}} (तिरस्कार करता है); {{भवति}} (होता है) पर {{पराभवति}}
      (हारता है); {{नयति}} (ले जाता है) पर {{विनयति}} (सिखाता है)। हमेशा पूरे शब्द का अर्थ देखिए।'
  examples:
  - sa: सः अवजानाति।
    meaning:
      en: He despises.
      hi: वह तिरस्कार करता है।
    words:
    - sa: सः
      gloss:
        en: he
        hi: वह
    - sa: अवजानाति
      gloss:
        en: despises
        hi: तिरस्कार करता है
      check:
        type: tinanta
        dhatu: ज्ञा
        lakara: Lat
        purusha: Prathama
        vacana: Eka
        prefixes:
        - अव
  - sa: सः पराभवति।
    meaning:
      en: He is defeated.
      hi: वह हारता है।
    words:
    - sa: सः
      gloss:
        en: he
        hi: वह
    - sa: पराभवति

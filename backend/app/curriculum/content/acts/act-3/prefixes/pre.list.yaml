  body:
    en: Sūtra 1.4.58, {{प्रादयः}}, gives the list {{प्र}} onwards, and 1.4.59, {{उपसर्गाः क्रियायोगे}}, names those that join
      a verb {{उपसर्ग}}. The list of twenty-two is a tradition from the grammarians and is memorised as a verse.
    hi: सूत्र 1.4.58, {{प्रादयः}}, {{प्र}} से आगे की सूची देता है, और 1.4.59, {{उपसर्गाः क्रियायोगे}}, उनमें से क्रिया से
      जुड़ने वालों को {{उपसर्ग}} कहता है। बाईस की गिनती वैयाकरणों की परम्परा है और श्लोक की तरह याद की जाती है।

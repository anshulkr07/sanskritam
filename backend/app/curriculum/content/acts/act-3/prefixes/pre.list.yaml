      {{दुर्}}, {{वि}}, {{आ}}, {{नि}}, {{अधि}}, {{अपि}}, {{अति}}, {{सु}}, {{उत्}}, {{अभि}}, {{प्रति}}, {{परि}}, {{उप}}. Each
      carries a direction or a shade.'
    hi: 'उपसर्ग बाईस हैं: {{प्र}}, {{परा}}, {{अप}}, {{सम्}}, {{अनु}}, {{अव}}, {{निस्}}, {{निर्}}, {{दुस्}}, {{दुर्}}, {{वि}},
      {{आ}}, {{नि}}, {{अधि}}, {{अपि}}, {{अति}}, {{सु}}, {{उत्}}, {{अभि}}, {{प्रति}}, {{परि}}, {{उप}}। हर एक एक दिशा या रंग
      लाता है।'

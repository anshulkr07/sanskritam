    hi: '{{वि}}: अलग, विस्तार से।'
  roman: after
  gate: true
  story:
    success:
      en: “वि,” you say, and one of the twenty-two beads, the plain clear one, lifts off the string and floats in front of
        your face, spinning. “वि,” it says, in a very small voice, “to see things apart.” The bead-spirit gasps. Then, one
        by one, the other twenty-one lift too, and hang in a ring round you, singing each its own small word.
      hi: “वि,” आप कहते हैं, और बाईस मनकों में से एक, सादा पारदर्शी, माला से उठकर आपके चेहरे के सामने घूमते हुए तैर जाता है।
        “वि,” वह बहुत नन्ही आवाज़ में कहता है, “चीज़ों को अलग-अलग देखने के लिए।” मनके वाला भूत हाँफ उठता है। फिर, एक-एक करके,
        बाक़ी इक्कीस भी उठते हैं, और आपके चारों ओर घेरा बनाकर लटक जाते हैं, हर एक अपना छोटा-सा शब्द गाता हुआ।
    failure:
      en: 'The bead stays on the string. {{वि}}: apart, in detail.'

- id: conditions
  kind: revision
  title:
    en: When to use which
    hi: कब कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: verb.upasarga
    rule:
      en: 'Check the meaning of the whole word, not just the root: {{अवजानाति}} is “despises”.'
      hi: 'पूरे शब्द का अर्थ देखिए, केवल धातु का नहीं: {{अवजानाति}} का अर्थ ‘तिरस्कार करता है’।'
    tag: good
    taught_in: pre.list#t2
    visuals:
    - id: v-linked-0
      kind: worked
      title:
        en: Read, examine, understand
        hi: पढ़ें, समझें, फिर पढ़ें
      items:
      - id: i0
        sa: सः अवजानाति।
        label:
          en: Read the whole example
          hi: पूरा उदाहरण पढ़ें
        meaning:
          en: He despises.
          hi: वह तिरस्कार करता है।
        words:
        - sa: सः
          gloss:
            en: he
            hi: वह
        - sa: अवजानाति
          gloss:
            en: despises
            hi: तिरस्कार करता है
          check:
            type: tinanta
            dhatu: ज्ञा
            lakara: Lat
            purusha: Prathama
            vacana: Eka
            prefixes:
            - अव
      - id: i1
        sa: सः
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: he
          hi: वह
      - id: i2
        sa: अवजानाति
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: despises
          hi: तिरस्कार करता है
        check:
          type: tinanta
          dhatu: ज्ञा
          lakara: Lat
          purusha: Prathama
          vacana: Eka
          prefixes:
          - अव
        feature:
          en: 'Root: {{ज्ञा}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
          hi: 'धातु: {{ज्ञा}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
        compare_from: ज्ञा
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: 'A prefix can turn a meaning around: {{जानाति}} (knows) but {{अवजानाति}} (despises); {{भवति}} (is) but {{पराभवति}}
            (is defeated); {{नयति}} (leads) but {{विनयति}} (trains). Always check the meaning of the whole word.'
          hi: 'उपसर्ग अर्थ पलट सकता है: {{जानाति}} (जानता है) पर {{अवजानाति}} (तिरस्कार करता है); {{भवति}} (होता है) पर {{पराभवति}}
            (हारता है); {{नयति}} (ले जाता है) पर {{विनयति}} (सिखाता है)। हमेशा पूरे शब्द का अर्थ देखिए।'
      - id: i5
        sa: सः अवजानाति।
        label:
          en: Read it again with the meaning
          hi: अर्थ समझकर फिर पढ़ें
        meaning:
          en: He despises.
          hi: वह तिरस्कार करता है।
        words:
        - sa: सः
          gloss:
            en: he
            hi: वह
        - sa: अवजानाति
          gloss:
            en: despises
            hi: तिरस्कार करता है
          check:
            type: tinanta
            dhatu: ज्ञा
            lakara: Lat
            purusha: Prathama
            vacana: Eka
            prefixes:
            - अव

    rule:
      en: '{{उपसर्गाः क्रियायोगे}} and {{ते प्राग्धातोः}}: they join a verb and stand in front.'
      hi: '{{उपसर्गाः क्रियायोगे}} और {{ते प्राग्धातोः}}: वे क्रिया से जुड़ते हैं और आगे रहते हैं।'
    sutras:
    - 1.4.59
    - 1.4.80
    tag: core
    taught_in: pre.come#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 1.4.59, {{उपसर्गाः क्रियायोगे}}, names words like {{प्र}} and {{परा}} as {{उपसर्ग}} when they join a verb.
          1.4.80, {{ते प्राग्धातोः}}, says they stand before the root. Together they give {{आ + गच्छति}} = {{आगच्छति}}.
        hi: सूत्र 1.4.59, {{उपसर्गाः क्रियायोगे}}, {{प्र}}, {{परा}} जैसे शब्दों को {{उपसर्ग}} नाम देता है जब वे क्रिया से
          जुड़ें। 1.4.80, {{ते प्राग्धातोः}}, कहता है कि वे धातु से पहले रहते हैं। दोनों मिलकर {{आ + गच्छति}} = {{आगच्छति}}
          देते हैं।
      items:
      - id: i0
        sa: उपसर्गाः क्रियायोगे
      - id: i1
        sa: प्र
      - id: i2
        sa: परा
      - id: i3
        sa: उपसर्ग
      - id: i4
        sa: ते प्राग्धातोः
      - id: i5
        sa: आ + गच्छति
      - id: i6
        sa: आगच्छति

    hi: '{{उपगच्छति}}: {{उप}} = पास।'
  roman: after
  gate: true
  story:
    success:
      en: “उपगच्छति,” you say. The bead-spirit slides a bead onto a root, and the bead glows, and the root, which was lying
        quiet, stands up and walks to him. “It came,” he says, delighted. “It did what it was told.” Śuka claps both wings.
        “A bead,” he says, “and a journey.”
      hi: “उपगच्छति,” आप कहते हैं। मनके वाला भूत एक मनका धातु पर सरकाता है, और मनका चमकता है, और धातु, जो चुप पड़ी थी, उठकर
        उसके पास चल आती है। “आ गई,” वह प्रसन्नता से कहता है। “जो कहा गया, उसने वही किया।” शुक दोनों पंख ताली में मिलाता है।
        “एक मनका,” वह कहता है, “और एक यात्रा।”
    failure:

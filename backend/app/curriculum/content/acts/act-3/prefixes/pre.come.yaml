        hi: बाहर जाता है
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
        prefixes:
        - निस्
  term:
    sa: उपसर्गः
    meaning:
      en: a prefix on a verb
      hi: क्रिया के आगे लगने वाला शब्द

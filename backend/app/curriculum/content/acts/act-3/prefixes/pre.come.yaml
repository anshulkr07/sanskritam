- id: s1
  kind: story
  title:
    en: The tenth night
    hi: दसवीं रात
  depth: core
  image:
    brief: A small quick spirit sitting on a tree stump with strings of tiny glass beads around its neck and wrists, sliding
      a bead onto a larger bead marked with a root; Śuka cocking his head; Dādī and the Vetāla watching; firelight on the
      glass.
    alt:
      en: A bead-stringing spirit on a stump slides a glass bead onto a root while a parrot cocks his head
      hi: ठूँठ पर बैठा मनके पिरोता भूत, सिर टेढ़ा करता तोता
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - yojaka
    place: smashana
    ratio: '4:3'
    id: pre-come-s1
    text_in_image:
    - गम्
  narration:
    en: 'A small spirit sits on a stump clicking strings of glass beads around his neck, each bead marked with a little word.
      “आ,” he says, and slides a bead onto a root. “गच्छति” was “he goes”. Now he slides: “आगच्छति.” “He comes.” “नि-स्,”
      another bead: “निर्गच्छति.” “He goes out.” Śuka cocks his head. “Same root,” he says. “Different little word, different
      journey.”'
    hi: 'एक नन्हा भूत ठूँठ पर बैठा गले के काँच के मनकों की माला खटखटा रहा है, हर मनके पर एक छोटा शब्द। “आ,” वह कहता है और
      एक मनका धातु पर सरका देता है। “गच्छति” का अर्थ था ‘वह जाता है’। अब वह सरकाता है: “आगच्छति।” “वह आता है।” “निस्,” एक
      और मनका: “निर्गच्छति।” “वह बाहर जाता है।” शुक सिर टेढ़ा करता है। “वही धातु,” वह कहता है। “अलग छोटा शब्द, अलग यात्रा।”'
  lines:
  - speaker: dadi
    sa: आगच्छति। निर्गच्छति।
    gloss:
      en: He comes. He goes out.
      hi: वह आता है। वह बाहर जाता है।
- id: t1
  kind: teach
  title:
    en: A little word in front
    hi: आगे एक छोटा शब्द
  depth: core
  skills:
  - verb.upasarga
  body:
    en: 'A prefix is a short word set in front of a verb root, and it changes the meaning: {{गच्छति}} (he goes) becomes {{आगच्छति}}
      (he comes), {{निर्गच्छति}} (he goes out), {{उपगच्छति}} (he approaches). The prefix stays in front; the ending is the
      same. These prefixes are called {{उपसर्गाः}}.'
    hi: 'उपसर्ग धातु के आगे रखा छोटा शब्द है, और वह अर्थ बदल देता है: {{गच्छति}} (वह जाता है) से {{आगच्छति}} (वह आता है),
      {{निर्गच्छति}} (वह बाहर जाता है), {{उपगच्छति}} (वह पास जाता है)। उपसर्ग आगे रहता है; प्रत्यय वही रहता है। इन्हें {{उपसर्गाः}}
      कहते हैं।'
  examples:

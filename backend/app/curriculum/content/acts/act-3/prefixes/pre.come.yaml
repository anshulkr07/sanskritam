- id: p4
  kind: practice
  title:
    en: The bead
    hi: मनका
  depth: core
  skills:
  - verb.upasarga
  mode: choice
  prompt:
    en: “He approaches.” Which form?
    hi: ‘वह पास जाता है।’ कौन-सा रूप?
  explain:
    en: '{{उपगच्छति}}: {{उप}} = near.'
    hi: '{{उपगच्छति}}: {{उप}} = पास।'
  roman: after
  gate: true
  story:
    success:
      en: “उपगच्छति,” you say. The bead-spirit slides a bead onto a root, and the bead glows, and the root, which was lying quiet, stands up and walks to him. “It came,” he says, delighted. “It did what it was told.” Śuka claps both wings. “A bead,” he says, “and a journey.”
      hi: “उपगच्छति,” आप कहते हैं। मनके वाला भूत एक मनका धातु पर सरकाता है, और मनका चमकता है, और धातु, जो चुप पड़ी थी, उठकर उसके पास चल आती है। “आ गई,” वह प्रसन्नता से कहता है। “जो कहा गया, उसने वही किया।” शुक दोनों पंख ताली में मिलाता है। “एक मनका,” वह कहता है, “और एक यात्रा।”
    failure:
      en: 'The root stays still. “He approaches”: {{उपगच्छति}}.'
      hi: 'धातु स्थिर रहती है। ‘वह पास जाता है’: {{उपगच्छति}}।'
  options:
  - sa: आगच्छति
  - correct: true
    sa: उपगच्छति
  - sa: प्रतिगच्छति
- id: pn
  kind: teach
  title:
    en: Pāṇini's prefixes
    hi: पाणिनि के उपसर्ग
  depth: panini
  skills:
  - verb.upasarga
  sutras:
  - 1.4.59
  - 1.4.80
  body:
    en: Sūtra 1.4.59, {{उपसर्गाः क्रियायोगे}}, names words like {{प्र}} and {{परा}} as {{उपसर्ग}} when they join a verb. 1.4.80, {{ते प्राग्धातोः}}, says they stand before the root. Together they give {{आ + गच्छति}} = {{आगच्छति}}.
    hi: सूत्र 1.4.59, {{उपसर्गाः क्रियायोगे}}, {{प्र}}, {{परा}} जैसे शब्दों को {{उपसर्ग}} नाम देता है जब वे क्रिया से जुड़ें। 1.4.80, {{ते प्राग्धातोः}}, कहता है कि वे धातु से पहले रहते हैं। दोनों मिलकर {{आ + गच्छति}} = {{आगच्छति}} देते हैं।

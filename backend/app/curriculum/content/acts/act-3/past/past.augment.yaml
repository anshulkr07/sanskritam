        जहाँ आप खड़े हैं वहाँ से वन के दूर छोर तक। “वे गए,” वह फुसफुसाता है। “सचमुच गए। मुझे याद है।”
    failure:
      en: 'His footprints keep fading. “They went”: {{अगच्छन्}}.'

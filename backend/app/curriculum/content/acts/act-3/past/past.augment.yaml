cards:
- id: s1
  kind: story
  title:
    en: The second night
    hi: दूसरी रात
  depth: core
  image:
    brief: 'A burning-ground grove at night: a pale, almost see-through spirit walking backwards out of the dark, its edges
      fading like old ink, a trail of fading footprints behind it; the Vetāla hanging from the śiṃśapā tree yawning; Dādī
      and Śuka watching.'
    alt:
      en: A faint spirit walks backwards leaving fading footprints while the Vetāla yawns above
      hi: धुँधला भूत उलटा चलता मिटते निशान छोड़ता, ऊपर जम्हाई लेता वेताल
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - atitaka
    place: smashana
    ratio: '4:3'
    id: past-augment-s1
  narration:
    en: 'The next night the Vetāla stretches, yawns, and says: “Tell me about yesterday.” You open your mouth and find only
      present tense: he goes, he reads. A faint spirit, backwards-walking, comes shuffling out of the dark with a trail of
      fading footprints behind him. “अगच्छत्,” he sighs. “अपठत्.” “He went, he read,” Dādī translates. “The past has an extra
      letter in front.”'
    hi: 'अगली रात वेताल अँगड़ाई लेता है, जम्हाई लेता है, और कहता है: “मुझे बीते कल के बारे में बताओ।” आप मुँह खोलते हैं और
      पाते हैं कि केवल वर्तमान काल है: वह जाता है, वह पढ़ता है। अँधेरे से एक धुँधला भूत उलटा चलता हुआ सरकता आता है, पीछे मिटते
      पैरों के निशान। “अगच्छत्,” वह आह भरता है। “अपठत्।” “वह गया, उसने पढ़ा,” दादी अनुवाद करती हैं। “भूतकाल के आगे एक अतिरिक्त
      अक्षर लगता है।”'
  lines:
  - speaker: dadi
    sa: अगच्छत्। अपठत्।
    gloss:
      en: He went. He read.
      hi: वह गया। उसने पढ़ा।
- id: t1
  kind: teach
  title:
    en: The past with अ-
    hi: अ- वाला भूतकाल
  depth: core
  skills:
  - verb.lan
  body:
    en: 'For something that happened before today, put {{अ}} in front of the root and use the past endings: {{अगच्छत्}} (he
      went), {{अपठत्}} (he read), {{अवदत्}} (he spoke). This tense is {{लङ्}}. The {{अ}} is called the augment, {{अट्}}.'
    hi: 'जो आज से पहले हुआ, उसके लिए धातु के आगे {{अ}} लगाइए और भूतकाल के प्रत्यय लीजिए: {{अगच्छत्}} (वह गया), {{अपठत्}} (उसने
      पढ़ा), {{अवदत्}} (उसने कहा)। इस काल का नाम {{लङ्}} है। {{अ}} को आगम {{अट्}} कहते हैं।'
  examples:

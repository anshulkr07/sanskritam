- id: pn
  kind: teach
  title:
    en: Pāṇini's past
    hi: पाणिनि का भूतकाल
  depth: panini
  skills:
  - verb.lan
  sutras:
  - 3.2.111
  - 6.4.71
  - 3.4.100
  body:
    en: 'Sūtra 3.2.111, {{अनद्यतने लङ्}}, gives {{लङ्}} for a past not of today. 6.4.71, {{लुङ्लङ्लृङ्क्ष्वडुदात्तः}}, adds
      the augment {{अ}}. Then 3.4.100, {{इतश्च}}, drops the final {{-इ}} of the ending {{-ति}}, so {{-ति}} becomes {{-त्}}:
      {{अपठत्}}.'
    hi: 'सूत्र 3.2.111, {{अनद्यतने लङ्}}, आज से पहले के भूत के लिए {{लङ्}} देता है। 6.4.71, {{लुङ्लङ्लृङ्क्ष्वडुदात्तः}},
      आगम {{अ}} जोड़ता है। फिर 3.4.100, {{इतश्च}}, {{-ति}} प्रत्यय का अन्तिम {{-इ}} हटा देता है, इसलिए {{-ति}} {{-त्}} बनता
      है: {{अपठत्}}।'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'Sūtra 3.2.111, {{अनद्यतने लङ्}}, gives {{लङ्}} for a past not of today. 6.4.71, {{लुङ्लङ्लृङ्क्ष्वडुदात्तः}}, adds
        the augment {{अ}}. Then 3.4.100, {{इतश्च}}, drops the final {{-इ}} of the ending {{-ति}}, so {{-ति}} becomes {{-त्}}:
        {{अपठत्}}.'
      hi: 'सूत्र 3.2.111, {{अनद्यतने लङ्}}, आज से पहले के भूत के लिए {{लङ्}} देता है। 6.4.71, {{लुङ्लङ्लृङ्क्ष्वडुदात्तः}},
        आगम {{अ}} जोड़ता है। फिर 3.4.100, {{इतश्च}}, {{-ति}} प्रत्यय का अन्तिम {{-इ}} हटा देता है, इसलिए {{-ति}} {{-त्}} बनता
        है: {{अपठत्}}।'
    items:
    - id: i0
      sa: अनद्यतने लङ्
    - id: i1
      sa: लङ्
    - id: i2
      sa: लुङ्लङ्लृङ्क्ष्वडुदात्तः
    - id: i3
      sa: अ
    - id: i4
      sa: इतश्च
    - id: i5
      sa: -इ
    - id: i6
      sa: -ति
    - id: i7
      sa: -त्
    - id: i8
      sa: अपठत्
- id: sum
  kind: summary
  title:
    en: The past
    hi: भूतकाल
  depth: core
  points:
  - sa: अगच्छत् · अपठत्
    text:
      en: He went, he read.
      hi: वह गया, उसने पढ़ा।
  - sa: अ + धातु
    text:
      en: The augment goes in front.
      hi: आगम आगे लगता है।
  - sa: आगच्छत्
    text:
      en: 'With a prefix: he came.'
      hi: 'उपसर्ग सहित: वह आया।'

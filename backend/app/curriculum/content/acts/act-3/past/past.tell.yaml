      gloss:
        en: long ago
        hi: पुराने समय में
    - sa: एकः
      gloss:
        en: a
        hi: एक
    - sa: राजा
      gloss:
        en: king
        hi: राजा
      check:
        type: subanta
        stem: राजन्
        linga: Pum

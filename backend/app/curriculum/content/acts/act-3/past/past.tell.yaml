- id: s1
  kind: story
  title:
    en: A tale begins
    hi: एक कथा शुरू होती है
  depth: core
  image:
    brief: The Vetāla seated on a tree root, folded like a long grey umbrella, eyes closed, telling a tale; Dādī and Śuka
      sitting before him; the faint backwards-walking spirit crouched beside; at the dark edge of the trees Lubdhaka leaning
      in to listen, the lantern low.
    alt:
      en: A grey spirit sits on a root telling a tale while travellers listen and a man leans in from the dark
      hi: जड़ पर बैठा भूत कथा सुनाता, श्रोता यात्री और अँधेरे से झुकता एक आदमी
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - atitaka
    - lubdhaka
    place: smashana
    ratio: '4:3'
    id: past-tell-s1
  narration:
    en: '“Good,” says the Vetāla, and drops from his branch to sit on a root, folded like a long grey umbrella. “Now a tale.
      Every tale of mine begins the same way: आसीत्. ‘There was.’” His eyes close. “आसीत् कश्चित् राजा.” A king. In the trees
      Lubdhaka, listening from the dark, leans closer.'
    hi: '“अच्छा,” वेताल कहता है, और शाखा से उतरकर जड़ पर बैठ जाता है, एक लम्बे भूरे छाते की तरह मुड़ा हुआ। “अब एक कथा। मेरी
      हर कथा एक ही तरह शुरू होती है: आसीत्। ‘था।’” उसकी आँखें बन्द हो जाती हैं। “आसीत् कश्चित् राजा।” एक राजा। पेड़ों में
      अँधेरे से सुनता लुब्धक आगे झुक आता है।'
  lines:
  - speaker: vetala
    sa: आसीत्
    gloss:
      en: There was.
      hi: था।
    check:
      type: tinanta
      dhatu: अस्
      lakara: Lan
      purusha: Prathama
      vacana: Eka
- id: t1
  kind: teach
  title:
    en: There was
    hi: था
  depth: core
  skills:
  - verb.lan
  body:
    en: '{{आसीत्}} (he, she, it was; there was) is the past of {{अस्}}. A tale begins {{आसीत् कश्चित् राजा}}, “there was a
      king”. The other forms: {{आसन्}} (they were), {{आसम्}} (I was). {{अभवत्}} is the past of {{भू}}: “he became”.'
    hi: '{{आसीत्}} ({{अस्}} का भूतकाल) का अर्थ ‘था’ है। कथा यों शुरू होती है: {{आसीत् कश्चित् राजा}}, ‘एक राजा था’। अन्य रूप:
      {{आसन्}} (वे थे), {{आसम्}} (मैं था)। {{अभवत्}} {{भू}} का भूतकाल है: ‘वह बन गया’।'
  examples:
  - sa: पुरा एकः राजा आसीत्।
    meaning:
      en: Long ago there was a king.
      hi: पुराने समय में एक राजा था।

  mode: choice
  prompt:
    en: “They were.” Which form?
    hi: ‘वे थे।’ कौन-सा रूप?
  explain:
    en: '{{आसन्}}: they were.'
    hi: '{{आसन्}}: वे थे।'
  roman: after
  gate: true
  story:
    success:
      en: '“आसन्,” you say: “they were,” and the old spirit steps out of the dark one last time. Behind him, along the whole
        path, small lamps of memory kindle one by one: a king, a city, a forest, a tree. “Now it is true,” he says, and sits
        down on the root beside the Vetāla.'
      hi: '“आसन्,” आप कहते हैं: “वे थे,” और बूढ़ा भूत एक बार और अँधेरे से बाहर कदम रखता है। उसके पीछे पूरे रास्ते पर स्मृति
        के नन्हे दीप एक-एक करके जल उठते हैं: एक राजा, एक नगर, एक वन, एक वृक्ष। “अब यह सच है,” वह कहता है, और वेताल के पास
        जड़ पर बैठ जाता है।'
    failure:
      en: 'The lamps stay dark. “They were”: {{आसन्}}.'
      hi: 'दीप बुझे रहते हैं। ‘वे थे’: {{आसन्}}।'

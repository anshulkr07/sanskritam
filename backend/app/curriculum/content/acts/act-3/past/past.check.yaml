  - sa: अगच्छत्
  - correct: true
    sa: आगच्छत्
  - sa: आगच्छति
- id: p7
  kind: practice
  depth: core
  skills:
  - verb.lan
  mode: order
  prompt:
    en: 'Tell the old spirit: “Yesterday he went.”'
    hi: 'बूढ़े भूत से कहिए: ‘कल वह गया।’'
  explain:
    en: '{{ह्यः सः अगच्छत्}}: the spirit’s own sentence.'
    hi: '{{ह्यः सः अगच्छत्}}: भूत का अपना ही वाक्य।'
  roman: after
  gate: true
  story:
    success:
      en: “ह्यः सः अगच्छत्,” you say. Atītaka lifts his head. “Yes,” he says, as if finishing a sentence he began a hundred years ago. “And today? He is not here. Where did he go?” He gestures into the trees, then smiles, almost cheerfully. “श्वः सः गमिष्यति.” “Tomorrow he will go.” Dādī glances at the Vetāla. “That is not past at all.”
      hi: “ह्यः सः अगच्छत्,” आप कहते हैं। अतीतक सिर उठाता है। “हाँ,” वह कहता है, मानो सौ वर्ष पहले शुरू किया वाक्य पूरा कर रहा हो। “और आज? वह यहाँ नहीं है। कहाँ गया?” वह पेड़ों की ओर इशारा करता है, फिर लगभग हँसते हुए मुस्कराता है। “श्वः सः गमिष्यति।” “कल वह जाएगा।” दादी वेताल की ओर देखती हैं। “यह तो भूतकाल है ही नहीं।”
    failure:
      en: 'The old spirit shakes his head. His sentence: {{ह्यः सः अगच्छत्}}.'
      hi: 'बूढ़ा भूत सिर हिलाता है। उसका वाक्य: {{ह्यः सः अगच्छत्}}।'
  tokens:
  - ह्यः
  - सः
  - अगच्छत्

id: past.check
template: check
title:
  en: Tell what happened
  hi: बताइए क्या हुआ
title_sa: परीक्षा
minutes: 6
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - verb.lan
  mode: choice
  prompt:
    en: “He read.” Which form?
    hi: ‘उसने पढ़ा।’ कौन-सा रूप?
  explain:
    en: '{{अपठत्}}.'
    hi: '{{अपठत्}}।'
  roman: after
  options:
  - sa: पठति
  - correct: true
    sa: अपठत्
  - sa: पठतु
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: ह्यः बालकः गृहम् अगच्छत्।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: Yesterday the boy went home.
        hi: कल बालक घर गया।
      words:
      - sa: ह्यः
        gloss:
          en: yesterday
          hi: कल (बीता)
      - sa: बालकः
        gloss:
          en: boy
          hi: बालक
        check:
          type: subanta
          stem: बालक
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: गृहम्
        gloss:
          en: home
          hi: घर
        check:
          type: subanta
          stem: गृह
          linga: Napumsaka
          vibhakti: Dvitiya
          vacana: Eka
      - sa: अगच्छत्
        gloss:
          en: went
          hi: गया
        check:
          type: tinanta
          dhatu: गम्
          lakara: Lan
          purusha: Prathama
          vacana: Eka
    - id: i1
      sa: ह्यः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: yesterday
        hi: कल (बीता)
    - id: i2
      sa: बालकः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: boy
        hi: बालक
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{बालक}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{बालक}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
    - id: i3
      sa: गृहम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: home
        hi: घर
      check:
        type: subanta
        stem: गृह
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Eka
      feature:
        en: 'Stem: {{गृह}} · neuter · {{द्वितीया}} · singular'
        hi: 'प्रातिपदिक: {{गृह}} · {{नपुंसकलिंग}} · {{द्वितीया}} · {{एकवचन}}'
    - id: i4
      sa: अगच्छत्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: went
        hi: गया
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lan
        purusha: Prathama
        vacana: Eka
      feature:
        en: 'Root: {{गम्}} · singular · {{लङ्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{गम्}} · {{एकवचन}} · {{लङ्}} · प्रथमपुरुष'
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'For something that happened before today, put {{अ}} in front of the root and use the past endings: {{अगच्छत्}}
          (he went), {{अपठत्}} (he read), {{अवदत्}} (he spoke). This tense is {{लङ्}}. The {{अ}} is called the augment, {{अट्}}.'
        hi: 'जो आज से पहले हुआ, उसके लिए धातु के आगे {{अ}} लगाइए और भूतकाल के प्रत्यय लीजिए: {{अगच्छत्}} (वह गया), {{अपठत्}}
          (उसने पढ़ा), {{अवदत्}} (उसने कहा)। इस काल का नाम {{लङ्}} है। {{अ}} को आगम {{अट्}} कहते हैं।'
    - id: i7
      sa: ह्यः बालकः गृहम् अगच्छत्।
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: Yesterday the boy went home.
        hi: कल बालक घर गया।
      words:
      - sa: ह्यः
        gloss:
          en: yesterday
          hi: कल (बीता)
      - sa: बालकः
        gloss:
          en: boy
          hi: बालक
        check:
          type: subanta
          stem: बालक
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: गृहम्
        gloss:
          en: home
          hi: घर
        check:
          type: subanta
          stem: गृह
          linga: Napumsaka
          vibhakti: Dvitiya
          vacana: Eka
      - sa: अगच्छत्
        gloss:
          en: went
          hi: गया
        check:
          type: tinanta
          dhatu: गम्
          lakara: Lan
          purusha: Prathama
          vacana: Eka

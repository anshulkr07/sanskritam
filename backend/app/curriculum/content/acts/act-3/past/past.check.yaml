  mode: order
  prompt:
    en: 'Tell the old spirit: “Yesterday he went.”'
    hi: 'बूढ़े भूत से कहिए: ‘कल वह गया।’'
  explain:
    en: '{{ह्यः सः अगच्छत्}}: the spirit’s own sentence.'
    hi: '{{ह्यः सः अगच्छत्}}: भूत का अपना ही वाक्य।'
  roman: after
  gate: true
  story:
    success:
      en: “ह्यः सः अगच्छत्,” you say. Atītaka lifts his head. “Yes,” he says, as if finishing a sentence he began a hundred
        years ago. “And today? He is not here. Where did he go?” He gestures into the trees, then smiles, almost cheerfully.
        “श्वः सः गमिष्यति.” “Tomorrow he will go.” Dādī glances at the Vetāla. “That is not past at all.”

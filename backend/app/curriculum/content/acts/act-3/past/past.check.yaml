        रहा हो। “और आज? वह यहाँ नहीं है। कहाँ गया?” वह पेड़ों की ओर इशारा करता है, फिर लगभग हँसते हुए मुस्कराता है। “श्वः
        सः गमिष्यति।” “कल वह जाएगा।” दादी वेताल की ओर देखती हैं। “यह तो भूतकाल है ही नहीं।”

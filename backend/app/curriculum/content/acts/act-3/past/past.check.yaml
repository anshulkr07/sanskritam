  - verb.lan
  mode: choice
  prompt:
    en: “He came.” Which form?
    hi: ‘वह आया।’ कौन-सा रूप?
  explain:
    en: '{{आगच्छत्}}: prefix + augment + root.'
    hi: '{{आगच्छत्}}: उपसर्ग + आगम + धातु।'
  roman: after

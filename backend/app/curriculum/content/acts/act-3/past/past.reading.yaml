- id: p2
  kind: practice
  mode: choice
  skills: *id001
  prompt:
    en: Who speaks at the end of the passage?
    hi: अंश के अन्त में कौन बोलता है?
  explain:
    en: The corpse was in the tree, and the final sentence says that the corpse spoke.
    hi: पेड़ पर शव था, और अन्तिम वाक्य में शव बोला।
  options:
  - text:
      en: The corpse
      hi: शव
    correct: true
  - text:
      en: The tree
      hi: पेड़
    why:
      en: The corpse was in the tree, and the final sentence says that the corpse spoke.
      hi: पेड़ पर शव था, और अन्तिम वाक्य में शव बोला।
- id: end
  kind: summary
  points:
  - text:
      en: You followed the king from the city into the forest and understood the surprise at the end.
      hi: आपने नगर से वन तक राजा की कथा पढ़ी और अन्त का आश्चर्य समझा।

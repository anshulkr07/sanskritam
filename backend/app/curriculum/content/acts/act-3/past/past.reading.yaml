- id: p1
  kind: practice
  mode: choice
  skills: *id001
  prompt:
    en: Where did the king live before going to the forest?
    hi: वन जाने से पहले राजा कहाँ रहता था?
  explain:
    en: The second sentence says that he lived in the city. He went to the forest later.
    hi: दूसरे वाक्य में वह नगर में रहता था। बाद में वह वन गया।
  options:
  - text:
      en: In the city
      hi: नगर में
    correct: true
  - text:
      en: In a tree
      hi: पेड़ पर
    why:
      en: The second sentence says that he lived in the city. He went to the forest later.
      hi: दूसरे वाक्य में वह नगर में रहता था। बाद में वह वन गया।

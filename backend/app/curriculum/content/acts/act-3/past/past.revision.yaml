- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: verb.lan
    rule:
      en: '{{अनद्यतने लङ्}}, {{लुङ्लङ्लृङ्क्ष्वडुदात्तः}} and {{इतश्च}}: the tense, the augment and the dropped final vowel.'
      hi: '{{अनद्यतने लङ्}}, {{लुङ्लङ्लृङ्क्ष्वडुदात्तः}} और {{इतश्च}}: काल, आगम और हटा हुआ अन्तिम स्वर।'
    sutras:
    - 3.2.111
    - 6.4.71
    - 3.4.100
    tag: core
    taught_in: past.augment#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 3.2.111, {{अनद्यतने लङ्}}, gives {{लङ्}} for a past not of today. 6.4.71, {{लुङ्लङ्लृङ्क्ष्वडुदात्तः}},
          adds the augment {{अ}}. Then 3.4.100, {{इतश्च}}, drops the final {{-इ}} of the ending {{-ति}}, so {{-ति}} becomes
          {{-त्}}: {{अपठत्}}.'
        hi: 'सूत्र 3.2.111, {{अनद्यतने लङ्}}, आज से पहले के भूत के लिए {{लङ्}} देता है। 6.4.71, {{लुङ्लङ्लृङ्क्ष्वडुदात्तः}},
          आगम {{अ}} जोड़ता है। फिर 3.4.100, {{इतश्च}}, {{-ति}} प्रत्यय का अन्तिम {{-इ}} हटा देता है, इसलिए {{-ति}} {{-त्}}
          बनता है: {{अपठत्}}।'
      items:
      - id: i0
        sa: अनद्यतने लङ्
      - id: i1
        sa: लङ्
      - id: i2
        sa: लुङ्लङ्लृङ्क्ष्वडुदात्तः
      - id: i3
        sa: अ
      - id: i4
        sa: इतश्च
      - id: i5
        sa: -इ
      - id: i6
        sa: -ति
      - id: i7
        sa: -त्
      - id: i8
        sa: अपठत्

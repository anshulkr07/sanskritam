          en: long ago
          hi: पुराने समय में
      - id: i2
        sa: एकः
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: a
          hi: एक
      - id: i3
        sa: राजा
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: king
          hi: राजा
        check:
          type: subanta
          stem: राजन्
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
        feature:
          en: 'Stem: {{राजन्}} · masculine · {{प्रथमा}} · singular'
          hi: 'प्रातिपदिक: {{राजन्}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
        compare_from: राजन्
      - id: i4
        sa: आसीत्
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: was
          hi: था
        check:
          type: tinanta
          dhatu: अस्
          lakara: Lan
          purusha: Prathama
          vacana: Eka
        feature:
          en: 'Root: {{अस्}} · singular · {{लङ्}} · Third person ({{प्रथमपुरुष}})'
          hi: 'धातु: {{अस्}} · {{एकवचन}} · {{लङ्}} · प्रथमपुरुष'
        compare_from: अस्
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: '{{आसीत्}} (he, she, it was; there was) is the past of {{अस्}}. A tale begins {{आसीत् कश्चित् राजा}}, “there
            was a king”. The other forms: {{आसन्}} (they were), {{आसम्}} (I was). {{अभवत्}} is the past of {{भू}}: “he became”.'
          hi: '{{आसीत्}} ({{अस्}} का भूतकाल) का अर्थ ‘था’ है। कथा यों शुरू होती है: {{आसीत् कश्चित् राजा}}, ‘एक राजा था’।
            अन्य रूप: {{आसन्}} (वे थे), {{आसम्}} (मैं था)। {{अभवत्}} {{भू}} का भूतकाल है: ‘वह बन गया’।'
      - id: i7
        sa: पुरा एकः राजा आसीत्।
        label:
          en: Read it again with the meaning
          hi: अर्थ समझकर फिर पढ़ें
        meaning:
          en: Long ago there was a king.
          hi: पुराने समय में एक राजा था।

              hi: '{{आगच्छत्}} — सन्दर्भ के समय से पहले'
            start: 0
            end: 3
          anchor: 5
  - skill: verb.lan
    rule:
      en: 'Tales begin {{आसीत्}}: “there was”.'
      hi: 'कथाएँ {{आसीत्}} से शुरू होती हैं: ‘था’।'

- id: conditions
  kind: revision
  title:
    en: When to use which
    hi: कब कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: verb.lan
    rule:
      en: Use {{लङ्}} for something that happened before today; with a time word like {{ह्यः}} or {{पुरा}}.
      hi: आज से पहले की घटना के लिए {{लङ्}} का प्रयोग कीजिए; {{ह्यः}} या {{पुरा}} जैसे समय-शब्द के साथ।
    tag: good
    taught_in: past.augment#t1
    visuals:
    - id: v-linked-0
      kind: reading
      title:
        en: Follow the events
        hi: घटनाओं का क्रम समझें
      items:
      - id: i0
        sa: अहम् तम् अपश्यम्।
        meaning:
          en: I saw him.
          hi: मैंने उसे देखा।
        words:
        - sa: अहम्
          gloss:
            en: I
            hi: मैं
        - sa: तम्
          gloss:
            en: him
            hi: उसे
        - sa: अपश्यम्
          gloss:
            en: saw
            hi: देखा
          check:
            type: tinanta
            dhatu: दृश्
            lakara: Lan
            purusha: Uttama
            vacana: Eka
        diagram:
          kind: timeline
          events:
          - label:
              en: '{{अपश्यम्}} — before the reference time'
              hi: '{{अपश्यम्}} — सन्दर्भ के समय से पहले'
            start: 0
            end: 3
          anchor: 5
  - skill: verb.lan
    rule:
      en: 'With a prefix the augment sits between prefix and root: {{आगच्छत्}}.'
      hi: 'उपसर्ग हो तो आगम उपसर्ग और धातु के बीच आता है: {{आगच्छत्}}।'
    tag: good
    taught_in: past.augment#t2
    visuals:

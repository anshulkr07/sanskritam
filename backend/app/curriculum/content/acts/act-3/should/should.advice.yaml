cards:
- id: s1
  kind: story
  title:
    en: The fourth night
    hi: चौथी रात
  depth: core
  image:
    brief: 'The burning-ground grove at night: the Vetāla seated on a root rubbing his hands; a tiny round spirit of old paper
      in round spectacles with scrolls under both arms and one finger wagging at the sky; Dādī and Śuka beside you; a faint
      image in the smoke of a king and a hungry beggar on a lane.'
    alt:
      en: A tiny paper spirit with spectacles wags a finger at the sky while the Vetāla rubs his hands
      hi: चश्मे वाला नन्हा काग़ज़ी भूत आकाश की ओर उँगली हिलाता, हाथ मलता वेताल
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - vidhika
    place: smashana
    ratio: '4:3'
    id: should-advice-s1
  narration:
    en: '“A riddle,” says the Vetāla, and rubs his hands. “A king walks alone at night and meets a beggar who is hungry. What
      should he do?” Before you can think, a tiny round spirit in round spectacles waves a finger at the sky: “गच्छेत्! पठेत्!
      वदेत्!” “Should go, should read, should say,” Dādī translates. “He gives rules, not facts.”'
    hi: '“एक पहेली,” वेताल कहता है, और हाथ मलता है। “एक राजा रात को अकेला चलता है और एक भूखे भिखारी से मिलता है। उसे क्या
      करना चाहिए?” आप कुछ सोचें, उससे पहले गोल चश्मे वाला एक नन्हा गोल भूत आकाश की ओर उँगली हिलाता है: “गच्छेत्! पठेत्! वदेत्!”
      “जाना चाहिए, पढ़ना चाहिए, कहना चाहिए,” दादी अनुवाद करती हैं। “वह नियम देता है, तथ्य नहीं।”'
  lines:
  - speaker: dadi
    sa: सः गच्छेत्। सः पठेत्।
    gloss:
      en: He should go. He should read.
      hi: उसे जाना चाहिए। उसे पढ़ना चाहिए।
- id: t1
  kind: teach
  title:
    en: The mood of “should”
    hi: ‘चाहिए’ का काल-विधान
  depth: core
  skills:
  - verb.vidhilin
  body:
    en: '{{विधिलिङ्}} gives advice, rules and what is fitting: {{पठेत्}} (he should read), {{गच्छेत्}} (he should go), {{वदेत्}}
      (he should say). The sign is {{-ए-}} between the root and the ending: {{पठ + ए + त्}}.'
    hi: '{{विधिलिङ्}} सलाह, नियम और जो उचित है, वह बताता है: {{पठेत्}} (उसे पढ़ना चाहिए), {{गच्छेत्}} (उसे जाना चाहिए), {{वदेत्}}
      (उसे कहना चाहिए)। चिह्न {{-ए-}} है, धातु और प्रत्यय के बीच: {{पठ + ए + त्}}।'
  examples:

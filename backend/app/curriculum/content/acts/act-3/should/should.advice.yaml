  mode: choice
  prompt:
    en: “They should read.” Which form?
    hi: ‘उन्हें पढ़ना चाहिए।’ कौन-सा रूप?
  explain:
    en: '{{पठेयुः}}: they, many.'
    hi: '{{पठेयुः}}: वे, अनेक।'
  roman: after
  gate: true
  story:
    success:
      en: “पठेयुः,” you say. The little round spirit stops wagging his finger, takes off his spectacles, wipes them on a scroll,
        and puts them on again, as if he cannot quite believe it. “Correct,” he says in a very small voice. “A rule, correctly
        stated.” The Vetāla nods slowly. “And the king? I will not tell you yet.”
      hi: “पठेयुः,” आप कहते हैं। नन्हा गोल भूत उँगली हिलाना रोक देता है, चश्मा उतारता है, किसी पोथी से पोंछता है, और फिर पहन
        लेता है, मानो विश्वास न हो रहा हो। “सही,” वह बहुत धीमी आवाज़ में कहता है। “एक नियम, ठीक कहा हुआ।” वेताल धीरे से सिर
        हिलाता है। “और राजा? अभी मैं नहीं बताऊँगा।”
    failure:
      en: 'He keeps wagging his finger. They, many: {{पठेयुः}}.'
      hi: 'वह उँगली हिलाता रहता है। वे, अनेक: {{पठेयुः}}।'

- id: t2
  kind: teach
  title:
    en: May, might, would
    hi: सकता है, शायद, होता
  depth: core
  skills:
  - verb.vidhilin
  body:
    en: 'The same forms also say what may be: {{सः आगच्छेत्}}, “he may come”; and ask for advice: {{किम् अहं गच्छेयम्}}, “should
      I go?” Context tells whether it is advice, possibility or a question.'
    hi: 'वही रूप जो हो सकता है, वह भी कहते हैं: {{सः आगच्छेत्}}, ‘वह आ सकता है’; और सलाह माँगते हैं: {{किम् अहं गच्छेयम्}},
      ‘क्या मैं जाऊँ?’ प्रसंग बताता है कि सलाह है, सम्भावना है या प्रश्न।'
  examples:

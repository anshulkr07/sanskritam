- id: t2
  kind: teach
  title:
    en: 'Maybe: {{स्यात्}}'
    hi: 'शायद: {{स्यात्}}'
  depth: core
  skills:
  - verb.vidhilin
  body:
    en: '{{स्यात्}} is the {{लिङ्}} of {{अस्}}: “it may be, perhaps”. {{स्युः}} is “they may be”. Often with {{यदि}} (if): {{यदि सः पठेत् तर्हि जानीयात्}}, “if he were to read, he would know”.'
    hi: '{{स्यात्}} {{अस्}} का {{लिङ्}} है: ‘हो सकता है, शायद’। {{स्युः}} का अर्थ ‘वे हो सकते हैं’। अक्सर {{यदि}} (अगर) के साथ: {{यदि सः पठेत् तर्हि जानीयात्}}, ‘अगर वह पढ़े तो जान जाए’।'
  examples:
  - sa: स्यात् सः पण्डितः।
    meaning:
      en: Perhaps he is a scholar.
      hi: शायद वह विद्वान् है।
    words:
    - sa: स्यात्
      gloss:
        en: perhaps
        hi: शायद
    - sa: सः
      gloss:
        en: he
        hi: वह
    - sa: पण्डितः
      gloss:
        en: a scholar
        hi: विद्वान्
  - sa: यदि सः पठेत् तर्हि सः जानीयात्।
    meaning:
      en: If he were to read, he would know.
      hi: अगर वह पढ़े तो वह जान जाए।
    words:
    - sa: यदि
      gloss:
        en: if
        hi: यदि
    - sa: सः
      gloss:
        en: he
        hi: वह
    - sa: पठेत्
      gloss:
        en: were to read
        hi: पढ़े
      check:
        type: tinanta
        dhatu: पठ्
        lakara: VidhiLin
        purusha: Prathama
        vacana: Eka
    - sa: तर्हि
      gloss:
        en: then
        hi: तो
    - sa: सः
      gloss:
        en: he
        hi: वह
    - sa: जानीयात्
      gloss:
        en: would know
        hi: जान जाए
      check:
        type: tinanta
        dhatu: ज्ञा
        lakara: VidhiLin
        purusha: Prathama
        vacana: Eka

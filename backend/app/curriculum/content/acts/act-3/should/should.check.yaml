- id: p7
  kind: practice
  depth: core
  skills:
  - verb.vidhilin
  mode: order
  prompt:
    en: 'Tell Vidhika the king''s rule: “A king should protect his people.”'
    hi: 'विधिक को राजा का नियम बताइए: ‘राजा को प्रजा की रक्षा करनी चाहिए।’'
  explain:
    en: '{{राजा प्रजां रक्षेत्}}.'
    hi: '{{राजा प्रजां रक्षेत्}}।'
  roman: after
  gate: true
  story:
    success:
      en: '“राजा प्रजां रक्षेत्,” you say, and Vidhika drops all his scrolls. They roll across the leaves and unroll by themselves,
        and every one is blank except one line: the rule you just spoke. “Mine,” he breathes. “I wrote it a thousand years
        ago and no one would read it.” The Vetāla grins at the ceiling of branches. “That is my answer to the riddle,” he
        says. “The king should feed the beggar.” Then, as the little spirit hurries off with his scrolls: “स उवाच,” says the
        Vetāla, to no one. “He said.”'
      hi: '“राजा प्रजां रक्षेत्,” आप कहते हैं, और विधिक अपनी सारी पोथियाँ गिरा देता है। वे पत्तों पर लुढ़कती हैं और अपने-आप
        खुल जाती हैं, और हर एक कोरी है सिवाय एक पंक्ति के: जो नियम आपने अभी कहा। “मेरा,” वह साँस लेते हुए कहता है। “मैंने
        इसे हज़ार वर्ष पहले लिखा था और किसी ने नहीं पढ़ा।” वेताल शाखाओं की छत पर मुस्कराता है। “यही मेरी पहेली का उत्तर है,”
        वह कहता है। “राजा को भिखारी को भोजन देना चाहिए।” फिर, जब नन्हा भूत अपनी पोथियाँ लिए दौड़ जाता है: “स उवाच,” वेताल
        किसी से नहीं कहता। “उसने कहा।”'
    failure:
      en: 'The scrolls stay rolled. The rule: {{राजा प्रजां रक्षेत्}}.'
      hi: 'पोथियाँ बँधी रहती हैं। नियम: {{राजा प्रजां रक्षेत्}}।'

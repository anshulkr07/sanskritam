id: should.check
template: check
title:
  en: Say the rule
  hi: नियम बताइए
title_sa: परीक्षा
minutes: 6
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - verb.vidhilin
  mode: choice
  prompt:
    en: “He should go.” Which form?
    hi: ‘उसे जाना चाहिए।’ कौन-सा रूप?
  explain:
    en: '{{गच्छेत्}}.'
    hi: '{{गच्छेत्}}।'
  roman: after
  options:
  - sa: गच्छति
  - sa: गमिष्यति
  - correct: true
    sa: गच्छेत्
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: राजा प्रजाम् रक्षेत्।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: A king should protect his people.
        hi: राजा को प्रजा की रक्षा करनी चाहिए।
      words:
      - sa: राजा
        gloss:
          en: king
          hi: राजा
        check:
          type: subanta
          stem: राजन्
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: प्रजाम्
        gloss:
          en: his people
          hi: प्रजा
        check:
          type: subanta
          stem: प्रजा
          linga: Stri
          vibhakti: Dvitiya
          vacana: Eka
      - sa: रक्षेत्
        gloss:
          en: should protect
          hi: रक्षा करे
        check:
          type: tinanta
          dhatu: रक्ष्
          lakara: VidhiLin
          purusha: Prathama
          vacana: Eka
    - id: i1
      sa: राजा
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: king
        hi: राजा
      check:
        type: subanta
        stem: राजन्
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{राजन्}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{राजन्}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
      compare_from: राजन्
    - id: i2
      sa: प्रजाम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: his people
        hi: प्रजा
      check:
        type: subanta
        stem: प्रजा
        linga: Stri
        vibhakti: Dvitiya
        vacana: Eka
      feature:
        en: 'Stem: {{प्रजा}} · feminine · {{द्वितीया}} · singular'
        hi: 'प्रातिपदिक: {{प्रजा}} · {{स्त्रीलिंग}} · {{द्वितीया}} · {{एकवचन}}'
      compare_from: प्रजा
    - id: i3
      sa: रक्षेत्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: should protect
        hi: रक्षा करे
      check:
        type: tinanta
        dhatu: रक्ष्
        lakara: VidhiLin
        purusha: Prathama
        vacana: Eka
      feature:
        en: 'Root: {{रक्ष्}} · singular · {{विधिलिङ्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{रक्ष्}} · {{एकवचन}} · {{विधिलिङ्}} · प्रथमपुरुष'
      compare_from: रक्ष्
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: '{{विधिलिङ्}} gives advice, rules and what is fitting: {{पठेत्}} (he should read), {{गच्छेत्}} (he should go),
          {{वदेत्}} (he should say). The sign is {{-ए-}} between the root and the ending: {{पठ + ए + त्}}.'
        hi: '{{विधिलिङ्}} सलाह, नियम और जो उचित है, वह बताता है: {{पठेत्}} (उसे पढ़ना चाहिए), {{गच्छेत्}} (उसे जाना चाहिए),
          {{वदेत्}} (उसे कहना चाहिए)। चिह्न {{-ए-}} है, धातु और प्रत्यय के बीच: {{पठ + ए + त्}}।'
    - id: i6
      sa: राजा प्रजाम् रक्षेत्।
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: A king should protect his people.
        hi: राजा को प्रजा की रक्षा करनी चाहिए।
      words:
      - sa: राजा
        gloss:
          en: king
          hi: राजा
        check:
          type: subanta
          stem: राजन्
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: प्रजाम्
        gloss:
          en: his people
          hi: प्रजा
        check:
          type: subanta
          stem: प्रजा
          linga: Stri
          vibhakti: Dvitiya
          vacana: Eka
      - sa: रक्षेत्
        gloss:
          en: should protect
          hi: रक्षा करे
        check:
          type: tinanta
          dhatu: रक्ष्
          lakara: VidhiLin
          purusha: Prathama
          vacana: Eka

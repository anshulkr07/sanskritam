- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: verb.vidhilin
    rule:
      en: '{{विधिनिमन्त्रणामन्त्रणाधीष्टसंप्रश्नप्रार्थनेषु लिङ्}} gives {{लिङ्}}; {{यासुट् परस्मैपदेषूदात्तो ङिच्च}} adds
        {{यास्}}; {{अतो येयः}} and {{आद्गुणः}} make {{ए}}.'
      hi: '{{विधिनिमन्त्रणामन्त्रणाधीष्टसंप्रश्नप्रार्थनेषु लिङ्}} {{लिङ्}} देता है; {{यासुट् परस्मैपदेषूदात्तो ङिच्च}} {{यास्}}
        जोड़ता है; {{अतो येयः}} और {{आद्गुणः}} {{ए}} बनाते हैं।'
    sutras:
    - 3.3.161
    - 3.4.103
    - 7.2.80
    - 6.1.87
    tag: core
    taught_in: should.advice#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 3.3.161, {{विधिनिमन्त्रणामन्त्रणाधीष्टसंप्रश्नप्रार्थनेषु लिङ्}}, gives {{लिङ्}} for advice, invitation
          and request. 3.4.103, {{यासुट् परस्मैपदेषूदात्तो ङिच्च}}, adds {{यास्}}; 7.2.80, {{अतो येयः}}, makes {{या}} into
          {{इय्}}; 6.1.87, {{आद्गुणः}}, joins {{अ + इ}} into {{ए}}: {{पठेत्}}.'
        hi: 'सूत्र 3.3.161, {{विधिनिमन्त्रणामन्त्रणाधीष्टसंप्रश्नप्रार्थनेषु लिङ्}}, सलाह, निमन्त्रण और प्रार्थना के लिए {{लिङ्}}
          देता है। 3.4.103, {{यासुट् परस्मैपदेषूदात्तो ङिच्च}}, {{यास्}} जोड़ता है; 7.2.80, {{अतो येयः}}, {{या}} को {{इय्}}
          कर देता है; 6.1.87, {{आद्गुणः}}, {{अ + इ}} को {{ए}} बना देता है: {{पठेत्}}।'
      items:
      - id: i0
        sa: विधिनिमन्त्रणामन्त्रणाधीष्टसंप्रश्नप्रार्थनेषु लिङ्

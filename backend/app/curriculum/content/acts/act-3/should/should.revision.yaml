- id: conditions
  kind: revision
  title:
    en: When to use which
    hi: कब कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: verb.vidhilin
    rule:
      en: 'For advice and duties: {{पठेत्}}; with {{न}}: “should not”.'
      hi: 'सलाह और कर्तव्य के लिए: {{पठेत्}}; {{न}} के साथ: ‘नहीं चाहिए’।'
    tag: good
    taught_in: should.rules#t1
    visuals:
    - id: v-linked-0
      kind: worked
      title:
        en: Read, examine, understand
        hi: पढ़ें, समझें, फिर पढ़ें
      items:
      - id: i0
        sa: सत्यम् ब्रूयात्।
        label:
          en: Read the whole example
          hi: पूरा उदाहरण पढ़ें
        meaning:
          en: One should speak the truth.
          hi: सत्य बोलना चाहिए।
        words:
        - sa: सत्यम्
          gloss:
            en: truth
            hi: सत्य
        - sa: ब्रूयात्
          gloss:
            en: should speak
            hi: बोले
          check:
            type: tinanta
            dhatu: ब्रू
            lakara: VidhiLin
            purusha: Prathama
            vacana: Eka
      - id: i1
        sa: सत्यम्
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: truth
          hi: सत्य
      - id: i2
        sa: ब्रूयात्
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: should speak
          hi: बोले
        check:
          type: tinanta
          dhatu: ब्रू
          lakara: VidhiLin
          purusha: Prathama
          vacana: Eka
        feature:
          en: 'Root: {{ब्रू}} · singular · {{विधिलिङ्}} · Third person ({{प्रथमपुरुष}})'
          hi: 'धातु: {{ब्रू}} · {{एकवचन}} · {{विधिलिङ्}} · प्रथमपुरुष'
        compare_from: ब्रू
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: 'The old law-books state duties with {{विधिलिङ्}}: {{ब्रूयात्}} (one should speak), {{न ब्रूयात्}} (one should
            not speak). Add {{न}} to say “should not”. {{ब्रू}} is “say”, and its {{लिङ्}} is {{ब्रूयात्}}.'
          hi: 'प्राचीन धर्मशास्त्र कर्तव्य {{विधिलिङ्}} से बताते हैं: {{ब्रूयात्}} (बोलना चाहिए), {{न ब्रूयात्}} (नहीं बोलना
            चाहिए)। ‘नहीं चाहिए’ के लिए {{न}} जोड़िए। {{ब्रू}} का अर्थ ‘कहना’ है, और उसका {{लिङ्}} {{ब्रूयात्}} है।'
      - id: i5
        sa: सत्यम् ब्रूयात्।
        label:
          en: Read it again with the meaning
          hi: अर्थ समझकर फिर पढ़ें
        meaning:
          en: One should speak the truth.
          hi: सत्य बोलना चाहिए।
        words:
        - sa: सत्यम्
          gloss:
            en: truth
            hi: सत्य
        - sa: ब्रूयात्
          gloss:
            en: should speak
            hi: बोले
          check:
            type: tinanta
            dhatu: ब्रू
            lakara: VidhiLin
            purusha: Prathama
            vacana: Eka
  - skill: verb.vidhilin
    rule:
      en: For “perhaps” use {{स्यात्}}; for “if … then …” both halves take {{लिङ्}}.
      hi: ‘शायद’ के लिए {{स्यात्}}; ‘यदि … तो …’ में दोनों भाग {{लिङ्}} लेते हैं।
    tag: good
    taught_in: should.rules#t2
    visuals:
    - id: v-linked-1
      kind: worked
      title:
        en: Read, examine, understand
        hi: पढ़ें, समझें, फिर पढ़ें
      items:
      - id: i0
        sa: स्यात् सः पण्डितः।
        label:
          en: Read the whole example
          hi: पूरा उदाहरण पढ़ें
        meaning:
          en: Perhaps he is a scholar.
          hi: शायद वह विद्वान् है।
        words:
        - sa: स्यात्
          gloss:
            en: perhaps
            hi: शायद
        - sa: सः
          gloss:
            en: he
            hi: वह
        - sa: पण्डितः
          gloss:
            en: a scholar
            hi: विद्वान्
      - id: i1
        sa: स्यात्
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: perhaps
          hi: शायद
      - id: i2
        sa: सः
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: he
          hi: वह
      - id: i3
        sa: पण्डितः
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: a scholar
          hi: विद्वान्
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: '{{स्यात्}} is the {{लिङ्}} of {{अस्}}: “it may be, perhaps”. {{स्युः}} is “they may be”. Often with {{यदि}}
            (if): {{यदि सः पठेत् तर्हि जानीयात्}}, “if he were to read, he would know”.'
          hi: '{{स्यात्}} {{अस्}} का {{लिङ्}} है: ‘हो सकता है, शायद’। {{स्युः}} का अर्थ ‘वे हो सकते हैं’। अक्सर {{यदि}} (अगर)
            के साथ: {{यदि सः पठेत् तर्हि जानीयात्}}, ‘अगर वह पढ़े तो जान जाए’।'
      - id: i6
        sa: स्यात् सः पण्डितः।
        label:
          en: Read it again with the meaning
          hi: अर्थ समझकर फिर पढ़ें
        meaning:
          en: Perhaps he is a scholar.
          hi: शायद वह विद्वान् है।
        words:
        - sa: स्यात्
          gloss:
            en: perhaps
            hi: शायद
        - sa: सः
          gloss:
            en: he
            hi: वह
        - sa: पण्डितः
          gloss:
            en: a scholar
            hi: विद्वान्

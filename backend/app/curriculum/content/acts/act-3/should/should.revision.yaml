id: should.revision
template: revision
title:
  en: Everything about “should”
  hi: ‘चाहिए’ के बारे में सब कुछ
title_sa: विधिलिङ्सङ्ग्रहः
minutes: 6
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: core
  kind: revision
  title:
    en: The “should” forms
    hi: ‘चाहिए’ के रूप
  depth: core
  section: core
  rows:
  - skill: verb.vidhilin
    rule:
      en: '{{पठ्}} in {{विधिलिङ्}}: {{पठेत् पठेताम् पठेयुः}}, {{पठेः पठेतम् पठेत}}, {{पठेयम् पठेव पठेम}}.'
      hi: '{{पठ्}} का {{विधिलिङ्}}: {{पठेत् पठेताम् पठेयुः}}, {{पठेः पठेतम् पठेत}}, {{पठेयम् पठेव पठेम}}।'
    sutras:
    - 3.3.161
    - 3.4.103
    - 7.2.80
    - 6.1.87
    tag: core
    taught_in: should.advice#tb1
  - skill: verb.vidhilin
    rule:
      en: '{{अस्}}: {{स्यात् स्याताम् स्युः}}; {{ब्रू}}: {{ब्रूयात्}}.'
      hi: '{{अस्}}: {{स्यात् स्याताम् स्युः}}; {{ब्रू}}: {{ब्रूयात्}}।'
    tag: core
    taught_in: should.rules#tb1
- id: conditions
  kind: revision
  title:
    en: When to use which
    hi: कब कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: verb.vidhilin
    rule:
      en: 'For advice and duties: {{पठेत्}}; with {{न}}: “should not”.'
      hi: 'सलाह और कर्तव्य के लिए: {{पठेत्}}; {{न}} के साथ: ‘नहीं चाहिए’।'
    tag: good
    taught_in: should.rules#t1
  - skill: verb.vidhilin
    rule:
      en: For “perhaps” use {{स्यात्}}; for “if … then …” both halves take {{लिङ्}}.
      hi: ‘शायद’ के लिए {{स्यात्}}; ‘यदि … तो …’ में दोनों भाग {{लिङ्}} लेते हैं।
    tag: good
    taught_in: should.rules#t2
- id: exceptions
  kind: revision
  title:
    en: Odd cases
    hi: विचित्र स्थितियाँ
  depth: core
  section: exceptions
  rows:
  - skill: verb.vidhilin
    rule:
      en: 'Roots of the {{अदादि}} and some other classes take {{-या-}}: {{कृ}} gives {{कुर्यात्}}, {{ज्ञा}} gives {{जानीयात्}}, {{ब्रू}} gives {{ब्रूयात्}}.'
      hi: '{{अदादि}} और कुछ अन्य गणों की धातुएँ {{-या-}} लेती हैं: {{कृ}} से {{कुर्यात्}}, {{ज्ञा}} से {{जानीयात्}}, {{ब्रू}} से {{ब्रूयात्}}।'
    example:
      sa: कुर्यात्
      meaning:
        en: he should do
        hi: उसे करना चाहिए
      check:
        type: tinanta
        dhatu: कृ
        lakara: VidhiLin
        purusha: Prathama
        vacana: Eka
    tag: rare
    new_here: true
  - skill: verb.vidhilin
    rule:
      en: 'For verbs of the “for oneself” kind the endings change: {{सेवेत}}, {{कुर्वीत}}. You will meet these in the ātmanepada unit.'
      hi: '“अपने लिए” वाली क्रियाओं में प्रत्यय बदलते हैं: {{सेवेत}}, {{कुर्वीत}}। ये आत्मनेपद इकाई में मिलेंगे।'
    example:
      sa: सेवेत
      meaning:
        en: he should serve
        hi: उसे सेवा करनी चाहिए
      check:
        type: tinanta
        dhatu: सेव्
        lakara: VidhiLin
        purusha: Prathama
        vacana: Eka
    tag: rare
    new_here: true
- id: mistakes
  kind: revision
  title:
    en: Common mistakes
    hi: आम भूलें
  depth: core
  section: mistakes
  rows:
  - skill: verb.vidhilin
    rule:
      en: 'Do not use {{पठति}} for advice: it only says what is happening.'
      hi: 'सलाह के लिए {{पठति}} मत लीजिए: वह केवल हो रही बात बताता है।'
    tag: core
    taught_in: should.advice#p1
  - skill: verb.vidhilin
    rule:
      en: 'Do not forget the {{न}}: {{सत्यं ब्रूयात्}} and {{न सत्यम् अप्रियं ब्रूयात्}} say opposite things.'
      hi: '{{न}} मत भूलिए: {{सत्यं ब्रूयात्}} और {{न सत्यम् अप्रियं ब्रूयात्}} उलटी बातें कहते हैं।'
    tag: core
    taught_in: should.rules#p3
- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: verb.vidhilin
    rule:
      en: '{{विधिनिमन्त्रणामन्त्रणाधीष्टसंप्रश्नप्रार्थनेषु लिङ्}} gives {{लिङ्}}; {{यासुट् परस्मैपदेषूदात्तो ङिच्च}} adds {{यास्}}; {{अतो येयः}} and {{आद्गुणः}} make {{ए}}.'
      hi: '{{विधिनिमन्त्रणामन्त्रणाधीष्टसंप्रश्नप्रार्थनेषु लिङ्}} {{लिङ्}} देता है; {{यासुट् परस्मैपदेषूदात्तो ङिच्च}} {{यास्}} जोड़ता है; {{अतो येयः}} और {{आद्गुणः}} {{ए}} बनाते हैं।'
    sutras:
    - 3.3.161
    - 3.4.103
    - 7.2.80
    - 6.1.87
    tag: core
    taught_in: should.advice#pn
- id: sheet
  kind: revision
  title:
    en: Quick sheet
    hi: एक नज़र में
  depth: core
  section: quick_sheet
  rows:
  - skill: verb.vidhilin
    formula: पठेत् · पठेः · पठेयम् · पठेयुः
    rule:
      en: should
      hi: चाहिए
    tag: core
    taught_in: should.advice#tb1
  - skill: verb.vidhilin
    formula: सत्यं ब्रूयात् · न ब्रूयात् · स्यात्
    rule:
      en: rules and perhaps
      hi: नियम और शायद
    tag: core
    taught_in: should.rules#tb1

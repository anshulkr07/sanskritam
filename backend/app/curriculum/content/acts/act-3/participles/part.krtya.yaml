- id: p5
  kind: practice
  title:
    en: The duty word
    hi: कर्तव्य का शब्द
  depth: core
  skills:
  - krt.krtya
  mode: choice
  prompt:
    en: “The truth must be spoken.” Which sentence?
    hi: ‘सत्य बोलना चाहिए।’ कौन-सा वाक्य?
  explain:
    en: '{{वक्तव्यम्}}: must be said.'
    hi: '{{वक्तव्यम्}}: कहा जाना चाहिए।'
  roman: after
  gate: true
  story:
    success:
      en: “सत्यं वक्तव्यम्,” you say, and the Vetāla, who has not stopped smiling for four nights, stops. “The truth must be spoken,” he says slowly. “Yes.” The paper-fan spirit shuts all his folds at once and holds them closed. “Gone, going, done, to do, having done,” he says. “All in one word, each. You have opened me.”
      hi: “सत्यं वक्तव्यम्,” आप कहते हैं, और वेताल, जो चार रातों से मुस्कराना नहीं रोक पाया था, रुक जाता है। “सत्य बोलना चाहिए,” वह धीरे से कहता है। “हाँ।” काग़ज़ी पंखे वाला भूत अपनी सब तहें एक साथ बन्द करके पकड़े रहता है। “गया, जाता हुआ, किया, करने को, करके,” वह कहता है। “हर एक एक शब्द में। आपने मुझे खोल दिया।”
    failure:
      en: 'The folds stay open. “The truth must be spoken”: {{सत्यं वक्तव्यम्}}.'
      hi: 'तहें खुली रहती हैं। ‘सत्य बोलना चाहिए’: {{सत्यं वक्तव्यम्}}।'
  options:
  - sa: सत्यम् उक्तम्
  - sa: सत्यं वदति
  - correct: true
    sa: सत्यं वक्तव्यम्
- id: pn
  kind: teach
  title:
    en: Pāṇini's “ought”
    hi: पाणिनि का ‘चाहिए’
  depth: panini
  skills:
  - krt.krtya
  sutras:
  - 3.1.96
  - 3.1.97
  - 3.1.124
  - 3.4.70
  body:
    en: Sūtra 3.1.96, {{तव्यत्तव्यानीयरः}}, gives {{तव्यत्}}, {{तव्य}} and {{अनीयर्}}; 3.1.97, {{अचो यत्}}, gives {{यत्}} after a root ending in a vowel, and 3.1.124, {{ऋहलोर्ण्यत्}}, gives {{ण्यत्}}. 3.4.70, {{तयोरेव कृत्यक्तखलर्थाः}}, says the “must” words state the object or the bare action.
    hi: सूत्र 3.1.96, {{तव्यत्तव्यानीयरः}}, {{तव्यत्}}, {{तव्य}} और {{अनीयर्}} देता है; 3.1.97, {{अचो यत्}}, स्वरान्त धातु के बाद {{यत्}} देता है, और 3.1.124, {{ऋहलोर्ण्यत्}}, {{ण्यत्}} देता है। 3.4.70, {{तयोरेव कृत्यक्तखलर्थाः}}, कहता है कि ‘चाहिए’ वाले शब्द कर्म या केवल क्रिया को कहते हैं।

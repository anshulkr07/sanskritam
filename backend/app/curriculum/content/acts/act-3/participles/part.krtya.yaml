- id: s1
  kind: story
  title:
    en: The duty word
    hi: कर्तव्य का शब्द
  depth: core
  image:
    brief: The Vetāla seated straight on a root with a solemn expression; the paper-fan spirit unfolding his last fold, which carries three lines of writing; Dādī and Śuka listening; firelight.
    alt:
      en: A grey spirit sits straight and solemn while a paper-fan spirit opens its last fold
      hi: सीधा और गम्भीर बैठा भूरा भूत, अन्तिम तह खोलता पंखे-सा भूत
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - sankshepaka
    place: smashana
    ratio: '4:3'
    id: part-krtya-s1
  narration:
    en: 'The Vetāla straightens up. “Now the word every king must know,” he says. “कर्तव्यम्. What must be done.” The paper-fan spirit nods and unfolds the last fold: “गन्तव्यम्, पठनीयम्, देयम्.” “To be gone to, to be read, to be given.” “These are the duty words,” says Dādī. “They say not what is done, but what ought to be.”'
    hi: 'वेताल सीधा हो जाता है। “अब वह शब्द जो हर राजा को जानना चाहिए,” वह कहता है। “कर्तव्यम्। जो किया जाना चाहिए।” काग़ज़ी पंखे वाला भूत सिर हिलाता है और अन्तिम तह खोलता है: “गन्तव्यम्, पठनीयम्, देयम्।” “जहाँ जाना है, जो पढ़ना है, जो देना है।” “ये कर्तव्य के शब्द हैं,” दादी कहती हैं। “ये बताते हैं कि क्या किया जा चुका नहीं, बल्कि क्या किया जाना चाहिए।”'
  quote:
    sa: तस्माद् असक्तः सततं कार्यं कर्म समाचर
    gloss:
      en: Therefore, without attachment, always do the work that must be done.
      hi: इसलिए, आसक्ति के बिना, जो कर्म करना है उसे सदा करो।
    source: Bhagavadgītā 3.19 (read at GRETIL)
- id: t1
  kind: teach
  title:
    en: What ought to be done
    hi: जो किया जाना चाहिए
  depth: core
  skills:
  - krt.krtya
  body:
    en: '{{-तव्य}}, {{-अनीय}} and {{-य}} (with a lengthened vowel) make “to be done”: {{कृ}} gives {{कर्तव्यम्}}, {{करणीयम्}}, {{कार्यम्}}; {{दा}} gives {{दातव्यम्}}, {{देयम्}}; {{गम्}} gives {{गन्तव्यम्}}. The doer is in the third case: {{मया गन्तव्यम्}}, “I must go”.'
    hi: '{{-तव्य}}, {{-अनीय}} और {{-य}} (दीर्घ स्वर के साथ) ‘किया जाना चाहिए’ बनाते हैं: {{कृ}} से {{कर्तव्यम्}}, {{करणीयम्}}, {{कार्यम्}}; {{दा}} से {{दातव्यम्}}, {{देयम्}}; {{गम्}} से {{गन्तव्यम्}}। कर्ता तृतीया में रहता है: {{मया गन्तव्यम्}}, ‘मुझे जाना है’।'
  examples:
  - sa: मया गन्तव्यम्।
    meaning:
      en: I must go.
      hi: मुझे जाना है।
    words:
    - sa: मया
      gloss:
        en: by me
        hi: मेरे द्वारा
    - sa: गन्तव्यम्
      gloss:
        en: must be gone
        hi: जाना है
      check:
        type: krdanta
        dhatu: गम्
        krt: tavya
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Eka
  - sa: सत्यम् वक्तव्यम्।
    meaning:
      en: The truth must be spoken.
      hi: सत्य बोलना चाहिए।
    words:
    - sa: सत्यम्
      gloss:
        en: the truth
        hi: सत्य
    - sa: वक्तव्यम्
      gloss:
        en: must be spoken
        hi: बोलना चाहिए
      check:
        type: krdanta
        dhatu: वच्
        krt: tavya
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Eka
  - sa: बालकेन कर्म कार्यम्।
    meaning:
      en: The duty must be done by the boy.
      hi: बालक को कर्म करना चाहिए।
    words:
    - sa: बालकेन
      gloss:
        en: by the boy
        hi: बालक द्वारा
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Trtiya
        vacana: Eka
    - sa: कर्म
      gloss:
        en: duty
        hi: कर्म
      check:
        type: subanta
        stem: कर्मन्
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Eka
    - sa: कार्यम्
      gloss:
        en: to be done
        hi: करने योग्य
      check:
        type: krdanta
        dhatu: कृ
        krt: Ryat
        linga: Napumsaka
        vibhakti: Prathama
        vacana: Eka
  term:
    sa: कृत्यम्
    meaning:
      en: a “must be done” word
      hi: ‘करना चाहिए’ शब्द

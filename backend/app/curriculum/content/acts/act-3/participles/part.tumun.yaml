- id: pn
  kind: teach
  title:
    en: Pāṇini's purpose
    hi: पाणिनि का प्रयोजन
  depth: panini
  skills:
  - krt.tumun
  sutras:
  - 3.3.10
  - 3.3.158
  body:
    en: Sūtra 3.3.10, {{तुमुन्ण्वुलौ क्रियायां क्रियार्थायाम्}}, gives {{तुमुन्}} when one action is for another action. And
      3.3.158, {{समानकर्तृकेषु तुमुन्}}, gives it with verbs of wanting when the doer is the same.
    hi: सूत्र 3.3.10, {{तुमुन्ण्वुलौ क्रियायां क्रियार्थायाम्}}, जब एक क्रिया दूसरी के लिए हो तब {{तुमुन्}} देता है। और 3.3.158,
      {{समानकर्तृकेषु तुमुन्}}, चाहने की क्रियाओं के साथ उसे देता है जब कर्ता वही हो।
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: Sūtra 3.3.10, {{तुमुन्ण्वुलौ क्रियायां क्रियार्थायाम्}}, gives {{तुमुन्}} when one action is for another action.
        And 3.3.158, {{समानकर्तृकेषु तुमुन्}}, gives it with verbs of wanting when the doer is the same.
      hi: सूत्र 3.3.10, {{तुमुन्ण्वुलौ क्रियायां क्रियार्थायाम्}}, जब एक क्रिया दूसरी के लिए हो तब {{तुमुन्}} देता है। और
        3.3.158, {{समानकर्तृकेषु तुमुन्}}, चाहने की क्रियाओं के साथ उसे देता है जब कर्ता वही हो।
    items:
    - id: i0
      sa: तुमुन्ण्वुलौ क्रियायां क्रियार्थायाम्
    - id: i1
      sa: तुमुन्
    - id: i2
      sa: समानकर्तृकेषु तुमुन्
- id: sum
  kind: summary
  title:
    en: In order to
    hi: के लिए
  depth: core
  points:
  - sa: गन्तुम् · कर्तुम् · द्रष्टुम्
    text:
      en: To go; to do; to see.
      hi: जाने के लिए; करने के लिए; देखने के लिए।
  - sa: इच्छति · शक्नोति + तुम्
    text:
      en: Wants to; is able to.
      hi: चाहता है; समर्थ है।
  - text:
      en: It never changes.
      hi: यह कभी नहीं बदलता।

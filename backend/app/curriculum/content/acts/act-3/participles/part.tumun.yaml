cards:
- id: s1
  kind: story
  title:
    en: A word that wants
    hi: चाहने वाला शब्द
  depth: core
  image:
    brief: The paper-fan spirit folding his answer into a single word on one fold; Śuka testing words with a raised wing;
      Dādī smiling; the Vetāla listening with half-closed eyes; firelight.
    alt:
      en: A paper-fan spirit folds an answer into one word while a parrot tests words
      hi: काग़ज़ी पंखे जैसा भूत उत्तर को एक शब्द में समेटता, शब्द परखता तोता
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - sankshepaka
    place: smashana
    ratio: '4:3'
    id: part-tumun-s1
    text_in_image:
    - पठितुम्
  narration:
    en: '“Why did you come?” the Vetāla asks, and the paper-fan spirit folds his answer into a single word: “द्रष्टुम्.” “To
      see.” Śuka tests it. “गन्तुम् इच्छामि.” “I want to go.” “पठितुम् शक्नोमि.” “I am able to read.” “One word,” says Dādī,
      “and the purpose is done. No ‘in order that’, no ‘so as to’.”'
    hi: '“तुम क्यों आए?” वेताल पूछता है, और काग़ज़ी पंखे वाला भूत अपना उत्तर एक शब्द में समेट देता है: “द्रष्टुम्।” “देखने
      के लिए।” शुक परखता है। “गन्तुम् इच्छामि।” “मैं जाना चाहता हूँ।” “पठितुम् शक्नोमि।” “मैं पढ़ सकता हूँ।” “एक शब्द,” दादी
      कहती हैं, “और प्रयोजन पूरा। न ‘ताकि’, न ‘इस उद्देश्य से’।”'
  quote:
    sa: अहमप्यवदं मातर्द्रष्टुमेतद्व्रजाम्यहम्
    gloss:
      en: 'I too said: “Mother, I go to see this.”'
      hi: 'मैंने भी कहा: “माँ, मैं इसे देखने जाता हूँ।”'
    source: Kathāsaritsāgara 1.2 (read in the Digital Corpus of Sanskrit)
  lines:
  - speaker: sankshepaka
    sa: द्रष्टुम्
    gloss:
      en: To see.
      hi: देखने के लिए।
    check:
      type: krdanta
      dhatu: दृश्
      krt: tumun
- id: t1
  kind: teach
  title:
    en: In order to
    hi: के लिए
  depth: core
  skills:
  - krt.tumun
  body:
    en: 'Add {{-तुम्}} to the root to say “to do, in order to do”: {{गम्}} gives {{गन्तुम्}}, {{पठ्}} gives {{पठितुम्}}, {{कृ}}
      gives {{कर्तुम्}}, {{दृश्}} gives {{द्रष्टुम्}}. It goes with verbs of wanting and being able: {{इच्छति}}, {{शक्नोति}},
      and with “goes”: {{द्रष्टुं गच्छति}}.'
    hi: '‘करना, करने के लिए’ कहने के लिए धातु में {{-तुम्}} जोड़िए: {{गम्}} से {{गन्तुम्}}, {{पठ्}} से {{पठितुम्}}, {{कृ}}
      से {{कर्तुम्}}, {{दृश्}} से {{द्रष्टुम्}}। यह चाहने और समर्थ होने वाली क्रियाओं के साथ चलता है: {{इच्छति}}, {{शक्नोति}},
      और ‘जाता है’ के साथ: {{द्रष्टुं गच्छति}}।'

- id: p5
  kind: practice
  title:
    en: To read
    hi: पढ़ने के लिए
  depth: core
  skills:
  - krt.tumun
  mode: choice
  prompt:
    en: “He is able to read.” Which sentence?
    hi: ‘वह पढ़ सकता है।’ कौन-सा वाक्य?
  explain:
    en: '{{पठितुं शक्नोति}}: {{-तुम्}} with {{शक्नोति}}.'
    hi: '{{पठितुं शक्नोति}}: {{शक्नोति}} के साथ {{-तुम्}}।'
  roman: after
  gate: true
  story:
    success:
      en: '“सः पठितुं शक्नोति,” you say. The folded spirit unfolds one of his folds all the way to the edge of the page, and
        on it there is a single line, in handwriting that is not his: “द्रष्टुम्. To see. For this I came.” “That is mine,”
        he says, in wonder. “I wrote it before I forgot how.”'
      hi: '“सः पठितुं शक्नोति,” आप कहते हैं। तहदार भूत अपनी एक तह पन्ने के छोर तक खोल देता है, और उस पर एक पंक्ति है, ऐसी
        लिखावट में जो उसकी नहीं: “द्रष्टुम्। देखने के लिए। इसी के लिए मैं आया।” “यह मेरा है,” वह विस्मय से कहता है। “मैंने
        इसे भूलने से पहले लिखा था।”'
    failure:
      en: 'The fold stays blank. “He is able to read”: {{सः पठितुं शक्नोति}}.'
      hi: 'तह कोरी रहती है। ‘वह पढ़ सकता है’: {{सः पठितुं शक्नोति}}।'

- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: krt.ktva
    rule:
      en: '{{समानकर्तृकयोः पूर्वकाले}} and {{समासेऽनञ्पूर्वे क्त्वो ल्यप्}}: {{क्त्वा}} and {{ल्यप्}}.'
      hi: '{{समानकर्तृकयोः पूर्वकाले}} और {{समासेऽनञ्पूर्वे क्त्वो ल्यप्}}: {{क्त्वा}} और {{ल्यप्}}।'
    sutras:
    - 3.4.21
    - 7.1.37
    tag: core
    taught_in: part.ktva#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 3.4.21, {{समानकर्तृकयोः पूर्वकाले}}, gives {{क्त्वा}} for an earlier action by the same doer. 7.1.37, {{समासेऽनञ्पूर्वे
          क्त्वो ल्यप्}}, turns {{क्त्वा}} into {{ल्यप्}}, that is {{-य}}, after a prefix. 1.1.40, {{क्त्वातोसुन्कसुनः}},
          says these endings are indeclinable.
        hi: सूत्र 3.4.21, {{समानकर्तृकयोः पूर्वकाले}}, उसी कर्ता की पहले हुई क्रिया के लिए {{क्त्वा}} देता है। 7.1.37, {{समासेऽनञ्पूर्वे
          क्त्वो ल्यप्}}, उपसर्ग के बाद {{क्त्वा}} को {{ल्यप्}}, अर्थात् {{-य}}, बना देता है। 1.1.40, {{क्त्वातोसुन्कसुनः}},
          कहता है कि ये प्रत्यय अव्यय हैं।
      items:
      - id: i0
        sa: समानकर्तृकयोः पूर्वकाले
      - id: i1
        sa: क्त्वा
      - id: i2
        sa: समासेऽनञ्पूर्वे क्त्वो ल्यप्
      - id: i3
        sa: ल्यप्
      - id: i4
        sa: -य
      - id: i5
        sa: क्त्वातोसुन्कसुनः
  - skill: krt.krtya
    rule:
      en: '{{तव्यत्तव्यानीयरः}}, {{अचो यत्}}, {{ऋहलोर्ण्यत्}}: the three “must” endings.'
      hi: '{{तव्यत्तव्यानीयरः}}, {{अचो यत्}}, {{ऋहलोर्ण्यत्}}: तीन ‘चाहिए’ प्रत्यय।'
    sutras:
    - 3.1.96
    - 3.1.97
    - 3.1.124
    tag: core
    taught_in: part.krtya#pn
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 3.1.96, {{तव्यत्तव्यानीयरः}}, gives {{तव्यत्}}, {{तव्य}} and {{अनीयर्}}; 3.1.97, {{अचो यत्}}, gives {{यत्}}
          after a root ending in a vowel, and 3.1.124, {{ऋहलोर्ण्यत्}}, gives {{ण्यत्}}. 3.4.70, {{तयोरेव कृत्यक्तखलर्थाः}},
          says the “must” words state the object or the bare action.
        hi: सूत्र 3.1.96, {{तव्यत्तव्यानीयरः}}, {{तव्यत्}}, {{तव्य}} और {{अनीयर्}} देता है; 3.1.97, {{अचो यत्}}, स्वरान्त
          धातु के बाद {{यत्}} देता है, और 3.1.124, {{ऋहलोर्ण्यत्}}, {{ण्यत्}} देता है। 3.4.70, {{तयोरेव कृत्यक्तखलर्थाः}},
          कहता है कि ‘चाहिए’ वाले शब्द कर्म या केवल क्रिया को कहते हैं।
      items:
      - id: i0
        sa: तव्यत्तव्यानीयरः
      - id: i1
        sa: तव्यत्
      - id: i2
        sa: तव्य
      - id: i3
        sa: अनीयर्
      - id: i4
        sa: अचो यत्
      - id: i5
        sa: यत्
      - id: i6
        sa: ऋहलोर्ण्यत्
      - id: i7
        sa: ण्यत्
      - id: i8
        sa: तयोरेव कृत्यक्तखलर्थाः

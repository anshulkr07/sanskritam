  mode: order
  prompt:
    en: 'Fill Sankshepaka''s folds: “Having gone, to go, gone, going.”'
    hi: 'सङ्क्षेपक की तहें भरिए: ‘जाकर, जाने के लिए, गया हुआ, जाता हुआ।’'
  explain:
    en: '{{गत्वा गन्तुम् गतः गच्छन्}}: four forms of one root.'
    hi: '{{गत्वा गन्तुम् गतः गच्छन्}}: एक धातु के चार रूप।'
  roman: after
  gate: true
  story:
    success:
      en: '“गत्वा, गन्तुम्, गतः, गच्छन्,” you say, and Sankshepaka opens and opens until he is a great fan, a screen, a window onto a distance. “A whole sentence,” he says, “in each,” and the folds, all of them, are written in a close, neat hand. He bows and spreads himself over the trees like a sheet of paper over a table, and all the pages read, together, softly: “च. वा. अपि. एव.” “And, or, also, only: the little words that never change.” The Vetāla looks at the ground. “The last night. I have something for you.”'
      hi: '“गत्वा, गन्तुम्, गतः, गच्छन्,” आप कहते हैं, और सङ्क्षेपक खुलता जाता है, खुलता जाता है, जब तक वह एक विशाल पंखा, एक पर्दा, दूरी की ओर खुलती खिड़की न बन जाए। “हर एक में,” वह कहता है, “एक पूरा वाक्य,” और तहें, सब की सब, सघन सुघड़ लिखावट में लिखी हैं। वह झुकता है और वृक्षों के ऊपर मेज़ पर काग़ज़ की चादर की तरह फैल जाता है, और सारे पन्ने साथ-साथ धीमे से पढ़ते हैं: “च। वा। अपि। एव।” “और, या, भी, ही: वे छोटे शब्द जो कभी नहीं बदलते।” वेताल ज़मीन की ओर देखता है। “अन्तिम रात। मेरे पास आपके लिए कुछ है।”'
    failure:
      en: 'The fan stays folded. The four: {{गत्वा गन्तुम् गतः गच्छन्}}.'
      hi: 'पंखा तह रहता है। चारों: {{गत्वा गन्तुम् गतः गच्छन्}}।'
  tokens:
  - गत्वा
  - गन्तुम्

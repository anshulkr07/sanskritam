    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: '{{-त}} makes “done”, an adjective: {{गतः}} (gone), {{कृतः}} (done), {{उक्तः}} (said), {{श्रुतः}} (heard). It
          often has a passive sense: {{रामेण पुस्तकं पठितम्}}, “the book was read by Rāma”. {{-तवत्}} makes the active “has
          done”: {{रामः पुस्तकं पठितवान्}}.'
        hi: '{{-त}} ‘किया हुआ’ बनाता है, एक विशेषण: {{गतः}} (गया हुआ), {{कृतः}} (किया हुआ), {{उक्तः}} (कहा हुआ), {{श्रुतः}}
          (सुना हुआ)। उसमें अक्सर कर्मवाच्य का भाव होता है: {{रामेण पुस्तकं पठितम्}}, ‘पुस्तक राम द्वारा पढ़ी गई’। {{-तवत्}}

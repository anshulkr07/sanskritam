  mode: choice
  prompt:
    en: “The girl, going.” Which form agrees?
    hi: ‘बालिका, जाती हुई।’ कौन-सा रूप मेल खाता है?
  explain:
    en: '{{गच्छन्ती}}: feminine.'
    hi: '{{गच्छन्ती}}: स्त्रीलिंग।'
  roman: after
  gate: true
  story:
    success:
      en: '“गच्छन्ती,” you say, and the hurrying figure slows, turns, and looks at you: a woman, with a bundle on her back
        and the beginning of a smile. “Going,” she says, and nods, and goes on across the clearing, no longer in a hurry.
        The paper-fan spirit folds himself closed, pleased, and unfolds again: “च. वा. अपि. एव.”'
      hi: '“गच्छन्ती,” आप कहते हैं, और जल्दी वाली आकृति धीमी होती है, मुड़ती है, और आपको देखती है: एक स्त्री, पीठ पर गठरी
        और मुस्कान की शुरुआत लिए। “जा रही हूँ,” वह कहती है, सिर हिलाती है, और खुले स्थान को पार करती आगे बढ़ती है, अब जल्दी
        में नहीं। काग़ज़ी पंखे वाला भूत प्रसन्न होकर स्वयं को बन्द करता है और फिर खुलता है: “च। वा। अपि। एव।”'
    failure:
      en: 'The figure hurries on. The girl, going: {{गच्छन्ती}}.'
      hi: 'आकृति जल्दी में आगे बढ़ती है। बालिका, जाती हुई: {{गच्छन्ती}}।'

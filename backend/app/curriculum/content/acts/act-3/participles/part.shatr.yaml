- id: s1
  kind: story
  title:
    en: The one who is going
    hi: जो जा रहा है
  depth: core
  image:
    brief: A hurrying figure crossing a moonlit clearing, murmuring to himself as he goes, a paper-fan spirit pointing at him from the roots; the Vetāla and Dādī watching; Śuka perched on a stump.
    alt:
      en: A figure crosses a moonlit clearing murmuring as he goes while a paper-fan spirit points
      hi: चाँदनी में खुले स्थान को पार करती आकृति, बुदबुदाती हुई, पंखे जैसा भूत इशारा करता
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - sankshepaka
    place: smashana
    ratio: '4:3'
    id: part-shatr-s1
  narration:
    en: 'A figure crosses the clearing, hurrying, murmuring to himself as he goes. “गच्छन्,” says the paper-fan spirit. “Going.” “पठन्.” “Reading.” “Not he went, not he will go, but he is going while he does something else.” Dādī: “It is the word for ‘while’. It always goes with another verb.”'
    hi: 'एक आकृति खुले स्थान को पार करती है, जल्दी में, चलते हुए अपने-आप से बुदबुदाती। “गच्छन्,” काग़ज़ी पंखे वाला भूत कहता है। “जाता हुआ।” “पठन्।” “पढ़ता हुआ।” “वह गया नहीं, वह जाएगा नहीं, बल्कि वह जाते हुए कुछ और कर रहा है।” दादी: “यह ‘जबकि’ का शब्द है। यह हमेशा दूसरी क्रिया के साथ आता है।”'
  quote:
    sa: इति संचिन्तयामास योगनन्दः क्रुधा ज्वलन्
    gloss:
      en: So Yogananda thought, blazing with anger.
      hi: इस प्रकार योगनन्द ने क्रोध से जलते हुए सोचा।
    source: Kathāsaritsāgara 1.5 (read in the Digital Corpus of Sanskrit)
  lines:
  - speaker: sankshepaka
    sa: गच्छन्
    gloss:
      en: Going.
      hi: जाता हुआ।
    check:
      type: krdanta
      dhatu: गम्
      krt: Satf
      linga: Pum
      vibhakti: Prathama
      vacana: Eka
- id: t1
  kind: teach
  title:
    en: While doing
    hi: करते हुए
  depth: core
  skills:
  - krt.shatr
  body:
    en: '{{-अत्}} (after the sign {{-अ-}}) or {{-मान}} makes “while doing”: {{गम्}} gives {{गच्छन्}} (going), {{पठ्}} gives {{पठन्}} (reading), {{कृ}} gives {{कुर्वन्}} (doing), {{सेव्}} gives {{सेवमानः}} (serving, for oneself). It agrees with its noun: {{गच्छन् बालकः}}, {{गच्छन्ती बालिका}}.'
    hi: '{{-अत्}} ({{-अ-}} चिह्न के बाद) या {{-मान}} ‘करते हुए’ बनाता है: {{गम्}} से {{गच्छन्}} (जाता हुआ), {{पठ्}} से {{पठन्}} (पढ़ता हुआ), {{कृ}} से {{कुर्वन्}} (करता हुआ), {{सेव्}} से {{सेवमानः}} (सेवा करता हुआ, अपने लिए)। यह अपनी संज्ञा से मेल खाता है: {{गच्छन् बालकः}}, {{गच्छन्ती बालिका}}।'

- id: pn
  kind: teach
  title:
    en: Pāṇini's “while”
    hi: पाणिनि का ‘हुए’
  depth: panini
  skills:
  - krt.shatr
  sutras:
  - 3.2.124
  - 7.1.78
  - 6.4.14
  body:
    en: Sūtra 3.2.124, {{लटः शतृशानचावप्रथमासमानाधिकरणे}}, replaces the present endings with {{शतृ}} or {{शानच्}}, “while
      doing”, when the word is not in the first case with the verb. 7.1.78, {{नाभ्यस्ताच्छतुः}}, and 6.4.14, {{अत्वसन्तस्य
      चाधातोः}}, give the forms {{गच्छन्}} and {{गच्छत्}}.
    hi: सूत्र 3.2.124, {{लटः शतृशानचावप्रथमासमानाधिकरणे}}, वर्तमान के प्रत्ययों की जगह {{शतृ}} या {{शानच्}} रखता है, ‘करते
      हुए’, जब शब्द क्रिया के साथ प्रथमा में न हो। 7.1.78, {{नाभ्यस्ताच्छतुः}}, और 6.4.14, {{अत्वसन्तस्य चाधातोः}}, {{गच्छन्}}
      और {{गच्छत्}} रूप देते हैं।
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें

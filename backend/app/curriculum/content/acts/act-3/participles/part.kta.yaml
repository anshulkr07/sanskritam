cards:
- id: s1
  kind: story
  title:
    en: The one who has done
    hi: जो कर चुका
  depth: core
  image:
    brief: The paper-fan spirit lifting a folded hand to show three folds, each with a word, one for a figure who has gone, one for a said word, one for a finished thing; the Vetāla and Dādī watching; firelight.
    alt:
      en: A paper-fan spirit shows three folds labelled with finished actions
      hi: पंखे जैसा भूत तीन तहें दिखाता जिन पर पूरी हो चुकी क्रियाओं के शब्द हैं
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - sankshepaka
    place: smashana
    ratio: '4:3'
    id: part-kta-s1
  narration:
    en: '“Who is it that has gone?” the Vetāla asks. The paper-fan spirit lifts one folded hand: “गतः.” “Gone.” A word that is also a person, a thing that has happened to someone. “उक्तः,” he adds: “said.” “कृतः”: “done.” Dādī: “It is an adjective made from a verb. It says what has been done, and it agrees with its noun, like any adjective.”'
    hi: '“कौन है जो गया है?” वेताल पूछता है। काग़ज़ी पंखे वाला भूत अपना एक तहदार हाथ उठाता है: “गतः।” “गया हुआ।” एक शब्द जो एक व्यक्ति भी है, कोई बात जो किसी पर बीत चुकी है। “उक्तः,” वह जोड़ता है: “कहा गया।” “कृतः”: “किया गया।” दादी: “यह क्रिया से बना विशेषण है। यह बताता है कि क्या किया जा चुका है, और किसी भी विशेषण की तरह अपनी संज्ञा से मेल खाता है।”'
  quote:
    sa: तस्य तद् वचनं श्रुत्वा राज्ञा भाण्डागारिक आकारितः
    gloss:
      en: Hearing his words, the king summoned the treasurer.
      hi: उसकी वह बात सुनकर राजा ने भण्डारी को बुलाया।
    source: Vetālapañcaviṃśatikā, introduction (read in the Digital Corpus of Sanskrit)
- id: t1
  kind: teach
  title:
    en: Done and having done
    hi: किया हुआ और कर चुका
  depth: core
  skills:
  - krt.kta
  body:
    en: '{{-त}} makes “done”, an adjective: {{गतः}} (gone), {{कृतः}} (done), {{उक्तः}} (said), {{श्रुतः}} (heard). It often has a passive sense: {{रामेण पुस्तकं पठितम्}}, “the book was read by Rāma”. {{-तवत्}} makes the active “has done”: {{रामः पुस्तकं पठितवान्}}.'
    hi: '{{-त}} ‘किया हुआ’ बनाता है, एक विशेषण: {{गतः}} (गया हुआ), {{कृतः}} (किया हुआ), {{उक्तः}} (कहा हुआ), {{श्रुतः}} (सुना हुआ)। उसमें अक्सर कर्मवाच्य का भाव होता है: {{रामेण पुस्तकं पठितम्}}, ‘पुस्तक राम द्वारा पढ़ी गई’। {{-तवत्}} कर्तृवाची ‘कर चुका’ बनाता है: {{रामः पुस्तकं पठितवान्}}।'
  examples:
  - sa: बालकः गतः।
    meaning:
      en: The boy has gone.
      hi: बालक गया।
    words:
    - sa: बालकः
      gloss:
        en: boy
        hi: बालक
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
    - sa: गतः
      gloss:
        en: gone
        hi: गया
      check:
        type: krdanta
        dhatu: गम्
        krt: kta
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
  - sa: रामेण पुस्तकम् पठितम्।
    meaning:
      en: The book was read by Rāma.
      hi: पुस्तक राम द्वारा पढ़ी गई।
    words:
    - sa: रामेण
      gloss:

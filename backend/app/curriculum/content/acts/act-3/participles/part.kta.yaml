  story:
    success:
      en: '“गता,” you say. The paper-fan spirit''s third fold, the one that had been stuck, comes undone with a small sigh. On it, in tiny letters, a line that fills it: “कृतः. उक्तः. गतः.” “Done, said, gone,” he reads. “A whole life, and I thought it was only one word.”'
      hi: '“गता,” आप कहते हैं। काग़ज़ी पंखे वाले भूत की तीसरी तह, जो अटकी हुई थी, एक छोटी आह के साथ खुल जाती है। उस पर नन्हे अक्षरों में एक पंक्ति है जो उसे भर देती है: “कृतः। उक्तः। गतः।” “किया, कहा, गया,” वह पढ़ता है। “एक पूरा जीवन, और मैंने सोचा यह केवल एक शब्द है।”'
    failure:
      en: The fold stays stuck. {{गता}} agrees with a feminine noun.
      hi: तह अटकी रहती है। {{गता}} स्त्रीलिंग संज्ञा से मेल खाता है।
  options:
  - sa: गतः
  - correct: true
    sa: गता
  - sa: गतम्
- id: pn
  kind: teach
  title:
    en: Pāṇini's “done”
    hi: पाणिनि का ‘किया हुआ’
  depth: panini
  skills:
  - krt.kta
  sutras:
  - 1.1.26
  - 3.2.102
  - 3.4.70
  - 3.4.72
  body:
    en: 'Sūtra 1.1.26, {{क्तक्तवतू निष्ठा}}, names {{क्त}} and {{क्तवतु}} {{निष्ठा}}, and 3.2.102, {{निष्ठा}}, gives them for the past. 3.4.70, {{तयोरेव कृत्यक्तखलर्थाः}}, says {{क्त}} is used for the object or the bare action, and 3.4.72, {{गत्यर्थाकर्मकश्लिषशीङ्स्थाऽऽसवसजनरुहजीर्यतिभ्यश्च}}, lets it be active for verbs of going: {{गतः}}.'
    hi: 'सूत्र 1.1.26, {{क्तक्तवतू निष्ठा}}, {{क्त}} और {{क्तवतु}} को {{निष्ठा}} कहता है, और 3.2.102, {{निष्ठा}}, उन्हें भूतकाल के लिए देता है। 3.4.70, {{तयोरेव कृत्यक्तखलर्थाः}}, कहता है कि {{क्त}} कर्म या केवल क्रिया के लिए आता है, और 3.4.72, {{गत्यर्थाकर्मकश्लिषशीङ्स्थाऽऽसवसजनरुहजीर्यतिभ्यश्च}}, उसे गति वाली क्रियाओं में कर्तृवाची होने देता है: {{गतः}}।'
- id: sum
  kind: summary
  title:
    en: Done
    hi: किया हुआ
  depth: core
  points:
  - sa: गतः · गता · गतम्
    text:
      en: Gone, in three genders.
      hi: गया हुआ, तीनों लिंगों में।
  - sa: गतवान् · गतवती · गतवत्
    text:
      en: Has gone (active).
      hi: जा चुका (कर्तृवाची)।
  - sa: रामेण पुस्तकं पठितम्
    text:
      en: The book was read by Rāma.
      hi: पुस्तक राम द्वारा पढ़ी गई।

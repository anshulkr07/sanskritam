- id: pn
  kind: teach
  title:
    en: Pāṇini's “having done”
    hi: पाणिनि का ‘करके’
  depth: panini
  skills:
  - krt.ktva
  sutras:
  - 3.4.21
  - 7.1.37
  - 1.1.40
  body:
    en: Sūtra 3.4.21, {{समानकर्तृकयोः पूर्वकाले}}, gives {{क्त्वा}} for an earlier action by the same doer. 7.1.37, {{समासेऽनञ्पूर्वे
      क्त्वो ल्यप्}}, turns {{क्त्वा}} into {{ल्यप्}}, that is {{-य}}, after a prefix. 1.1.40, {{क्त्वातोसुन्कसुनः}}, says
      these endings are indeclinable.
    hi: सूत्र 3.4.21, {{समानकर्तृकयोः पूर्वकाले}}, उसी कर्ता की पहले हुई क्रिया के लिए {{क्त्वा}} देता है। 7.1.37, {{समासेऽनञ्पूर्वे
      क्त्वो ल्यप्}}, उपसर्ग के बाद {{क्त्वा}} को {{ल्यप्}}, अर्थात् {{-य}}, बना देता है। 1.1.40, {{क्त्वातोसुन्कसुनः}}, कहता
      है कि ये प्रत्यय अव्यय हैं।
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: Sūtra 3.4.21, {{समानकर्तृकयोः पूर्वकाले}}, gives {{क्त्वा}} for an earlier action by the same doer. 7.1.37, {{समासेऽनञ्पूर्वे
        क्त्वो ल्यप्}}, turns {{क्त्वा}} into {{ल्यप्}}, that is {{-य}}, after a prefix. 1.1.40, {{क्त्वातोसुन्कसुनः}}, says
        these endings are indeclinable.
      hi: सूत्र 3.4.21, {{समानकर्तृकयोः पूर्वकाले}}, उसी कर्ता की पहले हुई क्रिया के लिए {{क्त्वा}} देता है। 7.1.37, {{समासेऽनञ्पूर्वे
        क्त्वो ल्यप्}}, उपसर्ग के बाद {{क्त्वा}} को {{ल्यप्}}, अर्थात् {{-य}}, बना देता है। 1.1.40, {{क्त्वातोसुन्कसुनः}},
        कहता है कि ये प्रत्यय अव्यय हैं।

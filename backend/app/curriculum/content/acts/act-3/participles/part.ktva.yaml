  image:
    brief: A slim spirit like a folded paper fan unfolding in the firelight, each fold holding a line of tiny writing; the
      Vetāla speaking quickly with a hand pointing at the sky; Śuka looking lost; Dādī smiling and explaining.
    alt:
      en: A paper-fan spirit unfolds in firelight as a grey spirit speaks quickly and a parrot looks lost
      hi: अलाव की रोशनी में खुलता पंखे-सा भूत, तेज़ बोलता भूरा भूत, उलझा हुआ तोता
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - sankshepaka
    place: smashana
    ratio: '4:3'
    id: part-ktva-s1
    text_in_image:
    - गत्वा
    - कृत्वा
    - श्रुत्वा
  narration:
    en: 'Tonight the Vetāla is in a hurry. “Having gone there, having climbed the tree, having cut the rope, he threw down
      the corpse,” he says in one breath. Śuka is lost. A spirit like a folded paper fan unfolds: “गत्वा, आरुह्य, छित्त्वा.
      Three short words, not three sentences.” Dādī: “‘Having done’: so the sentence need not stop.”'
    hi: 'आज वेताल जल्दी में है। “वहाँ जाकर, वृक्ष पर चढ़कर, रस्सी काटकर, उसने शव नीचे गिराया,” वह एक ही साँस में कहता है।
      शुक खो जाता है। तह किए काग़ज़ी पंखे जैसा एक पतला भूत अलाव की रोशनी में खुलता है और कहता है: “गत्वा, आरुह्य, छित्त्वा।
      तीन छोटे शब्द, तीन वाक्य नहीं।” दादी: “‘करके’ अर्थ वाला शब्द, ताकि बाक़ी वाक्य को रुकना न पड़े।”'
  quote:
    sa: तत्र गत्वा राज्ञा शिंशिपावृक्षम् आरुह्य छुरिकया पाशं छित्त्वा मृतकं भूतले पातितम्
    gloss:
      en: Going there, climbing the śiṃśipā tree and cutting the noose with a knife, the king threw the corpse down to the
        ground.
      hi: वहाँ जाकर, शिंशिपा के वृक्ष पर चढ़कर और छुरी से फंदा काटकर, राजा ने शव को ज़मीन पर गिराया।
    source: Vetālapañcaviṃśatikā, introduction (read in the Digital Corpus of Sanskrit)

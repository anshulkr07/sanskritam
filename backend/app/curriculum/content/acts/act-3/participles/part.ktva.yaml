- id: p5
  kind: practice
  title:
    en: Having come
    hi: आकर
  depth: core
  skills:
  - krt.ktva
  mode: choice
  prompt:
    en: “Having come.” Which form (prefix {{आ}} + {{गम्}})?
    hi: ‘आकर।’ कौन-सा रूप (उपसर्ग {{आ}} + {{गम्}})?
  explain:
    en: '{{आगत्य}}: with a prefix, {{-य}} not {{-त्वा}}.'
    hi: '{{आगत्य}}: उपसर्ग के साथ {{-य}}, {{-त्वा}} नहीं।'
  roman: after
  gate: true
  story:
    success:
      en: “आगत्य,” you say, and the folded spirit opens one more fold, as if a page had been turned. “Having come,” he says,
        reading it. “And so he is here, and the sentence goes on.” He seems taller, and the writing in his folds is a little
        darker.
      hi: “आगत्य,” आप कहते हैं, और तहदार भूत एक और तह खोलता है, मानो पन्ना पलटा गया हो। “आकर,” वह उसे पढ़ते हुए कहता है। “और
        इसलिए वह यहाँ है, और वाक्य आगे चलता है।” वह कुछ ऊँचा लगता है, और उसकी तहों की लिखावट थोड़ी गहरी है।
    failure:
      en: 'The fold stays shut. With a prefix: {{आगत्य}}.'
      hi: 'तह बन्द रहती है। उपसर्ग के साथ: {{आगत्य}}।'
  options:
  - sa: आगत्वा
  - correct: true
    sa: आगत्य
  - sa: आगतः
  feedback_visuals:
  - id: v-source-feedback
    kind: worked

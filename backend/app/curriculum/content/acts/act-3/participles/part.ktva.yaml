- id: t1
  kind: teach
  title:
    en: Having done
    hi: करके
  depth: core
  skills:
  - krt.ktva
  body:
    en: 'To say “having done X, he does Y” with the same doer, add {{-त्वा}} to the root: {{गम्}} gives {{गत्वा}} (having
      gone), {{कृ}} gives {{कृत्वा}}, {{श्रु}} gives {{श्रुत्वा}}, {{पठ्}} gives {{पठित्वा}}. With a prefix it is {{-य}}:
      {{आ + गम्}} gives {{आगत्य}}. These never change; they are indeclinable.'
    hi: '‘X करके वह Y करता है’ कहने के लिए, कर्ता वही हो तो, धातु में {{-त्वा}} जोड़िए: {{गम्}} से {{गत्वा}} (जाकर), {{कृ}}
      से {{कृत्वा}}, {{श्रु}} से {{श्रुत्वा}}, {{पठ्}} से {{पठित्वा}}। उपसर्ग हो तो {{-य}}: {{आ + गम्}} से {{आगत्य}}। ये कभी
      नहीं बदलते; ये अव्यय हैं।'

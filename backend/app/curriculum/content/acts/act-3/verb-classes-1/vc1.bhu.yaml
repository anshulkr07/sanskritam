- id: s1
  kind: story
  title:
    en: The seventh night
    hi: सातवीं रात
  depth: core
  image:
    brief: A flat stone in the grove with the Vetāla opening a worn ledger; a small round honey-brown spirit with ten tiny
      brass-handled drawers in his body hopping out and tugging drawers open, a pencil behind his ear; you, Dādī and Śuka
      watching; firelight.
    alt:
      en: A drawer-bodied spirit tugs his drawers open beside a grey spirit with a worn ledger
      hi: दराज़ों वाला भूत अपने दराज़ खींचता, घिसी बही के साथ भूरा भूत
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - dhatuka
    place: smashana
    ratio: '4:3'
    id: vc1-bhu-s1
    text_in_image:
    - भू
    - भवति
    - नी
    - नयति
    - जि
    - जयति
  narration:
    en: 'On a flat stone the Vetāla opens a worn ledger. A little spirit with ten tiny brass drawers set into his body hops
      out and begins yanking them open, stuffing roots in and out, muddled. “दश गणाः,” says the Vetāla patiently. “Ten classes.
      A verb''s class decides the small sign before its ending. Tonight, four of them. First: the one that gives भवति.”'
    hi: 'एक चपटे पत्थर पर वेताल एक घिसी बही खोलता है। शरीर में दस नन्हे पीतल के दराज़ों वाला एक छोटा भूत कूदकर बाहर आता है
      और उन्हें खींचने-ठूँसने लगता है, उलझा हुआ। “दश गणाः,” वेताल धैर्य से कहता है। “दस गण। क्रिया का गण तय करता है कि प्रत्यय
      से पहले कौन-सा छोटा चिह्न आए। आज उनमें से चार। पहला: जो भवति देता है।”'
  lines:
  - speaker: dadi
    sa: भवति। नयति। जयति।
    gloss:
      en: He is. He leads. He wins.
      hi: वह होता है। वह ले जाता है। वह जीतता है।
- id: t1
  kind: teach
  title:
    en: The root and its class
    hi: धातु और उसका गण
  depth: core
  skills:
  - verb.class-1
  body:
    en: 'Every verb has a root and a class; a dictionary lists both. Class 1, {{भ्वादि}}, adds {{-अ-}} after the root and
      strengthens its vowel: {{भू}} gives {{भवति}}, {{नी}} gives {{नयति}}, {{जि}} gives {{जयति}}, {{शुच्}} gives {{शोचति}}.
      Most verbs you know are class 1.'
    hi: 'हर क्रिया की एक धातु और एक गण होता है; कोश दोनों बताता है। गण 1, {{भ्वादि}}, धातु के बाद {{-अ-}} जोड़ता है और धातु
      का स्वर बलवान् कर देता है: {{भू}} से {{भवति}}, {{नी}} से {{नयति}}, {{जि}} से {{जयति}}, {{शुच्}} से {{शोचति}}। आपकी जानी
      हुई अधिकतर क्रियाएँ गण 1 की हैं।'
  term:
    sa: गणः
    meaning:
      en: a class of verb roots
      hi: धातुओं का वर्ग
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'Every verb has a root and a class; a dictionary lists both. Class 1, {{भ्वादि}}, adds {{-अ-}} after the root and
        strengthens its vowel: {{भू}} gives {{भवति}}, {{नी}} gives {{नयति}}, {{जि}} gives {{जयति}}, {{शुच्}} gives {{शोचति}}.
        Most verbs you know are class 1.'
      hi: 'हर क्रिया की एक धातु और एक गण होता है; कोश दोनों बताता है। गण 1, {{भ्वादि}}, धातु के बाद {{-अ-}} जोड़ता है और धातु
        का स्वर बलवान् कर देता है: {{भू}} से {{भवति}}, {{नी}} से {{नयति}}, {{जि}} से {{जयति}}, {{शुच्}} से {{शोचति}}। आपकी
        जानी हुई अधिकतर क्रियाएँ गण 1 की हैं।'

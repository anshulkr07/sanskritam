- id: conditions
  kind: revision
  title:
    en: How to tell the class
    hi: गण कैसे पहचानें
  depth: core
  section: conditions
  rows:
  - skill: verb.class-1
    rule:
      en: A {{-य-}} before the ending means class 4; {{-अय-}} means class 10.
      hi: प्रत्यय से पहले {{-य-}} हो तो गण 4; {{-अय-}} हो तो गण 10।
    tag: good
    taught_in: vc1.div#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Class 4, {{दिवादि}}, puts {{-य-}} between the root and the ending, and the root keeps its own vowel: {{नृत्}}
          gives {{नृत्यति}} (dances), {{दिव्}} gives {{दीव्यति}} (plays), {{नश्}} gives {{नश्यति}} (is lost), {{कुप्}} gives
          {{कुप्यति}} (is angry). {{शम्}} lengthens: {{शाम्यति}}.'
        hi: 'गण 4, {{दिवादि}}, धातु और प्रत्यय के बीच {{-य-}} रखता है, और धातु अपना स्वर रखती है: {{नृत्}} से {{नृत्यति}}
          (नाचता है), {{दिव्}} से {{दीव्यति}} (खेलता है), {{नश्}} से {{नश्यति}} (नष्ट होता है), {{कुप्}} से {{कुप्यति}} (क्रोध
          करता है)। {{शम्}} दीर्घ होता है: {{शाम्यति}}।'
      items:
      - id: i0
        sa: दिवादि
      - id: i1
        sa: -य-
      - id: i2
        sa: नृत्
      - id: i3
        sa: नृत्यति
      - id: i4
        sa: दिव्
      - id: i5
        sa: दीव्यति
      - id: i6
        sa: नश्
      - id: i7
        sa: नश्यति
      - id: i8
        sa: कुप्
      - id: i9
        sa: कुप्यति
      - id: i10
        sa: शम्
      - id: i11
        sa: शाम्यति

      explanation:
        en: 'Sūtra 3.1.68, {{कर्तरि शप्}}, adds {{शप्}} (which leaves {{अ}}) after a root when the doer is named. 7.3.84,
          {{सार्वधातुकार्धधातुकयोः}}, strengthens the root''s last vowel: {{भू}} becomes {{भो}}. Then 6.1.78, {{एचोऽयवायावः}},
          makes {{ओ}} before a vowel into {{अव्}}: {{भवति}}.'
        hi: 'सूत्र 3.1.68, {{कर्तरि शप्}}, कर्ता कहा जाने पर धातु के बाद {{शप्}} (जिसमें {{अ}} बचता है) जोड़ता है। 7.3.84,
          {{सार्वधातुकार्धधातुकयोः}}, धातु के अन्तिम स्वर को बलवान् करता है: {{भू}} से {{भो}}। फिर 6.1.78, {{एचोऽयवायावः}},
          स्वर से पहले {{ओ}} को {{अव्}} कर देता है: {{भवति}}।'

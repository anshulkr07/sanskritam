        en: 'Sūtra 3.1.77, {{तुदादिभ्यः शः}}, adds {{श}} after {{तुद्}} and its class. This sign is {{ङित्}}, “marked”, and
          1.1.5, {{क्ङिति च}}, forbids the strengthening before a marked sign: {{तुदति}}. And 7.3.77, {{इषुगमियमां छः}}, turns
          {{इष्}}, {{गम्}} and {{यम्}} into {{इच्छ्}}, {{गच्छ्}}, {{यच्छ्}}.'

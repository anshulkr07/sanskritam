- id: s1
  kind: story
  title:
    en: The last drawer
    hi: अन्तिम दराज़
  depth: core
  image:
    brief: A very small quick hand reaching out of an open drawer in the little spirit's body and snatching a pencil from behind his ear; the spirit squealing; the Vetāla amused; Dādī and Śuka laughing; firelight.
    alt:
      en: A tiny hand from a drawer snatches a pencil from behind a startled spirit's ear
      hi: दराज़ से निकला नन्हा हाथ चौंके भूत के कान के पीछे से पेंसिल छीनता
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - dhatuka
    place: smashana
    ratio: '4:3'
    id: vc1-cur-s1
  narration:
    en: 'The tenth drawer is empty, and the little ledger-spirit looks at it, ashamed. “कथयति,” the Vetāla says: “he tells.” A tiny, quick hand reaches out of the drawer, takes the pencil from behind the spirit''s ear, and snatches it back inside. “चोरयति,” says the Vetāla, amused. “He steals.” The ledger-spirit squeals. “The tenth class,” says Dādī, “adds -अय-.”'
    hi: 'दसवाँ दराज़ ख़ाली है, और नन्हा बही-भूत उसे लज्जित होकर देखता है। “कथयति,” वेताल कहता है: “वह कहता है।” दराज़ से एक नन्हा तेज़ हाथ निकलता है, भूत के कान के पीछे से पेंसिल उठाता है और भीतर खींच लेता है। “चोरयति,” वेताल मनोरंजन से कहता है। “वह चुराता है।” बही-भूत चीख पड़ता है। “दसवाँ गण,” दादी कहती हैं, “-अय- जोड़ता है।”'
  lines:
  - speaker: vetala
    sa: कथयति
    gloss:
      en: He tells.
      hi: वह बताता है।
    check:
      type: tinanta
      dhatu: कथ्
      lakara: Lat
      purusha: Prathama
      vacana: Eka
      gana: Curadi
- id: t1
  kind: teach
  title:
    en: The sign -अय-
    hi: चिह्न -अय-
  depth: core
  skills:
  - verb.class-10
  body:
    en: 'Class 10, {{चुरादि}}, adds {{-अय-}} after the root: {{चुर्}} gives {{चोरयति}} (steals), {{कथ्}} gives {{कथयति}} (tells), {{चिन्त्}} gives {{चिन्तयति}} (thinks), {{पूज्}} gives {{पूजयति}} (honours), {{रच्}} gives {{रचयति}} (composes), {{गण्}} gives {{गणयति}} (counts). A short middle vowel is strengthened.'
    hi: 'गण 10, {{चुरादि}}, धातु के बाद {{-अय-}} जोड़ता है: {{चुर्}} से {{चोरयति}} (चुराता है), {{कथ्}} से {{कथयति}} (कहता है), {{चिन्त्}} से {{चिन्तयति}} (सोचता है), {{पूज्}} से {{पूजयति}} (पूजता है), {{रच्}} से {{रचयति}} (रचता है), {{गण्}} से {{गणयति}} (गिनता है)। छोटा मध्य स्वर बलवान् होता है।'

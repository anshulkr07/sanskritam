- id: p4
  kind: practice
  title:
    en: Drawer ten
    hi: दसवाँ दराज़
  depth: core
  skills:
  - verb.class-10
  mode: choice
  prompt:
    en: “He honours.” Which form?
    hi: ‘वह पूजता है।’ कौन-सा रूप?
  explain:
    en: '{{पूजयति}}: the long {{ऊ}} stays.'
    hi: '{{पूजयति}}: दीर्घ {{ऊ}} वैसा ही रहता है।'
  roman: after
  gate: true
  story:
    success:
      en: '“पूजयति,” you say, and the tiny quick hand sets the pencil gently on the stone, bows its fingers, and withdraws. The tenth drawer fills, slowly, with ten small bright seeds, one for each class. “All ten,” whispers the ledger-spirit, shutting each drawer in turn: click, click, click.'
      hi: '“पूजयति,” आप कहते हैं, और नन्हा तेज़ हाथ पेंसिल को पत्थर पर धीरे से रखता है, उँगलियाँ झुकाता है और लौट जाता है। दसवाँ दराज़ धीरे-धीरे दस नन्हे चमकीले बीजों से भर जाता है, हर गण के लिए एक। “सब दस,” बही-भूत फुसफुसाता है, हर दराज़ को बारी-बारी बन्द करते हुए: खट, खट, खट।'
    failure:
      en: The tiny hand keeps the pencil. {{पूज्}} becomes {{पूजयति}}.
      hi: नन्हा हाथ पेंसिल रखे रहता है। {{पूज्}} से {{पूजयति}} बनता है।
  options:
  - sa: पूजति
  - sa: पोजयति
  - correct: true
    sa: पूजयति
- id: pn
  kind: teach
  title:
    en: Pāṇini's {{णिच्}}
    hi: पाणिनि का {{णिच्}}
  depth: panini
  skills:
  - verb.class-10
  sutras:
  - 3.1.25
  - 7.3.86
  body:
    en: 'Sūtra 3.1.25, {{सत्यापपाशरूपवीणातूलश्लोकसेनालोमत्वचवर्मवर्णचूर्णचुरादिभ्यो णिच्}}, adds {{णिच्}}, which becomes {{-इ-}} and then {{-अय-}}. 7.3.86, {{पुगन्तलघूपधस्य च}}, strengthens a short middle vowel: {{चुर्}} becomes {{चोर्}}. So {{चोर + अय + ति}}: {{चोरयति}}.'
    hi: 'सूत्र 3.1.25, {{सत्यापपाशरूपवीणातूलश्लोकसेनालोमत्वचवर्मवर्णचूर्णचुरादिभ्यो णिच्}}, {{णिच्}} जोड़ता है, जो {{-इ-}} और फिर {{-अय-}} बनता है। 7.3.86, {{पुगन्तलघूपधस्य च}}, छोटे मध्य स्वर को बलवान् करता है: {{चुर्}} से {{चोर्}}। इस प्रकार {{चोर + अय + ति}}: {{चोरयति}}।'

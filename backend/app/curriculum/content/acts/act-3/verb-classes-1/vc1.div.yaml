  - sa: कोपति
  - sa: कुपति
  - correct: true
    sa: कुप्यति
- id: pn
  kind: teach
  title:
    en: Pāṇini's {{-य-}}
    hi: पाणिनि का {{-य-}}
  depth: panini
  skills:
  - verb.class-4
  sutras:
  - 3.1.69
  body:
    en: 'Sūtra 3.1.69, {{दिवादिभ्यः श्यन्}}, adds {{श्यन्}} after the roots of {{दिव्}} and its class; the {{श्}} and {{न्}} drop away and leave {{-य-}}. Because this sign is not the strengthening kind, the root keeps its own vowel: {{नृत्यति}}, not {{नर्त्यति}}.'
    hi: 'सूत्र 3.1.69, {{दिवादिभ्यः श्यन्}}, {{दिव्}} आदि धातुओं के बाद {{श्यन्}} जोड़ता है; {{श्}} और {{न्}} हट जाते हैं और {{-य-}} बचता है। यह चिह्न बलवान् करने वाला नहीं है, इसलिए धातु अपना स्वर रखती है: {{नृत्यति}}, {{नर्त्यति}} नहीं।'

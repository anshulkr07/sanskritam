- id: p4
  kind: practice
  title:
    en: Drawer four
    hi: चौथा दराज़
  depth: core
  skills:
  - verb.class-4
  mode: choice
  prompt:
    en: “He is angry.” Which form?
    hi: ‘वह क्रोध करता है।’ कौन-सा रूप?
  explain:
    en: '{{कुप्यति}}: class 4.'
    hi: '{{कुप्यति}}: गण 4।'
  roman: after
  gate: true
  story:
    success:
      en: “कुप्यति,” you say, and in the corner of the stone where the little dance had been, a very small thundercloud forms, grumbles, and, as you watch, thinks better of it and settles into a puff of steam. Drawer four closes, smiling.
      hi: “कुप्यति,” आप कहते हैं, और पत्थर के उस कोने में जहाँ नन्हा नृत्य था, एक बहुत छोटा घना बादल बनता है, गड़गड़ाता है, और आपके देखते-देखते इरादा बदलकर भाप के गुबार में बैठ जाता है। चौथा दराज़ मुस्कराकर बन्द हो जाता है।
    failure:
      en: 'The drawer rattles. Class 4: {{कुप्यति}}.'
      hi: 'दराज़ खड़खड़ाता है। गण 4: {{कुप्यति}}।'

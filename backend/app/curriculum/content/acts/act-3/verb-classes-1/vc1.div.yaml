- id: s1
  kind: story
  title:
    en: The dancing drawer
    hi: नाचता दराज़
  depth: core
  image:
    brief: A tiny figure of mist spilling out of an opened drawer in the little spirit's body, turning on one foot with arms wide in a dance; the drawer-spirit staring at it in wonder; the Vetāla smiling; Dādī pointing; lamplight.
    alt:
      en: A tiny mist dancer spills from a drawer in a little spirit's body
      hi: नन्हे भूत के दराज़ से बाहर बिखरता धुंध का नर्तक
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - dhatuka
    place: smashana
    ratio: '4:3'
    id: vc1-div-s1
  narration:
    en: 'Drawer number four springs open by itself and a very small dance spills out of it: a tiny figure of mist turning on one foot, arms wide. “नृत्यति,” says the Vetāla, with satisfaction. “He dances.” The ledger-spirit looks at his own drawer in amazement. “It is the class of the sign -य-,” Dādī says. “The root stays as it is, and a य walks in.”'
    hi: 'चौथा दराज़ अपने-आप खुल जाता है और उसमें से एक बहुत नन्हा नृत्य बाहर बिखर पड़ता है: धुंध की एक छोटी आकृति, एक पैर पर घूमती, बाहें फैलाए। “नृत्यति,” वेताल संतोष से कहता है। “वह नाचता है।” बही-भूत अपने ही दराज़ को आश्चर्य से देखता है। “यह -य- चिह्न वाला गण है,” दादी कहती हैं। “धातु जैसी है वैसी रहती है, और एक य भीतर आ जाता है।”'
  lines:
  - speaker: vetala
    sa: नृत्यति
    gloss:
      en: He dances.
      hi: वह नाचता है।
    check:
      type: tinanta
      dhatu: नृत्
      lakara: Lat
      purusha: Prathama
      vacana: Eka
      gana: Divadi
- id: t1
  kind: teach
  title:
    en: The sign -य-
    hi: चिह्न -य-
  depth: core
  skills:
  - verb.class-4
  body:
    en: 'Class 4, {{दिवादि}}, puts {{-य-}} between the root and the ending, and the root keeps its own vowel: {{नृत्}} gives {{नृत्यति}} (dances), {{दिव्}} gives {{दीव्यति}} (plays), {{नश्}} gives {{नश्यति}} (is lost), {{कुप्}} gives {{कुप्यति}} (is angry). {{शम्}} lengthens: {{शाम्यति}}.'
    hi: 'गण 4, {{दिवादि}}, धातु और प्रत्यय के बीच {{-य-}} रखता है, और धातु अपना स्वर रखती है: {{नृत्}} से {{नृत्यति}} (नाचता है), {{दिव्}} से {{दीव्यति}} (खेलता है), {{नश्}} से {{नश्यति}} (नष्ट होता है), {{कुप्}} से {{कुप्यति}} (क्रोध करता है)। {{शम्}} दीर्घ होता है: {{शाम्यति}}।'

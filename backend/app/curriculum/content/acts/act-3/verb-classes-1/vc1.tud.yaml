        {{इष्}}, {{गम्}} and {{यम्}} into {{इच्छ्}}, {{गच्छ्}}, {{यच्छ्}}.'
      hi: 'सूत्र 3.1.77, {{तुदादिभ्यः शः}}, {{तुद्}} आदि धातुओं के बाद {{श}} जोड़ता है। यह चिह्न {{ङित्}} है, ‘चिह्नित’, और

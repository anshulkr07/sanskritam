- id: pn
  kind: teach
  title:
    en: Pāṇini's unstrengthened sign
    hi: पाणिनि का बिना बल वाला चिह्न
  depth: panini
  skills:
  - verb.class-6
  sutras:
  - 3.1.77
  - 1.1.5
  - 7.3.77
  body:
    en: 'Sūtra 3.1.77, {{तुदादिभ्यः शः}}, adds {{श}} after {{तुद्}} and its class. This sign is {{ङित्}}, “marked”, and 1.1.5,
      {{क्ङिति च}}, forbids the strengthening before a marked sign: {{तुदति}}. And 7.3.77, {{इषुगमियमां छः}}, turns {{इष्}},
      {{गम्}} and {{यम्}} into {{इच्छ्}}, {{गच्छ्}}, {{यच्छ्}}.'
    hi: 'सूत्र 3.1.77, {{तुदादिभ्यः शः}}, {{तुद्}} आदि धातुओं के बाद {{श}} जोड़ता है। यह चिह्न {{ङित्}} है, ‘चिह्नित’, और
      1.1.5, {{क्ङिति च}}, चिह्नित प्रत्यय से पहले बलवान् करना रोकता है: {{तुदति}}। और 7.3.77, {{इषुगमियमां छः}}, {{इष्}},
      {{गम्}} और {{यम्}} को {{इच्छ्}}, {{गच्छ्}}, {{यच्छ्}} बना देता है।'

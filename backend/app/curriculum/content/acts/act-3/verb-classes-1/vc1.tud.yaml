  roman: after
  gate: true
  story:
    success:
      en: “इच्छति,” you say, and the silver needle in the ledger-spirit's hand quivers, points, as if drawn by a magnet, at
        a drawer much lower down. He pulls it open. Inside lies a small silver mirror, face down. He turns it over with his
        thumb and finds that it is a drawer's inside, and that each of the ten is open, all at once.
      hi: “इच्छति,” आप कहते हैं, और बही-भूत के हाथ की चाँदी की सुई काँपती है, चुम्बक से खिंचती-सी बहुत नीचे के एक दराज़ की
        ओर संकेत करती है। वह उसे खोलता है। भीतर एक नन्हा चाँदी का दर्पण औंधा पड़ा है। वह उसे अँगूठे से पलटता है और पाता है
        कि वह दराज़ का भीतरी भाग है, और दसों एक साथ खुले हैं।
    failure:
      en: The needle keeps quivering. {{इष्}} becomes {{इच्छति}}.
      hi: सुई काँपती रहती है। {{इष्}} से {{इच्छति}} बनता है।
  options:
  - sa: इषति
  - sa: इष्यति
  - correct: true
    sa: इच्छति
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Class 6, {{तुदादि}}, adds {{-अ-}} but does not strengthen the root: {{तुद्}} gives {{तुदति}} (strikes), {{लिख्}}
        gives {{लिखति}} (writes), {{विश्}} gives {{विशति}} (enters). Compare class 1, where {{भू}} becomes {{भवति}}. A few
        roots change: {{मुच्}} gives {{मुञ्चति}}, {{इष्}} gives {{इच्छति}}.'
      hi: 'गण 6, {{तुदादि}}, {{-अ-}} जोड़ता है पर धातु को बलवान् नहीं करता: {{तुद्}} से {{तुदति}} (मारता है), {{लिख्}} से
        {{लिखति}} (लिखता है), {{विश्}} से {{विशति}} (प्रवेश करता है)। गण 1 से तुलना कीजिए, जहाँ {{भू}} से {{भवति}} बनता है।
        कुछ धातुएँ बदलती हैं: {{मुच्}} से {{मुञ्चति}}, {{इष्}} से {{इच्छति}}।'

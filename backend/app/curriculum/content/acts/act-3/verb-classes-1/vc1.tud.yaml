- id: sum
  kind: summary
  title:
    en: Class 6
    hi: गण 6
  depth: core
  points:
  - sa: तुदति · लिखति · विशति
    text:
      en: '{{-अ-}} without strengthening.'
      hi: बिना बल के {{-अ-}}।
  - sa: मुञ्चति · इच्छति
    text:
      en: A few roots change.
      hi: कुछ धातुएँ बदलती हैं।
  - sa: गण 1 ≠ गण 6
    text:
      en: '{{जयति}} strengthens; {{लिखति}} does not.'
      hi: '{{जयति}} बल देता है; {{लिखति}} नहीं।'

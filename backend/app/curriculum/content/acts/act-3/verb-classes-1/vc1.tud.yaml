- id: s1
  kind: story
  title:
    en: The sharp drawer
    hi: तीखा दराज़
  depth: core
  image:
    brief: The ledger-spirit opening a small drawer with two fingers and lifting out a tiny silver needle; the Vetāla and
      Dādī leaning in to look; a pinprick of light at the needle's tip; firelight.
    alt:
      en: A drawer-spirit lifts a tiny silver needle from his body while a grey spirit and an old woman lean in
      hi: दराज़ वाला भूत अपने शरीर से नन्ही चाँदी की सुई निकालता, पास झुके भूत और बुज़ुर्ग स्त्री
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - dhatuka
    place: smashana
    ratio: '4:3'
    id: vc1-tud-s1
  narration:
    en: The sixth drawer holds something sharp. The ledger-spirit opens it with two fingers and lifts out a small silver needle.
      “तुदति,” says the Vetāla. “He pricks, he strikes.” “It looks just like class 1,” you say. “It does,” Dādī agrees. “But
      look closely. In class 1, भू became भव. Here the root does not change at all.”
    hi: छठे दराज़ में कुछ तीखा है। बही-भूत उसे दो उँगलियों से खोलता है और एक नन्ही चाँदी की सुई निकालता है। “तुदति,” वेताल
      कहता है। “वह चुभाता है, मारता है।” “यह तो ठीक गण 1 जैसा लगता है,” आप कहते हैं। “लगता है,” दादी सहमत हैं। “पर ध्यान से
      देखो। गण 1 में भू का भव हुआ। यहाँ धातु बिल्कुल नहीं बदलती।”
  lines:
  - speaker: vetala
    sa: तुदति
    gloss:
      en: He pricks.
      hi: वह चुभोता है।
    check:
      type: tinanta
      dhatu: तुद्
      lakara: Lat
      purusha: Prathama
      vacana: Eka
      gana: Tudadi
- id: t1
  kind: teach
  title:
    en: The root stays as it is
    hi: धातु जैसी है वैसी
  depth: core
  skills:
  - verb.class-6
  body:
    en: 'Class 6, {{तुदादि}}, adds {{-अ-}} but does not strengthen the root: {{तुद्}} gives {{तुदति}} (strikes), {{लिख्}}
      gives {{लिखति}} (writes), {{विश्}} gives {{विशति}} (enters). Compare class 1, where {{भू}} becomes {{भवति}}. A few roots
      change: {{मुच्}} gives {{मुञ्चति}}, {{इष्}} gives {{इच्छति}}.'
    hi: 'गण 6, {{तुदादि}}, {{-अ-}} जोड़ता है पर धातु को बलवान् नहीं करता: {{तुद्}} से {{तुदति}} (मारता है), {{लिख्}} से {{लिखति}}
      (लिखता है), {{विश्}} से {{विशति}} (प्रवेश करता है)। गण 1 से तुलना कीजिए, जहाँ {{भू}} से {{भवति}} बनता है। कुछ धातुएँ
      बदलती हैं: {{मुच्}} से {{मुञ्चति}}, {{इष्}} से {{इच्छति}}।'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'Class 6, {{तुदादि}}, adds {{-अ-}} but does not strengthen the root: {{तुद्}} gives {{तुदति}} (strikes), {{लिख्}}
        gives {{लिखति}} (writes), {{विश्}} gives {{विशति}} (enters). Compare class 1, where {{भू}} becomes {{भवति}}. A few
        roots change: {{मुच्}} gives {{मुञ्चति}}, {{इष्}} gives {{इच्छति}}.'
      hi: 'गण 6, {{तुदादि}}, {{-अ-}} जोड़ता है पर धातु को बलवान् नहीं करता: {{तुद्}} से {{तुदति}} (मारता है), {{लिख्}} से
        {{लिखति}} (लिखता है), {{विश्}} से {{विशति}} (प्रवेश करता है)। गण 1 से तुलना कीजिए, जहाँ {{भू}} से {{भवति}} बनता है।
        कुछ धातुएँ बदलती हैं: {{मुच्}} से {{मुञ्चति}}, {{इष्}} से {{इच्छति}}।'

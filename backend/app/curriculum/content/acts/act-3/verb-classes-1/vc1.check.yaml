  skills:
  - verb.class-4
  mode: choice
  prompt:
    en: “He dances.” Which form?
    hi: ‘वह नाचता है।’ कौन-सा रूप?
  explain:
    en: '{{नृत्यति}}: class 4.'
    hi: '{{नृत्यति}}: गण 4।'
  roman: after
  options:
  - sa: नर्तति
  - correct: true
    sa: नृत्यति
  - sa: नृतयति
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Class 4, {{दिवादि}}, puts {{-य-}} between the root and the ending, and the root keeps its own vowel: {{नृत्}} gives
        {{नृत्यति}} (dances), {{दिव्}} gives {{दीव्यति}} (plays), {{नश्}} gives {{नश्यति}} (is lost), {{कुप्}} gives {{कुप्यति}}
        (is angry). {{शम्}} lengthens: {{शाम्यति}}.'
      hi: 'गण 4, {{दिवादि}}, धातु और प्रत्यय के बीच {{-य-}} रखता है, और धातु अपना स्वर रखती है: {{नृत्}} से {{नृत्यति}} (नाचता
        है), {{दिव्}} से {{दीव्यति}} (खेलता है), {{नश्}} से {{नश्यति}} (नष्ट होता है), {{कुप्}} से {{कुप्यति}} (क्रोध करता
        है)। {{शम्}} दीर्घ होता है: {{शाम्यति}}।'

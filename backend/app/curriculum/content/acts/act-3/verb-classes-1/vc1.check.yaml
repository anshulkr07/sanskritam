  mode: choice
  prompt:
    en: “He writes.” Which form?
    hi: ‘वह लिखता है।’ कौन-सा रूप?
  explain:
    en: '{{लिखति}}: class 6.'
    hi: '{{लिखति}}: गण 6।'
  roman: after
  options:
  - sa: लेखति
  - correct: true
    sa: लिखति
  - sa: लिख्यति
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Class 6, {{तुदादि}}, adds {{-अ-}} but does not strengthen the root: {{तुद्}} gives {{तुदति}} (strikes), {{लिख्}}
        gives {{लिखति}} (writes), {{विश्}} gives {{विशति}} (enters). Compare class 1, where {{भू}} becomes {{भवति}}. A few
        roots change: {{मुच्}} gives {{मुञ्चति}}, {{इष्}} gives {{इच्छति}}.'
      hi: 'गण 6, {{तुदादि}}, {{-अ-}} जोड़ता है पर धातु को बलवान् नहीं करता: {{तुद्}} से {{तुदति}} (मारता है), {{लिख्}} से
        {{लिखति}} (लिखता है), {{विश्}} से {{विशति}} (प्रवेश करता है)। गण 1 से तुलना कीजिए, जहाँ {{भू}} से {{भवति}} बनता है।
        कुछ धातुएँ बदलती हैं: {{मुच्}} से {{मुञ्चति}}, {{इष्}} से {{इच्छति}}।'

        {{गण्}} gives {{गणयति}} (counts). A short middle vowel is strengthened.'
      hi: 'गण 10, {{चुरादि}}, धातु के बाद {{-अय-}} जोड़ता है: {{चुर्}} से {{चोरयति}} (चुराता है), {{कथ्}} से {{कथयति}} (कहता

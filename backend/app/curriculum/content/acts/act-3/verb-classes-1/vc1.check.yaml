  mode: order
  prompt:
    en: 'Fill the drawers: “He is, he dances, he strikes, he steals.”'
    hi: 'दराज़ भरिए: ‘वह होता है, वह नाचता है, वह मारता है, वह चुराता है।’'
  explain:
    en: '{{भवति नृत्यति तुदति चोरयति}}: four classes, four drawers.'
    hi: '{{भवति नृत्यति तुदति चोरयति}}: चार गण, चार दराज़।'
  roman: after
  gate: true
  story:
    success:
      en: '“भवति, नृत्यति, तुदति, चोरयति,” you say, and Dhātuka''s drawers click shut one after another, four neat clicks. He beams, with all ten of him in order. “Ten drawers,” he says. “But there are six more, and they are the odd ones.” He flips open his ledger and reads from the top: “अस्ति. एति. ददाति. शृणोति.” “He is, he goes, he gives, he hears,” Dādī translates. “Those are the verbs that do not follow the pattern.”'
      hi: '“भवति, नृत्यति, तुदति, चोरयति,” आप कहते हैं, और धातुक के दराज़ एक के बाद एक बन्द होते हैं, चार सुघड़ खट-खट। वह खिल उठता है, अपने दसों दराज़ों को क्रम में पाकर। “दस दराज़,” वह कहता है। “पर छह और हैं, और वे विचित्र वाले हैं।” वह बही खोलकर ऊपर से पढ़ता है: “अस्ति। एति। ददाति। शृणोति।” “वह है, वह जाता है, वह देता है, वह सुनता है,” दादी अनुवाद करती हैं। “ये वे क्रियाएँ हैं जो ढाँचे पर नहीं चलतीं।”'
    failure:
      en: 'One drawer stays open. His four verbs: {{भवति नृत्यति तुदति चोरयति}}.'
      hi: 'एक दराज़ खुला रहता है। उसकी चार क्रियाएँ: {{भवति नृत्यति तुदति चोरयति}}।'
  tokens:
  - भवति
  - नृत्यति
  - तुदति
  - चोरयति

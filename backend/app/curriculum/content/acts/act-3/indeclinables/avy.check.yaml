- id: p7
  kind: practice
  depth: core
  skills:
  - avy.particles
  mode: order
  prompt:
    en: 'Say the little words that never change: “and, or, also, only, but, for.”'
    hi: 'वे छोटे शब्द कहिए जो कभी नहीं बदलते: ‘और, या, भी, ही, परन्तु, क्योंकि।’'
  explain:
    en: '{{च वा अपि एव तु हि}}: the six little words.'
    hi: '{{च वा अपि एव तु हि}}: छह छोटे शब्द।'
  roman: after
  gate: true
  story:
    success:
      en: '“च, वा, अपि, एव, तु, हि,” you say, and Avyayaka, perfectly round and smooth, rolls once around your feet, then
        rises a hand''s breadth into the air, turning slowly, and begins to give off a quiet white light. “तत्र अस्ति,” he
        says, and then, very softly, as if to himself: “तत्रास्ति.” He has joined the two words; the vowels have flowed into
        one another, and the sentence is not broken but smoother. “That,” says the Vetāla, “is the next thing. But first.”'
      hi: '“च, वा, अपि, एव, तु, हि,” आप कहते हैं, और अव्यय, पूर्णतः गोल और चिकना, आपके पैरों के चारों ओर एक बार लुढ़कता है,
        फिर हथेली भर ऊपर हवा में उठकर धीरे-धीरे घूमता है और एक शान्त सफ़ेद प्रकाश देने लगता है। “तत्र अस्ति,” वह कहता है,
        और फिर बहुत धीमे, मानो अपने-आप से: “तत्रास्ति।” उसने दोनों शब्द जोड़ दिए हैं; स्वर एक-दूसरे में बह गए हैं, और वाक्य
        टूटा नहीं बल्कि और चिकना हो गया है। “वही अगली चीज़ है,” वेताल कहता है। “पर पहले।”'
    failure:
      en: 'He keeps patting himself. His six words: {{च वा अपि एव तु हि}}.'
      hi: 'वह स्वयं को थपथपाता रहता है। उसके छह शब्द: {{च वा अपि एव तु हि}}।'

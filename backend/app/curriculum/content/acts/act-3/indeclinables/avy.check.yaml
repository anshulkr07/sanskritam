  explain:
    en: '{{च}}.'
    hi: '{{च}}।'
  roman: after
  options:
  - sa: वा
  - correct: true
    sa: च
  - sa: तु
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: रामः लक्ष्मणः च गच्छतः।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: Rāma and Lakṣmaṇa go.
        hi: राम और लक्ष्मण जाते हैं।
      words:
      - sa: रामः
        gloss:
          en: Rāma
          hi: राम
        check:
          type: subanta
          stem: राम
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: लक्ष्मणः
        gloss:
          en: Lakṣmaṇa
          hi: लक्ष्मण
        check:
          type: subanta
          stem: लक्ष्मण
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: च
        gloss:
          en: and
          hi: और
      - sa: गच्छतः
        gloss:
          en: go
          hi: जाते हैं
        check:
          type: tinanta
          dhatu: गम्
          lakara: Lat
          purusha: Prathama
          vacana: Dvi
    - id: i1
      sa: रामः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: Rāma
        hi: राम

        type: subanta
        stem: राम
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{राम}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{राम}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
      compare_from: राम
    - id: i2
      sa: लक्ष्मणः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: Lakṣmaṇa
        hi: लक्ष्मण
      check:
        type: subanta
        stem: लक्ष्मण
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
      feature:
        en: 'Stem: {{लक्ष्मण}} · masculine · {{प्रथमा}} · singular'
        hi: 'प्रातिपदिक: {{लक्ष्मण}} · {{पुंलिंग}} · {{प्रथमा}} · {{एकवचन}}'
      compare_from: लक्ष्मण
    - id: i3
      sa: च
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: and
        hi: और
    - id: i4
      sa: गच्छतः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: go
        hi: जाते हैं
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Prathama
        vacana: Dvi
      feature:
        en: 'Root: {{गम्}} · dual · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{गम्}} · {{द्विवचन}} · {{लट्}} · प्रथमपुरुष'
      compare_from: गम्
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'Some words have no endings: they are indeclinable, {{अव्ययम्}}. {{च}} (and), {{वा}} (or), {{अपि}} (also, even),
          {{एव}} (only, just), {{तु}} (but), {{हि}} (for, indeed), {{न}} (not), {{इव}} (like). They follow the word they belong
          to.'
        hi: 'कुछ शब्दों में प्रत्यय नहीं होते: वे अव्यय हैं, {{अव्ययम्}}। {{च}} (और), {{वा}} (या), {{अपि}} (भी), {{एव}} (ही),
          {{तु}} (परन्तु), {{हि}} (क्योंकि), {{न}} (नहीं), {{इव}} (जैसे)। वे उस शब्द के बाद आते हैं जिससे जुड़े हों।'

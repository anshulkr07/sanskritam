  mode: choice
  prompt:
    en: “He says, ‘I go’.” Which word closes it?
    hi: ‘वह कहता है, “मैं जाता हूँ”।’ इसे कौन-सा शब्द बन्द करता है?
  explain:
    en: '{{इति}}.'
    hi: '{{इति}}।'
  roman: after
  options:
  - sa: च
  - sa: एव
  - correct: true
    sa: इति
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: सः अहम् गच्छामि इति वदति।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: 'He says: “I go.”'
        hi: 'वह कहता है: “मैं जाता हूँ।”'
      words:
      - sa: सः
        gloss:
          en: he
          hi: वह
      - sa: अहम्
        gloss:
          en: I
          hi: मैं
      - sa: गच्छामि
        gloss:
          en: go
          hi: जाता हूँ
        check:
          type: tinanta
          dhatu: गम्
          lakara: Lat
          purusha: Uttama
          vacana: Eka
      - sa: इति
        gloss:
          en: thus
          hi: ऐसा
      - sa: वदति
        gloss:
          en: says
          hi: कहता है
        check:
          type: tinanta
          dhatu: वद्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
    - id: i1
      sa: सः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: he
        hi: वह
    - id: i2
      sa: अहम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: I
        hi: मैं
    - id: i3
      sa: गच्छामि
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: go
        hi: जाता हूँ
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lat
        purusha: Uttama
        vacana: Eka
      feature:
        en: 'Root: {{गम्}} · singular · {{लट्}} · First person ({{उत्तमपुरुष}})'
        hi: 'धातु: {{गम्}} · {{एकवचन}} · {{लट्}} · उत्तमपुरुष'
      compare_from: गम्
    - id: i4
      sa: इति
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: thus
        hi: ऐसा
    - id: i5
      sa: वदति
      label:

        hi: राम और लक्ष्मण जाते हैं।
      words:
      - sa: रामः
        gloss:
          en: Rāma
          hi: राम
        check:
          type: subanta
          stem: राम
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: लक्ष्मणः
        gloss:
          en: Lakṣmaṇa
          hi: लक्ष्मण
        check:
          type: subanta
          stem: लक्ष्मण
          linga: Pum
          vibhakti: Prathama
          vacana: Eka
      - sa: च
        gloss:
          en: and
          hi: और
      - sa: गच्छतः
        gloss:
          en: go
          hi: जाते हैं
        check:
          type: tinanta
          dhatu: गम्
          lakara: Lat
          purusha: Prathama
          vacana: Dvi

        hi: इस शब्द पर ध्यान दें
      meaning:
        en: says
        hi: कहता है
      check:
        type: tinanta
        dhatu: वद्
        lakara: Lat
        purusha: Prathama
        vacana: Eka
      feature:
        en: 'Root: {{वद्}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
        hi: 'धातु: {{वद्}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
      compare_from: वद्
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: '{{इति}} comes after a quoted word, thought or sentence: {{सः वदति ‘अहं गच्छामि’ इति}}, “he says: ‘I go’”. It
          also means “so”: {{इति उक्त्वा}}, “having said so”. In epics it joins with the next word: {{इत्युवाच}}, “saying
          so, he said”.'
        hi: '{{इति}} उद्धृत शब्द, विचार या वाक्य के बाद आता है: {{सः वदति ‘अहं गच्छामि’ इति}}, ‘वह कहता है: “मैं जाता हूँ”’।

- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: avy.particles
    rule:
      en: '{{स्वरादिनिपातमव्ययम्}} names the indeclinables.'
      hi: '{{स्वरादिनिपातमव्ययम्}} अव्ययों को नाम देता है।'
    sutras:
    - 1.1.37
    tag: core
    taught_in: avy.small#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 1.1.37, {{स्वरादिनिपातमव्ययम्}}, calls the words beginning with {{स्वर्}} and the particles {{निपात}}, “indeclinable”.
          1.1.38, {{तद्धितश्चासर्वविभक्तिः}}, adds the {{तद्धित}} words that take no case ending. Because they are {{अव्यय}},
          their case endings are deleted and they never change.
        hi: सूत्र 1.1.37, {{स्वरादिनिपातमव्ययम्}}, {{स्वर्}} आदि शब्दों और निपातों को ‘अव्यय’ कहता है। 1.1.38, {{तद्धितश्चासर्वविभक्तिः}},
          उन {{तद्धित}} शब्दों को जोड़ता है जो सब विभक्तियाँ नहीं लेते। {{अव्यय}} होने से उनकी विभक्तियों का लोप हो जाता है
          और वे कभी नहीं बदलते।
      items:
      - id: i0
        sa: स्वरादिनिपातमव्ययम्
      - id: i1
        sa: स्वर्
      - id: i2
        sa: निपात
      - id: i3
        sa: तद्धितश्चासर्वविभक्तिः
      - id: i4
        sa: तद्धित
      - id: i5
        sa: अव्यय
  - skill: avy.adverbs
    rule:
      en: '{{सप्तम्यास्त्रल्}}, {{सर्वैकान्यकिंयत्तदः काले दा}}, {{प्रकारवचने थाल्}}: {{-त्र}}, {{-दा}}, {{-था}}.'
      hi: '{{सप्तम्यास्त्रल्}}, {{सर्वैकान्यकिंयत्तदः काले दा}}, {{प्रकारवचने थाल्}}: {{-त्र}}, {{-दा}}, {{-था}}।'
    sutras:
    - 5.3.10
    - 5.3.15
    - 5.3.23
    tag: core
    taught_in: avy.where#pn
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: These words are made with {{तद्धित}} endings. 5.3.10, {{सप्तम्यास्त्रल्}}, makes {{-त्र}} (place); 5.3.15, {{सर्वैकान्यकिंयत्तदः
          काले दा}}, makes {{-दा}} (time); 5.3.23, {{प्रकारवचने थाल्}}, makes {{-था}} (manner). By 1.1.38 they take no case
          endings, so they are indeclinable.
        hi: ये शब्द {{तद्धित}} प्रत्ययों से बनते हैं। 5.3.10, {{सप्तम्यास्त्रल्}}, {{-त्र}} (स्थान) बनाता है; 5.3.15, {{सर्वैकान्यकिंयत्तदः
          काले दा}}, {{-दा}} (समय) बनाता है; 5.3.23, {{प्रकारवचने थाल्}}, {{-था}} (रीति) बनाता है। 1.1.38 से वे विभक्ति नहीं
          लेते, इसलिए अव्यय हैं।
      items:
      - id: i0
        sa: तद्धित
      - id: i1
        sa: सप्तम्यास्त्रल्
      - id: i2
        sa: -त्र
      - id: i3
        sa: सर्वैकान्यकिंयत्तदः काले दा
      - id: i4
        sa: -दा
      - id: i5
        sa: प्रकारवचने थाल्
      - id: i6
        sa: -था

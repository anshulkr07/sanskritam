- id: mistakes
  kind: revision
  title:
    en: Common mistakes
    hi: आम भूलें
  depth: core
  section: mistakes
  rows:
  - skill: avy.particles
    rule:
      en: 'Do not put an ending on an indeclinable: {{च}}, not {{चः}}.'
      hi: 'अव्यय पर प्रत्यय मत लगाइए: {{च}}, {{चः}} नहीं।'
    tag: core
    taught_in: avy.small#t1
  - skill: avy.iti
    rule:
      en: Do not forget {{इति}} after a quotation.
      hi: उद्धरण के बाद {{इति}} मत भूलिए।
    tag: core
    taught_in: avy.iti#p1

title:
  en: Everything about small words
  hi: छोटे शब्दों के बारे में सब कुछ
title_sa: अव्ययसङ्ग्रहः
minutes: 6
review: scholar_ok
sources:
- title: Lesson text and story
  licence: original
cards:
- id: core
  kind: revision
  title:
    en: The small words
    hi: छोटे शब्द
  depth: core
  section: core
  rows:
  - skill: avy.particles
    rule:
      en: '{{च}} and, {{वा}} or, {{अपि}} also, {{एव}} only, {{तु}} but, {{हि}} for, {{न}} not, {{इव}} like.'
      hi: '{{च}} और, {{वा}} या, {{अपि}} भी, {{एव}} ही, {{तु}} परन्तु, {{हि}} क्योंकि, {{न}} नहीं, {{इव}} जैसे।'
    sutras:
    - 1.1.37
    tag: core
    taught_in: avy.small#tb1
  - skill: avy.iti
    rule:
      en: '{{इति}} closes a quote or a thought: {{अहं गच्छामि इति वदति}}.'
      hi: '{{इति}} उद्धरण या विचार को बन्द करता है: {{अहं गच्छामि इति वदति}}।'
    sutras:
    - 1.4.57
    tag: core
    taught_in: avy.iti#t1
  - skill: avy.adverbs
    rule:
      en: '{{-त्र}} place, {{-दा}} time, {{-था}} manner: {{अत्र तत्र यत्र}}, {{यदा तदा}}, {{यथा तथा}}.'
      hi: '{{-त्र}} स्थान, {{-दा}} समय, {{-था}} रीति: {{अत्र तत्र यत्र}}, {{यदा तदा}}, {{यथा तथा}}।'
    sutras:
    - 5.3.10
    - 5.3.15
    - 5.3.23
    tag: core
    taught_in: avy.where#tb1
- id: conditions
  kind: revision
  title:
    en: When to use which
    hi: कब कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: avy.particles
    rule:
      en: '{{तु}} and {{हि}} stand second in their clause.'
      hi: '{{तु}} और {{हि}} अपने वाक्यांश में दूसरे स्थान पर रहते हैं।'
    tag: good
    taught_in: avy.small#tb1
  - skill: avy.adverbs
    rule:
      en: 'Relative and correlative come in pairs: {{यत्र … तत्र}}, {{यदा … तदा}}, {{यथा … तथा}}.'
      hi: 'सम्बन्धवाची और उसका उत्तर जोड़ी में आते हैं: {{यत्र … तत्र}}, {{यदा … तदा}}, {{यथा … तथा}}।'
    tag: good
    taught_in: avy.where#t1
- id: exceptions

        meaning:
          en: a book
          hi: पुस्तक
        image:
          id: teaching-book
          brief: 'Use case: scientific-educational. Square 1:1 Sanskrit vocabulary illustration. Refined Indian watercolor
            with restrained gouache on warm ivory paper, muted ochre, sage and indigo, soft natural light. One clear central
            subject, whole and uncropped, recognizable at 160px. Plain quiet background. No labels, lettering, symbols, decorative
            border or watermark. One closed traditional cloth-bound book with a plain indigo cover and warm ivory page edges,
            viewed at a slight angle. No writing on the cover, spine or pages.'
          alt:
            en: One closed book with a plain cover
            hi: सादे आवरण की एक बन्द पुस्तक
          ratio: '1:1'
          text_in_image: []
      - id: i3
        sa: अस्ति
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: is
          hi: है
        check:
          type: tinanta
          dhatu: अस्
          lakara: Lat
          purusha: Prathama
          vacana: Eka
        feature:
          en: 'Root: {{अस्}} · singular · {{लट्}} · Third person ({{प्रथमपुरुष}})'
          hi: 'धातु: {{अस्}} · {{एकवचन}} · {{लट्}} · प्रथमपुरुष'
        compare_from: अस्
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: 'Place words end in {{-त्र}}: {{अत्र}} (here), {{तत्र}} (there), {{यत्र}} (where), {{कुत्र}} (where?), {{सर्वत्र}}
            (everywhere). Time words end in {{-दा}}: {{यदा}} (when), {{तदा}} (then), {{कदा}} (when?), {{सर्वदा}} (always),
            {{एकदा}} (once). Manner words end in {{-था}}: {{यथा}} (as), {{तथा}} (so), {{कथम्}} (how?).'
          hi: 'स्थान के शब्द {{-त्र}} पर समाप्त होते हैं: {{अत्र}} (यहाँ), {{तत्र}} (वहाँ), {{यत्र}} (जहाँ), {{कुत्र}} (कहाँ?),
            {{सर्वत्र}} (सब जगह)। समय के शब्द {{-दा}} पर: {{यदा}} (जब), {{तदा}} (तब), {{कदा}} (कब?), {{सर्वदा}} (सदा), {{एकदा}}
            (एक बार)। रीति के शब्द {{-था}} पर: {{यथा}} (जैसे), {{तथा}} (वैसे), {{कथम्}} (कैसे?)।'

- id: pn
  kind: teach
  title:
    en: Pāṇini's three endings
    hi: पाणिनि के तीन प्रत्यय
  depth: panini
  skills:
  - avy.adverbs
  sutras:
  - 5.3.10
  - 5.3.15
  - 5.3.23
  - 1.1.38
  body:
    en: These words are made with {{तद्धित}} endings. 5.3.10, {{सप्तम्यास्त्रल्}}, makes {{-त्र}} (place); 5.3.15, {{सर्वैकान्यकिंयत्तदः
      काले दा}}, makes {{-दा}} (time); 5.3.23, {{प्रकारवचने थाल्}}, makes {{-था}} (manner). By 1.1.38 they take no case endings,
      so they are indeclinable.
    hi: ये शब्द {{तद्धित}} प्रत्ययों से बनते हैं। 5.3.10, {{सप्तम्यास्त्रल्}}, {{-त्र}} (स्थान) बनाता है; 5.3.15, {{सर्वैकान्यकिंयत्तदः
      काले दा}}, {{-दा}} (समय) बनाता है; 5.3.23, {{प्रकारवचने थाल्}}, {{-था}} (रीति) बनाता है। 1.1.38 से वे विभक्ति नहीं लेते,
      इसलिए अव्यय हैं।

- id: s1
  kind: story
  title:
    en: The answer in three letters
    hi: तीन अक्षरों में उत्तर
  depth: core
  image:
    brief: The round white stone spirit rolling between three small stones scratched with a mark each, answering the Vetāla's
      questions; Śuka laughing; Dādī pointing at the three marks; the Vetāla leaning back satisfied.
    alt:
      en: A white stone spirit rolls between three marked stones while a parrot laughs
      hi: तीन चिह्नित पत्थरों के बीच लुढ़कता सफ़ेद पत्थर-भूत, हँसता तोता
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - avyayaka
    place: smashana
    ratio: '4:3'
    id: avy-where-s1
    text_in_image:
    - अत्र
    - तत्र
    - कुत्र
  narration:
    en: '“Where?” asks the Vetāla. “अत्र,” says Avyayaka. “Here.” “And there?” “तत्र.” “When?” “यदा.” “And then?” “तदा.” “How?”
      “यथा.” “And so?” “तथा.” Śuka laughs. “They all end in the same three sounds: -त्र for ‘where’, -दा for ‘when’, -था for
      ‘how’.” The Vetāla leans back, satisfied.'
    hi: '“कहाँ?” वेताल पूछता है। “अत्र,” अव्यय कहता है। “यहाँ।” “और वहाँ?” “तत्र।” “कब?” “यदा।” “और तब?” “तदा।” “कैसे?” “यथा।”
      “और वैसे?” “तथा।” शुक हँस पड़ता है। “सब एक ही तीन ध्वनियों पर समाप्त होते हैं: ‘कहाँ’ के लिए -त्र, ‘कब’ के लिए -दा,
      ‘कैसे’ के लिए -था।” वेताल संतुष्ट होकर पीछे झुकता है।'
  quote:
    sa: यत्र नार्यस् तु पूज्यन्ते रमन्ते तत्र देवताः
    gloss:
      en: Where women are honoured, the gods delight.
      hi: जहाँ नारियों का सम्मान होता है, वहाँ देवता प्रसन्न रहते हैं।
    source: Manusmṛti 3.56 (read in the Digital Corpus of Sanskrit)
- id: t1
  kind: teach
  title:
    en: Three endings
    hi: -त्र, -दा, -था
  depth: core
  skills:
  - avy.adverbs
  body:
    en: 'Place words end in {{-त्र}}: {{अत्र}} (here), {{तत्र}} (there), {{यत्र}} (where), {{कुत्र}} (where?), {{सर्वत्र}}
      (everywhere). Time words end in {{-दा}}: {{यदा}} (when), {{तदा}} (then), {{कदा}} (when?), {{सर्वदा}} (always), {{एकदा}}
      (once). Manner words end in {{-था}}: {{यथा}} (as), {{तथा}} (so), {{कथम्}} (how?).'
    hi: 'स्थान के शब्द {{-त्र}} पर समाप्त होते हैं: {{अत्र}} (यहाँ), {{तत्र}} (वहाँ), {{यत्र}} (जहाँ), {{कुत्र}} (कहाँ?),
      {{सर्वत्र}} (सब जगह)। समय के शब्द {{-दा}} पर: {{यदा}} (जब), {{तदा}} (तब), {{कदा}} (कब?), {{सर्वदा}} (सदा), {{एकदा}}
      (एक बार)। रीति के शब्द {{-था}} पर: {{यथा}} (जैसे), {{तथा}} (वैसे), {{कथम्}} (कैसे?)।'

- id: pn
  kind: teach
  title:
    en: Pāṇini's {{इति}}
    hi: पाणिनि का {{इति}}
  depth: panini
  skills:
  - avy.iti
  sutras:
  - 1.4.57
  - 1.1.37
  body:
    en: '{{इति}} is a {{निपात}}, a particle, listed with {{च}} and {{वा}} in the grammarians'' lists of {{चादि}}. By 1.4.57,
      {{चादयोऽसत्त्वे}}, it has the name {{निपात}} and, by 1.1.37, it is indeclinable.'
    hi: '{{इति}} {{निपात}} है, वैयाकरणों की {{चादि}} सूचियों में {{च}} और {{वा}} के साथ गिना जाने वाला। 1.4.57, {{चादयोऽसत्त्वे}},
      से उसकी {{निपात}} संज्ञा है और 1.1.37 से वह अव्यय है।'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: '{{इति}} is a {{निपात}}, a particle, listed with {{च}} and {{वा}} in the grammarians'' lists of {{चादि}}. By 1.4.57,
        {{चादयोऽसत्त्वे}}, it has the name {{निपात}} and, by 1.1.37, it is indeclinable.'
      hi: '{{इति}} {{निपात}} है, वैयाकरणों की {{चादि}} सूचियों में {{च}} और {{वा}} के साथ गिना जाने वाला। 1.4.57, {{चादयोऽसत्त्वे}},
        से उसकी {{निपात}} संज्ञा है और 1.1.37 से वह अव्यय है।'

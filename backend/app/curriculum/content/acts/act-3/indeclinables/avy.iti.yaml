  mode: choice
  prompt:
    en: '“The mother says: ‘Read!’” Which sentence?'
    hi: '‘माता कहती है: “पढ़ो!”’ कौन-सा वाक्य?'
  explain:
    en: '{{पठ इति वदति}}: the quote closed by {{इति}}.'
    hi: '{{पठ इति वदति}}: {{इति}} से बन्द उद्धरण।'
  roman: after
  gate: true
  story:
    success:
      en: “माता पठ इति वदति,” you say. “Thus,” says Avyayaka, and he rolls round and settles, like a stone in a stream. “I
        thought I was nothing but a pebble,” he says. “But I am the closing of a thought, and a quote cannot be said without
        me.”
      hi: “माता पठ इति वदति,” आप कहते हैं। “ऐसा,” अव्यय कहता है, और वह धारा में पत्थर की तरह लुढ़ककर बैठ जाता है। “मैंने सोचा
        था मैं बस एक कंकड़ हूँ,” वह कहता है। “पर मैं विचार का समापन हूँ, और मेरे बिना कोई उद्धरण नहीं कहा जा सकता।”
    failure:
      en: He keeps rolling. The quote needs {{इति}}.
      hi: वह लुढ़कता रहता है। उद्धरण को {{इति}} चाहिए।
  options:
  - sa: माता पठ वा वदति
  - sa: माता पठ तु वदति

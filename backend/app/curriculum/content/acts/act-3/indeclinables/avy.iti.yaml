- id: s1
  kind: story
  title:
    en: The word that closes
    hi: बन्द करने वाला शब्द
  depth: core
  image:
    brief: The round white stone spirit stopping mid-pat with a thoughtful look; the Vetāla raising an eyebrow from his branch;
      Dādī and Śuka smiling; a faint glowing speech-mark shape in the air around the spirit's words.
    alt:
      en: A smooth white stone spirit stops mid-pat in thought while a grey spirit raises an eyebrow above
      hi: सोच में थमा चिकना सफ़ेद पत्थर का भूत, ऊपर भौंह उठाता भूरा भूत
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - avyayaka
    place: smashana
    ratio: '4:3'
    id: avy-iti-s1
    text_in_image:
    - इति
  narration:
    en: 'Avyayaka pats himself once more, then stops, pleased, at a thought. “I am whole,” he says, “इति.” “Thus.” The Vetāla
      raises an eyebrow. “Say it once more, but this time as a thought.” “अहं पूर्णः इति चिन्तयामि.” “I think: ‘I am whole’.”
      “That is it,” says Dādī. “इति closes a quotation or a thought, like a pair of marks round it.”'
    hi: 'अव्यय एक बार फिर स्वयं को थपथपाता है, फिर एक विचार पर प्रसन्न होकर रुक जाता है। “मैं पूर्ण हूँ,” वह कहता है, “इति।”
      “ऐसा।” वेताल भौंह उठाता है। “एक बार और कहो, पर इस बार विचार की तरह।” “अहं पूर्णः इति चिन्तयामि।” “मैं सोचता हूँ: ‘मैं
      पूर्ण हूँ’।” “वही,” दादी कहती हैं। “इति उद्धरण या विचार को बन्द करता है, उसके चारों ओर दो चिह्नों की तरह।”'
  quote:
    sa: इत्युक्त्वा सावयोः साध्वी कथामेतामवर्णयत्
    gloss:
      en: Having said so, the good woman told us this tale.
      hi: ऐसा कहकर उस साध्वी ने हमें यह कथा सुनाई।
    source: Kathāsaritsāgara 1.2 (read in the Digital Corpus of Sanskrit)
- id: t1
  kind: teach
  title:
    en: Closing a thought
    hi: विचार को बन्द करना
  depth: core
  skills:
  - avy.iti
  body:
    en: '{{इति}} comes after a quoted word, thought or sentence: {{सः वदति ‘अहं गच्छामि’ इति}}, “he says: ‘I go’”. It also
      means “so”: {{इति उक्त्वा}}, “having said so”. In epics it joins with the next word: {{इत्युवाच}}, “saying so, he said”.'
    hi: '{{इति}} उद्धृत शब्द, विचार या वाक्य के बाद आता है: {{सः वदति ‘अहं गच्छामि’ इति}}, ‘वह कहता है: “मैं जाता हूँ”’। इसका
      अर्थ ‘ऐसा’ भी है: {{इति उक्त्वा}}, ‘ऐसा कहकर’। महाकाव्यों में वह अगले शब्द से जुड़ जाता है: {{इत्युवाच}}, ‘ऐसा कहकर
      बोला’।'
  examples:

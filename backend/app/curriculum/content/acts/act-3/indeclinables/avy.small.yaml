    hi: ‘वही जाता है।’ कौन-सा वाक्य?
  explain:
    en: '{{एव}}: only.'
    hi: '{{एव}}: ही।'
  roman: after
  gate: true
  story:
    success:
      en: '“सः एव गच्छति,” you say, and the round white spirit stops patting himself. “It sits just right,” he says, wondering:
        “one little word, and the whole sentence leans on it.” He rolls a quarter turn, as if settling into place. “I am not
        missing anything,” he says. “I am the part that holds.”'
      hi: '“सः एव गच्छति,” आप कहते हैं, और गोल सफ़ेद भूत स्वयं को थपथपाना बन्द कर देता है। “बिलकुल ठीक बैठता है,” वह विस्मय
        से कहता है: “एक छोटा शब्द, और पूरा वाक्य उस पर टिक जाता है।” वह चौथाई घेरा लुढ़कता है, मानो अपनी जगह बैठ रहा हो। “मुझमें
        कुछ कम नहीं,” वह कहता है। “मैं वह हिस्सा हूँ जो थामता है।”'
    failure:
      en: 'He keeps patting himself. “Only he goes”: {{सः एव गच्छति}}.'
      hi: 'वह स्वयं को थपथपाता रहता है। ‘वही जाता है’: {{सः एव गच्छति}}।'

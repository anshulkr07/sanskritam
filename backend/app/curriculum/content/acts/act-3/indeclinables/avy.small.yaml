        en: after the word it stresses
        hi: जिस पर बल हो उसके बाद
  - - sa: एव
    - text:
        en: only, just
        hi: ही
    - text:
        en: after the word it limits
        hi: जिसे सीमित करे उसके बाद
  - - sa: तु
    - text:
        en: but, however
        hi: परन्तु
    - text:
        en: second in its clause
        hi: अपने वाक्यांश में दूसरा
  - - sa: हि
    - text:
        en: for, indeed
        hi: क्योंकि
    - text:
        en: second in its clause
        hi: अपने वाक्यांश में दूसरा

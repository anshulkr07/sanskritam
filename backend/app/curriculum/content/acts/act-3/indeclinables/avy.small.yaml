- id: tb1
  kind: table
  title:
    en: Little words
    hi: छोटे शब्द
  depth: core
  skills:
  - avy.particles
  caption:
    en: Eight indeclinables
    hi: आठ अव्यय
  columns:
  - en: Word
    hi: शब्द
  - en: Meaning
    hi: अर्थ
  - en: Where it goes
    hi: कहाँ आता है
  rows:
  - - sa: च
    - text:
        en: and
        hi: और
    - text:
        en: after the last item
        hi: अन्तिम वस्तु के बाद
  - - sa: वा
    - text:
        en: or
        hi: या
    - text:
        en: after the choice
        hi: विकल्प के बाद
  - - sa: अपि
    - text:
        en: also, even
        hi: भी
    - text:
        en: after the word it stresses
        hi: जिस पर बल हो उसके बाद
  - - sa: एव
    - text:
        en: only, just
        hi: ही
    - text:
        en: after the word it limits
        hi: जिसे सीमित करे उसके बाद
  - - sa: तु
    - text:
        en: but, however
        hi: परन्तु
    - text:
        en: second in its clause
        hi: अपने वाक्यांश में दूसरा
  - - sa: हि
    - text:
        en: for, indeed
        hi: क्योंकि
    - text:
        en: second in its clause
        hi: अपने वाक्यांश में दूसरा
  - - sa: न
    - text:
        en: not
        hi: नहीं
    - text:
        en: before the verb
        hi: क्रिया से पहले
  - - sa: इव
    - text:
        en: like, as if
        hi: जैसे
    - text:
        en: after the word compared
        hi: जिसकी तुलना हो उसके बाद
  note:
    en: None of them ever takes an ending.
    hi: इनमें से कोई भी कभी प्रत्यय नहीं लेता।

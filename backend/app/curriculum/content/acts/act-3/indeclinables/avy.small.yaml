    hi: ‘वही जाता है।’ कौन-सा वाक्य?
  explain:
    en: '{{एव}}: only.'
    hi: '{{एव}}: ही।'
  roman: after
  gate: true
  story:
    success:
      en: '“सः एव गच्छति,” you say, and the round white spirit stops patting himself. “It sits just right,” he says, wondering: “one little word, and the whole sentence leans on it.” He rolls a quarter turn, as if settling into place. “I am not missing anything,” he says. “I am the part that holds.”'
      hi: '“सः एव गच्छति,” आप कहते हैं, और गोल सफ़ेद भूत स्वयं को थपथपाना बन्द कर देता है। “बिलकुल ठीक बैठता है,” वह विस्मय से कहता है: “एक छोटा शब्द, और पूरा वाक्य उस पर टिक जाता है।” वह चौथाई घेरा लुढ़कता है, मानो अपनी जगह बैठ रहा हो। “मुझमें कुछ कम नहीं,” वह कहता है। “मैं वह हिस्सा हूँ जो थामता है।”'
    failure:
      en: 'He keeps patting himself. “Only he goes”: {{सः एव गच्छति}}.'
      hi: 'वह स्वयं को थपथपाता रहता है। ‘वही जाता है’: {{सः एव गच्छति}}।'
  options:
  - sa: सः अपि गच्छति
  - sa: सः तु गच्छति
  - correct: true
    sa: सः एव गच्छति
- id: pn
  kind: teach
  title:
    en: Pāṇini's indeclinables
    hi: पाणिनि के अव्यय
  depth: panini
  skills:
  - avy.particles
  sutras:
  - 1.1.37
  - 1.1.38
  body:
    en: Sūtra 1.1.37, {{स्वरादिनिपातमव्ययम्}}, calls the words beginning with {{स्वर्}} and the particles {{निपात}}, “indeclinable”. 1.1.38, {{तद्धितश्चासर्वविभक्तिः}}, adds the {{तद्धित}} words that take no case ending. Because they are {{अव्यय}}, their case endings are deleted and they never change.
    hi: सूत्र 1.1.37, {{स्वरादिनिपातमव्ययम्}}, {{स्वर्}} आदि शब्दों और निपातों को ‘अव्यय’ कहता है। 1.1.38, {{तद्धितश्चासर्वविभक्तिः}}, उन {{तद्धित}} शब्दों को जोड़ता है जो सब विभक्तियाँ नहीं लेते। {{अव्यय}} होने से उनकी विभक्तियों का लोप हो जाता है और वे कभी नहीं बदलते।
- id: sum
  kind: summary
  title:
    en: Small words
    hi: छोटे शब्द
  depth: core
  points:
  - sa: च · वा · अपि
    text:
      en: And; or; also.
      hi: और; या; भी।
  - sa: एव · तु · हि
    text:
      en: Only; but; for.
      hi: ही; परन्तु; क्योंकि।
  - text:
      en: They never take endings.
      hi: वे कभी प्रत्यय नहीं लेते।

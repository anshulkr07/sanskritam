- id: s1
  kind: story
  title:
    en: The last night
    hi: अन्तिम रात
  depth: core
  image:
    brief: A tiny perfectly round smooth white stone spirit rolled up to your feet at the foot of the śiṃśapā tree, patting itself as if looking for a place to attach something; the Vetāla hanging above, smiling; Dādī and Śuka looking down; firelight on the smooth stone.
    alt:
      en: A small smooth white stone spirit at a child's feet patting itself, the grey spirit smiling above
      hi: बच्चे के पैरों के पास स्वयं को थपथपाता नन्हा चिकना सफ़ेद पत्थर का भूत, ऊपर मुस्कराता भूरा भूत
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - avyayaka
    place: smashana
    ratio: '4:3'
    id: avy-small-s1
  narration:
    en: 'A small round spirit of white stone rolls up to your feet and stops. No marks, no edges: nothing to hold on to. He pats himself, hunting for a place to attach an ending. “He is whole,” the Vetāla says, “and does not know it. These words never change: च, वा, अपि, एव, तु, हि. They are the joints of every sentence.”'
    hi: 'सफ़ेद पत्थर का एक नन्हा गोल भूत लुढ़कता आपके पैरों के पास आकर रुक जाता है। उस पर कोई चिह्न नहीं, कोई किनारा नहीं: पकड़ने को कुछ नहीं। वह बार-बार स्वयं को थपथपाता है, मानो प्रत्यय लगाने की जगह खोज रहा हो। “वह पूर्ण है,” वेताल कहता है, “और जानता नहीं। ये वे शब्द हैं जो कभी नहीं बदलते: च, वा, अपि, एव, तु, हि। ये हर वाक्य के जोड़ हैं।”'
  quote:
    sa: गुणाढ्येन निबद्धां च तां दृष्ट्वैव महाकथाम् जगाम मुक्तशापः सन् काणभूतिर् निजां गतिम्
    gloss:
      en: Freed from his curse, Kāṇabhūti went to his own place, having only seen the great tale composed by Guṇāḍhya.
      hi: गुणाढ्य की रची उस महाकथा को देखते ही, शाप से मुक्त होकर काणभूति अपने स्थान को गया।
    source: Kathāsaritsāgara 1.8 (read in the Digital Corpus of Sanskrit)
- id: t1
  kind: teach
  title:
    en: Words that never change
    hi: जो कभी नहीं बदलते
  depth: core
  skills:
  - avy.particles
  body:
    en: 'Some words have no endings: they are indeclinable, {{अव्ययम्}}. {{च}} (and), {{वा}} (or), {{अपि}} (also, even), {{एव}} (only, just), {{तु}} (but), {{हि}} (for, indeed), {{न}} (not), {{इव}} (like). They follow the word they belong to.'
    hi: 'कुछ शब्दों में प्रत्यय नहीं होते: वे अव्यय हैं, {{अव्ययम्}}। {{च}} (और), {{वा}} (या), {{अपि}} (भी), {{एव}} (ही), {{तु}} (परन्तु), {{हि}} (क्योंकि), {{न}} (नहीं), {{इव}} (जैसे)। वे उस शब्द के बाद आते हैं जिससे जुड़े हों।'
  examples:

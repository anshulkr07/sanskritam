- id: s1
  kind: story
  title:
    en: The six odd drawers
    hi: छह विचित्र दराज़
  depth: core
  image:
    brief: A small plain ash-coloured spirit stepping out of an opened drawer, without any marks or ornaments, patting itself
      to check it is there; Dhātuka holding his ledger a little pale; the Vetāla and Dādī watching; firelight.
    alt:
      en: A plain ash-coloured spirit steps out of a drawer and pats itself to check it exists
      hi: दराज़ से निकलता सादा राख-रंगा भूत, स्वयं को थपथपाकर जाँचता कि वह है
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - dhatuka
    - astika
    place: smashana
    ratio: '4:3'
    id: vc2-as-s1
  narration:
    en: 'The eighth night. Dhātuka holds up his ledger, rather pale. “Six drawers left. They are the odd ones, where verbs
      do not follow the pattern.” He opens the second. Out of it steps a small plain spirit, with no marks or ornaments at
      all, patting himself to check he is there. “अस्ति,” says the Vetāla. “He is.” Dādī: “And ‘he goes’ is एति.”'
    hi: 'आठवीं रात। धातुक अपनी बही उठाता है, कुछ पीला-सा। “छह दराज़ बचे हैं। वे विचित्र वाले हैं, जहाँ क्रियाएँ ढाँचे पर नहीं
      चलतीं।” वह दूसरा खोलता है। उसमें से एक छोटा सादा भूत निकलता है, जिस पर कोई चिह्न या सजावट नहीं, और वह स्वयं को थपथपाकर
      जाँचता है कि वह है। “अस्ति,” वेताल कहता है। “वह है।” दादी: “और ‘वह जाता है’ एति है।”'
  lines:
  - speaker: dadi
    sa: अस्ति। एति।
    gloss:
      en: He is. He goes.
      hi: वह है। वह जाता है।
- id: t1
  kind: teach
  title:
    en: No sign at all
    hi: कोई चिह्न नहीं
  depth: core
  skills:
  - verb.class-2
  body:
    en: 'Class 2, {{अदादि}}, adds no sign: the ending joins the root directly, and the root often changes inside. {{अस्}}
      gives {{अस्ति}}, {{स्तः}}, {{सन्ति}}; {{इ}} gives {{एति}}, {{इतः}}, {{यन्ति}}; {{या}} gives {{याति}}; {{ब्रू}} gives
      {{ब्रवीति}}.'
    hi: 'गण 2, {{अदादि}}, कोई चिह्न नहीं जोड़ता: प्रत्यय सीधे धातु से जुड़ता है, और धातु भीतर से अक्सर बदलती है। {{अस्}} से
      {{अस्ति}}, {{स्तः}}, {{सन्ति}}; {{इ}} से {{एति}}, {{इतः}}, {{यन्ति}}; {{या}} से {{याति}}; {{ब्रू}} से {{ब्रवीति}}।'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'Class 2, {{अदादि}}, adds no sign: the ending joins the root directly, and the root often changes inside. {{अस्}}
        gives {{अस्ति}}, {{स्तः}}, {{सन्ति}}; {{इ}} gives {{एति}}, {{इतः}}, {{यन्ति}}; {{या}} gives {{याति}}; {{ब्रू}} gives
        {{ब्रवीति}}.'
      hi: 'गण 2, {{अदादि}}, कोई चिह्न नहीं जोड़ता: प्रत्यय सीधे धातु से जुड़ता है, और धातु भीतर से अक्सर बदलती है। {{अस्}}
        से {{अस्ति}}, {{स्तः}}, {{सन्ति}}; {{इ}} से {{एति}}, {{इतः}}, {{यन्ति}}; {{या}} से {{याति}}; {{ब्रू}} से {{ब्रवीति}}।'

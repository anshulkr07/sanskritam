    hi: बिना चिह्न का गण
  depth: panini
  skills:
  - verb.class-2
  sutras:
  - 2.4.72
  - 6.4.111
  body:
    en: 'Sūtra 2.4.72, {{अदिप्रभृतिभ्यः शपः}}, deletes the sign {{शप्}} after {{अद्}} and its class, so the ending joins the
      root. 6.4.111, {{श्नसोरल्लोपः}}, drops the {{अ}} of {{अस्}} before a weak ending: {{स्तः}}, {{सन्ति}}.'
    hi: 'सूत्र 2.4.72, {{अदिप्रभृतिभ्यः शपः}}, {{अद्}} आदि धातुओं के बाद चिह्न {{शप्}} का लोप कर देता है, इसलिए प्रत्यय धातु
      से सीधे जुड़ता है। 6.4.111, {{श्नसोरल्लोपः}}, निर्बल प्रत्यय से पहले {{अस्}} का {{अ}} हटा देता है: {{स्तः}}, {{सन्ति}}।'

  story:
    success:
      en: '“सन्ति,” you say, and the plain spirit stops patting himself. Behind him, in the dark, there are other small shapes:
        they are, they are. “They are,” he whispers. “I did not know there were others.” He steps back into his drawer and,
        for the first time, shuts it himself, with a click.'
      hi: '“सन्ति,” आप कहते हैं, और सादा भूत स्वयं को थपथपाना छोड़ देता है। उसके पीछे अँधेरे में और भी नन्ही आकृतियाँ हैं:
        वे हैं, वे हैं। “वे हैं,” वह फुसफुसाता है। “मुझे नहीं पता था कि और भी हैं।” वह अपने दराज़ में लौट जाता है और पहली
        बार स्वयं उसे खट से बन्द कर देता है।'
    failure:
      en: 'He keeps patting himself. They, many: {{सन्ति}}.'
      hi: 'वह स्वयं को थपथपाता रहता है। वे, अनेक: {{सन्ति}}।'
  options:

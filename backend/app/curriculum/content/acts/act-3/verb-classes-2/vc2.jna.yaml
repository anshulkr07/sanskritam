    hi: '{{छिनत्ति}}: भीतर नासिक्य।'
  roman: after
  gate: true
  story:
    success:
      en: '“छिनत्ति,” you say, and the small hand snips its thread, cleanly, and lets the ends float away on the air, like
        a ribbon being let go. The other figure, having knocked, taken and weighed, writes on the stone, in a tiny hand: जानाति.
        “That is how to know,” it says. “One must be willing to cut.” All ten drawers are shut; the ledger is complete.'
      hi: '“छिनत्ति,” आप कहते हैं, और नन्हा हाथ अपना धागा साफ़ काट देता है और सिरों को हवा में तैरने देता है, जैसे कोई फीता
        छोड़ा गया हो। दूसरी आकृति, दस्तक देकर, लेकर और तौलकर, पत्थर पर नन्हे अक्षरों में लिखती है: जानाति। “जानने का यही तरीक़ा
        है,” वह कहती है। “काटने को तैयार रहना पड़ता है।” सभी दस दराज़ बन्द हैं; बही पूरी है।'
    failure:
      en: 'The thread stays whole. The nasal inside: {{छिनत्ति}}.'
      hi: 'धागा साबुत रहता है। भीतर नासिक्य: {{छिनत्ति}}।'

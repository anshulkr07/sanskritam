- id: pn
  kind: teach
  title:
    en: Pāṇini's two signs
    hi: पाणिनि के दो चिह्न
  depth: panini
  skills:
  - verb.class-7-9
  sutras:
  - 3.1.78
  - 3.1.81
  - 6.4.112
  body:
    en: 'Sūtra 3.1.78, {{रुधादिभ्यः श्नम्}}, puts the infix {{श्नम्}} inside the root of class 7: {{रुध् + न + ध्}}. 3.1.81,
      {{क्र्यादिभ्यः श्ना}}, adds {{श्ना}} to class 9, which gives {{-ना-}}; and 6.4.112, {{श्नाऽभ्यस्तयोरातः}}, drops its
      {{आ}} before a weak ending: {{जानीतः}}.'
    hi: 'सूत्र 3.1.78, {{रुधादिभ्यः श्नम्}}, गण 7 की धातु के भीतर {{श्नम्}} रखता है: {{रुध् + न + ध्}}। 3.1.81, {{क्र्यादिभ्यः
      श्ना}}, गण 9 में {{श्ना}} जोड़ता है, जिससे {{-ना-}} बनता है; और 6.4.112, {{श्नाऽभ्यस्तयोरातः}}, निर्बल प्रत्यय से पहले
      उसका {{आ}} हटा देता है: {{जानीतः}}।'

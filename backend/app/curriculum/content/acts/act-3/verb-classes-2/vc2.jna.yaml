- id: s1
  kind: story
  title:
    en: The knowing drawer
    hi: जानने वाला दराज़
  depth: core
  image:
    brief: 'Two small hands reaching out of two opened drawers: one cutting a thread with tiny scissors, the other holding
      a little scale; the Vetāla leaning back with a pleased look; Dādī reciting; Dhātuka ticking his ledger.'
    alt:
      en: Two tiny hands from open drawers, one cutting a thread, one weighing on a small scale
      hi: 'खुले दराज़ों से दो नन्हे हाथ: एक धागा काटता, एक तराज़ू पर तौलता'
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - dhatuka
    - astika
    place: smashana
    ratio: '4:3'
    id: vc2-jna-s1
    text_in_image:
    - छिद्
    - छिनत्ति
    - क्री
    - क्रीणाति
  narration:
    en: 'The last two drawers open together. From one a small hand reaches out and carefully cuts a thread with scissors:
      “छिनत्ति.” From the other a small figure knocks, takes and weighs: “जानाति, गृह्णाति.” The Vetāla leans back. “He cuts,
      he knows, he takes. There is a verse that gathers six of these verbs; Dādī can say it.” She does.'
    hi: 'अन्तिम दो दराज़ साथ खुलते हैं। एक से नन्हा हाथ बाहर निकलकर सावधानी से कैंची से धागा काटता है: “छिनत्ति।” दूसरे से
      एक नन्ही आकृति दस्तक देती है, लेती है और तौलती है: “जानाति, गृह्णाति।” वेताल पीछे झुकता है। “वह काटता है, जानता है,
      लेता है। एक श्लोक है जो इनमें से छह क्रियाओं को एक साथ लाता है; दादी उसे सुना सकती हैं।” वे सुनाती हैं।'
  quote:
    sa: ददाति प्रतिगृह्णाति गुह्यम् आख्याति पृच्छति भुङ्क्ते भोजयते चैव षड्विधं प्रीतिलक्षणम्
    gloss:
      en: 'He gives, he takes, he tells a secret, he asks, he eats, he feeds: these are the six marks of affection.'
      hi: 'वह देता है, लेता है, गुप्त बात बताता है, पूछता है, खाता है, खिलाता है: ये प्रीति के छह लक्षण हैं।'
    source: Pañcatantra 2.50 and 4.13 (read at GRETIL)
- id: t1
  kind: teach
  title:
    en: The nasal and the -ना-
    hi: नासिक्य और -ना-
  depth: core
  skills:
  - verb.class-7-9
  body:
    en: 'Class 7, {{रुधादि}}, puts a nasal inside the root before its last letter: {{रुध्}} gives {{रुणद्धि}} (blocks), {{भिद्}}
      gives {{भिनत्ति}} (splits), {{छिद्}} gives {{छिनत्ति}} (cuts), {{युज्}} gives {{युनक्ति}} (joins). Class 9, {{क्र्यादि}},
      adds {{-ना-}}: {{ज्ञा}} gives {{जानाति}}, {{ग्रह्}} gives {{गृह्णाति}}, {{क्री}} gives {{क्रीणाति}}.'
    hi: 'गण 7, {{रुधादि}}, धातु के अन्तिम अक्षर से पहले भीतर एक नासिक्य रखता है: {{रुध्}} से {{रुणद्धि}} (रोकता है), {{भिद्}}
      से {{भिनत्ति}} (तोड़ता है), {{छिद्}} से {{छिनत्ति}} (काटता है), {{युज्}} से {{युनक्ति}} (जोड़ता है)। गण 9, {{क्र्यादि}},
      {{-ना-}} जोड़ता है: {{ज्ञा}} से {{जानाति}}, {{ग्रह्}} से {{गृह्णाति}}, {{क्री}} से {{क्रीणाति}}।'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'Class 7, {{रुधादि}}, puts a nasal inside the root before its last letter: {{रुध्}} gives {{रुणद्धि}} (blocks),
        {{भिद्}} gives {{भिनत्ति}} (splits), {{छिद्}} gives {{छिनत्ति}} (cuts), {{युज्}} gives {{युनक्ति}} (joins). Class
        9, {{क्र्यादि}}, adds {{-ना-}}: {{ज्ञा}} gives {{जानाति}}, {{ग्रह्}} gives {{गृह्णाति}}, {{क्री}} gives {{क्रीणाति}}.'
      hi: 'गण 7, {{रुधादि}}, धातु के अन्तिम अक्षर से पहले भीतर एक नासिक्य रखता है: {{रुध्}} से {{रुणद्धि}} (रोकता है), {{भिद्}}
        से {{भिनत्ति}} (तोड़ता है), {{छिद्}} से {{छिनत्ति}} (काटता है), {{युज्}} से {{युनक्ति}} (जोड़ता है)। गण 9, {{क्र्यादि}},
        {{-ना-}} जोड़ता है: {{ज्ञा}} से {{जानाति}}, {{ग्रह्}} से {{गृह्णाति}}, {{क्री}} से {{क्रीणाति}}।'

  mode: choice
  prompt:
    en: “He gives.” Which form?
    hi: ‘वह देता है।’ कौन-सा रूप?
  explain:
    en: '{{ददाति}}.'
    hi: '{{ददाति}}।'
  roman: after
  options:
  - sa: दाति
  - correct: true
    sa: ददाति
  - sa: देति
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Class 3, {{जुहोत्यादि}}, doubles the beginning of the root: {{दा}} gives {{ददाति}} (gives), {{धा}} gives {{दधाति}}
        (places), {{हु}} gives {{जुहोति}} (offers), {{भी}} gives {{बिभेति}} (fears), {{भृ}} gives {{बिभर्ति}} (carries). The
        plural ends in {{-ति}} after the doubled root: {{ददति}}.'
      hi: 'गण 3, {{जुहोत्यादि}}, धातु का आरम्भ दुगुना कर देता है: {{दा}} से {{ददाति}} (देता है), {{धा}} से {{दधाति}} (रखता
        है), {{हु}} से {{जुहोति}} (हवन करता है), {{भी}} से {{बिभेति}} (डरता है), {{भृ}} से {{बिभर्ति}} (धारण करता है)। बहुवचन
        दुगुनी धातु के बाद {{-ति}} पर समाप्त होता है: {{ददति}}।'

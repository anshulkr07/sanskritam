- id: p7
  kind: practice
  depth: core
  skills:
  - verb.class-2
  - verb.class-3
  - verb.class-5-8
  - verb.class-7-9
  mode: order
  prompt:
    en: 'Complete Astika: “He is, he goes, he gives, he does, he knows.”'
    hi: 'अस्तिक को पूरा कीजिए: ‘वह है, वह जाता है, वह देता है, वह करता है, वह जानता है।’'
  explain:
    en: '{{अस्ति एति ददाति करोति जानाति}}: five odd drawers.'
    hi: '{{अस्ति एति ददाति करोति जानाति}}: पाँच विचित्र दराज़।'
  roman: after
  gate: true
  story:
    success:
      en: “अस्ति, एति, ददाति, करोति, जानाति,” you say, and Astika, who had spent a thousand years patting himself, stops.
        “I am,” he says wonderingly. “I go. I give. I do. I know.” He puts his hands in front of him and looks at them, and
        the plain grey of his edges takes on a faint warm colour, as if each verb had left a little of its own. “सेवते,” he
        says shyly, trying the word. “लभते.” “He serves, he obtains,” Dādī whispers. “Those are for oneself.”
      hi: “अस्ति, एति, ददाति, करोति, जानाति,” आप कहते हैं, और अस्तिक, जिसने हज़ार वर्ष स्वयं को थपथपाते बिताए, रुक जाता है।
        “मैं हूँ,” वह विस्मय से कहता है। “मैं जाता हूँ। मैं देता हूँ। मैं करता हूँ। मैं जानता हूँ।” वह अपने हाथ सामने रखकर
        उन्हें देखता है, और उसके किनारों का सादा धूसर रंग हल्के गर्म रंग में बदल जाता है, मानो हर क्रिया अपना थोड़ा-सा रंग
        छोड़ गई हो। “सेवते,” वह झिझकते हुए शब्द आज़माता है। “लभते।” “वह सेवा करता है, वह पाता है,” दादी फुसफुसाती हैं। “ये
        अपने लिए हैं।”
    failure:
      en: 'Astika waits. The five verbs: {{अस्ति एति ददाति करोति जानाति}}.'
      hi: 'अस्तिक प्रतीक्षा करता है। पाँच क्रियाएँ: {{अस्ति एति ददाति करोति जानाति}}।'
  tokens:

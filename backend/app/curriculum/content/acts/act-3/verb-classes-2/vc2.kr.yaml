- id: p4
  kind: practice
  title:
    en: Drawers five and eight
    hi: दराज़ पाँच और आठ
  depth: core
  skills:
  - verb.class-5-8
  mode: choice
  prompt:
    en: “They do.” Which form of {{कृ}}?
    hi: ‘वे करते हैं।’ {{कृ}} का कौन-सा रूप?
  explain:
    en: '{{कुर्वन्ति}}: the weak stem {{कुर्व-}}.'
    hi: '{{कुर्वन्ति}}: निर्बल अंग {{कुर्व-}}।'
  roman: after
  gate: true
  story:
    success:
      en: '“कुर्वन्ति,” you say, and every spirit in the circle drops its hands from its ears. A hush, and then a sound like a great number of very small tools being laid down at once: they have heard, they are doing. Drawers five and eight shut, one after the other, with the softest clicks of all.'
      hi: '“कुर्वन्ति,” आप कहते हैं, और घेरे का हर भूत अपने कान से हाथ हटा लेता है। एक सन्नाटा, और फिर ऐसी आवाज़ जैसे बहुत-से नन्हे औज़ार एक साथ रखे जा रहे हों: उन्होंने सुना, वे कर रहे हैं। दराज़ पाँच और आठ बारी-बारी बन्द होते हैं, सबसे मुलायम खट के साथ।'
    failure:
      en: 'The circle keeps listening. They do: {{कुर्वन्ति}}.'
      hi: 'घेरा सुनता रहता है। वे करते हैं: {{कुर्वन्ति}}।'
  options:
  - sa: करोन्ति
  - sa: कुरुन्ति
  - correct: true
    sa: कुर्वन्ति
- id: pn
  kind: teach
  title:
    en: Pāṇini's {{नु}} and {{उ}}
    hi: पाणिनि के {{नु}} और {{उ}}
  depth: panini
  skills:
  - verb.class-5-8
  sutras:
  - 3.1.73
  - 3.1.79
  - 3.1.74
  body:
    en: 'Sūtra 3.1.73, {{स्वादिभ्यः श्नुः}}, adds {{श्नु}} to class 5, and 3.1.79, {{तनादिकृञ्भ्य उः}}, adds {{उ}} to class 8 and to {{कृ}}. And 3.1.74, {{श्रुवः शृ च}}, gives {{श्रु}} the {{श्नु}} sign and turns it into {{शृ}}: {{शृणोति}}.'
    hi: 'सूत्र 3.1.73, {{स्वादिभ्यः श्नुः}}, गण 5 में {{श्नु}} जोड़ता है, और 3.1.79, {{तनादिकृञ्भ्य उः}}, गण 8 और {{कृ}} में {{उ}} जोड़ता है। और 3.1.74, {{श्रुवः शृ च}}, {{श्रु}} को {{श्नु}} चिह्न देता है और उसे {{शृ}} बना देता है: {{शृणोति}}।'

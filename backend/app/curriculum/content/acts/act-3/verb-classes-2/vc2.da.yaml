- id: pn
  kind: teach
  title:
    en: Pāṇini's doubling class
    hi: द्वित्व वाला गण
  depth: panini
  skills:
  - verb.class-3
  sutras:
  - 2.4.75
  - 6.1.10
  - 7.4.58
  body:
    en: Sūtra 2.4.75, {{जुहोत्यादिभ्यः श्लुः}}, replaces the sign {{शप्}} with {{श्लु}}, which is deleted but leaves the root
      doubled. 6.1.10, {{श्लौ}}, orders the doubling. And 7.4.58, {{अत्र लोपोऽभ्यासस्य}}, shortens the doubled start, giving
      {{दद-}}.
    hi: सूत्र 2.4.75, {{जुहोत्यादिभ्यः श्लुः}}, चिह्न {{शप्}} की जगह {{श्लु}} रखता है, जो लुप्त हो जाता है पर धातु को दुगुना
      छोड़ जाता है। 6.1.10, {{श्लौ}}, द्वित्व का आदेश देता है। और 7.4.58, {{अत्र लोपोऽभ्यासस्य}}, दुगुने आरम्भ को छोटा करता
      है और {{दद-}} देता है।
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:

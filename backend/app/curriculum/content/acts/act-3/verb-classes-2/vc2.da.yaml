    success:
      en: “बिभेति,” you say, and the giving spirit's apples all fall, one after another, and roll away. He stands there, empty-handed,
        with the first look of fear his drawer has ever seen. Then he laughs. “Of course,” he says. “Even a giver fears. I
        give, therefore I fear.” He picks the apples up again, one by one, and gives them to you.
      hi: “बिभेति,” आप कहते हैं, और देने वाले भूत के सारे सेब एक के बाद एक गिरकर लुढ़क जाते हैं। वह ख़ाली हाथ खड़ा रह जाता
        है, भय का वह पहला भाव लिए जो उसके दराज़ ने कभी देखा। फिर वह हँसता है। “स्वाभाविक है,” वह कहता है। “देने वाला भी डरता
        है। मैं देता हूँ, इसलिए डरता हूँ।” वह सेब एक-एक करके फिर उठाता है और आपको दे देता है।

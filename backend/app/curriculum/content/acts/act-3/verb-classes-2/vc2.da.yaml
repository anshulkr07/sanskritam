cards:
- id: s1
  kind: story
  title:
    en: The doubling drawer
    hi: द्वित्व वाला दराज़
  depth: core
  image:
    brief: A small spirit emerging from an open drawer, bowing and handing an apple to you, with two more apples in its other
      hand; Dhātuka beside it ticking a list; Dādī laughing; Śuka eyeing an apple.
    alt:
      en: A small spirit from a drawer bows and hands over apples while a parrot eyes one
      hi: दराज़ से निकला नन्हा भूत झुककर सेब देता, तोता एक पर नज़र टिकाए
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - dhatuka
    - astika
    place: smashana
    ratio: '4:3'
    id: vc2-da-s1
    text_in_image:
    - दा
    - ददाति
    - धा
    - दधाति
  narration:
    en: 'Drawer three rattles. It holds a small spirit that says everything twice, and bows, and gives: दद-दद. “ददाति,” says
      the Vetāla, “he gives.” The spirit offers you an apple, then another, then another, each time repeating the word. Dādī
      laughs. “Class 3 doubles the first syllable of the root, so that it is easy to remember: दा becomes दद, हु becomes जुहु.”'
    hi: 'तीसरा दराज़ खड़खड़ाता है। उसमें एक नन्हा भूत है जो हर बात दो बार कहता है, झुकता है और देता है: दद-दद। “ददाति,” वेताल
      कहता है, “वह देता है।” भूत आपको एक सेब देता है, फिर दूसरा, फिर तीसरा, हर बार शब्द दोहराता हुआ। दादी हँस पड़ती हैं। “गण
      3 धातु का पहला अक्षर दोहरा देता है, ताकि याद रखना आसान हो: दा से दद बनता है, हु से जुहु।”'
  lines:
  - speaker: vetala
    sa: ददाति
    gloss:
      en: He gives.
      hi: वह देता है।
    check:
      type: tinanta
      dhatu: दा
      lakara: Lat
      purusha: Prathama
      vacana: Eka
      gana: Juhotyadi
- id: t1
  kind: teach
  title:
    en: The first syllable twice
    hi: पहला अक्षर दो बार
  depth: core
  skills:
  - verb.class-3
  body:
    en: 'Class 3, {{जुहोत्यादि}}, doubles the beginning of the root: {{दा}} gives {{ददाति}} (gives), {{धा}} gives {{दधाति}}
      (places), {{हु}} gives {{जुहोति}} (offers), {{भी}} gives {{बिभेति}} (fears), {{भृ}} gives {{बिभर्ति}} (carries). The
      plural ends in {{-ति}} after the doubled root: {{ददति}}.'
    hi: 'गण 3, {{जुहोत्यादि}}, धातु का आरम्भ दुगुना कर देता है: {{दा}} से {{ददाति}} (देता है), {{धा}} से {{दधाति}} (रखता है),
      {{हु}} से {{जुहोति}} (हवन करता है), {{भी}} से {{बिभेति}} (डरता है), {{भृ}} से {{बिभर्ति}} (धारण करता है)। बहुवचन दुगुनी
      धातु के बाद {{-ति}} पर समाप्त होता है: {{ददति}}।'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: 'Class 3, {{जुहोत्यादि}}, doubles the beginning of the root: {{दा}} gives {{ददाति}} (gives), {{धा}} gives {{दधाति}}
        (places), {{हु}} gives {{जुहोति}} (offers), {{भी}} gives {{बिभेति}} (fears), {{भृ}} gives {{बिभर्ति}} (carries). The
        plural ends in {{-ति}} after the doubled root: {{ददति}}.'
      hi: 'गण 3, {{जुहोत्यादि}}, धातु का आरम्भ दुगुना कर देता है: {{दा}} से {{ददाति}} (देता है), {{धा}} से {{दधाति}} (रखता
        है), {{हु}} से {{जुहोति}} (हवन करता है), {{भी}} से {{बिभेति}} (डरता है), {{भृ}} से {{बिभर्ति}} (धारण करता है)। बहुवचन
        दुगुनी धातु के बाद {{-ति}} पर समाप्त होता है: {{ददति}}।'

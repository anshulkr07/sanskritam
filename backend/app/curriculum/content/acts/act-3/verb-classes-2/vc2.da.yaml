        root doubled. 6.1.10, {{श्लौ}}, orders the doubling. And 7.4.58, {{अत्र लोपोऽभ्यासस्य}}, shortens the doubled start,
        giving {{दद-}}.
      hi: सूत्र 2.4.75, {{जुहोत्यादिभ्यः श्लुः}}, चिह्न {{शप्}} की जगह {{श्लु}} रखता है, जो लुप्त हो जाता है पर धातु को दुगुना
        छोड़ जाता है। 6.1.10, {{श्लौ}}, द्वित्व का आदेश देता है। और 7.4.58, {{अत्र लोपोऽभ्यासस्य}}, दुगुने आरम्भ को छोटा करता
        है और {{दद-}} देता है।
    items:

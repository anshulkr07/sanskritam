- id: conditions
  kind: revision
  title:
    en: How to tell the class
    hi: गण कैसे पहचानें
  depth: core
  section: conditions
  rows:
  - skill: verb.class-2
    rule:
      en: If the ending joins the root directly, think class 2.
      hi: प्रत्यय सीधे धातु से जुड़े तो गण 2 सोचिए।
    tag: good
    taught_in: vc2.as#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Class 2, {{अदादि}}, adds no sign: the ending joins the root directly, and the root often changes inside. {{अस्}}
          gives {{अस्ति}}, {{स्तः}}, {{सन्ति}}; {{इ}} gives {{एति}}, {{इतः}}, {{यन्ति}}; {{या}} gives {{याति}}; {{ब्रू}} gives
          {{ब्रवीति}}.'
        hi: 'गण 2, {{अदादि}}, कोई चिह्न नहीं जोड़ता: प्रत्यय सीधे धातु से जुड़ता है, और धातु भीतर से अक्सर बदलती है। {{अस्}}
          से {{अस्ति}}, {{स्तः}}, {{सन्ति}}; {{इ}} से {{एति}}, {{इतः}}, {{यन्ति}}; {{या}} से {{याति}}; {{ब्रू}} से {{ब्रवीति}}।'
      items:
      - id: i0
        sa: अदादि
      - id: i1
        sa: अस्
      - id: i2
        sa: अस्ति
      - id: i3
        sa: स्तः
      - id: i4
        sa: सन्ति
      - id: i5
        sa: इ
      - id: i6
        sa: एति
      - id: i7
        sa: इतः
      - id: i8
        sa: यन्ति
      - id: i9
        sa: या
      - id: i10
        sa: याति
      - id: i11
        sa: ब्रू
      - id: i12
        sa: ब्रवीति
  - skill: verb.class-3
    rule:
      en: A doubled first syllable means class 3.
      hi: दुगुना पहला अक्षर हो तो गण 3।
    tag: good
    taught_in: vc2.da#t1
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Class 3, {{जुहोत्यादि}}, doubles the beginning of the root: {{दा}} gives {{ददाति}} (gives), {{धा}} gives {{दधाति}}
          (places), {{हु}} gives {{जुहोति}} (offers), {{भी}} gives {{बिभेति}} (fears), {{भृ}} gives {{बिभर्ति}} (carries).
          The plural ends in {{-ति}} after the doubled root: {{ददति}}.'
        hi: 'गण 3, {{जुहोत्यादि}}, धातु का आरम्भ दुगुना कर देता है: {{दा}} से {{ददाति}} (देता है), {{धा}} से {{दधाति}} (रखता
          है), {{हु}} से {{जुहोति}} (हवन करता है), {{भी}} से {{बिभेति}} (डरता है), {{भृ}} से {{बिभर्ति}} (धारण करता है)। बहुवचन
          दुगुनी धातु के बाद {{-ति}} पर समाप्त होता है: {{ददति}}।'
      items:
      - id: i0
        sa: जुहोत्यादि
      - id: i1
        sa: दा
      - id: i2
        sa: ददाति
      - id: i3
        sa: धा
      - id: i4
        sa: दधाति
      - id: i5
        sa: हु
      - id: i6
        sa: जुहोति
      - id: i7
        sa: भी
      - id: i8
        sa: बिभेति
      - id: i9
        sa: भृ
      - id: i10
        sa: बिभर्ति
      - id: i11
        sa: -ति
      - id: i12
        sa: ददति
  - skill: verb.class-5-8
    rule:
      en: '{{-ओति}} or {{-नोति}}: class 5 or 8.'
      hi: '{{-ओति}} या {{-नोति}}: गण 5 या 8।'
    tag: good
    taught_in: vc2.kr#t1
    visuals:
    - id: v-linked-2
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Class 5, {{स्वादि}}, adds {{-नु-}} (strong {{-नो-}}): {{आप्}} gives {{आप्नोति}} (gets), {{चि}} gives {{चिनोति}}

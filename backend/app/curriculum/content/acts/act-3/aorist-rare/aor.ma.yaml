- id: s1
  kind: story
  title:
    en: A word for every fear
    hi: हर भय के लिए एक शब्द
  depth: core
  image:
    brief: A ring of golden sparks in the dark trembling as a branch cracks somewhere far; the Vetāla speaking softly to them with an open hand; you kneeling beside the smallest spark with Dādī's hand on your shoulder; Śuka close against your arm.
    alt:
      en: A ring of golden sparks trembles in the dark while a grey spirit speaks softly and a child kneels beside the smallest
      hi: अँधेरे में काँपता सुनहरे स्फुलिंगों का घेरा, कोमलता से बोलता भूत, सबसे छोटे के पास बैठा बच्चा
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - abhutaka
    place: smashana
    ratio: '4:3'
    id: aor-ma-s1
  narration:
    en: 'The ring of sparks trembles. Somewhere in the dark, a branch cracks. “मा भैषीः,” the Vetāla says to the sparks, softly. “Do not be afraid.” The word drops the augment the aorist wears and changes everything: a statement becomes a plea. “Say it to him,” Dādī whispers, nodding at the little spark. “He needs to hear it from you.”'
    hi: 'चिंगारियों का घेरा काँपता है। अँधेरे में कहीं एक डाल चटकती है। “मा भैषीः,” वेताल चिंगारियों से धीमे कहता है। “मत डरो।” शब्द वह आगम छोड़ देता है जो लुङ् पहनता है, और सब कुछ बदल जाता है: कथन एक विनती बन जाता है। “उससे कहिए,” दादी नन्हे स्फुलिंग की ओर सिर हिलाकर फुसफुसाती हैं। “उसे आपसे सुनना है।”'
  quote:
    sa: मा शुचः संपदं दैवीम् अभिजातो ऽसि पाण्डव
    gloss:
      en: 'Do not grieve: you are born to the divine endowment, Pāṇḍava.'
      hi: 'शोक मत करो: हे पाण्डव, तुम दैवी सम्पदा के लिए उत्पन्न हुए हो।'
    source: Bhagavadgītā 16.5 (read at GRETIL)
- id: t1
  kind: teach
  title:
    en: '{{मा}} and the bare aorist'
    hi: '{{मा}} और बिना आगम का लुङ्'
  depth: core
  skills:
  - verb.ma
  body:
    en: 'To say “do not …” use {{मा}} with the aorist, and drop the augment {{अ}}: {{अगमः}} (you went) becomes {{मा गमः}} (do not go); {{अभूत्}} becomes {{मा भूत्}} (let it not be); {{अभैषीः}} becomes {{मा भैषीः}} (do not fear). {{मा शुचः}}, “do not grieve”, is the same kind of form.'
    hi: '‘मत …’ कहने के लिए {{मा}} के साथ लुङ् लीजिए और आगम {{अ}} हटा दीजिए: {{अगमः}} (तुम गए) से {{मा गमः}} (मत जाओ); {{अभूत्}} से {{मा भूत्}} (न हो); {{अभैषीः}} से {{मा भैषीः}} (मत डरो)। {{मा शुचः}}, ‘शोक मत करो’, इसी प्रकार का रूप है।'
  examples:
  - sa: मा गमः।
    meaning:
      en: Do not go.
      hi: मत जाओ।
    words:
    - sa: मा
      gloss:
        en: do not
        hi: मत
    - sa: गमः
      gloss:
        en: go
        hi: जाओ
  - sa: मा भैषीः।
    meaning:
      en: Do not fear.
      hi: मत डरो।
    words:
    - sa: मा
      gloss:
        en: do not
        hi: मत
    - sa: भैषीः
      gloss:
        en: fear
        hi: डरो
  - sa: मा भूत्।
    meaning:
      en: Let it not be.
      hi: ऐसा न हो।
    words:
    - sa: मा
      gloss:
        en: let not
        hi: न हो
    - sa: भूत्
      gloss:
        en: it be
        hi: वह

- id: p5
  kind: practice
  title:
    en: Do not fear
    hi: मत डरो
  depth: core
  skills:
  - verb.ma
  mode: choice
  prompt:
    en: “Let it not be.” Which form?
    hi: ‘ऐसा न हो।’ कौन-सा रूप?
  explain:
    en: '{{मा भूत्}}: no augment after {{मा}}.'
    hi: '{{मा भूत्}}: {{मा}} के बाद आगम नहीं।'
  roman: after
  gate: true
  story:
    success:
      en: '“मा भैषीः,” you say to the little spark, and it steadies, and then, very slowly, it begins to grow. It is not a spark any more: it is a small clear flame, a lamp-flame, standing alone in the air without wick or oil. “अभूत्,” it says, in a voice that is quite its own. “अभूत्.” The Vetāla bows to it.'
      hi: '“मा भैषीः,” आप नन्हे स्फुलिंग से कहते हैं, और वह स्थिर हो जाता है, और फिर, बहुत धीरे-धीरे, बढ़ने लगता है। वह अब स्फुलिंग नहीं रहा: एक छोटी स्वच्छ लौ है, दीपक की लौ, बिना बाती या तेल के हवा में अकेली खड़ी। “अभूत्,” वह कहता है, एक ऐसी आवाज़ में जो ठीक उसकी अपनी है। “अभूत्।” वेताल उसे प्रणाम करता है।'
    failure:
      en: 'The spark trembles. “Let it not be”: {{मा भूत्}}.'
      hi: 'स्फुलिंग काँपता है। ‘ऐसा न हो’: {{मा भूत्}}।'
  options:
  - sa: मा अभूत्
  - sa: न भवति
  - correct: true
    sa: मा भूत्
- id: pn
  kind: teach
  title:
    en: Pāṇini's {{मा}}
    hi: पाणिनि का {{मा}}
  depth: panini
  skills:
  - verb.ma
  sutras:
  - 3.3.175
  - 6.4.74
  body:
    en: Sūtra 3.3.175, {{माङि लुङ्}}, says that after {{मा}} the {{लुङ्}} is used. And 6.4.74, {{न माङ्योगे}}, says the augment {{अ}} does not appear when {{मा}} is attached. So {{अगमः}} becomes {{मा गमः}}.
    hi: सूत्र 3.3.175, {{माङि लुङ्}}, कहता है कि {{मा}} के साथ {{लुङ्}} आता है। और 6.4.74, {{न माङ्योगे}}, कहता है कि {{मा}} जुड़ा हो तो आगम {{अ}} नहीं आता। इसलिए {{अगमः}} से {{मा गमः}} बनता है।

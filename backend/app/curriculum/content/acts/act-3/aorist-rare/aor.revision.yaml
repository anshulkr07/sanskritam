- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: verb.lun
    rule:
      en: '{{लुङ्}}, {{च्लि लुङि}}, {{च्लेः सिच्}} and {{सिचि वृद्धिः परस्मैपदेषु}}: the tense, {{च्लि}}, {{सिच्}} and the
        lengthening.'
      hi: '{{लुङ्}}, {{च्लि लुङि}}, {{च्लेः सिच्}} और {{सिचि वृद्धिः परस्मैपदेषु}}: काल, {{च्लि}}, {{सिच्}} और वृद्धि।'
    sutras:
    - 3.2.110
    - 3.1.43
    - 3.1.44
    - 7.2.1
    tag: core
    taught_in: aor.abhut#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 3.2.110, {{लुङ्}}, gives the aorist for what is past. 3.1.43, {{च्लि लुङि}}, puts {{च्लि}} before it, and
          3.1.44, {{च्लेः सिच्}}, turns it into {{सिच्}}. 7.2.1, {{सिचि वृद्धिः परस्मैपदेषु}}, lengthens the root vowel, so
          {{कृ}} becomes {{कार्}}: {{अकार्षीत्}}.'
        hi: 'सूत्र 3.2.110, {{लुङ्}}, भूतकाल में आशुभूत देता है। 3.1.43, {{च्लि लुङि}}, उसके आगे {{च्लि}} रखता है और 3.1.44,
          {{च्लेः सिच्}}, उसे {{सिच्}} बना देता है। 7.2.1, {{सिचि वृद्धिः परस्मैपदेषु}}, धातु का स्वर दीर्घ-वृद्धि करता है,
          इसलिए {{कृ}} से {{कार्}}: {{अकार्षीत्}}।'
      items:
      - id: i0
        sa: लुङ्
      - id: i1
        sa: च्लि लुङि
      - id: i2
        sa: च्लि
      - id: i3
        sa: च्लेः सिच्
      - id: i4
        sa: सिच्
      - id: i5
        sa: सिचि वृद्धिः परस्मैपदेषु
      - id: i6
        sa: कृ
      - id: i7
        sa: कार्
      - id: i8
        sa: अकार्षीत्
  - skill: verb.ma
    rule:
      en: '{{माङि लुङ्}} and {{न माङ्योगे}}: {{लुङ्}} after {{मा}}, with no augment.'
      hi: '{{माङि लुङ्}} और {{न माङ्योगे}}: {{मा}} के बाद {{लुङ्}}, आगम के बिना।'
    sutras:
    - 3.3.175
    - 6.4.74
    tag: core
    taught_in: aor.ma#pn
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 3.3.175, {{माङि लुङ्}}, says that after {{मा}} the {{लुङ्}} is used. And 6.4.74, {{न माङ्योगे}}, says the
          augment {{अ}} does not appear when {{मा}} is attached. So {{अगमः}} becomes {{मा गमः}}.
        hi: सूत्र 3.3.175, {{माङि लुङ्}}, कहता है कि {{मा}} के साथ {{लुङ्}} आता है। और 6.4.74, {{न माङ्योगे}}, कहता है कि
          {{मा}} जुड़ा हो तो आगम {{अ}} नहीं आता। इसलिए {{अगमः}} से {{मा गमः}} बनता है।
      items:
      - id: i0
        sa: माङि लुङ्
      - id: i1
        sa: मा
      - id: i2
        sa: लुङ्
      - id: i3
        sa: न माङ्योगे
      - id: i4
        sa: अ
      - id: i5
        sa: अगमः
      - id: i6
        sa: मा गमः

        sa: मा गमः।
        label:
          en: Read the whole example
          hi: पूरा उदाहरण पढ़ें
        meaning:
          en: Do not go.
          hi: मत जाओ।
        words:
        - sa: मा
          gloss:
            en: do not
            hi: मत
        - sa: गमः
          gloss:
            en: go
            hi: जाओ
      - id: i1
        sa: मा
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: do not
          hi: मत
      - id: i2
        sa: गमः
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: go
          hi: जाओ
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: 'To say “do not …” use {{मा}} with the aorist, and drop the augment {{अ}}: {{अगमः}} (you went) becomes {{मा
            गमः}} (do not go); {{अभूत्}} becomes {{मा भूत्}} (let it not be); {{अभैषीः}} becomes {{मा भैषीः}} (do not fear).
            {{मा शुचः}}, “do not grieve”, is the same kind of form.'
          hi: '‘मत …’ कहने के लिए {{मा}} के साथ लुङ् लीजिए और आगम {{अ}} हटा दीजिए: {{अगमः}} (तुम गए) से {{मा गमः}} (मत जाओ);
            {{अभूत्}} से {{मा भूत्}} (न हो); {{अभैषीः}} से {{मा भैषीः}} (मत डरो)। {{मा शुचः}}, ‘शोक मत करो’, इसी प्रकार का
            रूप है।'
      - id: i5
        sa: मा गमः।
        label:
          en: Read it again with the meaning
          hi: अर्थ समझकर फिर पढ़ें
        meaning:
          en: Do not go.
          hi: मत जाओ।
        words:
        - sa: मा
          gloss:
            en: do not
            hi: मत
        - sa: गमः
          gloss:
            en: go
            hi: जाओ

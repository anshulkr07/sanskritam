- id: conditions
  kind: revision
  title:
    en: When to use which
    hi: कब कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: verb.lun
    rule:
      en: '{{लुङ्}} for what has just come to be; in plain Sanskrit prose, {{लङ्}} is more common.'
      hi: जो अभी हुआ, उसके लिए {{लुङ्}}; सामान्य संस्कृत गद्य में {{लङ्}} अधिक चलता है।
    tag: good
    taught_in: aor.abhut#t1
    visuals:
    - id: v-linked-0
      kind: worked
      title:
        en: Read, examine, understand
        hi: पढ़ें, समझें, फिर पढ़ें
      items:
      - id: i0
        sa: प्रकाशः अभूत्।
        label:
          en: Read the whole example
          hi: पूरा उदाहरण पढ़ें
        meaning:
          en: The light has come to be.
          hi: प्रकाश हो गया।
        words:
        - sa: प्रकाशः
          gloss:
            en: light
            hi: प्रकाश
        - sa: अभूत्
          gloss:
            en: has come to be
            hi: हो गया
          check:
            type: tinanta
            dhatu: भू
            lakara: Lun
            purusha: Prathama
            vacana: Eka
      - id: i1
        sa: प्रकाशः
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: light
          hi: प्रकाश
      - id: i2
        sa: अभूत्
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: has come to be
          hi: हो गया
        check:
          type: tinanta
          dhatu: भू
          lakara: Lun
          purusha: Prathama
          vacana: Eka
        feature:
          en: 'Root: {{भू}} · singular · {{लुङ्}} · Third person ({{प्रथमपुरुष}})'
          hi: 'धातु: {{भू}} · {{एकवचन}} · {{लुङ्}} · प्रथमपुरुष'
        compare_from: भू
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: '{{लुङ्}} is the aorist, a past that says something has come to be, a done event. It wears the augment {{अ}},
            like {{लङ्}}, but the middle is different: {{अभूत्}} (it became), {{अकार्षीत्}} (he did), {{अगमत्}} (he went).
            The forms vary by root, so learn them as they come.'
          hi: '{{लुङ्}} (आशुभूत) भूतकाल है जो बताता है कि कुछ हो चुका है, पूरी हुई घटना। वह {{लङ्}} की तरह आगम {{अ}} पहनता
            है, पर बीच का भाग अलग है: {{अभूत्}} (हुआ), {{अकार्षीत्}} (उसने किया), {{अगमत्}} (वह गया)। रूप धातु के अनुसार बदलते
            हैं, इसलिए जैसे-जैसे आएँ सीखिए।'
      - id: i5
        sa: प्रकाशः अभूत्।
        label:
          en: Read it again with the meaning
          hi: अर्थ समझकर फिर पढ़ें
        meaning:
          en: The light has come to be.
          hi: प्रकाश हो गया।
        words:
        - sa: प्रकाशः
          gloss:
            en: light
            hi: प्रकाश
        - sa: अभूत्
          gloss:
            en: has come to be
            hi: हो गया
          check:
            type: tinanta
            dhatu: भू
            lakara: Lun
            purusha: Prathama
            vacana: Eka
  - skill: verb.ma
    rule:
      en: To forbid, use {{मा}} with the bare aorist, not {{न}} with a command.
      hi: मना करने के लिए {{मा}} के साथ बिना आगम का लुङ् लीजिए, आज्ञा के साथ {{न}} नहीं।
    tag: good
    taught_in: aor.ma#t1
    visuals:
    - id: v-linked-1
      kind: worked
      title:

sources:
- title: Lesson text and story
  licence: original
cards:
- id: core
  kind: revision
  title:
    en: The forms
    hi: रूप
  depth: core
  section: core
  rows:
  - skill: verb.lun
    rule:
      en: '{{भू}} in {{लुङ्}}: {{अभूत् अभूताम् अभूवन्}}, {{अभूः अभूतम् अभूत}}, {{अभूवम् अभूव अभूम}}; {{कृ}}: {{अकार्षीत्}}.'
      hi: '{{भू}} का {{लुङ्}}: {{अभूत् अभूताम् अभूवन्}}, {{अभूः अभूतम् अभूत}}, {{अभूवम् अभूव अभूम}}; {{कृ}}: {{अकार्षीत्}}।'
    sutras:
    - 3.2.110
    - 3.1.43
    - 3.1.44
    - 7.2.1
    tag: core
    taught_in: aor.abhut#tb1
  - skill: verb.ma
    rule:
      en: '{{मा}} + the aorist without {{अ}}: {{मा गमः}}, {{मा भूत्}}, {{मा भैषीः}}.'
      hi: '{{मा}} + {{अ}} के बिना लुङ्: {{मा गमः}}, {{मा भूत्}}, {{मा भैषीः}}।'
    sutras:
    - 3.3.175
    - 6.4.74
    tag: core
    taught_in: aor.ma#tb1
  - skill: verb.rare-four
    rule:
      en: '{{लुट्}} {{भविता}}; {{आशीर्लिङ्}} {{भूयात्}}; {{लृङ्}} {{अभविष्यत्}}.'
      hi: '{{लुट्}} {{भविता}}; {{आशीर्लिङ्}} {{भूयात्}}; {{लृङ्}} {{अभविष्यत्}}।'
    sutras:
    - 3.3.15
    - 3.3.173
    - 3.3.139
    tag: core
    taught_in: aor.four#tb1
- id: conditions
  kind: revision
  title:
    en: When to use which
    hi: कब कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: verb.lun
    rule:
      en: '{{लुङ्}} for what has just come to be; in plain Sanskrit prose, {{लङ्}} is more common.'
      hi: जो अभी हुआ, उसके लिए {{लुङ्}}; सामान्य संस्कृत गद्य में {{लङ्}} अधिक चलता है।
    tag: good
    taught_in: aor.abhut#t1
  - skill: verb.ma
    rule:
      en: To forbid, use {{मा}} with the bare aorist, not {{न}} with a command.
      hi: मना करने के लिए {{मा}} के साथ बिना आगम का लुङ् लीजिए, आज्ञा के साथ {{न}} नहीं।
    tag: good
    taught_in: aor.ma#t1
  - skill: verb.rare-four
    rule:
      en: For “had … would have …”, both halves take {{लृङ्}}.
      hi: ‘यदि … तो …’ (जो हुआ नहीं) में दोनों भाग {{लृङ्}} लेते हैं।
    tag: good
    taught_in: aor.four#t2
- id: exceptions
  kind: revision
  title:
    en: Odd cases
    hi: विचित्र स्थितियाँ
  depth: core
  section: exceptions
  rows:
  - skill: verb.lun
    rule:
      en: 'Roots of different kinds make their aorist in different ways: {{अगमत्}} (no {{ष}}), {{अकार्षीत्}} (with {{ष}}),
        {{अदात्}} (from {{दा}}).'
      hi: 'अलग प्रकार की धातुएँ अलग ढंग से लुङ् बनाती हैं: {{अगमत्}} ({{ष}} नहीं), {{अकार्षीत्}} ({{ष}} सहित), {{अदात्}} ({{दा}}
        से)।'
    example:
      sa: अदात्
      meaning:
        en: he gave
        hi: उसने दिया
      check:
        type: tinanta
        dhatu: दा
        lakara: Lun
        purusha: Prathama
        vacana: Eka
    tag: rare
    new_here: true
    visuals:
    - id: v-source-new-0

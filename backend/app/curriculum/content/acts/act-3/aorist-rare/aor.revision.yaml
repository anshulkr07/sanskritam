- id: mistakes
  kind: revision
  title:
    en: Common mistakes
    hi: आम भूलें
  depth: core
  section: mistakes
  rows:
  - skill: verb.ma
    rule:
      en: 'Do not say {{मा अगमः}}: after {{मा}} the {{अ}} drops.'
      hi: '{{मा अगमः}} मत कहिए: {{मा}} के बाद {{अ}} हट जाता है।'
    tag: core
    taught_in: aor.ma#p1
  - skill: verb.rare-four
    rule:
      en: 'Do not use {{भूयात्}} for “should”: it is a blessing; “should” is {{भवेत्}}.'
      hi: '{{भूयात्}} को ‘चाहिए’ के लिए मत लीजिए: वह आशीर्वाद है; ‘चाहिए’ {{भवेत्}} है।'
    tag: core
    taught_in: aor.four#p1
- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: verb.lun
    rule:
      en: '{{लुङ्}}, {{च्लि लुङि}}, {{च्लेः सिच्}} and {{सिचि वृद्धिः परस्मैपदेषु}}: the tense, {{च्लि}}, {{सिच्}} and the
        lengthening.'
      hi: '{{लुङ्}}, {{च्लि लुङि}}, {{च्लेः सिच्}} और {{सिचि वृद्धिः परस्मैपदेषु}}: काल, {{च्लि}}, {{सिच्}} और वृद्धि।'
    sutras:
    - 3.2.110
    - 3.1.43
    - 3.1.44
    - 7.2.1
    tag: core
    taught_in: aor.abhut#pn
  - skill: verb.ma
    rule:
      en: '{{माङि लुङ्}} and {{न माङ्योगे}}: {{लुङ्}} after {{मा}}, with no augment.'
      hi: '{{माङि लुङ्}} और {{न माङ्योगे}}: {{मा}} के बाद {{लुङ्}}, आगम के बिना।'
    sutras:
    - 3.3.175
    - 6.4.74
    tag: core
    taught_in: aor.ma#pn

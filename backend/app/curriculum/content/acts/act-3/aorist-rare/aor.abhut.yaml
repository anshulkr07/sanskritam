cards:
- id: s1
  kind: story
  title:
    en: The sixth night
    hi: छठी रात
  depth: core
  image:
    brief: 'Deep in the grove at night: a single tiny golden spark flickering on and off in the dark with a thin trail of smoke; the Vetāla seated on a root watching it with a gentle expression; you, Dādī and Śuka kneeling to look; ancient gnarled trunks around.'
    alt:
      en: A tiny flickering spark in the dark of an old grove, watched gently by a grey spirit
      hi: पुराने वन के अँधेरे में एक नन्हा टिमटिमाता स्फुलिंग, कोमलता से देखता भूत
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - abhutaka
    place: smashana
    ratio: '4:3'
    id: aor-abhut-s1
  narration:
    en: 'Deeper in the grove the spirits are older. A single spark flickers on and off in the dark, trailing a thread of smoke, as though it could not decide whether it had ever lit. “अभूत्,” says the Vetāla gently. “It has become.” The spark flares, steady for one breath. “Yes,” Dādī says. “That is the aorist: the past of what has just come to be.”'
    hi: 'वन में और भीतर भूत अधिक पुराने हैं। अँधेरे में एक अकेला स्फुलिंग जलता-बुझता है, धुएँ का धागा पीछे छोड़ता, मानो तय न कर पा रहा हो कि कभी जला भी था। “अभूत्,” वेताल कोमलता से कहता है। “हो गया।” स्फुलिंग एक साँस भर स्थिर चमक उठता है। “हाँ,” दादी कहती हैं। “यही लुङ् है: उसका भूतकाल जो अभी-अभी हुआ।”'
  lines:
  - speaker: dadi
    sa: अभूत्। अकार्षीत्।
    gloss:
      en: It has become. He has done it.
      hi: हो गया। उसने कर दिया।
- id: t1
  kind: teach
  title:
    en: What has just happened
    hi: जो अभी हुआ
  depth: core
  skills:
  - verb.lun
  body:
    en: '{{लुङ्}} is the aorist, a past that says something has come to be, a done event. It wears the augment {{अ}}, like {{लङ्}}, but the middle is different: {{अभूत्}} (it became), {{अकार्षीत्}} (he did), {{अगमत्}} (he went). The forms vary by root, so learn them as they come.'
    hi: '{{लुङ्}} (आशुभूत) भूतकाल है जो बताता है कि कुछ हो चुका है, पूरी हुई घटना। वह {{लङ्}} की तरह आगम {{अ}} पहनता है, पर बीच का भाग अलग है: {{अभूत्}} (हुआ), {{अकार्षीत्}} (उसने किया), {{अगमत्}} (वह गया)। रूप धातु के अनुसार बदलते हैं, इसलिए जैसे-जैसे आएँ सीखिए।'
  examples:
  - sa: प्रकाशः अभूत्।
    meaning:
      en: The light has come to be.
      hi: प्रकाश हो गया।
    words:
    - sa: प्रकाशः
      gloss:
        en: light
        hi: प्रकाश
    - sa: अभूत्
      gloss:
        en: has come to be
        hi: हो गया
      check:
        type: tinanta
        dhatu: भू
        lakara: Lun
        purusha: Prathama
        vacana: Eka
  - sa: सः कर्म अकार्षीत्।
    meaning:
      en: He did the deed.
      hi: उसने कर्म किया।
    words:
    - sa: सः
      gloss:
        en: he
        hi: वह
    - sa: कर्म
      gloss:
        en: deed
        hi: कर्म
      check:
        type: subanta
        stem: कर्मन्
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Eka
    - sa: अकार्षीत्
      gloss:
        en: did
        hi: किया
      check:
        type: tinanta
        dhatu: कृ
        lakara: Lun
        purusha: Prathama
        vacana: Eka
  - sa: ते अगमन्।
    meaning:
      en: They went.
      hi: वे गए।
    words:
    - sa: ते
      gloss:
        en: they
        hi: वे
    - sa: अगमन्
      gloss:
        en: went
        hi: गए
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lun
        purusha: Prathama
        vacana: Bahu
  term:
    sa: लुङ्
    meaning:
      en: the aorist, a past of what has come to be
      hi: आशुभूत, जो हो चुका उसका भूतकाल

    hi: '{{अभूवन्}}: वे, अनेक।'
  roman: after
  gate: true
  story:
    success:
      en: “अभूवन्,” you say. The spark holds. Then, one by one, more sparks come up out of the dark around it, a dozen, a hundred, and settle in a slow ring, each steady. “They did become,” the little spark says, almost laughing. “I thought I was alone.”
      hi: “अभूवन्,” आप कहते हैं। स्फुलिंग टिका रहता है। फिर, एक-एक करके, उसके चारों ओर अँधेरे से और स्फुलिंग उठते हैं, दर्जन, सैकड़ा, और धीमे घेरे में जम जाते हैं, हर एक स्थिर। “सचमुच हुए,” नन्हा स्फुलिंग लगभग हँसते हुए कहता है। “मैंने सोचा था मैं अकेला हूँ।”
    failure:
      en: 'The spark flickers on. “They became”: {{अभूवन्}}.'
      hi: 'स्फुलिंग जलता-बुझता रहता है। ‘वे हुए’: {{अभूवन्}}।'
  options:
  - sa: अभूत्
  - sa: अभूताम्
  - correct: true
    sa: अभूवन्
- id: pn
  kind: teach
  title:
    en: Pāṇini's aorist
    hi: पाणिनि का लुङ्
  depth: panini
  skills:
  - verb.lun
  sutras:
  - 3.2.110
  - 3.1.43
  - 3.1.44
  - 7.2.1
  body:
    en: 'Sūtra 3.2.110, {{लुङ्}}, gives the aorist for what is past. 3.1.43, {{च्लि लुङि}}, puts {{च्लि}} before it, and 3.1.44, {{च्लेः सिच्}}, turns it into {{सिच्}}. 7.2.1, {{सिचि वृद्धिः परस्मैपदेषु}}, lengthens the root vowel, so {{कृ}} becomes {{कार्}}: {{अकार्षीत्}}.'
    hi: 'सूत्र 3.2.110, {{लुङ्}}, भूतकाल में आशुभूत देता है। 3.1.43, {{च्लि लुङि}}, उसके आगे {{च्लि}} रखता है और 3.1.44, {{च्लेः सिच्}}, उसे {{सिच्}} बना देता है। 7.2.1, {{सिचि वृद्धिः परस्मैपदेषु}}, धातु का स्वर दीर्घ-वृद्धि करता है, इसलिए {{कृ}} से {{कार्}}: {{अकार्षीत्}}।'
- id: sum
  kind: summary
  title:
    en: The aorist
    hi: लुङ्
  depth: core
  points:
  - sa: अभूत् · अकार्षीत्
    text:
      en: It has become; he did.
      hi: हो गया; उसने किया।
  - sa: अ + धातु + ...
    text:
      en: The augment {{अ}} comes in front.
      hi: आगम {{अ}} आगे आता है।
  - sa: अभूवन्
    text:
      en: They became.
      hi: वे हुए।

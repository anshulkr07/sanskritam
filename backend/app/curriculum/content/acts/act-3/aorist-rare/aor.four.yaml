- id: t2
  kind: teach
  title:
    en: How each is used
    hi: हर एक कैसे चलता है
  depth: core
  skills:
  - verb.rare-four
  body:
    en: '{{श्वः भविता}}: tomorrow, or later, he will be. {{चिरं जीव्यात्}}: may he live long. {{यदि पठेत् …}} uses {{लिङ्}}, while {{यदि सः अपठिष्यत् तर्हि सः अज्ञास्यत्}} says “had he read, he would have known”: both halves take {{लृङ्}}.'
    hi: '{{श्वः भविता}}: कल या बाद में वह होगा। {{चिरं जीव्यात्}}: वह चिरंजीवी हो। {{यदि पठेत् …}} में {{लिङ्}} है, जबकि {{यदि सः अपठिष्यत् तर्हि सः अज्ञास्यत्}} कहता है ‘पढ़ता तो जान जाता’: दोनों भाग {{लृङ्}} लेते हैं।'
  examples:
  - sa: श्वः सः गन्ता।
    meaning:
      en: Tomorrow or later he will go.
      hi: कल या बाद में वह जाएगा।
    words:
    - sa: श्वः
      gloss:
        en: tomorrow
        hi: कल
    - sa: सः
      gloss:
        en: he
        hi: वह
    - sa: गन्ता
      gloss:
        en: will go (far future)
        hi: जाएगा (दूर का भविष्य)
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lut
        purusha: Prathama
        vacana: Eka
  - sa: चिरम् जीव्यात्।
    meaning:
      en: May he live long.
      hi: वह चिरकाल जिए।
    words:
    - sa: चिरम्
      gloss:
        en: long
        hi: चिरकाल
    - sa: जीव्यात्
      gloss:
        en: may he live
        hi: जिए
      check:
        type: tinanta
        dhatu: जीव्
        lakara: AshirLin
        purusha: Prathama
        vacana: Eka
  - sa: यदि सः अपठिष्यत् तर्हि सः अज्ञास्यत्।
    meaning:
      en: If he had read, he would have known.
      hi: अगर वह पढ़ता, तो जान जाता।
    words:
    - sa: यदि
      gloss:
        en: if
        hi: यदि
    - sa: सः
      gloss:
        en: he
        hi: वह
    - sa: अपठिष्यत्
      gloss:
        en: had read
        hi: पढ़ता
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lrn
        purusha: Prathama
        vacana: Eka
    - sa: तर्हि
      gloss:
        en: then
        hi: तो
    - sa: सः
      gloss:
        en: he
        hi: वह
    - sa: अज्ञास्यत्
      gloss:
        en: would have known
        hi: जान जाता
      check:
        type: tinanta
        dhatu: ज्ञा
        lakara: Lrn
        purusha: Prathama
        vacana: Eka

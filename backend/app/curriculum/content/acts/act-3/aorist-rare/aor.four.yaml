    - sa: सः
      gloss:
        en: he
        hi: वह
    - sa: गन्ता
      gloss:
        en: will go (far future)
        hi: जाएगा (दूर का भविष्य)
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lut
        purusha: Prathama
        vacana: Eka

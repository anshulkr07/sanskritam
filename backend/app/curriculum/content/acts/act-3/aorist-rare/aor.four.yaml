- id: p4
  kind: practice
  title:
    en: What would have been
    hi: जो होता
  depth: core
  skills:
  - verb.rare-four
  mode: choice
  prompt:
    en: “He would have become.” Which form?
    hi: ‘वह हो जाता।’ कौन-सा रूप?
  explain:
    en: '{{अभविष्यत्}}: the {{लृङ्}}.'
    hi: '{{अभविष्यत्}}: {{लृङ्}}।'
  roman: after
  gate: true
  story:
    success:
      en: “अभविष्यत्,” you say. The four old spirits stir. The oldest, the faintest, lifts a hand like a leaf and lets it fall, and the whole grove sighs, once, as if a long story had at last been understood. “भूयात्,” whispers the Vetāla. “May you be.” “May you all be,” you say.
      hi: “अभविष्यत्,” आप कहते हैं। चारों पुराने भूत हिलते हैं। सबसे पुराना, सबसे धुँधला, पत्ते जैसा हाथ उठाकर गिरा देता है, और पूरा वन एक बार साँस लेता है, मानो कोई लम्बी कथा अन्ततः समझ ली गई हो। “भूयात्,” वेताल फुसफुसाता है। “तुम हो।” “आप सब हों,” आप कहते हैं।
    failure:
      en: 'The old spirits keep still. “He would have become”: {{अभविष्यत्}}.'
      hi: 'पुराने भूत स्थिर रहते हैं। ‘वह हो जाता’: {{अभविष्यत्}}।'
  options:
  - sa: भविष्यति
  - sa: भूयात्
  - correct: true
    sa: अभविष्यत्
- id: pn
  kind: teach
  depth: panini
  title: {en: "The rules behind the rare forms", hi: "दुर्लभ रूपों के पीछे के सूत्र"}
  skills: [verb.rare-four]
  sutras: [3.3.15, 3.3.173, 3.3.139]
  body:
    en: "{{लुट्}} places an action beyond today. {{आशीर्लिङ्}} expresses a blessing. {{लृङ्}} describes an action that did not come about when its condition failed. These rules explain the three forms in the table; {{लेट्}} belongs to Vedic usage."
    hi: "{{लुट्}} आज से आगे की क्रिया बताता है। {{आशीर्लिङ्}} आशीर्वाद व्यक्त करता है। {{लृङ्}} उस क्रिया को बताता है जो शर्त पूरी न होने से नहीं हुई। ये सूत्र तालिका के तीन रूपों को समझाते हैं; {{लेट्}} वैदिक प्रयोग है।"
- id: sum
  kind: summary
  title:
    en: The rare four
    hi: चार दुर्लभ रूप
  depth: core
  points:
  - sa: भविता · कर्ता
    text:
      en: He will (not today).
      hi: वह करेगा (आज नहीं)।
  - sa: भूयात् · जीव्यात्
    text:
      en: May he be; may he live.
      hi: वह हो; वह जिए।
  - sa: अभविष्यत्
    text:
      en: He would have become.
      hi: वह हो जाता।

- id: s1
  kind: story
  title:
    en: The oldest speak
    hi: सबसे पुराने बोलते हैं
  depth: core
  image:
    brief: 'The very edge of the old grove at night: four ancient grey spirits seated in a half-circle, faint and wise, like
      carved figures worn smooth by time; the Vetāla introducing them with an open hand; you, Dādī and Śuka standing respectfully
      in front.'
    alt:
      en: Four ancient grey spirits sit in a half-circle while the Vetāla introduces them
      hi: अर्धवृत्त में बैठे चार प्राचीन भूरे भूत, परिचय कराता वेताल
    cast:
    - vetala
    - you
    - dadi
    - shuka
    place: smashana
    ratio: '4:3'
    id: aor-four-s1
  narration:
    en: At the very edge of the grove, the oldest spirits gather, whose speech has not been used in a thousand years. They
      speak in four rare forms, one for the far future, one for blessings, one for what would have happened, and one the Vedas
      keep. “You will not need them to speak,” says the Vetāla. “But a reader must know them when they pass.”
    hi: 'वन के ठीक छोर पर सबसे पुराने भूत जुटते हैं, जिनकी भाषा हज़ार वर्ष से प्रयोग में नहीं आई। वे चार दुर्लभ रूपों में
      बोलते हैं: एक दूर के भविष्य के लिए, एक आशीर्वाद के लिए, एक उसके लिए जो होता, और एक जिसे वेद सँभालते हैं। “बोलने के लिए
      तुम्हें इनकी ज़रूरत नहीं होगी,” वेताल कहता है। “पर पढ़ने वाले को पहचानना आना चाहिए जब वे गुज़रें।”'
- id: t1
  kind: teach
  title:
    en: Four rare forms
    hi: चार दुर्लभ रूप
  depth: core
  skills:
  - verb.rare-four
  body:
    en: '{{लुट्}} is the far future, “not today”: {{भविता}}, {{कर्ता}}. {{आशीर्लिङ्}} is the blessing: {{भूयात्}}, “may he
      be”. {{लृङ्}} is “would have happened”: {{अभविष्यत्}}. And {{लेट्}} is found only in the Veda; you can skip it.'
    hi: '{{लुट्}} दूर का भविष्य है, ‘आज नहीं’: {{भविता}}, {{कर्ता}}। {{आशीर्लिङ्}} आशीर्वाद है: {{भूयात्}}, ‘वह हो’। {{लृङ्}}
      का अर्थ ‘होता’ है: {{अभविष्यत्}}। और {{लेट्}} केवल वेद में मिलता है; उसे छोड़ सकते हैं।'
  term:
    sa: आशीर्लिङ्
    meaning:
      en: the blessing form
      hi: आशीर्वाद का रूप
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation
      hi: व्याख्या के रूप पढ़ें
    explanation:
      en: '{{लुट्}} is the far future, “not today”: {{भविता}}, {{कर्ता}}. {{आशीर्लिङ्}} is the blessing: {{भूयात्}}, “may
        he be”. {{लृङ्}} is “would have happened”: {{अभविष्यत्}}. And {{लेट्}} is found only in the Veda; you can skip it.'
      hi: '{{लुट्}} दूर का भविष्य है, ‘आज नहीं’: {{भविता}}, {{कर्ता}}। {{आशीर्लिङ्}} आशीर्वाद है: {{भूयात्}}, ‘वह हो’। {{लृङ्}}
        का अर्थ ‘होता’ है: {{अभविष्यत्}}। और {{लेट्}} केवल वेद में मिलता है; उसे छोड़ सकते हैं।'

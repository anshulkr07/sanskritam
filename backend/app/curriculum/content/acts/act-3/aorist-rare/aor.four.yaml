- id: t2
  kind: teach
  title:
    en: How each is used
    hi: हर एक कैसे चलता है
  depth: core
  skills:
  - verb.rare-four
  body:
    en: '{{श्वः भविता}}: tomorrow, or later, he will be. {{चिरं जीव्यात्}}: may he live long. {{यदि पठेत् …}} uses {{लिङ्}},
      while {{यदि सः अपठिष्यत् तर्हि सः अज्ञास्यत्}} says “had he read, he would have known”: both halves take {{लृङ्}}.'
    hi: '{{श्वः भविता}}: कल या बाद में वह होगा। {{चिरं जीव्यात्}}: वह चिरंजीवी हो। {{यदि पठेत् …}} में {{लिङ्}} है, जबकि {{यदि
      सः अपठिष्यत् तर्हि सः अज्ञास्यत्}} कहता है ‘पढ़ता तो जान जाता’: दोनों भाग {{लृङ्}} लेते हैं।'
  examples:

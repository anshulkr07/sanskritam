- id: p7
  kind: practice
  depth: core
  skills:
  - verb.ma
  - verb.lun
  mode: order
  prompt:
    en: 'Comfort the flame: “Do not fear; it has become.”'
    hi: 'लौ को ढाढ़स बँधाइए: ‘मत डरो; हो गया।’'
  explain:
    en: '{{मा भैषीः, अभूत्}}.'
    hi: '{{मा भैषीः, अभूत्}}।'
  roman: after
  gate: true
  story:
    success:
      en: '“मा भैषीः, अभूत्,” you say, and the little flame, Abhūtaka, leans against your hand without burning it. “It did become,” he says, “and so did I.” He lifts, bright and steady, into the dark above the trees. As he goes he leaves a line of light behind him, spelling four words: “भवति, नृत्यति, तुदति, चोरयति.” The Vetāla watches him out of sight. “Verbs,” he says. “You will need many more of those.”'
      hi: '“मा भैषीः, अभूत्,” आप कहते हैं, और नन्हीं लौ, अभूतक, आपके हाथ से बिना जलाए टिक जाता है। “सचमुच हुआ,” वह कहता है, “और मैं भी।” वह उजला और स्थिर, पेड़ों के ऊपर अँधेरे में उठ जाता है। जाते हुए वह पीछे प्रकाश की एक रेखा छोड़ता है, जो चार शब्द लिखती है: “भवति, नृत्यति, तुदति, चोरयति।” वेताल उसे आँखों से ओझल होने तक देखता है। “क्रियाएँ,” वह कहता है। “अभी तुम्हें इनमें से बहुत-सी चाहिए होंगी।”'
    failure:
      en: 'The flame wavers. His words: {{मा भैषीः, अभूत्}}.'
      hi: 'लौ डगमगाती है। उसके शब्द: {{मा भैषीः, अभूत्}}।'
  tokens:
  - मा
  - भैषीः
  - अभूत्

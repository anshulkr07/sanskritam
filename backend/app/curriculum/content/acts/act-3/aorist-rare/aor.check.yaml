- id: p7
  kind: practice
  depth: core
  skills:
  - verb.ma
  - verb.lun
  mode: order
  prompt:
    en: 'Comfort the flame: “Do not fear; it has become.”'
    hi: 'लौ को ढाढ़स बँधाइए: ‘मत डरो; हो गया।’'
  explain:
    en: '{{मा भैषीः, अभूत्}}.'
    hi: '{{मा भैषीः, अभूत्}}।'
  roman: after
  gate: true
  story:
    success:
      en: '“मा भैषीः, अभूत्,” you say, and the little flame, Abhūtaka, leans against your hand without burning it. “It did
        become,” he says, “and so did I.” He lifts, bright and steady, into the dark above the trees. As he goes he leaves
        a line of light behind him, spelling four words: “भवति, नृत्यति, तुदति, चोरयति.” The Vetāla watches him out of sight.
        “Verbs,” he says. “You will need many more of those.”'
      hi: '“मा भैषीः, अभूत्,” आप कहते हैं, और नन्हीं लौ, अभूतक, आपके हाथ से बिना जलाए टिक जाता है। “सचमुच हुआ,” वह कहता है,
        “और मैं भी।” वह उजला और स्थिर, पेड़ों के ऊपर अँधेरे में उठ जाता है। जाते हुए वह पीछे प्रकाश की एक रेखा छोड़ता है,
        जो चार शब्द लिखती है: “भवति, नृत्यति, तुदति, चोरयति।” वेताल उसे आँखों से ओझल होने तक देखता है। “क्रियाएँ,” वह कहता
        है। “अभी तुम्हें इनमें से बहुत-सी चाहिए होंगी।”'
    failure:
      en: 'The flame wavers. His words: {{मा भैषीः, अभूत्}}.'
      hi: 'लौ डगमगाती है। उसके शब्द: {{मा भैषीः, अभूत्}}।'
  tokens:
  - मा
  - भैषीः
  - अभूत्
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: मा गमः।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: Do not go.
        hi: मत जाओ।
      words:
      - sa: मा
        gloss:
          en: do not
          hi: मत
      - sa: गमः
        gloss:
          en: go
          hi: जाओ
    - id: i1
      sa: मा
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: do not
        hi: मत
    - id: i2
      sa: गमः
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: go
        hi: जाओ
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'To say “do not …” use {{मा}} with the aorist, and drop the augment {{अ}}: {{अगमः}} (you went) becomes {{मा गमः}}
          (do not go); {{अभूत्}} becomes {{मा भूत्}} (let it not be); {{अभैषीः}} becomes {{मा भैषीः}} (do not fear). {{मा
          शुचः}}, “do not grieve”, is the same kind of form.'
        hi: '‘मत …’ कहने के लिए {{मा}} के साथ लुङ् लीजिए और आगम {{अ}} हटा दीजिए: {{अगमः}} (तुम गए) से {{मा गमः}} (मत जाओ);
          {{अभूत्}} से {{मा भूत्}} (न हो); {{अभैषीः}} से {{मा भैषीः}} (मत डरो)। {{मा शुचः}}, ‘शोक मत करो’, इसी प्रकार का रूप
          है।'
    - id: i5
      sa: मा गमः।
      label:
        en: Read it again with the meaning
        hi: अर्थ समझकर फिर पढ़ें
      meaning:
        en: Do not go.
        hi: मत जाओ।
      words:

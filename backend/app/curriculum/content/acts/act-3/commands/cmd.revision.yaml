  - skill: verb.lot-polite
    rule:
      en: To an honoured guest, ask in the third person instead of ordering in the second.
      hi: आदरणीय अतिथि को मध्यम पुरुष में आज्ञा देने के बजाय प्रथम पुरुष में अनुरोध कीजिए।
    tag: good
    taught_in: cmd.wish#t1
    visuals:
    - id: v-linked-2
      kind: worked
      title:
        en: Read, examine, understand
        hi: पढ़ें, समझें, फिर पढ़ें
      items:
      - id: i0
        sa: भवान् आगच्छतु।
        label:
          en: Read the whole example
          hi: पूरा उदाहरण पढ़ें
        meaning:
          en: Please come.
          hi: कृपया आइए।
        words:
        - sa: भवान्
          gloss:
            en: you (polite)
            hi: आप
        - sa: आगच्छतु
          gloss:
            en: please come
            hi: पधारिए
          check:
            type: tinanta
            dhatu: गम्
            lakara: Lot
            purusha: Prathama
            vacana: Eka
            prefixes:
            - आ
      - id: i1
        sa: भवान्
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: you (polite)
          hi: आप
      - id: i2
        sa: आगच्छतु
        label:
          en: Follow this word
          hi: इस शब्द पर ध्यान दें
        meaning:
          en: please come
          hi: पधारिए
        check:
          type: tinanta
          dhatu: गम्
          lakara: Lot
          purusha: Prathama
          vacana: Eka
          prefixes:
          - आ
        feature:
          en: 'Root: {{गम्}} · singular · {{लोट्}} · Third person ({{प्रथमपुरुष}})'
          hi: 'धातु: {{गम्}} · {{एकवचन}} · {{लोट्}} · प्रथमपुरुष'
        compare_from: गम्
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: 'The third-person {{लोट्}} is also the polite request and the blessing: {{भवतु}} (let it be), {{जयतु}} (victory
            to him), {{जीवतु}} (long life), {{अस्तु}} (so be it). To be polite to “you”, say {{भवान्}} (your honour, a word
            for “you”) and put the verb in the third person: {{भवान् आगच्छतु}}, “please come”.'
          hi: 'प्रथम पुरुष का {{लोट्}} विनम्र प्रार्थना और आशीर्वाद भी है: {{भवतु}} (हो), {{जयतु}} (उसकी जय हो), {{जीवतु}}
            (दीर्घायु हो), {{अस्तु}} (ऐसा ही हो)। ‘आप’ के लिए विनम्र होने को {{भवान्}} (आप, ‘तुम’ का आदरसूचक शब्द) कहिए और
            क्रिया प्रथम पुरुष में रखिए: {{भवान् आगच्छतु}}, ‘कृपया आइए’।'

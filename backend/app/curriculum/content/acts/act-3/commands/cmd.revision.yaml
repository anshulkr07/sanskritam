- id: mistakes
  kind: revision
  title:
    en: Common mistakes
    hi: आम भूलें
  depth: core
  section: mistakes
  rows:
  - skill: verb.lot
    rule:
      en: 'Do not add {{-ति}} to a command: {{गच्छति}} is “he goes”, {{गच्छ}} is “go!”.'
      hi: 'आज्ञा में {{-ति}} मत जोड़िए: {{गच्छति}} का अर्थ ‘वह जाता है’, {{गच्छ}} का ‘जाओ!’।'
    tag: core
    taught_in: cmd.go#p1
  - skill: verb.lot
    rule:
      en: 'Do not use {{पठ}} for several people: say {{पठत}}.'
      hi: 'कई लोगों के लिए {{पठ}} मत कहिए: {{पठत}} कहिए।'
    tag: core
    taught_in: cmd.go#p5
- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: verb.lot
    rule:
      en: '{{लोट् च}} gives the {{लोट्}} for commands; {{एरुः}} makes {{-ति}} into {{-तु}}; {{अतो हेः}} drops {{हि}} after
        {{अ}}; {{आडुत्तमस्य पिच्च}} gives {{पठानि}}.'
      hi: '{{लोट् च}} आज्ञा के लिए {{लोट्}} देता है; {{एरुः}} {{-ति}} को {{-तु}} करता है; {{अतो हेः}} {{अ}} के बाद {{हि}}
        को हटाता है; {{आडुत्तमस्य पिच्च}} से {{पठानि}} बनता है।'
    sutras:
    - 3.3.162
    - 3.4.86
    - 6.4.105
    - 3.4.92
    tag: core
    taught_in: cmd.go#pn
- id: sheet
  kind: revision
  title:
    en: Quick sheet
    hi: एक नज़र में
  depth: core
  section: quick_sheet
  rows:
  - skill: verb.lot
    formula: गच्छ · गच्छतु · गच्छत · गच्छाम
    rule:
      en: command
      hi: आज्ञा
    tag: core
    taught_in: cmd.go#tb1
  - skill: verb.lot-polite
    formula: भवतु · भवन्तु · भवान् आगच्छतु
    rule:
      en: wish and polite request
      hi: कामना और प्रार्थना
    tag: core
    taught_in: cmd.wish#tb1

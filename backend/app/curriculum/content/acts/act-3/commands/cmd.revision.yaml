- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: verb.lot
    rule:
      en: '{{लोट् च}} gives the {{लोट्}} for commands; {{एरुः}} makes {{-ति}} into {{-तु}}; {{अतो हेः}} drops {{हि}} after
        {{अ}}; {{आडुत्तमस्य पिच्च}} gives {{पठानि}}.'
      hi: '{{लोट् च}} आज्ञा के लिए {{लोट्}} देता है; {{एरुः}} {{-ति}} को {{-तु}} करता है; {{अतो हेः}} {{अ}} के बाद {{हि}}
        को हटाता है; {{आडुत्तमस्य पिच्च}} से {{पठानि}} बनता है।'
    sutras:
    - 3.3.162
    - 3.4.86
    - 6.4.105
    - 3.4.92
    tag: core
    taught_in: cmd.go#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 3.3.162, {{लोट् च}}, gives {{लोट्}} for commands and requests. Then 3.4.86, {{एरुः}}, turns {{-ति}} into
          {{-तु}}: {{पठतु}}. In the second person {{हि}} comes and 6.4.105, {{अतो हेः}}, drops it after {{अ}}: {{पठ}}. In
          the first person 3.4.92, {{आडुत्तमस्य पिच्च}}, adds {{आ}}: {{पठानि}}.'
        hi: 'सूत्र 3.3.162, {{लोट् च}}, कहता है कि {{लोट्}} के प्रत्यय आज्ञा और प्रार्थना में आते हैं। प्रथम पुरुष में 3.4.86,
          {{एरुः}}, {{-ति}} प्रत्यय को {{-तु}} कर देता है: {{पठति}} से {{पठतु}}। मध्यम पुरुष में {{हि}} आता है, और 6.4.105,
          {{अतो हेः}}, ह्रस्व {{अ}} के बाद उसे हटा देता है: {{पठ}}। उत्तम पुरुष में 3.4.92, {{आडुत्तमस्य पिच्च}}, {{आ}} जोड़ता
          है: {{पठानि}}।'
      items:
      - id: i0
        sa: लोट् च
      - id: i1
        sa: लोट्
      - id: i2
        sa: एरुः
      - id: i3
        sa: -ति
      - id: i4
        sa: -तु
      - id: i5
        sa: पठतु
      - id: i6
        sa: हि
      - id: i7
        sa: अतो हेः
      - id: i8
        sa: अ
      - id: i9
        sa: पठ
      - id: i10
        sa: आडुत्तमस्य पिच्च
      - id: i11
        sa: आ
      - id: i12
        sa: पठानि

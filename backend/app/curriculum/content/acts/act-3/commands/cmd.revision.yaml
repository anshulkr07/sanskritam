          type: tinanta
          dhatu: अस्
          lakara: Lot
          purusha: Madhyama
          vacana: Eka
        feature:
          en: 'Root: {{अस्}} · singular · {{लोट्}} · Second person ({{मध्यमपुरुष}})'
          hi: 'धातु: {{अस्}} · {{एकवचन}} · {{लोट्}} · मध्यमपुरुष'
      - id: rule
        label:
          en: Connect the form and the rule
          hi: रूप को नियम से जोड़ें
        meaning:
          en: '{{अस्}} (be) gives {{एधि}}; {{दा}} gives {{देहि}}; {{कृ}} gives {{कुरु}}; {{श्रु}} gives {{शृणु}}. These do

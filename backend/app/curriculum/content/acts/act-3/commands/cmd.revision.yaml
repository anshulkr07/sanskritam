          hi: 'धातु: {{अस्}} · {{एकवचन}} · {{लोट्}} · मध्यमपुरुष'
  - skill: verb.lot
    rule:
      en: 'In the dual and plural the endings are plain: {{कुरुतम्}}, {{कुरुत}}; only the singular is odd.'
      hi: 'द्विवचन और बहुवचन में प्रत्यय सीधे हैं: {{कुरुतम्}}, {{कुरुत}}; केवल एकवचन विचित्र है।'
    example:
      sa: कुरुत
      meaning:
        en: do, all of you
        hi: तुम सब करो
      check:
        type: tinanta

  story:
    success:
      en: '“सर्वे सुखिनः भवन्तु,” you say, quite loudly, to Lubdhaka''s lantern. Lubdhaka''s smile stiffens: it is hard to be angry at a blessing. The Vetāla, upside down, applauds with two fingers. “That,” he says, “is how you disarm a man in one line.”'
      hi: '“सर्वे सुखिनः भवन्तु,” आप लुब्धक की लालटेन से काफ़ी ऊँचे स्वर में कहते हैं। लुब्धक की मुस्कान तन जाती है: आशीर्वाद पर क्रोध करना कठिन है। वेताल, उलटा लटका, दो उँगलियों से ताली बजाता है। “इसे कहते हैं,” वह कहता है, “एक पंक्ति में किसी को निःशस्त्र करना।”'
    failure:
      en: 'The lantern stays steady and cold. Third person, several: {{भवन्तु}}.'
      hi: 'लालटेन स्थिर और ठंडी रहती है। प्रथम पुरुष, कई: {{भवन्तु}}।'

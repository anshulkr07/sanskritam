cards:
- id: s1
  kind: story
  title:
    en: The lantern in the trees
    hi: पेड़ों के बीच लालटेन
  depth: core
  image:
    brief: Lubdhaka stepping out from between tree trunks with a raised lantern and a thin smile; the Vetāla hanging above him with a sweetly polite expression and a hand extended in welcome; Dādī gripping Śuka who stares with his beak open; long shadows.
    alt:
      en: A tall man with a lantern steps out of the trees while a spirit hanging above him gestures a polite welcome
      hi: लालटेन थामे लम्बा आदमी पेड़ों से निकलता है, ऊपर लटका भूत विनम्र स्वागत करता है
    cast:
    - lubdhaka
    - vetala
    - dadi
    - shuka
    place: smashana
    ratio: '4:3'
    id: cmd-wish-s1
  narration:
    en: 'Lubdhaka steps out of the trees, lantern raised, smiling the smile of someone who does not smile. “आगच्छतु भवान्,” the Vetāla says to him, sweet as honey: “Let your honour come.” Śuka gasps. “Why is he being polite?” Dādī: “The Vetāla never gives plain orders to a guest. A command in the third person is a request.”'
    hi: 'लुब्धक पेड़ों से निकल आता है, लालटेन उठाए, उस आदमी की मुस्कान लिए जो मुस्कराता नहीं। “आगच्छतु भवान्,” वेताल उससे शहद-सी मिठास में कहता है: “आप पधारें।” शुक चौंककर साँस लेता है। “यह इतना विनम्र क्यों है?” दादी: “वेताल अतिथि को सीधी आज्ञा नहीं देता। प्रथम पुरुष में आज्ञा एक प्रार्थना है।”'
- id: t1
  kind: teach
  title:
    en: Wishes and polite requests
    hi: शुभकामनाएँ और विनम्र प्रार्थना
  depth: core
  skills:
  - verb.lot-polite
  body:
    en: 'The third-person {{लोट्}} is also the polite request and the blessing: {{भवतु}} (let it be), {{जयतु}} (victory to him), {{जीवतु}} (long life), {{अस्तु}} (so be it). To be polite to “you”, say {{भवान्}} (your honour, a word for “you”) and put the verb in the third person: {{भवान् आगच्छतु}}, “please come”.'
    hi: 'प्रथम पुरुष का {{लोट्}} विनम्र प्रार्थना और आशीर्वाद भी है: {{भवतु}} (हो), {{जयतु}} (उसकी जय हो), {{जीवतु}} (दीर्घायु हो), {{अस्तु}} (ऐसा ही हो)। ‘आप’ के लिए विनम्र होने को {{भवान्}} (आप, ‘तुम’ का आदरसूचक शब्द) कहिए और क्रिया प्रथम पुरुष में रखिए: {{भवान् आगच्छतु}}, ‘कृपया आइए’।'
  examples:
  - sa: भवान् आगच्छतु।
    meaning:
      en: Please come.
      hi: कृपया आइए।
    words:
    - sa: भवान्
      gloss:
        en: you (polite)
        hi: आप
    - sa: आगच्छतु
      gloss:
        en: please come
        hi: पधारिए
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lot
        purusha: Prathama
        vacana: Eka
        prefixes:
        - आ
  - sa: भवान् उपविशतु।
    meaning:
      en: Please sit down.
      hi: कृपया बैठिए।
    words:
    - sa: भवान्
      gloss:
        en: you (polite)
        hi: आप
    - sa: उपविशतु
      gloss:
        en: please sit
        hi: बैठिए
      check:
        type: tinanta
        dhatu: विश्
        lakara: Lot
        purusha: Prathama
        vacana: Eka
        prefixes:
        - उप
  - sa: जयतु।
    meaning:
      en: May he win!
      hi: उसकी जय हो!
    words:
    - sa: जयतु
      gloss:
        en: may he win
        hi: वह जीते
      check:
        type: tinanta
        dhatu: जि
        lakara: Lot
        purusha: Prathama
        vacana: Eka

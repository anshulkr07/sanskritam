- id: t2
  kind: teach
  title:
    en: Blessings with “be!”
    hi: ‘हो जाओ!’ वाले आशीर्वाद
  depth: core
  skills:
  - verb.lot-polite
  body:
    en: 'A blessing to one person uses {{भव}} (be!) with an adjective: {{सुखी भव}} (be happy), {{आयुष्मान् भव}} (be long-lived). {{सर्वे सुखिनः भवन्तु}} wishes that all be happy.'
    hi: 'एक व्यक्ति के लिए आशीर्वाद में विशेषण के साथ {{भव}} (हो जाओ) आता है: {{सुखी भव}} (सुखी रहो), {{आयुष्मान् भव}} (दीर्घायु हो)। {{सर्वे सुखिनः भवन्तु}} कामना करता है कि सब सुखी हों।'
  examples:
  - sa: सुखी भव।
    meaning:
      en: Be happy!
      hi: सुखी रहो!
    words:
    - sa: सुखी
      gloss:
        en: happy
        hi: सुखी
      check:
        type: subanta
        stem: सुखिन्
        linga: Pum
        vibhakti: Prathama
        vacana: Eka
    - sa: भव
      gloss:
        en: be!
        hi: बनो!
      check:
        type: tinanta
        dhatu: भू
        lakara: Lot
        purusha: Madhyama
        vacana: Eka
  - sa: सर्वे सुखिनः भवन्तु।
    meaning:
      en: May all be happy.
      hi: सब सुखी हों।
    words:
    - sa: सर्वे
      gloss:
        en: all
        hi: सब
      check:
        type: subanta
        stem: सर्व
        linga: Pum
        vibhakti: Prathama
        vacana: Bahu
    - sa: सुखिनः
      gloss:
        en: happy
        hi: सुखी
      check:
        type: subanta
        stem: सुखिन्
        linga: Pum
        vibhakti: Prathama
        vacana: Bahu
    - sa: भवन्तु
      gloss:
        en: let them be
        hi: हों
      check:
        type: tinanta
        dhatu: भू
        lakara: Lot
        purusha: Prathama
        vacana: Bahu

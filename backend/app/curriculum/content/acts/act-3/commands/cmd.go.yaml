- id: pn
  kind: teach
  title:
    en: Pāṇini's command
    hi: पाणिनि की आज्ञा
  depth: panini
  skills:
  - verb.lot
  sutras:
  - 3.3.162
  - 3.4.86
  - 6.4.105
  - 3.4.92
  body:
    en: 'Sūtra 3.3.162, {{लोट् च}}, gives {{लोट्}} for commands and requests. Then 3.4.86, {{एरुः}}, turns {{-ति}} into {{-तु}}:
      {{पठतु}}. In the second person {{हि}} comes and 6.4.105, {{अतो हेः}}, drops it after {{अ}}: {{पठ}}. In the first person
      3.4.92, {{आडुत्तमस्य पिच्च}}, adds {{आ}}: {{पठानि}}.'
    hi: 'सूत्र 3.3.162, {{लोट् च}}, कहता है कि {{लोट्}} के प्रत्यय आज्ञा और प्रार्थना में आते हैं। प्रथम पुरुष में 3.4.86,
      {{एरुः}}, {{-ति}} प्रत्यय को {{-तु}} कर देता है: {{पठति}} से {{पठतु}}। मध्यम पुरुष में {{हि}} आता है, और 6.4.105, {{अतो
      हेः}}, ह्रस्व {{अ}} के बाद उसे हटा देता है: {{पठ}}। उत्तम पुरुष में 3.4.92, {{आडुत्तमस्य पिच्च}}, {{आ}} जोड़ता है: {{पठानि}}।'

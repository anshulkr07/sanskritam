cards:
- id: s1
  kind: story
  title:
    en: The hanging one
    hi: लटकने वाला
  depth: core
  image:
    brief: 'An old grove at night at the edge of a burning ground: a śiṃśapā tree with a long, thin ash-grey spirit hanging
      upside down from a branch, eyes closed, arms folded; below, you, Dādī and Śuka looking up; far back among the trunks
      the faint glow of a lantern and the tall silhouette of Lubdhaka; a tiny bright-red spirit pointing a long finger.'
    alt:
      en: A grey spirit hangs upside down in a tree while three travellers look up and a lantern glows far behind
      hi: पेड़ पर उलटा लटका भूरा भूत, नीचे तीन यात्री, पीछे दूर लालटेन की झलक
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - adeshaka
    - lubdhaka
    place: smashana
    ratio: '4:3'
    id: cmd-go-s1
  narration:
    en: 'An old grove at the edge of a burning ground. In a śiṃśapā tree something hangs upside down like a great grey bat:
      the Vetāla. “गच्छ!” he drawls at you, without opening his eyes. “पठ!” A lantern winks far back among the trunks. Lubdhaka
      has followed you here. Dādī whispers: “He only gives orders. Answer in Sanskrit and he will help.”'
    hi: 'बीहड़ श्मशान के छोर पर एक पुराना वन। शिंशपा के वृक्ष पर कोई बड़े भूरे चमगादड़ की तरह उलटा लटका है: वेताल। “गच्छ!”
      वह आँखें बन्द किए ही सुस्ती से कहता है। “पठ!” पीछे तनों के बीच एक लालटेन टिमटिमाती है। लुब्धक आपके पीछे यहाँ तक आ गया
      है। दादी फुसफुसाती हैं: “वह केवल आज्ञा देता है। संस्कृत में उत्तर दो तो वह मदद करेगा।”'
  lines:
  - speaker: dadi
    sa: गच्छ! पठ! वद!
    gloss:
      en: Go! Read! Speak!
      hi: जाओ! पढ़ो! बोलो!
  quote:
    sa: तत्र शिंशिपावृक्षे मृतकम् अवलम्बितम् आस्ते
    gloss:
      en: There, on the śiṃśipā tree, a corpse hangs.
      hi: वहाँ शिंशिपा के वृक्ष पर एक शव लटका है।
    source: Vetālapañcaviṃśatikā, introduction (read in the Digital Corpus of Sanskrit)
- id: t1
  kind: teach
  title:
    en: The bare root commands
    hi: केवल धातु से आज्ञा
  depth: core
  skills:
  - verb.lot
  body:
    en: 'To tell one person “you do it!”, use the root with its class sign and no ending: {{गच्छ}} (go!), {{पठ}} (read!),
      {{वद}} (speak!), {{पश्य}} (look!), {{लिख}} (write!), {{पिब}} (drink!). This is the command mood, {{लोट्}}.'
    hi: 'किसी एक को ‘तुम करो!’ कहने के लिए धातु को उसके गण-चिह्न के साथ बिना प्रत्यय के रखिए: {{गच्छ}} (जाओ!), {{पठ}} (पढ़ो!),
      {{वद}} (बोलो!), {{पश्य}} (देखो!), {{लिख}} (लिखो!), {{पिब}} (पियो!)। यह आज्ञा का काल-विधान है, {{लोट्}}।'
  examples:

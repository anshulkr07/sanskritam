    hi: '{{पठत}}: कई लोगों को आज्ञा।'
  roman: after
  gate: true
  story:
    success:
      en: '“पठत!” you call, and the Vetāla''s eyes open a slit. “Hm,” he says. “Someone who gives orders back.” He swings, delighted, and a small bright-red spirit drops from his shawl: a tiny finger as long as itself, shaking at you. “आदेशकः,” says Dādī. “He has not been obeyed in a hundred years.”'
      hi: '“पठत!” आप पुकारते हैं और वेताल की आँखें एक दरार भर खुलती हैं। “हूँ,” वह कहता है। “कोई जो उलटे आदेश देता है।” वह खुश होकर झूलता है, और उसके शॉल से एक नन्हा चमकीला लाल भूत गिरता है: अपने ही जितनी लम्बी उँगली आपकी ओर हिलाता हुआ। “आदेशकः,” दादी कहती हैं। “सौ वर्षों से किसी ने उसकी आज्ञा नहीं मानी।”'
    failure:
      en: 'The Vetāla stays asleep. To several people: {{पठत}}.'
      hi: 'वेताल सोया रहता है। कई लोगों से: {{पठत}}।'
  options:
  - sa: पठ
  - sa: पठतु
  - correct: true
    sa: पठत
- id: pn
  kind: teach
  title:
    en: Pāṇini's command
    hi: पाणिनि की आज्ञा
  depth: panini
  skills:
  - verb.lot
  sutras:
  - 3.3.162
  - 3.4.86
  - 6.4.105
  - 3.4.92
  body:
    en: 'Sūtra 3.3.162, {{लोट् च}}, gives {{लोट्}} for commands and requests. Then 3.4.86, {{एरुः}}, turns {{-ति}} into {{-तु}}: {{पठतु}}. In the second person {{हि}} comes and 6.4.105, {{अतो हेः}}, drops it after {{अ}}: {{पठ}}. In the first person 3.4.92, {{आडुत्तमस्य पिच्च}}, adds {{आ}}: {{पठानि}}.'
    hi: 'सूत्र 3.3.162, {{लोट् च}}, कहता है कि {{लोट्}} के प्रत्यय आज्ञा और प्रार्थना में आते हैं। प्रथम पुरुष में 3.4.86, {{एरुः}}, {{-ति}} प्रत्यय को {{-तु}} कर देता है: {{पठति}} से {{पठतु}}। मध्यम पुरुष में {{हि}} आता है, और 6.4.105, {{अतो हेः}}, ह्रस्व {{अ}} के बाद उसे हटा देता है: {{पठ}}। उत्तम पुरुष में 3.4.92, {{आडुत्तमस्य पिच्च}}, {{आ}} जोड़ता है: {{पठानि}}।'

- id: t2
  kind: teach
  title:
    en: Let him, let us
    hi: वह करे, हम करें
  depth: core
  skills:
  - verb.lot
  body:
    en: 'The third person is “let him …”: {{पठतु}}, {{गच्छतु}}. The first person is “let me …” or “let us …”: {{पठानि}}, {{गच्छाम}}. The command to several people ends in {{-त}}: {{पठत}}, “read, all of you”.'
    hi: 'प्रथम पुरुष ‘वह … करे’ है: {{पठतु}}, {{गच्छतु}}। उत्तम पुरुष ‘मैं … करूँ’ या ‘हम … करें’ है: {{पठानि}}, {{गच्छाम}}। कई लोगों को आज्ञा {{-त}} पर समाप्त होती है: {{पठत}}, ‘तुम सब पढ़ो’।'
  examples:

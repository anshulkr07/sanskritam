sources:
- title: Lesson text and story
  licence: original
cards:
- id: p1
  kind: practice
  depth: core
  skills:
  - verb.lot
  mode: choice
  prompt:
    en: 'Order a friend: “Read!”'
    hi: 'मित्र को आज्ञा दीजिए: ‘पढ़ो!’'
  explain:
    en: '{{पठ}}.'
    hi: '{{पठ}}।'
  roman: after
  options:
  - sa: पठति
  - correct: true
    sa: पठ
  - sa: पठामि
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: बालक गृहम् गच्छ।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: Boy, go home!
        hi: बालक, घर जाओ!
      words:
      - sa: बालक
        gloss:
          en: boy!
          hi: बालक!
        check:
          type: subanta
          stem: बालक
          linga: Pum
          vibhakti: Sambodhana
          vacana: Eka
      - sa: गृहम्
        gloss:
          en: home
          hi: घर
        check:
          type: subanta
          stem: गृह
          linga: Napumsaka
          vibhakti: Dvitiya
          vacana: Eka
      - sa: गच्छ
        gloss:
          en: go!
          hi: जाओ!
        check:
          type: tinanta
          dhatu: गम्
          lakara: Lot
          purusha: Madhyama
          vacana: Eka
    - id: i1
      sa: बालक
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: boy!
        hi: बालक!
      check:
        type: subanta
        stem: बालक
        linga: Pum
        vibhakti: Sambodhana
        vacana: Eka
      feature:
        en: 'Stem: {{बालक}} · masculine · {{सम्बोधन}} · singular'
        hi: 'प्रातिपदिक: {{बालक}} · {{पुंलिंग}} · {{सम्बोधन}} · {{एकवचन}}'
    - id: i2
      sa: गृहम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: home
        hi: घर
      check:
        type: subanta
        stem: गृह
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Eka
      feature:
        en: 'Stem: {{गृह}} · neuter · {{द्वितीया}} · singular'
        hi: 'प्रातिपदिक: {{गृह}} · {{नपुंसकलिंग}} · {{द्वितीया}} · {{एकवचन}}'
      compare_from: गृह
    - id: i3
      sa: गच्छ
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: go!
        hi: जाओ!
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lot
        purusha: Madhyama
        vacana: Eka
      feature:
        en: 'Root: {{गम्}} · singular · {{लोट्}} · Second person ({{मध्यमपुरुष}})'
        hi: 'धातु: {{गम्}} · {{एकवचन}} · {{लोट्}} · मध्यमपुरुष'
      compare_from: गम्
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'To tell one person “you do it!”, use the root with its class sign and no ending: {{गच्छ}} (go!), {{पठ}} (read!),
          {{वद}} (speak!), {{पश्य}} (look!), {{लिख}} (write!), {{पिब}} (drink!). This is the command mood, {{लोट्}}.'
        hi: 'किसी एक को ‘तुम करो!’ कहने के लिए धातु को उसके गण-चिह्न के साथ बिना प्रत्यय के रखिए: {{गच्छ}} (जाओ!), {{पठ}}
          (पढ़ो!), {{वद}} (बोलो!), {{पश्य}} (देखो!), {{लिख}} (लिखो!), {{पिब}} (पियो!)। यह आज्ञा का काल-विधान है, {{लोट्}}।'

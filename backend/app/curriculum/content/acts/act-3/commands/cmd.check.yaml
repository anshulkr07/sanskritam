  - verb.lot
  mode: order
  prompt:
    en: 'Bless the little spirit: “Be happy!”'
    hi: 'नन्हे भूत को आशीर्वाद दीजिए: ‘सुखी रहो!’'
  explain:
    en: '{{सुखी भव}}: a blessing to one.'
    hi: '{{सुखी भव}}: एक को आशीर्वाद।'
  roman: after
  gate: true
  story:
    success:
      en: '“सुखी भव,” you say to Ādeśaka. The tiny red spirit''s long finger stops pointing and curls gently into a fist, then opens like a flower. He bows, once, and a drum no bigger than a nut taps three times at his side: “गच्छ, पठ, वद.” Overhead the Vetāla laughs: “He was never really angry, only unheard.” Then, in a lazy voice: “ह्यः सः अगच्छत्.” “Yesterday he went.” He does not say who.'
      hi: '“सुखी भव,” आप आदेशक से कहते हैं। नन्हे लाल भूत की लम्बी उँगली इशारा करना बन्द कर देती है, धीरे से मुट्ठी बनती है, फिर फूल की तरह खुलती है। वह एक बार झुकता है, और उसकी बगल में अखरोट जितना ढोल तीन बार बजता है: “गच्छ, पठ, वद।” ऊपर वेताल हँसता है: “वह कभी सचमुच क्रोधित नहीं था, बस अनसुना था।” फिर सुस्त आवाज़ में: “ह्यः सः अगच्छत्।” “कल वह गया।” वह नहीं बताता कौन।'
    failure:
      en: 'The finger keeps pointing. A blessing to one person: {{सुखी भव}}.'
      hi: 'उँगली इशारा करती रहती है। एक व्यक्ति को आशीर्वाद: {{सुखी भव}}।'
  tokens:
  - सुखी
  - भव

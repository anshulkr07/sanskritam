- id: s1
  kind: story
  title:
    en: An offer
    hi: एक प्रस्ताव
  depth: core
  image:
    brief: Lubdhaka setting a heavy leather purse on a tree root before you, his other hand on his satchel; the Vetāla grinning upside down; you standing firm with Dādī's hand on your shoulder and Śuka fluffed up; lantern light and long shadows.
    alt:
      en: A man sets a heavy purse on a root before a child while a spirit grins upside down above
      hi: जड़ पर बच्चे के सामने भारी थैली रखता आदमी, ऊपर उलटा मुस्कराता भूत
    cast:
    - lubdhaka
    - vetala
    - you
    - dadi
    - shuka
    place: smashana
    ratio: '4:3'
    id: future-plans-s1
  narration:
    en: 'Lubdhaka comes close. He sets a heavy purse on the root before you. “Name your price for the leaves.” The Vetāla opens one eye and grins. “किं करिष्यसि? What will you do?” Dādī nods. The answer is a promise, the first person of the future: “न दास्यामि.” “I will not give.” The grove goes quiet.'
    hi: 'लुब्धक पास आता है। वह जड़ पर आपके सामने भारी थैली रखता है। “पत्रों का मोल बताओ।” वेताल एक आँख खोलकर मुस्कराता है। “किं करिष्यसि? तुम क्या करोगे?” दादी सिर हिलाती हैं। उत्तर एक वचन है, भविष्यत् का उत्तम पुरुष: “न दास्यामि।” “मैं नहीं दूँगा।” वन चुप हो जाता है।'
- id: t1
  kind: teach
  title:
    en: I will, we will
    hi: मैं करूँगा, हम करेंगे
  depth: core
  skills:
  - verb.lrt
  body:
    en: 'The first person ends in {{-मि}} for “I” and {{-मः}} for “we”: {{करिष्यामि}} (I will do), {{करिष्यामः}} (we will do). With {{न}} it is a promise to refuse: {{न दास्यामि}}, “I will not give”. A question: {{किं करिष्यसि}}, “what will you do?”'
    hi: 'उत्तम पुरुष में ‘मैं’ के लिए {{-मि}} और ‘हम’ के लिए {{-मः}} है: {{करिष्यामि}} (मैं करूँगा), {{करिष्यामः}} (हम करेंगे)। {{न}} के साथ यह मना करने का वचन है: {{न दास्यामि}}, ‘मैं नहीं दूँगा’। प्रश्न: {{किं करिष्यसि}}, ‘तुम क्या करोगे?’'
  examples:
  - sa: अहम् न पत्राणि दास्यामि।
    meaning:
      en: I will not give the leaves.
      hi: मैं पत्र नहीं दूँगा।
    words:
    - sa: अहम्
      gloss:
        en: I
        hi: मैं
    - sa: न
      gloss:
        en: not
        hi: नहीं
    - sa: पत्राणि
      gloss:
        en: leaves
        hi: पत्र
      check:
        type: subanta
        stem: पत्र
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Bahu
    - sa: दास्यामि
      gloss:
        en: will give
        hi: दूँगा
      check:
        type: tinanta
        dhatu: दा
        lakara: Lrt
        purusha: Uttama
        vacana: Eka
  - sa: वयम् पुस्तकम् पठिष्यामः।
    meaning:
      en: We will read the book.
      hi: हम पुस्तक पढ़ेंगे।
    words:
    - sa: वयम्
      gloss:
        en: we
        hi: हम
    - sa: पुस्तकम्
      gloss:
        en: book
        hi: पुस्तक
      check:
        type: subanta
        stem: पुस्तक
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Eka
    - sa: पठिष्यामः
      gloss:
        en: will read
        hi: पढ़ेंगे
      check:
        type: tinanta
        dhatu: पठ्
        lakara: Lrt
        purusha: Uttama
        vacana: Bahu
  - sa: किम् त्वम् करिष्यसि।
    meaning:
      en: What will you do?
      hi: तुम क्या करोगे?
    words:
    - sa: किम्
      gloss:
        en: what
        hi: क्या
      check:
        type: subanta
        stem: किम्
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Eka
    - sa: त्वम्
      gloss:
        en: you
        hi: तुम
    - sa: करिष्यसि
      gloss:
        en: will do
        hi: करोगे
      check:
        type: tinanta
        dhatu: कृ
        lakara: Lrt
        purusha: Madhyama
        vacana: Eka

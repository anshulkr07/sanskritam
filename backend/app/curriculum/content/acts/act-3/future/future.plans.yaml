- id: t2
  kind: teach
  title:
    en: Plans
    hi: योजनाएँ
  depth: core
  skills:
  - verb.lrt
  body:
    en: 'The future is also for plans: {{श्वः गमिष्यामि}} (tomorrow I will go), {{पश्चात् पठिष्यामः}} (afterwards we will read). Time words help: {{श्वः}} (tomorrow), {{परश्वः}} (the day after), {{पश्चात्}} (afterwards).'
    hi: 'भविष्यत् योजनाओं के लिए भी है: {{श्वः गमिष्यामि}} (कल मैं जाऊँगा), {{पश्चात् पठिष्यामः}} (बाद में हम पढ़ेंगे)। समय-शब्द सहायक हैं: {{श्वः}} (कल), {{परश्वः}} (परसों), {{पश्चात्}} (बाद में)।'
  examples:
  - sa: श्वः अहम् ग्रामम् गमिष्यामि।
    meaning:
      en: Tomorrow I will go to the village.
      hi: कल मैं गाँव जाऊँगा।
    words:
    - sa: श्वः
      gloss:
        en: tomorrow
        hi: कल
    - sa: अहम्
      gloss:
        en: I
        hi: मैं
    - sa: ग्रामम्
      gloss:
        en: village
        hi: गाँव
      check:
        type: subanta
        stem: ग्राम
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Eka
    - sa: गमिष्यामि
      gloss:
        en: will go
        hi: जाऊँगा
      check:
        type: tinanta
        dhatu: गम्
        lakara: Lrt
        purusha: Uttama
        vacana: Eka
  - sa: पश्चात् वयम् पठिष्यामः।
    meaning:
      en: Afterwards we will read.
      hi: बाद में हम पढ़ेंगे।
    words:
    - sa: पश्चात्
      gloss:
        en: afterwards
        hi: बाद में

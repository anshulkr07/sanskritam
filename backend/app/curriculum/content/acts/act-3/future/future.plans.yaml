sources:
- title: Lesson text and story
  licence: original
cards:
- id: s1
  kind: story
  title:
    en: An offer
    hi: एक प्रस्ताव
  depth: core
  image:
    brief: Lubdhaka setting a heavy leather purse on a tree root before you, his other hand on his satchel; the Vetāla grinning
      upside down; you standing firm with Dādī's hand on your shoulder and Śuka fluffed up; lantern light and long shadows.
    alt:
      en: A man sets a heavy purse on a root before a child while a spirit grins upside down above
      hi: जड़ पर बच्चे के सामने भारी थैली रखता आदमी, ऊपर उलटा मुस्कराता भूत
    cast:
    - lubdhaka
    - vetala
    - you
    - dadi
    - shuka
    place: smashana
    ratio: '4:3'
    id: future-plans-s1
  narration:
    en: 'Lubdhaka comes close. He sets a heavy purse on the root before you. “Name your price for the leaves.” The Vetāla
      opens one eye and grins. “किं करिष्यसि? What will you do?” Dādī nods. The answer is a promise, the first person of the
      future: “न दास्यामि.” “I will not give.” The grove goes quiet.'
    hi: 'लुब्धक पास आता है। वह जड़ पर आपके सामने भारी थैली रखता है। “पत्रों का मोल बताओ।” वेताल एक आँख खोलकर मुस्कराता है।
      “किं करिष्यसि? तुम क्या करोगे?” दादी सिर हिलाती हैं। उत्तर एक वचन है, भविष्यत् का उत्तम पुरुष: “न दास्यामि।” “मैं नहीं
      दूँगा।” वन चुप हो जाता है।'
- id: t1
  kind: teach
  title:
    en: I will, we will
    hi: मैं करूँगा, हम करेंगे
  depth: core
  skills:
  - verb.lrt
  body:
    en: 'The first person ends in {{-मि}} for “I” and {{-मः}} for “we”: {{करिष्यामि}} (I will do), {{करिष्यामः}} (we will
      do). With {{न}} it is a promise to refuse: {{न दास्यामि}}, “I will not give”. A question: {{किं करिष्यसि}}, “what will
      you do?”'
    hi: 'उत्तम पुरुष में ‘मैं’ के लिए {{-मि}} और ‘हम’ के लिए {{-मः}} है: {{करिष्यामि}} (मैं करूँगा), {{करिष्यामः}} (हम करेंगे)।
      {{न}} के साथ यह मना करने का वचन है: {{न दास्यामि}}, ‘मैं नहीं दूँगा’। प्रश्न: {{किं करिष्यसि}}, ‘तुम क्या करोगे?’'
  examples:
  - sa: अहम् न पत्राणि दास्यामि।

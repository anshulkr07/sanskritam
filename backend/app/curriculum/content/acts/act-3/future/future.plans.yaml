  mode: choice
  prompt:
    en: 'Answer the Vetāla: “What will you do?” “Tomorrow I will go.”'
    hi: 'वेताल को उत्तर दीजिए: ‘तुम क्या करोगे?’ ‘कल मैं जाऊँगा।’'
  explain:
    en: '{{श्वः गमिष्यामि}}: tomorrow with the future.'
    hi: '{{श्वः गमिष्यामि}}: कल, भविष्यत् के साथ।'
  roman: after
  gate: true
  story:
    success:
      en: '“श्वः गमिष्यामि,” you say, and Lubdhaka''s purse slowly rolls off the root, spilling no coins: it was never full.
        He stares at it. “I did not expect,” he says carefully, “a child who plans.” The Vetāla swings with delight. “A forward-looker.
        A forward-looker!”'
      hi: '“श्वः गमिष्यामि,” आप कहते हैं, और लुब्धक की थैली धीरे-धीरे जड़ से लुढ़कती है, एक भी सिक्का बिखेरे बिना: वह कभी
        भरी ही नहीं थी। वह उसे घूरता है। “मुझे उम्मीद नहीं थी,” वह सावधानी से कहता है, “कि कोई बच्चा योजना बनाता होगा।” वेताल
        आनन्द से झूल उठता है। “आगे देखने वाला। आगे देखने वाला!”'
    failure:
      en: 'The purse stays where it is. “Tomorrow I will go”: {{श्वः गमिष्यामि}}.'
      hi: 'थैली वहीं रहती है। ‘कल मैं जाऊँगा’: {{श्वः गमिष्यामि}}।'

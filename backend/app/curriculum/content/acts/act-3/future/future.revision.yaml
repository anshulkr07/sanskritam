      items:
      - id: i1
        sa: बालकाः पुस्तकम् पठिष्यन्ति।
        meaning:
          en: The boys will read the book.
          hi: बालक पुस्तक पढ़ेंगे।
        words:
        - sa: बालकाः
          gloss:
            en: boys
            hi: बालक
          check:
            type: subanta
            stem: बालक
            linga: Pum
            vibhakti: Prathama
            vacana: Bahu
        - sa: पुस्तकम्
          gloss:
            en: book
            hi: पुस्तक
          check:
            type: subanta
            stem: पुस्तक
            linga: Napumsaka
            vibhakti: Dvitiya
            vacana: Eka
        - sa: पठिष्यन्ति
          gloss:
            en: will read
            hi: पढ़ेंगे
          check:
            type: tinanta
            dhatu: पठ्
            lakara: Lrt
            purusha: Prathama
            vacana: Bahu
        image:
          id: teaching-reader-many
          brief: 'Edit target: the supplied Sanskrit teaching illustration. Preserve the exact number of boys, their faces,
            clothing, books, furniture, watercolor style, composition and 4:3 aspect ratio. Change ONLY the writing on ALL
            open books. Remove every tiny line, squiggle, fake letter and text-like mark. On each open book write the SAME
            SINGLE SHORT LINE in very large, clean, exact Devanagari: "अ इ उ". These are exactly three characters अ, इ, उ,
            separated by spaces. Put this line prominently on one page of every book; every other page area must be clean
            unmarked ivory paper. No other letters anywhere. Do not invent text. The three characters must be legible at phone
            size. Keep the exact number of human figures unchanged.'

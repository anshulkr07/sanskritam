- id: conditions
  kind: revision
  title:
    en: When to use which
    hi: कब कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: verb.lrt
    rule:
      en: 'Use {{लृट्}} for what will happen; time words help: {{श्वः}}, {{पश्चात्}}.'
      hi: 'जो होगा, उसके लिए {{लृट्}}; समय-शब्द सहायक हैं: {{श्वः}}, {{पश्चात्}}।'
    tag: good
    taught_in: future.sya#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:

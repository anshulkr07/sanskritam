      hi: 'वचन के लिए वर्तमान मत लीजिए: {{न ददामि}} का अर्थ ‘मैं नहीं देता’ है।'
    tag: core
    taught_in: future.plans#p1
- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: verb.lrt
    rule:
      en: '{{लृट् शेषे च}} and {{स्यतासी लृलुटोः}}: the tense and its sign {{स्य}}. {{आर्धधातुकस्येड् वलादेः}} and {{आदेशप्रत्यययोः}}:
        the {{इ}} and the {{ष्}}.'
      hi: '{{लृट् शेषे च}} और {{स्यतासी लृलुटोः}}: काल और उसका चिह्न {{स्य}}। {{आर्धधातुकस्येड् वलादेः}} और {{आदेशप्रत्यययोः}}:
        {{इ}} और {{ष्}}।'
    sutras:
    - 3.3.13
    - 3.1.33
    - 7.2.35
    - 8.3.59
    tag: core
    taught_in: future.sya#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 3.3.13, {{लृट् शेषे च}}, gives {{लृट्}} for what will happen. 3.1.33, {{स्यतासी लृलुटोः}}, adds {{स्य}}.
          7.2.35, {{आर्धधातुकस्येड् वलादेः}}, adds {{इ}} before a consonant, so {{पठ् + इ + स्य}}; and 8.3.59, {{आदेशप्रत्यययोः}},
          turns {{स्}} into {{ष्}} after {{इ}}: {{पठिष्यति}}.'
        hi: 'सूत्र 3.3.13, {{लृट् शेषे च}}, जो होगा उसके लिए {{लृट्}} देता है। 3.1.33, {{स्यतासी लृलुटोः}}, {{स्य}} जोड़ता
          है। 7.2.35, {{आर्धधातुकस्येड् वलादेः}}, व्यंजन से पहले {{इ}} जोड़ता है, इसलिए {{पठ् + इ + स्य}}; और 8.3.59, {{आदेशप्रत्यययोः}},
          {{इ}} के बाद {{स्}} को {{ष्}} कर देता है: {{पठिष्यति}}।'
      items:
      - id: i0
        sa: लृट् शेषे च
      - id: i1
        sa: लृट्
      - id: i2
        sa: स्यतासी लृलुटोः
      - id: i3
        sa: स्य
      - id: i4
        sa: आर्धधातुकस्येड् वलादेः
      - id: i5
        sa: इ
      - id: i6
        sa: पठ् + इ + स्य
      - id: i7
        sa: आदेशप्रत्यययोः
      - id: i8
        sa: स्
      - id: i9
        sa: ष्
      - id: i10
        sa: पठिष्यति

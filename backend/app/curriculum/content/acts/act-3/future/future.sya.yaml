  kind: practice
  title:
    en: They will read
    hi: वे पढ़ेंगे
  depth: core
  skills:
  - verb.lrt
  mode: choice
  prompt:
    en: “They will read.” Which form?
    hi: ‘वे पढ़ेंगे।’ कौन-सा रूप?
  explain:
    en: '{{पठिष्यन्ति}}: they, many.'
    hi: '{{पठिष्यन्ति}}: वे, अनेक।'
  roman: after
  gate: true
  story:
    success:
      en: “पठिष्यन्ति,” you say, and the leaning spirit tips forward at last, runs three steps, and turns into a streak of
        dawn that races away between the trees. Where he passed, the grass stands a little taller. The Vetāla opens one eye.
        “Ah. A forward-looker. Rare.”
      hi: “पठिष्यन्ति,” आप कहते हैं, और झुका हुआ भूत अन्ततः आगे गिर पड़ता है, तीन कदम दौड़ता है, और भोर की एक लकीर बनकर पेड़ों
        के बीच से भाग जाता है। जहाँ से वह गुज़रा, घास थोड़ी ऊँची खड़ी है। वेताल एक आँख खोलता है। “आहा। आगे देखने वाला। दुर्लभ।”
    failure:
      en: 'The spirit stays leaning. “They will read”: {{पठिष्यन्ति}}.'
      hi: 'भूत झुका रहता है। ‘वे पढ़ेंगे’: {{पठिष्यन्ति}}।'

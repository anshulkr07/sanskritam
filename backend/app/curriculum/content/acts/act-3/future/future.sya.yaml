  - sa: पठिष्यतः
  - correct: true
    sa: पठिष्यन्ति
- id: pn
  kind: teach
  title:
    en: Pāṇini's future
    hi: पाणिनि का भविष्यत्
  depth: panini
  skills:
  - verb.lrt
  sutras:
  - 3.3.13
  - 3.1.33
  - 7.2.35
  - 8.3.59
  body:
    en: 'Sūtra 3.3.13, {{लृट् शेषे च}}, gives {{लृट्}} for what will happen. 3.1.33, {{स्यतासी लृलुटोः}}, adds {{स्य}}. 7.2.35, {{आर्धधातुकस्येड् वलादेः}}, adds {{इ}} before a consonant, so {{पठ् + इ + स्य}}; and 8.3.59, {{आदेशप्रत्यययोः}}, turns {{स्}} into {{ष्}} after {{इ}}: {{पठिष्यति}}.'
    hi: 'सूत्र 3.3.13, {{लृट् शेषे च}}, जो होगा उसके लिए {{लृट्}} देता है। 3.1.33, {{स्यतासी लृलुटोः}}, {{स्य}} जोड़ता है। 7.2.35, {{आर्धधातुकस्येड् वलादेः}}, व्यंजन से पहले {{इ}} जोड़ता है, इसलिए {{पठ् + इ + स्य}}; और 8.3.59, {{आदेशप्रत्यययोः}}, {{इ}} के बाद {{स्}} को {{ष्}} कर देता है: {{पठिष्यति}}।'

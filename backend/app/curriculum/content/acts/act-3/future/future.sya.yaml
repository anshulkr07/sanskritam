- id: p1
  kind: practice
  depth: core
  skills:
  - verb.lrt
  mode: choice
  prompt:
    en: “He will read.” Which form?
    hi: ‘वह पढ़ेगा।’ कौन-सा रूप?
  explain:
    en: '{{पठिष्यति}}: root + {{-इष्य-}} + {{-ति}}.'
    hi: '{{पठिष्यति}}: धातु + {{-इष्य-}} + {{-ति}}।'
  roman: after
  options:
  - sa: पठति
  - sa: अपठत्
  - correct: true
    sa: पठिष्यति
  feedback_visuals:
  - id: v-source-feedback
    kind: worked
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    items:
    - id: i0
      sa: अहम् न पत्राणि दास्यामि।
      label:
        en: Read the whole example
        hi: पूरा उदाहरण पढ़ें
      meaning:
        en: I will not give the leaves.
        hi: मैं पत्र नहीं दूँगा।
      words:
      - sa: अहम्
        gloss:
          en: I
          hi: मैं
      - sa: न
        gloss:
          en: not
          hi: नहीं
      - sa: पत्राणि
        gloss:
          en: leaves
          hi: पत्र
        check:
          type: subanta
          stem: पत्र
          linga: Napumsaka
          vibhakti: Dvitiya
          vacana: Bahu
      - sa: दास्यामि
        gloss:
          en: will give
          hi: दूँगा
        check:
          type: tinanta
          dhatu: दा
          lakara: Lrt
          purusha: Uttama
          vacana: Eka
    - id: i1
      sa: अहम्
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: I
        hi: मैं
    - id: i2
      sa: न
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: not
        hi: नहीं
    - id: i3
      sa: पत्राणि
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: leaves
        hi: पत्र
      check:
        type: subanta
        stem: पत्र
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Bahu
      feature:
        en: 'Stem: {{पत्र}} · neuter · {{द्वितीया}} · plural'
        hi: 'प्रातिपदिक: {{पत्र}} · {{नपुंसकलिंग}} · {{द्वितीया}} · {{बहुवचन}}'
    - id: i4
      sa: दास्यामि
      label:
        en: Follow this word
        hi: इस शब्द पर ध्यान दें
      meaning:
        en: will give
        hi: दूँगा
      check:
        type: tinanta
        dhatu: दा
        lakara: Lrt
        purusha: Uttama
        vacana: Eka
      feature:
        en: 'Root: {{दा}} · singular · {{लृट्}} · First person ({{उत्तमपुरुष}})'
        hi: 'धातु: {{दा}} · {{एकवचन}} · {{लृट्}} · उत्तमपुरुष'
    - id: rule
      label:
        en: Connect the form and the rule
        hi: रूप को नियम से जोड़ें
      meaning:
        en: 'The first person ends in {{-मि}} for “I” and {{-मः}} for “we”: {{करिष्यामि}} (I will do), {{करिष्यामः}} (we will
          do). With {{न}} it is a promise to refuse: {{न दास्यामि}}, “I will not give”. A question: {{किं करिष्यसि}}, “what
          will you do?”'
        hi: 'उत्तम पुरुष में ‘मैं’ के लिए {{-मि}} और ‘हम’ के लिए {{-मः}} है: {{करिष्यामि}} (मैं करूँगा), {{करिष्यामः}} (हम
          करेंगे)। {{न}} के साथ यह मना करने का वचन है: {{न दास्यामि}}, ‘मैं नहीं दूँगा’। प्रश्न: {{किं करिष्यसि}}, ‘तुम क्या
          करोगे?’'
    - id: i7

- id: p7
  kind: practice
  depth: core
  skills:
  - verb.lrt
  mode: order
  prompt:
    en: 'Tell Bhāvika: “Tomorrow he will go.”'
    hi: 'भाविक से कहिए: ‘कल वह जाएगा।’'
  explain:
    en: '{{श्वः सः गमिष्यति}}.'
    hi: '{{श्वः सः गमिष्यति}}।'
  roman: after
  gate: true
  story:
    success:
      en: “श्वः सः गमिष्यति,” you say, and Bhāvika, who had been leaning for a thousand years, straightens up. “Tomorrow,” he says, as if tasting the word. “How good. I thought it would never come.” The light of dawn that was always about to break actually breaks, on his shoulders. “सः गच्छेत्,” he says, softer. “He should go.” The Vetāla's eyes snap open. “Careful,” he says. “That is not a promise. That is an opinion.”
      hi: “श्वः सः गमिष्यति,” आप कहते हैं, और भाविक, जो हज़ार वर्षों से झुका था, सीधा हो जाता है। “कल,” वह कहता है, मानो शब्द चख रहा हो। “कितना अच्छा। मैंने सोचा था यह कभी नहीं आएगा।” भोर की जो रोशनी हमेशा फूटने को थी, वह सचमुच उसके कंधों पर फूट पड़ती है। “सः गच्छेत्,” वह धीमे से कहता है। “उसे जाना चाहिए।” वेताल की आँखें खुल जाती हैं। “सावधान,” वह कहता है। “यह वचन नहीं है। यह राय है।”
    failure:
      en: 'Bhāvika keeps leaning. His sentence: {{श्वः सः गमिष्यति}}.'
      hi: 'भाविक झुका रहता है। उसका वाक्य: {{श्वः सः गमिष्यति}}।'
  tokens:
  - श्वः
  - सः
  - गमिष्यति

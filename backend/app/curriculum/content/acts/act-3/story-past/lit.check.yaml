- id: p7
  kind: practice
  depth: core
  skills:
  - verb.lit
  mode: order
  prompt:
    en: 'Speak for the tale: “Kāṇabhūti said to him.”'
    hi: 'कथा की ओर से बोलिए: ‘काणभूति ने उससे कहा।’'
  explain:
    en: '{{काणभूतिः उवाच तम्}}.'
    hi: '{{काणभूतिः उवाच तम्}}।'
  roman: after
  gate: true
  story:
    success:
      en: “काणभूतिः उवाच तम्,” you say, and Kathaka unrolls to his full length, so that all his pages show. “Now I remember how the old tale ends,” he says. “जगाम मुक्तशापः सन् काणभूतिः निजां गतिम्. ‘Kāṇabhūti, freed from his curse, went to his own place.’” He rolls himself up again, humming, and walks off into the night. At the edge of the grove he turns. “मा शुचः,” he says gently. “Do not grieve.”
      hi: “काणभूतिः उवाच तम्,” आप कहते हैं, और कथक अपनी पूरी लम्बाई में खुल जाता है, ताकि उसके सारे पन्ने दिखें। “अब मुझे याद आया कि पुरानी कथा कैसे समाप्त होती है,” वह कहता है। “जगाम मुक्तशापः सन् काणभूतिः निजां गतिम्। ‘शाप से मुक्त होकर काणभूति अपने स्थान को गया।’” वह फिर लपेट लेता है और गुनगुनाता रात में चल देता है। वन के छोर पर वह मुड़ता है। “मा शुचः,” वह धीमे से कहता है। “शोक मत करो।”
    failure:
      en: 'The pages stay rolled. The real line: {{काणभूतिः उवाच तम्}}.'
      hi: 'पन्ने लपेटे रहते हैं। असली पंक्ति: {{काणभूतिः उवाच तम्}}।'
  tokens:
  - काणभूतिः
  - उवाच
  - तम्

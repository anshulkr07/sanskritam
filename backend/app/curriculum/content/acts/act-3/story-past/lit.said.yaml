- id: s1
  kind: story
  title:
    en: The word before every speech
    hi: हर वक्तव्य से पहले का शब्द
  depth: core
  image:
    brief: The Vetāla seated near a small fire telling a tale with a raised finger; the storybook spirit beating a drum-roll
      on his spine; Lubdhaka stopping at the edge of the firelight, pulled in by the drum; you, Dādī and Śuka around the fire.
    alt:
      en: A grey spirit tells a tale by a fire while a man stops at the edge of the light
      hi: अलाव के पास कथा सुनाता भूत, रोशनी के किनारे रुका आदमी
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - kathaka
    - lubdhaka
    place: smashana
    ratio: '4:3'
    id: lit-said-s1
  narration:
    en: '“Every speech in my tales begins the same way,” says the Vetāla. “उवाच. ‘He said.’” The little storyteller beats
      a roll on his spine. Lubdhaka, drawn in by the drum, stops at the edge of the firelight. “उवाच कः?” asks the Vetāla
      pleasantly. “Who said?” Dādī nods at you: “Say it, and speak for the tale.”'
    hi: '“मेरी कथाओं में हर वक्तव्य एक ही तरह शुरू होता है,” वेताल कहता है। “उवाच। ‘उसने कहा।’” नन्हा कथावाचक रीढ़ पर ढोल
      की झड़ी बजाता है। ढोल से खिंचा लुब्धक अलाव की रोशनी के किनारे रुक जाता है। “उवाच कः?” वेताल मीठे स्वर में पूछता है।
      “किसने कहा?” दादी आपकी ओर सिर हिलाती हैं: “कहिए, और कथा की ओर से बोलिए।”'
  quote:
    sa: तच्छ्रुत्वा प्रणतो हृष्टः काणभूतिरुवाच तम्
    gloss:
      en: Hearing that, bowing, delighted, Kāṇabhūti said to him.
      hi: यह सुनकर, प्रणाम करके, प्रसन्न काणभूति ने उससे कहा।
    source: Kathāsaritsāgara 1.6 (read in the Digital Corpus of Sanskrit)
  lines:

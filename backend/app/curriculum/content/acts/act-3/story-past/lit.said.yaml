    gloss:
      en: He said.
      hi: उसने कहा।
    check:
      type: tinanta
      dhatu: वच्
      lakara: Lit
      purusha: Prathama
      vacana: Eka
- id: t1
  kind: teach
  title:
    en: उवाच and the others
    hi: उवाच और अन्य
  depth: core
  skills:
  - verb.lit
  body:
    en: '{{वच्}} (say) has an irregular story past: {{उवाच}} (he said), {{ऊचतुः}} (the two said), {{ऊचुः}} (they said). {{उवाच}} introduces a speech: {{सः उवाच}}, “he said”. {{जगाद}} (from {{गद्}}) also means “he said”.'
    hi: '{{वच्}} (कहना) का कथा-भूतकाल अनियमित है: {{उवाच}} (उसने कहा), {{ऊचतुः}} (दोनों ने कहा), {{ऊचुः}} (उन्होंने कहा)। {{उवाच}} वक्तव्य का आरम्भ करता है: {{सः उवाच}}, ‘उसने कहा’। {{जगाद}} ({{गद्}} से) का भी अर्थ ‘उसने कहा’ है।'
  examples:
  - sa: काणभूतिः तम् उवाच।
    meaning:
      en: Kāṇabhūti said to him.
      hi: काणभूति ने उससे कहा।
    words:
    - sa: काणभूतिः
      gloss:
        en: Kāṇabhūti
        hi: काणभूति
    - sa: तम्
      gloss:
        en: to him
        hi: उससे
    - sa: उवाच
      gloss:
        en: said
        hi: बोला
      check:
        type: tinanta
        dhatu: वच्
        lakara: Lit
        purusha: Prathama
        vacana: Eka
  - sa: ते ऊचुः।

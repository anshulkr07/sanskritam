        है, और उसके पन्ने वक्तव्यों से भरे हैं, हर एक उसी शब्द से शुरू: उवाच, उवाच, उवाच। “मैं शुरू करना भूल गया था,” वह कहता
        है। “आपने मुझे याद दिला दिया।”'
    failure:
      en: 'The fire stays quiet. “They said”: {{ऊचुः}}.'

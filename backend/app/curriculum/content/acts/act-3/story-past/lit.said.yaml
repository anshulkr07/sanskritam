  note:
    en: '{{उवाच}} is the form to know: the {{व}} of the root joins the doubled {{व}} into {{उ}}.'
    hi: '{{उवाच}} जानने योग्य रूप है: धातु का {{व}} और द्वित्व का {{व}} मिलकर {{उ}} बन जाते हैं।'
- id: t2
  kind: teach
  title:
    en: Seen and unseen
    hi: देखा और अनदेखा
  depth: core
  skills:
  - verb.lit
  body:
    en: 'Compare: {{अवदत्}} is “he said” for something you know; {{उवाच}} is “he said” as the old teller narrates. In everyday Sanskrit you will find both; the epics prefer {{उवाच}}.'
    hi: 'तुलना कीजिए: {{अवदत्}} उसके लिए ‘उसने कहा’ है जो आप जानते हैं; {{उवाच}} पुराने कथावाचक का ‘उसने कहा’ है। रोज़ की संस्कृत में दोनों मिलेंगे; महाकाव्य {{उवाच}} पसन्द करते हैं।'

  story:
    success:
      en: '“ऊचुः,” you say, and the fire crackles as if many voices had spoken at once. The storybook spirit unrolls himself, delighted, and his pages are full of speeches, each starting with the same word: उवाच, उवाच, उवाच. “I forgot how to begin,” he says. “You have reminded me.”'
      hi: '“ऊचुः,” आप कहते हैं, और अलाव ऐसे चटकता है जैसे कई आवाज़ें एक साथ बोली हों। पोथी-भूत आनन्द से स्वयं को खोल देता है, और उसके पन्ने वक्तव्यों से भरे हैं, हर एक उसी शब्द से शुरू: उवाच, उवाच, उवाच। “मैं शुरू करना भूल गया था,” वह कहता है। “आपने मुझे याद दिला दिया।”'
    failure:
      en: 'The fire stays quiet. “They said”: {{ऊचुः}}.'
      hi: 'अलाव शान्त रहता है। ‘उन्होंने कहा’: {{ऊचुः}}।'

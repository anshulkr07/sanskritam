cards:
- id: s1
  kind: story
  title:
    en: The fifth night
    hi: पाँचवीं रात
  depth: core
  image:
    brief: 'The burning-ground grove at night: a small spirit shaped like a rolled-up storybook with stubby legs and a bright
      storyteller''s turban drumming on its own spine with two fingers; the Vetāla seated on a root in a dramatic storytelling
      pose; you, Dādī and Śuka around a small fire.'
    alt:
      en: A rolled-up storybook spirit in a turban drums on its own spine while the Vetāla tells a tale
      hi: पगड़ी वाला लपेटी पोथी-सा भूत अपनी रीढ़ पर ताल देता, कथा सुनाता वेताल
    cast:
    - you
    - dadi
    - shuka
    - vetala
    - kathaka
    place: smashana
    ratio: '4:3'
    id: lit-double-s1
  narration:
    en: 'Tonight the Vetāla speaks differently. “‘Went’, ‘was’: those are for what you saw,” he says. “For what the old poets
      tell, the root doubles, like a drum: बभूव, जगाम, चकार.” A spirit shaped like a rolled-up storybook, in a storyteller''s
      turban, drums on his own spine. Dādī: “This is the voice of the epics: the past of what the teller did not see.”'
    hi: 'आज वेताल अलग ढंग से बोलता है। “‘गया’, ‘था’: ये उसके लिए हैं जो तुमने देखा,” वह कहता है। “पुराने कवि जो सुनाते हैं,
      उसके लिए धातु दुगुनी हो जाती है, ढोल की तरह: बभूव, जगाम, चकार।” लपेटी हुई कथा-पोथी जैसा एक नन्हा भूत, कथावाचक की पगड़ी
      में, ताल देने को अपनी ही रीढ़ पर बजाता है। दादी: “यह महाकाव्यों की वाणी है: उसका भूतकाल जो कहने वाले ने नहीं देखा।”'
  lines:
  - speaker: dadi
    sa: बभूव। जगाम। चकार।
    gloss:
      en: He became. He went. He did.
      hi: वह हुआ। वह गया। उसने किया।
  quote:
    sa: आदित्यवर्मनामात्र बभूव नृपतिः पुरा
    gloss:
      en: Here, long ago, there was a king named Ādityavarman.
      hi: यहाँ, बहुत पहले, आदित्यवर्मा नाम का एक राजा हुआ।
    source: Kathāsaritsāgara 1.5 (read in the Digital Corpus of Sanskrit)
- id: t1
  kind: teach
  title:
    en: The story past
    hi: कथा का भूतकाल
  depth: core
  skills:
  - verb.lit
  body:
    en: '{{लिट्}} is the past of old tales and epics, for what the teller did not see. The beginning of the root is doubled:
      {{भू}} gives {{बभूव}} (he became), {{गम्}} gives {{जगाम}} (he went), {{कृ}} gives {{चकार}} (he did), {{पठ्}} gives {{पपाठ}}
      (he read).'
    hi: '{{लिट्}} पुरानी कथाओं और महाकाव्यों का भूतकाल है, उसका जो कहने वाले ने नहीं देखा। धातु का आरम्भ दुगुना हो जाता है:
      {{भू}} से {{बभूव}} (वह हुआ), {{गम्}} से {{जगाम}} (वह गया), {{कृ}} से {{चकार}} (उसने किया), {{पठ्}} से {{पपाठ}} (उसने
      पढ़ा)।'
  examples:

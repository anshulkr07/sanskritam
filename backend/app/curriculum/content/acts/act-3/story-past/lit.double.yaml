        vacana: Eka
    - sa: पुस्तकम्
      gloss:
        en: book
        hi: पुस्तक
      check:
        type: subanta
        stem: पुस्तक
        linga: Napumsaka
        vibhakti: Dvitiya
        vacana: Eka

    hi: '{{बभूवुः}}: वे, अनेक।'
  roman: after
  gate: true
  story:
    success:
      en: '“बभूवुः,” you say, and the storybook spirit''s turban tilts. All round the fire the air fills with the soft thud of a drum no one is playing: ब-भूवुः, ब-भूवुः. “That is the beat,” he whispers. “Old poets keep it so the tale can walk.”'
      hi: '“बभूवुः,” आप कहते हैं, और पोथी-भूत की पगड़ी टेढ़ी हो जाती है। अलाव के चारों ओर हवा में एक ढोल की मद्धम थाप भर जाती है जिसे कोई नहीं बजा रहा: ब-भूवुः, ब-भूवुः। “यही ताल है,” वह फुसफुसाता है। “पुराने कवि इसे इसलिए रखते हैं कि कथा चल सके।”'
    failure:
      en: 'The drum stays silent. “They became”: {{बभूवुः}}.'
      hi: 'ढोल चुप रहता है। ‘वे हुए’: {{बभूवुः}}।'
  options:
  - sa: बभूव
  - sa: बभूवतुः
  - correct: true
    sa: बभूवुः
- id: pn
  kind: teach
  title:
    en: Pāṇini's doubling
    hi: पाणिनि का द्वित्व
  depth: panini
  skills:
  - verb.lit
  sutras:
  - 3.2.115
  - 6.1.8
  - 6.1.1
  - 7.4.62
  body:
    en: 'Sūtra 3.2.115, {{परोक्षे लिट्}}, gives {{लिट्}} for the unseen past. 6.1.8, {{लिटि धातोरनभ्यासस्य}}, and 6.1.1, {{एकाचो द्वे प्रथमस्य}}, double the root. 7.4.62, {{कुहोश्चुः}}, turns a guttural in the doubled part into a palatal: {{ग}} becomes {{ज}}, giving {{जगाम}}.'
    hi: 'सूत्र 3.2.115, {{परोक्षे लिट्}}, अदृष्ट भूत के लिए {{लिट्}} देता है। 6.1.8, {{लिटि धातोरनभ्यासस्य}}, और 6.1.1, {{एकाचो द्वे प्रथमस्य}}, धातु को दुगुना करते हैं। 7.4.62, {{कुहोश्चुः}}, द्वित्व वाले भाग में कण्ठ्य को तालव्य कर देता है: {{ग}} {{ज}} बनता है, और {{जगाम}} बनता है।'

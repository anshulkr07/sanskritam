  depth: core
  points:
  - sa: बभूव · जगाम · चकार
    text:
      en: He became, he went, he did.
      hi: वह हुआ, वह गया, उसने किया।
  - sa: द्वित्व
    text:
      en: The start of the root is doubled.
      hi: धातु का आरम्भ दुगुना होता है।
  - sa: बभूवुः
    text:
      en: They became.
      hi: वे हुए।

- id: pn
  kind: teach
  title:
    en: Pāṇini's doubling
    hi: पाणिनि का द्वित्व
  depth: panini
  skills:
  - verb.lit
  sutras:
  - 3.2.115
  - 6.1.8
  - 6.1.1
  - 7.4.62
  body:
    en: 'Sūtra 3.2.115, {{परोक्षे लिट्}}, gives {{लिट्}} for the unseen past. 6.1.8, {{लिटि धातोरनभ्यासस्य}}, and 6.1.1, {{एकाचो
      द्वे प्रथमस्य}}, double the root. 7.4.62, {{कुहोश्चुः}}, turns a guttural in the doubled part into a palatal: {{ग}}
      becomes {{ज}}, giving {{जगाम}}.'
    hi: 'सूत्र 3.2.115, {{परोक्षे लिट्}}, अदृष्ट भूत के लिए {{लिट्}} देता है। 6.1.8, {{लिटि धातोरनभ्यासस्य}}, और 6.1.1, {{एकाचो
      द्वे प्रथमस्य}}, धातु को दुगुना करते हैं। 7.4.62, {{कुहोश्चुः}}, द्वित्व वाले भाग में कण्ठ्य को तालव्य कर देता है: {{ग}}
      {{ज}} बनता है, और {{जगाम}} बनता है।'
  visuals:
  - id: v-source-terms
    kind: comparison
    title:
      en: Read the forms in the explanation

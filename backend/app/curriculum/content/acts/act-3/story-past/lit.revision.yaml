- id: panini
  kind: revision
  title:
    en: In Pāṇini's words
    hi: पाणिनि के शब्दों में
  depth: panini
  section: panini
  rows:
  - skill: verb.lit
    rule:
      en: '{{परोक्षे लिट्}}, {{लिटि धातोरनभ्यासस्य}}, {{एकाचो द्वे प्रथमस्य}} and {{कुहोश्चुः}}: the tense, the doubling and
        the {{ग}} → {{ज}}.'
      hi: '{{परोक्षे लिट्}}, {{लिटि धातोरनभ्यासस्य}}, {{एकाचो द्वे प्रथमस्य}} और {{कुहोश्चुः}}: काल, द्वित्व और {{ग}} → {{ज}}।'
    sutras:
    - 3.2.115
    - 6.1.8
    - 6.1.1
    - 7.4.62
    tag: core
    taught_in: lit.double#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 3.2.115, {{परोक्षे लिट्}}, gives {{लिट्}} for the unseen past. 6.1.8, {{लिटि धातोरनभ्यासस्य}}, and 6.1.1,
          {{एकाचो द्वे प्रथमस्य}}, double the root. 7.4.62, {{कुहोश्चुः}}, turns a guttural in the doubled part into a palatal:
          {{ग}} becomes {{ज}}, giving {{जगाम}}.'
        hi: 'सूत्र 3.2.115, {{परोक्षे लिट्}}, अदृष्ट भूत के लिए {{लिट्}} देता है। 6.1.8, {{लिटि धातोरनभ्यासस्य}}, और 6.1.1,
          {{एकाचो द्वे प्रथमस्य}}, धातु को दुगुना करते हैं। 7.4.62, {{कुहोश्चुः}}, द्वित्व वाले भाग में कण्ठ्य को तालव्य कर
          देता है: {{ग}} {{ज}} बनता है, और {{जगाम}} बनता है।'
      items:
      - id: i0
        sa: परोक्षे लिट्
      - id: i1
        sa: लिट्
      - id: i2
        sa: लिटि धातोरनभ्यासस्य
      - id: i3
        sa: एकाचो द्वे प्रथमस्य
      - id: i4
        sa: कुहोश्चुः
      - id: i5
        sa: ग
      - id: i6
        sa: ज
      - id: i7
        sa: जगाम

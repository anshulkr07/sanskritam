        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Compare: {{अवदत्}} is “he said” for something you know; {{उवाच}} is “he said” as the old teller narrates. In
          everyday Sanskrit you will find both; the epics prefer {{उवाच}}.'

- id: conditions
  kind: revision
  title:
    en: When to use which
    hi: कब कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: verb.lit
    rule:
      en: 'Use {{लिट्}} when a teller narrates what he did not see: epics, tales, old histories.'
      hi: 'जब कथावाचक वह सुनाता है जो उसने नहीं देखा, तब {{लिट्}}: महाकाव्य, कथाएँ, पुराने इतिहास।'
    tag: good
    taught_in: lit.double#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: See the meaning; read the form
        hi: अर्थ देखें, रूप पढ़ें
      explanation:
        en: Compare the pictures with the live Sanskrit captions.
        hi: चित्रों की तुलना संस्कृत के रूपों से करें।
      items:
      - id: i2
        sa: बालकः पुस्तकम् पपाठ।
        meaning:
          en: The boy read the book.
          hi: बालक ने पुस्तक पढ़ी।
        words:
        - sa: बालकः
          gloss:
            en: boy
            hi: बालक
          check:
            type: subanta
            stem: बालक
            linga: Pum
            vibhakti: Prathama
            vacana: Eka
        - sa: पुस्तकम्
          gloss:
            en: book
            hi: पुस्तक
          check:
            type: subanta
            stem: पुस्तक
            linga: Napumsaka
            vibhakti: Dvitiya
            vacana: Eka
        - sa: पपाठ
          gloss:
            en: read
            hi: पढ़ी
          check:
            type: tinanta
            dhatu: पठ्
            lakara: Lit
            purusha: Prathama
            vacana: Eka
        image:
          id: teaching-reader-one
          brief: 'Edit target: the supplied Sanskrit teaching illustration. Preserve the exact number of boys, their faces,
            clothing, books, furniture, watercolor style, composition and 4:3 aspect ratio. Change ONLY the writing on ALL
            open books. Remove every tiny line, squiggle, fake letter and text-like mark. On each open book write the SAME
            SINGLE SHORT LINE in very large, clean, exact Devanagari: "अ इ उ". These are exactly three characters अ, इ, उ,
            separated by spaces. Put this line prominently on one page of every book; every other page area must be clean
            unmarked ivory paper. No other letters anywhere. Do not invent text. The three characters must be legible at phone
            size. Keep the exact number of human figures unchanged.'
          alt:
            en: One boy reading a book with अ इ उ
            hi: अ इ उ वाली पुस्तक पढ़ता एक बालक
          ratio: '4:3'
          text_in_image:
          - अ इ उ
  - skill: verb.lit
    rule:
      en: Use {{लङ्}} for what you know yourself.
      hi: जो आप स्वयं जानते हैं, उसके लिए {{लङ्}}।
    tag: good
    taught_in: lit.said#t2
    visuals:
    - id: v-linked-1
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Compare: {{अवदत्}} is “he said” for something you know; {{उवाच}} is “he said” as the old teller narrates. In
          everyday Sanskrit you will find both; the epics prefer {{उवाच}}.'
        hi: 'तुलना कीजिए: {{अवदत्}} उसके लिए ‘उसने कहा’ है जो आप जानते हैं; {{उवाच}} पुराने कथावाचक का ‘उसने कहा’ है। रोज़
          की संस्कृत में दोनों मिलेंगे; महाकाव्य {{उवाच}} पसन्द करते हैं।'
      items:
      - id: i0
        sa: अवदत्
      - id: i1
        sa: उवाच

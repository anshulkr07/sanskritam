      items:
      - id: taught
        sa: लँट्
        label:
          en: The taught technical form
          hi: उपदेश का तकनीकी रूप
      - id: marker
        sa: अँ + ट्
        label:
          en: The marker elements in this example
          hi: इस उदाहरण के इत् तत्व
      - id: result
        sa: ल्
        compare_from: लँट्
        label:
          en: What remains after marker deletion
          hi: इत्-लोप के बाद शेष रूप
      explanation:
        en: These are technical examples. A sound is not deleted merely because the same letter occurs in an ordinary word.
        hi: ये तकनीकी उदाहरण हैं। सामान्य शब्द में वही अक्षर दिख जाने से उसका लोप नहीं किया जाता।
- id: exceptions
  kind: revision
  title:
    en: Odd cases
    hi: विचित्र स्थितियाँ
  depth: core
  section: exceptions
  rows:
  - skill: panini.it
    rule:
      en: 'Initial markers: {{ष्}}, the palatals and retroflexes, and (outside taddhitas) {{ल्}} {{श्}} and the velars, of
        a suffix.'
      hi: 'आदि के संकेत: {{ष्}}, तालव्य और मूर्धन्य, और (तद्धित से बाहर) प्रत्यय के {{ल्}} {{श्}} और कवर्ग।'
    sutras:
    - 1.3.6
    - 1.3.7
    - 1.3.8
    tag: rare
    taught_in: pg.it#pn
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Other sūtras name markers at the start of a suffix: 1.3.6 {{षः प्रत्ययस्य}}, an initial {{ष्}}; 1.3.7 {{चुटू}},
          an initial palatal or retroflex stop; 1.3.8 {{लशक्वतद्धिते}}, an initial {{ल्}}, {{श्}} or velar of a suffix that
          is not a taddhita.'
        hi: 'अन्य सूत्र प्रत्यय के आरम्भ के संकेत बताते हैं: 1.3.6 {{षः प्रत्ययस्य}}, आदि का {{ष्}}; 1.3.7 {{चुटू}}, आदि का
          तालव्य या मूर्धन्य स्पर्श; 1.3.8 {{लशक्वतद्धिते}}, तद्धित से भिन्न प्रत्यय के आदि का {{ल्}}, {{श्}} या कवर्ग।'
      items:
      - id: i0
        sa: षः प्रत्ययस्य
      - id: i1
        sa: ष्
      - id: i2
        sa: चुटू
      - id: i3
        sa: लशक्वतद्धिते
      - id: i4
        sa: ल्
      - id: i5
        sa: श्
- id: mistakes
  kind: revision
  title:
    en: Common mistakes
    hi: आम भूलें
  depth: core
  section: mistakes
  rows:
  - skill: panini.shiva-sutras
    rule:
      en: 'Do not count the marker as a sound of the name: {{अच्}} has nine sounds, not ten.'
      hi: 'संकेत को नाम की ध्वनि मत गिनिए: {{अच्}} में नौ ध्वनियाँ हैं, दस नहीं।'
    tag: core
    taught_in: pg.shiva#p1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Compare with a taught example
        hi: सीखे हुए उदाहरण से तुलना करें
      explanation:
        en: 'Pāṇini needs short names for groups of sounds. Take a letter and a later marker: the name stands for that letter
          and every sound between them, markers left out. So {{अच्}}, from अ to च्, is all the vowels; {{हल्}}, from ह to
          ल्, is all the consonants.'
        hi: 'पाणिनि को ध्वनि-समूहों के छोटे नाम चाहिए। एक अक्षर और उसके बाद का एक संकेत लीजिए: नाम उस अक्षर और बीच की हर ध्वनि
          का है, संकेत छोड़कर। इसलिए {{अच्}}, अ से च् तक, सब स्वर है; {{हल्}}, ह से ल् तक, सब व्यञ्जन है।'
      items:
      - id: i0
        sa: अच्
      - id: i1
        sa: हल्
  - skill: panini.prakriya
    rule:
      en: 'Do not apply a later rule first: the order of the build decides the word.'
      hi: 'बाद का नियम पहले लागू मत कीजिए: निर्माण का क्रम शब्द तय करता है।'

  - skill: panini.prakriya
    rule:
      en: '{{पूर्वत्रासिद्धम्}}: the last three quarters wait.'
      hi: '{{पूर्वत्रासिद्धम्}}: अन्तिम तीन पाद प्रतीक्षा करते हैं।'
    sutras:
    - 8.2.1
    tag: core
    taught_in: pg.prakriya#pn
    visuals:
    - id: v-linked-2
      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: Sūtra 8.2.1, {{पूर्वत्रासिद्धम्}}, opens the last three quarters of the Aṣṭādhyāyī. From there, each rule counts
          as not yet applied when an earlier rule looks at the word, and when a rule before it in that part does. So the sound
          changes there wait until the end, and the order of the rules decides the word.
        hi: सूत्र 8.2.1, {{पूर्वत्रासिद्धम्}}, अष्टाध्यायी के अन्तिम तीन पादों को खोलता है। वहाँ से हर नियम पहले के नियम के
          लिए, और उस भाग में अपने से पहले के नियम के लिए, अभी लागू नहीं माना जाता। इसलिए वहाँ के ध्वनि-परिवर्तन अन्त तक रुके
          रहते हैं, और नियमों का क्रम शब्द तय करता है।
      items:
      - id: i0
        sa: पूर्वत्रासिद्धम्

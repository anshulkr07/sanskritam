      kind: comparison
      title:
        en: Read the forms in the explanation
        hi: व्याख्या के रूप पढ़ें
      explanation:
        en: 'Sūtra 1.1.71, {{आदिरन्त्येन सहेता}}, makes these names: a first letter, together with the last marker, stands
          for itself and the letters between. And 1.1.69, which you met with the vowels, lets each letter stand for its twins
          as well.'
        hi: 'सूत्र 1.1.71, {{आदिरन्त्येन सहेता}}, ये नाम बनाता है: पहला अक्षर, अन्तिम संकेत के साथ, अपना और बीच के अक्षरों
          का बोध कराता है। और 1.1.69, जो आप स्वरों के साथ मिल चुके हैं, हर अक्षर को उसके जुड़वाँ रूपों का भी बोधक बनाता है।'
      items:

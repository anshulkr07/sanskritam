- id: p4
  kind: practice
  title:
    en: The seal
    hi: मुहर
  depth: core
  skills:
  - panini.it
  mode: choice
  prompt:
    en: What remains of {{शप्}} when its markers have gone?
    hi: '{{शप्}} के संकेत चले जाने पर क्या बचता है?'
  explain:
    en: '{{श्}} (1.3.8) and {{प्}} (1.3.3) go: {{अ}} stays.'
    hi: '{{श्}} (1.3.8) और {{प्}} (1.3.3) जाते हैं: {{अ}} रहता है।'
  roman: after
  gate: true
  story:
    success:
      en: “अ,” you say. “What is left of शप् is only अ.” The seal on the second alcove goes clear, as if a mist had cleared from a window, and Lubdhaka's hand, which had been resting on it, finds nothing under it and falls to his side. Padikā is now three quarters. She turns to him, not unkindly. “You laid your hand on the marker,” she says. “The marker was never the thing.”
      hi: “अ,” आप कहते हैं। “शप् का जो बचता है, वह केवल अ है।” दूसरे आले की मुहर साफ़ हो जाती है, जैसे खिड़की से धुँध हट गई हो, और लुब्धक का हाथ, जो उस पर टिका था, उसके नीचे कुछ नहीं पाता और बगल में गिर जाता है। पदिका अब तीन चौथाई है। वह उसकी ओर मुड़ती है, कठोरता से नहीं। “आपने संकेत पर हाथ रखा,” वह कहती है। “संकेत कभी असली वस्तु नहीं था।”
    failure:
      en: The seal stays shut. Both markers go; {{अ}} stays.
      hi: मुहर बन्द रहती है। दोनों संकेत जाते हैं; {{अ}} रहता है।
  options:
  - sa: श्
  - correct: true
    sa: अ
  - sa: प्
- id: pn
  kind: teach
  title:
    en: More markers
    hi: और संकेत
  depth: panini
  skills:
  - panini.it
  sutras:
  - 1.3.6
  - 1.3.7
  - 1.3.8
  body:
    en: 'Other sūtras name markers at the start of a suffix: 1.3.6 {{षः प्रत्ययस्य}}, an initial {{ष्}}; 1.3.7 {{चुटू}}, an initial palatal or retroflex stop; 1.3.8 {{लशक्वतद्धिते}}, an initial {{ल्}}, {{श्}} or velar of a suffix that is not a taddhita.'
    hi: 'अन्य सूत्र प्रत्यय के आरम्भ के संकेत बताते हैं: 1.3.6 {{षः प्रत्ययस्य}}, आदि का {{ष्}}; 1.3.7 {{चुटू}}, आदि का तालव्य या मूर्धन्य स्पर्श; 1.3.8 {{लशक्वतद्धिते}}, तद्धित से भिन्न प्रत्यय के आदि का {{ल्}}, {{श्}} या कवर्ग।'

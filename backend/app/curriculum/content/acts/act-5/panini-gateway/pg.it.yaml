- id: s1
  kind: story
  title:
    en: The seal
    hi: मुहर
  depth: core
  image:
    brief: A dark second alcove with a round stone seal cut with a single word and small marks; Dādī pointing at the word; the quarter-visible silver spirit leaning forward; Śuka on her shoulder; Lubdhaka behind with a hand resting on the seal, face calm and unreadable.
    alt:
      en: A round seal with a word and small marks, a spirit leaning forward, a man's hand on the seal
      hi: शब्द और छोटे चिह्नों वाली गोल मुहर, आगे झुकती भूत, मुहर पर टिका एक हाथ
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - padika
    place: guha
    ratio: '4:3'
    id: pg-it-s1
  narration:
    en: 'The second alcove is dark, and its seal is cut with the word लँट्, the present tense. Dādī points. “Look at the marks: a nasal sign on the vowel, a ट् at the end. In Pāṇini''s rules they are tools: they tell a rule what to do, then vanish.” Padikā leans forward. “And what is left?” Behind you, Lubdhaka has put a hand on the seal.'
    hi: 'दूसरा आला अँधेरा है, और उसकी मुहर पर शब्द लँट् खुदा है, वर्तमान काल का नाम। दादी इशारा करती हैं। “चिह्नों को देखिए। स्वर पर अनुनासिक चिह्न; अन्त में ट्। पाणिनि के सूत्रों में वे औज़ार हैं: वे सूत्र को बताते हैं कि क्या करना है, और फिर लुप्त हो जाते हैं।” पदिका आगे झुकती है। “और बचता क्या है?” आपके पीछे लुब्धक ने मुहर पर हाथ रख दिया है।'
  quote:
    sa: उपदेशे ऽजनुनासिक इत् हलन्त्यम् तस्य लोपः
    gloss:
      en: In the original teaching, a nasalised vowel is a marker; so is a final consonant; and the marker is dropped.
      hi: मूल उपदेश में अनुनासिक स्वर इत् है; अन्तिम व्यञ्जन भी; और इत् का लोप होता है।
    source: Aṣṭādhyāyī 1.3.2, 1.3.3 and 1.3.9 (sūtra text from vidyut-prakriya data)
- id: t1
  kind: teach
  title:
    en: Markers
    hi: इत् संकेत
  depth: core
  skills:
  - panini.it
  body:
    en: 'A marker ({{इत्}}) is a sound that tells a rule what to do and then goes. 1.3.2: a nasalised vowel in the original teaching is one. 1.3.3: so is a last consonant. 1.3.9 drops it ({{लोपः}}). So {{तिप्}} becomes {{ति}}, and {{लँट्}} becomes {{ल्}}.'
    hi: 'इत् वह ध्वनि है जो सूत्र को बताती है कि क्या करना है, और फिर चली जाती है। 1.3.2: मूल उपदेश में अनुनासिक स्वर इत् है। 1.3.3: अन्तिम व्यञ्जन भी। 1.3.9 उसे हटाता है ({{लोपः}})। इसलिए {{तिप्}} से {{ति}} और {{लँट्}} से {{ल्}} बनता है।'
  term:
    sa: इत्
    meaning:
      en: a marker sound that is later dropped
      hi: संकेत-ध्वनि जो बाद में हटा दी जाती है

- id: p8
  kind: practice
  depth: core
  skills:
  - panini.prakriya
  mode: order
  prompt:
    en: Put the stages of the build in order.
    hi: निर्माण के चरणों को क्रम में रखिए।
  explain:
    en: Root, tense, ending, joining {{अ}}, strengthening, {{ओ}} → {{अव्}}.
    hi: धातु, काल, प्रत्यय, जोड़ने वाला {{अ}}, गुण, {{ओ}} → {{अव्}}।
  roman: after
  gate: true
  story:
    success:
      en: '“भवति,” you say, in the voice of one who has laid every stone, and the last alcove opens. Padikā steps into it,
        whole now, all four quarters of her, and turns. On the rim of the arch the line of the seers has risen in the stone:
        एकं सद् विप्रा बहुधा वदन्ति (Ṛgveda 1.164.46). “What is, is one,” she says. “The wise speak of it in many ways.” Inside
        the alcove there is no leaf. There is a lamp, and the sound of your own voice, which the cave has kept. Lubdhaka stands
        at the arch with his satchel in his hand. He looks at the lamp for a long time. Then he sets the satchel down on the
        floor, and sits, and says to Dādī, quietly: “Teach me the first line.”'
      hi: '“भवति,” आप कहते हैं, उस की आवाज़ में जिसने हर पत्थर बिछाया है, और अन्तिम आला खुल जाता है। पदिका उसमें प्रवेश करती
        है, अब पूरी, अपने चारों चरणों के साथ, और मुड़ती है। मेहराब के किनारे पर द्रष्टाओं की पंक्ति पत्थर में उभर आई है: एकं
        सद् विप्रा बहुधा वदन्ति (ऋग्वेद 1.164.46)। “जो है, वह एक है,” वह कहती है। “ज्ञानी उसे अनेक प्रकार से कहते हैं।” आले
        के भीतर कोई पत्र नहीं है। एक दीपक है, और आपकी अपनी आवाज़ की गूँज, जिसे गुफा ने सँजो रखा है। लुब्धक मेहराब पर अपना
        झोला हाथ में लिए खड़ा है। वह देर तक दीपक को देखता है। फिर वह झोला फर्श पर रख देता है, और बैठ जाता है, और दादी से धीरे
        से कहता है: “मुझे पहली पंक्ति सिखाइए।”'
    failure:
      en: 'The stones stay dark. The order is: root, tense, ending, joining {{अ}}, strengthening, {{ओ}} → {{अव्}}.'
      hi: 'पत्थर अँधेरे रहते हैं। क्रम है: धातु, काल, प्रत्यय, जोड़ने वाला {{अ}}, गुण, {{ओ}} → {{अव्}}।'

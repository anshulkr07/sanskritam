  mode: choice
  prompt:
    en: Which name stands for all the vowels?
    hi: कौन-सा नाम सब स्वरों का है?
  explain:
    en: From अ to the marker च्.
    hi: अ से संकेत च् तक।
  roman: after
  options:
  - sa: हल्
  - correct: true
    sa: अच्
  - sa: यण्
  feedback_visuals:
  - id: v-source-feedback
    kind: comparison
    title:
      en: Compare with a taught example
      hi: सीखे हुए उदाहरण से तुलना करें
    explanation:
      en: 'Pāṇini needs short names for groups of sounds. Take a letter and a later marker: the name stands for that letter
        and every sound between them, markers left out. So {{अच्}}, from अ to च्, is all the vowels; {{हल्}}, from ह to ल्,
        is all the consonants.'
      hi: 'पाणिनि को ध्वनि-समूहों के छोटे नाम चाहिए। एक अक्षर और उसके बाद का एक संकेत लीजिए: नाम उस अक्षर और बीच की हर ध्वनि
        का है, संकेत छोड़कर। इसलिए {{अच्}}, अ से च् तक, सब स्वर है; {{हल्}}, ह से ल् तक, सब व्यञ्जन है।'
    items:
    - id: i0
      sa: अच्
    - id: i1
      sa: हल्

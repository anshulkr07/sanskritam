title:
  en: Pāṇini's grammar
  hi: पाणिनि का व्याकरण
title_sa: पाणिनीयम्
status: ready
episode:
  summary:
    en: Three quarters of speech lie hidden (Ṛgveda 1.164.45). The last alcove opens only for one who can build a word the way Pāṇini does. Lubdhaka wants the power; you choose understanding.
    hi: वाणी के तीन चरण छिपे हैं (ऋग्वेद 1.164.45)। अंतिम आला केवल उसके लिए खुलता है जो पाणिनि की तरह शब्द बना सके। लुब्धक शक्ति चाहता है; आप समझ चुनते हैं।
  beats:
  - The Śiva sūtras and pratyāhāras.
  - 'How a sūtra works: it, saṃjñā, vidhi.'
  - Build a word step by step; the alcove opens on एकं सद्विप्रा बहुधा वदन्ति (Ṛgveda 1.164.46).

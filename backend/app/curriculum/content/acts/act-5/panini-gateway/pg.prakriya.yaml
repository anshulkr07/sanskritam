- id: p4
  kind: practice
  title:
    en: The wall
    hi: दीवार
  depth: core
  skills:
  - panini.prakriya
  mode: order
  prompt:
    en: Put the stages of the build in order.
    hi: निर्माण के चरणों को क्रम में रखिए।
  explain:
    en: Root, tense, ending, joining {{अ}}, strengthening, {{ओ}} → {{अव्}}.
    hi: धातु, काल, प्रत्यय, जोड़ने वाला {{अ}}, गुण, {{ओ}} → {{अव्}}।
  roman: after
  gate: true
  story:
    success:
      en: “भू, भू + ल्, भू + ति,” you say, laying them down in order, and the flat stones along the floor light, one after
        another, as you name them, until the sixth, भव् + अ + ति, and the seventh, भवति. Lubdhaka, who has been building his
        own row beside yours, quicker, with stones from the wrong end, finds his wall will not stand. He looks at it. Padikā
        is whole. “The road has an order,” she says. “One cannot start at the top of the wall.”
      hi: “भू, भू + ल्, भू + ति,” आप उन्हें क्रम में बिछाते हुए कहते हैं, और फर्श के चपटे पत्थर एक-एक कर चमकते हैं जैसे आप
        उनके नाम लेते हैं, छठे, भव् + अ + ति, और सातवें, भवति, तक। लुब्धक, जो अपनी अलग कतार तेज़ी से बना रहा था, गलत सिरे
        के पत्थरों से, देखता है कि उसकी दीवार खड़ी नहीं होती। वह उसे देखता है। पदिका पूरी हो गई है। “मार्ग का एक क्रम है,”
        वह कहती है। “दीवार को ऊपर से शुरू नहीं किया जा सकता।”
    failure:
      en: 'The stones stay dark. The order is: root, tense, ending, joining {{अ}}, strengthening, {{ओ}} → {{अव्}}.'

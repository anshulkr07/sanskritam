- id: s1
  kind: story
  title:
    en: The third alcove
    hi: तीसरा आला
  depth: core
  image:
    brief: The third alcove opened a hand's breadth, with a plain line of script over it; Dādī kneeling and chalking a single
      root-letter on the stone floor, a neat row of seven flat stones laid beside it like the steps of a wall; the silver
      spirit nearly whole, watching; Lubdhaka stepping in from the cave mouth with his satchel; Śuka on the stone row.
    alt:
      en: A woman chalks a root on the floor beside a row of seven laid stones as a man steps in
      hi: फर्श पर धातु लिखती स्त्री और सात बिछे पत्थरों की कतार, भीतर आता आदमी
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - padika
    place: guha
    ratio: '4:3'
    id: pg-prakriya-s1
    text_in_image:
    - भू
  narration:
    en: 'The third alcove opens a hand''s breadth, a plain line cut over it. Padikā is nearly whole. “These are not three
      locks,” says Dādī. “They are one road. Pāṇini builds a word as a mason builds a wall: one stone, one rule, in order.”
      She chalks a root on the floor: भू. Lubdhaka comes in. “Then I shall build it faster,” he says.'
    hi: 'तीसरा आला हाथ भर खुल जाता है, और उसके ऊपर एक सादी पंक्ति खुदी है। पदिका लगभग पूरी हो चुकी है। “ये तीन ताले नहीं हैं,”
      दादी कहती हैं। “ये एक ही मार्ग हैं। पाणिनि शब्द वैसे बनाते हैं जैसे राजमिस्त्री दीवार: एक पत्थर, एक नियम, क्रम से।”
      वे फर्श पर एक धातु लिखती हैं: भू। लुब्धक गुफा के द्वार से भीतर आता है। “तो मैं इसे और जल्दी बनाऊँगा,” वह कहता है।'
  quote:
    sa: भूवादयो धातवः वर्तमाने लट्
    gloss:
      en: Bhū and the others are roots. In the present tense, {{लट्}}.
      hi: भू आदि धातु हैं। वर्तमान काल में लट्।
    source: Aṣṭādhyāyī 1.3.1 and 3.2.123 (sūtra text from vidyut-prakriya data)
- id: t1
  kind: teach
  title:
    en: A word is built
    hi: शब्द बनता है
  depth: core
  skills:
  - panini.prakriya
  sutras:
  - 1.3.1
  - 3.2.123
  - 3.4.78
  - 3.1.68
  - 7.3.84
  - 6.1.78
  body:
    en: 'To make {{भवति}}, Pāṇini starts from the root {{भू}} and adds what each rule asks, one at a time: the tense, the
      ending for “he”, the joining {{अ}}. The markers drop away. Then two sound changes. Each step has its sūtra number, and
      the steps run in order.'
    hi: '{{भवति}} बनाने के लिए पाणिनि धातु {{भू}} से आरम्भ करते हैं और हर नियम जो माँगता है उसे एक-एक करके जोड़ते हैं: काल,
      ‘वह’ का प्रत्यय, जोड़ने वाला {{अ}}। संकेत हटते जाते हैं। फिर दो ध्वनि-परिवर्तन। हर चरण का अपना सूत्र-क्रमांक है, और
      चरण क्रम से चलते हैं।'
  steps:
  - sa: भू
    label:
      en: the root (1.3.1)
      hi: धातु (1.3.1)
  - sa: भू + ल्
    label:
      en: 'the tense: present (3.2.123)'
      hi: 'काल: वर्तमान (3.2.123)'
  - sa: भू + ति
    label:
      en: the ending for “he” (3.4.78)
      hi: ‘वह’ का प्रत्यय (3.4.78)
  - sa: भू + अ + ति
    label:
      en: the joining {{अ}} (3.1.68)
      hi: जोड़ने वाला {{अ}} (3.1.68)
  - sa: भो + अ + ति
    label:
      en: strengthening (7.3.84)
      hi: गुण (7.3.84)
  - sa: भव् + अ + ति
    label:
      en: '{{ओ}} before {{अ}} becomes {{अव्}} (6.1.78)'
      hi: '{{अ}} से पहले {{ओ}} का {{अव्}} (6.1.78)'
  - sa: भवति
    label:
      en: the word
      hi: शब्द

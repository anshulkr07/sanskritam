- id: p4
  kind: practice
  title:
    en: The first line
    hi: पहली पंक्ति
  depth: core
  skills:
  - panini.shiva-sutras
  mode: choice
  prompt:
    en: Which name stands for {{अ इ उ ऋ ऌ}}?
    hi: कौन-सा नाम {{अ इ उ ऋ ऌ}} का है?
  explain:
    en: 'From अ to the marker क् of the second line: {{अक्}}.'
    hi: 'अ से दूसरी पंक्ति के संकेत क् तक: {{अक्}}।'
  roman: after
  gate: true
  story:
    success:
      en: '“अक्,” you say, and the first line of the carving, अइउण्, brightens, and then the second, and the third, line after line, like a row of lamps taken from one flame. Padikā, who has been a crescent, grows to a half. “Every sound has its place,” she says, “and a short name in the order.” At the cave mouth, Lubdhaka says: “Faster.”'
      hi: '“अक्,” आप कहते हैं, और खुदी पंक्तियों की पहली, अइउण्, चमक उठती है, फिर दूसरी, फिर तीसरी, पंक्ति पर पंक्ति, जैसे एक ही लौ से जलाए दीपों की कतार। पदिका, जो अब तक अर्धचन्द्र थी, आधी हो जाती है। “हर ध्वनि का अपना स्थान है,” वह कहती है, “और क्रम में एक छोटा नाम।” गुफा के द्वार पर लुब्धक कहता है: “और तेज़।”'
    failure:
      en: The lines stay dim. {{अक्}} runs from अ to the marker क्.
      hi: पंक्तियाँ मद्धम रहती हैं। {{अक्}} अ से संकेत क् तक जाता है।
  options:
  - sa: अच्
  - correct: true
    sa: अक्
  - sa: इक्
- id: pn
  kind: teach
  title:
    en: Pāṇini's names
    hi: पाणिनि के नाम
  depth: panini
  skills:
  - panini.shiva-sutras
  sutras:
  - 1.1.71
  - 1.1.69
  body:
    en: 'Sūtra 1.1.71, {{आदिरन्त्येन सहेता}}, makes these names: a first letter, together with the last marker, stands for itself and the letters between. And 1.1.69, which you met with the vowels, lets each letter stand for its twins as well.'
    hi: 'सूत्र 1.1.71, {{आदिरन्त्येन सहेता}}, ये नाम बनाता है: पहला अक्षर, अन्तिम संकेत के साथ, अपना और बीच के अक्षरों का बोध कराता है। और 1.1.69, जो आप स्वरों के साथ मिल चुके हैं, हर अक्षर को उसके जुड़वाँ रूपों का भी बोधक बनाता है।'

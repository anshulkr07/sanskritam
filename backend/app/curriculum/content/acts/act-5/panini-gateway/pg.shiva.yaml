- id: t2
  kind: teach
  title:
    en: Two-letter names
    hi: दो अक्षरों के नाम
  depth: core
  skills:
  - panini.shiva-sutras
  body:
    en: 'Pāṇini needs short names for groups of sounds. Take a letter and a later marker: the name stands for that letter and every sound between them, markers left out. So {{अच्}}, from अ to च्, is all the vowels; {{हल्}}, from ह to ल्, is all the consonants.'
    hi: 'पाणिनि को ध्वनि-समूहों के छोटे नाम चाहिए। एक अक्षर और उसके बाद का एक संकेत लीजिए: नाम उस अक्षर और बीच की हर ध्वनि का है, संकेत छोड़कर। इसलिए {{अच्}}, अ से च् तक, सब स्वर है; {{हल्}}, ह से ल् तक, सब व्यञ्जन है।'
  term:
    sa: प्रत्याहारः
    meaning:
      en: a short name for a group of sounds
      hi: ध्वनि-समूह का संक्षिप्त नाम

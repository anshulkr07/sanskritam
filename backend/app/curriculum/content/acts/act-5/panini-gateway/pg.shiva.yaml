- id: s1
  kind: story
  title:
    en: The last alcove
    hi: अन्तिम आला
  depth: core
  image:
    brief: A mountain cave with four alcoves in the far wall, three dark and the last one glowing behind a sealed round stone; fourteen short lines of script carved above it in a neat row; a small silver spirit of whom only a crescent quarter is visible sitting beside the stone; Dādī and Śuka looking up at the carving; Lubdhaka at the cave mouth with one hand raised, commanding.
    alt:
      en: A glowing alcove behind a sealed stone with fourteen short carved lines above it
      hi: बन्द पत्थर के पीछे चमकता आला और उसके ऊपर खुदी चौदह छोटी पंक्तियाँ
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - padika
    place: guha
    ratio: '4:3'
    id: pg-shiva-s1
  narration:
    en: 'The last alcove glows behind a sealed stone, with fourteen short lines of script above it. Beside it sits Padikā, a spirit of whom only a quarter can be seen. “Speech has four quarters,” says Dādī. “Three lie hidden in the cave; people speak the fourth. Pāṇini''s grammar finds the hidden ones, beginning with these lines.” Lubdhaka, at the cave mouth, says: “Open it.”'
    hi: 'अन्तिम आला एक बन्द पत्थर के पीछे चमक रहा है, और उसके ऊपर लिपि की चौदह छोटी पंक्तियाँ हैं। उसके पास पदिका बैठी है, एक भूत जिसका केवल चौथाई भाग दिखता है। “वाणी के चार चरण हैं,” दादी कहती हैं। “तीन गुफा में छिपे हैं; चौथा लोग बोलते हैं। पाणिनि का व्याकरण छिपे हुओं को खोजता है, इन्हीं पंक्तियों से आरम्भ करके।” गुफा के द्वार पर लुब्धक कहता है: “इसे खोलो।”'
  quote:
    sa: चत्वारि वाक् परिमिता पदानि तानि विदुर् ब्राह्मणा ये मनीषिणः गुहा त्रीणि निहिता नेङ्गयन्ति तुरीयं वाचो मनुष्या वदन्ति
    gloss:
      en: Speech has four measured quarters; the wise know them. Three, hidden in the cave, do not stir; the fourth quarter of speech is what people speak.
      hi: वाणी के चार नपे-तुले चरण हैं; ज्ञानी उन्हें जानते हैं। तीन, गुफा में छिपे, हिलते नहीं; वाणी का चौथा चरण मनुष्य बोलते हैं।
    source: Ṛgveda 1.164.45 (read at GRETIL, Aufrecht's edition)
- id: t1
  kind: teach
  title:
    en: Fourteen lines
    hi: चौदह पंक्तियाँ
  depth: core
  skills:
  - panini.shiva-sutras
  body:
    en: 'The Śiva sūtras list every sound of Sanskrit in fourteen short lines; tradition ascribes them to Śiva. Each line ends with a marker, a letter that is not itself a sound: ण् क् ङ् च् ट् ण् म् ञ् ष् श् व् य् र् ल्. They are Pāṇini''s alphabet, arranged so that groups of sounds stand side by side.'
    hi: 'शिवसूत्र संस्कृत की हर ध्वनि को चौदह छोटी पंक्तियों में गिनाते हैं; परम्परा उन्हें शिव से जोड़ती है। हर पंक्ति एक संकेत पर समाप्त होती है, एक ऐसा अक्षर जो स्वयं ध्वनि नहीं है: ण् क् ङ् च् ट् ण् म् ञ् ष् श् व् य् र् ल्। वे पाणिनि की वर्णमाला हैं, इस क्रम में कि ध्वनियों के समूह साथ-साथ आएँ।'

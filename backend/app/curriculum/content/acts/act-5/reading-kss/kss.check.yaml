- id: p8
  kind: practice
  depth: core
  skills:
  - kss.read
  mode: choice
  prompt:
    en: Which work is the naming from?
    hi: नामकरण किस ग्रन्थ से है?
  explain:
    en: Somadeva's Kathāsaritsāgara, book 4.
    hi: सोमदेव का कथासरित्सागर, चतुर्थ लम्बक।
  roman: after
  gate: true
  story:
    success:
      en: '“कथा, महाकथा,” says Kathikā, and her cupped hands, full now, turn slowly over, and the light runs out of them down the wall of the cave and into the carving there, line after line, like water finding its level. She has heard it from the beginning, in the words it was told in. She smiles, and does not fade; she rises and goes to stand at the mouth of the second alcove, and looks in. Over its dark opening, the new line has been cut: गुहा त्रीणि निहिता।'
      hi: '“कथा, महाकथा,” कथिका कहती है, और उसकी अब भरी हुई जुड़ी हथेलियाँ धीरे-धीरे पलटती हैं, और प्रकाश उनसे गुफा की दीवार पर बह जाता है, खुदी पंक्तियों में उतरता हुआ, पंक्ति पर पंक्ति, जैसे पानी अपना तल पाता है। उसने कथा आरम्भ से सुनी है, उन्हीं शब्दों में जिनमें वह कही गई थी। वह मुस्कराती है, और मिटती नहीं; वह उठती है और दूसरे आले के मुख पर जाकर खड़ी होती है, और भीतर देखती है। उसके अँधेरे द्वार के ऊपर नई पंक्ति खुदी है: गुहा त्रीणि निहिता।'
    failure:
      en: Her hands stay empty. The tale is from Somadeva's Kathāsaritsāgara.
      hi: उसके हाथ खाली रहते हैं। कथा सोमदेव के कथासरित्सागर की है।
  options:
  - text:
      en: the Rāmāyaṇa
      hi: रामायण
  - text:
      en: the Hitopadeśa
      hi: हितोपदेश
  - correct: true
    text:
      en: the Kathāsaritsāgara
      hi: कथासरित्सागर

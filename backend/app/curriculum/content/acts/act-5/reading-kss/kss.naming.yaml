- id: s1
  kind: story
  title:
    en: The late listener
    hi: देर से आई श्रोता
  depth: core
  image:
    brief: A mountain cave whose walls are carved with lines of script, lit by small lamps; four alcoves in the far wall, three dark and one glowing; a small amber spirit with cupped hands sitting in the first alcove; Dādī and Śuka at the front; at the cave mouth behind, a tall figure in a dark coat in silhouette.
    alt:
      en: A cave with script-carved walls and four alcoves, a small spirit with cupped hands in the first
      hi: लिपि खुदी दीवारों और चार आलों वाली गुफा, पहले आले में हाथ जोड़े नन्ही भूत
    cast:
    - you
    - dadi
    - shuka
    - lubdhaka
    - kathika
    place: guha
    ratio: '4:3'
    id: kss-naming-s1
  narration:
    en: 'The tunnel opens into a cave whose walls are carved with lines of script. Four alcoves: three dark, one glowing. In the first sits a small spirit, her hands cupped as if to catch water. “Kathikā,” says Dādī. “She came too late, and waited. The seventh leaf is the tale that survived: the life of Naravāhanadatta.” At the cave mouth, a step: Lubdhaka.'
    hi: 'सुरंग एक गुफा में खुलती है जिसकी दीवारों पर लिपि की पंक्तियाँ खुदी हैं। चार आले: तीन अँधेरे, एक चमकता। पहले में एक नन्ही भूत बैठी है, हाथ ऐसे जोड़े मानो पानी थामना हो। “कथिका,” दादी कहती हैं। “वह देर से आई और प्रतीक्षा करती रही। सातवाँ पत्र वह कथा है जो बच गई: नरवाहनदत्त का चरित।” गुफा के द्वार पर एक आहट: लुब्धक।'
  quote:
    sa: तत्रासूत च सा काले कुमारं कान्तदर्शनम् द्यौर् इन्दुम् इव निर्गच्छदच्छामृतमयद्युतिम्
    gloss:
      en: There, in due time, she bore a son lovely to see, like the sky giving forth the moon, whose light was pure nectar.
      hi: वहाँ, समय आने पर, उसने सुन्दर दर्शन वाले पुत्र को जन्म दिया, मानो आकाश चन्द्रमा को निकाल रहा हो, जिसकी कान्ति निर्मल अमृत-सी थी।
    source: Kathāsaritsāgara 4.3 (Digital Corpus of Sanskrit, file KSS, 4, 3)
- id: t1
  kind: teach
  title:
    en: Reading Somadeva
    hi: सोमदेव को पढ़ना
  depth: core
  skills:
  - kss.read
  body:
    en: 'Somadeva writes in śloka, like the epics, but his sentences run long, and a compound can fill a quarter. Word order is free, and “is” is often left out. Use your three steps: split the joins, find the verb or see there is none, then the doer and the rest.'
    hi: 'सोमदेव महाकाव्यों की तरह श्लोक में लिखते हैं, पर उनके वाक्य लम्बे होते हैं, और एक समास पूरा चरण भर सकता है। शब्द-क्रम स्वतन्त्र है, और ‘है’ प्रायः छोड़ दिया जाता है। अपने तीन चरण लीजिए: जोड़ खोलिए, क्रिया खोजिए या देखिए कि नहीं है, फिर कर्ता और शेष।'

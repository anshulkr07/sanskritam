- id: p3
  kind: practice
  depth: core
  skills:
  - kss.read
  mode: choice
  prompt:
    en: The line {{कामदेवावतारोऽयं राजञ्जातस्तवात्मजः}} has no finite verb. What supplies “is”?
    hi: पंक्ति {{कामदेवावतारोऽयं राजञ्जातस्तवात्मजः}} में कोई तिङन्त क्रिया नहीं है। ‘है’ कौन देता है?
  explain:
    en: A sentence can be a subject and what it is, with no “is”.
    hi: वाक्य कर्ता और वह जो है, बिना ‘है’ के, हो सकता है।

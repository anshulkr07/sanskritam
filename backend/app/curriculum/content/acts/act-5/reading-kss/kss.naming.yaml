- id: p4
  kind: practice
  title:
    en: The name
    hi: नाम
  depth: core
  skills:
  - kss.read
  mode: choice
  prompt:
    en: Who is the boy, according to the voice from the sky?
    hi: आकाश की वाणी के अनुसार बालक कौन है?
  explain:
    en: '{{कामदेवावतारः}}: an incarnation of Kāmadeva.'
    hi: '{{कामदेवावतारः}}: कामदेव का अवतार।'
  roman: after
  gate: true
  story:
    success:
      en: “कामदेवावतारः,” you read, and the amber spirit's cupped hands slowly fill with a pale light, like water. “नरवाहनदत्तम्,”
        she whispers. The lamps along the walls flare once. At the mouth of the cave, Lubdhaka, who has been listening, says
        the name too, carefully, as one tries a coin between the teeth. “Naravāhanadatta,” he says. “So that is whose tale
        it is.”
      hi: “कामदेवावतारः,” आप पढ़ते हैं, और अम्बर-रंग की भूत की जुड़ी हथेलियों में पानी की तरह धीरे-धीरे हल्का प्रकाश भरता
        है। “नरवाहनदत्तम्,” वह फुसफुसाती है। दीवारों के दीपक एक बार लपकते हैं। गुफा के द्वार पर लुब्धक, जो सुन रहा था, वही
        नाम सावधानी से दोहराता है, जैसे कोई सिक्के को दाँत से परखता हो। “नरवाहनदत्त,” वह कहता है। “तो यह उसकी कथा है।”
    failure:
      en: The light does not gather. The boy is {{कामदेवावतारः}}.
      hi: प्रकाश नहीं भरता। बालक {{कामदेवावतारः}} है।
  options:
  - correct: true
    text:
      en: an incarnation of Kāmadeva
      hi: कामदेव का अवतार
  - text:
      en: a hunter
      hi: एक व्याध
  - text:
      en: a minister
      hi: एक मन्त्री

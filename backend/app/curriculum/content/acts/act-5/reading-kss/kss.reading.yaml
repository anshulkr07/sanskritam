- id: p1
  kind: practice
  mode: choice
  skills: *id001
  prompt:
    en: Where does the voice announcing the child's identity come from?
    hi: बालक का परिचय देने वाली वाणी कहाँ से आती है?
  explain:
    en: The second sentence identifies the sky as the source of the voice.
    hi: दूसरे वाक्य में वाणी आकाश से आती है।
  options:
  - text:
      en: From the sky
      hi: आकाश से
    correct: true
  - text:
      en: From the forest
      hi: वन से
    why:
      en: The second sentence identifies the sky as the source of the voice.
      hi: दूसरे वाक्य में वाणी आकाश से आती है।

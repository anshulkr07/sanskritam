- id: p2
  kind: practice
  mode: choice
  skills: *id001
  prompt:
    en: What future is announced for the child?
    hi: बालक के किस भविष्य की घोषणा होती है?
  explain:
    en: The voice gives him the name Naravāhanadatta and foretells his rule over the Vidyādhara lords.
    hi: वाणी उसका नाम नरवाहनदत्त बताती है और विद्याधरेन्द्रों पर उसके शासन की भविष्यवाणी करती है।
  options:
  - text:
      en: He will be emperor of the Vidyādhara lords.
      hi: वह विद्याधरेन्द्रों का चक्रवर्ती बनेगा।
    correct: true
  - text:
      en: He will remain unnamed.
      hi: वह बिना नाम का रहेगा।
    why:
      en: The voice gives him the name Naravāhanadatta and foretells his rule over the Vidyādhara lords.
      hi: वाणी उसका नाम नरवाहनदत्त बताती है और विद्याधरेन्द्रों पर उसके शासन की भविष्यवाणी करती है।
- id: end
  kind: summary
  points:
  - text:
      en: You followed a birth, an announcement from the sky, a name and a prophecy in Somadeva's Sanskrit.
      hi: आपने सोमदेव की संस्कृत में जन्म, आकाशवाणी, नामकरण और भविष्यवाणी पढ़ी।

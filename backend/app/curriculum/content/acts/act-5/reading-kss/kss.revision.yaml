  - skill: kss.read
    rule:
      en: 'Do not stop at the first compound: it is the beginning of the sentence, not its end.'
      hi: 'पहले समास पर मत रुकिए: वह वाक्य की शुरुआत है, अन्त नहीं।'
    tag: core
    taught_in: kss.naming#t1

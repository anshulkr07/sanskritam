- id: conditions
  kind: revision
  title:
    en: When to use which
    hi: कब कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: kss.read
    rule:
      en: 'A long compound before the verb is one name or idea: split it, then read the parts.'
      hi: 'क्रिया से पहले लम्बा समास एक नाम या विचार है: उसे खोलिए, फिर अंश पढ़िए।'
    tag: good
    taught_in: kss.naming#t1
- id: exceptions
  kind: revision
  title:
    en: Odd cases
    hi: विचित्र स्थितियाँ
  depth: core
  section: exceptions
  rows:
  - skill: kss.read
    rule:
      en: 'A line with no verb is a subject and what it is: “is” is understood.'
      hi: 'बिना क्रिया की पंक्ति कर्ता और वह जो है: ‘है’ समझा जाता है।'
    tag: rare
    taught_in: kss.naming#p3

- id: conditions
  kind: revision
  title:
    en: When to use which
    hi: कब कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: kss.read
    rule:
      en: 'A long compound before the verb is one name or idea: split it, then read the parts.'
      hi: 'क्रिया से पहले लम्बा समास एक नाम या विचार है: उसे खोलिए, फिर अंश पढ़िए।'
    tag: good
    taught_in: kss.naming#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Reading Somadeva
        hi: सोमदेव को पढ़ना
      items:
      - id: explanation
        meaning:
          en: 'Somadeva writes in śloka, like the epics, but his sentences run long, and a compound can fill a quarter. Word
            order is free, and “is” is often left out. Use your three steps: split the joins, find the verb or see there is
            none, then the doer and the rest.'
          hi: 'सोमदेव महाकाव्यों की तरह श्लोक में लिखते हैं, पर उनके वाक्य लम्बे होते हैं, और एक समास पूरा चरण भर सकता है।
            शब्द-क्रम स्वतन्त्र है, और ‘है’ प्रायः छोड़ दिया जाता है। अपने तीन चरण लीजिए: जोड़ खोलिए, क्रिया खोजिए या देखिए
            कि नहीं है, फिर कर्ता और शेष।'
- id: exceptions
  kind: revision

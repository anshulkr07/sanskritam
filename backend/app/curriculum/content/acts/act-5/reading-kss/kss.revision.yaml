  rows:
  - skill: kss.read
    rule:
      en: Split the joins, find the verb (or see there is none), then the doer, the object and the rest.
      hi: जोड़ खोलिए, क्रिया खोजिए (या देखिए कि नहीं है), फिर कर्ता, कर्म और शेष।
    tag: core
    taught_in: kss.naming#tb1
    visuals:
    - id: v-linked-0
      kind: sequence
      title:
        en: Inside कामदेवावतारः
        hi: कामदेवावतारः के भीतर
      items:
      - id: whole
        sa: कामदेवावतारः
        meaning:
          en: An incarnation of Kāmadeva.
          hi: कामदेव का अवतार।
      - id: members
        sa: कामदेव + अवतारः
        meaning:
          en: Identify the two members before reading the surrounding sentence.
          hi: आसपास का वाक्य पढ़ने से पहले दोनों सदस्य पहचानें।
      - id: join
        sa: कामदेवावतारः
        compare_from: कामदेव अवतारः
        check:
          type: sandhi
          first: कामदेव
          second: अवतारः
          joined: कामदेवावतारः
        meaning:
          en: The adjoining अ vowels merge into आ. Return to the source phrase and its referent.
          hi: पास-पास आए अ मिलकर आ होते हैं। मूल पद और उसके अभिप्राय पर लौटें।
- id: conditions
  kind: revision
  title:
    en: When to use which
    hi: कब कौन-सा
  depth: core
  section: conditions
  rows:
  - skill: kss.read
    rule:
      en: 'A long compound before the verb is one name or idea: split it, then read the parts.'
      hi: 'क्रिया से पहले लम्बा समास एक नाम या विचार है: उसे खोलिए, फिर अंश पढ़िए।'
    tag: good
    taught_in: kss.naming#t1
    visuals:
    - id: v-linked-0
      kind: comparison
      title:
        en: Reading Somadeva
        hi: सोमदेव को पढ़ना
      items:
      - id: explanation
        meaning:
          en: 'Somadeva writes in śloka, like the epics, but his sentences run long, and a compound can fill a quarter. Word
            order is free, and “is” is often left out. Use your three steps: split the joins, find the verb or see there is
            none, then the doer and the rest.'
          hi: 'सोमदेव महाकाव्यों की तरह श्लोक में लिखते हैं, पर उनके वाक्य लम्बे होते हैं, और एक समास पूरा चरण भर सकता है।
            शब्द-क्रम स्वतन्त्र है, और ‘है’ प्रायः छोड़ दिया जाता है। अपने तीन चरण लीजिए: जोड़ खोलिए, क्रिया खोजिए या देखिए
            कि नहीं है, फिर कर्ता और शेष।'

id: tale.leaf-7
template: tale
title:
  en: The tale that survived
  hi: वह कथा जो बच गई
title_sa: नरवाहनदत्तकथा
minutes: 8
review: engine_ok
sources:
- title: Kathāsaritsāgara, taraṅga 4.3 (Digital Corpus of Sanskrit file KSS, 4, 3), the story retold in new, simple sentences with six real lines quoted
  url: https://github.com/OliverHellwig/sanskrit
  licence: CC BY 4.0
  note: 'The plot follows Somadeva''s text: the pregnant queen Vāsavadattā is told in a dream by Śiva to have no fear for her child; the boy is born; a voice from the sky says he is an incarnation of Kāmadeva and names him Naravāhanadatta; flowers fall from the sky, drums sound, there is a great festival, and six ministers'' sons are given to him as companions. The quoted lines are Somadeva''s own words; the rest is new Sanskrit in the present tense. The closing line, ''the leaf shines'', echoes the course''s own prologue.'

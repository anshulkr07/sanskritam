id: tale.leaf-6
template: tale
title:
  en: The book written in blood
  hi: रक्त से लिखी पुस्तक
title_sa: गुणाढ्यकथा
minutes: 8
review: scholar_ok
sources:
- title: Kathāsaritsāgara, taraṅgas 7 and 8 (Digital Corpus of Sanskrit files KSS, 1, 7 and KSS, 1, 8), the story retold in new, simple sentences with eight real half-verses and verses quoted
  url: https://github.com/OliverHellwig/sanskrit
  licence: CC BY 4.0
  note: 'The plot follows Somadeva''s text: after hearing the great tale from Kāṇabhūti in the Vindhya forest, Guṇāḍhya writes it in the language of the ghosts, in his own blood, seven lakhs of verses in seven years; King Sātavāhana scorns it; Guṇāḍhya reads six of the seven tales leaf by leaf to the animals and burns them; the king, hearing of it from hunters, comes, asks for the tale, and takes the last lakh, the life of Naravāhanadatta. The quoted lines are Somadeva''s own words; the rest is new Sanskrit in the present tense. The last sentence, about ghosts who come late, is this course''s own story, not Somadeva''s.'

id: tale.leaf-4
template: tale
title:
  en: The dull pupil
  hi: मन्द शिष्य
title_sa: पाणिनिकथा
minutes: 7
review: scholar_ok
sources:
- title: Kathāsaritsāgara, taraṅga 4 (Digital Corpus of Sanskrit file KSS, 1, 4), the story retold in new, simple sentences with three real half-verses quoted
  url: https://github.com/OliverHellwig/sanskrit
  licence: CC BY 4.0
  note: 'The plot follows Somadeva''s text, told by Vararuci: in Varṣa''s school there was a dull pupil, Pāṇini; he went to the Himālaya, pleased Śiva with austerity and received a new grammar, the mouth of all knowledge; he came back and defeated Vararuci in debate. The three quoted lines are Somadeva''s own words; the rest is new Sanskrit in the present tense.'

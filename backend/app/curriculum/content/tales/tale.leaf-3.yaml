id: tale.leaf-3
template: tale
title:
  en: The boy who heard once
  hi: एक बार सुनने वाला बालक
title_sa: श्रुतधरकथा
minutes: 7
review: engine_ok
sources:
- title: Kathāsaritsāgara, taraṅga 2 (Digital Corpus of Sanskrit file KSS, 1, 2), the story retold in new, simple sentences with two real verses quoted
  url: https://github.com/OliverHellwig/sanskrit
  licence: CC BY 4.0
  note: 'The plot follows Somadeva''s text: two scholars seek a pupil who holds what he hears once; they find a boy; a voice from the sky foretells his future; they take him to the teacher Varṣa. The two quoted verses are Somadeva''s own words; the rest is new Sanskrit in the present tense.'

id: tale.leaf-5
template: tale
title:
  en: The minister in the dark well
  hi: अन्धकूप का मन्त्री
title_sa: शकटालकथा
minutes: 7
review: engine_ok
sources:
- title: Kathāsaritsāgara, taraṅga 5 (Digital Corpus of Sanskrit file KSS, 1, 5), the story retold in new, simple sentences with three real half-verses quoted
  url: https://github.com/OliverHellwig/sanskrit
  licence: CC BY 4.0
  note: 'The plot follows Somadeva''s text, told by Vararuci: the proud King Yoganandā has his minister Śakaṭāla in a blind well; Vararuci rescues him; the king sees a hand with five fingers in the Gaṅgā and Vararuci answers it with two fingers; Śakaṭāla resolves to bend like a reed and wait. The quoted lines are Somadeva''s own words; the rest is new Sanskrit in the present tense.'

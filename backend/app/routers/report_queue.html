<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sanskritam · Safety review</title>
<style>body{font:16px/1.6 system-ui;color:#30271f;background:#fff8ee;margin:0}main{max-width:920px;margin:auto;padding:28px}input,select,button,textarea{font:inherit;padding:10px;margin:6px 0;max-width:100%;box-sizing:border-box}article{border:1px solid #c8b9a8;padding:18px;margin:18px 0;background:white}pre{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%}button{cursor:pointer}</style>
<main><h1>Sanskritam safety review</h1><p>Vedic Valor · Monitored contact: sanskritam@vedicvalor.com</p>
<p>Review new reports daily. Prioritise child safety, threats and private information. Record the action taken before closing each report. The access token stays in this tab's memory.</p>
<label>Administrator token <input id="token" type="password" autocomplete="off"></label>
<select id="state"><option>open</option><option>reviewing</option><option>actioned</option><option>dismissed</option><option>all</option></select>
<button id="load">Load reports</button><p id="message" role="status"></p><section id="reports"></section></main>
<script>
const $=id=>document.getElementById(id);
async function api(path, options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Admin-Token':$('token').value},cache:'no-store'});if(!r.ok)throw new Error('Request failed ('+r.status+'). Check access and retry.');return r.json();}
async function load(){try{const data=await api('/admin/reports?limit=200&status='+$('state').value);$('reports').replaceChildren();$('message').textContent=data.count+' reports loaded (up to 200).';for(const row of data.reports){const article=document.createElement('article');const heading=document.createElement('h2');heading.textContent='#'+row.id+' · '+row.surface+' · '+row.status;article.append(heading);for(const key of ['created_at','question','answer','reason','review_notes','reviewed_by']){const p=document.createElement('pre');p.textContent=key+': '+(row[key]||'');article.append(p);}const notes=document.createElement('textarea');notes.placeholder='Decision, action taken, and follow-up';notes.value=row.review_notes||'';article.append(notes);const label=document.createElement('label');const block=document.createElement('input');block.type='checkbox';label.append(block,document.createTextNode(' Withdraw this exact answer from Ask/Talk'));article.append(label);const kind=document.createElement('select');for(const v of ['','fact','word','route']){const opt=document.createElement('option');opt.value=v;opt.textContent=v||'No card withdrawal';kind.append(opt);}const id=document.createElement('input');id.placeholder='Card ID to withdraw (optional)';article.append(kind,id);for(const status of ['reviewing','actioned','dismissed']){const button=document.createElement('button');button.textContent=status;button.onclick=async()=>{try{await api('/admin/reports/'+row.id,{method:'PUT',body:JSON.stringify({status,notes:notes.value,block_answer:block.checked,withdraw_kind:kind.value,withdraw_id:id.value})});await load();}catch(e){$('message').textContent=e.message;}};article.append(button);}$('reports').append(article);}}catch(e){$('message').textContent=e.message;}}
$('load').onclick=load;
</script></html>

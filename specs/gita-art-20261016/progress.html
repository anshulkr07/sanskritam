function render(){const selected=Number(chapter.value);const grid=document.getElementById('grid');grid.replaceChildren();for(const j of jobs.filter(j=>j.chapter===selected)){const article=document.createElement('article'),state=saved.get(j.key);if(state){const image=document.createElement('img');image.src='/thumb/'+j.key+'.webp';image.alt='Illustration for '+j.source_ref;image.loading='lazy';const full=document.createElement('a');full.href=readingImages[j.key]||('/master/'+j.key+'.png');full.target='_blank';full.rel='noopener';full.title='Open tablet reading image';full.append(image);article.append(full)}else{const empty=document.createElement('div');empty.className='pending';empty.textContent='Pending';article.append(empty)}const details=document.createElement('details');const title=document.createElement('summary');title.textContent=j.source_ref;details.append(title);const meaning=document.createElement('p');meaning.textContent=j.source_translation_en;details.append(meaning);article.append(details);const status=document.createElement('div');status.className='state';status.textContent=!state?'Not generated':state.published?'Verified on R2':state.reviewed?'Reviewed':'Generated · awaiting review';article.append(status);grid.append(article)}}
async function refresh(){try{const r=await fetch('/status',{cache:'no-store'});const data=await r.json();saved=new Map(data.deliveries.map(d=>[d.key,d]));document.getElementById('counts').textContent=data.generated+' / 700 generated · '+data.reviewed+' reviewed · '+data.published+' published';render()}catch{document.getElementById('counts').textContent='Progress service unavailable; completed files remain saved.'}}
chapter.onchange=render;fetch('/jobs').then(r=>r.json()).then(data=>{jobs=data;refresh()});setInterval(refresh,15000);
</script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhagavad Gita · Artwork production</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff8ee;color:#3b2e25;font:15px system-ui,sans-serif}header{padding:24px 28px;border-bottom:1px solid #dfcfb5}h1{font-size:24px;font-weight:500;margin:0 0 8px}#counts{color:#725e4b}main{max-width:1320px;margin:auto;padding:24px}label{display:flex;align-items:center;gap:12px;margin-bottom:20px}select{padding:8px;font:inherit;background:#fffdf7;border:1px solid #d9c9ae}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}article{min-width:0}article img{width:100%;aspect-ratio:1;object-fit:contain;background:#efe5d5}article .pending{aspect-ratio:1;display:grid;place-items:center;background:#efe5d5;color:#7a6a5c}summary{padding:8px 0;cursor:pointer}article p{font-size:13px;line-height:1.6;margin:6px 0}.ref{font-weight:500}.state{font-size:12px;color:#7a6a5c}</style>
<header><h1>Bhagavad Gita · Verse illustrations</h1><div id="counts">Reading saved production state…</div></header><main><label>Chapter<select id="chapter"></select></label><section id="grid" aria-label="Verse artwork"></section></main>
<script>
let jobs=[],saved=new Map();const chapter=document.getElementById('chapter');for(let n=1;n<=18;n++){const o=document.createElement('option');o.value=n;o.textContent='Chapter '+n;chapter.append(o)}
function render(){const selected=Number(chapter.value);const grid=document.getElementById('grid');grid.replaceChildren();for(const j of jobs.filter(j=>j.chapter===selected)){const article=document.createElement('article'),state=saved.get(j.key);if(state){const image=document.createElement('img');image.src='/thumb/'+j.key+'.webp';image.alt='Illustration for '+j.source_ref;image.loading='lazy';const full=document.createElement('a');full.href='/master/'+j.key+'.png';full.target='_blank';full.rel='noopener';full.title='Open full-resolution master';full.append(image);article.append(full)}else{const empty=document.createElement('div');empty.className='pending';empty.textContent='Pending';article.append(empty)}const details=document.createElement('details');const title=document.createElement('summary');title.textContent=j.source_ref;details.append(title);const meaning=document.createElement('p');meaning.textContent=j.source_translation_en;details.append(meaning);article.append(details);const status=document.createElement('div');status.className='state';status.textContent=!state?'Not generated':state.published?'Verified on R2':state.reviewed?'Reviewed':'Generated · awaiting review';article.append(status);grid.append(article)}}
async function refresh(){try{const r=await fetch('/status',{cache:'no-store'});const data=await r.json();saved=new Map(data.deliveries.map(d=>[d.key,d]));document.getElementById('counts').textContent=data.generated+' / 700 generated · '+data.reviewed+' reviewed · '+data.published+' published';render()}catch{document.getElementById('counts').textContent='Progress service unavailable; completed files remain saved.'}}
chapter.onchange=render;fetch('/jobs').then(r=>r.json()).then(data=>{jobs=data;refresh()});setInterval(refresh,15000);
</script></html>

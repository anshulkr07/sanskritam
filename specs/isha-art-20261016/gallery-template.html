<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Īśopaniṣad · Illustrated reader</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0e5;color:#3b2e25;font-family:system-ui,sans-serif}header{padding:22px 28px;border-bottom:1px solid #d9c9ae}h1{font-family:'Tiro Devanagari Sanskrit',serif;font-size:28px;font-weight:400;margin:0}header p{margin:5px 0 0;font-size:13px;color:#7a6a5c}.layout{display:grid;grid-template-columns:minmax(320px,1fr) minmax(340px,1fr);gap:28px;padding:28px;max-width:1360px;margin:auto}.viewer{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;font-size:13px}.controls label{display:flex;gap:6px;align-items:center}button,select,input{font:inherit}button,select{min-height:40px;padding:7px 12px;background:#fffdf7;border:1px solid #d9c9ae;color:#3b2e25;border-radius:0;cursor:pointer}input[type=range]{width:100px;accent-color:#b23d10}.page{--paper:#fffdf7;--ink:#3b2e25;--soft:#7a6a5c;position:relative;isolation:isolate;width:100%;max-width:393px;min-height:700px;background:var(--paper);color:var(--ink);padding:32px 16px;text-align:center;display:flex;align-items:center;justify-content:center;box-shadow:2px 3px 0 #d9c9ae;overflow:hidden}.page.landscape{max-width:720px;min-height:390px}.page>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.48;z-index:-1}.text{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}.ref{font-size:12px;color:var(--soft)}.sa{font-family:'Tiro Devanagari Sanskrit',serif;font-size:22px;line-height:39px;width:100%;overflow-wrap:break-word}.sa p{margin:0}.roman{font-size:14px;font-style:italic;color:var(--soft)}.rule{width:48px;height:2px;background:#e85b25;margin:8px}.meaning{font-size:16px;line-height:24px}.text p{margin:0}.learn{font-size:14px;color:var(--soft);padding:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:start}.thumb{padding:0;border:2px solid transparent;background:transparent;text-align:left;min-width:0}.thumb[aria-pressed=true]{border-color:#b23d10}.thumb img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.thumb span{display:block;font-size:12px;padding:7px}.download{font-size:13px;color:#a43d1b}.stats{font-size:12px;color:#7a6a5c} @media(max-width:850px){.layout{grid-template-columns:1fr;padding:18px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.page.landscape{min-height:390px}} @media(max-width:360px){header{padding:16px}.layout{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<header><h1 lang="sa">ईशोपनिषद्</h1><p>18 verses · One master painting per verse · Phone and tablet editions</p></header>
<main class="layout"><section class="viewer" aria-label="Reader preview">
<div class="controls"><label>Verse <select id="verse"></select></label><label>Theme <select id="theme"><option value="light">Light</option><option value="sepia">Sepia</option><option value="dark">Dark</option></select></label><button id="orientation">Landscape</button></div>
<div class="controls"><label><input type="checkbox" id="illustrated" checked>Illustration</label><label>Opacity <input id="opacity" type="range" min="0" max="100" value="48"><output id="opacity-value">48%</output></label><label><input type="checkbox" id="show-roman" checked>Roman</label></div>
<article class="page" id="page"><img id="painting" alt=""><div class="text"><div class="ref" id="ref"></div><div class="sa" id="sanskrit" lang="sa"></div><p class="roman" id="roman"></p><div class="rule"></div><p class="meaning" id="meaning"></p><div class="learn">Learn</div></div></article>
<a id="master" class="download" target="_blank" rel="noopener">View original master</a><div class="stats" id="stats"></div>
</section><section class="grid" id="grid" aria-label="All 18 verse illustrations"></section></main>
<script type="application/json" id="source">__SOURCE__</script><script type="application/json" id="assets">__ASSETS__</script>
<script>
const source=JSON.parse(document.getElementById('source').textContent),assets=JSON.parse(document.getElementById('assets').textContent);const byId=id=>document.getElementById(id);let selected=0;
source.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=i+1;byId('verse').append(o);const b=document.createElement('button');b.className='thumb';b.setAttribute('aria-label',v.source_ref);b.innerHTML='<img loading="lazy" src="'+assets[i].phone.uri+'" alt=""><span>Verse '+(i+1)+'</span>';b.onclick=()=>{selected=i;byId('verse').value=i;render()};byId('grid').append(b)});
function render(){const v=source[selected],art=assets[selected];byId('painting').src=art.tablet.uri;byId('painting').hidden=!byId('illustrated').checked;byId('painting').style.opacity=byId('opacity').value/100;byId('opacity-value').value=byId('opacity').value+'%';byId('ref').textContent=v.source_ref;byId('sanskrit').replaceChildren(...v.devanagari.split(/(?<=[।॥])/).map(s=>s.trim()).filter(Boolean).map(s=>{const p=document.createElement('p');p.textContent=s;return p}));byId('roman').textContent=v.iast;byId('roman').hidden=!byId('show-roman').checked;byId('meaning').textContent=v.translation_en;byId('master').href=art.masterUrl;byId('stats').textContent='Phone: '+Math.round(art.phone.bytes/1000)+' KB · Tablet: '+Math.round(art.tablet.bytes/1000)+' KB · Master: '+art.masterDimensions.join(' × ');const themes={light:['#fffdf7','#3b2e25','#7a6a5c'],sepia:['#f1e3c6','#4a3a28','#6b5842'],dark:['#1b1714','#ede3d3','#a89b8a']};const t=themes[byId('theme').value];['--paper','--ink','--soft'].forEach((k,i)=>byId('page').style.setProperty(k,t[i]));[...byId('grid').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===selected)));}
byId('verse').onchange=()=>{selected=Number(byId('verse').value);render()};['theme','illustrated','opacity','show-roman'].forEach(id=>byId(id).addEventListener('input',render));byId('orientation').onclick=()=>{byId('page').classList.toggle('landscape');byId('orientation').textContent=byId('page').classList.contains('landscape')?'Portrait':'Landscape'};render();
</script></body></html>

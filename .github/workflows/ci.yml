name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The recite-audio tests encode and decode real recordings through
      # ffmpeg (services/recite_audio.py, audio_meta.py). The runner image
      # does not ship it.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run tests
        run: python -m pytest -q --tb=short

  typecheck:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      # The check-*.mjs scripts are the regression net for bugs that typecheck
      # cannot see: check-parva's guard on `page` derefs exists because an
      # unguarded one black-screened the app on 2026-10-12. They were only ever
      # run by hand, so a regression could ship; run every one here.
      - name: Repo checks
        run: |
          for f in scripts/check-*.mjs scripts/check-*.cjs; do
            echo "== $f"
            node "$f"
          done
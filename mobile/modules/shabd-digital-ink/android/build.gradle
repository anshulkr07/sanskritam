plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'shabd.digitalink'
version = '0.1.0'

android {
  namespace "expo.modules.shabddigitalink"

  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // On-device Digital Ink recognition (strokes in, text out, fully offline
  // once the language model is downloaded).
  //
  // 19.0.0 (2025-08-29) "updated Digital Ink Recognition SDK to support 16 KB
  // page sizes". 16.1.0 (2021) shipped a libdigitalink.so aligned to 4 KB
  // pages, which Google Play rejects for apps targeting Android 15+ (this app
  // targets SDK 36), and predates the 17.0.1 fix for the API-31 runtime
  // exception. No API change for our call sites (DigitalInkRecognition,
  // DigitalInkRecognitionModel[Identifier], Ink builder — all unchanged per
  // https://developers.google.com/ml-kit/vision/digital-ink-recognition/android).
  implementation 'com.google.mlkit:digital-ink-recognition:19.0.0'
  // MUST stay: the digital-ink library transitively pulls an old
  // androidx.work:work-runtime whose ForceStopRunnable builds a PendingIntent
  // with no mutability flag. On Android 12+ (targetSdk 31+) that throws at
  // app start and kills the process before any UI renders ("Sanskritam keeps
  // stopping", 2026-09-15). Nothing else in the app requests work-runtime at
  // this version, so pinning >= 2.7.0 here wins conflict resolution (highest
  // version) and fixes model download + startup with no API change for ML Kit
  // callers.
  implementation 'androidx.work:work-runtime:2.9.0'
}
